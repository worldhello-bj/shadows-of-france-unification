 sofzh_chart_summary_tt:0 "§Y十二种细分意识形态§!\n自由共和主义：[?sofzh_chart_liberal|1]%\n保守共和主义：[?sofzh_chart_conservative|1]%\n社会共和主义：[?sofzh_chart_social|1]%\n革命社会主义：[?sofzh_chart_revolutionary|1]%\n先锋社会主义：[?sofzh_chart_vanguard|1]%\n自由社会主义：[?sofzh_chart_communal|1]%\n法西斯主义：[?sofzh_chart_fascist|1]%\n纳粹主义：[?sofzh_chart_national_socialist|1]%\n法团主义：[?sofzh_chart_corporatist|1]%\n君主主义：[?sofzh_chart_monarchist|1]%\n威权主义：[?sofzh_chart_authoritarian|1]%\n地方自治主义：[?sofzh_chart_regionalist|1]%\n\n按各党当前领袖的细分路线显示原有党派支持率。无可识别领袖时采用该大类默认路线。未采用的路线为0%，不平均分摊票数。\n◆ 表示执政路线。扇区精度为1%，图例保留一位小数。"
