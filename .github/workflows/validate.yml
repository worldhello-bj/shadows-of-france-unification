name: Validate mod and build candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate.py --output dist/validation.json
      - run: python tools/package.py
      - uses: actions/upload-artifact@v5
        with:
          name: shadows-of-france-candidate
          path: dist/
          retention-days: 14
