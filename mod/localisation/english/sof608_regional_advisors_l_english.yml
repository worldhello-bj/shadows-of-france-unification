l_english:
 sof608_advisor_prs:0 "Léon Blum"
 sof608_advisor_prs_desc:0 "巴黎出生的律师、作家与SFIO领袖。布鲁姆将社会主义目标、议会民主和劳动立法联系起来，依靠议会党团与工人组织推动人民阵线合作。他在1936年6月组成政府，成为社会改革的核心人物。"
 sof608_advisor_prs_trait:0 "Parliamentary Socialist"
 sof608_advisor_prs_trait_desc:0 "巴黎出生的律师、作家与SFIO领袖。布鲁姆将社会主义目标、议会民主和劳动立法联系起来，依靠议会党团与工人组织推动人民阵线合作。他在1936年6月组成政府，成为社会改革的核心人物。"
 sof608_advisor_ajc:0 "Adolphe Landry"
 sof608_advisor_ajc_desc:0 "生于阿雅克肖的经济学家、人口学家和科西嘉议员，长期担任卡尔维市长。朗德里关注人口变化、家庭扶助与社会立法，把学术研究和岛内的市政、议会经验结合起来，为科西嘉的人口与公共服务政策提供方向。"
 sof608_advisor_ajc_trait:0 "Population and Family Policy"
 sof608_advisor_ajc_trait_desc:0 "生于阿雅克肖的经济学家、人口学家和科西嘉议员，长期担任卡尔维市长。朗德里关注人口变化、家庭扶助与社会立法，把学术研究和岛内的市政、议会经验结合起来，为科西嘉的人口与公共服务政策提供方向。"
 sof608_advisor_ren:0 "François Château"
 sof608_advisor_ren_desc:0 "出身建筑与公共工程行业，曾主持雷恩市政中的工程事务，1935年10月接任市长。沙托熟悉承包、道路和公共建设的实际组织，能够把地方企业、预算与市政部门连接起来。"
 sof608_advisor_ren_trait:0 "Public Works Organiser"
 sof608_advisor_ren_trait_desc:0 "出身建筑与公共工程行业，曾主持雷恩市政中的工程事务，1935年10月接任市长。沙托熟悉承包、道路和公共建设的实际组织，能够把地方企业、预算与市政部门连接起来。"
 sof608_advisor_lil:0 "Jean-Baptiste Lebas"
 sof608_advisor_lil_desc:0 "鲁贝市长、北部省SFIO的重要人物，长期扎根纺织工业城市和工人组织。1936年出任劳动部长，参与推动四十小时工作周、带薪休假和集体合同立法。其政治力量来自地方行政与劳工运动的长期联系。"
 sof608_advisor_lil_trait:0 "Labour Leader of Roubaix"
 sof608_advisor_lil_trait_desc:0 "鲁贝市长、北部省SFIO的重要人物，长期扎根纺织工业城市和工人组织。1936年出任劳动部长，参与推动四十小时工作周、带薪休假和集体合同立法。其政治力量来自地方行政与劳工运动的长期联系。"
 sof608_advisor_mrs:0 "Jean Cristofol"
 sof608_advisor_mrs_desc:0 "马赛共产党地方活动家，1936年当选罗讷河口省议员。克里斯托福尔依靠城市工人和基层组织参与人民阵线运动，将港口城市的就业、生活保障和公共服务诉求带入议会。"
 sof608_advisor_mrs_trait:0 "Port-City Labour Organiser"
 sof608_advisor_mrs_trait_desc:0 "马赛共产党地方活动家，1936年当选罗讷河口省议员。克里斯托福尔依靠城市工人和基层组织参与人民阵线运动，将港口城市的就业、生活保障和公共服务诉求带入议会。"
 sof608_advisor_met:0 "Louis Marin"
 sof608_advisor_met_desc:0 "长期代表默尔特-摩泽尔省的议员、共和联盟领袖，与南锡及洛林政治联系深厚。马兰强调国家独立、议会右翼联合和国防准备，凭借地方名流与议会网络协调边境地区的防务议程。"
 sof608_advisor_met_trait:0 "Lorraine Defence Advocate"
 sof608_advisor_met_trait_desc:0 "长期代表默尔特-摩泽尔省的议员、共和联盟领袖，与南锡及洛林政治联系深厚。马兰强调国家独立、议会右翼联合和国防准备，凭借地方名流与议会网络协调边境地区的防务议程。"
 sof608_advisor_str:0 "Charles Hueber"
 sof608_advisor_str_desc:0 "工人运动出身，1929至1935年任斯特拉斯堡市长，与法国共产党决裂后参加阿尔萨斯的异议共产主义和自治派政治。1936年再度进入议会，结合地方语言、区域权利和工人诉求组织支持。"
 sof608_advisor_str_trait:0 "Alsatian Labour Autonomist"
 sof608_advisor_str_trait_desc:0 "工人运动出身，1929至1935年任斯特拉斯堡市长，与法国共产党决裂后参加阿尔萨斯的异议共产主义和自治派政治。1936年再度进入议会，结合地方语言、区域权利和工人诉求组织支持。"
 sof608_advisor_rou:0 "Léon Meyer"
 sof608_advisor_rou_desc:0 "勒阿弗尔的激进派市长和议员，曾任商船部长。迈耶的政治经验紧密联系港口、市政与海运，在诺曼底能够把商船运输、造船企业和城市公共服务的需求纳入同一项经济政策。"
 sof608_advisor_rou_trait:0 "Le Havre Maritime Statesman"
 sof608_advisor_rou_trait_desc:0 "勒阿弗尔的激进派市长和议员，曾任商船部长。迈耶的政治经验紧密联系港口、市政与海运，在诺曼底能够把商船运输、造船企业和城市公共服务的需求纳入同一项经济政策。"
 sof608_advisor_lyo:0 "Édouard Herriot"
 sof608_advisor_lyo_desc:0 "里昂长期市长、激进党的重要领袖和前政府首脑。赫里欧主张世俗教育、议会共和国和市政建设，凭借里昂的行政经验与全国政治声望，推动公共投资并协调工商界和地方公共机构。"
 sof608_advisor_lyo_trait:0 "Municipal Republican of Lyon"
 sof608_advisor_lyo_trait_desc:0 "里昂长期市长、激进党的重要领袖和前政府首脑。赫里欧主张世俗教育、议会共和国和市政建设，凭借里昂的行政经验与全国政治声望，推动公共投资并协调工商界和地方公共机构。"
 sof608_advisor_brd:0 "Georges Mandel"
 sof608_advisor_brd_desc:0 "吉伦特省议员，1934至1936年主持邮政、电报与电话部门。曼德尔以行政效率、通信建设和坚定的国家防务立场著称，能够把波尔多及其腹地的线路、无线电与政府协调工作连接起来。"
 sof608_advisor_brd_trait:0 "Communications Moderniser"
 sof608_advisor_brd_trait_desc:0 "吉伦特省议员，1934至1936年主持邮政、电报与电话部门。曼德尔以行政效率、通信建设和坚定的国家防务立场著称，能够把波尔多及其腹地的线路、无线电与政府协调工作连接起来。"
 sof608_advisor_tou:0 "Vincent Auriol"
 sof608_advisor_tou_desc:0 "上加龙省SFIO议员、米雷市长，长期专注财政与经济问题。1936年6月担任布鲁姆政府财政部长，参与人民阵线的财政和货币政策；其地方政治基础扎根图卢兹周边的社会主义网络。"
 sof608_advisor_tou_trait:0 "Southwestern Fiscal Reformer"
 sof608_advisor_tou_trait_desc:0 "上加龙省SFIO议员、米雷市长，长期专注财政与经济问题。1936年6月担任布鲁姆政府财政部长，参与人民阵线的财政和货币政策；其地方政治基础扎根图卢兹周边的社会主义网络。"
 sof608_advisor_nan:0 "Léopold Cassegrain"
 sof608_advisor_nan_desc:0 "南特实业家、激进派政治人物，1929至1935年担任市长。离任后仍拥有地方工业与市政经验，熟悉企业、城市建设和地方财政之间的联系，可为卢瓦尔河下游的经济恢复提供实业界支持。"
 sof608_advisor_nan_trait:0 "Nantes Industrial Liaison"
 sof608_advisor_nan_trait_desc:0 "南特实业家、激进派政治人物，1929至1935年担任市长。离任后仍拥有地方工业与市政经验，熟悉企业、城市建设和地方财政之间的联系，可为卢瓦尔河下游的经济恢复提供实业界支持。"
 sof608_advisor_cfr:0 "Alexandre Varenne"
 sof608_advisor_cfr_desc:0 "多姆山省政治家和《山岳报》创办者，长期参与独立社会主义与共和政治。1936年议会选举失利后，他仍拥有报业影响和地方联系，能够围绕奥弗涅的公共议题组织舆论与社会支持。"
 sof608_advisor_cfr_trait:0 "Auvergne Republican Publisher"
 sof608_advisor_cfr_trait_desc:0 "多姆山省政治家和《山岳报》创办者，长期参与独立社会主义与共和政治。1936年议会选举失利后，他仍拥有报业影响和地方联系，能够围绕奥弗涅的公共议题组织舆论与社会支持。"
 sof608_advisor_dij:0 "Paul Faure"
 sof608_advisor_dij_desc:0 "SFIO总书记，与索恩-卢瓦尔省及勒克勒佐的政治联系深厚，曾担任当地市长。福尔依靠党组织和工人选区巩固社会主义阵营，重视社会改革，并在党内代表具有影响的和平主义倾向。"
 sof608_advisor_dij_trait:0 "Burgundian Socialist Organiser"
 sof608_advisor_dij_trait_desc:0 "SFIO总书记，与索恩-卢瓦尔省及勒克勒佐的政治联系深厚，曾担任当地市长。福尔依靠党组织和工人选区巩固社会主义阵营，重视社会改革，并在党内代表具有影响的和平主义倾向。"
 sof608_advisor_bes:0 "Jules Jeanneney"
 sof608_advisor_bes_desc:0 "出生于贝桑松的律师和上索恩省参议员，1932年起担任参议院议长。让纳内重视议会程序、行政责任与国家制度的连续性，其法律和地方行政经验有助于建立稳定、可执行的政府秩序。"
 sof608_advisor_bes_trait:0 "Senatorial Institutionalist"
 sof608_advisor_bes_trait_desc:0 "出生于贝桑松的律师和上索恩省参议员，1932年起担任参议院议长。让纳内重视议会程序、行政责任与国家制度的连续性，其法律和地方行政经验有助于建立稳定、可执行的政府秩序。"
 sof608_advisor_trs:0 "Camille Chautemps"
 sof608_advisor_trs_desc:0 "曾任图尔市长和安德尔-卢瓦尔省议员，1934年转任卢瓦尔-谢尔省参议员。1936年初担任公共工程部长，长期的地方行政和政府经历，使其熟悉铁路、公共建设与跨地区财政协调。"
 sof608_advisor_trs_trait:0 "Touraine Transport Coordinator"
 sof608_advisor_trs_trait_desc:0 "曾任图尔市长和安德尔-卢瓦尔省议员，1934年转任卢瓦尔-谢尔省参议员。1936年初担任公共工程部长，长期的地方行政和政府经历，使其熟悉铁路、公共建设与跨地区财政协调。"
 sof608_advisor_ami:0 "Max Lejeune"
 sof608_advisor_ami_desc:0 "教师出身的SFIO活动家，1936年5月在索姆省阿布维尔选区当选议员。勒热讷代表当地新一代社会主义政治力量，依靠教育界、青年组织和工人选民推动公共教育、就业与社会改革。"
 sof608_advisor_ami_trait:0 "Young Socialist of the Somme"
 sof608_advisor_ami_trait_desc:0 "教师出身的SFIO活动家，1936年5月在索姆省阿布维尔选区当选议员。勒热讷代表当地新一代社会主义政治力量，依靠教育界、青年组织和工人选民推动公共教育、就业与社会改革。"
 sof608_advisor_chl:0 "René Plard"
 sof608_advisor_chl_desc:0 "邮政工人和工会运动出身，曾参加共产党，后转入独立左翼政治。1935年当选特鲁瓦市长，1936年继续担任奥布省议员，将工人组织、城市公共服务和地方民生建设联系起来。"
 sof608_advisor_chl_trait:0 "Workers’ Mayor of Troyes"
 sof608_advisor_chl_trait_desc:0 "邮政工人和工会运动出身，曾参加共产党，后转入独立左翼政治。1935年当选特鲁瓦市长，1936年继续担任奥布省议员，将工人组织、城市公共服务和地方民生建设联系起来。"
 sof608_advisor_mop:0 "Édouard Barthe"
 sof608_advisor_mop_desc:0 "埃罗省议员，长期投身葡萄酒生产、市场和种植者利益问题。1933年离开SFIO后参加新社会主义阵营，1936年属于社会主义共和联盟；其政治专长在于组织葡萄种植者、合作社和农业议会网络。"
 sof608_advisor_mop_trait:0 "Advocate of Winegrowers"
 sof608_advisor_mop_trait_desc:0 "埃罗省议员，长期投身葡萄酒生产、市场和种植者利益问题。1933年离开SFIO后参加新社会主义阵营，1936年属于社会主义共和联盟；其政治专长在于组织葡萄种植者、合作社和农业议会网络。"
 sof608_advisor_poi:0 "Léonce Vieljeux"
 sof608_advisor_poi_desc:0 "航运企业经营者、后备军官，1930年起任拉罗谢尔市长。维尔热的事业与德尔马—维尔热航运、拉帕利斯港及修造船业紧密相连，可凭借企业网络和市政经验组织大西洋沿岸的运输与港口建设。"
 sof608_advisor_poi_trait:0 "La Rochelle Shipping Industrialist"
 sof608_advisor_poi_trait_desc:0 "航运企业经营者、后备军官，1930年起任拉罗谢尔市长。维尔热的事业与德尔马—维尔热航运、拉帕利斯港及修造船业紧密相连，可凭借企业网络和市政经验组织大西洋沿岸的运输与港口建设。"
