 sof_tp_seek_settlement:0 "Seek Recognition from [FROM.GetName]"
 sof_tp_seek_settlement_desc:0 "Ask a rival to recognise our national coordinating role without demanding the immediate surrender of its government. Recognition can settle the contest for leadership while leaving integration to later negotiations."
 sof_tp_seek_settlement_tt:0 "In phase I, requires a major regional government at peace, at least 150 bloc-controlled French states, no pending negotiation and 50 political power. The target must be an independent, uncapitulated French government at peace outside our faction, without prior recognition or a recognition cooldown. Costs 50 political power. Acceptance grants recognition, 10 legitimacy and 5 trust, without annexation or faction membership. Refusal imposes a 180-day cooldown.\nMajor regions first need the diplomatic office from [Root.GetSofTpOfficeFocus]. Minor governments retain basic diplomacy."
 sof_tp.9.t:0 "Mutual Recognition Opens Negotiations"
 sof_tp.9.d:0 "[FROM.GetName] offers a way to settle the struggle for national leadership: recognise its coordinating role, retain our government, and negotiate integration later.\n\nHardliners fear giving our rival a victory before our disagreements are resolved. Others ask why the next argument must require a siege. The decision remains ours."
 sof_tp.9.a:0 "Recognise their role; retain our voice."
 sof_tp.9.b:0 "They cannot yet speak for France."
 sof_tp_form_bloc:0 "Form Our Own Compact"
 sof_tp_form_bloc_desc:0 "If no existing bloc represents our programme, we can present our own terms to France. Found a compact and invite neighbouring governments to join on agreed terms."
 sof_tp_form_bloc_tt:0 "完成外交路线末端的共同防御总纲后，花费50政治点建立阵营。须独立、未投降、处于和平且尚未结盟，并已取得地区扩张权限；换盟冷却为90日。同意识形态伙伴将通过各自的外交程序协商加入。"
 sof_tp_fulfil_aid:0 "Fund the Agreement"
 sof_tp_fulfil_aid_desc:0 "Pay the one-off resources specified in the signed agreement and begin the work. Cooperation has a deadline, pauses during war, and still requires the recipient’s separate consent to union after delivery."
 sof_tp_fulfil_aid_tt:0 "Requires a valid agreement with the selected government that has not yet been funded. Both sides must be independent, not capitulated and at peace. Industry: 75 Political Power/60 days; transition: 40 Political Power/90 days (the recipient immediately receives 40 Political Power); army training: 50 Political Power and 20 Army Experience/45 days. Costs are paid once. Progress advances on peaceful days and pauses during war. See the Terms page for benefits. Sign, deliver and then seek the recipient’s separate approval for final integration."
 sof_tp.10.t:0 "The Date Arrives, the Factory Does Not"
 sof_tp.10.d:0 "The regional delegates return with the papers from our earlier talks. The deadline has passed; the promised construction aid has not arrived. The missing factory raises a larger question: why trust the next document bearing our seal?\n\nOfficials offer explanations. At the next negotiation, credibility must be rebuilt through delivery."
 sof_tp.10.a:0 "The cost of default is on the record."
 sof_tp_challenge_rival:0 "Challenge [FROM.GetName]"
 sof_tp_challenge_rival_desc:0 "Invest in a military option to resolve the national rivalry while retaining diplomatic paths to recognition and cooperation. Once a war goal is obtained, the government separately decides whether to declare war."
 sof_tp_enforce_claim:0 "Enforce Our Claim on [FROM.GetName]"
 sof_tp_enforce_claim_desc:0 "The staff awaits the final order. This decision sends the armed forces to enforce the prepared war goal. Disagreements at the negotiating table will become real costs on the battlefield."
 sof_tp_industrial_aid_bonus:0 "Compact Industrial Assistance"
 sof_tp_challenge_rival_tt:0 "Phase I only. We must be independent, uncapitulated and at peace, with regional expansion and unification-war authorisation; red Marseille also needs its military focus authorisation. Both factions must consist of French-territory governments, with no foreign guarantees. The peaceful legal French target must own only French states and be adjacent, or have a controlled naval base while we have completed sea preparations. Costs 75 political power and 5 trust; grants a 180-day annexation war goal. Choose the moment of war through diplomacy."
 sof_tp_enforce_claim_tt:0 "Immediately declares war using our existing annexation goal. Both factions must consist of French-territory governments, with no foreign guarantees. We must be independent, uncapitulated and at peace, with regional expansion and unification-war authorisation; red Marseille needs its military focus authorisation. The peaceful legal French target must own only French states and meet adjacency or sea-preparation requirements."
