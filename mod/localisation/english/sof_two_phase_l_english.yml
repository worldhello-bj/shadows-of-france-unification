 sof_tp_end_contract:0 "End agreement"
 sof_tp_choose_industry_terms_tt:0 "Selecting this offer is free, sends no proposal and leaves signed agreements unchanged. The recipient retains final approval and decides on integration after delivery. The provider pays 75 Political Power once. After 60 peaceful days, build 1 civilian factory in a recipient-controlled French state with a free slot; if no slot is available, grant one 25% industrial research bonus instead. Each recipient can obtain the industrial delivery reward once. Delivery grants both sides 10 Trust and the provider 5 Legitimacy; Lille’s Labour Coordination Bureau adds 5 Trust, and Bordeaux’s Port Credit Office adds 10 Reconstruction. Total agreement term: 180 peaceful days."
 sof_tp_choose_transition_terms_tt:0 "Selecting this offer is free, sends no proposal and leaves signed agreements unchanged. The recipient retains final approval and decides on integration after delivery. The provider pays 40 Political Power once, immediately transferring 40 Political Power to the recipient. After 90 peaceful days of administrative transition, both sides gain 8 Trust. The recipient retains its independent government and existing organisation. Total term: 180 peaceful days. Investment and delivery are separate; final integration requires separate approval within the approval window."
 sof_tp_choose_army_terms_tt:0 "Selecting this offer is free, sends no proposal and leaves signed agreements unchanged. The recipient retains final approval and decides on integration after delivery. The provider pays 50 Political Power and 20 Army Experience once. After 45 peaceful days, the recipient gains 10 Army Experience and 180 days of Joint Staff: Army Organisation +5%, Army Training Time −5%. The provider gains 5 Legitimacy. Both sides retain their actual divisions, equipment and commanders. Total term: 120 peaceful days."
 sof_tp_end_contract_tt:0 "The recipient may terminate its own active agreement. Both sides lose 5 Trust; the agreement slot is released and a 60-day cooldown begins. Political Power and Army Experience already spent are not refunded; delivered benefits are retained. Termination settles this agreement only, preserving existing diplomatic relations and independence and leaving other governments’ agreements in force."
 sof_tp_a3_final_approval_tt:0 "Requires a delivered, valid agreement and independent, uncapitulated parties at peace. The recipient must still attend our congress, own only fully controlled French states and be unaligned or allied. We need congress, a charter and no pending reply. Requests final approval for free; no second 50-PP proposal charge. Only their consent transfers the country and army and adds cores. Refusal preserves independence."
 sof_tp_a3_cost_final:0 "Free · consent"
 sof_tp_a3_cost_aid:0 "[Root.GetSofTpA3AidCost]"
 sof_tp_start_transport_project_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 60 PP and reserve 1,000 manpower once. After 45 peaceful days, the state gains one infrastructure level, manpower is returned, and we gain 15 reconstruction and 5 legitimacy. Requires infrastructure below level 5; once per state. War pauses work; losing the state interrupts it."
 sof_tp_a3_project_transport_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 60 PP and reserve 1,000 manpower once. After 45 peaceful days, the state gains one infrastructure level, manpower is returned, and we gain 15 reconstruction and 5 legitimacy. Requires infrastructure below level 5; once per state. War pauses work; losing the state interrupts it."
 sof_tp_start_industry_project_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 100 PP and reserve 1,500 manpower once. After 60 peaceful days, build one civilian factory, return the manpower, and gain 20 reconstruction and 5 legitimacy. Requires a free civilian-factory slot; once per state. War pauses work; losing the site or having no valid slot at completion triggers interruption settlement."
 sof_tp_a3_project_industry_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 100 PP and reserve 1,500 manpower once. After 60 peaceful days, build one civilian factory, return the manpower, and gain 20 reconstruction and 5 legitimacy. Requires a free civilian-factory slot; once per state. War pauses work; losing the site or having no valid slot at completion triggers interruption settlement."
 sof_tp_start_demobilisation_project_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 50 PP and commit 1,500 manpower once. After 30 peaceful days, gain 3 percentage points of stability and 12 reconstruction, lose 2 points of war support, and receive +10% infrastructure construction speed for 180 days. The manpower is not returned after completion, representing civilian employment; no existing divisions are disbanded. Once per state; war pauses work."
 sof_tp_a3_project_demobilisation_tt:0 "Requires our congress and charter, independence, no capitulation and peace. Only one domestic project can run at a time. A suitable fully controlled French state owned by us is selected automatically. Pay 50 PP and commit 1,500 manpower once. After 30 peaceful days, gain 3 percentage points of stability and 12 reconstruction, lose 2 points of war support, and receive +10% infrastructure construction speed for 180 days. The manpower is not returned after completion, representing civilian employment; no existing divisions are disbanded. Once per state; war pauses work."
 sof_tp_cancel_project_tt:0 "Cancel our current project: return all reserved manpower and half the political power (30 transport, 50 industry, 25 demobilisation). No buildings, stability, reconstruction or other completion rewards are granted. Automatic interruption after losing the site uses the same settlement. Capitulation interruption uses the same settlement. If the country has ceased to exist, the project clears without transferring refunds to the conqueror."
 sof_tp_joint_staff:0 "Joint Staff and Training Programme"
 sof_tp_joint_staff_desc:0 "Improve training and command coordination through shared manuals and staff liaison. During this time-limited cooperation, each government retains its own divisions, equipment and commanders."
 sof_tp_demobilised_workforce:0 "Resettled Construction Workforce"
 sof_tp_demobilised_workforce_desc:0 "Former recruitable manpower enters civilian construction, improving infrastructure building speed."
 sof_tp_contract_details_industry:0 "The provider pays 75 PP. After 60 peaceful days, we receive one civilian factory, or a 25% industry research bonus if no slot is free; industrial delivery is once per recipient. Both gain 10 trust; the provider gains 5 legitimacy. Total term: 180 peaceful days."
 sof_tp_contract_details_transition:0 "The provider pays 40 Political Power and we immediately receive 40 Political Power. After 90 peaceful days, both sides gain 8 Trust. We retain an independent government; final integration requires separate approval. Total term: 180 peaceful days."
 sof_tp_contract_details_army:0 "The provider pays 50 PP and 20 army experience. After 45 peaceful days, we gain 10 army experience and 180 days of +5% army organisation and −5% training time; the provider gains 5 legitimacy. No divisions, equipment or commanders transfer. Total term: 120 peaceful days."
 sof_tp_contract_accept_tt:0 "Signing opens the agreement; the provider funds implementation later, and final union requires a separate decision. Expiry before delivery costs the provider 15 trust and 10 legitimacy, and the recipient 10 trust. Recipient withdrawal costs each side 5 trust. Provider withdrawal costs it 10 trust and 5 legitimacy, and the recipient 5 trust. Paid costs are not refunded. Final refusal after delivery adds no penalty or clawback; new talks resume after 180 days."
 sof_tp_end_selected_contract:0 "End selected deal"
 sof_tp_end_selected_contract_tt:0 "Only an active agreement involving our government can be terminated. If we are the provider and select the recipient, we lose 10 Trust and 5 Legitimacy and the recipient loses 5 Trust. If we select ourselves as recipient, both sides lose 5 Trust. Release the recipient’s agreement slot and begin a 60-day cooldown. Political Power and Army Experience already spent are not refunded; delivered benefits remain, as do existing diplomatic relations and independence."
 sof_tp_a3_project_paused:0 "Paused: [Root.sof_tp_project_days_left|0]d · [Root.sof_tp_project_progress|0]%"
 sof_tp_a3_aid_cost_industry:0 "75 PP"
