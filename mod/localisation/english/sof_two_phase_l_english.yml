 sof_tp_popup_map_legend_peace:0 "Colours: congress, aid and integration (hover)"
 sof_tp_popup_map_legend_peace_tt:0 "Grey: other or not contacted; red: ally; rose: aid delivered; blue: attending our congress; ochre: aid awaiting delivery; green: our state or integrated territory. Colours follow the priority of actual diplomatic status; support is calculated separately."
 sof_tp_institution_office:0 "Diplomatic Coordination Office"
 sof_tp_institution_office_desc:0 "The focus [Root.GetSofTpOfficeFocus] establishes the office responsible for interregional negotiations. It enables formal targeted proposals in the council. Minor governments retain basic diplomacy."
 sof_tp_institution_congress:0 "National Congress Institution"
 sof_tp_institution_congress_desc:0 "The focus [Root.GetSofTpCongressFocus] provides the institution for an early national congress. The organiser can qualify through its own territorial strength or the strength of a genuinely established alliance."
 sof_tp_institution_constitution:0 "Constitutional Institution"
 sof_tp_institution_constitution_desc:0 "The matching direction of [Root.GetSofTpConstitutionFocus] makes the constitution permanent. The council may first adopt a provisional charter for 50 political power. The later focus cannot contradict that choice; an actual union treaty can replace its 100-state requirement."
 sof_tp_popup_map_legend_tt:0 "[Root.GetSofTpMapLegendTooltip]"
 sof_tp_popup_map_legend_war_tt:0 "Grey: centrist or unaligned; red: Revolutionary Compact; rose: Democratic Socialist Alliance; blue: Republican Order Compact; ochre: Authoritarian Renewal League; green: Nationalist League. Governments may revise faction relations through the appropriate diplomatic procedures."
