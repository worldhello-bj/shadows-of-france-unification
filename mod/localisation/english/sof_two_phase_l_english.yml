 sof_tp_a3_contract_status_tt:0 "Shows the selected government’s signed terms, status and partner. Total peaceful-day limits are 180 for industry/transition and 120 for training. Expiry before delivery costs the provider 15 trust and 10 legitimacy, and the recipient 10 trust. Expiry after delivery is unpenalised but ends the approval window. War pauses the clock; loss of independence or capitulation cancels without penalty. Paid costs are not refunded. The recipient retains delivered aid after a final refusal. Joining an incompatible other faction ends the agreement under the voluntary-withdrawal rules."
