l_english:
 sof_tp_campaign:0 "The Next Page of France"
 sof_tp_campaign_desc:0 "France’s regional governments are shaping a common future. Establish national political leadership in the first phase, then pursue unity through congress, cooperation agreements and reconstruction. Each government chooses whether to attend, sign and fulfil its commitments. After delivery, the recipient separately decides on final integration; refusal preserves peace and independence."
 sof_tp_bloc_0:0 "Unaligned"
 sof_tp_bloc_1:0 "Revolutionary Compact"
 sof_tp_bloc_2:0 "Democratic Socialist Alliance"
 sof_tp_bloc_3:0 "Republican Order Compact"
 sof_tp_bloc_4:0 "Authoritarian Renewal League"
 sof_tp_bloc_5:0 "Nationalist League"
 sof_tp_request_membership:0 "Apply to [FROM.GetName]"
 sof_tp_request_membership_desc:0 "Our delegates will propose common defence. The recipient must approve: shared sympathies are no substitute for consent."
 sof_tp_invite_congress:0 "Invite [FROM.GetName] to Congress"
 sof_tp_invite_congress_desc:0 "Let the delegates take their seats before the map is redrawn. Attendance opens reconstruction talks while each government retains its authority."
 sof_tp_offer_union:0 "Offer [FROM.GetName] a Union Treaty"
 sof_tp_offer_union_desc:0 "Offer [FROM.GetName] practical cooperation: workshops, administrative transition or joint training. Sign the agreement, deliver its commitments, then seek the recipient’s separate approval for final integration."
 sof_tp_press_claim:0 "Press Our Claim on [FROM.GetName]"
 sof_tp_press_claim_desc:0 "After negotiations fail, the hardliners call for military leverage. This prepares a conflict rather than declaring one. France will still inherit its aftermath."
 sof_tp_leave_bloc:0 "Reconsider Our Alignment"
 sof_tp_leave_bloc_desc:0 "Leave the old compact and choose partners suited to our new direction, or pursue the next stage of diplomacy independently."
 sof_tp_claim_victory:0 "Claim National Leadership"
 sof_tp_claim_victory_desc:0 "Once our rivals can no longer sustain an alternative national order, victory becomes more than a colour on the map. Allies and unfamiliar cities alike will ask how the new France is to be governed."
 sof_tp_open_congress:0 "Convene the Reconstruction Congress"
 sof_tp_open_congress_desc:0 "Turn victory into shared reconstruction. Regional representatives will negotiate budgets, administrative powers and military responsibilities, preparing the way for agreements, delivery and final integration."
 sof_tp_adopt_federal:0 "Adopt a Federal Settlement"
 sof_tp_adopt_federal_desc:0 "Regional delegates want the limits of common authority written down. A federal settlement exchanges a measure of central control for cooperation."
 sof_tp_adopt_central:0 "Adopt a Central Settlement"
 sof_tp_adopt_central_desc:0 "Treasury officials and officers ask for one chain of command and one set of accounts. Centralisation shortens coordination, while unsettling those asked to yield authority."
 sof_tp_fund_reconstruction:0 "Fund Reconstruction"
 sof_tp_fund_reconstruction_desc:0 "Goods wait on the platforms and workers at the factory gates. Reconstruction turns political capital into a peace that reaches beyond the newspapers."
 sof_tp_keep_promises:0 "Honour Regional Commitments"
 sof_tp_keep_promises_desc:0 "Honour the commitments signed with the regions, investing now to strengthen credibility and trust for future cooperation."
 sof_tp_break_promises:0 "Revoke Regional Concessions"
 sof_tp_break_promises_desc:0 "The centre can revoke its concessions and accelerate its programme. The delegates who signed will remember whether the powers they surrendered bought the safeguards they were promised."
 sof_tp_complete_reconstruction:0 "Conclude the Reconstruction Period"
 sof_tp_complete_reconstruction_desc:0 "Complete the temporary transition and put the state on a stable institutional footing. Entrust reconstruction gains to permanent institutions and continue repairing the damage left by war."
 sof_tp.1.t:0 "A Letter on Common Defence"
 sof_tp.1.d:0 "Delegates from [FROM.GetName] have applied to join our compact. The newspapers still disagree. Some welcome a common defence; others fear paying for decisions made in another city.\n\nThe secretary lays out the seals. We can admit a partner, or keep our distance."
 sof_tp.1.a:0 "Let the common cause come first."
 sof_tp.1.b:0 "We cannot sign at present."
 sof_tp.2.t:0 "A Seat Without a Signature"
 sof_tp.2.d:0 "[FROM.GetName] invites us to a national reconstruction congress. Its agenda covers powers, regional budgets and the future command of the armed forces. Our government retains its authority throughout the talks.\n\nAbsence makes a statement, but leaves the table to others. Attendance gives our conditions a voice."
 sof_tp.2.a:0 "Attend, with our conditions."
 sof_tp.2.b:0 "Our reservations remain unanswered."
 sof_tp.3.t:0 "The Last Page of the Treaty"
 sof_tp.3.d:0 "[FROM.GetName] has presented a union treaty. Its final page awaits a signature; the preceding clauses concern taxes, military command and the reach of the local voice.\n\nSigning accepts integration. A counteroffer keeps us in congress to negotiate safeguards and transition. Rejection ends this proposal. All three remain possible."
 sof_tp.3.a:0 "Sign the treaty and accept integration."
 sof_tp.3.b:0 "Counteroffer: safeguards before integration."
 sof_tp.3.c:0 "These terms are unacceptable."
 sof_tp.4.t:0 "Who Opens the Doors After Victory?"
 sof_tp.4.d:0 "Our rivals can no longer sustain an alternative national order. Our banner now carries the strongest claim to France. Yet speeches do not restore train services, and communiqués do not pay municipal wages.\n\nAllies bring old promises; newly acquired districts bring old doubts. We have won the right to propose a future. Now it must become everyday life."
 sof_tp.4.a:0 "Bring victory into the council chamber."
 sof_tp.5.t:0 "After the Seal Is Set"
 sof_tp.5.d:0 "The union treaty has been accepted. The delegates leave registers, ledgers and boxes of official papers rather than a conqueror’s celebration.\n\nThis transfer requires no bombardment of its own. Preserved working relationships are the practical gain of negotiation. The new centre must still show that the signature meant something."
 sof_tp.5.a:0 "Begin with the common accounts."
 sof_tp.6.t:0 "The Draft Comes Back"
 sof_tp.6.d:0 "The other government has declined our proposal and returned its objections. Both states remain at peace and retain their own governments.\n\nThe cabinet may revise the terms and continue negotiations, or separately decide to apply pressure. Our next diplomatic step remains our choice."
 sof_tp.6.a:0 "Record the disagreement; keep our options."
 sof_tp.7.t:0 "Ballots and Old Treaties"
 sof_tp.7.d:0 "A new political majority has taken office. The cabinet will review existing agreements alongside its programme, while supporters and partners await a clear direction.\n\nExisting compacts remain in force. We may maintain these relationships or formally choose new partners through faction decisions."
 sof_tp.7.a:0 "Take charge, then choose our direction."
 sof_tp.8.t:0 "The Word Provisional Is Struck Out"
 sof_tp.8.d:0 "The last transitional report reaches the desk. It lists functioning institutions, unresolved disputes and responsibilities handed to a permanent government.\n\nSome signed at the conference table; others accepted the new order after defeat. One flag cannot erase those memories. Reconstruction ends. The meaning of unity will be tested every day that follows."
 sof_tp.8.a:0 "Let our common life continue."
 sof_tp.2.d_PRS:0 "The Paris delegates carry union memoranda among their parliamentary papers. Workers must retain a voice after the fighting, yet the administrators insist that supply and public order cannot await an endless round of committee votes.\n\n[FROM.GetName] invites us to the national reconstruction congress. Attendance opens formal negotiations while we retain our independent government and final approval rights. Declining the invitation preserves peace."
 sof_tp.3.d_PRS:0 "The Paris delegates carry union memoranda among their parliamentary papers. Workers must retain a voice after the fighting, yet the administrators insist that supply and public order cannot await an endless round of committee votes.\n\n[FROM.GetName] now presents its union treaty. Acceptance integrates our country. We can instead retain our government during an administrative transition, or reject the draft."
 sof_tp.2.d_LIL:0 "Lille asks about coal and wages before flags. Workers want their protections recognised; employers need orders and transport; the municipality wants disputes settled without another emergency. Cooperation must keep the workshops running.\n\n[FROM.GetName] invites us to the national reconstruction congress. Attendance opens formal negotiations while we retain our independent government and final approval rights. Declining the invitation preserves peace."
 sof_tp.3.d_LIL:0 "Lille asks about coal and wages before flags. Workers want their protections recognised; employers need orders and transport; the municipality wants disputes settled without another emergency. Cooperation must keep the workshops running.\n\n[FROM.GetName] now presents its union treaty. Acceptance integrates our country. We can instead retain our government during an administrative transition, or reject the draft."
 sof_tp.2.d_BRD:0 "Bordeaux brings port accounts and municipal budgets. Its delegates welcome a national market but resist sending every credit decision and local expense away for approval. Their signature depends on room for local government within a common treasury.\n\n[FROM.GetName] invites us to the national reconstruction congress. Attendance opens formal negotiations while we retain our independent government and final approval rights. Declining the invitation preserves peace."
 sof_tp.3.d_BRD:0 "Bordeaux brings port accounts and municipal budgets. Its delegates welcome a national market but resist sending every credit decision and local expense away for approval. Their signature depends on room for local government within a common treasury.\n\n[FROM.GetName] now presents its union treaty. Acceptance integrates our country. We can instead retain our government during an administrative transition, or reject the draft."
 sof_tp.2.d_REN:0 "The Rennes delegates bring the hopes of towns, villages and religious communities: a rebuilt France should respect local life and give every region a voice in its common institutions. They are ready to negotiate unity and write those safeguards into a formal agreement.\n\n[FROM.GetName] invites us to the national reconstruction congress. Attendance opens formal negotiations while we retain our independent government and final approval rights. Declining the invitation preserves peace."
 sof_tp.3.d_REN:0 "The Rennes delegates bring the hopes of towns, villages and religious communities: a rebuilt France should respect local life and give every region a voice in its common institutions. They are ready to negotiate unity and write those safeguards into a formal agreement.\n\n[FROM.GetName] has now presented a unification treaty. Acceptance will integrate our states; we may instead retain autonomy and remain at congress, or refuse this draft."
 sof_tp_leave_bloc_tt:0 "Requires an independent, uncapitulated French government, peace, faction membership and no alignment cooldown. Leaves the faction, costs 5 trust and prevents a new membership application for 90 days."
 sof_tp_claim_victory_tt:0 "Requirements: one of the 20 regional governments, phase one, faction leader or unaligned; our faction owns and fully controls at least 200 French states; peace with French rivals, with French allies also outside wars against France; no unrecognising external French government whose alliance fully controls at least 35 states. Foreign wars do not block the declaration. Enter phase two and gain 20 Legitimacy. Final integration requires separate approval."
 sof_tp_open_congress_tt:0 "Establish a diplomatic office ([Root.GetSofTpOfficeFocus]; minor governments have basic diplomacy), and reach phase two or complete [Root.GetSofTpCongressFocus]. Be independent, not capitulated, at peace with French rivals and without an open congress. Open our congress and gain 10 Legitimacy, then invite delegates to negotiate and approve integration."
 sof_tp_adopt_federal_tt:0 "Requires an open congress, independence, no capitulation, peace, no adopted charter and 50 political power. Costs 50 political power and grants 15 trust. Mutually exclusive with the central charter. This is a provisional charter; complete the matching direction of [Root.GetSofTpConstitutionFocus] to make the institution permanent."
 sof_tp_adopt_central_tt:0 "Requires an open congress, independence, no capitulation, peace, no adopted charter and 50 political power. Costs 50 political power and grants 15 reconstruction. Mutually exclusive with the federal charter. This is a provisional charter; complete the matching direction of [Root.GetSofTpConstitutionFocus] to make the institution permanent."
 sof_tp_fund_reconstruction_tt:0 "Requires congress and a charter, independence, no capitulation, peace, unfinished reconstruction, no funding cooldown and 75 political power. Costs 75 political power; grants 20 reconstruction; 45-day cooldown."
 sof_tp_keep_promises_tt:0 "Requires congress and a charter, independence, no capitulation, peace, no promise cooldown and 50 political power. Costs 50 political power; grants 10 trust, 5 legitimacy and 5 reconstruction; 60-day cooldown. With Paris’s Strengthen the Unions institution, each action grants 3 additional legitimacy."
 sof_tp_break_promises_tt:0 "Requires congress and a charter, independence, no capitulation, peace, unfinished reconstruction and no previous revocation. Once only: gain 25 reconstruction, lose 30 trust, 15 legitimacy and 10 percentage points of stability."
 sof_tp_complete_reconstruction_tt:0 "Requires congress and a charter, independence, no capitulation, peace, reconstruction of 100 and direct ownership and full control of at least 200 French states. Once only: gain 100 political power and 5 percentage points of stability. At 70 trust or higher, gain a further 100 political power and 5 percentage points of stability."
 sof_tp_request_membership_tt:0 "双方均已批准共同防御总纲后，向选定阵营提交加入申请。接纳由对方决定，外交关系、邻接与履约信誉影响其态度。"
 sof_tp_invite_congress_tt:0 "Costs 25 Political Power. The host must have an open congress, be at peace and have no unanswered approach. The target must be a peaceful, independent, non-capitulated French government that has neither accepted an invitation nor entered a refusal cooldown. The recipient separately decides on integration after attending.\nRegional governments must first establish a diplomatic office through [Root.GetSofTpOfficeFocus]; minor governments retain basic diplomacy."
 sof_tp_offer_union_tt:0 "A new proposal costs 50 PP and uses the chosen Terms. Requires congress, a charter, an attending independent recipient, peace, full control of French-only holdings, no other faction, active agreement, cooldown or pending reply. The recipient may accept, counter with transition or refuse; refusal or failed counter-talks impose 90 days before another proposal. Acceptance signs an agreement, funded separately. After delivery, final approval is requested free. Only final consent transfers the country and troops, adds cores and grants us 10 legitimacy and 5 trust. Final refusal imposes 180 days. Major regions need [Root.GetSofTpOfficeFocus]."
 sof_tp_press_claim_tt:0 "The recipient must have refused congress or union, both sides must be at peace, and the target must have no pressure cooldown. Requires an open congress and 75 political power. Costs 75 political power, 15 trust and 10 legitimacy; breaks shared faction ties and grants a 180-day annexation war goal. Choose the moment of war through diplomacy. Both factions must consist of French-territory governments, with no foreign guarantees; the target must own only French states. Regional expansion and unification-war authorisation are required, with the extra military focus for red Marseille.\nMajor regions first need the diplomatic office from [Root.GetSofTpOfficeFocus]. Minor governments retain basic diplomacy."
