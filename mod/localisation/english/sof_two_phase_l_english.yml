 sof_tp_institution_provisional:0 "Provisional charter only"
 sof_tp_focus_office_tt:0 "Establishes the diplomatic office and enables targeted council proposals. An actual signed alliance, together with this office, can replace the war-readiness requirement for the national mandate focus."
 sof_tp_focus_congress_tt:0 "Establishes the congress institution, allowing congress before phase II. Its territorial condition accepts either 50 states of our own, or a signed alliance controlling at least 50 French states. Existing focus prerequisites still apply."
 sof_tp_focus_constitution_tt:0 "Establishes permanent constitutional institutions and confirms this focus’s federal or central charter. It cannot contradict an existing council charter. The territorial condition accepts 100 states of our own or an actual peaceful union treaty. The council can first adopt a provisional charter for 50 political power without waiting for this focus."
 sof_tp_focus_settlement_tt:0 "Checked once when completing the national settlement focus: completed reconstruction, transport repair or demobilisation gives 75 PP. Delivered industrial aid or a completed domestic industrial project gives one 25% industry research bonus. Without that industrial result, an executed military declaration or delivered joint training gives 15 army experience instead. Research and army experience do not stack; later results are not retroactive."
 sof_tp_focus_PRS_unlock_tt:0 "Establishes workers’ representation. Each subsequent Honour Regional Commitments action grants an additional 3 legitimacy."
 sof_tp_focus_PRS_result_tt:0 "When French Union is completed, an already concluded peaceful council union treaty grants 5 percentage points of stability and 50 political power once. The bonus is settled using the treaty status at focus completion."
 sof_tp_focus_LIL_unlock_tt:0 "Establishes the Labour Coordination Board. Each subsequent delivery of bilateral aid grants us an additional 5 trust."
 sof_tp_focus_LIL_result_tt:0 "Actual bilateral aid delivery replaces the 6 June 1936 date gate for the Wages, Hours and Shifts Accord; other prerequisites remain. If aid has already been delivered when the focus finishes, gain 5 percentage points of stability once. Later aid is not retroactive."
 sof_tp_focus_BRD_unlock_tt:0 "Establishes the Port Credit Office. Each subsequent delivery of bilateral aid grants us an additional 10 reconstruction."
 sof_tp_focus_BRD_result_tt:0 "Actual bilateral aid delivery replaces the 100-state gate for the Post-Unification Port Contract Audit; other prerequisites remain. If aid has already been delivered when the focus finishes, gain 5 percentage points of stability once. Later aid is not retroactive."
 sof_tp_focus_REN_unlock_tt:0 "Establishes regional-rights guarantees. The first acceptance of our congress invitation grants the recipient an additional 5 trust, once per pair of countries."
 sof_tp_focus_REN_result_tt:0 "Completing the Common Security Agreement grants a one-time additional 5 percentage points of Stability if we have already delivered bilateral aid. Receiving aid alone is insufficient; the bonus is settled using delivery status at focus completion."
 sof_tp_contract.1.t:0 "Deliver First, Decide on Union Later"
 sof_tp_contract.1.d:0 "[FROM.GetName] proposes [FROM.GetSofTpSentTerms]. Our delegates want the costs, delivery date and regional benefit in writing before discussing union.\n\n[FROM.GetSofTpSentTermsDetails]\n\nSigning accepts cooperation only. After delivery, we still decide separately whether to integrate. War pauses the clock; expiry before delivery carries a credibility cost. A non-transitional offer may be met with a transition counteroffer."
 sof_tp_contract.1.a:0 "Accept the terms; retain final approval."
 sof_tp_contract.1.b:0 "Counteroffer: retain local government during transition."
 sof_tp_contract.1.c:0 "These terms do not persuade us."
 sof_tp_contract.2.t:0 "The Local Seal Stays Here"
 sof_tp_contract.2.d:0 "The other delegation proposes an administrative transition. It will continue the talks, provided that operating funds come first and existing offices keep doing their work before sovereignty is reconsidered.\n\nAccepting costs real political resources. Their government retains its authority and decides on final union after delivery. Refusing ends this round and leaves both sides their options.\n\nRevised terms: we pay 40 PP on execution; the recipient immediately receives 40 PP. After 90 peaceful days, both gain 8 trust. Total term: 180 peaceful days. Execution costs are paid when work begins; final union follows their separate approval after delivery."
 sof_tp_contract.2.a:0 "Proceed on transitional terms."
 sof_tp_contract.2.b:0 "Decline the amendment."
 sof_tp_contract.3.t:0 "The Terms Are Fulfilled; the Choice Remains"
 sof_tp_contract.3.d:0 "Delivered terms: [Root.GetSofTpContractType].\n\nThe agreed cooperation is complete. The delegates return with a delivered result to examine, rather than another assurance about the future.\n\nThe document now before us is final approval of union. Signing transfers the country and armed forces into the common system. Declining preserves our independence. Earlier aid, transition or joint training did not remove today’s right to refuse."
 sof_tp_contract.3.a:0 "Approve integration into the common state."
 sof_tp_contract.3.b:0 "Acknowledge the delivery; remain independent."
 sof_tp_contract.4.t:0 "The Delivery Can Be Recorded"
 sof_tp_contract.4.d:0 "Delivered: [Root.GetSofTpLastContractType].\n\nThe handover teams have submitted the completion records. Agreed work has been delivered, giving the partners a firm foundation for the next stage of cooperation.\n\nThe recipient will separately decide whether to approve final integration."
 sof_tp_contract.4.a:0 "Record the delivery; await the final decision."
 sof_tp_contract.5.t:0 "An Agreement Reaches Its End"
 sof_tp_contract.5.d:0 "This agreement will proceed no further. The clerk removes it from the active docket while preserving its record of signature, implementation and termination. The record preserves actual delivery and losses for future negotiations.\n\nBoth governments retain their other options. Both governments retain their territories and current state of peace or war."
 sof_tp_contract.5.a:0 "Close this agreement."
 sof_tp_contract.6.t:0 "From the Budget into Daily Life"
 sof_tp_contract.6.d:0 "The responsible office submits its completion report. The money, personnel and time debated at the start now correspond to a delivered construction or resettlement result.\n\nReconstruction has not settled every argument in France. It has made the country in which those arguments occur more workable. We can commission another project or reserve our resources for other needs."
 sof_tp_contract.6.a:0 "Record the result and close the project."
 sof_tp_contract.7.t:0 "Work Stops Here"
 sof_tp_contract.7.d:0 "The project office has closed this arrangement and will record resources already committed separately from work already delivered.\n\nUnfinished work is halted. The government must plan its next steps around the personnel and funds still available."
 sof_tp_contract.7.a:0 "Settle the account as it stands."
