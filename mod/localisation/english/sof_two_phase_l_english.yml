 sof_tp_selected_membership:0 "Join bloc"
 sof_tp_selected_membership_tt:0 "Costs 25 political power. Both sides must be independent, uncapitulated French governments at peace. We must be unaligned, without an alignment cooldown or pending negotiation; the recipient must lead a faction. Membership requires their consent.\nMajor regions first need the diplomatic office from [Root.GetSofTpOfficeFocus]. Minor governments retain basic diplomacy."
 sof_tp_selected_congress:0 "Invite"
 sof_tp_selected_congress_tt:0 "Costs 25 Political Power. The host must have an open congress, be at peace and have no unanswered approach. The target must be a peaceful, independent, non-capitulated French government that has neither accepted an invitation nor entered a refusal cooldown. The recipient separately decides on integration after attending.\nRegional governments must first establish a diplomatic office through [Root.GetSofTpOfficeFocus]; minor governments retain basic diplomacy."
 sof_tp_selected_union:0 "[Root.GetSofTpA3UnionLabel]"
 sof_tp_selected_union_tt:0 "A new proposal costs 50 PP and uses the chosen Terms. Requires congress, a charter, an attending independent recipient, peace, full control of French-only holdings, no other faction, active agreement, cooldown or pending reply. The recipient may accept, counter with transition or refuse; refusal or failed counter-talks impose 90 days before another proposal. Acceptance signs an agreement, funded separately. After delivery, final approval is requested free. Only final consent transfers the country and troops, adds cores and grants us 10 legitimacy and 5 trust. Final refusal imposes 180 days. Major regions need [Root.GetSofTpOfficeFocus]."
 sof_tp_selected_claim:0 "Press claim"
 sof_tp_selected_claim_tt:0 "The recipient must have refused congress or union, both sides must be at peace, and the target must have no pressure cooldown. Requires an open congress and 75 political power. Costs 75 political power, 15 trust and 10 legitimacy; breaks shared faction ties and grants a 180-day annexation war goal. Choose the moment of war through diplomacy. Both factions must consist of French-territory governments, with no foreign guarantees; the target must own only French states. Regional expansion and unification-war authorisation are required, with the extra military focus for red Marseille.\nMajor regions first need the diplomatic office from [Root.GetSofTpOfficeFocus]. Minor governments retain basic diplomacy."
 sof_tp_selected_settlement:0 "Recognition"
 sof_tp_selected_settlement_tt:0 "In phase I, requires a major regional government at peace, at least 150 bloc-controlled French states, no pending negotiation and 50 political power. The target must be an independent, uncapitulated French government at peace outside our faction, without prior recognition or a recognition cooldown. Costs 50 political power. Acceptance grants recognition, 10 legitimacy and 5 trust, without annexation or faction membership. Refusal imposes a 180-day cooldown.\nMajor regions first need the diplomatic office from [Root.GetSofTpOfficeFocus]. Minor governments retain basic diplomacy."
 sof_tp_selected_aid:0 "Fund agreement"
 sof_tp_selected_aid_tt:0 "Requires a valid agreement with the selected government that has not yet been funded. Both sides must be independent, not capitulated and at peace. Industry: 75 Political Power/60 days; transition: 40 Political Power/90 days (the recipient immediately receives 40 Political Power); army training: 50 Political Power and 20 Army Experience/45 days. Costs are paid once. Progress advances on peaceful days and pauses during war. See the Terms page for benefits. Sign, deliver and then seek the recipient’s separate approval for final integration."
 sof_tp_selected_challenge:0 "Prepare war"
 sof_tp_selected_challenge_tt:0 "Phase I only. We must be independent, uncapitulated and at peace, with regional expansion and unification-war authorisation; red Marseille also needs its military focus authorisation. Both factions must consist of French-territory governments, with no foreign guarantees. The peaceful legal French target must own only French states and be adjacent, or have a controlled naval base while we have completed sea preparations. Costs 75 political power and 5 trust; grants a 180-day annexation war goal. Choose the moment of war through diplomacy."
 sof_tp_selected_enforce:0 "Declare war"
 sof_tp_selected_enforce_tt:0 "Immediately declares war using our existing annexation goal. Both factions must consist of French-territory governments, with no foreign guarantees. We must be independent, uncapitulated and at peace, with regional expansion and unification-war authorisation; red Marseille needs its military focus authorisation. The peaceful legal French target must own only French states and meet adjacency or sea-preparation requirements."
 sof_tp_popup_focus_state:0 "Diplomacy: [Root.GetSofTpOfficeStatus]\nCongress: [Root.GetSofTpCongressStatus]\nPermanent charter: [Root.GetSofTpConstitutionStatus]\n\n[Root.GetSofTpNextInstitutionFocus]"
 sof_tp_popup_focus_state_tt:0 "Diplomatic office: [Root.GetSofTpOfficeFocus]\nCongress: [Root.GetSofTpCongressFocus]\nConstitution: [Root.GetSofTpConstitutionFocus]\n\nComplete the named focuses to establish institutions, then act in the council. Actual alliances, union treaties, aid and reconstruction feed back into later focus requirements and rewards."
