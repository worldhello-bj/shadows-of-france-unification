 sof_tp_a3_aid_cost_army:0 "50 PP / 20 XP"
 sof_tp_a3_union_proposal_cost:0 "50 PP"
 sof_tp_a3_union_proposal_label:0 "Propose terms"
 sof_tp_a3_send_offer:0 "Send proposal"
 sof_tp_a3_send_offer_tt:0 "Send the selected government a new offer using the chosen terms, for 50 PP. Fund implementation and request final approval in the subsequent stages. For a delivered agreement, request free final approval from Work."
 sof_tp_a3_owner_closed:0 "Deal ended"
 sof_tp_a3_next_cooldown:0 "Await cooldown"
 sof_tp_cancel_outgoing_contract:0 "Withdraw Our Commitment to [FROM.GetName]"
 sof_tp_cancel_outgoing_contract_desc:0 "End the agreement we undertook with this government. Withdrawal neither refunds spent resources nor reverses delivery, and we bear the political cost."
 sof_tp_cancel_outgoing_contract_tt:0 "Withdraw only an active agreement in which we are the provider to this recipient. We lose 10 trust and 5 legitimacy; they lose 5 trust. Clears their agreement slot with a 60-day cooldown. Spent PP and army experience are not refunded, and delivered results remain. Both governments retain their territories and current diplomatic status."
