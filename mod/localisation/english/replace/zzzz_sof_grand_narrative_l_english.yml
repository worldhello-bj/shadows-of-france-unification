 sof_gn_shortcut:0 "National reunification and strategy"
 sof_gn_national_project:0 "[GetSofGnRole] — National renewal"
 sof_gn_national_project_desc:0 "Before reunification, grants political, production and military coordination bonuses. Production requires an intact home region. Wartime bonuses end on reunification; completing reconstruction activates civilian industry, research and integration bonuses."
 sof_gn_strategy_policy_tt:0 "Before reunification: political power gain +5%, stability +3%."
 sof_gn_production_policy_tt:0 "While the home region remains united, before national reunification: civilian and military factory construction +7%, factory output +5%, plus [GetSofGnSectorBonus]."
 sof_gn_operations_policy_tt:0 "Before reunification: army organisation +3%, supply consumption -3%, planning speed +5%."
 sof_gn_campaign_policy_tt:0 "Before reunification: another +5% political power gain and +2% army organisation."
 sof_gn_legacy_policy_tt:0 "Postwar reconstruction policy: civilian factory construction +10%, research speed +2%, compliance gain +0.03, plus [GetSofGnSectorBonus]."
 sof_gn_capacity_bonus:0 "National industrial research reserve"
 sof_gn_air_program:0 "National aviation industry plan"
 sof_gn_reconstruction_bonus:0 "Industrial reconstruction of united France"
 sof_gn_role_fallback:0 "National reconstruction"
 sof_gn_vision_fallback:0 "Rebuild France through national political, industrial and military institutions."
 sof_rpe_regional_program:0 "[GetSofRlRegion] — National party programme"
 sof_rpe_policy_tt:0 "The party’s national programme grants the stated ongoing bonuses; suspended on leaving office, capitulation or loss of the construction base."
