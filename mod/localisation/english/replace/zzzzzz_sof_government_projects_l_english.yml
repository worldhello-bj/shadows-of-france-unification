l_english:
 sof_gov_np_title:0 "French National Projects"
 sof_gov_np_subtitle:0 "Build national institutions for unification and reconstruction"
 sof_gov_np_rules:0 "One national project at a time. Normal duration: 50 days, +2 progress daily. Spend 25 political power for +10 progress, up to twice, with a 10-day interval. Transport, armaments and treasury pause during war. Each project is accepted once."
 sof_gov_np_no_project:0 "No active project"
 sof_gov_np_status_idle:0 "Awaiting authorisation"
 sof_gov_np_status_ready:0 "Ready to start"
 sof_gov_np_status_active:0 "In execution"
 sof_gov_np_status_paused:0 "Execution paused"
 sof_gov_np_status_complete:0 "Accepted"
 sof_gov_np_status_all_complete:0 "All national projects accepted"
 sof_gov_np_status_locked:0 "Requirements unmet"
 sof_gov_np_eta_active:0 "[?sof_gov_np_eta_days|0] days remaining"
 sof_gov_np_eta_paused:0 "Completion date unavailable while paused"
 sof_gov_np_eta_complete:0 "Accepted; ready for another project"
 sof_gov_np_eta_none:0 "Awaiting another project"
 sof_gov_np_progress_label:0 "Execution progress"
 sof_gov_np_progress_text:0 "[?sof_gov_np_progress|0] / 100"
 sof_gov_np_ledger:0 "Accepted [?sof_gov_np_completed|0] / 4; extra investments [?sof_gov_np_boosts|0] / 2"
 sof_gov_np_invest:0 "Invest further"
 sof_gov_np_invest_tt:0 "25 political power; +10 progress. At most two investments, 10 days apart; unavailable while paused. Additional investment is non-refundable."
 sof_gov_np_cancel:0 "Cancel project"
 sof_gov_np_cancel_tt:0 "Cancel the project and refund half its starting political power: 50 from 100, or 75 from 150. Extra investment and army experience are not refunded; progress is reset."
 sof_gov_np_start:0 "Authorise project"
 sof_gov_np_current_title:0 "Current national undertaking"
 sof_gov_np_acceptance:0 "Acceptance objectives"
 sof_gov_np_paused_reason:0 "Civilian projects pause at war; all pause under subject rule or capitulation. Restarting resets progress."
 sof_gov_np_invest_cooldown:0 "Investment cooldown: [?sof_gov_np_invest_days_left|0] days"
 sof_gov_np_native_note:0 "Permanent institutional benefits appear in the native politics screen. This page tracks project execution and acceptance."
 sof_gov_np_transport:0 "National Transport Arteries"
 sof_gov_np_transport_desc:0 "Unite fragmented transport systems under a national authority, giving armies and reconstruction a common logistical backbone."
 sof_gov_np_transport_title:0 "National Transport Arteries"
 sof_gov_np_transport_requirements:0 "National mandate; 100 political power."
 sof_gov_np_transport_reward:0 "Permanent: infrastructure construction +10%, supply consumption -10%. With a charter, reconstruction also increases by 10."
 sof_gov_np_transport_start_tt:0 "National mandate; 100 political power. Normal execution: 50 days. Permanent: infrastructure construction +10%, supply consumption -10%. With a charter, reconstruction also increases by 10."
 sof_gov_np_armaments:0 "National Armaments Authority"
 sof_gov_np_armaments_desc:0 "Common specifications, regional procurement and a national division of armaments production create the industrial basis for unification."
 sof_gov_np_armaments_title:0 "National Armaments Authority"
 sof_gov_np_armaments_requirements:0 "National mandate; at least 3 completed industrial focuses; 150 political power."
 sof_gov_np_armaments_reward:0 "Permanent: production efficiency cap +10%, military factory construction +10%."
 sof_gov_np_armaments_start_tt:0 "National mandate; at least 3 completed industrial focuses; 150 political power. Normal execution: 50 days. Permanent: production efficiency cap +10%, military factory construction +10%."
 sof_gov_np_staff:0 "French Joint General Staff"
 sof_gov_np_staff_desc:0 "Bring regional armies into common staff, liaison and operational planning structures to conduct campaigns on a national scale."
 sof_gov_np_staff_title:0 "French Joint General Staff"
 sof_gov_np_staff_requirements:0 "War preparation authorised; Brittany needs parliamentary approval. Cost: 100 PP and 25 army XP."
 sof_gov_np_staff_reward:0 "Permanent: planning speed +10%, army organisation +5%. This project continues during war."
 sof_gov_np_staff_start_tt:0 "Unification war preparation authorised; Brittany also requires parliamentary war authorisation; 100 political power and 25 army experience. Normal execution: 50 days. Permanent: planning speed +10%, army organisation +5%. This project continues during war."
 sof_gov_np_treasury:0 "National Treasury and Customs Union"
 sof_gov_np_treasury_desc:0 "A common budget, tax system and customs territory consolidate constitutional union into a government capable of national responsibilities."
 sof_gov_np_treasury_title:0 "National Treasury and Customs Union"
 sof_gov_np_treasury_requirements:0 "National congress open; charter adopted; at peace; 150 political power."
 sof_gov_np_treasury_reward:0 "Permanent: political power gain +10%, consumer goods factories -5%; reconstruction trust increases by 10."
 sof_gov_np_treasury_start_tt:0 "National congress open; charter adopted; at peace; 150 political power. Normal execution: 50 days. Permanent: political power gain +10%, consumer goods factories -5%; reconstruction trust increases by 10."
