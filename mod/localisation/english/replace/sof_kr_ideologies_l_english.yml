l_english:
 totalist:0 "Communism"
 totalist_noun:0 "Communism"
 totalist_desc:0 "Communism"
 totalist_subtype:0 "Communism"
 totalist_subtype_desc:0 "The French Communist Party combines Marxism and Leninism with a centralised party organisation, labour mobilisation and ties to the Communist International. In 1936, Thorez pursues the Popular Front: cooperation with Socialists and Radicals against fascism, support for labour reform, and parliamentary support for Blum without entering his cabinet."
 syndicalist:0 "Revolutionary Syndicalism"
 syndicalist_noun:0 "Revolutionary Syndicalism"
 syndicalist_desc:0 "Revolutionary Syndicalism"
 syndicalist_subtype:0 "Revolutionary Syndicalism"
 syndicalist_subtype_desc:0 "Revolutionary syndicalism centres class struggle on unions, direct action and the general strike, seeking workers’ control of production and independence from parties and the state. It is one tradition within French labour; the reunited CGT of 1936 contains several socialist and communist currents."
 radical_socialist:0 "Independent Socialism"
 radical_socialist_noun:0 "Independent Socialism"
 radical_socialist_desc:0 "Independent Socialism"
 radical_socialist_subtype:0 "Independent Socialism"
 radical_socialist_subtype_desc:0 "Independent socialism includes organisations between the Communist Party and the SFIO. The Party of Proletarian Unity grew from communist dissident groups, defending working-class politics, local organisation and political independence while participating in the 1936 Popular Front."
 social_democrat:0 "Democratic Socialism"
 social_democrat_noun:0 "Democratic Socialism"
 social_democrat_desc:0 "Democratic Socialism"
 social_democrat_subtype:0 "Democratic Socialism"
 social_democrat_subtype_desc:0 "The SFIO retains a socialist objective while pursuing reform through elections, parliament and organised labour. In 1936 its programme centres on collective bargaining, paid leave, shorter working hours and public intervention. The USR belongs to the same broad reforming camp, with distinct and divided views on coalition government, planning and executive authority."
 social_liberal:0 "Radical Republicanism"
 social_liberal_noun:0 "Radical Republicanism"
 social_liberal_desc:0 "Radical Republicanism"
 social_liberal_subtype:0 "Radical Republicanism"
 social_liberal_subtype_desc:0 "French Radicalism defends a secular republic, parliamentary government and civic equality, with a strong base among small proprietors, farmers and the middle classes. In 1936 the Radical Party joins the Popular Front while retaining private property, fiscal responsibility and gradual reform as central commitments."
 market_liberal:0 "Liberal Republicanism"
 market_liberal_noun:0 "Liberal Republicanism"
 market_liberal_desc:0 "Liberal Republicanism"
 market_liberal_subtype:0 "Liberal Republicanism"
 market_liberal_subtype_desc:0 "The Democratic Alliance and Republican Left represent the liberal republican centre-right: private enterprise, monetary stability, balanced finances and parliamentary government. In 1936 they oppose much of the Popular Front’s economic programme and rely on local notables, business networks and parliamentary alliances."
 social_conservative:0 "Conservative Republicanism"
 social_conservative_noun:0 "Conservative Republicanism"
 social_conservative_desc:0 "Conservative Republicanism"
 social_conservative_subtype:0 "Conservative Republicanism"
 social_conservative_subtype_desc:0 "Republican conservatives stress property, family, religious freedom and national defence within parliamentary politics. The Republican Federation is nationalist and anti-communist; the PDP advances Christian democracy and social Catholicism; the Alsatian UPR prioritises regional rights, local religious institutions and cultural traditions."
 authoritarian_democrat:0 "Authoritarian Nationalism"
 authoritarian_democrat_noun:0 "Authoritarian Nationalism"
 authoritarian_democrat_desc:0 "Authoritarian Nationalism"
 authoritarian_democrat_subtype:0 "Authoritarian Nationalism"
 authoritarian_democrat_subtype_desc:0 "This current seeks a stronger executive and organised national mobilisation above parliamentary party conflict. France in 1936 contains several distinct strong-government and anti-parliamentary movements. Doriot moves from communist dissidence towards anti-communist nationalism, founding the PPF in June and developing an increasingly fascist programme."
 paternal_autocrat:0 "Traditional Authoritarianism"
 paternal_autocrat_noun:0 "Traditional Authoritarianism"
 paternal_autocrat_desc:0 "Traditional Authoritarianism"
 paternal_autocrat_subtype:0 "Traditional Authoritarianism"
 paternal_autocrat_subtype_desc:0 "Traditional authoritarianism locates authority in a monarch, the military or conservative elites, favouring hierarchy and restrictions on party competition. Action française advocates monarchist restoration and integral nationalism, with explicit anti-parliamentary and antisemitic positions distinct from parliamentary republican conservatism."
 national_populist:0 "Fascism"
 national_populist_noun:0 "Fascism"
 national_populist_desc:0 "Fascism"
 national_populist_subtype:0 "Fascism"
 national_populist_subtype_desc:0 "Fascism combines ultranationalism, leader authority and mass mobilisation, rejecting liberal parliamentarism and Marxism while seeking state-directed social and economic organisation. French movements vary in structure and radicalism; exclusionary nationalism, antisemitism and political violence form part of this political landscape."
