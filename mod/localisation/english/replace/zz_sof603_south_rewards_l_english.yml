 sof_region_BES_1936_assembly_line_desc:0 "Montbéliard adds 2 military factories and 2 building slots, delivering an initial batch of 150 trucks."
 sof_region_BES_1936_border_desc:0 "Equip the border reserve with 600 infantry weapons and 20 army XP."
 sof_region_BES_1936_certificates_desc:0 "The certification institute consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_BES_1936_field_workshops_desc:0 "Field workshops deliver 100 support equipment, 15 army XP and a 100% support-technology research bonus."
 sof_region_BES_1936_inspection_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_BES_1936_measures_desc:0 "With Swiss consent, shared standards yield 100 support equipment, a 100% electronics research bonus and a 50% industry bonus."
 sof_region_BES_1936_motor_brigade_desc:0 "Assemble the motor brigade’s equipment pool: 300 trucks, 600 infantry weapons and 100 support equipment, with 25 army XP for organisation."
 sof_region_BES_1936_optics_desc:0 "Precision optics support 120 artillery pieces and a 100% artillery research bonus."
 sof_region_BES_1936_precision_school_desc:0 "The precision school establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_BES_1936_repair_columns_desc:0 "Repair columns receive 100 support equipment and 150 trucks."
 sof_region_BES_1936_small_machines_desc:0 "Besançon’s small-machine works gain 2 civilian factories and 2 building slots for precision manufacturing."
 sof_region_BRD_1936_air_exchange_desc:0 "With Toulouse’s accepted agreement and a developed Bordeaux industrial base, open a joint research programme: +1 research slot, up to four, and 25 air XP. A third slot requires 2 civilian/2 military factories; a fourth requires 3/3. At the cap, receive a 100% electronics bonus."
 sof_region_BRD_1936_bomber_orders_desc:0 "Place the bomber order: build 2 military factories and add 2 building slots in Bordeaux; receive 18 early aircraft and 15 air XP."
 sof_region_BRD_1936_civil_orders_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 sof_region_BRD_1936_coastal_escorts_desc:0 "Develop coastal escorts with a 100% destroyer research bonus, 25 navy XP and one 50% naval-doctrine discount."
 sof_region_BRD_1936_crew_school_desc:0 "The crew school provides 25 navy XP and one 50% naval-doctrine discount."
 sof_region_BRD_1936_escort_slips_desc:0 "Two new dockyards and two building slots support the escort programme. Naval planners gain 20 navy XP."
 sof_region_BRD_1936_export_houses_desc:0 "Bordeaux’s export houses finance a new civilian factory and its building slot. Their commercial network keeps the port supplied with orders."
 sof_region_BRD_1936_maritime_staff_desc:0 "The maritime staff establishes a technical school serving merchant and escort crews. With 2 civilian factories and 2 dockyards in Bordeaux, gain one research slot up to three; at the cap, receive a 100% electronics bonus."
 sof_region_BRD_1936_merchant_charter_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_BRD_1936_merchant_slips_desc:0 "Open a merchant slipway in Bordeaux with 1 dockyard and 1 building slot, then place 30 convoys in service."
 sof_region_BRD_1936_mobile_reserve_desc:0 "The mobile reserve receives 150 trucks and 15 army XP."
 sof_region_BRD_1936_poitou_contract_desc:0 "Poitou’s accepted transport contract delivers 20 convoys for the agreed route."
 sof_region_BRD_1936_port_accounts_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_BRD_1936_port_guard_desc:0 "Equip the port guard with 600 infantry weapons and 15 army XP."
 sof_region_BRD_1936_quay_repair_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 sof_region_BRD_1936_saso_desc:0 "Expand the aviation workshops with 1 military factory and 1 building slot in Bordeaux. The design team gains 15 air XP."
 sof_region_CFR_1936_army_tyre_desc:0 "Army tyre contracts deliver 150 trucks and increase military-factory output by 10%, at a cost of 2.5% stability."
 sof_region_CFR_1936_autonomy_desc:0 "The local vehicle programme delivers 100 trucks and a 100% motorized-equipment research bonus."
 sof_region_CFR_1936_calibration_desc:0 "The calibration laboratories consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_CFR_1936_dispersal_desc:0 "Dispersed workshops provide 100 support equipment and 20 army XP."
 sof_region_CFR_1936_exchange_desc:0 "After Lyon accepts the agreement, joint trials deliver 150 trucks, 20 army XP and a 100% motorized-equipment research bonus."
 sof_region_CFR_1936_ledger_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_CFR_1936_mixing_desc:0 "The mixing programme opens 2 civilian factories and 2 building slots in Clermont-Ferrand, expanding tyre and industrial processing capacity."
 sof_region_CFR_1936_reclaim_desc:0 "Reclaimed components equip 150 trucks and maintain the tyre-recovery programme."
 sof_region_CFR_1936_reserve_desc:0 "Equip the regional reserve with 600 infantry weapons. Gain the reserve organisation policy, 20 army XP and one 50% land-doctrine discount."
 sof_region_CFR_1936_schools_desc:0 "The technical schools establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_CFR_1936_thiers_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_CFR_1936_toolroom_desc:0 "Thiers’ toolroom supplies 100 support equipment, a 100% infantry-weapons research bonus and a 50% industry bonus."
 sof_region_CFR_1936_workshops_desc:0 "Issoire opens 2 military factories and 2 building slots, then delivers 600 infantry weapons to the reserve."
 sof_region_DIJ_1936_archives_desc:0 "The industrial archive consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_DIJ_1936_artillery_school_desc:0 "The artillery school provides a 100% artillery research bonus, 25 army XP and one 50% land-doctrine discount."
 sof_region_DIJ_1936_commissions_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_DIJ_1936_engineers_desc:0 "The engineers receive 100 support equipment, 20 army XP and a 100% reconnaissance-technology bonus."
 sof_region_DIJ_1936_foundry_desc:0 "The Le Creusot foundry programme adds 2 military factories and 2 building slots in Autun, with a 50% artillery research bonus."
 sof_region_DIJ_1936_heavy_guns_desc:0 "The heavy-gun programme delivers 120 artillery pieces and 20 army XP, backed by the regional gun-production network."
 sof_region_DIJ_1936_network_desc:0 "Dijon, Chalon, Autun and the northern rail district form an integrated network: −12% supply consumption and +15% planning speed while the four centres remain controlled."
 sof_region_DIJ_1936_perrigny_desc:0 "Perrigny’s freight depot gains 150 trucks, one infrastructure level up to level 5, and a 100% train-technology research bonus."
 sof_region_DIJ_1936_rail_units_desc:0 "Railway units receive 150 trucks, 20 army XP and a 100% train-technology research bonus."
 sof_region_DIJ_1936_reserve_desc:0 "The regional reserve receives 600 infantry weapons and 15 army XP."
 sof_region_DIJ_1936_works_school_desc:0 "The works school establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_LYO_1936_alpine_desc:0 "Equip the Alpine reserve with 600 infantry weapons and 100 support equipment. Mountain exercises provide 20 army XP and one 50% land-doctrine discount."
 sof_region_LYO_1936_arsenal_desc:0 "The arsenal’s first order delivers 600 infantry weapons and 15 army XP."
 sof_region_LYO_1936_arsenal_line_desc:0 "Saint-Étienne expands to two new military workshops and delivers 600 infantry weapons. Two added building slots give the arsenal room to grow."
 sof_region_LYO_1936_chemistry_desc:0 "Lyon’s university laboratories open an industrial chemical workshop: 1 civilian factory, 1 building slot and a 100% industry research bonus, alongside the chemical production network."
 sof_region_LYO_1936_contacts_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_LYO_1936_engineers_desc:0 "Army engineers receive 100 support equipment, 20 army XP and a 100% reconnaissance-technology research bonus."
 sof_region_LYO_1936_road_test_desc:0 "Road trials provide 20 army XP, a 50% motorized-equipment research bonus and one 50% land-doctrine discount."
 sof_region_LYO_1936_spares_desc:0 "The spare-parts programme equips 150 trucks."
 sof_region_LYO_1936_technicians_desc:0 "The industrial triangle finances a permanent technical faculty. Gain one research slot up to four; the fourth requires at least 3 civilian and 3 military factories in Lyon; an established four-slot programme receives a 100% electronics bonus."
 sof_region_LYO_1936_triangle_desc:0 "Lyon, Saint-Étienne and Grenoble coordinate their orders. The industrial triangle grants +12% factory output and +6% production efficiency growth while the three centres remain under our control."
 sof_region_LYO_1936_truck_line_desc:0 "Berliet delivers a working production line: 1 military factory and 1 building slot in Lyon, plus 250 trucks for army transport."
 sof_region_LYO_1936_university_desc:0 "Expand the university’s industrial laboratories. Lyon needs at least 2 civilian and 2 military factories; gain one research slot up to three. At the slot cap, the programme provides a 100% electronics research bonus."
 sof_region_MOP_1936_accepted_tools_desc:0 "Lyon’s accepted tool agreement delivers 100 support equipment and a 100% industry research bonus."
 sof_region_MOP_1936_agronomy_desc:0 "The agricultural school establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_MOP_1936_ales_workshops_desc:0 "Alès’ workshops add 1 civilian factory, 1 military factory and 2 building slots, then deliver 100 support equipment."
 sof_region_MOP_1936_cellar_network_desc:0 "The Béziers cellar network grows into 2 civilian factories with 2 building slots, turning cooperative processing into a durable industrial base."
 sof_region_MOP_1936_debt_audit_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_MOP_1936_distillation_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 sof_region_MOP_1936_inventory_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_MOP_1936_irrigation_desc:0 "The irrigation programme adds 1 civilian factory and 1 building slot in Montpellier, plus one infrastructure level up to level 5. The local water network continues to support farms and towns."
 sof_region_MOP_1936_market_halls_desc:0 "Expand the designated, fully controlled industrial district with 2 civilian factories and 2 additional building slots."
 sof_region_MOP_1936_mobile_columns_desc:0 "Mobile columns receive 1,200 infantry weapons and 15 army XP."
 sof_region_MOP_1936_mountain_units_desc:0 "Equip the Cévennes mountain units with 600 infantry weapons and 100 support equipment. Field training grants 20 army XP and one 50% land-doctrine discount."
 sof_region_MOP_1936_quality_labs_desc:0 "The quality laboratories consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_MOP_1936_representatives_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_MOP_1936_sappers_desc:0 "The sappers receive 100 support equipment and a 100% engineer-technology research bonus."
 sof_region_MOP_1936_sea_manifest_desc:0 "The accepted Mediterranean shipping agreement delivers 20 convoys for the shared route."
 sof_region_MOP_1936_sete_desc:0 "Sète opens a new dockyard with 1 building slot, delivers 20 convoys and provides 15 navy XP."
 sof_region_NAN_1936_army_logistics_desc:0 "Army logistics receives 150 trucks, 100 support equipment, 25 army XP and a 100% support-technology research bonus."
 sof_region_NAN_1936_coastal_watch_desc:0 "The coastal watch receives 100 support equipment, 15 navy XP and a 100% electronics research bonus."
 sof_region_NAN_1936_convoys_desc:0 "Saint-Nazaire delivers a full merchant order of 45 convoys, giving the port an immediate overseas supply capability."
 sof_region_NAN_1936_destroyer_desc:0 "Develop the escort fleet with a 100% destroyer research bonus, 25 navy XP and one 50% naval-doctrine discount."
 sof_region_NAN_1936_emergency_board_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_NAN_1936_marine_engines_desc:0 "Marine-engine trials deliver a 100% naval-equipment research bonus, 20 navy XP and 20 convoys for the merchant fleet."
 sof_region_NAN_1936_naval_school_desc:0 "The naval school links Nantes and Saint-Nazaire. Gain one research slot up to four; Nantes needs 2 civilian factories/2 dockyards for a third slot or 3/3 for a fourth. At the cap, receive a 100% electronics bonus."
 sof_region_NAN_1936_restart_desc:0 "Reopen Nantes’ flood-damaged workshops, remove the flood constraint and add 1 civilian factory with 1 building slot. Recovered plans grant a 50% naval-equipment research bonus."
 sof_region_NAN_1936_seamanship_desc:0 "Practical seamanship provides 25 navy XP and one 50% naval-doctrine discount."
 sof_region_NAN_1936_slipways_desc:0 "Saint-Nazaire opens 2 dockyards with 2 building slots. The slipway programme also provides 20 navy XP and 25 political power."
 sof_region_NAN_1936_welders_desc:0 "Nantes’ welding school establishes a permanent research team. With 2 civilian factories and 2 dockyards, gain one research slot up to three; at the cap, receive a 100% electronics bonus."
 sof_region_POI_1936_arsenal_batches_desc:0 "Châtellerault delivers 600 infantry weapons and 20 army XP."
 sof_region_POI_1936_commercial_priority_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 sof_region_POI_1936_credit_guarantee_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_POI_1936_independent_acceptance_desc:0 "Independent acceptance delivers 100 support equipment, 20 army XP and a 100% support-technology research bonus."
 sof_region_POI_1936_local_mandate_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_POI_1936_medical_desc:0 "The medical service receives 100 support equipment and a 100% field-hospital research bonus."
 sof_region_POI_1936_port_corridor_desc:0 "Connect La Rochelle to the interior with 30 convoys, 150 trucks and one infrastructure level in the port district up to level 5."
 sof_region_POI_1936_research_service_desc:0 "The arsenal research service establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_POI_1936_rifle_instruction_desc:0 "Rifle instruction provides 25 army XP and one 50% land-doctrine discount."
 sof_region_POI_1936_rural_workshops_desc:0 "Niort’s rural workshops add 2 civilian factories and 2 building slots, creating a permanent base for repair and processing."
 sof_region_POI_1936_rush_batches_desc:0 "Emergency batches deliver 1,200 infantry weapons and add 2 military factories with 2 building slots. The 3% stability cost reflects the accelerated work schedule."
 sof_region_POI_1936_south_contract_desc:0 "Bordeaux’s accepted shipping agreement delivers 20 convoys and 20 navy XP."
 sof_region_POI_1936_technical_evening_desc:0 "The advanced technical courses consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_POI_1936_territorials_desc:0 "Equip the territorial reserve with 600 infantry weapons. Training provides 20 army XP and one 50% land-doctrine discount."
 sof_region_TOU_1936_contract_register_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_TOU_1936_design_archive_desc:0 "The design archive consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_TOU_1936_dewoitine_desc:0 "Dewoitine’s prototype shop grows into a production workshop: 1 military factory and 1 building slot in Toulouse, plus 20 air XP."
 sof_region_TOU_1936_field_artillery_desc:0 "Field artillery receives 120 guns and a 100% support-technology research bonus."
 sof_region_TOU_1936_fiscal_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_TOU_1936_francazal_desc:0 "Francazal’s flight trials provide 25 air XP and one 50% air-doctrine discount."
 sof_region_TOU_1936_lecture_halls_desc:0 "The university establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_TOU_1936_mechanics_desc:0 "Groundcrew training supplies 100 support equipment and 20 air XP."
 sof_region_TOU_1936_mountain_reserve_desc:0 "Build a well-equipped Pyrenean reserve: 600 infantry weapons, 100 support equipment, 25 army XP and one 50% land-doctrine discount."
 sof_region_TOU_1936_precision_shops_desc:0 "The precision shops add their military production facility with a building slot and deliver 120 artillery pieces."
 sof_region_TOU_1936_production_desc:0 "Toulouse’s aviation programme builds 2 military factories with 2 building slots and delivers 18 early aircraft."
 sof_region_TOU_1936_prototype_cycle_desc:0 "Fund a complete prototype cycle: a 100% light-aircraft research bonus, 30 air XP and one 50% air-doctrine discount."
 sof_region_TOU_1936_public_works_desc:0 "Expand the designated, fully controlled industrial district with 2 civilian factories and 2 additional building slots."
 sof_region_TOU_1936_tarbes_desc:0 "Tarbes releases 120 artillery pieces from its first army order. Acceptance trials provide 20 army XP."
 sof_region_TRS_1936_accepted_proof_desc:0 "Toulouse’s accepted proof agreement provides 25 army XP and a 100% artillery research bonus."
 sof_region_TRS_1936_accepted_rail_desc:0 "Poitou’s accepted railway agreement delivers 150 trucks and 20 army XP for route operations."
 sof_region_TRS_1936_archives_compact_desc:0 "The inter-school research compact consolidates the school’s applied research programme. After the earlier research milestone, gain one research slot up to four. A fourth slot needs at least 3 civilian factories and 3 military factories in the local industrial centre; at the cap, receive a 100% electronics bonus."
 sof_region_TRS_1936_arsenal_capacity_desc:0 "Expand Bourges’ arsenal with 2 military factories and 2 building slots, delivering 120 artillery pieces."
 sof_region_TRS_1936_maintenance_desc:0 "Tours’ maintenance depots release 150 trucks and 100 support equipment and strengthen the local repair organisation."
 sof_region_TRS_1936_post_admin_desc:0 "The local administration settles its accounts and secures public backing: gain 50 political power and 3% stability."
 sof_region_TRS_1936_proof_priority_desc:0 "Complete the proof programme: a 100% artillery research bonus, 25 army XP and one 50% land-doctrine discount."
 sof_region_TRS_1936_rear_depots_desc:0 "Bourges’ rear depots receive 600 infantry weapons and 100 support equipment, strengthening the depot network."
 sof_region_TRS_1936_reserve_columns_desc:0 "Equip the reserve columns with 600 infantry weapons. Organisational exercises provide 20 army XP and one 50% land-doctrine discount."
 sof_region_TRS_1936_scholars_desc:0 "The Tours research service establishes a permanent research team. With at least 2 civilian factories and 2 military factories in the local industrial centre, gain one research slot up to three. At the cap, receive one 100% electronics research bonus."
 sof_region_TRS_1936_serial_priority_desc:0 "Serial production releases 120 artillery pieces immediately, alongside the production programme and its 20-political-power investment."
 sof_region_TRS_1936_workshop_orders_desc:0 "Expand the designated, fully controlled industrial district with 2 civilian factories and 2 additional building slots."
