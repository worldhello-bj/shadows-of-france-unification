l_english:
 SFC_air_innovations_bba_desc:0 "Expand the capital air base by one level, up to its limit. Aviation development provides 25 air XP, a 100% fighter research bonus and two 50% air-doctrine discounts."
 SFC_ethiopian_war_logistics_bba_desc:0 "Prepare the crossing routes with 20 convoys and 100 support equipment. Improve a fully controlled French district’s infrastructure by one level and a controlled coastal district’s naval base by one level; completed facilities yield 40 political power for each replacement award."
 SFC_expand_national_universities_desc:0 "The university programme opens one research slot up to three under the industrial readiness rules. An established three-slot programme receives a 100% electronics research bonus. The later industrial programme can add the fourth slot after Ajaccio and Bastia are integrated."
 SFC_forza_navale_especiale_desc:0 "Prepare two four-battalion marine formations with an equipment pool of 800 infantry weapons and 100 support equipment. Gain 25 army XP, a 100% marine/transport research bonus and a 50% land-doctrine discount."
 SFC_naval_power_projection_desc:0 "Build 2 dockyards across the controlled French coast and Corsican ports. Gain 20 convoys, 25 navy XP and one 50% naval-doctrine discount."
 SFC_new_industrialization_program_desc:0 "After the university programme, Ajaccio and Bastia combine their industrial base: build 1 civilian factory in Ajaccio and 1 military factory in Bastia with 2 building slots. Gain one research slot up to four, or a 100% electronics bonus at the cap. Consumer-goods demand rises by 2%; Guido Jung becomes available for the finance cabinet."
 SFC_the_italian_legions_desc:0 "Organise the island legions with 1,200 infantry weapons, 120 artillery pieces, 150 trucks and 30 army XP. Home defence rises by 5%, army speed by 5% and maximum command power by 15%."
 SOF_MRS_RED_D7_desc:0 "Work with an independent, active faction partner on a shared technical programme. After the officer school, Marseille’s 3 civilian and 3 military factories support one research slot up to four; at the cap, receive a 100% electronics bonus. Cooperative industry research continues while the partnership remains active."
 SOF_MRS_RED_E12_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 SOF_MRS_RED_E2_desc:0 "Expand the designated, fully controlled industrial district with 1 civilian factory and 1 additional building slot."
 SOF_MRS_RED_E3_desc:0 "The port-warehouse programme adds two civilian factories in total, with building space for both. Marseille becomes the permanent production and storage centre of the plan."
 SOF_MRS_RED_E5_desc:0 "Expand the Var bauxite district: Brignoles gains 12 aluminium and 1 infrastructure level, up to level 5. The aluminium expansion is shared with the region’s other mining programmes and can be claimed once."
 SOF_MRS_RED_E7_desc:0 "Expand the designated, fully controlled industrial district with 1 military factory and 1 additional building slot."
 SOF_MRS_RED_E8_desc:0 "After one year of the plan and at least 6 civilian and military factories, build 1 civilian factory and 2 military factories with 3 building slots. Gain a 100% industry research bonus and upgrade the plan economy."
 SOF_MRS_RED_E9_desc:0 "Expand the designated, fully controlled industrial district with 1 military factory and 1 additional building slot."
 SOF_MRS_RED_M10_desc:0 "Mediterranean air-sea exercises provide 25 air XP, 15 navy XP, a 50% naval-bomber research bonus and one 50% air-doctrine discount."
 SOF_MRS_RED_M3_desc:0 "The Red Army officer school adds a research slot up to three when Marseille has 2 civilian and 2 military factories. Also gain 20 army XP and a 50% land-doctrine discount; at the slot cap, receive a 100% electronics bonus."
 SOF_MRS_RED_M6_desc:0 "Complete the army reform with an equipment pool for two six-battalion infantry formations: 1,200 infantry weapons, 120 artillery and 100 support equipment. Gain 30 army XP and one 50% land-doctrine discount, and remove the temporary reform penalty."
 SOF_MRS_RED_M9_desc:0 "Expand the Mediterranean naval programme to 2 new dockyards with building space, 20 convoys, 25 navy XP and a 100% destroyer research bonus."
