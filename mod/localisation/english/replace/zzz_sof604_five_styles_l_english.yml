l_english:
 sof_lil36_coal_steel_chain_desc:0 "Coal, steel and rail form a reliable production chain: factory output +25% and production efficiency growth +20%. Keep the three northern hubs under full control to sustain the gain."
 SOF_LIL36_engine_of_the_economy_desc:0 "National transport and the strategic rear\n\nMake northern coal, steel, labour and heavy formations the industrial foundation of a united France. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_lil36_modern_army_desc:0 "Unified training, command and reinforcement raise army organisation and recovery by 20%. Staff training adds another 5% organisation to the mature army."
 SOF_LIL36_modernized_army_desc:0 "National forces and reunification\n\nMake northern coal, steel, labour and heavy formations the industrial foundation of a united France. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_mrs_red_plan_heavy_desc:0 "Concentrate equipment, steel and labour in heavy industry: construction +20%, factory output +25% and efficiency cap +20%, at +5% consumer-goods demand. Mature central coordination adds 3% factory output."
 sof_mrs_red_plan_civil_desc:0 "Expand civilian facilities and stabilise production: construction and factory output +20%, with consumer-goods demand -2%. This direction is exclusive with the heavy-industry plan."
 sof_mrs_red_cadres_desc:0 "Professional cadres and experienced commanders grant army attack +20% and army experience gain +25%. Exclusive with the mass-army direction."
 sof_mrs_red_mass_desc:0 "Build a broad mass army: organisation +20% and recruitable population +0.5 percentage points, at +5% training time. Exclusive with the cadre-army direction."
 sof_brt_science_bureau_desc:0 "The reformed technical institute connects research with production experience: research speed +20%, efficiency growth +20% and retention +25%."
 SOF_BRT_E10_desc:0 "Modern state and research mobilisation\n\nCombine parliamentary consent and Atlantic industry in a common national project for France. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_brt_initiative_desc:0 "Turn the long offensive programme into operational initiative: army attack +14% and planning speed +8%, at +5% supply use. The programme adds 6% attack for a sustained total of 20%."
 SOF_BRT_O35_desc:0 "National mission and political order\n\nCombine parliamentary consent and Atlantic industry in a common national project for France. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_van_prs_fra_market_dynamism_desc:0 "A dynamic market and industrial cooperation grant efficiency cap +25% and efficiency growth +20%, while retaining the industrial research bonus."
 SFP_stimulate_the_dynamic_market_desc:0 "Strategic industry and the war economy\n\nRestore a French national government through Parisian institutions, public finance and research networks. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_van_prs_fra_revolutionary_zeal_desc:0 "Revolutionary resolve grants army attack +20% and core-territory defence +15%. It can coexist with Equality, Liberty and Solidarity on the common revolutionary route."
 SFP_revolutionary_zeal_desc:0 "National mission and political order\n\nRestore a French national government through Parisian institutions, public finance and research networks. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_van_prs_fra_egalite_liberte_solidarite_desc:0 "Common reconstruction grants factory and dockyard output +25%, plus core attack and defence +10%. Combined with Revolutionary Zeal it builds a mature core-territory defence and offensive."
 SFP_egalite_liberte_solidarite_desc:0 "National mission and political order\n\nRestore a French national government through Parisian institutions, public finance and research networks. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 SFP_nationalize_key_industry_desc:0 "Strategic industry and the war economy\n\nRestore a French national government through Parisian institutions, public finance and research networks. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 sof_van_cor_ita_italys_destiny_idea_desc:0 "Island dockyards and capital ships form a mature naval system: dockyard output +25% and capital-ship attack +20%, retaining construction, positioning and spotting benefits."
 SFC_italys_destiny_desc:0 "Complete the diplomatic and naval preparations and support the fleet with mature dockyards: dockyard output +25% and capital-ship attack +20%."
 SFC_divisioni_alpine_desc:0 "National mission and political order\n\nUse island industry, ports and expeditionary forces to carry a French unification project across the sea. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 SFC_institute_the_five_year_plan_desc:0 "Concentrate five years of investment: civilian and military construction each gain 20 percentage points, retaining the 25% cap. Dockyard and infrastructure construction each gain 10 points, at a 5% stability cost."
 SFC_improve_the_industries_desc:0 "Strategic industry and the war economy\n\nUse island industry, ports and expeditionary forces to carry a French unification project across the sea. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 SFC_il_sol_dell_avvenire_desc:0 "National mission and political order\n\nUse island industry, ports and expeditionary forces to carry a French unification project across the sea. This stage contributes to national leadership, reunification and reconstruction. Its native effects below specify the actual investment and rewards. Home-region construction remains geographically restricted; France is proclaimed only through the existing national conditions."
 SFC_empower_the_unions_desc:0 "Bring unions into mature production organisation and raise efficiency growth to at least 20%, retaining output, building-space and controlled-region civilian-factory rewards."
