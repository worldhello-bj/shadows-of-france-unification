 sof_chr_region_ren_t:0 "From Regional Council to National Compact"
 sof_chr_region_ren_d:0 "The council in Rennes asks how autonomy can become a foundation for French unity rather than a safeguard against it. Coastal delegates seek common naval command and Atlantic access; inland representatives insist on explicit regional rights. The debate concerns a national programme open to other provinces. A maritime organisation and an autonomy compact offer different answers to why France should trust Brittany.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
