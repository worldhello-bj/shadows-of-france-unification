 sof_chr_mandate_t:0 "Who Can Speak for France?"
 sof_chr_mandate_d:0 "A national mandate has been secured, but a mandate does not decide who supervises government. Supporters see an end to fragmentation; sceptics fear a change of rulers alone. The cabinet must turn a declaration into institutions. Concentrated responsibility speeds decisions, while consultation can broaden consent. The choice shapes lasting authority without replacing parties, elections or the existing conditions for unification.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_mandate_option_a:0 "Define executive responsibility (35 political power)"
 sof_chr_mandate_option_b:0 "Establish consultation and oversight (35 political power)"
 sof_chr_mandate_news_actor_t:0 "Our Policy: Who Can Speak for France?"
 sof_chr_mandate_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Define executive responsibility\".\n\nThe debate over who can speak for France has reached institutions. Central offices will organise responsibility under the chosen policy, while regions judge authority through explained orders and fulfilled commitments. Everyday government will test whether the national mandate endures."
 sof_chr_mandate_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish consultation and oversight\".\n\nThe debate over who can speak for France has reached institutions. Central offices will organise responsibility under the chosen policy, while regions judge authority through explained orders and fulfilled commitments. Everyday government will test whether the national mandate endures."
