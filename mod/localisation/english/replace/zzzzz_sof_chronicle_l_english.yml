 sof_chr_recovery_t:0 "The National Pledge After Retreat"
 sof_chr_recovery_d:0 "Surrender pressure has receded, allowing the unification project to reorganise after retreat. Officers seek to turn lessons into common staff procedures; delegates want accountability for earlier sacrifices. Professional command competes with renewed citizen mobilisation. This replaces the existing command spirit rather than stacking policies. A recovering front does not mean that national unification is complete.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_recovery_option_a:0 "Write the lessons into staff institutions (25 political power)"
 sof_chr_recovery_option_b:0 "Renew citizen mobilisation obligations (25 political power)"
 sof_chr_recovery_news_actor_t:0 "Our Policy: The National Pledge After Retreat"
 sof_chr_recovery_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Write the lessons into staff institutions\".\n\nEarlier surrender pressure has receded and the government has adjusted common command. Campaign lessons and civic obligations are entering durable organisation rather than remaining a celebratory message. Recovery creates room for the national project without completing unification."
 sof_chr_recovery_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Renew citizen mobilisation obligations\".\n\nEarlier surrender pressure has receded and the government has adjusted common command. Campaign lessons and civic obligations are entering durable organisation rather than remaining a celebratory message. Recovery creates room for the national project without completing unification."
