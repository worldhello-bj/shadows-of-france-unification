 sof_chr_unitary_t:0 "Responsibility Under Common Law"
 sof_chr_unitary_d:0 "The existing constitutional procedure has selected a centralised route. Debate now concerns constraints on national authority. Administrators seek a clear executive chain; delegates seek public review. Unified responsibility competes with central deliberation and oversight. Both remain within the selected route. This event cannot switch to federalism and retains only one constitutional policy spirit.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_unitary_option_a:0 "Unify the administrative chain of responsibility (40 political power)"
 sof_chr_unitary_option_b:0 "Establish central review and oversight (40 political power)"
 sof_chr_federal_t:0 "One State, Regional Representation"
 sof_chr_federal_d:0 "The existing constitutional procedure has selected a federal route. Delegates discuss how common finance and defence will coexist with regional rights. Defined responsibilities can stabilise cooperation; equal participation and consultation can institutionalise consent. Both policies stay within the selected framework. Neither annexes members nor switches to centralisation, and each replaces the previous constitutional spirit.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_federal_option_a:0 "Define common fiscal responsibilities (40 political power)"
 sof_chr_federal_option_b:0 "Protect equal regional deliberation (40 political power)"
 sof_chr_compact_t:0 "A Compact After Expansion"
 sof_chr_compact_d:0 "With more than one hundred fully controlled French states, the original regional administration can no longer explain responsibilities across the growing state. Regions seek consistent rules and a voice for familiar representatives. Common administrative standards compete with delegation under a shared government. The choice replaces the previous integration policy and does not bypass territorial or legal requirements for unification.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_compact_option_a:0 "Complete common state standards (35 political power)"
 sof_chr_compact_option_b:0 "Define delegated regional responsibility (35 political power)"
 sof_chr_victory_t:0 "After a Regional Campaign"
 sof_chr_victory_d:0 "A regional government with its own national programme has capitulated in a war against us. The campaign tests command and creates new political responsibilities. Officers seek professional staff reform, while delegates favour a broader civic basis for the army. Capitulation does not establish ownership of all enemy territory. This event annexes nothing and grants no cores; it adjusts command institutions.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_victory_option_a:0 "Apply the lessons to common staff work (25 political power)"
 sof_chr_victory_option_b:0 "Broaden civic responsibility after victory (25 political power)"
 sof_chr_government_t:0 "A New Government and the National Pledge"
 sof_chr_government_d:0 "A change in ruling ideology has reached the administration. Supporters expect a new direction; other regions ask whether national commitments will be reinterpreted. Clear executive responsibility can explain continuity, while public consultation can renew consent. The event addresses an existing political change. It changes no ideology, appoints no minister and bypasses no party focus conditions.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_government_option_a:0 "Publish collective executive responsibility (25 political power)"
 sof_chr_government_option_b:0 "Renew public consultation (25 political power)"
 sof_chr_education_t:0 "Educating a National Generation"
 sof_chr_education_d:0 "Schools, research institutions and industrial training networks face a shared question: which skills and public obligations does the new France need? Engineers seek common technical standards; delegates want reconstruction to include veterans and war-affected families. A national production system competes with public support for social participation. Both provide lasting institutions rather than a one-off research discount.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_education_option_a:0 "Coordinate technical education and production (35 political power)"
 sof_chr_education_option_b:0 "Protect social recovery and civilian capacity (35 political power)"
 sof_chr_demobilisation_t:0 "National Life After the Army"
 sof_chr_demobilisation_d:0 "Formal unification is complete and the state is at peace, but wartime organisation will not disappear automatically. Return to civilian life, public budgets and military obligations must be adjusted together. Services for veterans compete with broader support for war-affected families and workers. The lasting spirit creates no population, equipment or factories; a peaceful society still has to be rebuilt.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_demobilisation_option_a:0 "Organise veteran and return services (35 political power)"
 sof_chr_demobilisation_option_b:0 "Establish shared social reconstruction (35 political power)"
 sof_chr_demobilisation_news_actor_t:0 "Our Policy: National Life After the Army"
 sof_chr_demobilisation_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Organise veteran and return services\".\n\nPeace after formal unity has created new public responsibilities. Veterans, return to civilian life and war-affected families now form part of continuing social policy. The state is bringing those it mobilised back into civic life. Durable services and actual recovery will measure the quality of peace."
 sof_chr_demobilisation_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish shared social reconstruction\".\n\nPeace after formal unity has created new public responsibilities. Veterans, return to civilian life and war-affected families now form part of continuing social policy. The state is bringing those it mobilised back into civic life. Durable services and actual recovery will measure the quality of peace."
