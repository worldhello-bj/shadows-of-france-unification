 sof_chr_region_str_t:0 "Alsace in a Common State"
 sof_chr_region_str_d:0 "Strasbourg discusses Rhine industry alongside language, law and citizenship. Alsace must have a clear place in a united French compact, beyond serving as an industrial borderland for requisition. Technical standards and education offer one contribution; a civic and regional rights compact offers another. Neither declaration changes borders or citizenship automatically. State institutions must still be established through the existing unification process.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
