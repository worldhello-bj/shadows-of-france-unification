 sof_chr_region_tou_b_desc:0 "A continuing national programme proposed by Midi-Pyrenees. Its institutional contribution does not replace focus conditions, construction, unification requirements or operational preparation."
 sof_chr_region_tou_t:0 "A National Project in the Sky"
 sof_chr_region_tou_d:0 "Toulouse believes aircraft can cross the barriers created by regional warfare. Delegates reply that air routes cannot substitute for political unity: education, industry and command need common institutions. An aviation organisation can support a national army; a broader civic compact can connect research and training to state formation. The aircraft, bases and operational preparation still have to be built through subsequent plans.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
