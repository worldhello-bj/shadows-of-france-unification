 sof_chr_region_trs_t:0 "A State at the End of the Railway"
 sof_chr_region_trs_d:0 "Tours sees railways and armaments networks as a framework for reconnecting divided regions. Dispatchers can send a train to a station, but cannot decide why its inhabitants should accept a common government. The Centre can offer unified transport and supply command or agree passage rights, obligations and oversight with other regions. A functioning state, rather than a railway opening ceremony, is the intended destination.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_region_trs_option_a:0 "National Railway and Supply Authority (25 political power)"
 sof_chr_region_trs_option_b:0 "Regional Passage and Supply Compact (25 political power)"
 sof_chr_region_trs_news_actor_t:0 "Our Centre Programme"
 sof_chr_region_trs_news_actor_a_d:0 "Our delegates have adopted a continuing national institutional programme.\n\nThe programme establishes the National Railway and Supply Authority as its institutional vehicle. Supporters expect durable capacity for cooperation across regional boundaries; sceptics insist that commitments must be tested through action.\n\nThe announcement changes no provincial control, legal ownership or permission to declare war. Unification still depends on actual military and political developments."
 sof_chr_region_trs_news_actor_b_d:0 "Our delegates have adopted a continuing national institutional programme.\n\nThe programme establishes the Regional Passage and Supply Compact as its institutional vehicle. Supporters expect durable capacity for cooperation across regional boundaries; sceptics insist that commitments must be tested through action.\n\nThe announcement changes no provincial control, legal ownership or permission to declare war. Unification still depends on actual military and political developments."
