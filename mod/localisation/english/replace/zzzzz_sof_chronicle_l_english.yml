 sof_chr_region_lyo_t:0 "Engineering a State"
 sof_chr_region_lyo_d:0 "Lyon can equip a modern army, yet modernisation must also reach institutions. Technical education, standards and central coordination must advance together if industry is to become state capacity. Delegates propose an engineering-led cooperation system or a public compact linking industry to civic commitments across regions. Both seek to place the Rhône-Alps industrial network at the service of French unity.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
