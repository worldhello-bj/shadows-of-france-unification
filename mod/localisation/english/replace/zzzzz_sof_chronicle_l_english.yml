 sof_chr_region_mop_t:0 "Southern Supply and National Politics"
 sof_chr_region_mop_d:0 "Montpellier argues that southern mobilisation must cross local political boundaries. Food, roads and inland transport can sustain unification, but requisition without common rules would destroy public support. A national supply authority competes with a mobilisation compact defining local obligations and civic rights. Languedoc-Roussillon seeks durable organisation rather than a temporary victory through another requisition.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
