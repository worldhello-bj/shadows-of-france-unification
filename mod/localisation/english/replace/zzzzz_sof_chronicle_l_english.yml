 sof_chr_memorial_t:0 "How the State Remembers the War"
 sof_chr_memorial_d:0 "Peace cannot be commemorated through the victory story of one region alone. The fallen, ordinary families and different political traditions seek a place in national memory. Shared civic responsibility competes with public archives and research preserving the complexity of war. Both create a lasting spirit and replace the same memory policy. No invented casualty total is needed to make the state’s story meaningful.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_memorial_option_a:0 "Establish common civic commemoration (25 political power)"
 sof_chr_memorial_option_b:0 "Open archives and public research (25 political power)"
 sof_chr_memorial_news_actor_t:0 "Our Policy: How the State Remembers the War"
 sof_chr_memorial_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish common civic commemoration\".\n\nWar memory is moving beyond the victory story of one region towards a national public responsibility. The selected policy will organise commemoration and research, bringing local experiences into common records. The state’s story needs no invented casualty figures, but an account of how communities emerged from fragmentation."
 sof_chr_memorial_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Open archives and public research\".\n\nWar memory is moving beyond the victory story of one region towards a national public responsibility. The selected policy will organise commemoration and research, bringing local experiences into common records. The state’s story needs no invented casualty figures, but an account of how communities emerged from fragmentation."
