 sof_chr_unrest_t:0 "War and Government Credibility"
 sof_chr_unrest_d:0 "Falling stability has become impossible for the cabinet to ignore. Regions disagree over the burden of war, and unexplained demands for sacrifice can weaken the rear. The government can strengthen emergency coordination or invite local oversight of requisition and public obligations. The 180-day measures carry a trade-off. They do not erase discontent; they select a way to govern through it.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_unrest_option_a:0 "Strengthen emergency coordination (20 political power)"
 sof_chr_unrest_option_b:0 "Organise local oversight and consultation (20 political power)"
 sof_chr_fatigue_t:0 "Mobilisation Without an End Date"
 sof_chr_fatigue_d:0 "War support is falling. Soldiers and families ask when mobilisation will end. Officers stress morale, while civil officials seek acknowledgement of burdens and protection for public life. A temporary mobilisation campaign competes with a home-front compact attentive to social endurance. The spirits last 180 days and end earlier in peace. Neither ends the war automatically or treats exhaustion as betrayal.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_fatigue_option_a:0 "Sustain a common mobilisation effort (20 political power)"
 sof_chr_fatigue_option_b:0 "Renew the home-front burden compact (20 political power)"
 sof_chr_retreat_t:0 "The Unification Project in Retreat"
 sof_chr_retreat_d:0 "Territorial losses have raised surrender pressure substantially. The cabinet can no longer regard setbacks as the problem of a single formation. The national programme depends on whether organisation and public confidence can survive retreat. Concentrated defence and supply compete with open responsibility and social protection. Temporary measures carry costs and recover no province. A counteroffensive still requires actual forces.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_retreat_option_a:0 "Concentrate defence and supply depth (25 political power)"
 sof_chr_retreat_option_b:0 "Maintain trust through public responsibility (25 political power)"
 sof_chr_retreat_news_actor_t:0 "Our Policy: The Unification Project in Retreat"
 sof_chr_retreat_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Concentrate defence and supply depth\".\n\nLosses at the front have raised surrender pressure, prompting temporary crisis measures. Supply, political responsibility and public confidence now form one national question. Supporters hope institutions will sustain the project through retreat, although only actual forces can recover territory."
 sof_chr_retreat_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Maintain trust through public responsibility\".\n\nLosses at the front have raised surrender pressure, prompting temporary crisis measures. Supply, political responsibility and public confidence now form one national question. Supporters hope institutions will sustain the project through retreat, although only actual forces can recover territory."
