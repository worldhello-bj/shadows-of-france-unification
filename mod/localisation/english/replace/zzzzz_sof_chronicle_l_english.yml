 sof_chr_region_mrs_t:0 "A Republic Beyond the Harbour"
 sof_chr_region_mrs_d:0 "Marseilles connects overseas commerce to southern society, but neither a shipping network nor a road network is a national government. Port workers, officers and delegates debate a Mediterranean supply system against a political compact capable of attracting other provinces. The harbour must become a gateway for a new state. Its institutions will shape mobilisation without replacing the existing political and diplomatic choices.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
