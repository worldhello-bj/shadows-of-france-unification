 sof_chr_region_lil_t:0 "A State Forged in Coal and Steel"
 sof_chr_region_lil_d:0 "Lille can supply a unification campaign through coal, steel and engineering. Trade unions and local delegates answer that productive capacity does not create national legitimacy by itself. A central procurement and armoured-force system competes with a mobilisation compact involving producers. The choice concerns how a state is organised. Actual forces and supplies will still have to carry its programme beyond the northern industrial basin.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
