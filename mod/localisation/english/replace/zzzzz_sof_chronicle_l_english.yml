 sof_chr_cabinet_t:0 "A Cabinet Answerable for the State"
 sof_chr_cabinet_d:0 "Historical ministers bring experience, political connections and departmental habits. The cabinet must decide whether they exercise separate authority or accept collective responsibility. Concentration clarifies orders; open coordination can secure wider support. This decision changes how government works. It appoints no character and does not bypass appointment costs, political eligibility or exclusive service.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_cabinet_option_a:0 "Establish collective executive responsibility (25 political power)"
 sof_chr_cabinet_option_b:0 "Bind departments through public coordination (25 political power)"
 sof_chr_supply_t:0 "The Rear of the Unification War"
 sof_chr_supply_d:0 "The front now demands supply on a national scale. Separate local reserves cannot match the tempo, yet handing transport entirely to the army would crowd out civilian life. The government must prioritise coordinated military supply or protect civilian transport and share the burden through negotiation. The wartime spirit lasts 180 days and ends earlier in peace. It creates neither railways nor stockpiles.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_supply_option_a:0 "Prioritise military transport (25 political power)"
 sof_chr_supply_option_b:0 "Protect civilian transport and coordination (25 political power)"
 sof_chr_war_budget_t:0 "The State Budget at War"
 sof_chr_war_budget_d:0 "As war continues, improvised fundraising begins to erode regular administration. Fiscal officials propose common procurement and long-term production schedules; delegates seek to preserve the civilian economy. A sudden grant of political resources is no budget system. The choice sets a continuing economic priority, with either stronger military output or steadier civilian coordination and an associated trade-off.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_war_budget_option_a:0 "Adopt common wartime procurement (35 political power)"
 sof_chr_war_budget_option_b:0 "Protect the production balance (35 political power)"
 sof_chr_war_budget_news_actor_t:0 "Our Policy: The State Budget at War"
 sof_chr_war_budget_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Adopt common wartime procurement\".\n\nProlonged war has exposed the limits of improvised fundraising. A continuing economic policy now addresses the conflict between military and civilian production, acknowledging that one priority burdens the other. Budgeting is becoming a national institution rather than another emergency collection."
 sof_chr_war_budget_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Protect the production balance\".\n\nProlonged war has exposed the limits of improvised fundraising. A continuing economic policy now addresses the conflict between military and civilian production, acknowledging that one priority burdens the other. Budgeting is becoming a national institution rather than another emergency collection."
