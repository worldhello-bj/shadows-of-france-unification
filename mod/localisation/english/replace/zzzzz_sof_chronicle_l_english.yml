 sof_chr_reconstruction_finish_t:0 "Reconstruction Beyond a Declaration"
 sof_chr_reconstruction_finish_d:0 "The existing reconstruction institutions have confirmed completion, but the state must decide how to sustain their work. Veterans and war-affected families seek continuing services; administrators seek durable public responsibility. Return services compete with broader social reconstruction. This respects the existing completion flag, adjusts the welfare spirit and grants no factories or duplicate completion reward.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_reconstruction_finish_option_a:0 "Maintain veteran and return services (25 political power)"
 sof_chr_reconstruction_finish_option_b:0 "Make social recovery a regular responsibility (25 political power)"
 sof_chr_reconstruction_finish_news_actor_t:0 "Our Policy: Reconstruction Beyond a Declaration"
 sof_chr_reconstruction_finish_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Maintain veteran and return services\".\n\nWith the existing reconstruction programme complete, government is turning to the long-term maintenance of social recovery. Services are becoming regular responsibilities rather than temporary postwar measures. Completion ends a phase; it does not imply that every family and region has overcome hardship."
 sof_chr_reconstruction_finish_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Make social recovery a regular responsibility\".\n\nWith the existing reconstruction programme complete, government is turning to the long-term maintenance of social recovery. Services are becoming regular responsibilities rather than temporary postwar measures. Completion ends a phase; it does not imply that every family and region has overcome hardship."
