 sof_chr_integration_news_observer_b_d:0 "[sof_chr_actor.GetName] has adopted a continuing policy through a national discussion.\n\nThe chosen policy is \"Integrate through local delegation\".\n\nAfter directly owning and fully controlling at least fifty French states, the government is addressing conflicting accounts, rules and local institutions. The chosen policy seeks to turn an expanded administration into a sustainable state. Military gains now face the test of public responsibility."
 sof_chr_congress_t:0 "Delegates at the National Congress"
 sof_chr_congress_d:0 "The national congress is authorised, and delegates ask whether proceedings can influence government decisions. A declaration of consensus alone cannot settle fears about authority. Clear executive responsibility competes with permanent public consultation. The congress remains part of the existing unification route. This decision changes no other country’s faction membership and signs no accession agreement on its behalf.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_congress_option_a:0 "Clarify collective execution of decisions (30 political power)"
 sof_chr_congress_option_b:0 "Establish continuing representative consultation (30 political power)"
 sof_chr_congress_news_actor_t:0 "Our Policy: Delegates at the National Congress"
 sof_chr_congress_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Clarify collective execution of decisions\".\n\nThe congress is becoming more than an invitation list. A policy now defines how deliberation relates to execution, and regions will judge whether representatives can influence common decisions. Participation and accession retain their political and diplomatic procedures; slogans cannot sign missing agreements."
 sof_chr_congress_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish continuing representative consultation\".\n\nThe congress is becoming more than an invitation list. A policy now defines how deliberation relates to execution, and regions will judge whether representatives can influence common decisions. Participation and accession retain their political and diplomatic procedures; slogans cannot sign missing agreements."
