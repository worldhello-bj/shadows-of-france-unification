 sof_chr_archives_t:0 "Bringing the Divided Archives Together"
 sof_chr_archives_d:0 "Commemoration is established, but regional administrative and war records still disagree. Researchers favour open material that acknowledges real differences; the government can instead emphasise common civic obligations. The choice adjusts the same national memory spirit without stacking rewards or claiming to settle a specific historical controversy automatically. A shared experience should be recorded as well as proclaimed.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_archives_option_a:0 "Organise memory around common responsibility (20 political power)"
 sof_chr_archives_option_b:0 "Preserve differences through archives and research (20 political power)"
 sof_chr_foreign_t:0 "A United France Faces the World"
 sof_chr_foreign_d:0 "Unification does not mean that the outside world accepts every claim of the new government. Diplomats must explain its responsibilities for security, trade and cooperation. Common defence and credible deterrence compete with recognition and continuing diplomacy. The lasting policy spirit claims no territory, forces no country into a faction and creates no world war.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_foreign_option_a:0 "Seek standing through common defence (40 political power)"
 sof_chr_foreign_option_b:0 "Establish continuing diplomacy and cooperation (40 political power)"
 sof_chr_foreign_news_actor_t:0 "Our Policy: A United France Faces the World"
 sof_chr_foreign_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Seek standing through common defence\".\n\nA reunited France is defining its responsibilities internationally. Common defence, standing, recognition and cooperation will follow the selected priority. External relations still require actual diplomacy. The policy transfers no territory and creates no commitment on behalf of another state."
 sof_chr_foreign_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish continuing diplomacy and cooperation\".\n\nA reunited France is defining its responsibilities internationally. Common defence, standing, recognition and cooperation will follow the selected priority. External relations still require actual diplomacy. The policy transfers no territory and creates no commitment on behalf of another state."
