 sof_chr_hundred_news_actor_d:0 "Our government must address the national responsibilities created by this development.\n\n[sof_chr_actor.GetName] owns and fully controls at least one hundred French states. The growing administration must reconcile common law, representation and public finance. A regional base is giving way to a larger state framework.\n\nThis threshold measures direct administration. It is not complete control of France and does not replace constitutional settlement, proclamation or postwar institutions."
