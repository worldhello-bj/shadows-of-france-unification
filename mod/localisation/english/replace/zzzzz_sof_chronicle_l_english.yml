 sof_chr_region_met_t:0 "Steel and National Frontiers"
 sof_chr_region_met_d:0 "Metz argues that eastern defence is a French responsibility. Lorraine metallurgy and armaments can support unification, but without common institutions they can also become prizes for competing authorities. Industrial delegates favour shared standards and procurement; local representatives want explicit rights and obligations in a defence community. The question is how a state will protect and organise eastern industry.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
