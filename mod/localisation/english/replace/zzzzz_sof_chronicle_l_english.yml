 sof_chr_settlement_t:0 "Political Goals After Military Goals"
 sof_chr_settlement_d:0 "The postwar settlement focus is complete. The government must turn its national mission into institutions for peace. Central standards can clarify responsibility; delegation can show regions how their commitments will be respected. This replaces the existing integration spirit and respects the selected central or federal framework. The national project will now be tested through ordinary government.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
