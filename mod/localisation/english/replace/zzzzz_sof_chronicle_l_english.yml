 sof_chr_region_ami_t:0 "Connecting North and South Again"
 sof_chr_region_ami_d:0 "Amiens lies between the northern front and the routes towards Paris. Holding stations alone will not reconnect France: tariffs, military scheduling and passage across regional boundaries need durable rules. Officers favour a common logistics command, while delegates demand oversight by the regions along those routes. Picardy must offer a national transport system rather than an isolated list of railway repairs.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
