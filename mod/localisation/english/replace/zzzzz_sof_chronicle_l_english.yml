 sof_chr_industry_t:0 "Production for a Nation"
 sof_chr_industry_d:0 "Industrial coordination has moved beyond its initial stage. Producers ask how orders, standards and labour will be allocated. The staff seeks reliable military procurement; civil officials point to the economy that must survive the war. A one-off delivery cannot answer them. A lasting production system will support one priority while putting pressure on another.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_industry_option_a:0 "Establish common military procurement (40 political power)"
 sof_chr_industry_option_b:0 "Coordinate civilian and military production (40 political power)"
 sof_chr_industry_news_actor_t:0 "Our Policy: Production for a Nation"
 sof_chr_industry_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish common military procurement\".\n\nCommon orders, quality standards and long-term schedules are entering the state programme. Officers seek fewer competing procurements; civil officials focus on an economy capable of surviving peace. The institutions set a continuing production priority beyond any single delivery."
 sof_chr_industry_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Coordinate civilian and military production\".\n\nCommon orders, quality standards and long-term schedules are entering the state programme. Officers seek fewer competing procurements; civil officials focus on an economy capable of surviving peace. The institutions set a continuing production priority beyond any single delivery."
