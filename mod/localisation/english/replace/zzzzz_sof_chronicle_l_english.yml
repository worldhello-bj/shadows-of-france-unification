 sof_chr_region_prs_t:0 "Paris Must Earn France Again"
 sof_chr_region_prs_d:0 "Paris retains archives, universities and the buildings of the old administration, but their presence does not confer a national mandate. Provincial correspondence asks whether a new government will establish common law and public finance or simply concentrate resources in the capital again. Delegates propose either accountable central institutions or wider participation in state formation. Both seek unification; both must earn support beyond the Seine.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
