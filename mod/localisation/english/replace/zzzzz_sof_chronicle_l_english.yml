 sof_chr_region_cfr_t:0 "The Massif Central as National Depth"
 sof_chr_region_cfr_d:0 "Clermont-Ferrand no longer treats the Massif Central as a corner outside the war. Transport, depots and reserves can provide national strategic depth under common command and cooperation. Supply officers propose a central scheduling system, while delegates seek agreed obligations among regions. Auvergne will enter the unification project through national organisation rather than waiting for the war in a mountain refuge.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
