 sof_chr_anniversary_t:0 "The First Peaceful Year After Unity"
 sof_chr_anniversary_d:0 "At least 365 uninterrupted days of peace have followed formal unification. Emergency pledges are becoming ordinary experience: can orders be explained, authority supervised and divided memories preserved? The government can reaffirm common civic responsibility or ground memory in open research. The anniversary does not claim that contradictions have vanished. It tests whether institutions can outlive wartime declarations.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_anniversary_option_a:0 "Reaffirm common civic responsibility (20 political power)"
 sof_chr_anniversary_option_b:0 "Preserve unity through public research (20 political power)"
 sof_chr_anniversary_news_actor_t:0 "Our Policy: The First Peaceful Year After Unity"
 sof_chr_anniversary_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Reaffirm common civic responsibility\".\n\nAt least 365 uninterrupted peaceful days have followed formal unity. The government has used the anniversary to reaffirm its approach to national memory, while the public tests wartime pledges through everyday life. The story of unity is moving from emergency declarations into institutions that can be judged over time."
