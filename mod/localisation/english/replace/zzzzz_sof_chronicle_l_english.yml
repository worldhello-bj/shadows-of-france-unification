 sof_chr_integration_t:0 "A State Beyond Occupation"
 sof_chr_integration_d:0 "Direct administration now covers at least fifty fully controlled French states. Different accounts, orders and local rules create duplication and conflict. Officials seek common administrative standards; delegates favour retaining familiar institutions through delegation. Military control and legal ownership remain distinct. This event grants no cores and annexes no country; it organises territory already under direct administration.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_integration_option_a:0 "Establish common administrative standards (40 political power)"
 sof_chr_integration_option_b:0 "Integrate through local delegation (40 political power)"
 sof_chr_integration_news_actor_t:0 "Our Policy: A State Beyond Occupation"
 sof_chr_integration_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish common administrative standards\".\n\nAfter directly owning and fully controlling at least fifty French states, the government is addressing conflicting accounts, rules and local institutions. The chosen policy seeks to turn an expanded administration into a sustainable state. Military gains now face the test of public responsibility."
