 sof_chr_war_news_actor_t:0 "Our Progress: War for French Unity"
 sof_chr_war_news_actor_d:0 "We have entered an openly declared war against [sof_chr_other.GetName].\n\nTwo French authorities, [sof_chr_actor.GetName] and [sof_chr_other.GetName], have entered an openly declared war. Their confrontation has moved beyond diplomacy and mobilisation. Both invoke national programmes, but their claims still depend on military outcomes and political procedure.\n\nA declaration is not an occupation, and victory is not automatically unification. Separate reports will track actual control of important cities."
 sof_chr_war_news_rival_t:0 "Other Side: War for French Unity"
 sof_chr_war_news_rival_d:0 "We have entered an openly declared war against [sof_chr_actor.GetName].\n\nTwo French authorities, [sof_chr_actor.GetName] and [sof_chr_other.GetName], have entered an openly declared war. Their confrontation has moved beyond diplomacy and mobilisation. Both invoke national programmes, but their claims still depend on military outcomes and political procedure.\n\nA declaration is not an occupation, and victory is not automatically unification. Separate reports will track actual control of important cities."
 sof_chr_war_news_observer_t:0 "War for French Unity"
 sof_chr_war_news_observer_d:0 "French political fragmentation has developed into openly declared hostilities.\n\nTwo French authorities, [sof_chr_actor.GetName] and [sof_chr_other.GetName], have entered an openly declared war. Their confrontation has moved beyond diplomacy and mobilisation. Both invoke national programmes, but their claims still depend on military outcomes and political procedure.\n\nA declaration is not an occupation, and victory is not automatically unification. Separate reports will track actual control of important cities."
 sof_chr_capitulation_news_actor_t:0 "Our Progress: Regional Capitulation"
 sof_chr_capitulation_news_actor_d:0 "[sof_chr_other.GetName] has capitulated in its war against us.\n\n[sof_chr_other.GetName] has capitulated in its war against [sof_chr_actor.GetName]. Its independent military position has been decisively weakened, and its national programme faces political and administrative reorganisation. The victor now has to accept responsibilities beyond the battlefield.\n\nCapitulation does not establish annexation of every territory or complete national unification. Ownership still follows the existing war and peace rules."
 sof_chr_capitulation_news_rival_t:0 "Other Side: Regional Capitulation"
 sof_chr_capitulation_news_rival_d:0 "We have capitulated to [sof_chr_actor.GetName]. Our postwar position remains subject to actual territorial and peace arrangements.\n\n[sof_chr_other.GetName] has capitulated in its war against [sof_chr_actor.GetName]. Its independent military position has been decisively weakened, and its national programme faces political and administrative reorganisation. The victor now has to accept responsibilities beyond the battlefield.\n\nCapitulation does not establish annexation of every territory or complete national unification. Ownership still follows the existing war and peace rules."
 sof_chr_capitulation_news_observer_t:0 "Regional Capitulation"
 sof_chr_capitulation_news_observer_d:0 "A regional government with a national programme has capitulated.\n\n[sof_chr_other.GetName] has capitulated in its war against [sof_chr_actor.GetName]. Its independent military position has been decisively weakened, and its national programme faces political and administrative reorganisation. The victor now has to accept responsibilities beyond the battlefield.\n\nCapitulation does not establish annexation of every territory or complete national unification. Ownership still follows the existing war and peace rules."
 sof_chr_annexation_news_actor_t:0 "Our Progress: Regional Incorporation"
 sof_chr_annexation_news_actor_d:0 "The independent state institutions of [sof_chr_other.GetName] have been incorporated into our administration.\n\nThe independent state institutions of [sof_chr_other.GetName] have been incorporated into [sof_chr_actor.GetName] through an actual annexation. Different accounts, personnel and public duties now require durable administration.\n\nThis report records the completed state-level incorporation. It does not describe a new city capture or presume the military, negotiated or peace-conference process that preceded it."
 sof_chr_annexation_news_rival_t:0 "Other Side: Regional Incorporation"
 sof_chr_annexation_news_rival_d:0 "Our former independent state institutions have been incorporated into [sof_chr_actor.GetName].\n\nThe independent state institutions of [sof_chr_other.GetName] have been incorporated into [sof_chr_actor.GetName] through an actual annexation. Different accounts, personnel and public duties now require durable administration.\n\nThis report records the completed state-level incorporation. It does not describe a new city capture or presume the military, negotiated or peace-conference process that preceded it."
 sof_chr_annexation_news_observer_t:0 "Regional Incorporation"
 sof_chr_annexation_news_observer_d:0 "An independent French regional administration has been incorporated into another state.\n\nThe independent state institutions of [sof_chr_other.GetName] have been incorporated into [sof_chr_actor.GetName] through an actual annexation. Different accounts, personnel and public duties now require durable administration.\n\nThis report records the completed state-level incorporation. It does not describe a new city capture or presume the military, negotiated or peace-conference process that preceded it."
 sof_chr_fifty_news_actor_t:0 "Our Progress: Fifty French States"
 sof_chr_fifty_news_actor_d:0 "Our government must address the national responsibilities created by this development.\n\n[sof_chr_actor.GetName] directly administers at least fifty fully controlled French states. Regional institutions now face larger responsibilities for resources, civil administration and military coordination.\n\nThe count includes only French states both owned and fully controlled by that government. Allied territory, a single captured city and contested states do not count. Expansion is not national unification."
 sof_chr_fifty_news_rival_t:0 "Rival: Fifty French States"
 sof_chr_fifty_news_rival_d:0 "This development affects a political authority at war with us. Military and diplomatic institutions are assessing its consequences.\n\n[sof_chr_actor.GetName] directly administers at least fifty fully controlled French states. Regional institutions now face larger responsibilities for resources, civil administration and military coordination.\n\nThe count includes only French states both owned and fully controlled by that government. Allied territory, a single captured city and contested states do not count. Expansion is not national unification."
