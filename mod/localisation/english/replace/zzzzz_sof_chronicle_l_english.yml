 sof_chr_reconstruction_t:0 "The First National Plan for Peace"
 sof_chr_reconstruction_d:0 "Constitutional and postwar institutions can now undertake reconstruction. Regions seek restored transport, production and accountability for public funds. A national transport system can reconnect the economy; public investment and regional coordination can restore civilian capacity. The choice replaces the existing reconstruction spirit. It does not bypass the reconstruction system’s progress, costs or completion conditions.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_reconstruction_option_a:0 "Connect reconstruction through national transport (40 political power)"
 sof_chr_reconstruction_option_b:0 "Organise public investment and regional cooperation (40 political power)"
 sof_chr_reconstruction_news_actor_t:0 "Our Policy: The First National Plan for Peace"
 sof_chr_reconstruction_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Connect reconstruction through national transport\".\n\nPostwar institutions are bringing transport, civilian production and accountability into a common plan. The policy establishes continuing reconstruction organisation; investment and completion remain subject to the existing institutions. Regions expect the state to accept peaceful duties as seriously as military ones."
 sof_chr_reconstruction_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Organise public investment and regional cooperation\".\n\nPostwar institutions are bringing transport, civilian production and accountability into a common plan. The policy establishes continuing reconstruction organisation; investment and completion remain subject to the existing institutions. Regions expect the state to accept peaceful duties as seriously as military ones."
