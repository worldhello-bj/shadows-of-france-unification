 sof_chr_region_nan_t:0 "Shipyards Facing the Nation"
 sof_chr_region_nan_d:0 "Nantes cannot use its shipyards merely to extend one regional government’s coastal defences. Workers, port officials and delegates debate standardised construction, training and fleet organisation against a shared maritime compact. The Loire region seeks a navy capable of supporting unification and reconstruction. Ships, supply and ports remain essential; a paper programme creates no fleet by itself.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
