 sof_chr_region_bes_t:0 "Precision Industry and Common Defence"
 sof_chr_region_bes_d:0 "Besançon can produce precision components but cannot defend the entire eastern frontier alone. Engineers propose common technical standards; regional delegates seek equal participation in collective defence. A system of quality control and technical education competes with a shared defence compact. Franche-Comté must contribute institutions to the new state, beyond the delivery of another batch of components.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
