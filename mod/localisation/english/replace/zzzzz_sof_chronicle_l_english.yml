 sof_chr_region_brd_t:0 "Credit Beyond Regional Boundaries"
 sof_chr_region_brd_d:0 "Bordeaux merchants will take risks for a new state, provided responsibility for debt and port revenue is clear. Atlantic trade can sustain unification and reconstruction, but competing regional barriers would destroy that prospect. Delegates can establish common credit and trade rules or negotiate a public compact for sharing obligations and benefits. Aquitaine seeks a France that can finance itself over time, not a single donation.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
