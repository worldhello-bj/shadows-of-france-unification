 sof_chr_region_dij_t:0 "From Metallurgy to National Coordination"
 sof_chr_region_dij_d:0 "Dijon places industrial capacity and transport in a single national programme. Metallurgy can supply weapons and roads can connect the fronts, yet competing requisitions would undermine both. Common standards and procurement offer one solution; an agreed compact for sharing resources offers another. Burgundy seeks a role in national coordination, beyond celebrating short-term output at individual works.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
