 sof_chr_region_ajc_a:0 "Mediterranean Expeditionary Council"
 sof_chr_region_ajc_a_desc:0 "A continuing national programme proposed by Corsica. Its institutional contribution does not replace focus conditions, construction, unification requirements or operational preparation."
 sof_chr_region_ajc_b:0 "Island and Continental Compact"
 sof_chr_region_ajc_b_desc:0 "A continuing national programme proposed by Corsica. Its institutional contribution does not replace focus conditions, construction, unification requirements or operational preparation."
 sof_chr_region_ajc_t:0 "France Beyond the Strait"
 sof_chr_region_ajc_d:0 "Delegates in Ajaccio spread naval charts across the table. Isolation can shelter the island from continental warfare, but it can also exclude it from the next French state. Ports, shipping and mountain troops must serve a larger purpose. The choice is between an expeditionary system and a public compact connecting island autonomy to continental cooperation. Neither declaration substitutes for transports, preparation or a secure landing.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_region_ajc_option_a:0 "Mediterranean Expeditionary Council (25 political power)"
 sof_chr_region_ajc_option_b:0 "Island and Continental Compact (25 political power)"
 sof_chr_region_ajc_news_actor_t:0 "Our Corsica Programme"
 sof_chr_region_ajc_news_actor_a_d:0 "Our delegates have adopted a continuing national institutional programme.\n\nThe programme establishes the Mediterranean Expeditionary Council as its institutional vehicle. Supporters expect durable capacity for cooperation across regional boundaries; sceptics insist that commitments must be tested through action.\n\nThe announcement changes no provincial control, legal ownership or permission to declare war. Unification still depends on actual military and political developments."
 sof_chr_region_ajc_news_actor_b_d:0 "Our delegates have adopted a continuing national institutional programme.\n\nThe programme establishes the Island and Continental Compact as its institutional vehicle. Supporters expect durable capacity for cooperation across regional boundaries; sceptics insist that commitments must be tested through action.\n\nThe announcement changes no provincial control, legal ownership or permission to declare war. Unification still depends on actual military and political developments."
