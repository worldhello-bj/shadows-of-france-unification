 sof_chr_region_chl_t:0 "The Front Cannot Be the Whole State"
 sof_chr_region_chl_d:0 "Officers in Châlons see the need for a unified field army. Civil delegates fear public life will become subordinate to an endless front. Champagne-Ardenne must offer common doctrine and command or a mobilisation compact defining civic duties and administrative responsibility. War may be unavoidable, but the army must ultimately serve a state capable of surviving peace.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
