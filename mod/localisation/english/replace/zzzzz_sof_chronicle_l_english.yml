 sof_chr_railways_t:0 "Unity in National Transport"
 sof_chr_railways_d:0 "After an initial period of reconstruction, tariffs, procedures and divided responsibilities still obstruct the common economy. Transport officials seek national scheduling; delegates prefer participation through shared investment. Political unity still requires continuing administration. This replaces the transport and investment policy spirit. It builds no railway, port or supply hub and claims no project has been completed.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_railways_option_a:0 "Complete national transport coordination (30 political power)"
 sof_chr_railways_option_b:0 "Broaden public investment responsibility (30 political power)"
 sof_chr_amnesty_t:0 "From Civil War Opponents to Citizens"
 sof_chr_amnesty_d:0 "Unity and peace force the government to address people who supported rival authorities. Military control cannot decide who may return to public life. Conditional reconciliation competes with public judicial procedures establishing responsibility. Both carry a trade-off. Neither releases an invented character nor changes a party; they establish institutions for confronting the legacy of fragmentation.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_amnesty_option_a:0 "Pursue conditional political reconciliation (35 political power)"
 sof_chr_amnesty_option_b:0 "Establish responsibility through public justice (35 political power)"
 sof_chr_amnesty_news_actor_t:0 "Our Policy: From Civil War Opponents to Citizens"
 sof_chr_amnesty_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Pursue conditional political reconciliation\".\n\nThe return of people who supported rival authorities has become a legal question for the peaceful state. The government has selected an approach to reconciliation and responsibility. Territorial unity is being followed by the harder task of rebuilding civic relations."
 sof_chr_amnesty_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Establish responsibility through public justice\".\n\nThe return of people who supported rival authorities has become a legal question for the peaceful state. The government has selected an approach to reconciliation and responsibility. Territorial unity is being followed by the harder task of rebuilding civic relations."
