 sof_chr_staff_t:0 "After the Regional Armies"
 sof_chr_staff_d:0 "More formations use similar weapons while retaining different training rules and command chains. Officers seek a common staff; delegates worry that it will exclude the communities supplying the troops. Professional command and common doctrine compete with a broader citizen mobilisation system. Both serve a national campaign, with different costs in recruitment, coordination and training.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
 sof_chr_staff_option_a:0 "Unify staff work and professional training (35 political power)"
 sof_chr_staff_option_b:0 "Organise national citizen mobilisation (35 political power)"
 sof_chr_staff_news_actor_t:0 "Our Policy: After the Regional Armies"
 sof_chr_staff_news_actor_a_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Unify staff work and professional training\".\n\nTraining rules and command chains are no longer treated as private traditions of each formation. The government has selected an approach to common command, with different duties for officers and communities. Actual forces, equipment and training must still fulfil the commitment."
 sof_chr_staff_news_actor_b_d:0 "Our government has chosen a policy for this national question.\n\nThe chosen policy is \"Organise national citizen mobilisation\".\n\nTraining rules and command chains are no longer treated as private traditions of each formation. The government has selected an approach to common command, with different duties for officers and communities. Actual forces, equipment and training must still fulfil the commitment."
