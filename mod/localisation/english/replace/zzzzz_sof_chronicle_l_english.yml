 sof_chr_region_poi_t:0 "Armaments and the Promise of Unity"
 sof_chr_region_poi_d:0 "Poitiers links western armaments production to national politics. Common specifications can reduce supply confusion, but the authority issuing orders must also be accountable to other regions. Technicians favour a shared armaments system; delegates seek an open resource and civic compact. Poitou-Charentes will contribute lasting institutions, beyond claiming that a single delivery has accomplished unity.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
