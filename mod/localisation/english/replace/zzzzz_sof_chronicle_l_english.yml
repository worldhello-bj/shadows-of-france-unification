 sof_chr_region_rou_t:0 "A National Programme for the Channel Gateway"
 sof_chr_region_rou_d:0 "Rouen connects the Channel to the interior through ports and river routes. Officers seek coordinated sea and land operations; delegates warn against a maritime enclave concerned only with commerce. Normandy can organise port, fleet and inland supply systems or share responsibility for access with interior regions. The programme begins at the Channel, but its destination is a reconnected France.\n\nPolicy choices require political power. A new spirit replaces the existing policy in the same field. Keeping the current approach costs nothing and adds no spirit; this discussion then ends."
