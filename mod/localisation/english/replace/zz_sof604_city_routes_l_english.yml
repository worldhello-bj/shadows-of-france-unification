l_english:
 SFP_invest_in_the_colonies_desc:0 "Bring local reconstruction into a common budget. Build one civilian factory with one additional slot in an eligible fully controlled French state; when capacity is exhausted, fund one 100% industry research bonus instead. Existing local-compliance improvements continue."
 sof_region_DIJ_1936_yards_desc:0 "Expand Dijon’s railway workshops with one civilian factory and one building slot. When factory capacity is exhausted, fund one 100% train-technology research bonus instead."
 sof_region_DIJ_1936_charter_desc:0 "Build a local charter on Dijon’s fiscal institutions, authorising administrative preparation, reserve organisation and railway coordination."
 sof_ne_ROU_tolls_desc:0 "Bring Rouen warehouse revenues and Seine transport charges into a public budget, building stable finances for cooperation among the port cities."
 sof_ne_ROU_coastal_reserves_desc:0 "Organise garrison training through municipal institutions and reserve cadres, delivering 600 rifles and 15 army experience."
 sof_region_BES_1936_municipal_desc:0 "Use Besancon’s local compact to coordinate municipal budgets and workshops, establishing rules for regional cooperation among the towns."
 sof_region_BES_1936_small_machines_desc:0 "Bring technical standards, trained workers and local capital into Besancon’s machine-tool workshops. Add two building slots and two civilian factories. Each factory prevented by the capacity limit funds one 100% industry research bonus instead."
 sof_region_LYO_1936_hearing_desc:0 "Combine local accounts with the views of regional delegates to give Lyon’s finances and regional cooperation a common public foundation."
 sof_region_NAN_1936_charter_desc:0 "Build a lasting Nantes charter from municipal institutions and port cooperation, coordinating public budgets and regional representation."
 SOF_MRS_RED_E6_desc:0 "Deliver 80 trucks and open transport-investment decisions for controlled port-to-inland routes. Commit civilian industry to build the Rhone transport corridor."
 sof604_dij_yards_railway:0 "Dijon Railway Workshops"
 sof604_paris_local_development:0 "Local Industrial Reconstruction"
 sof604_bes_machine_tool_innovation:0 "Besancon Machine-Tool Innovation"
