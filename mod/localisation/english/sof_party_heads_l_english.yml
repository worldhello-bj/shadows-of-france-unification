l_english:
 sof603_party_pcf_desc:0 "法国共产党（PCF）｜莫里斯·多列士。以马克思主义—列宁主义、工人组织与共产国际联系为基础。1936年实行人民阵线战略，与SFIO和激进党联合反法西斯，支持集体合同及社会改革；布鲁姆组阁后，共产党提供议会支持而不参加内阁。"
 sof603_party_sfio_desc:0 "工人国际法国支部（SFIO）｜莱昂·布鲁姆。坚持社会主义目标、普选与议会民主，依靠工会和地方组织推动劳工改革。1936年的施政重点是带薪休假、四十小时工作周、集体合同和公共经济干预；党内同时存在改革节奏与外交政策上的分歧。"
 sof603_party_prrrs_desc:0 "共和、激进与激进社会主义党（PRRRS）｜爱德华·达拉第。以世俗共和、议会制度和公民平等为核心，维护农民、小业主及中产阶层。1936年加入人民阵线，同时坚持私人财产和财政责任，重视教育、地方公共建设及国家防务。"
 sof603_party_usr_desc:0 "社会主义共和联盟（USR）｜约瑟夫·保罗-邦库尔。1935年由共和社会主义者及SFIO右侧的多个团体组成，参加人民阵线，支持议会联合、经济干预与集体安全。保罗-邦库尔的共和改革主义与联盟内部新社会主义者的强国家、计划主义主张并存。"
 sof603_party_pup_desc:0 "无产阶级统一党（PUP）｜路易·塞利耶。1930年由共产主义异议团体合并形成，在共产党与SFIO之间坚持独立工人政治，拥有巴黎等地的市政和议会据点。1936年参加人民阵线，以劳工保障、地方公共服务和左翼合作争取支持。"
 sof603_party_rg_ad_desc:0 "民主联盟与共和左派（AD／RG）｜皮埃尔-艾蒂安·弗朗丹。属于共和中右翼的自由主义传统，支持私人企业、稳健货币、财政平衡和议会政府。1936年反对人民阵线的主要经济路线，主张通过企业投资、行政协调与中间派联合恢复经济。"
 sof603_party_fr_urd_desc:0 "共和联盟与共和民主联合党团（FR／URD）｜路易·马兰。共和右翼的保守民族主义力量，强调财产、家庭、宗教自由、公共秩序和强大国防，并坚决反共。其议员与地方名流网络广泛，内部从议会保守派到更强硬民族主义者均有。"
 sof603_party_pdp_desc:0 "人民民主党（PDP）｜奥古斯特·尚佩蒂耶·德里布。以基督教民主和社会天主教为纲领，承认共和制度，支持劳工保障、家庭政策和社会调解。在1936年左右分化的中间阵营中，努力兼顾宗教自由、民主政治与欧洲安全合作。"
 sof603_party_upr_desc:0 "阿尔萨斯人民共和联盟（UPR）｜欧仁·米勒。阿尔萨斯的天主教地方政党，维护宗教教育、地方宗教制度与区域文化权利，依托教区、乡村和地方议员网络。党内存在亲法派与自治派，区域权利和社会天主教构成其共同政治基础。"
 sof603_party_doriot_desc:0 "多里奥派｜雅克·多里奥。以圣但尼市政和工人选区为组织基础，1934年与共产党决裂。1936年上半年仍处于政治转向之中；6月28日成立法国人民党（PPF）后，以反共、民族团结和领袖动员组织支持，其政治路线逐步法西斯化。"
