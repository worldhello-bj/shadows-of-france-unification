l_english:
 sof603_party_pcf_desc:0 "Maurice Thorez leads the French Communist Party, linking organised labour with parliamentary action."
 sof603_party_sfio_desc:0 "Leon Blum leads the SFIO in parliament, connecting labour protections and social reform with republican government."
 sof603_party_prrrs_desc:0 "Edouard Daladier leads the Radical Party, advancing secular republicanism, public reform and national defence."
 sof603_party_usr_desc:0 "Joseph Paul-Boncour represents the Socialist Republican Union through parliamentary cooperation and collective security."
 sof603_party_pup_desc:0 "Louis Sellier represents the Proletarian Unity Party, linking its labour tradition and local organisation with parliamentary action."
 sof603_party_rg_ad_desc:0 "Pierre-Etienne Flandin leads the Democratic Alliance through republican government, economic policy and cabinet coordination."
 sof603_party_fr_urd_desc:0 "Louis Marin leads the Republican Federation, organising parliamentary conservatives around national defence and public order."
 sof603_party_pdp_desc:0 "Auguste Champetier de Ribes leads the Popular Democratic Party, bringing social Catholic traditions into republican public life."
 sof603_party_upr_desc:0 "Eugene Muller leads the Alsatian Popular Republican Union, representing regional autonomy, religious life and local interests."
 sof603_party_doriot_desc:0 "Jacques Doriot draws on his political base in Saint-Denis to organise a new course through the upheavals of 1936."
