l_english:
 sof_region_BRD_1936_assembly:0 "吉伦特临时议事厅"
 sof_region_BRD_1936_assembly_desc:0 "加龙河仍在流动，货轮却在等待一份无人肯先签字的担保。码头工人、酒商和河岸市镇都带着自己的账簿来到议事厅。要让吉伦特重新运转，我们首先得决定：谁出钱，谁发令，谁承担失败。"
 sof_region_BRD_1936_port_accounts:0 "摊开港务账簿"
 sof_region_BRD_1936_port_accounts_desc:0 "将领港费、仓储租金和公共维修分别列账，禁止用出口收入暗中担保所有军需。"
 sof_region_BRD_1936_communes:0 "河岸市镇代表"
 sof_region_BRD_1936_communes_desc:0 "让港区之外的市镇获得预算审查席位，接受较慢但公开的审批。"
 sof_region_BRD_1936_chamber:0 "商会主导信用"
 sof_region_BRD_1936_chamber_desc:0 "波尔多的商人熟悉远洋货单，也熟悉在一纸承兑到期前把货物送到另一座港口。让商会组织出口信用，可以更快恢复周转；公共财政则必须承受私人信用网络带来的风险。"
 sof_region_BRD_1936_chamber_network:0 "商会主导信用：地方体系"
 sof_region_BRD_1936_public_credit:0 "公营港务信贷"
 sof_region_BRD_1936_public_credit_desc:0 "港口属于依赖它生活的整片地区。市镇将共同担保经过审查的工程，让堤岸、道路和维修先于投机得到资金。每一笔钱都必须留下可以追查的去向。"
 sof_region_BRD_1936_public_credit_network:0 "公营港务信贷：地方体系"
 sof_region_BRD_1936_labor_board:0 "码头雇佣仲裁"
 sof_region_BRD_1936_labor_board_desc:0 "Establish shift arrangements and wage appeals so dockworkers from different backgrounds can take part in negotiations."
 sof_region_BRD_1936_merchant_charter:0 "承兑与审计分离"
 sof_region_BRD_1936_merchant_charter_desc:0 "商会可以组织信用，但审计员不得兼任受益商号经理。"
 sof_region_BRD_1936_municipal_bonds:0 "限定市政债券"
 sof_region_BRD_1936_municipal_bonds_desc:0 "Guarantee approved local works and schedule investment within the available budget."
 sof_region_BRD_1936_municipal_bonds_local:0 "限定市政债券"
 sof_region_BRD_1936_port_statute:0 "港务自治章程"
 sof_region_BRD_1936_port_statute_desc:0 "将劳资仲裁与信用监督汇合为港务章程，既不预定执政党也不吞并周边。"
 sof_region_BRD_1936_river_records:0 "加龙河货运登记"
 sof_region_BRD_1936_river_records_desc:0 "Survey existing barges and unloading facilities to establish dependable river schedules."
 sof_region_BRD_1936_dredging:0 "航道测深与疏浚"
 sof_region_BRD_1936_dredging_desc:0 "Survey the channel before dredging and organise works along the estuary banks under our control."
 sof_region_BRD_1936_dredging_local:0 "航道测深与疏浚"
 sof_region_BRD_1936_warehouses:0 "加龙河仓单清算"
 sof_region_BRD_1936_warehouses_desc:0 "Support credit with existing warehouses and delivered goods, auditing pledged stock to maintain reliable turnover."
 sof_region_BRD_1936_blaye:0 "布莱领港联络"
 sof_region_BRD_1936_blaye_desc:0 "利用布莱城镇组织领港和交通观察；沃邦遗址不能当成现役现代海防炮。"
 sof_region_BRD_1936_lesparre:0 "梅多克河岸联络"
 sof_region_BRD_1936_lesparre_desc:0 "Coordinate estuary and civilian supply surveys with Lesparre; full maritime support requires control of both banks."
 sof_region_BRD_1936_lesparre_local:0 "梅多克河岸联络"
 sof_region_BRD_1936_river_link:0 "吉伦特连续航路"
 sof_region_BRD_1936_river_link_desc:0 "三段受控的河海转运线才能兑现海运组织效益，失去河口即暂停后续项目。"
 sof_region_BRD_1936_river_link_local:0 "吉伦特连续航路"
 sof_region_BRD_1936_quay_repair:0 "修复商业装卸面"
 sof_region_BRD_1936_quay_repair_desc:0 "Organise harbour repair contracts and add modest civilian capacity to improve existing quay services.\nNew facilities require an available building slot or room below the facility cap."
 sof_region_BRD_1936_wine_register:0 "酒农与酒商名册"
 sof_region_BRD_1936_wine_register_desc:0 "将种植户与出口商的库存分开统计，葡萄酒危机不能只用提高军工产出解决。"
 sof_region_BRD_1936_quality:0 "原产地与质量检查"
 sof_region_BRD_1936_quality_desc:0 "完善来源记录与质量检验，维护产地信誉。"
 sof_region_BRD_1936_barrel_credit:0 "桶材与储酒周转"
 sof_region_BRD_1936_barrel_credit_desc:0 "修补酒桶并给库存周转限定期限，避免把过剩产量永远抵押给公共财政。"
 sof_region_BRD_1936_barrel_credit_local:0 "桶材与储酒周转"
 sof_region_BRD_1936_export_credit:0 "保留出口周转金"
 sof_region_BRD_1936_export_credit_desc:0 "酒窖里的存货只有抵达海外市场才会变成收入。我们将保留商船、船员与周转信用，重新接起波尔多的商业航路。航空采购必须等待另一笔资金。"
 sof_region_BRD_1936_aircraft_advance:0 "以酒商信用垫军需"
 sof_region_BRD_1936_aircraft_advance_desc:0 "出口商的承兑可以变成机床、铝材和军机预付款。让这份信用先服务国防，意味着酒商也要分担军需交付的风险。吉伦特必须在贸易回款与安全之间作出选择。"
 sof_region_BRD_1936_export_houses:0 "重开出口商账期"
 sof_region_BRD_1936_export_houses_desc:0 "Restore trade through time-limited bills of acceptance, matching exports to markets and available routes."
 sof_region_BRD_1936_export_houses_local:0 "重开出口商账期"
 sof_region_BRD_1936_landes:0 "林业与包装订单"
 sof_region_BRD_1936_landes_desc:0 "Use existing forestry skills for packaging and repair procurement in support of local transport."
 sof_region_BRD_1936_land_bonus:0 "林业与包装订单：技术积累"
 sof_region_BRD_1936_saso:0 "巴卡兰机体订单"
 sof_region_BRD_1936_saso_desc:0 "以1935年布洛赫和波泰兹接手后的SASO为起点，不使用战后梅里尼亚克厂或1939年公司。"
 sof_region_BRD_1936_tooling:0 "双发机夹具检查"
 sof_region_BRD_1936_tooling_desc:0 "为MB200与MB210一类双发机体核对夹具和工序，先验收现有能力。"
 sof_region_BRD_1936_twin_bonus:0 "双发机夹具检查：技术积累"
 sof_region_BRD_1936_public_orders:0 "公共验收合同"
 sof_region_BRD_1936_public_orders_desc:0 "采购方先验收质量，军需垫款不能在飞机尚未验收时重复支付。"
 sof_region_BRD_1936_public_orders_local:0 "公共验收合同"
 sof_region_BRD_1936_civil_orders:0 "民用订单保留线"
 sof_region_BRD_1936_civil_orders_desc:0 "保留维修与民用零件订单，技术人员不必全部转为军机突击生产。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_BRD_1936_bomber_orders:0 "集中双发机合同"
 sof_region_BRD_1936_bomber_orders_desc:0 "从巴卡兰送出的双发机体将不再只是临时订单。集中夹具、检验员和熟练工，我们可以稳定交付真正可用的批次；民用维修只能为此让出机时。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_BRD_1936_inspectors:0 "航空检验员培训"
 sof_region_BRD_1936_inspectors_desc:0 "无论订单选择如何，验收员都必须独立于交货数量考核。"
 sof_region_BRD_1936_air_bonus:0 "航空检验员培训：技术积累"
 sof_region_BRD_1936_air_watch:0 "河口空情报告"
 sof_region_BRD_1936_air_watch_desc:0 "让观察站与机队共享河口情报，陆上控制仍是港务体系运转的前提。"
 sof_region_BRD_1936_shipping:0 "清点在籍商船"
 sof_region_BRD_1936_shipping_desc:0 "Audit registered vessels and crews to organise shipping services at Bordeaux."
 sof_region_BRD_1936_repair_yards:0 "修船机工名录"
 sof_region_BRD_1936_repair_yards_desc:0 "以维修船台、铆工和机工为起点，新建能力另需拨款。"
 sof_region_BRD_1936_repair_bonus:0 "修船机工名录：技术积累"
 sof_region_BRD_1936_merchant_slips:0 "商船维修优先"
 sof_region_BRD_1936_merchant_slips_desc:0 "船台优先服务贸易与补给，不能同时无限扩充作战舰艇。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_BRD_1936_escort_slips:0 "护航船台优先"
 sof_region_BRD_1936_escort_slips_desc:0 "把有限铆接工与机床拨给护航船体，商业修理需要延后。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_BRD_1936_crew_school:0 "商船海员转训"
 sof_region_BRD_1936_crew_school_desc:0 "Apply civilian seamanship to damage control and formation training for existing crews."
 sof_region_BRD_1936_coastal_escorts:0 "近岸护航条例"
 sof_region_BRD_1936_coastal_escorts_desc:0 "先训练近岸护航与救援，不在资源有限时规划远洋主力舰决战。"
 sof_region_BRD_1936_escort_bonus:0 "近岸护航条例：技术积累"
 sof_region_BRD_1936_maritime_staff:0 "河海联合调度"
 sof_region_BRD_1936_maritime_staff_desc:0 "观察哨报告风浪与空情，领港员安排进出，护航队等待下一班船队。把这些声音汇入同一张班表，吉伦特才拥有一条能在危机中继续运转的海上生命线。"
 sof_region_BRD_1936_maritime_staff_network:0 "河海联合调度：地方体系"
 sof_region_BRD_1936_port_guard:0 "港区卫戍责任"
 sof_region_BRD_1936_port_guard_desc:0 "划清码头警备与野战部队的责任，保留民用装卸通道。"
 sof_region_BRD_1936_territorials:0 "吉伦特后备名册"
 sof_region_BRD_1936_territorials_desc:0 "Train local reservists and organise mobilisation around available personnel and equipment. Completion unlocks the existing border-unification war-goal decisions; the player decides whether to declare war."
 sof_region_BRD_1936_coast_watch:0 "河口观察哨"
 sof_region_BRD_1936_coast_watch_desc:0 "新设观察和信号程序，不将古老城堡视为已现代化重炮阵地。"
 sof_region_BRD_1936_coast_watch_local:0 "河口观察哨"
 sof_region_BRD_1936_mobile_reserve:0 "留出机动预备队"
 sof_region_BRD_1936_mobile_reserve_desc:0 "Prioritise road mobility and temporary assembly areas, balancing estuary defence with reserve reinforcement."
 sof_region_BRD_1936_static_depots:0 "集中河口仓储"
 sof_region_BRD_1936_static_depots_desc:0 "集中仓储提高守备整补，但与机动预备队争夺运输车辆。"
 sof_region_BRD_1936_static_depots_local:0 "集中河口仓储"
 sof_region_BRD_1936_medical:0 "港市卫生与军医"
 sof_region_BRD_1936_medical_desc:0 "用港市卫生资源改善救护与兵员返回，不以公共卫生为由改变政党。"
 sof_region_BRD_1936_medical_bonus:0 "港市卫生与军医：技术积累"
 sof_region_BRD_1936_staff_exercise:0 "河口撤离演习"
 sof_region_BRD_1936_staff_exercise_desc:0 "演练失去一段岸线后的仓储撤离，承认单个城市不能封锁整个河口。"
 sof_region_BRD_1936_western_letters:0 "向大西洋邻区致函"
 sof_region_BRD_1936_western_letters_desc:0 "提议邻区互认货运单与商事仲裁，书信本身不产生通行权或兼并。"
 sof_region_BRD_1936_poitou_offer:0 "拉罗谢尔转运磋商"
 sof_region_BRD_1936_poitou_offer_desc:0 "向普瓦捷提出双方港口转运协商，由对方选择是否接受。"
 sof_region_BRD_1936_poitou_offer_accord_BRD:0 "拉罗谢尔转运磋商：双边履约"
 sof_region_BRD_1936_poitou_offer_accord_POI:0 "拉罗谢尔转运磋商：双边履约"
 sof_region_BRD_1936_poitou_offer_accepted_notice:0 "拉罗谢尔转运磋商：已获同意"
 sof_region_BRD_1936_poitou_offer_accepted_notice_desc:0 "Both governments have accepted the agreement. Each receives two years of implementation support in its own controlled centre. Territorial administration and diplomacy remain independent as the partners build cooperation through practical results."
 sof_region_BRD_1936_poitou_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_poitou_offer_declined_notice:0 "拉罗谢尔转运磋商：遭到拒绝"
 sof_region_BRD_1936_poitou_offer_declined_notice_desc:0 "The other government has chosen to retain its present arrangements, closing this proposal. Refusal carries no penalty; both states remain independent and may discuss new terms on another occasion."
 sof_region_BRD_1936_poitou_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_poitou_offer_event:0 "拉罗谢尔转运磋商"
 sof_region_BRD_1936_poitou_offer_event_desc:0 "向普瓦捷提出双方港口转运协商，由对方选择是否接受。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_BRD_1936_poitou_offer_yes:0 "接受对等磋商"
 sof_region_BRD_1936_poitou_offer_no:0 "拒绝本次提案"
 sof_region_BRD_1936_nantes_offer:0 "南特修船互认"
 sof_region_BRD_1936_nantes_offer_desc:0 "邀请南特互认修船检验，不擅自占用对方船台或征用其舰船。"
 sof_region_BRD_1936_nantes_offer_accord_BRD:0 "南特修船互认：双边履约"
 sof_region_BRD_1936_nantes_offer_accord_NAN:0 "南特修船互认：双边履约"
 sof_region_BRD_1936_nantes_offer_accepted_notice:0 "南特修船互认：已获同意"
 sof_region_BRD_1936_nantes_offer_accepted_notice_desc:0 "Both governments have accepted the agreement. Each receives two years of implementation support in its own controlled centre. Territorial administration and diplomacy remain independent as the partners build cooperation through practical results."
 sof_region_BRD_1936_nantes_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_nantes_offer_declined_notice:0 "南特修船互认：遭到拒绝"
 sof_region_BRD_1936_nantes_offer_declined_notice_desc:0 "The other government has chosen to retain its present arrangements, closing this proposal. Refusal carries no penalty; both states remain independent and may discuss new terms on another occasion."
 sof_region_BRD_1936_nantes_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_nantes_offer_event:0 "南特修船互认"
 sof_region_BRD_1936_nantes_offer_event_desc:0 "邀请南特互认修船检验，不擅自占用对方船台或征用其舰船。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_BRD_1936_nantes_offer_yes:0 "接受对等磋商"
 sof_region_BRD_1936_nantes_offer_no:0 "拒绝本次提案"
 sof_region_BRD_1936_poitou_contract:0 "履行北向转运合同"
 sof_region_BRD_1936_poitou_contract_desc:0 "只有普瓦捷接受提案后才安排本地装卸训练，拒绝不会被绕过。"
 sof_region_BRD_1936_naval_exchange:0 "接受互认的机工"
 sof_region_BRD_1936_naval_exchange_desc:0 "南特同意后组织互认培训，技术交流不给予其土地或工厂。"
 sof_region_BRD_1936_colonial_ledgers:0 "殖民航路商事档案"
 sof_region_BRD_1936_colonial_ledgers_desc:0 "Organise existing colonial trade records and sailing schedules to support the restoration of commercial links."
 sof_region_BRD_1936_insurance:0 "海损保险共同准备"
 sof_region_BRD_1936_insurance_desc:0 "为运费中断和船损准备有限储备；战争会使平时贸易假设失效。"
 sof_region_BRD_1936_southern_offer:0 "与图卢兹核对机体标准"
 sof_region_BRD_1936_southern_offer_desc:0 "试图与图卢兹就零部件验收达成互认，必须获得对方独立同意。"
 sof_region_BRD_1936_southern_offer_accord_BRD:0 "与图卢兹核对机体标准：双边履约"
 sof_region_BRD_1936_southern_offer_accord_TOU:0 "与图卢兹核对机体标准：双边履约"
 sof_region_BRD_1936_southern_offer_accepted_notice:0 "与图卢兹核对机体标准：已获同意"
 sof_region_BRD_1936_southern_offer_accepted_notice_desc:0 "Both governments have accepted the agreement. Each receives two years of implementation support in its own controlled centre. Territorial administration and diplomacy remain independent as the partners build cooperation through practical results."
 sof_region_BRD_1936_southern_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_southern_offer_declined_notice:0 "与图卢兹核对机体标准：遭到拒绝"
 sof_region_BRD_1936_southern_offer_declined_notice_desc:0 "The other government has chosen to retain its present arrangements, closing this proposal. Refusal carries no penalty; both states remain independent and may discuss new terms on another occasion."
 sof_region_BRD_1936_southern_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_BRD_1936_southern_offer_event:0 "与图卢兹核对机体标准"
 sof_region_BRD_1936_southern_offer_event_desc:0 "试图与图卢兹就零部件验收达成互认，必须获得对方独立同意。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_BRD_1936_southern_offer_yes:0 "接受对等磋商"
 sof_region_BRD_1936_southern_offer_no:0 "拒绝本次提案"
 sof_region_BRD_1936_air_exchange:0 "西南航空验收对照"
 sof_region_BRD_1936_air_exchange_desc:0 "After Toulouse accepts, compare acceptance standards to strengthen technical cooperation between aviation workshops."
 sof_region_BRD_1936_congress:0 "提出港务联邦议程"
 sof_region_BRD_1936_congress_desc:0 "将对等港务经验带入全国议会讨论，领土统一仍须实际政治与军事流程。"
 sof_region_BRD_1936_customs:0 "统一后清理关卡"
 sof_region_BRD_1936_customs_desc:0 "控制规模扩大后废除重复内部查验，不用一面旗帜伪装已经控制全国。"
 sof_region_BRD_1936_contracts:0 "统一后港口合同审计"
 sof_region_BRD_1936_contracts_desc:0 "保留已承诺的地方债务责任，不能将统一视为没收所有商会财产的理由。"
 sof_region_BRD_1936_national_shipping:0 "全国港航调度席位"
 sof_region_BRD_1936_national_shipping_desc:0 "在波尔多与拉罗谢尔均受控后协调全国船期，保留地方维修能力。"
