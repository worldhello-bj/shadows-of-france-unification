l_english:
 sof609_faction_mandate_required_tt:0 "完成外交路线末端的“批准共同防御总纲”国策。"
 sof609_faction_unlocked_tt:0 "完成外交总纲：政治点数+100，稳定度+5个百分点，陆军经验+15；解锁组建和加入阵营，并可和平开启全国授权路线。结盟后获得组织度+5%、补给消耗−5%的共同防御体系，加入阵营科研共享。"
 SOF609_GENERIC_embassies:0 "建立常驻外交联络"
 SOF609_GENERIC_treaties:0 "议定互助与防卫条款"
 SOF609_GENERIC_ratify:0 "批准共同防御总纲"
 SOF609_GENERIC_embassies_desc:0 "设立常驻联络处，整理边界、交通和贸易议题，为稳定的对外关系建立日常工作渠道。"
 SOF609_GENERIC_treaties_desc:0 "明确成员权利、共同防卫义务和争端解决程序，让互助条约拥有可以执行的条款。"
 SOF609_GENERIC_ratify_desc:0 "由地方代表正式批准外交总纲。政府由此取得缔结军事同盟的授权，并可通过外交谈判组建或加入阵营。"
 SOF609_PRS_diplomatic_ratification:0 "批准巴黎共同防御总纲"
 SOF609_PRS_diplomatic_ratification_desc:0 "外交代表已经完成对外路线的磋商。现在由巴黎的政治机构批准成员权利、共同防御和争端处理规则，授权政府组建或加入阵营。每位伙伴都将通过自己的外交程序作出决定。"
