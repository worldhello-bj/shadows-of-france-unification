 sof609_faction_mandate_required_tt:0 "完成外交路线末端的“批准共同防御总纲”国策。"
 sof609_faction_unlocked_tt:0 "解锁组建和加入阵营。各国分别批准外交总纲，再通过外交邀请或阵营会议协商加入。"
