 BLITZKRIEG_NAME: "Régions"
 BLITZKRIEG_DESC: "Jouez a Shadow of France: Arcade Version en plus gros avec un choix de région parmi les 21 présentes (Les 22 anciennes régions avec la Normandie Regroupée) et tentez de les conquérir afin d'atteindre l'objectif final: Réunifier la France !"

 FRA_BLITZKRIEG_DESC: "Alors que les plaies de la Grande Guerre ne sont pas encore refermées, la France voit déjà se profiler un nouveau conflit contre elle-même qui semble se refuser la paix. Peut-être, en renforçant ses défenses frontalières et en choisissant bien ses alliés, la France parviendra-t-elle à échapper au conflit ?\n$tab_dec$Dans le cas contraire, elle l'a déjà emporté sur sa voisine, et cette fois ne sera en rien différente !"
 