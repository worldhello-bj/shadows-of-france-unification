l_english:
 sof606_party_mature_pcf:0 "工厂公共监督体系"
 sof606_party_mature_pcf_desc:0 "共同工坊把工艺培训、生产标准与熟练工组织连成稳定的生产网络。"
 sof606_party_mature_sfio:0 "公共生活与民用复兴"
 sof606_party_mature_sfio_desc:0 "公共工程、家庭信贷与休闲制度共同支持地方建设和民用供给。"
 sof606_party_mature_prrrs:0 "共和公共教育体系"
 sof606_party_mature_prrrs_desc:0 "公共学校、学术自由与共和监督为持续研究提供制度基础。"
 sof606_party_mature_usr:0 "公共技术协调体系"
 sof606_party_mature_usr_desc:0 "技术委员会把工业生产与基础设施规划纳入同一协调制度。"
 sof606_party_mature_pup:0 "独立工会生产协定"
 sof606_party_mature_pup_desc:0 "工会协商与技能认证帮助工人在产线调整时保持积累的经验。"
 sof606_party_mature_rg_ad:0 "地方信用复兴体系"
 sof606_party_mature_rg_ad_desc:0 "地方信用与企业协商为投资、复工和公共财政提供稳定预期。"
 sof606_party_mature_fr_urd:0 "地方国防承包体系"
 sof606_party_mature_fr_urd_desc:0 "地方防务承包与预备役训练形成持续运作的军需体系。"
 sof606_party_mature_pdp:0 "社会伙伴共同契约"
 sof606_party_mature_pdp_desc:0 "家庭保障、劳资协商与共同契约支持生产组织的连续运作。"
 sof606_party_mature_upr:0 "阿尔萨斯县市协作体系"
 sof606_party_mature_upr_desc:0 "双语议会和市镇自治推动边境基础设施及地方供给协作。"
 sof606_party_mature_doriot:0 "地方市政组织体系"
 sof606_party_mature_doriot_desc:0 "市政服务和基层组织把地方信任转化为日常行政能力。"
 sof606_party_mature_doriot_ppf:0 "人民党动员组织"
 sof606_party_mature_doriot_ppf_desc:0 "基层动员组织支持军队补充与战时协调。组织在执政和地方控制条件恢复后重新运作。"
