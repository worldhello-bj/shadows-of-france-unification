 sof_ne_CHL_sedan_decision_desc:0 "依据1936年的道路、河谷与地形调查，在色当组织侦察和工程准备。"
 sof_ne_CHL_local_investments:0 "沙隆：葡萄园、营地与纵深：地方工程"
