l_simp_chinese:
 sof_ne_CHL_commission:0 "沙隆地区协调委员会"
 sof_ne_CHL_commission_desc:0 "借用1935年香槟协调背景构思地区程序，不称1941年CIVC已经存在。"
 sof_ne_CHL_cellars_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_CHL_cellar_contract:0 "埃佩尔奈产地与库存议约"
 sof_ne_CHL_cellar_contract_desc:0 "葡农、酒商与酒窖工人共同维持着产区的信誉。协调会将登记品质、库存和信贷义务，使下一季生产不再受旧账拖累。"
 sof_ne_CHL_camp_survey:0 "营地、村镇与耕地清点"
 sof_ne_CHL_camp_survey_desc:0 "军队训练需要土地，道路和田野却也养活着村镇。我们应先查清营地边界、通行责任和可用时段，再决定扩大训练的方式。"
 sof_ne_CHL_junction:0 "沙隆军民转运调度"
 sof_ne_CHL_junction_desc:0 "交通先行，军需和农产不争用同一套不透明优先权。"
 sof_ne_CHL_quality:0 "产地与品质契约"
 sof_ne_CHL_quality_desc:0 "葡农、酒商和工人共同登记品质与库存义务。"
 sof_ne_CHL_stock_audit:0 "酒窖库存与债权登记"
 sof_ne_CHL_stock_audit_desc:0 "分别登记销售、存货与贷款，让产区信贷与生产计划建立在清晰账目上。"
 sof_ne_CHL_compensation:0 "营地征用与损害赔偿"
 sof_ne_CHL_compensation_desc:0 "训练占地、道路损坏和农忙冲突均需补偿程序。"
 sof_ne_CHL_sedan_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_CHL_sedan_survey:0 "色当渡口侦察与通信"
 sof_ne_CHL_sedan_survey_desc:0 "色当连接默兹两岸的交通，任何纵深防卫都离不开这里的观察与通信。及时更新渡口与道路情报，为预备队调动提供依据。"
 sof_ne_CHL_vitry:0 "维特里纵深仓库"
 sof_ne_CHL_vitry_desc:0 "前沿受压仍需南侧转运与分散存储。"
 sof_ne_CHL_civil_timetable_bonus:0 "农产与民用车皮班表"
 sof_ne_CHL_civil_timetable:0 "农产与民用车皮班表"
 sof_ne_CHL_civil_timetable_desc:0 "仍采用1936既有铁路组织，不提前假称SNCF统一管理。"
 sof_ne_CHL_growers:0 "葡农合作采购席"
 sof_ne_CHL_growers_desc:0 "合作采购降低争议，但需要持续协调。"
 sof_ne_CHL_houses:0 "酒商信用监督席"
 sof_ne_CHL_houses_desc:0 "集中出口信用提高行政效率，也带来分配摩擦。"
 sof_ne_CHL_bottles:0 "兰斯瓶装与包装"
 sof_ne_CHL_bottles_desc:0 "包装与仓储是地方消费工业，不变成重型兵工厂。"
 sof_ne_CHL_training_seasons:0 "为农忙避让训练时段"
 sof_ne_CHL_training_seasons_desc:0 "军队训练与收获时间进行公开协调。"
 sof_ne_CHL_bridges_bonus:0 "默兹桥梁荷载检查"
 sof_ne_CHL_bridges:0 "默兹桥梁荷载检查"
 sof_ne_CHL_bridges_desc:0 "桥梁能否承受重车、道路能否容纳双向通行，都应由实际检查回答。工兵将为默兹渡口地区建立荷载与维修记录。"
 sof_ne_CHL_retreat_routes_bonus:0 "阿登后撤道路勘察"
 sof_ne_CHL_retreat_routes:0 "阿登后撤道路勘察"
 sof_ne_CHL_retreat_routes_desc:0 "调查阿登道路、坡度与通行条件，以实地数据规划防务。"
 sof_ne_CHL_picardy_offer:0 "向皮卡第提请粮运互认"
 sof_ne_CHL_picardy_offer_desc:0 "亚眠有权拒绝；双方按协商结果安排车皮。"
 sof_ne_CHL_price_board:0 "产区价格与品质复核"
 sof_ne_CHL_price_board_desc:0 "两种融资优先路线在公开复核程序处汇合。"
 sof_ne_CHL_grain_bonus:0 "香槟谷物与农具保养"
 sof_ne_CHL_grain:0 "香槟谷物与农具保养"
 sof_ne_CHL_grain_desc:0 "产区不只有葡萄酒；农业修理需要连接轻工与民事安排。"
 sof_ne_CHL_civic_charter:0 "营地与村镇共同章程"
 sof_ne_CHL_civic_charter_desc:0 "规定地方代表、军方与村镇的权限，不强制任何执政党。"
 sof_ne_CHL_sedan_fort:0 "色当交通节点防护"
 sof_ne_CHL_sedan_fort_desc:0 "默兹交通调查已经指出值得防护的节点。工兵将在色当的重要通路设置掩体和阻滞阵地，为预备队争取展开时间。"
 sof_ne_CHL_charleville:0 "沙勒维尔观察与补给"
 sof_ne_CHL_charleville_desc:0 "改善自有州的后勤接入，连接当地道路与供应节点。"
 sof_ne_CHL_lorraine_offer:0 "向洛林提请军需班表"
 sof_ne_CHL_lorraine_offer_desc:0 "梅斯必须接受才能得到双边运输协作。"
 sof_ne_CHL_aoc:0 "1936年产地规则登记"
 sof_ne_CHL_aoc_desc:0 "新的产地规则已经到来。埃佩尔奈的登记部门将把生产者、品质要求与原有合同逐项核对，让共同标准在实际交易中得到执行。"
 sof_ne_CHL_exports_bonus:0 "出口信用与酒窖周转"
 sof_ne_CHL_exports:0 "出口信用与酒窖周转"
 sof_ne_CHL_exports_desc:0 "核验库存品质，以可靠货物支持贸易信用。"
 sof_ne_CHL_troyes:0 "特鲁瓦针织军需检验"
 sof_ne_CHL_troyes_desc:0 "发挥特鲁瓦轻工业优势，组织服装、修理与地方军需工序。"
 sof_ne_CHL_public_accounts:0 "公开营地费用与补偿"
 sof_ne_CHL_public_accounts_desc:0 "训练和民生预算须放在同一份公开账册比较。"
 sof_ne_CHL_signals_bonus:0 "默兹前沿电话联络"
 sof_ne_CHL_signals:0 "默兹前沿电话联络"
 sof_ne_CHL_signals_desc:0 "前方阵地和后方道路两支都完成后再建立通信。"
 sof_ne_CHL_own_stock_bonus:0 "保留境内粮弹调度"
 sof_ne_CHL_own_stock:0 "保留境内粮弹调度"
 sof_ne_CHL_own_stock_desc:0 "外交拒绝不影响本国继续整理仓储和运具。"
 sof_ne_CHL_farm_roads:0 "埃佩尔奈乡村道路"
 sof_ne_CHL_farm_roads_desc:0 "产地登记与库存周转齐备后改善本地道路，不奖励现代产业园。"
 sof_ne_CHL_civil_workshops:0 "特鲁瓦民用机具维修"
 sof_ne_CHL_civil_workshops_desc:0 "从农业与纺织维修需求扩建一个民用单位。"
 sof_ne_CHL_arbitration:0 "地区军民争议仲裁席"
 sof_ne_CHL_arbitration_desc:0 "营地军官与农户都受同一明确的争议程序约束。"
 sof_ne_CHL_mobile:0 "机动纵深预备队"
 sof_ne_CHL_mobile_desc:0 "建立机动预备队，完善道路转进和应急增援。"
 sof_ne_CHL_layered_bonus:0 "分层据点与火力准备"
 sof_ne_CHL_layered:0 "分层据点与火力准备"
 sof_ne_CHL_layered_desc:0 "优先建设纵深据点与火力准备，与机动训练择一实施。"
 sof_ne_CHL_signed_orders_bonus:0 "执行已接受的转运条款"
 sof_ne_CHL_signed_orders:0 "执行已接受的转运条款"
 sof_ne_CHL_signed_orders_desc:0 "至少一位伙伴接受后，按已签订单组织供应；跨境运输须另获相应许可。"
 sof_ne_CHL_harvest:0 "收获季与军需配给协调"
 sof_ne_CHL_harvest_desc:0 "葡萄产区、谷物与轻工主线汇合到季节配给。"
 sof_ne_CHL_district_charter:0 "香槟共同财政章程"
 sof_ne_CHL_district_charter_desc:0 "军民费用、地方制度和代表权统一列明，党派执政分支另行管理。"
 sof_ne_CHL_reserve:0 "纵深预备队时刻表"
 sof_ne_CHL_reserve_desc:0 "以分散仓储、机动演练和道路侦察加强阿登纵深防御。"
 sof_ne_CHL_clearing:0 "香槟交通共同清算"
 sof_ne_CHL_clearing_desc:0 "接受协作或改用境内方案均可继续进入统一准备。"
 sof_ne_CHL_reims_repair_bonus:0 "兰斯精密维修课程"
 sof_ne_CHL_reims_repair:0 "兰斯精密维修课程"
 sof_ne_CHL_reims_repair_desc:0 "本地设备修理与包装标准相接，不冒称已存在某军工总厂。"
 sof_ne_CHL_camp_workshop:0 "沙隆营地器材修理所"
 sof_ne_CHL_camp_workshop_desc:0 "营地训练、布料供应与纵深班表已经接通。沙隆可以扩建器材修理所，让磨损装备及时回到部队手中。"
 sof_ne_CHL_medical_bonus:0 "兰格勒后送医疗课堂"
 sof_ne_CHL_medical:0 "兰格勒后送医疗课堂"
 sof_ne_CHL_medical_desc:0 "后方城市接收训练和医疗安排，避免前线独占全部资源。"
 sof_ne_CHL_liaison:0 "地区协商的公开条款"
 sof_ne_CHL_liaison_desc:0 "对外义务必须与本地财政章程一致。"
 sof_ne_CHL_camp_air:0 "沙隆州训练机场扩建"
 sof_ne_CHL_camp_air_desc:0 "地面训练需要航空观察和联络配合。扩大沙隆州的训练机场容量，将为飞行员与地面观察人员提供共同演练的空间。"
 sof_ne_CHL_reserve_drill:0 "营地与后方联合演习"
 sof_ne_CHL_reserve_drill_desc:0 "修理、医疗与预备队共同检验长期动员能力。"
 sof_ne_CHL_grain_account:0 "产地与粮运年度对账"
 sof_ne_CHL_grain_account_desc:0 "将农业周期和军需班表纳入整合材料。"
 sof_ne_CHL_air_observers:0 "地面观察与航空联络"
 sof_ne_CHL_air_observers_desc:0 "训练侦察联络人员，加快情报回传。"
 sof_ne_CHL_reims_air_defense:0 "兰斯交通节点防空"
 sof_ne_CHL_reims_air_defense_desc:0 "保护城市与交通设施，必须控制本州。"
 sof_ne_CHL_depth_manual:0 "香槟纵深防卫手册"
 sof_ne_CHL_depth_manual_desc:0 "地空观察、补给和训练形成可移交全国的地方经验。"
 sof_ne_CHL_transition:0 "筹备军民资产交接"
 sof_ne_CHL_transition_desc:0 "统一前先编制卷宗，不提前改变全国主权。"
 sof_ne_CHL_national_board:0 "统一后的香槟协调局"
 sof_ne_CHL_national_board_desc:0 "只有既有统一流程完成后才实施全国接口。"
 sof_ne_CHL_quality_transfer:0 "全国采购尊重产地合同"
 sof_ne_CHL_quality_transfer_desc:0 "全国采购将以地方品质与信用义务为基础。"
 sof_ne_CHL_camp_transfer_bonus:0 "全国营地修理标准"
 sof_ne_CHL_camp_transfer:0 "全国营地修理标准"
 sof_ne_CHL_camp_transfer_desc:0 "已修复的营地工序接入统一军需系统。"
 sof_ne_CHL_meuse_transfer_bonus:0 "移交默兹交通调查"
 sof_ne_CHL_meuse_transfer:0 "移交默兹交通调查"
 sof_ne_CHL_meuse_transfer_desc:0 "交接当时可知的地形、道路与桥梁资料，不传递未来战役知识。"
 sof_ne_CHL_compensation_merge:0 "统一军民赔偿账户"
 sof_ne_CHL_compensation_merge_desc:0 "借地和训练损害责任继续可追溯。"
 sof_ne_CHL_depth_merge:0 "全国纵深预备队协同"
 sof_ne_CHL_depth_merge_desc:0 "地方预备队标准成为全国防卫的组成部分。"
 sof_ne_CHL_unification_mandate:0 "以沙隆营地整编法国"
 sof_ne_CHL_unification_mandate_desc:0 "地方整军将为全国统一提供骨干。授权以本区为支点重建法国共同国家，解锁边境统一战役，并通过既有战役系统取得合法相邻目标的吞并战争目标。"
 sof_ne_CHL_champagne_in_france:0 "香槟军民与共同国家"
 sof_ne_CHL_champagne_in_france_desc:0 "产区合同、军民赔偿与纵深训练已经完成交接。共同国家将以新的研究机构吸收香槟的经验，使葡萄园与营地都能在更稳定的秩序中发展。"
 sof_ne_CHL_camp_rules:0 "营地与村镇赔偿规程"
 sof_ne_CHL_camp_rules_desc:0 "训练损坏与土地借用必须明确赔偿。"
 sof_ne_CHL_cloth:0 "特鲁瓦军需针织验收"
 sof_ne_CHL_cloth_desc:0 "地方轻工业承接配套工序，拓展地区生产网络。"
 sof_ne_CHL_commerce:0 "香槟交通互惠协定"
 sof_ne_CHL_commerce_desc:0 "双方接受后180天的运输协作。"
 sof_ne_CHL_integration:0 "统一后的香槟军民协调局"
 sof_ne_CHL_integration_desc:0 "地方营地、农业与全国纵深后勤对接。"
 sof_ne_CHL_lorraine_accord:0 "香槟—洛林预备队联络"
 sof_ne_CHL_lorraine_accord_desc:0 "双方将营地训练和边防后送接入共同班表。 双方接受后持续270天。"
 sof_ne_CHL_picardy_accord:0 "香槟—皮卡第粮运互助"
 sof_ne_CHL_picardy_accord_desc:0 "双方协调农产收购、车皮周转和乡村道路投入。 双方接受后持续270天。"
 sof_ne_CHL_cellars_local:0 "埃佩尔奈酒窖与产地契约"
 sof_ne_CHL_cellars_local_desc:0 "城镇锚定品质、库存和出口信用网络，不从葡萄酒生成钢铁。"
 sof_ne_CHL_sedan_local:0 "色当渡口与预备队通信"
 sof_ne_CHL_sedan_local_desc:0 "城市是默兹渡口区域锚点，不冒认Gaulier或Donchery精确桥址。"
 sof_ne_CHL_chalon_rail_local:0 "沙隆军民转运台"
 sof_ne_CHL_chalon_rail_local_desc:0 "营地和民生物资的本地转运调度。"
 sof_ne_CHL_vitry_local:0 "维特里分散仓储"
 sof_ne_CHL_vitry_local_desc:0 "纵深仓库只在实际控制区域有效。"
 sof_ne_CHL_reims_local:0 "兰斯瓶装与包装周转"
 sof_ne_CHL_reims_local_desc:0 "包装和仓库再利用，区别于军工产量。"
 sof_ne_CHL_cellars_decision:0 "支付埃佩尔奈品质与库存合同"
 sof_ne_CHL_cellars_decision_desc:0 "酒窖盘点和质量保障占用预算，仅投资一次。"
