l_simp_chinese:
 sof_ne_ROU_port_council:0 "建立塞纳港务议事会"
 sof_ne_ROU_port_council_desc:0 "船主、码头工、市镇和铁路部门各自解决不了塞纳河口的拥堵。港务议事会将把河运、海运与腹地交接放在同一个计划之下。"
 sof_ne_ROU_quays_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_ROU_quay_contract:0 "核定鲁昂河海转运"
 sof_ne_ROU_quay_contract_desc:0 "鲁昂的优势在于河海货物能够在这里接力。恢复码头、仓库和装卸设备，比追求尚无需求的新奇工程更能使贸易重新流动。"
 sof_ne_ROU_customs_bonus:0 "河口通行与报关"
 sof_ne_ROU_customs:0 "河口通行与报关"
 sof_ne_ROU_customs_desc:0 "本国报关只能管理本国码头，不能替海峡邻国许诺航运自由。"
 sof_ne_ROU_seamen:0 "登记海员与码头工"
 sof_ne_ROU_seamen_desc:0 "民用海员、码头工人与海军人员分册登记。"
 sof_ne_ROU_warehouses_bonus:0 "仓库、驳船与车皮"
 sof_ne_ROU_warehouses:0 "仓库、驳船与车皮"
 sof_ne_ROU_warehouses_desc:0 "逐项检修运具和转运流程，不一键发放同额工厂。"
 sof_ne_ROU_labour_board:0 "港口劳动安全委员会"
 sof_ne_ROU_labour_board_desc:0 "安全与工资谈判有程序和成本，不能靠无条件精神消除全部矛盾。"
 sof_ne_ROU_le_havre:0 "勒阿弗尔河口接力"
 sof_ne_ROU_le_havre_desc:0 "鲁昂的河海货流依赖河口节点，两地建设分开控制。"
 sof_ne_ROU_caen_supply_bonus:0 "调查卡昂钢铁原料"
 sof_ne_ROU_caen_supply:0 "调查卡昂钢铁原料"
 sof_ne_ROU_caen_supply_desc:0 "卡昂地区的钢铁工业不能只看高炉数量。原料来源、运送时刻与焦煤消耗应分别核算，避免扩产计划在到货之前就已失去依据。"
 sof_ne_ROU_cherbourg:0 "瑟堡修船能力清点"
 sof_ne_ROU_cherbourg_desc:0 "先清点船坞与工人，再决定商船或护航优先。"
 sof_ne_ROU_depots:0 "内河堆场防火"
 sof_ne_ROU_depots_desc:0 "改善本州仓储通路与消防接入。"
 sof_ne_ROU_wages:0 "装卸班次与工资仲裁"
 sof_ne_ROU_wages_desc:0 "工资和装卸时间进入双方可追责的公共账册。"
 sof_ne_ROU_tolls:0 "公布港口收费表"
 sof_ne_ROU_tolls_desc:0 "收费透明是地方制度选择，不与任何特定党派绑定。"
 sof_ne_ROU_rail_link_bonus:0 "塞纳腹地转运时刻"
 sof_ne_ROU_rail_link:0 "塞纳腹地转运时刻"
 sof_ne_ROU_rail_link_desc:0 "采用1936年的既有铁路公司和线路协调概念，不称SNCF已经成立。"
 sof_ne_ROU_steel_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_ROU_smn:0 "科隆贝勒维修合同"
 sof_ne_ROU_smn_desc:0 "科隆贝勒的钢铁生产需要矿石、焦煤、车皮和熟练工人同时到位。我们将签订维修合同，先恢复工序之间的衔接，再扩大军需订单。"
 sof_ne_ROU_merchant:0 "商船优先章程"
 sof_ne_ROU_merchant_desc:0 "优先贸易恢复，军用训练预算略受挤压。"
 sof_ne_ROU_escort:0 "护航优先章程"
 sof_ne_ROU_escort_desc:0 "先协调护航值勤，商船产能承担代价。"
 sof_ne_ROU_seine_timetable:0 "河海货载统一班表"
 sof_ne_ROU_seine_timetable_desc:0 "码头、仓库、河口和腹地铁路汇合形成真实交接链。"
 sof_ne_ROU_civic_charter:0 "港务与市镇权限章程"
 sof_ne_ROU_civic_charter_desc:0 "港务只管获授权事务，市镇保留民事救济渠道。"
 sof_ne_ROU_rolling_bonus:0 "诺曼底轧机检修"
 sof_ne_ROU_rolling:0 "诺曼底轧机检修"
 sof_ne_ROU_rolling_desc:0 "恢复检修与轧制工序，而非凭空生产舰炮。"
 sof_ne_ROU_shared_dock:0 "共用修船质量规则"
 sof_ne_ROU_shared_dock_desc:0 "两种优先章程在船体质量和安全标准处汇合。"
 sof_ne_ROU_farm_routes:0 "圣洛乡村集散"
 sof_ne_ROU_farm_routes_desc:0 "港口需要腹地粮食与日用品；乡村支线不同于重工业扩建。"
 sof_ne_ROU_river_bridges_bonus:0 "塞纳桥梁荷载检查"
 sof_ne_ROU_river_bridges:0 "塞纳桥梁荷载检查"
 sof_ne_ROU_river_bridges_desc:0 "塞纳腹地的桥梁既承受商车，也可能承受军需纵队。工兵与地方工程人员将共同检查荷载、维修优先级和交通中断时的替代通路。"
 sof_ne_ROU_picardy_offer:0 "提请皮卡第货单互认"
 sof_ne_ROU_picardy_offer_desc:0 "亚眠必须自行接受；否则可走境内替代路线。"
 sof_ne_ROU_representation:0 "港口与乡村代表席"
 sof_ne_ROU_representation_desc:0 "诺曼底主树不能只有鲁昂港口而忽视乡村和内陆市镇。"
 sof_ne_ROU_metallurgy:0 "诺曼底冶金验收"
 sof_ne_ROU_metallurgy_desc:0 "SMN区域网络的验收标准，不生成新矿藏。"
 sof_ne_ROU_wireless_bonus:0 "沿岸无线电值勤"
 sof_ne_ROU_wireless:0 "沿岸无线电值勤"
 sof_ne_ROU_wireless_desc:0 "搜救与护航共用有限通信训练。"
 sof_ne_ROU_convoy_yard:0 "修复小型运输船位"
 sof_ne_ROU_convoy_yard_desc:0 "船体检查、工人班次与质量标准已经统一。瑟堡将扩充小型修船位置，使待修船舶更快重返海上。"
 sof_ne_ROU_market_roads:0 "贝叶农产道路"
 sof_ne_ROU_market_roads_desc:0 "农业与港口市场通过州级道路接入。"
 sof_ne_ROU_evreux_bonus:0 "埃夫勒车辆修理"
 sof_ne_ROU_evreux:0 "埃夫勒车辆修理"
 sof_ne_ROU_evreux_desc:0 "车辆修理支持后方运输，不直接派发免费装甲部队。"
 sof_ne_ROU_local_freight_bonus:0 "预备境内货单规则"
 sof_ne_ROU_local_freight:0 "预备境内货单规则"
 sof_ne_ROU_local_freight_desc:0 "邻区不接受也能继续整理本国货运。"
 sof_ne_ROU_port_review:0 "港务预算公开复核"
 sof_ne_ROU_port_review_desc:0 "工程费用、工资和乡村补助共同接受审计。"
 sof_ne_ROU_caen_workshop:0 "卡昂专门军需车间"
 sof_ne_ROU_caen_workshop_desc:0 "完成原料、维修和验收链后仅扩建一个军需加工单位。"
 sof_ne_ROU_brittany_offer:0 "提请布列塔尼沿海救助"
 sof_ne_ROU_brittany_offer_desc:0 "救助通信协作须雷恩一方同意，绝不强行建立海军联盟。"
 sof_ne_ROU_merchant_tonnage:0 "小型货船恢复运营"
 sof_ne_ROU_merchant_tonnage_desc:0 "一批小型运输船已经完成修复。让它们重新投入运营，可以增加海运周转，也能为今后的军需运输储备经验。"
 sof_ne_ROU_food_contracts:0 "乡村与港口供给合同"
 sof_ne_ROU_food_contracts_desc:0 "民用食品供给稳定城市就业和装卸班次。"
 sof_ne_ROU_coastal_reserves:0 "内陆机动救援队"
 sof_ne_ROU_coastal_reserves_desc:0 "为沿岸事故和交通中断准备陆上增援。"
 sof_ne_ROU_accepted_freight_bonus:0 "落实获准跨区班表"
 sof_ne_ROU_accepted_freight:0 "落实获准跨区班表"
 sof_ne_ROU_accepted_freight_desc:0 "一份协定获准后才可执行，拒绝不会阻塞境内替代。"
 sof_ne_ROU_norman_charter:0 "诺曼底共同财政章程"
 sof_ne_ROU_norman_charter_desc:0 "规定港口、工业城市和乡村的财政分担，保持党派中立。"
 sof_ne_ROU_machine_repair:0 "鲁昂民用机械维修"
 sof_ne_ROU_machine_repair_desc:0 "民用维修将港口与工厂设备重新接入同一地区经济。"
 sof_ne_ROU_naval_charts:0 "海峡航路与避险测绘"
 sof_ne_ROU_naval_charts_desc:0 "海员的经验应变成所有值勤人员都能使用的航路资料。沿岸避险、通信和紧急靠泊地点将纳入共同海图与训练课程。"
 sof_ne_ROU_supply_inland_bonus:0 "海运中断时的内陆配给"
 sof_ne_ROU_supply_inland:0 "海运中断时的内陆配给"
 sof_ne_ROU_supply_inland_desc:0 "丹麦补给线模块启发的陆上退路，使海港并非唯一生命线。"
 sof_ne_ROU_clearing:0 "诺曼底跨区货运清算"
 sof_ne_ROU_clearing_desc:0 "按真实接受的协定结算；没有协议则采用本国账册。"
 sof_ne_ROU_harbour_air:0 "勒阿弗尔港空警戒"
 sof_ne_ROU_harbour_air_desc:0 "地面防空保护港区，不声称已有完整雷达链。"
 sof_ne_ROU_naval_training:0 "瑟堡护航课堂"
 sof_ne_ROU_naval_training_desc:0 "商船优先路线也可以训练护航，但没有额外政治路线门槛。"
 sof_ne_ROU_industrial_account_bonus:0 "港口钢厂联合验收"
 sof_ne_ROU_industrial_account:0 "港口钢厂联合验收"
 sof_ne_ROU_industrial_account_desc:0 "将造船需求和钢材质量对接，不制造新的资源储量。"
 sof_ne_ROU_dieppe:0 "迪耶普城市防护"
 sof_ne_ROU_dieppe_desc:0 "只在核实城市省份施工陆堡，不冒认未核实的海岸炮位。"
 sof_ne_ROU_civil_defense:0 "沿海市镇疏散计划"
 sof_ne_ROU_civil_defense_desc:0 "港口损坏时人员与民生设施撤运。"
 sof_ne_ROU_maritime_readiness:0 "河海护航联合演练"
 sof_ne_ROU_maritime_readiness_desc:0 "陆上警戒、船员训练和海图工作汇合。"
 sof_ne_ROU_corridor:0 "诺曼底走廊联席会"
 sof_ne_ROU_corridor_desc:0 "港口、腹地与工业共同准备全国整合。"
 sof_ne_ROU_defense_handover:0 "沿海防务交接清单"
 sof_ne_ROU_defense_handover_desc:0 "记录已经完成的防护设施和指挥接口。"
 sof_ne_ROU_national_port:0 "统一后的河海运输署"
 sof_ne_ROU_national_port_desc:0 "统一完成后才建立全国接口，不以本树强行吞并邻区。"
 sof_ne_ROU_cargo_merge_bonus:0 "全国货运单证互认"
 sof_ne_ROU_cargo_merge:0 "全国货运单证互认"
 sof_ne_ROU_cargo_merge_desc:0 "港务单证并入全国体系，既有对外协定仍尊重对方意愿。"
 sof_ne_ROU_steel_merge_bonus:0 "统一钢材采购规格"
 sof_ne_ROU_steel_merge:0 "统一钢材采购规格"
 sof_ne_ROU_steel_merge_desc:0 "诺曼底冶金工序与全国采购标准衔接。"
 sof_ne_ROU_fleet_merge:0 "统一沿岸值勤名册"
 sof_ne_ROU_fleet_merge_desc:0 "合并训练和责任名册，不生成凭空舰队。"
 sof_ne_ROU_municipal_debts:0 "港口与市镇债务对账"
 sof_ne_ROU_municipal_debts_desc:0 "处理地方债权和投资义务，避免统一后重复计账。"
 sof_ne_ROU_coast_network_bonus:0 "统一海岸救助规程"
 sof_ne_ROU_coast_network:0 "统一海岸救助规程"
 sof_ne_ROU_coast_network_desc:0 "把地方救助通信标准汇入全国体系。"
 sof_ne_ROU_unification_mandate:0 "以港口走廊推进统一"
 sof_ne_ROU_unification_mandate_desc:0 "地方整军不应止于守住边界。授权以本区为支点重建法国共同国家，解锁边境统一战役，并通过既有战役系统取得合法相邻目标的吞并战争目标。"
 sof_ne_ROU_normandy_in_france:0 "诺曼底河海走廊的完成"
 sof_ne_ROU_normandy_in_france_desc:0 "诺曼底的港口、钢厂和乡村供给已经成为全国运输体系的一部分。新的研究机构将把河海交接和沿岸保障的经验推广到整个共同国家。"
 sof_ne_ROU_harbour_board:0 "塞纳港务议事会"
 sof_ne_ROU_harbour_board_desc:0 "港务、市镇和劳工代表共同处理河海交接。"
 sof_ne_ROU_dock_safety:0 "码头安全班表"
 sof_ne_ROU_dock_safety_desc:0 "减少事故需要限制过长工时。"
 sof_ne_ROU_cargo:0 "军民货载清单"
 sof_ne_ROU_cargo_desc:0 "有限运输效率，不意味着海上航路不受封锁。"
 sof_ne_ROU_commerce:0 "诺曼底腹地运输协定"
 sof_ne_ROU_commerce_desc:0 "双方同意后180天运输互助。"
 sof_ne_ROU_integration:0 "统一后的河海运输署"
 sof_ne_ROU_integration_desc:0 "港务与全国运输账户接轨。"
 sof_ne_ROU_picardy_accord:0 "塞纳腹地联运结算"
 sof_ne_ROU_picardy_accord_desc:0 "铁路和港口的货单结算投入共同执行。 双方接受后持续270天。"
 sof_ne_ROU_brittany_accord:0 "海峡沿岸护航与救助网"
 sof_ne_ROU_brittany_accord_desc:0 "双方协调海员通信、救助和值勤标准。 双方接受后持续270天。"
 sof_ne_ROU_quays_local:0 "鲁昂河海转运班表"
 sof_ne_ROU_quays_local_desc:0 "既有码头与仓库周转；绝不把1958年出口粮仓写成1936设施。"
 sof_ne_ROU_steel_local:0 "科隆贝勒钢铁周转"
 sof_ne_ROU_steel_local_desc:0 "城镇是跨市镇SMN网络的行政接入点，不是精确厂区边界。"
 sof_ne_ROU_estuary_local:0 "勒阿弗尔河口维修"
 sof_ne_ROU_estuary_local_desc:0 "河口货运接口本地恢复，不保证敌方海域安全。"
 sof_ne_ROU_bocage_local:0 "圣洛乡村集散"
 sof_ne_ROU_bocage_local_desc:0 "乡村道路和仓储联系港口消费。"
 sof_ne_ROU_arsenal_local:0 "瑟堡修船班组"
 sof_ne_ROU_arsenal_local_desc:0 "有限修船场地再利用，不直接生成大型舰队。"
 sof_ne_ROU_quays_decision:0 "拨付鲁昂码头与仓储检修"
 sof_ne_ROU_quays_decision_desc:0 "疏浚、装卸和仓储检修需要预算；无现代粮仓奖励。"
 sof_ne_ROU_steel_decision:0 "支付科隆贝勒工序维修"
 sof_ne_ROU_steel_decision_desc:0 "先保障矿石、焦煤和运输，再恢复钢铁周转。"
 sof_ne_ROU_local_investments:0 "鲁昂：河海港口与诺曼底走廊：地方工程"
 sof_ne_ROU_diplomacy.1.t:0 "塞纳—皮卡第铁路货单协定"
 sof_ne_ROU_diplomacy.1.d:0 "铁路和港口的货单结算投入共同执行。 接受后双方获得270天的专项协作收益。可接受，也可拒绝。"
 sof_ne_ROU_diplomacy.1.a:0 "同意协作"
 sof_ne_ROU_diplomacy.101.t:0 "塞纳—皮卡第铁路货单协定：已接受"
 sof_ne_ROU_diplomacy.101.d:0 "铁路和港口的货单结算投入共同执行。 对方已接受，双方获得270天专项协作。"
 sof_ne_ROU_diplomacy.101.a:0 "收到"
 sof_ne_ROU_diplomacy.201.t:0 "塞纳—皮卡第铁路货单协定：未达成"
 sof_ne_ROU_diplomacy.201.d:0 "对方没有接受。可使用地方国策中的境内替代方案继续推进。"
 sof_ne_ROU_diplomacy.201.a:0 "收到"
 sof_ne_ROU_diplomacy.1.b:0 "不接受这份安排"
