 sof_ne_ROU_diplomacy.102.t:0 "诺曼底—布列塔尼沿海救助协作：已接受"
 sof_ne_ROU_diplomacy.102.d:0 "双方协调海员通信、救助和值勤标准。 对方已接受，双方获得270天专项协作。"
 sof_ne_ROU_diplomacy.102.a:0 "收到"
 sof_ne_ROU_diplomacy.202.t:0 "诺曼底—布列塔尼沿海救助协作：未达成"
 sof_ne_ROU_diplomacy.202.d:0 "对方没有接受。可使用地方国策中的境内替代方案继续推进。"
