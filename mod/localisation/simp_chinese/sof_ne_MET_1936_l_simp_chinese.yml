l_simp_chinese:
 sof_ne_MET_assembly:0 "召集梅斯地区会议"
 sof_ne_MET_assembly_desc:0 "矿主、工会、市镇与边防司令部将以共同计划协调生产和防务。梅斯将召集地区会议，把生产、财政和防卫的责任放在同一张桌上。"
 sof_ne_MET_accounts:0 "清点矿炉与订单"
 sof_ne_MET_accounts_desc:0 "分别登记布里埃矿石、焦煤、炼钢与机械加工，让各工场在供应链中承担清晰职责。"
 sof_ne_MET_rights:0 "跨省权利与义务"
 sof_ne_MET_rights_desc:0 "承认摩泽尔地方制度与邻近省份法律沿革不同，先列出争议事项。"
 sof_ne_MET_survey:0 "边防地形与通行调查"
 sof_ne_MET_survey_desc:0 "前沿工事必须有退路，机动部队必须有补给。我们将重新勘察摩泽尔和默兹之间的道路、桥梁与仓储条件，为两种防卫体系准备共同底图。"
 sof_ne_MET_briey_bonus:0 "布里埃矿坑排水"
 sof_ne_MET_briey:0 "布里埃矿坑排水"
 sof_ne_MET_briey_desc:0 "排水设备和巷道维护先于产能承诺。"
 sof_ne_MET_coke_bonus:0 "福尔巴克焦煤核算"
 sof_ne_MET_coke:0 "福尔巴克焦煤核算"
 sof_ne_MET_coke_desc:0 "煤种和焦化能力必须分清；矿石无法直接变成军械。"
 sof_ne_MET_housing_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_MET_housing:0 "阿贡当日住房议约"
 sof_ne_MET_housing_desc:0 "阿贡当日的高炉依靠工人的长期定居而运转。住宅、排水和诊疗条件应成为供货合同的一部分，让钢城能够留住熟练工人。"
 sof_ne_MET_municipal:0 "市镇财政授权"
 sof_ne_MET_municipal_desc:0 "赋予市镇支出裁量权，之后仍受地区审计。"
 sof_ne_MET_prefect:0 "省级统一预算"
 sof_ne_MET_prefect_desc:0 "集中预算提高动员速度，但须在共同程序中接受追责。"
 sof_ne_MET_frontier_bonus:0 "摩泽尔掩体勘测"
 sof_ne_MET_frontier:0 "摩泽尔掩体勘测"
 sof_ne_MET_frontier_desc:0 "摩泽尔东岸的村落、道路和林缘需要逐段测绘。工兵先确定观察与通行条件，再选择值得投入混凝土和火力的地点。"
 sof_ne_MET_fallback:0 "凡尔登后撤仓储"
 sof_ne_MET_fallback_desc:0 "把旧战场经验用于撤运和弹药分散，完善本阶段后方准备。"
 sof_ne_MET_safety:0 "矿区安全监察"
 sof_ne_MET_safety_desc:0 "劳资代表共同审查检修停产，承担短期产量代价。"
 sof_ne_MET_forges_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_MET_fire:0 "热夫工厂消防约定"
 sof_ne_MET_fire_desc:0 "热夫的车间、消防队和医疗服务同样属于工业生产的基础。我们将与工厂代表谈妥维修责任，减少火灾与设备故障造成的停工。"
 sof_ne_MET_clinic:0 "钢城门诊与班次"
 sof_ne_MET_clinic_desc:0 "通过轮班制度和门诊服务完成住房配套，保障工人生活与持续生产。"
 sof_ne_MET_public_audit:0 "公开地区审计"
 sof_ne_MET_public_audit_desc:0 "两种预算制度均接入统一审计与司法救济，使各项建设继续按共同程序推进。"
 sof_ne_MET_east_bank:0 "东岸路障施工"
 sof_ne_MET_east_bank_desc:0 "勘测已经完成，工兵可以在摩泽尔东岸的重要通行节点开工。路障与掩体将拖慢进犯者，给后方预备队争取展开时间。"
 sof_ne_MET_forbach_screen:0 "福尔巴克前哨网"
 sof_ne_MET_forbach_screen_desc:0 "城镇前哨和观察体系仅在己方完全控制州内建造。"
 sof_ne_MET_evacuation:0 "默兹撤运演习"
 sof_ne_MET_evacuation_desc:0 "检验卡车、步行纵队和弹药列车的交叉时序。"
 sof_ne_MET_ore:0 "矿山检修基金"
 sof_ne_MET_ore_desc:0 "检修提升既有资源；无额外矿脉奖励。"
 sof_ne_MET_rolling_bonus:0 "轧机工具标准"
 sof_ne_MET_rolling:0 "轧机工具标准"
 sof_ne_MET_rolling_desc:0 "标准化辊具和公差，再考虑军用订单。"
 sof_ne_MET_bargain:0 "工资与交货仲裁"
 sof_ne_MET_bargain_desc:0 "解决工资争议，建立稳定的交货计划。地区仲裁席将把班次、报酬与生产目标同时纳入合同，使工人与工厂都能要求履约。"
 sof_ne_MET_language:0 "公共文书语言保障"
 sof_ne_MET_language_desc:0 "边区居民得到可理解的行政文书与申诉渠道。"
 sof_ne_MET_local_law:0 "清点摩泽尔地方法"
 sof_ne_MET_local_law_desc:0 "逐项登记摩泽尔适用的特殊法律，并明确各地制度的范围与责任。"
 sof_ne_MET_signals_bonus:0 "掩体电话与前哨联络"
 sof_ne_MET_signals:0 "掩体电话与前哨联络"
 sof_ne_MET_signals_desc:0 "将两处防区接入共同通信训练，使工事、守备与后方联络协同运转。"
 sof_ne_MET_toul:0 "图勒交通与后方站"
 sof_ne_MET_toul_desc:0 "州级交通改善不冒认具体铁路线路已全线连通。"
 sof_ne_MET_works_compact:0 "洛林矿钢供货契约"
 sof_ne_MET_works_compact_desc:0 "安全、轧机和工资三线齐备才形成可执行产能计划。"
 sof_ne_MET_civil_service:0 "共同行政资格"
 sof_ne_MET_civil_service_desc:0 "统一资格承认与例外清单；不改全国选举或党派数据。"
 sof_ne_MET_reserves:0 "轮换边防预备队"
 sof_ne_MET_reserves_desc:0 "前沿通信和后方撤运必须同时具备。"
 sof_ne_MET_nancy:0 "南锡工程课堂"
 sof_ne_MET_nancy_desc:0 "南锡的工程课堂可以为矿山、轧机和维修车间提供同一套技术语言。我们将支持实习、材料试验与夜间课程，把经验变成可以传授的工序。"
 sof_ne_MET_military_orders_bonus:0 "优先炮件订单"
 sof_ne_MET_military_orders:0 "优先炮件订单"
 sof_ne_MET_military_orders_desc:0 "优先军用加工，放弃同阶段民用机具扶持。"
 sof_ne_MET_civil_orders_bonus:0 "优先民用机具"
 sof_ne_MET_civil_orders:0 "优先民用机具"
 sof_ne_MET_civil_orders_desc:0 "先修复生产工具，再用统一标准接回军需。"
 sof_ne_MET_veterans:0 "退伍军人与市镇救济"
 sof_ne_MET_veterans_desc:0 "为战伤和失业救济提供跨市镇结算。"
 sof_ne_MET_courts:0 "边区争端复核席"
 sof_ne_MET_courts_desc:0 "边境警察与海关决定可受民事复核。"
 sof_ne_MET_mobile:0 "机动预备队学说"
 sof_ne_MET_mobile_desc:0 "将有限训练资源投入机动增援，区别于固定要塞值勤。"
 sof_ne_MET_fortress_bonus:0 "堡垒值勤学说"
 sof_ne_MET_fortress:0 "堡垒值勤学说"
 sof_ne_MET_fortress_desc:0 "侧重火力和预备阵地，不赋予永久无敌边境。"
 sof_ne_MET_metz_dispatch:0 "梅斯货运分流"
 sof_ne_MET_metz_dispatch_desc:0 "矿钢、民用和撤运列车分开登记优先级。"
 sof_ne_MET_inspection_standards_bonus:0 "军民材料验收"
 sof_ne_MET_inspection_standards:0 "军民材料验收"
 sof_ne_MET_inspection_standards_desc:0 "两种订单优先政策最终使用同一质量检验规则。"
 sof_ne_MET_charter:0 "洛林行政章程"
 sof_ne_MET_charter_desc:0 "市镇自治与省级协调已经取得共同框架。洛林行政章程将公开划分议事、执行、审计和申诉的权限，为未来的共同国家留下清晰接口。"
 sof_ne_MET_combined:0 "边防与机动联合演习"
 sof_ne_MET_combined_desc:0 "学说选择在实兵协同中汇合。"
 sof_ne_MET_delegation:0 "派遣两条交通代表团"
 sof_ne_MET_delegation_desc:0 "只开启协商，邻国保有拒绝权。"
 sof_ne_MET_industrial_yard:0 "热夫专用维修车间"
 sof_ne_MET_industrial_yard_desc:0 "矿石、焦煤、工人和车皮已经有了配套安排。热夫现在可以扩建专门维修车间，承接稳定的军械加工和部件修复订单。"
 sof_ne_MET_officer_school:0 "南锡参谋图上作业"
 sof_ne_MET_officer_school_desc:0 "补给、桥梁和动员假设必须由参谋演练验证。"
 sof_ne_MET_anti_air:0 "梅斯重要设施防空"
 sof_ne_MET_anti_air_desc:0 "防护城市与车站，不向敌方控制地区加建。"
 sof_ne_MET_alsace:0 "向阿尔萨斯提出机床转运"
 sof_ne_MET_alsace_desc:0 "向斯特拉斯堡提出合作，由其独立决定接受或拒绝，并自行安排贸易政策。"
 sof_ne_MET_champagne:0 "向香槟提出军需班表"
 sof_ne_MET_champagne_desc:0 "对方同意后双方才获得限期运输协作。"
 sof_ne_MET_civil_repair:0 "南锡民用维修网络"
 sof_ne_MET_civil_repair_desc:0 "长期投资落在己有且完全控制的南锡州。"
 sof_ne_MET_metallurgy_bonus:0 "冶金试验小组"
 sof_ne_MET_metallurgy:0 "冶金试验小组"
 sof_ne_MET_metallurgy_desc:0 "改进热处理与质量测试，保留原料短缺的约束。"
 sof_ne_MET_army_manual_bonus:0 "洛林守备手册"
 sof_ne_MET_army_manual:0 "洛林守备手册"
 sof_ne_MET_army_manual_desc:0 "结合参谋课程与设施防护，形成通用守备训练。"
 sof_ne_MET_accepted_routes:0 "签署运输实施细则"
 sof_ne_MET_accepted_routes_desc:0 "邻区已经批准合作，我们应立即把承诺落实成可执行的车皮分配、交货时限和检修责任。互惠条款必须在第一批货物抵达之前生效。"
 sof_ne_MET_self_reliant_bonus:0 "准备境内替代班表"
 sof_ne_MET_self_reliant:0 "准备境内替代班表"
 sof_ne_MET_self_reliant_desc:0 "谈判拒绝或邻国消失也可继续本国内政主树。"
 sof_ne_MET_industrial_balance_bonus:0 "保持矿钢军民平衡"
 sof_ne_MET_industrial_balance:0 "保持矿钢军民平衡"
 sof_ne_MET_industrial_balance_desc:0 "完整产业链形成后，进行一次财政回收，集中结算前期建设成果。"
 sof_ne_MET_border_hospitals_bonus:0 "边区救护演练"
 sof_ne_MET_border_hospitals:0 "边区救护演练"
 sof_ne_MET_border_hospitals_desc:0 "伤员分类和后送路线与工厂消防相互补充。"
 sof_ne_MET_rail_reserve_bonus:0 "预留后方军用班次"
 sof_ne_MET_rail_reserve:0 "预留后方军用班次"
 sof_ne_MET_rail_reserve_desc:0 "铁路优先权来自本地安排，非对邻国铁路的强制控制。"
 sof_ne_MET_conference:0 "跨区域共同账册"
 sof_ne_MET_conference_desc:0 "有协定则记入双方义务，无协定则登记本国替代成本。"
 sof_ne_MET_readiness:0 "完成洛林防卫评估"
 sof_ne_MET_readiness_desc:0 "完成后方、前沿与医疗准备，建立相互支撑的防卫体系。"
 sof_ne_MET_transition:0 "为统一准备资产清单"
 sof_ne_MET_transition_desc:0 "可以提前编制整合清单，但以下实施必须等待统一完成。"
 sof_ne_MET_national_settlement:0 "统一后的洛林结算"
 sof_ne_MET_national_settlement_desc:0 "只有既有统一系统确认完成后才启动；本树不吞并其他地区。"
 sof_ne_MET_mining_records_bonus:0 "移交矿业检修档案"
 sof_ne_MET_mining_records:0 "移交矿业检修档案"
 sof_ne_MET_mining_records_desc:0 "把真实可用的本地矿业档案纳入全国体系。"
 sof_ne_MET_fort_records:0 "合并要塞与后撤档案"
 sof_ne_MET_fort_records_desc:0 "全国参谋部接收已完成的地方防卫测绘。"
 sof_ne_MET_law_harmonization:0 "保留摩泽尔法律核对表"
 sof_ne_MET_law_harmonization_desc:0 "逐项记录地方制度、例外与过渡条款，让统一行政尊重已有权利。"
 sof_ne_MET_pensions:0 "跨区养老金对账"
 sof_ne_MET_pensions_desc:0 "只体现行政对账，不杜撰1936年全国法案已在一月实施。"
 sof_ne_MET_arsenal_standards_bonus:0 "统一兵工质量标准"
 sof_ne_MET_arsenal_standards:0 "统一兵工质量标准"
 sof_ne_MET_arsenal_standards_desc:0 "边区炮件与全国弹药规格接轨。"
 sof_ne_MET_unification_mandate:0 "以洛林为统一支点"
 sof_ne_MET_unification_mandate_desc:0 "地方整军将为全国统一提供骨干。授权以本区为支点重建法国共同国家，解锁边境统一战役，并通过既有战役系统取得合法相邻目标的吞并战争目标。"
 sof_ne_MET_lorraine_in_france:0 "洛林在共同国家之内"
 sof_ne_MET_lorraine_in_france_desc:0 "矿业档案、地方财政与边防经验已经进入共同体系。洛林不再只是国家的边缘产区：新的研究机构将把这里的技术积累用于全国重建。"
 sof_ne_MET_ledger:0 "矿钢联席账册"
 sof_ne_MET_ledger_desc:0 "透明账册减少原料和订单错配。"
 sof_ne_MET_inspection:0 "劳资安全监察"
 sof_ne_MET_inspection_desc:0 "安全停机降低即时产量，换取稳定。"
 sof_ne_MET_arbitration:0 "洛林仲裁席"
 sof_ne_MET_arbitration_desc:0 "地方争议公开裁决，不指定执政党。"
 sof_ne_MET_reserve:0 "边防轮换制"
 sof_ne_MET_reserve_desc:0 "轮换部队需要额外训练时间。"
 sof_ne_MET_contracts:0 "军民订单分账"
 sof_ne_MET_contracts_desc:0 "军民订单分别结算，统筹赶工进度与现有原料供应。"
 sof_ne_MET_schools:0 "南锡工程课程"
 sof_ne_MET_schools_desc:0 "有限的地方技术训练。"
 sof_ne_MET_commerce:0 "洛林运输互惠"
 sof_ne_MET_commerce_desc:0 "获双方接受后生效的限期运输协作。"
 sof_ne_MET_integration:0 "统一国家的洛林结算处"
 sof_ne_MET_integration_desc:0 "统一后保留地区技术档案和债务对账。"
 sof_ne_MET_mobile_response:0 "洛林机动增援指挥"
 sof_ne_MET_mobile_response_desc:0 "机动预备队优先训练转进与快速增援。"
 sof_ne_MET_fortress_fire:0 "洛林堡垒火力指挥"
 sof_ne_MET_fortress_fire_desc:0 "守备体系优先掩体和预设火力阵地。"
 sof_ne_MET_alsace_accord:0 "矿钢—机床联供计划"
 sof_ne_MET_alsace_accord_desc:0 "双方统一材料交货与机床修理标准。 双方接受后持续270天。"
 sof_ne_MET_champagne_accord:0 "默兹纵深联合演练"
 sof_ne_MET_champagne_accord_desc:0 "双方协调预备队演练和军需班表。 双方接受后持续270天。"
 sof_ne_MET_housing_local:0 "阿贡当日钢厂住宅契约"
 sof_ne_MET_housing_local_desc:0 "以阿贡当日镇为中心改善工人住宅与公共卫生。"
 sof_ne_MET_forges_local:0 "热夫锻造与消防网络"
 sof_ne_MET_forges_local_desc:0 "热夫城镇锚定的锻造维护网络，依赖整个布里埃州控制。"
 sof_ne_MET_ore_local:0 "布里埃矿山检修"
 sof_ne_MET_ore_local_desc:0 "提高已有矿山产出；不新造钢铁矿藏。"
 sof_ne_MET_rail_local:0 "梅斯铁路分流台"
 sof_ne_MET_rail_local_desc:0 "梅斯控制区的货流分配。"
 sof_ne_MET_depth_local:0 "凡尔登后方仓库"
 sof_ne_MET_depth_local_desc:0 "本地粮弹分散，不假定旧要塞无敌。"
 sof_ne_MET_housing_decision:0 "落实阿贡当日住宅卫生合同"
 sof_ne_MET_housing_decision_desc:0 "钢厂住房与排水占用预算，完成一次后不再重复。"
 sof_ne_MET_forges_decision:0 "支付热夫消防与维修合同"
 sof_ne_MET_forges_decision_desc:0 "修复工厂消防和检修班组；城镇只是工业网络锚点。"
 sof_ne_MET_local_investments:0 "梅斯：矿炉与边防之间：地方工程"
 sof_ne_MET_diplomacy.1.t:0 "洛林—阿尔萨斯机床运输议定书"
 sof_ne_MET_diplomacy.1.d:0 "双方统一材料交货与机床修理标准。 接受后双方获得270天的专项协作收益。可接受，也可拒绝。"
 sof_ne_MET_diplomacy.1.a:0 "同意协作"
 sof_ne_MET_diplomacy.101.t:0 "洛林—阿尔萨斯机床运输议定书：已接受"
 sof_ne_MET_diplomacy.101.d:0 "双方统一材料交货与机床修理标准。 对方已接受，双方获得270天专项协作。"
 sof_ne_MET_diplomacy.101.a:0 "收到"
