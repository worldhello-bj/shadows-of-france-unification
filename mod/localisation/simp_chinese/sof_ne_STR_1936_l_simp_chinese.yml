l_simp_chinese:
 sof_ne_STR_register:0 "登记阿尔萨斯地方制度"
 sof_ne_STR_register_desc:0 "阿尔萨斯的地方制度承载着居民的权利与公共生活。我们将登记现行权利、行政手续和公共服务义务，让各地代表共同推进改革。"
 sof_ne_STR_language:0 "双语行政的实际需求"
 sof_ne_STR_language_desc:0 "统计司法、市镇与学校的翻译需求，避免用语言判断居民忠诚。"
 sof_ne_STR_rhine_survey_bonus:0 "清点莱茵货运接口"
 sof_ne_STR_rhine_survey:0 "清点莱茵货运接口"
 sof_ne_STR_rhine_survey_desc:0 "莱茵河港连接远方市场，萨韦尔讷山口连接西部腹地，南部线路连接米卢斯工场。先查清各个接口的运力，才能制定可靠的地区经济计划。"
 sof_ne_STR_defense_communes:0 "市镇边防责任清单"
 sof_ne_STR_defense_communes_desc:0 "明确守备军与市镇民事责任的界限，拒绝军队自行接管全部制度。"
 sof_ne_STR_tribunal:0 "地方法院文书对照"
 sof_ne_STR_tribunal_desc:0 "先核对程序与权利，之后才讨论统一或保留制度。"
 sof_ne_STR_schools:0 "双语教师资格互认"
 sof_ne_STR_schools_desc:0 "提供公平公共服务，不强制全国意识形态或政党。"
 sof_ne_STR_river_port:0 "河港仓库轮值"
 sof_ne_STR_river_port_desc:0 "驳船等待泊位，仓库等待车皮，工厂等待原料。斯特拉斯堡港将建立协调轮值，减少货物在河岸与铁路之间反复滞留。"
 sof_ne_STR_saverne:0 "萨韦尔讷山口调度"
 sof_ne_STR_saverne_desc:0 "协调山口道路与既有铁路时刻，改善转运衔接。"
 sof_ne_STR_wissem_bonus:0 "维桑堡观察勤务"
 sof_ne_STR_wissem:0 "维桑堡观察勤务"
 sof_ne_STR_wissem_desc:0 "加强北部观察站与地形巡查，为边境守备提供可靠情报。"
 sof_ne_STR_south_stock:0 "阿尔特基什预备仓库"
 sof_ne_STR_south_stock_desc:0 "南部也保留后撤供给，避免所有防御预算堆在北缘。"
 sof_ne_STR_local_guarantees:0 "保留地方制度保障"
 sof_ne_STR_local_guarantees_desc:0 "通过地方保障委员会协调宗教、社会与行政制度；需支付持续协调成本。"
 sof_ne_STR_common_forms:0 "推进共同民事手续"
 sof_ne_STR_common_forms_desc:0 "统一表格和救济期限，不将不同法律传统一笔抹去。"
 sof_ne_STR_customs:0 "莱茵通行账册"
 sof_ne_STR_customs_desc:0 "规范本国报关程序，并与邻国协商衔接标准。"
 sof_ne_STR_lorraine_offer:0 "提请洛林检修互认"
 sof_ne_STR_lorraine_offer_desc:0 "仅发出邀请，梅斯有权拒绝。"
 sof_ne_STR_border_engineers_bonus:0 "哈格瑙工兵勘测"
 sof_ne_STR_border_engineers:0 "哈格瑙工兵勘测"
 sof_ne_STR_border_engineers_desc:0 "现有防区地形调查与本地工兵训练结合。"
 sof_ne_STR_reserve_routes:0 "南部撤运线路演练"
 sof_ne_STR_reserve_routes_desc:0 "演练仓储搬运和后方救护，不预知未来战役。"
 sof_ne_STR_rights_review:0 "地方权利共同复核"
 sof_ne_STR_rights_review_desc:0 "两种制度路线重新汇合到同一个申诉与复核程序。"
 sof_ne_STR_chambers:0 "工商业与市镇听证"
 sof_ne_STR_chambers_desc:0 "开放听证程序，工会、商业与市镇代表均可陈述。"
 sof_ne_STR_customs_clearance_bonus:0 "货单与军需分轨"
 sof_ne_STR_customs_clearance:0 "货单与军需分轨"
 sof_ne_STR_customs_clearance_desc:0 "军用货运优先权必须有账可查。"
 sof_ne_STR_own_workshops_bonus:0 "保留境内检修备份"
 sof_ne_STR_own_workshops:0 "保留境内检修备份"
 sof_ne_STR_own_workshops_desc:0 "即使邻区拒绝互认，本国交通改革仍可继续。"
 sof_ne_STR_river_screen:0 "斯特拉斯堡河岸警戒"
 sof_ne_STR_river_screen_desc:0 "在实际控制的城市省份建设一级陆堡，守卫河岸通道。"
 sof_ne_STR_haguenau_forts:0 "哈格瑙交通阻滞阵地"
 sof_ne_STR_haguenau_forts_desc:0 "加强本州道路接入处的防护，按当地地形配置工事。"
 sof_ne_STR_safety_board:0 "建立联合申诉委员会"
 sof_ne_STR_safety_board_desc:0 "地方制度、劳资纠纷和语言权利按各自程序解决。"
 sof_ne_STR_machinery_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_STR_mulhouse:0 "米卢斯纺机动力合同"
 sof_ne_STR_mulhouse_desc:0 "米卢斯的纺机与动力设备经验值得集中利用。共同维修合同将把备件、工人训练和设备检验接在一起，缩短各厂停机时间。"
 sof_ne_STR_potash_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_STR_potash_contract:0 "维特尔赛姆肥料议约"
 sof_ne_STR_potash_contract_desc:0 "维特尔赛姆的钾盐矿连接着整个地区的农业生产。我们将优先处理矿井安全、设备维护和肥料运送，让地下资源真正服务于地上的田野。"
 sof_ne_STR_signals_bonus:0 "北部阵地电话网"
 sof_ne_STR_signals:0 "北部阵地电话网"
 sof_ne_STR_signals_desc:0 "统一两处防区的通信标准，让守军与后方能够及时协作。"
 sof_ne_STR_medical_bonus:0 "南部救护与轮换"
 sof_ne_STR_medical:0 "南部救护与轮换"
 sof_ne_STR_medical_desc:0 "后送能力与部队轮换共同筹备。"
 sof_ne_STR_civic_oath:0 "公共服务共同誓约"
 sof_ne_STR_civic_oath_desc:0 "效忠公开法律程序，不要求任何特定党派执政。"
 sof_ne_STR_clerks_bonus:0 "行政人员跨区培训"
 sof_ne_STR_clerks:0 "行政人员跨区培训"
 sof_ne_STR_clerks_desc:0 "档案索引与统计训练提高行政协作。"
 sof_ne_STR_precision:0 "纺机与精密工序"
 sof_ne_STR_precision_desc:0 "机床公差、纺机维修和动力设备组成有限专业网络。"
 sof_ne_STR_farm_inputs:0 "肥料与农具分配"
 sof_ne_STR_farm_inputs_desc:0 "投资矿区至农产集散地的州级交通。"
 sof_ne_STR_garrison:0 "共同守备训练名册"
 sof_ne_STR_garrison_desc:0 "通信与医疗两条后勤支线必须完成。"
 sof_ne_STR_compact:0 "阿尔萨斯公共制度协约"
 sof_ne_STR_compact_desc:0 "语言服务、民事手续、地方保障和申诉制度已经逐一讨论。各地代表可以签署共同协约，使阿尔萨斯能够以明确的条件参与更广泛的国家重建。"
 sof_ne_STR_textile_orders_bonus:0 "先行纺织民用订单"
 sof_ne_STR_textile_orders:0 "先行纺织民用订单"
 sof_ne_STR_textile_orders_desc:0 "优先民用纺机和就业，暂缓军用加工扩大。"
 sof_ne_STR_machine_orders_bonus:0 "先行军械加工订单"
 sof_ne_STR_machine_orders:0 "先行军械加工订单"
 sof_ne_STR_machine_orders_desc:0 "把一部分精密加工能力转向军需，将使地区获得更可靠的武器和备件。民用订单必须让出部分工期，工人资格和材料验收仍不得降低。"
 sof_ne_STR_colmar:0 "科尔马农产集散"
 sof_ne_STR_colmar_desc:0 "农业支线从矿区接回城镇集散，不与军工线同额发厂。"
 sof_ne_STR_mounted:0 "边区机动巡查"
 sof_ne_STR_mounted_desc:0 "训练资源优先投向侦察和增援。"
 sof_ne_STR_static_bonus:0 "分散据点值守"
 sof_ne_STR_static:0 "分散据点值守"
 sof_ne_STR_static_desc:0 "优先本地防护工程和守备轮换。"
 sof_ne_STR_qualified_bonus:0 "共用工序资格证"
 sof_ne_STR_qualified:0 "共用工序资格证"
 sof_ne_STR_qualified_desc:0 "军民订单在工人资格互认处汇合。"
 sof_ne_STR_jura_offer:0 "邀请贝桑松精密协作"
 sof_ne_STR_jura_offer_desc:0 "米卢斯需要可靠的量具与精密部件，贝桑松的工场也需要稳定订单。我们将提议互认技术标准并交换经验，由双方分别决定是否加入。"
 sof_ne_STR_frontier_manual:0 "莱茵防务行动手册"
 sof_ne_STR_frontier_manual_desc:0 "不同作战取向共用明确的指挥交接规则。"
 sof_ne_STR_audit_exports:0 "核查跨区出口承诺"
 sof_ne_STR_audit_exports_desc:0 "制度协约必须与真实的对外义务核对。"
 sof_ne_STR_machine_hall:0 "米卢斯专门维修厅"
 sof_ne_STR_machine_hall_desc:0 "重整动力和纺机维修后才扩建一处民用产能。"
 sof_ne_STR_quality_lab_bonus:0 "斯特拉斯堡质量检验"
 sof_ne_STR_quality_lab:0 "斯特拉斯堡质量检验"
 sof_ne_STR_quality_lab_desc:0 "质量计量与报关单证形成可检验的标准。"
 sof_ne_STR_signed_orders_bonus:0 "执行获准互认订单"
 sof_ne_STR_signed_orders:0 "执行获准互认订单"
 sof_ne_STR_signed_orders_desc:0 "至少一方接受后才能执行该支线。"
 sof_ne_STR_fallback_orders:0 "改用境内短程订单"
 sof_ne_STR_fallback_orders_desc:0 "境内建设路线始终保留。"
 sof_ne_STR_antiair:0 "河港设施防空班"
 sof_ne_STR_antiair_desc:0 "保护本地货运与城市设施。"
 sof_ne_STR_border_relief_bonus:0 "山口换班与补给"
 sof_ne_STR_border_relief:0 "山口换班与补给"
 sof_ne_STR_border_relief_desc:0 "以持续补给维持边境守备，让工事、运输与轮换人员共同发挥作用。"
 sof_ne_STR_river_compact:0 "河港与腹地共同清算"
 sof_ne_STR_river_compact_desc:0 "按获准订单安排运输；协商未果时承担境内替代成本。"
 sof_ne_STR_industry_balance_bonus:0 "上下阿尔萨斯工序协调"
 sof_ne_STR_industry_balance:0 "上下阿尔萨斯工序协调"
 sof_ne_STR_industry_balance_desc:0 "南北工业与农业支线三向汇合。"
 sof_ne_STR_defense_audit:0 "市镇防务年度复核"
 sof_ne_STR_defense_audit_desc:0 "市镇与军事部门共同复核权责、费用和撤运准备。"
 sof_ne_STR_unification_docket:0 "编制地方制度交接卷"
 sof_ne_STR_unification_docket_desc:0 "提前准备卷宗，执行须待共同国家建立。"
 sof_ne_STR_join_administration:0 "统一后的地方制度会议"
 sof_ne_STR_join_administration_desc:0 "现有统一系统完成后，开始协商地方制度过渡。"
 sof_ne_STR_school_transition:0 "全国教师资格过渡"
 sof_ne_STR_school_transition_desc:0 "保留必要的语言服务，同时互认资格。"
 sof_ne_STR_factory_transition_bonus:0 "全国机床标准接轨"
 sof_ne_STR_factory_transition:0 "全国机床标准接轨"
 sof_ne_STR_factory_transition_desc:0 "米卢斯工序档案纳入全国制造标准。"
 sof_ne_STR_command_transition:0 "统一边防指挥交接"
 sof_ne_STR_command_transition_desc:0 "指挥交接与地方民事权利同时保留明确边界。"
 sof_ne_STR_rights_schedule:0 "公布地方例外与期限"
 sof_ne_STR_rights_schedule_desc:0 "公开哪些制度继续适用、哪些在过渡期协调。"
 sof_ne_STR_rhine_accounts_bonus:0 "全国河港货单接口"
 sof_ne_STR_rhine_accounts:0 "全国河港货单接口"
 sof_ne_STR_rhine_accounts_desc:0 "统一运输单证，依照双方协议开展境外协作。"
 sof_ne_STR_unification_mandate:0 "从莱茵通道重连法国"
 sof_ne_STR_unification_mandate_desc:0 "地方整军将为全国统一提供骨干。授权以本区为支点重建法国共同国家，解锁边境统一战役，并通过既有战役系统取得合法相邻目标的吞并战争目标。"
 sof_ne_STR_alsace_in_france:0 "阿尔萨斯的共同国家契约"
 sof_ne_STR_alsace_in_france_desc:0 "共同国家既需要阿尔萨斯的工序，也需要理解这里的制度。新的研究网络将吸收地方技术，公共协约则为居民保留清晰可行的权利保障。"
 sof_ne_STR_registry:0 "地方制度登记处"
 sof_ne_STR_registry_desc:0 "把需要协调的法律分类列明，保留争议处理程序。"
 sof_ne_STR_bilingual:0 "双语公共服务"
 sof_ne_STR_bilingual_desc:0 "以语言保障完善民事程序，尊重居民既有政治选择。"
 sof_ne_STR_civil_code:0 "共同民事手续"
 sof_ne_STR_civil_code_desc:0 "行政统一节约成本，但改革初期产生磨合。"
 sof_ne_STR_local_code:0 "地方保障委员会"
 sof_ne_STR_local_code_desc:0 "保留地方制度需要持续协调成本。"
 sof_ne_STR_militia:0 "边区值勤轮换"
 sof_ne_STR_militia_desc:0 "民兵与常备军共用训练标准，以现有人力与装备组织训练。"
 sof_ne_STR_commerce:0 "莱茵腹地运输合作"
 sof_ne_STR_commerce_desc:0 "双方接受后180天内的运输协作。"
 sof_ne_STR_integration:0 "统一后的阿尔萨斯协调局"
 sof_ne_STR_integration_desc:0 "地方制度清单与全国技术标准并存。"
 sof_ne_STR_lorraine_accord:0 "山口车辆检修互认"
 sof_ne_STR_lorraine_accord_desc:0 "共享运输车辆检修标准，缩短山口货运停机。 双方接受后持续270天。"
 sof_ne_STR_jura_accord:0 "阿尔萨斯—汝拉精密协作"
 sof_ne_STR_jura_accord_desc:0 "双方技术人员交换精密加工与量具经验。 双方接受后持续365天。"
 sof_ne_STR_potash_local:0 "维特尔赛姆钾盐配给"
 sof_ne_STR_potash_local_desc:0 "矿山安全和肥料周转腾挪地方生产空间；钾盐不转化成石油或铁矿。"
 sof_ne_STR_machinery_local:0 "米卢斯纺机动力维修"
 sof_ne_STR_machinery_local_desc:0 "米卢斯城镇为工序网络锚点，不冒称其为机车总装厂。"
 sof_ne_STR_rhine_local:0 "斯特拉斯堡河港周转"
 sof_ne_STR_rhine_local_desc:0 "本州港口仓储与驳船周转；无权保障外国河段。"
 sof_ne_STR_passes_local:0 "萨韦尔讷山口班表"
 sof_ne_STR_passes_local_desc:0 "本州山口和道路货运协调。"
 sof_ne_STR_sundgau_local:0 "阿尔特基什分散仓库"
 sof_ne_STR_sundgau_local_desc:0 "南部地区预备仓储，仅在己有完全控制州启用。"
 sof_ne_STR_potash_decision:0 "支付钾盐矿安全与配给费用"
 sof_ne_STR_potash_decision_desc:0 "矿井通风和肥料运输占用地方预算；只可投资一次。"
 sof_ne_STR_machinery_decision:0 "签订米卢斯动力维修合同"
 sof_ne_STR_machinery_decision_desc:0 "厂址证据未细分到该省份，城镇只作为地方网络接入点。"
 sof_ne_STR_local_investments:0 "斯特拉斯堡：莱茵两岸的地方制度：地方工程"
