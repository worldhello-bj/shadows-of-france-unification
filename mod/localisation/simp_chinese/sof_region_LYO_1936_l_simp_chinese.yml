 sof_region_LYO_1936_mediation_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。1936年3月后，围绕当地劳资冲突开展协商，争取工资与安全妥协，为恢复生产建立共同规则。"
 sof_region_LYO_1936_housing:0 "工人住宅与伤病救助"
