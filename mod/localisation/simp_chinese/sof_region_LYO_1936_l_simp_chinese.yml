l_simp_chinese:
 sof_region_LYO_1936:0 "里昂：三城工业与罗讷协约"
 sof_region_LYO_1936_agreement:0 "地方技术协作备忘录"
 sof_region_LYO_1936_council:0 "召开罗讷地方会议"
 sof_region_LYO_1936_council_desc:0 "以里昂市政、工会和周边行政代表组织临时会议；赫里欧的地方政治传统提供背景，不预定任何党派必然执政。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_council_bonus:0 "召开罗讷地方会议：专项研究"
 sof_region_LYO_1936_council_a0_bonus:0 "召开罗讷地方会议：专项研究"
 sof_region_LYO_1936_council_a1_bonus:0 "召开罗讷地方会议：专项研究"
 sof_region_LYO_1936_accounts:0 "公布市政与省级账册"
 sof_region_LYO_1936_accounts_desc:0 "将市政信用、战争开支与省级日常支出分开登记，避免动员预算挤占基本服务。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_accounts_bonus:0 "公布市政与省级账册：专项研究"
 sof_region_LYO_1936_accounts_a0_bonus:0 "公布市政与省级账册：专项研究"
 sof_region_LYO_1936_accounts_a1_bonus:0 "公布市政与省级账册：专项研究"
 sof_region_LYO_1936_delegates:0 "工场与山地代表"
 sof_region_LYO_1936_delegates_desc:0 "工业都市与山地县份都须参与预算讨论，人口集中的里昂不能独占协商席位。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_delegates_bonus:0 "工场与山地代表：专项研究"
 sof_region_LYO_1936_delegates_a0_bonus:0 "工场与山地代表：专项研究"
 sof_region_LYO_1936_municipal:0 "维持市镇自治"
 sof_region_LYO_1936_municipal_desc:0 "将民政与福利执行权留给市镇；协调成本使这一安排不会直接增加工业产量。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_municipal_bonus:0 "维持市镇自治：专项研究"
 sof_region_LYO_1936_municipal_a0_bonus:0 "维持市镇自治：专项研究"
 sof_region_LYO_1936_municipal_policy:0 "维持市镇自治"
 sof_region_LYO_1936_municipal_policy_desc:0 "将民政与福利执行权留给市镇；协调成本使这一安排不会直接增加工业产量。"
 sof_region_LYO_1936_executive:0 "建立省际执行局"
 sof_region_LYO_1936_executive_desc:0 "由省际机构统筹紧急采购，代价是常设行政成本；此制度不决定执政党。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_executive_bonus:0 "建立省际执行局：专项研究"
 sof_region_LYO_1936_executive_a0_bonus:0 "建立省际执行局：专项研究"
 sof_region_LYO_1936_executive_policy:0 "建立省际执行局"
 sof_region_LYO_1936_executive_policy_desc:0 "由省际机构统筹紧急采购，代价是常设行政成本；此制度不决定执政党。"
 sof_region_LYO_1936_hearing:0 "举行生产听证会"
 sof_region_LYO_1936_hearing_desc:0 "在签订长期工场合同前听取雇主、工会与技术人员意见，公开工资与工时争议。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_hearing_bonus:0 "举行生产听证会：专项研究"
 sof_region_LYO_1936_hearing_a0_bonus:0 "举行生产听证会：专项研究"
 sof_region_LYO_1936_charter:0 "罗讷行政宪章"
 sof_region_LYO_1936_charter_desc:0 "形成可供任何合法执政党运作的地方制度，保障预算公布与申诉程序。通过章程同时授予共同防卫和地方整合战争的政治授权。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_charter_bonus:0 "罗讷行政宪章：专项研究"
 sof_region_LYO_1936_charter_a0_bonus:0 "罗讷行政宪章：专项研究"
 sof_region_LYO_1936_charter_a1_bonus:0 "罗讷行政宪章：专项研究"
 sof_region_LYO_1936_charter_a2_bonus:0 "罗讷行政宪章：专项研究"
 sof_region_LYO_1936_mediation:0 "韦尼雪劳资调解"
 sof_region_LYO_1936_mediation_desc:0 "1936年3月当地冲突为现实背景；只有到相应日期后才能达成此架空工资与安全妥协，不把未来和解写成开局事实。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_mediation_bonus:0 "韦尼雪劳资调解：专项研究"
 sof_region_LYO_1936_mediation_a0_bonus:0 "韦尼雪劳资调解：专项研究"
 sof_region_LYO_1936_mediation_network:0 "韦尼雪劳资调解"
 sof_region_LYO_1936_mediation_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。1936年3月当地冲突为现实背景；只有到相应日期后才能达成此架空工资与安全妥协，不把未来和解写成开局事实。"
 sof_region_LYO_1936_housing:0 "工人住宅与伤病救助"
 sof_region_LYO_1936_housing_desc:0 "救助与住房减轻工场人员流失，但维护和财政支出长期存在。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_housing_bonus:0 "工人住宅与伤病救助：专项研究"
 sof_region_LYO_1936_housing_a0_bonus:0 "工人住宅与伤病救助：专项研究"
 sof_region_LYO_1936_housing_network:0 "工人住宅与伤病救助"
 sof_region_LYO_1936_housing_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。救助与住房减轻工场人员流失，但维护和财政支出长期存在。"
 sof_region_LYO_1936_credit:0 "审慎发行地方公债"
 sof_region_LYO_1936_credit_desc:0 "以公开预算为信用基础筹集一次性资金，举债的不安情绪是现实的政策代价。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_credit_bonus:0 "审慎发行地方公债：专项研究"
 sof_region_LYO_1936_credit_a0_bonus:0 "审慎发行地方公债：专项研究"
 sof_region_LYO_1936_credit_a1_bonus:0 "审慎发行地方公债：专项研究"
 sof_region_LYO_1936_silk:0 "清点丝绸与染料工场"
 sof_region_LYO_1936_silk_desc:0 "里昂丝绸、染整与化工之间有既有技术联系；先调查设备和熟练工，而非凭空生成化工巨头。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_silk_bonus:0 "清点丝绸与染料工场：专项研究"
 sof_region_LYO_1936_silk_a0_bonus:0 "清点丝绸与染料工场：专项研究"
 sof_region_LYO_1936_dyes:0 "染料与试剂采购"
 sof_region_LYO_1936_dyes_desc:0 "安排可追溯的染料与基础化学品采购，优先解决批次不稳定与输入中断。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_dyes_bonus:0 "染料与试剂采购：专项研究"
 sof_region_LYO_1936_dyes_a0_bonus:0 "染料与试剂采购：专项研究"
 sof_region_LYO_1936_looms:0 "小型织机更新"
 sof_region_LYO_1936_looms_desc:0 "帮助分散织造企业更新机床；新增的是地方共享生产容量，非1936年产量统计。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_looms_bonus:0 "小型织机更新：专项研究"
 sof_region_LYO_1936_looms_a0_bonus:0 "小型织机更新：专项研究"
 sof_region_LYO_1936_chemistry:0 "罗讷化工实验协作"
 sof_region_LYO_1936_chemistry_desc:0 "以大学与现有化工技术人员开展工艺试验；化工产能仍受能源和运输约束。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_chemistry_bonus:0 "罗讷化工实验协作：专项研究"
 sof_region_LYO_1936_chemistry_a0_bonus:0 "罗讷化工实验协作：专项研究"
 sof_region_LYO_1936_chemistry_network:0 "罗讷化工实验协作"
 sof_region_LYO_1936_chemistry_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。以大学与现有化工技术人员开展工艺试验；化工产能仍受能源和运输约束。"
 sof_region_LYO_1936_conversion:0 "织造工场军需合同"
 sof_region_LYO_1936_conversion_desc:0 "把适合的纺织工序用于服装、帐篷和后勤器材，避免将丝织厂直接当成重武器厂。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_conversion_bonus:0 "织造工场军需合同：专项研究"
 sof_region_LYO_1936_conversion_a0_bonus:0 "织造工场军需合同：专项研究"
 sof_region_LYO_1936_berliet:0 "核查贝利埃车间"
 sof_region_LYO_1936_berliet_desc:0 "韦尼雪工厂在1916年形成，1930年代已有柴油转向；城市VP仅用作行政与工人通达锚点。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_berliet_bonus:0 "核查贝利埃车间：专项研究"
 sof_region_LYO_1936_berliet_a0_bonus:0 "核查贝利埃车间：专项研究"
 sof_region_LYO_1936_diesel:0 "柴油发动机耐久台"
 sof_region_LYO_1936_diesel_desc:0 "在既有柴油技术上延长试验周期，不能跳跃成战后车型或凭空消除燃料需求。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_diesel_bonus:0 "柴油发动机耐久台：专项研究"
 sof_region_LYO_1936_diesel_a0_bonus:0 "柴油发动机耐久台：专项研究"
 sof_region_LYO_1936_spares:0 "卡车备件统一目录"
 sof_region_LYO_1936_spares_desc:0 "统一常用零件编号与替换库存，减少车队等待；需要持续控制韦尼雪所在州。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_spares_bonus:0 "卡车备件统一目录：专项研究"
 sof_region_LYO_1936_spares_a0_bonus:0 "卡车备件统一目录：专项研究"
 sof_region_LYO_1936_spares_network:0 "卡车备件统一目录"
 sof_region_LYO_1936_spares_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。统一常用零件编号与替换库存，减少车队等待；需要持续控制韦尼雪所在州。"
 sof_region_LYO_1936_truck_line:0 "韦尼雪总装扩建"
 sof_region_LYO_1936_truck_line_desc:0 "扩建既有卡车总装和军需维护容量，须先处理工场劳资争议。此合同一次性交付250辆军需卡车，供组建真实运输骨干。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_truck_line_bonus:0 "韦尼雪总装扩建：专项研究"
 sof_region_LYO_1936_truck_line_a0_bonus:0 "韦尼雪总装扩建：专项研究"
 sof_region_LYO_1936_truck_line_a1_bonus:0 "韦尼雪总装扩建：专项研究"
 sof_region_LYO_1936_road_test:0 "山路满载试车"
 sof_region_LYO_1936_road_test_desc:0 "将满载试车路线延伸至山地，验证制动与维护计划，不能以平原公路标准替代山路测试。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_road_test_bonus:0 "山路满载试车：专项研究"
 sof_region_LYO_1936_road_test_a0_bonus:0 "山路满载试车：专项研究"
 sof_region_LYO_1936_road_test_a1_bonus:0 "山路满载试车：专项研究"
 sof_region_LYO_1936_arsenal:0 "圣艾蒂安军械清查"
 sof_region_LYO_1936_arsenal_desc:0 "国家兵工厂是与里昂不同的工业中心，清查量规、库存和熟练工以避免重复采购。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_arsenal_bonus:0 "圣艾蒂安军械清查：专项研究"
 sof_region_LYO_1936_arsenal_a0_bonus:0 "圣艾蒂安军械清查：专项研究"
 sof_region_LYO_1936_gauges:0 "军械量规与验收"
 sof_region_LYO_1936_gauges_desc:0 "以量规标准减少批次返工；这是本地验收网络的收益，不是全国攻击力加成。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_gauges_bonus:0 "军械量规与验收：专项研究"
 sof_region_LYO_1936_gauges_a0_bonus:0 "军械量规与验收：专项研究"
 sof_region_LYO_1936_gauges_network:0 "军械量规与验收"
 sof_region_LYO_1936_gauges_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。以量规标准减少批次返工；这是本地验收网络的收益，不是全国攻击力加成。"
 sof_region_LYO_1936_barrels:0 "枪管与机床保养"
 sof_region_LYO_1936_barrels_desc:0 "先整修专用设备与刀具，再开展小幅武器工艺改进。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_barrels_bonus:0 "枪管与机床保养：专项研究"
 sof_region_LYO_1936_barrels_a0_bonus:0 "枪管与机床保养：专项研究"
 sof_region_LYO_1936_arsenal_line:0 "军械厂有限扩产"
 sof_region_LYO_1936_arsenal_line_desc:0 "扩产一条可负担的军械生产线；人员、资源与列车运力仍是制约。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_arsenal_line_bonus:0 "军械厂有限扩产：专项研究"
 sof_region_LYO_1936_arsenal_line_a0_bonus:0 "军械厂有限扩产：专项研究"
 sof_region_LYO_1936_triangle:0 "三城工业联络委员会"
 sof_region_LYO_1936_triangle_desc:0 "里昂化工与车辆、圣艾蒂安军械、格勒诺布尔技术人员形成互补网络；任一州失守，联动收益暂停。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_triangle_bonus:0 "三城工业联络委员会：专项研究"
 sof_region_LYO_1936_triangle_a0_bonus:0 "三城工业联络委员会：专项研究"
 sof_region_LYO_1936_triangle_network:0 "三城工业联络委员会"
 sof_region_LYO_1936_triangle_network_desc:0 "仅在本国拥有并完全控制所列地方枢纽时生效。城市胜利点是联络锚点，不宣称等同工厂地块。里昂化工与车辆、圣艾蒂安军械、格勒诺布尔技术人员形成互补网络；任一州失守，联动收益暂停。"
 sof_region_LYO_1936_power:0 "检修阿尔卑斯供电网络"
 sof_region_LYO_1936_power_desc:0 "利用既有山地电力联系开展检修，不宣称在短期内建成后来大型水坝。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_power_bonus:0 "检修阿尔卑斯供电网络：专项研究"
 sof_region_LYO_1936_power_a0_bonus:0 "检修阿尔卑斯供电网络：专项研究"
 sof_region_LYO_1936_technicians:0 "工业三角技术轮训"
 sof_region_LYO_1936_technicians_desc:0 "在三个技术中心之间轮训维修人员，避免反复重复采购与彼此不兼容的检测标准。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
 sof_region_LYO_1936_technicians_bonus:0 "工业三角技术轮训：专项研究"
 sof_region_LYO_1936_technicians_a0_bonus:0 "工业三角技术轮训：专项研究"
 sof_region_LYO_1936_rhone:0 "调查罗讷交通瓶颈"
 sof_region_LYO_1936_rhone_desc:0 "把铁路、河运、桥梁和公路装卸节点一起绘入军运图；交通不是单一等级数值。\n\n史实背景与架空政策分开：地方独立政体及以下数值属于游戏设计。"
