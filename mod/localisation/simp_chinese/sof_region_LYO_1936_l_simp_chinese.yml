 sof_region_LYO_1936_mediation:0 "韦尼雪劳资调解"
 sof_region_LYO_1936_mediation_desc:0 "1936年3月后，围绕当地劳资冲突开展协商，争取工资与安全妥协，为恢复生产建立共同规则。"
