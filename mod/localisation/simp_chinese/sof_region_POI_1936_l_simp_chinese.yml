l_simp_chinese:
 sof_region_POI_1936_council:0 "农牧区的共同预算"
 sof_region_POI_1936_council_desc:0 "粮食、牲畜和军械沿着不同道路离开普瓦图，却都需要同一批车辆、工匠与信用。地区预算不能只回答谁的声音最大；它必须回答下一季如何继续生活。"
 sof_region_POI_1936_price_book:0 "粮畜价格公开簿"
 sof_region_POI_1936_price_book_desc:0 "分别记录粮食、乳品和牲畜价格，避免用同一种补贴掩盖所有问题。"
 sof_region_POI_1936_local_mandate:0 "县市代表授权"
 sof_region_POI_1936_local_mandate_desc:0 "代表必须说明税收与地方工程承诺，而不是以党派名号代替授权。"
 sof_region_POI_1936_municipal_credit:0 "保留分散农贷"
 sof_region_POI_1936_municipal_credit_desc:0 "农户知道自己的土地，县级贷款组织知道哪些承诺值得担保。保留这种距离较近的信用，让各地按自己的能力投资，也让它们为自己的决定负责。"
 sof_region_POI_1936_regional_office:0 "设立地区粮务机构"
 sof_region_POI_1936_regional_office_desc:0 "收购价格在市镇间摇摆，承运人等待互不一致的命令。一个受到约束的地区粮务机构可以把这些环节接起来，但它必须接受农民和民选代表的持续审查。"
 sof_region_POI_1936_credit_guarantee:0 "限定县级担保"
 sof_region_POI_1936_credit_guarantee_desc:0 "规定每个担保项目的偿还责任，不以地方主义为无限举债理由。"
 sof_region_POI_1936_grain_appeals:0 "收购争议上诉程序"
 sof_region_POI_1936_grain_appeals_desc:0 "为小农和承运人设置上诉，统购机构不能同时担任自己的审计员。"
 sof_region_POI_1936_budget_settlement:0 "农牧财政妥协"
 sof_region_POI_1936_budget_settlement_desc:0 "让不同制度选择汇入可核查预算，不强制玩家更换执政党。"
 sof_region_POI_1936_niort:0 "尼奥尔农产交货单"
 sof_region_POI_1936_niort_desc:0 "尼奥尔的集散与普瓦捷不同，实际控制当地才可以改进运输合同。"
 sof_region_POI_1936_veterinary:0 "牲畜检疫与兽医"
 sof_region_POI_1936_veterinary_desc:0 "减少疫病和运输损失，农牧现代化不等于凭空增加可征兵人口。"
 sof_region_POI_1936_dairy:0 "集乳路线与容器"
 sof_region_POI_1936_dairy_desc:0 "把易腐乳品的收集时间、卫生容器和交货记录列入公共工程。"
 sof_region_POI_1936_dairy_local:0 "集乳路线与容器"
 sof_region_POI_1936_grains:0 "粮仓防潮检查"
 sof_region_POI_1936_grains_desc:0 "先检查现有储存与损耗，粮仓并不是替代真实农产品的魔法资源点。"
 sof_region_POI_1936_repair_coops:0 "农具共同维修"
 sof_region_POI_1936_repair_coops_desc:0 "用共同修理合同减少小农重复支出，形成当地机工与备件需求。"
 sof_region_POI_1936_repair_coops_local:0 "农具共同维修"
 sof_region_POI_1936_feed_priority:0 "饲料与乳品优先"
 sof_region_POI_1936_feed_priority_desc:0 "一头失去饲料的奶牛，无法在明天补回今天的产量。保住饲料、乳品和正常农牧生活，才能让乡村继续支持我们度过更长的危机。"
 sof_region_POI_1936_feed_priority_network:0 "饲料与乳品优先：地方体系"
 sof_region_POI_1936_army_grain:0 "军粮采购优先"
 sof_region_POI_1936_army_grain_desc:0 "部队需要粮食，运输队需要可以按时提取的储备。把军粮采购摆在优先位置，我们将得到更可靠的军需，也必须向农户解释被延后的民用承诺。"
 sof_region_POI_1936_army_grain_network:0 "军粮采购优先：地方体系"
 sof_region_POI_1936_niort_rail:0 "尼奥尔至普瓦捷联运"
 sof_region_POI_1936_niort_rail_desc:0 "完成制度和采购选择后接通两地货运；1936年不使用SNCF称号。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_POI_1936_market_credit:0 "真实交货支持农贷"
 sof_region_POI_1936_market_credit_desc:0 "信贷以实际交货和库存支持，不能以农业出口为由直接发放钢铁或橡胶。"
 sof_region_POI_1936_rural_workshops:0 "农牧维修合同扩容"
 sof_region_POI_1936_rural_workshops_desc:0 "一项有限的地方民用扩容服务工具、容器与维修，不移到未受控的随机州。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_POI_1936_school:0 "普瓦捷教育界协商"
 sof_region_POI_1936_school_desc:0 "把教师和技术人员纳入地方公共服务，大学传统不自动提供额外科研槽。"
 sof_region_POI_1936_clerks:0 "训练账房与铁路文书"
 sof_region_POI_1936_clerks_desc:0 "为粮运、港货和公共采购培养会计人员，解决同一批物资重复登记的问题。"
 sof_region_POI_1936_technical_evening:0 "机工夜校"
 sof_region_POI_1936_technical_evening_desc:0 "夜校培训量具、图纸和维修基础，学生不是瞬间成为熟练军工技师。"
 sof_region_POI_1936_tools_bonus:0 "机工夜校：技术积累"
 sof_region_POI_1936_service_schools:0 "县级公共服务实习"
 sof_region_POI_1936_service_schools_desc:0 "把卫生、统计和乡村行政纳入实习，降低市镇之间的信息差。"
 sof_region_POI_1936_research_service:0 "沙泰勒罗研究科"
 sof_region_POI_1936_research_service_desc:0 "兵工研究科可追溯至1920年，自动武器传统不应被普通农业模板遮盖。"
 sof_region_POI_1936_m1924:0 "二四与二四二九式经验"
 sof_region_POI_1936_m1924_desc:0 "以战前自动武器研制和使用经验为起点，不倒灌战后MAC1950手枪。"
 sof_region_POI_1936_infantry_bonus:0 "二四与二四二九式经验：技术积累"
 sof_region_POI_1936_gauges:0 "量规与抽样检验"
 sof_region_POI_1936_gauges_desc:0 "为零件公差、返工和抽样验收建立记录，数量不能代替质量。"
 sof_region_POI_1936_repair_lines:0 "整修自动武器产线"
 sof_region_POI_1936_repair_lines_desc:0 "先修复机具并训练工人，再考虑有限产能扩张。"
 sof_region_POI_1936_repair_lines_local:0 "整修自动武器产线"
 sof_region_POI_1936_arsenal_batches:0 "较小的可靠批次"
 sof_region_POI_1936_arsenal_batches_desc:0 "沙泰勒罗的武器必须经得起士兵反复拆装、泥土和疲劳。较小而可靠的批次会慢一些，却能让教员和工匠在故障扩大之前找到原因。"
 sof_region_POI_1936_arsenal_batches_network:0 "较小的可靠批次：地方体系"
 sof_region_POI_1936_rush_batches:0 "加速战前扩产"
 sof_region_POI_1936_rush_batches_desc:0 "威胁不会等待完美的产线。我们将扩大班次、订购机具，把更多自动武器送到部队手中；紧张的工时和返修压力，也将跟着这些订单一起到来。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_POI_1936_independent_acceptance:0 "独立的军方验收"
 sof_region_POI_1936_independent_acceptance_desc:0 "无论选择质量优先还是扩产都保留独立验收，不直接改变党派路线。"
 sof_region_POI_1936_support_bonus:0 "独立的军方验收：技术积累"
 sof_region_POI_1936_spares:0 "部队备件与返厂修理"
 sof_region_POI_1936_spares_desc:0 "把故障报告反馈给工场，优先备件和维修培训而非无限送装备。"
 sof_region_POI_1936_la_rochelle:0 "拉帕利斯港务档案"
 sof_region_POI_1936_la_rochelle_desc:0 "商港1890年启用；拉罗谢尔VP是行政和交通锚点，并非已验证的精确码头地块。"
 sof_region_POI_1936_quay_roster:0 "港工与维修班表"
 sof_region_POI_1936_quay_roster_desc:0 "盘点装卸人员、修理需求和商业货船，不预装1941年潜艇堡。"
 sof_region_POI_1936_freight_office:0 "港货与内陆票据"
 sof_region_POI_1936_freight_office_desc:0 "同一批粮食和军械使用相互可核对的票据，防止港口和内陆重复征用。"
 sof_region_POI_1936_freight_office_local:0 "港货与内陆票据"
 sof_region_POI_1936_rochefort_skills:0 "罗什福尔海军工匠"
 sof_region_POI_1936_rochefort_skills_desc:0 "旧军港1927年关闭，保存的工匠知识不等于1936年仍有大型现役造船厂。"
 sof_region_POI_1936_small_boat_repair:0 "新订小船维修合同"
 sof_region_POI_1936_small_boat_repair_desc:0 "投入新的维修合同属于架空建设，不能把关闭的军港直接复活为主力舰基地。"
 sof_region_POI_1936_small_boats_bonus:0 "新订小船维修合同：技术积累"
 sof_region_POI_1936_commercial_priority:0 "港口优先农产外运"
 sof_region_POI_1936_commercial_priority_desc:0 "维持农产回款与民用进口，军需船货必须接受排队。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_POI_1936_military_cargo:0 "港口优先军械转运"
 sof_region_POI_1936_military_cargo_desc:0 "为军械与备件设置优先时段，承认农产出口会受影响。"
 sof_region_POI_1936_port_corridor:0 "农产与兵工港运走廊"
 sof_region_POI_1936_port_corridor_desc:0 "将港口、尼奥尔和内陆采购连接，所有组成州必须仍在控制中。"
 sof_region_POI_1936_territorials:0 "市镇后备训练"
 sof_region_POI_1936_territorials_desc:0 "使用有限轮训而非永久征用全部农业劳力，训练不赠送无装备的幽灵军团。完成后开放既有边境统一战争目标决议，由玩家决定是否发动战争。"
 sof_region_POI_1936_rifle_instruction:0 "自动武器教员"
 sof_region_POI_1936_rifle_instruction_desc:0 "让部队理解自动武器维护和火力纪律，把兵工经验转为训练而非全国攻击光环。"
 sof_region_POI_1936_train_guards:0 "车站与仓库警备"
 sof_region_POI_1936_train_guards_desc:0 "保护运转节点和粮仓，守备规模不得压垮运输和收获。"
 sof_region_POI_1936_train_guards_local:0 "车站与仓库警备"
 sof_region_POI_1936_medical:0 "乡村救护教员"
 sof_region_POI_1936_medical_desc:0 "整合教育与卫生实习，训练后送和基础救護，不超出地方服务能力。"
 sof_region_POI_1936_medical_bonus:0 "乡村救护教员：技术积累"
 sof_region_POI_1936_field_exercise:0 "收获季后的后备演习"
 sof_region_POI_1936_field_exercise_desc:0 "把演习安排与农业劳作协调，军事计划不能无视地区生计。"
 sof_region_POI_1936_field_exercise_network:0 "收获季后的后备演习：地方体系"
 sof_region_POI_1936_south_offer:0 "向波尔多提议港务互认"
 sof_region_POI_1936_south_offer_desc:0 "邀请波尔多互认商业货单，拒绝不会导致强制吞并或自动同盟。"
 sof_region_POI_1936_south_offer_accord_POI:0 "向波尔多提议港务互认：双边履约"
 sof_region_POI_1936_south_offer_accord_BRD:0 "向波尔多提议港务互认：双边履约"
 sof_region_POI_1936_south_offer_accepted_notice:0 "向波尔多提议港务互认：已获同意"
 sof_region_POI_1936_south_offer_accepted_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_south_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_south_offer_declined_notice:0 "向波尔多提议港务互认：遭到拒绝"
 sof_region_POI_1936_south_offer_declined_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_south_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_south_offer_event:0 "向波尔多提议港务互认"
 sof_region_POI_1936_south_offer_event_desc:0 "邀请波尔多互认商业货单，拒绝不会导致强制吞并或自动同盟。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_POI_1936_south_offer_yes:0 "接受对等磋商"
 sof_region_POI_1936_south_offer_no:0 "拒绝本次提案"
 sof_region_POI_1936_south_contract:0 "履行南向港务互认"
 sof_region_POI_1936_south_contract_desc:0 "接受后开展本地转运培训，协议不赠送波尔多工厂。"
 sof_region_POI_1936_tours_offer:0 "向图尔提议铁路交接"
 sof_region_POI_1936_tours_offer_desc:0 "向图尔提出铁路货物和军械交接规则，双方自行决定是否加入。"
 sof_region_POI_1936_tours_offer_accord_POI:0 "向图尔提议铁路交接：双边履约"
 sof_region_POI_1936_tours_offer_accord_TRS:0 "向图尔提议铁路交接：双边履约"
 sof_region_POI_1936_tours_offer_accepted_notice:0 "向图尔提议铁路交接：已获同意"
 sof_region_POI_1936_tours_offer_accepted_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_tours_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_tours_offer_declined_notice:0 "向图尔提议铁路交接：遭到拒绝"
 sof_region_POI_1936_tours_offer_declined_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_tours_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_tours_offer_event:0 "向图尔提议铁路交接"
 sof_region_POI_1936_tours_offer_event_desc:0 "向图尔提出铁路货物和军械交接规则，双方自行决定是否加入。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_POI_1936_tours_offer_yes:0 "接受对等磋商"
 sof_region_POI_1936_tours_offer_no:0 "拒绝本次提案"
 sof_region_POI_1936_rail_contract:0 "已获同意的铁路接续"
 sof_region_POI_1936_rail_contract_desc:0 "对方同意后训练本地交接人员，不以协议代替对图尔的领土控制。"
 sof_region_POI_1936_nantes_offer:0 "与南特议民船维修"
 sof_region_POI_1936_nantes_offer_desc:0 "对南特提出维修标准协商，保留双方船台和人员的自主权。"
 sof_region_POI_1936_nantes_offer_accord_POI:0 "与南特议民船维修：双边履约"
 sof_region_POI_1936_nantes_offer_accord_NAN:0 "与南特议民船维修：双边履约"
 sof_region_POI_1936_nantes_offer_accepted_notice:0 "与南特议民船维修：已获同意"
 sof_region_POI_1936_nantes_offer_accepted_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_nantes_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_nantes_offer_declined_notice:0 "与南特议民船维修：遭到拒绝"
 sof_region_POI_1936_nantes_offer_declined_notice_desc:0 "对方已作出独立决定。接受时双方在各自实际控制的中心获得两年履约支持；拒绝不惩罚对方，也不自动转为兼并。"
 sof_region_POI_1936_nantes_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_POI_1936_nantes_offer_event:0 "与南特议民船维修"
 sof_region_POI_1936_nantes_offer_event_desc:0 "对南特提出维修标准协商，保留双方船台和人员的自主权。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_POI_1936_nantes_offer_yes:0 "接受对等磋商"
 sof_region_POI_1936_nantes_offer_no:0 "拒绝本次提案"
 sof_region_POI_1936_repair_exchange:0 "互认海员工匠证书"
 sof_region_POI_1936_repair_exchange_desc:0 "接受后开展资格互认，不把旧军港技能夸大为现成舰队。"
 sof_region_POI_1936_weights:0 "乡镇公秤与检定巡回"
 sof_region_POI_1936_weights_desc:0 "公共服务教员检查集市公秤和交货凭据，减少小农与承运人的结算争议。"
 sof_region_POI_1936_union_terms:0 "普瓦图的共同体条件"
 sof_region_POI_1936_union_terms_desc:0 "带着农贷与港运承诺参与全国统一讨论，仍须实际控制领土。"
 sof_region_POI_1936_loans_after:0 "统一后清点农贷担保"
 sof_region_POI_1936_loans_after_desc:0 "统一不能重复兑现地方担保，也不能抹去债务账簿。"
 sof_region_POI_1936_arsenal_after:0 "统一军械验收的地方席位"
