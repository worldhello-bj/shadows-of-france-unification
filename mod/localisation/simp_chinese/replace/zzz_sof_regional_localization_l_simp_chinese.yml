 SOF_PARTY_DORIOT_DORIOT_TRAINING_desc:0 "全国政治路线 · 集中动员的国家路线\n\n统筹动员工厂联络员、地方生产车间、职业训练网络。\n\n把基层组织、退伍军人与训练机构连接起来，强化地方动员能力。\n\n扩建地方加工车间，以公共装备订单维持熟练工队伍。\n\n设立职业训练与装备维修课程，让工人技术直接支撑生产和动员。\n\n建设重点：[GetSofRlTheme]。"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE:0 "[GetSofRlRegion]：地方国防承包"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE_desc:0 "全国政治路线 · 以国家秩序结束割据\n\n建立国防生产订单，让地方企业成为军队可靠的装备来源。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
