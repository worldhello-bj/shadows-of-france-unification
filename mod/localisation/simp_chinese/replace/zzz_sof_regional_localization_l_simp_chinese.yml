 SOF_PARTY_DORIOT_DORIOT_SERVICES:0 "[GetSofRlRegion]：统筹公共服务"
 SOF_PARTY_DORIOT_DORIOT_SERVICES_desc:0 "全国政治路线 · 集中动员的国家路线\n\n统筹市政服务的支持网、恢复城市信用、统筹公共服务。\n\n以市政工程回应失业和住房问题，扩大道路与公共设施。\n\n以城市信用和公共采购恢复企业订单，把失业救济转化为就业项目。\n\n协调运输、仓储与公共服务，把城市组织能力转化为可使用的物资。\n\n建设重点：[GetSofRlTheme]。"
