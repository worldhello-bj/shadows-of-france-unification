 SOF_PARTY_PDP_PDP_COMPACT_desc:0 "全国政治路线 · 法兰西社会共同体\n\n把行业协商、家庭保障与投资计划汇成长期社会契约。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_PDP_PDP_COUNCIL:0 "[GetSofRlRegion]：地方经济社会理事会"
 SOF_PARTY_PDP_PDP_COUNCIL_desc:0 "全国政治路线 · 法兰西社会共同体\n\n让社会经济议事机构把住房、交通与企业投资排出明确次序。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_PRRRS_PRRRS_COOPS:0 "[GetSofRlRegion]：合作社与农业信用"
 SOF_PARTY_PRRRS_PRRRS_COOPS_desc:0 "全国政治路线 · 重建共和法统\n\n统筹监督银行，保护储蓄、农民的共和国、合作社与农业信用。\n\n整顿地方信贷，将储蓄引向小企业设备与城市建设。\n\n以农业信用、道路和公共服务把乡村纳入共和国的发展计划。\n\n扶植合作社与农村加工企业，让农产品在地方形成更完整的产业链。\n\n建设重点：[GetSofRlTheme]。"
 SOF_PARTY_PUP_PUP_COOPERATIVES:0 "[GetSofRlRegion]：扩建合作车间"
 SOF_PARTY_PUP_PUP_COOPERATIVES_desc:0 "全国政治路线 · 生产者共和国的全国纲领\n\n统筹培养工人技术骨干、扩建合作车间。\n\n培养能够跨车间工作的技术骨干，让新装备投产时迅速继承原有经验。\n\n以工人合作车间承接公共订单，扩大装备生产和技术就业。\n\n建设重点：[GetSofRlTheme]。"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE:0 "[GetSofRlRegion]：民营承包的公共工程"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE_desc:0 "全国政治路线 · 统一市场的共和国\n\n统筹恢复工商信用、民营承包的公共工程。\n\n恢复商业信用和设备贷款，使私人储蓄进入工厂和住房建设。\n\n扶持地方企业扩建，以新的生产设施带动就业和商业网络。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY:0 "[GetSofRlRegion]：信用与秩序的复苏"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY_desc:0 "全国政治路线 · 统一市场的共和国\n\n让复苏从金融市场走向工厂与交通网络，形成持续扩张的生产能力。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_SFIO_SFIO_DEMAND:0 "[GetSofRlRegion]：以购买力走出危机"
 SOF_PARTY_SFIO_SFIO_DEMAND_desc:0 "全国政治路线 · 法兰西社会共和国\n\n通过住房与市政订单扩大就业，让购买力回流本地产业。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_SFIO_SFIO_WORKS:0 "[GetSofRlRegion]：地方储蓄建设计划"
 SOF_PARTY_SFIO_SFIO_WORKS_desc:0 "全国政治路线 · 法兰西社会共和国\n\n打通工业城镇与铁路枢纽，以公共工程连接就业、交通和生产。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_UPR_UPR_COUNCILS:0 "[GetSofRlRegion]：县市联席协商"
 SOF_PARTY_UPR_UPR_COUNCILS_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n统筹双语公共服务、县市联席协商。\n\n以地方语言服务、行政资格和技术教育沟通不同社群。\n\n赋予地方议会清晰的建设预算，改善城镇、工厂和运输节点。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。"
 SOF_PARTY_UPR_UPR_MANDATE:0 "[GetSofRlRegion]的地方委托"
 SOF_PARTY_UPR_UPR_MANDATE_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n以地方议会、宗教团体和市镇组织协调[GetSofRlRegion]的公共事务。地方代表将根据本省公共服务与产业需求提出施政计划。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_RHINE:0 "[GetSofRlRegion]：交通与公共工程"
 SOF_PARTY_UPR_UPR_RHINE_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n把本省交通、工场和市镇市场连接起来，形成可持续的地方经济。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_USR_USR_INVESTMENT:0 "[GetSofRlRegion]：统筹公共投资"
 SOF_PARTY_USR_USR_INVESTMENT_desc:0 "全国政治路线 · 以国家计划重整法国\n\n将电力、铁路与工业投资编成统一计划，连接城市和腹地的生产能力。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_USR_USR_POWER:0 "[GetSofRlRegion]：电力与公共工程"
 SOF_PARTY_USR_USR_POWER_desc:0 "全国政治路线 · 以国家计划重整法国\n\n统筹产业争议调停、电力与公共工程。\n\n建立常设劳资仲裁，把争端处理与生产合同衔接起来。\n\n扩大电力和公共事业投资，为地方工业提供稳定能源与订单。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。"
