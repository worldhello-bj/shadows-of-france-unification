 SOF_GENERIC_steel_production_desc:0 "根据核实的矿区范围改善开采、分选和供给，不再在随机土地上产生矿产。\n建设周期：35日。\n扩产仍要求控制指定矿区；各矿种拥有独立的开发路径。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。\n\n本省树只保留边界内的真实矿区，仍须实际拥有并完整控制指定矿区。占领外省矿区不会将其变成本省开发计划。\n\n本省树只保留边界内的真实矿区，仍须实际拥有并完整控制指定矿区。占领外省矿区不会将其变成本省开发计划。\n\n本省树只保留边界内的真实矿区，仍须实际拥有并完整控制指定矿区。占领外省矿区不会将其变成本省开发计划。\n\n本省树只保留边界内的真实矿区，仍须实际拥有并完整控制指定矿区。占领外省矿区不会将其变成本省开发计划。\n\n本省树只保留边界内的真实矿区，仍须实际拥有并完整控制指定矿区。占领外省矿区不会将其变成本省开发计划。"
