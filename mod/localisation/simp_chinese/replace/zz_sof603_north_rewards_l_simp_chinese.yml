 sof_ne_CHL_training_seasons:0 "为农忙避让训练时段"
 sof_ne_CHL_training_seasons_desc:0 "军队训练与收获时间进行公开协调。\n\n稳定度 +4%。"
 sof_ne_CHL_transition:0 "筹备军民资产交接"
 sof_ne_CHL_transition_desc:0 "统一前先编制卷宗，不提前改变全国主权。\n\n政治点 +50。"
 sof_ne_MET_accepted_routes:0 "签署运输实施细则"
