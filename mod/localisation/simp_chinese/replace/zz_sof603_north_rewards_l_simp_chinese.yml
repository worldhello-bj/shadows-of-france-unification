 sof_ne_AMI_own_freight:0 "采用区内货运备份"
 sof_ne_AMI_own_freight_desc:0 "无论两方是否接受协商，境内交通整理均可继续。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_AMI_picardy_in_france:0 "重建皮卡第，共建国家"
 sof_ne_AMI_picardy_in_france_desc:0 "重建土地、恢复城镇与发展航空终于汇入同一个国家计划。皮卡第的技术人员将获得更广阔的研究网络，把地方经验转化为全国能力。\n\n拥有至少12座工厂、至少3个科研槽并完整控制第70州后，开放第4个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_AMI_rail_accounts:0 "全国铁路单证接口"
 sof_ne_AMI_rail_accounts_desc:0 "在共同国家建立后协调全国运输账户。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_AMI_rail_survey:0 "北方铁路站场清点"
 sof_ne_AMI_rail_survey_desc:0 "北方铁路把皮卡第的田野、城镇与远方港口连在一起。我们将清点站场、仓库和运具，找出最值得先修复的转运环节。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_AMI_received_orders:0 "落实获准运输订单"
 sof_ne_AMI_received_orders_desc:0 "只实施至少一方明确接受的订单。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_AMI_reconstruction_settlement:0 "市镇重建结算完成"
 sof_ne_AMI_reconstruction_settlement_desc:0 "核销账册，不重复发放同一笔工程奖励。\n\n政治点 +50。"
 sof_ne_AMI_recovery_accounts:0 "汇总重建、工料与运输"
 sof_ne_AMI_recovery_accounts_desc:0 "编制全国整合所需的地方资产与债务。\n\n政治点 +50。"
 sof_ne_AMI_regional_charter:0 "皮卡第重建章程"
