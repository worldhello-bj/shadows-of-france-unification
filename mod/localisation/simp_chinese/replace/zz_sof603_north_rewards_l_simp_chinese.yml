l_simp_chinese:
 SFP_army_reform:0 "陆军改革"
 SFP_army_reform_desc:0 "陆军改革需要明确的训练和装备标准。巴黎军队将据此调整编制与作战方式。\n\n陆军改革提供30陆军经验、2次50%陆军学说花费减免，并移除「一战胜利者」国家精神。"
 SFP_extra_research_slot:0 "支持大学校"
 SFP_extra_research_slot_desc:0 "支持大学校关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n完整控制巴黎州、拥有至少6座工厂与至少2个科研槽，开放第3个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 SFP_extra_research_slot_2:0 "组建国家科研中心"
 SFP_extra_research_slot_2_desc:0 "组建国家科研中心关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n完整控制巴黎州、拥有至少12座工厂与至少3个科研槽，开放第4个科研槽；已达到该槽数则获得1次100%电子科技研究加成。第四槽还要求先完成第三槽国策。"
 SFP_industrial_expansion:0 "工业扩张"
 SFP_industrial_expansion_desc:0 "工业扩张将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在完整控制的法国州建成2座民用工厂，并合计增加2个建筑槽。"
 SFP_military_factories:0 "军用工厂"
 SFP_military_factories_desc:0 "军用工厂将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在完整控制的法国州建成2座军用工厂，并合计增加4个建筑槽。"
 SFP_strengthen_the_little_entente:0 "巩固东部协约"
 SFP_strengthen_the_little_entente_desc:0 "东部伙伴之间需要更稳定的协调。巩固现有协约，使地区安全安排能够经受新的边境危机。\n\n获得100政治点与100件支援装备，开放组建阵营。"
 SOF_BRT_E10:0 "布列塔尼科学协会"
 SOF_BRT_E10_desc:0 "拥有至少12座工厂、3个科研槽并完整控制雷恩后，开放第4个科研槽。 科研局提供1次100%电子科技研究加成。"
 SOF_BRT_E6:0 "乡村电力合作社"
 SOF_BRT_E6_desc:0 "乡村电力合作社须在地方议会和责任内阁的框架下实施。根据地方财力分配有限的人力、科研与军需资源。\n\n获得1次100%工业科技研究加成。"
