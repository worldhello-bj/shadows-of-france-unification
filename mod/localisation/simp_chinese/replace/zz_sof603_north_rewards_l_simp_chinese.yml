 sof_ne_MET_arsenal_standards_desc:0 "边区炮件与全国弹药规格接轨。\n\n获得1次100%火炮科技研究加成。"
 sof_ne_MET_bargain:0 "工资与交货仲裁"
 sof_ne_MET_bargain_desc:0 "稳定的交货计划不能建立在未解决的工资争议之上。地区仲裁席将把班次、报酬与生产目标同时纳入合同，使工人与工厂都能要求履约。\n\n稳定度 +4%。"
 sof_ne_MET_border_hospitals:0 "边区救护演练"
 sof_ne_MET_border_hospitals_desc:0 "伤员分类和后送路线与工厂消防相互补充。\n\n获得1次100%支援连科技研究加成。"
