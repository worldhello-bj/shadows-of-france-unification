 sof_ne_AMI_somme_bridges:0 "索姆河桥梁检查"
 sof_ne_AMI_somme_bridges_desc:0 "索姆河上的交通不能依靠临时命令维持。桥梁检查和替代通路调查将给民用车队与预备部队提供同一份可靠地图。\n\n获得1次100%工兵科技研究加成。"
 sof_ne_AMI_technical_network:0 "皮卡第技术工序入网"
