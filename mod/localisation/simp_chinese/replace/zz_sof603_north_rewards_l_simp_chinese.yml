 sof_ne_MET_civil_orders:0 "优先民用机具"
 sof_ne_MET_civil_orders_desc:0 "先修复生产工具，再用统一标准接回军需。\n\n获得1次75%工业科技研究加成。"
 sof_ne_MET_civil_repair:0 "南锡民用维修网络"
 sof_ne_MET_civil_repair_desc:0 "长期投资落在己有且完全控制的南锡州。\n\n在第133州建成2座民用工厂，同时增加2个建筑槽。"
 sof_ne_MET_civil_service:0 "共同行政资格"
