 sof_ne_CHL_air_observers:0 "地面观察与航空联络"
 sof_ne_CHL_air_observers_desc:0 "训练侦察联络人员，加快情报回传。\n\n空军经验 +15。"
 sof_ne_CHL_aoc:0 "1936年产地规则登记"
