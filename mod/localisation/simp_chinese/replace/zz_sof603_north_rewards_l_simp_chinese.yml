 sof_ne_CHL_mobile:0 "机动纵深预备队"
 sof_ne_CHL_mobile_desc:0 "优先机动预备队与道路转进，不保证特定未来战役结果。\n\n陆军经验 +25。 机动预备队获得150辆卡车。"
 sof_ne_CHL_own_stock:0 "保留境内粮弹调度"
