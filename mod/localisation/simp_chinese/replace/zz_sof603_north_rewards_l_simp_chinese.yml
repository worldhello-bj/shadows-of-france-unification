 sof_ne_MET_fortress:0 "堡垒值勤学说"
 sof_ne_MET_fortress_desc:0 "侧重火力和预备阵地，不赋予永久无敌边境。\n\n获得1次100%筑垒科技研究加成。 要塞炮兵获得120门火炮。"
 sof_ne_MET_frontier:0 "摩泽尔掩体勘测"
 sof_ne_MET_frontier_desc:0 "摩泽尔东岸的村落、道路和林缘需要逐段测绘。工兵先确定观察与通行条件，再选择值得投入混凝土和火力的地点。\n\n获得1次100%筑垒科技研究加成。"
 sof_ne_MET_industrial_balance:0 "保持矿钢军民平衡"
 sof_ne_MET_industrial_balance_desc:0 "获得1次75%工业科技研究加成。"
 sof_ne_MET_industrial_yard:0 "热夫专用维修车间"
 sof_ne_MET_industrial_yard_desc:0 "矿石、焦煤、工人和车皮已经有了配套安排。热夫现在可以扩建专门维修车间，承接稳定的军械加工和部件修复订单。\n\n在第94州建成2座军用工厂，同时增加2个建筑槽。"
 sof_ne_MET_inspection_standards:0 "军民材料验收"
 sof_ne_MET_inspection_standards_desc:0 "两种订单优先政策最终使用同一质量检验规则。\n\n获得1次100%建造科技研究加成。"
 sof_ne_MET_language:0 "公共文书语言保障"
 sof_ne_MET_language_desc:0 "边区居民得到可理解的行政文书与申诉渠道。\n\n稳定度 +4%。"
 sof_ne_MET_law_harmonization:0 "保留摩泽尔法律核对表"
 sof_ne_MET_law_harmonization_desc:0 "逐项记录地方制度、例外与过渡条款，让统一行政尊重已有权利。\n\n稳定度 +4%。"
 sof_ne_MET_local_law:0 "清点摩泽尔地方法"
 sof_ne_MET_local_law_desc:0 "逐项登记摩泽尔适用的特殊法律，并明确各地制度的范围与责任。\n\n政治点 +50。"
 sof_ne_MET_lorraine_in_france:0 "洛林在共同国家之内"
 sof_ne_MET_lorraine_in_france_desc:0 "矿业档案、地方财政与边防经验已经进入共同体系。洛林不再只是国家的边缘产区：新的研究机构将把这里的技术积累用于全国重建。\n\n拥有至少12座工厂、至少3个科研槽并完整控制第133州后，开放第4个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_MET_metallurgy:0 "冶金试验小组"
 sof_ne_MET_metallurgy_desc:0 "以热处理和质量试验提高金属加工水平，让现有原料形成可靠的工业产品。\n\n获得1次75%工业科技研究加成。"
 sof_ne_MET_military_orders:0 "优先炮件订单"
 sof_ne_MET_military_orders_desc:0 "优先军用加工，放弃同阶段民用机具扶持。\n\n获得1次100%火炮科技研究加成。 军用订单交付120门火炮和100件支援装备。"
 sof_ne_MET_mining_records:0 "移交矿业检修档案"
 sof_ne_MET_mining_records_desc:0 "把真实可用的本地矿业档案纳入全国体系。\n\n获得1次100%采掘科技研究加成。"
 sof_ne_MET_mobile:0 "机动预备队学说"
 sof_ne_MET_mobile_desc:0 "将有限训练资源投入机动增援，区别于固定要塞值勤。\n\n获得150辆卡车和1次50%陆军学说花费减免。"
 sof_ne_MET_municipal:0 "市镇财政授权"
 sof_ne_MET_municipal_desc:0 "地方财政支持市镇建设，公开预算与共同审计保障工程持续推进。"
 sof_ne_MET_nancy:0 "南锡工程课堂"
 sof_ne_MET_nancy_desc:0 "南锡的工程课堂可以为矿山、轧机和维修车间提供同一套技术语言。我们将支持实习、材料试验与夜间课程，把经验变成可以传授的工序。\n\n拥有至少6座工厂、至少2个科研槽并完整控制第133州后，开放第3个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_MET_officer_school:0 "南锡参谋图上作业"
 sof_ne_MET_officer_school_desc:0 "补给、桥梁和动员假设必须由参谋演练验证。\n\n陆军经验 +30。 获得1次50%陆军学说花费减免。"
 sof_ne_MET_pensions:0 "跨区养老金对账"
 sof_ne_MET_pensions_desc:0 "稳定度 +4%。"
 sof_ne_MET_prefect:0 "省级统一预算"
 sof_ne_MET_prefect_desc:0 "统一预算与常设财政机构集中调配资源，为跨地区建设和动员提供稳定支持。"
 sof_ne_MET_rail_reserve:0 "预留后方军用班次"
 sof_ne_MET_rail_reserve_desc:0 "铁路优先权来自本地安排，非对邻国铁路的强制控制。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_MET_rights:0 "跨省权利与义务"
 sof_ne_MET_rights_desc:0 "承认摩泽尔地方制度与邻近省份法律沿革不同，先列出争议事项。\n\n稳定度 +4%。"
 sof_ne_MET_rolling:0 "轧机工具标准"
 sof_ne_MET_rolling_desc:0 "标准化辊具和公差，再考虑军用订单。\n\n获得1次100%工业科技研究加成。 在拥有并完整控制的第94州新增1座民用工厂及1个建筑槽；达到容量上限的每座工厂折为50政治点。"
 sof_ne_MET_self_reliant:0 "准备境内替代班表"
 sof_ne_MET_self_reliant_desc:0 "谈判拒绝或邻国消失也可继续本国内政主树。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_MET_signals:0 "掩体电话与前哨联络"
 sof_ne_MET_signals_desc:0 "将两处防区接入共同通信训练，使工事、守备与后方联络协同运转。\n\n获得1次100%电子科技研究加成。"
 sof_ne_MET_survey:0 "边防地形与通行调查"
 sof_ne_MET_survey_desc:0 "前沿工事必须有退路，机动部队必须有补给。我们将重新勘察摩泽尔和默兹之间的道路、桥梁与仓储条件，为两种防卫体系准备共同底图。\n\n陆军经验 +15。"
 sof_ne_MET_toul:0 "图勒交通与后方站"
 sof_ne_MET_toul_desc:0 "州级交通改善不冒认具体铁路线路已全线连通。\n\n图勒转运站获得150辆卡车。"
 sof_ne_MET_transition:0 "为统一准备资产清单"
 sof_ne_MET_transition_desc:0 "可以提前编制整合清单，但以下实施必须等待统一完成。\n\n政治点 +50。"
 sof_ne_MET_veterans:0 "退伍军人与市镇救济"
 sof_ne_MET_veterans_desc:0 "为战伤和失业救济提供跨市镇结算。\n\n稳定度 +4%。"
 sof_ne_ROU_accepted_freight:0 "落实获准跨区班表"
 sof_ne_ROU_accepted_freight_desc:0 "一份协定获准后才可执行，拒绝不会阻塞境内替代。\n\n获得1次100%后勤科技研究加成。 获合作方接受的货运计划交付150辆卡车。"
 sof_ne_ROU_caen_supply:0 "调查卡昂钢铁原料"
 sof_ne_ROU_caen_supply_desc:0 "卡昂地区的钢铁工业不能只看高炉数量。原料来源、运送时刻与焦煤消耗应分别核算，避免扩产计划在到货之前就已失去依据。\n\n获得1次100%采掘科技研究加成。"
 sof_ne_ROU_caen_workshop:0 "卡昂专门军需车间"
 sof_ne_ROU_caen_workshop_desc:0 "完成原料、维修和验收链后仅扩建一个军需加工单位。\n\n在第109州建成2座军用工厂，同时增加2个建筑槽。"
 sof_ne_ROU_cargo_merge:0 "全国货运单证互认"
 sof_ne_ROU_cargo_merge_desc:0 "港务单证并入全国体系，既有对外协定仍尊重对方意愿。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_ROU_civic_charter:0 "港务与市镇权限章程"
 sof_ne_ROU_civic_charter_desc:0 "港务只管获授权事务，市镇保留民事救济渠道。\n\n稳定度 +4%。"
 sof_ne_ROU_civil_defense:0 "沿海市镇疏散计划"
 sof_ne_ROU_civil_defense_desc:0 "港口损坏时人员与民生设施撤运。\n\n稳定度 +4%。"
 sof_ne_ROU_clearing:0 "诺曼底跨区货运清算"
 sof_ne_ROU_clearing_desc:0 "按真实接受的协定结算；没有协议则采用本国账册。\n\n政治点 +50。"
 sof_ne_ROU_coast_network:0 "统一海岸救助规程"
 sof_ne_ROU_coast_network_desc:0 "把地方救助通信标准汇入全国体系。\n\n获得1次100%电子科技研究加成。"
 sof_ne_ROU_coastal_reserves:0 "内陆机动救援队"
 sof_ne_ROU_coastal_reserves_desc:0 "为沿岸事故和交通中断准备陆上增援。\n\n陆军经验 +15。"
 sof_ne_ROU_convoy_yard:0 "修复小型运输船位"
 sof_ne_ROU_convoy_yard_desc:0 "船体检查、工人班次与质量标准已经统一。瑟堡将扩充小型修船位置，使待修船舶更快重返海上。\n\n在第88州建成2座船坞，同时增加2个建筑槽。 另交付25艘运输船。"
 sof_ne_ROU_corridor:0 "诺曼底走廊联席会"
 sof_ne_ROU_corridor_desc:0 "港口、腹地与工业共同准备全国整合。\n\n政治点 +50。"
 sof_ne_ROU_customs:0 "河口通行与报关"
 sof_ne_ROU_customs_desc:0 "统一码头报关程序、货单与仓储记录，让货物顺畅进入诺曼底的运输网络。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_ROU_defense_handover:0 "沿海防务交接清单"
 sof_ne_ROU_defense_handover_desc:0 "记录已经完成的防护设施和指挥接口。\n\n陆军经验 +15。"
 sof_ne_ROU_evreux:0 "埃夫勒车辆修理"
 sof_ne_ROU_evreux_desc:0 "组织车辆修理，为后方运输提供持续保障。\n\n获得1次100%摩托化装备科技研究加成。"
 sof_ne_ROU_food_contracts:0 "乡村与港口供给合同"
 sof_ne_ROU_food_contracts_desc:0 "民用食品供给稳定城市就业和装卸班次。\n\n稳定度 +4%。"
 sof_ne_ROU_harbour_air:0 "勒阿弗尔港空警戒"
 sof_ne_ROU_harbour_air_desc:0 "加强地面防空与警戒，保护港区。\n\n勒阿弗尔增加2级防空设施。 港口增加2级空军基地（现有等级低于9时），空军经验 +25。 港口防空部队获得24架现有1936型战斗机。当前设计或科技条件不足时改发100件支援装备。"
 sof_ne_ROU_industrial_account:0 "港口钢厂联合验收"
 sof_ne_ROU_industrial_account_desc:0 "将造船需求和钢材质量对接，不制造新的资源储量。\n\n获得1次100%工业科技研究加成。 拥有至少6座工厂、至少2个科研槽并完整控制第84州后，开放第3个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_ROU_le_havre:0 "勒阿弗尔河口接力"
 sof_ne_ROU_le_havre_desc:0 "鲁昂的河海货流依赖河口节点，两地建设分开控制。\n\n在拥有并完整控制的第80州新增1座船坞及1个建筑槽；达到容量上限的每座工厂折为50政治点。"
 sof_ne_ROU_local_freight:0 "预备境内货单规则"
 sof_ne_ROU_local_freight_desc:0 "邻区不接受也能继续整理本国货运。\n\n区内货运车队交付150辆卡车。 获得1次100%后勤科技研究加成。"
 sof_ne_ROU_machine_repair:0 "鲁昂民用机械维修"
 sof_ne_ROU_machine_repair_desc:0 "民用维修将港口与工厂设备重新接入同一地区经济。\n\n在第84州建成2座民用工厂，同时增加2个建筑槽。"
 sof_ne_ROU_municipal_debts:0 "港口与市镇债务对账"
 sof_ne_ROU_municipal_debts_desc:0 "处理地方债权和投资义务，避免统一后重复计账。\n\n稳定度 +4%。"
 sof_ne_ROU_norman_charter:0 "诺曼底共同财政章程"
 sof_ne_ROU_norman_charter_desc:0 "规定港口、工业城市和乡村的财政分担，保持党派中立。\n\n政治点 +50。"
 sof_ne_ROU_normandy_in_france:0 "诺曼底河海走廊的完成"
 sof_ne_ROU_normandy_in_france_desc:0 "诺曼底的港口、钢厂和乡村供给已经成为全国运输体系的一部分。新的研究机构将把河海交接和沿岸保障的经验推广到整个共同国家。\n\n拥有至少12座工厂、至少3个科研槽并完整控制第84州后，开放第4个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_ROU_port_review:0 "港务预算公开复核"
 sof_ne_ROU_port_review_desc:0 "工程费用、工资和乡村补助共同接受审计。\n\n稳定度 +4%。"
 sof_ne_ROU_rail_link:0 "塞纳腹地转运时刻"
 sof_ne_ROU_rail_link_desc:0 "获得1次100%后勤科技研究加成。"
 sof_ne_ROU_representation:0 "港口与乡村代表席"
 sof_ne_ROU_representation_desc:0 "诺曼底的港口、乡村与内陆市镇共同参与地区事务，让运输与公共投资服务于整个地区。\n\n政治点 +50。"
 sof_ne_ROU_river_bridges:0 "塞纳桥梁荷载检查"
 sof_ne_ROU_river_bridges_desc:0 "塞纳腹地的桥梁既承受商车，也可能承受军需纵队。工兵与地方工程人员将共同检查荷载、维修优先级和交通中断时的替代通路。\n\n获得1次100%工兵科技研究加成。"
 sof_ne_ROU_rolling:0 "诺曼底轧机检修"
 sof_ne_ROU_rolling_desc:0 "恢复检修与轧制工序，为钢材交付和机械维修提供稳定支持。\n\n获得1次75%工业科技研究加成。"
 sof_ne_ROU_seamen:0 "登记海员与码头工"
 sof_ne_ROU_seamen_desc:0 "民用海员、码头工人与海军人员分册登记。\n\n海军经验 +15。"
 sof_ne_ROU_shared_dock:0 "共用修船质量规则"
 sof_ne_ROU_shared_dock_desc:0 "两种优先章程在船体质量和安全标准处汇合。\n\n海军经验 +25。 获得1次50%海军学说花费减免。"
 sof_ne_ROU_smn:0 "科隆贝勒维修合同"
 sof_ne_ROU_smn_desc:0 "科隆贝勒的钢铁生产需要矿石、焦煤、车皮和熟练工人同时到位。我们将签订维修合同，先恢复工序之间的衔接，再扩大军需订单。\n\n在拥有并完整控制的第109州新增1座军用工厂及1个建筑槽；达到容量上限的每座工厂折为50政治点。"
 sof_ne_ROU_steel_merge:0 "统一钢材采购规格"
 sof_ne_ROU_steel_merge_desc:0 "诺曼底冶金工序与全国采购标准衔接。\n\n获得1次75%工业科技研究加成。"
 sof_ne_ROU_supply_inland:0 "海运中断时的内陆配给"
 sof_ne_ROU_supply_inland_desc:0 "建设连接内陆的补给退路，以陆上运输支持海港的持续运转。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_ROU_tolls:0 "公布港口收费表"
 sof_ne_ROU_tolls_desc:0 "收费透明是地方制度选择，不与任何特定党派绑定。\n\n政治点 +50。"
 sof_ne_ROU_wages:0 "装卸班次与工资仲裁"
 sof_ne_ROU_wages_desc:0 "工资和装卸时间进入双方可追责的公共账册。\n\n稳定度 +4%。"
 sof_ne_ROU_warehouses:0 "仓库、驳船与车皮"
 sof_ne_ROU_warehouses_desc:0 "逐项检修运具和转运流程，不一键发放同额工厂。\n\n获得1次75%工业科技研究加成。"
 sof_ne_ROU_wireless:0 "沿岸无线电值勤"
 sof_ne_ROU_wireless_desc:0 "搜救与护航共用有限通信训练。\n\n获得1次100%电子科技研究加成。"
 sof_ne_STR_alsace_in_france:0 "阿尔萨斯的共同国家契约"
 sof_ne_STR_alsace_in_france_desc:0 "共同国家既需要阿尔萨斯的工序，也需要理解这里的制度。新的研究网络将吸收地方技术，公共协约则为居民保留清晰可行的权利保障。\n\n拥有至少12座工厂、至少3个科研槽并完整控制第217州后，开放第4个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_STR_border_engineers:0 "哈格瑙工兵勘测"
 sof_ne_STR_border_engineers_desc:0 "现有防区地形调查与本地工兵训练结合。\n\n获得1次100%工兵科技研究加成。"
 sof_ne_STR_border_relief:0 "山口换班与补给"
 sof_ne_STR_border_relief_desc:0 "以持续补给维持边境守备，让工事、运输与轮换人员共同发挥作用。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_STR_chambers:0 "工商业与市镇听证"
 sof_ne_STR_chambers_desc:0 "开放听证程序，工会、商业与市镇代表均可陈述。\n\n政治点 +50。"
 sof_ne_STR_civic_oath:0 "公共服务共同誓约"
 sof_ne_STR_civic_oath_desc:0 "效忠公开法律程序，不要求任何特定党派执政。\n\n稳定度 +4%。"
 sof_ne_STR_clerks:0 "行政人员跨区培训"
 sof_ne_STR_clerks_desc:0 "档案索引与统计训练提高行政协作。\n\n获得1次100%电子科技研究加成。"
 sof_ne_STR_compact:0 "阿尔萨斯公共制度协约"
 sof_ne_STR_compact_desc:0 "语言服务、民事手续、地方保障和申诉制度已经逐一讨论。各地代表可以签署共同协约，使阿尔萨斯能够以明确的条件参与更广泛的国家重建。\n\n政治点 +50。"
 sof_ne_STR_customs_clearance:0 "货单与军需分轨"
 sof_ne_STR_customs_clearance_desc:0 "军用货运优先权必须有账可查。\n\n获得1次75%工业科技研究加成。"
 sof_ne_STR_defense_communes:0 "市镇边防责任清单"
 sof_ne_STR_defense_communes_desc:0 "明确守备军与市镇民事责任的界限，拒绝军队自行接管全部制度。\n\n陆军经验 +15。"
 sof_ne_STR_factory_transition:0 "全国机床标准接轨"
 sof_ne_STR_factory_transition_desc:0 "米卢斯工序档案纳入全国制造标准。\n\n获得1次75%工业科技研究加成。"
 sof_ne_STR_fallback_orders:0 "改用境内短程订单"
 sof_ne_STR_fallback_orders_desc:0 "拒绝协商不会让内政主干陷入死路。\n\n政治点 +50。"
 sof_ne_STR_frontier_manual:0 "莱茵防务行动手册"
 sof_ne_STR_frontier_manual_desc:0 "不同作战取向共用明确的指挥交接规则。\n\n获得1次50%陆军学说花费减免。"
 sof_ne_STR_haguenau_forts:0 "哈格瑙交通阻滞阵地"
 sof_ne_STR_haguenau_forts_desc:0 "加强本州道路接入处的防护，按当地地形配置工事。\n\n阿格诺指定省份增加3级陆上要塞。 拨付100件支援装备。"
 sof_ne_STR_industry_balance:0 "上下阿尔萨斯工序协调"
 sof_ne_STR_industry_balance_desc:0 "南北工业与农业支线三向汇合。\n\n获得1次100%建造科技研究加成。"
 sof_ne_STR_machine_hall:0 "米卢斯专门维修厅"
 sof_ne_STR_machine_hall_desc:0 "重整动力和纺机维修后才扩建一处民用产能。\n\n在第217州建成2座民用工厂，同时增加2个建筑槽。"
 sof_ne_STR_machine_orders:0 "先行军械加工订单"
 sof_ne_STR_machine_orders_desc:0 "把一部分精密加工能力转向军需，将使地区获得更可靠的武器和备件。民用订单必须让出部分工期，工人资格和材料验收仍不得降低。\n\n获得1次100%步兵武器研究加成。 在拥有并完整控制的第217州新增1座军用工厂及1个建筑槽；达到容量上限的每座工厂折为50政治点。 机械订单交付600件步兵装备。"
 sof_ne_STR_medical:0 "南部救护与轮换"
 sof_ne_STR_medical_desc:0 "后送能力与部队轮换共同筹备。\n\n获得1次100%支援连科技研究加成。"
 sof_ne_STR_mulhouse:0 "米卢斯纺机动力合同"
 sof_ne_STR_mulhouse_desc:0 "米卢斯的纺机与动力设备经验值得集中利用。共同维修合同将把备件、工人训练和设备检验接在一起，缩短各厂停机时间。\n\n在拥有并完整控制的第217州新增1座民用工厂及1个建筑槽；达到容量上限的每座工厂折为50政治点。"
 sof_ne_STR_own_workshops:0 "保留境内检修备份"
 sof_ne_STR_own_workshops_desc:0 "即使邻区拒绝互认，本国交通改革仍可继续。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_STR_qualified:0 "共用工序资格证"
 sof_ne_STR_qualified_desc:0 "军民订单在工人资格互认处汇合。\n\n获得1次75%工业科技研究加成。"
 sof_ne_STR_quality_lab:0 "斯特拉斯堡质量检验"
 sof_ne_STR_quality_lab_desc:0 "质量计量与报关单证形成可检验的标准。\n\n获得1次100%电子科技研究加成。 拥有至少6座工厂、至少2个科研槽并完整控制第217州后，开放第3个科研槽；已达到该槽数则获得1次100%电子科技研究加成。"
 sof_ne_STR_reserve_routes:0 "南部撤运线路演练"
 sof_ne_STR_reserve_routes_desc:0 "演练仓储搬运和后方救护，不预知未来战役。\n\n陆军经验 +15。"
 sof_ne_STR_rhine_accounts:0 "全国河港货单接口"
 sof_ne_STR_rhine_accounts_desc:0 "统一运输单证，但不扩大未经同意的境外权利。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_STR_rhine_survey:0 "清点莱茵货运接口"
 sof_ne_STR_rhine_survey_desc:0 "莱茵河港连接远方市场，萨韦尔讷山口连接西部腹地，南部线路连接米卢斯工场。先查清各个接口的运力，才能制定可靠的地区经济计划。\n\n获得1次100%后勤科技研究加成。"
 sof_ne_STR_rights_review:0 "地方权利共同复核"
 sof_ne_STR_rights_review_desc:0 "两种制度路线重新汇合到同一个申诉与复核程序。\n\n稳定度 +4%。"
 sof_ne_STR_rights_schedule:0 "公布地方例外与期限"
 sof_ne_STR_rights_schedule_desc:0 "公开哪些制度继续适用、哪些在过渡期协调。\n\n稳定度 +4%。"
 sof_ne_STR_river_compact:0 "河港与腹地共同清算"
 sof_ne_STR_river_compact_desc:0 "按获准订单安排运输；协商未果时承担境内替代成本。\n\n政治点 +50。"
 sof_ne_STR_river_port:0 "河港仓库轮值"
 sof_ne_STR_river_port_desc:0 "驳船等待泊位，仓库等待车皮，工厂等待原料。斯特拉斯堡港将建立协调轮值，减少货物在河岸与铁路之间反复滞留。\n\n莱茵港口增加1级基础设施（最高5级），并获得100辆卡车。"
 sof_ne_STR_safety_board:0 "建立联合申诉委员会"
 sof_ne_STR_safety_board_desc:0 "地方制度、劳资纠纷和语言权利按各自程序解决。\n\n稳定度 +4%。"
 sof_ne_STR_school_transition:0 "全国教师资格过渡"
 sof_ne_STR_school_transition_desc:0 "保留必要的语言服务，同时互认资格。\n\n稳定度 +4%。"
 sof_ne_STR_signals:0 "北部阵地电话网"
 sof_ne_STR_signals_desc:0 "统一两处防区的通信标准，让守军与后方能够及时协作。\n\n获得1次100%电子科技研究加成。"
 sof_ne_STR_signed_orders:0 "执行获准互认订单"
 sof_ne_STR_signed_orders_desc:0 "至少一方接受后才能执行该支线。\n\n获得1次100%后勤科技研究加成。 已接受的地区订单交付150辆卡车。"
 sof_ne_STR_static:0 "分散据点值守"
 sof_ne_STR_static_desc:0 "优先本地防护工程和守备轮换。\n\n获得1次100%筑垒科技研究加成。"
 sof_ne_STR_textile_orders:0 "先行纺织民用订单"
 sof_ne_STR_textile_orders_desc:0 "优先民用纺机和就业，暂缓军用加工扩大。\n\n获得1次75%工业科技研究加成。"
 sof_ne_STR_tribunal:0 "地方法院文书对照"
 sof_ne_STR_tribunal_desc:0 "先核对程序与权利，之后才讨论统一或保留制度。\n\n稳定度 +4%。"
 sof_ne_STR_unification_docket:0 "编制地方制度交接卷"
 sof_ne_STR_unification_docket_desc:0 "提前准备卷宗，执行须待共同国家建立。\n\n政治点 +50。"
 sof_ne_STR_wissem:0 "维桑堡观察勤务"
 sof_ne_STR_wissem_desc:0 "加强北部观察站与地形巡查，为边境守备提供可靠情报。\n\n获得1次100%侦察科技研究加成。"
