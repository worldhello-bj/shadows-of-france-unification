 sof_ne_AMI_military_air:0 "优先军用试制订单"
 sof_ne_AMI_military_air_desc:0 "地区不能永远依赖外来飞机。军用试制订单将推动量具、夹具与熟练工训练，代价是部分民用维修需要延后。\n\n获得1次100%近距支援机科技研究加成。 空军经验 +25。 军用试制订单另交付24架现有1936型近距支援机。当前设计或科技条件不足时改发100件支援装备。"
 sof_ne_AMI_minutes:0 "公布债务与修复账册"
 sof_ne_AMI_minutes_desc:0 "不同市镇可比较工程费用，不用同额补助掩盖差异。\n\n稳定度 +4%。"
 sof_ne_AMI_mobile_reserve:0 "机动后方救援队"
