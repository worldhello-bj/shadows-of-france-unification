 sof_ne_CHL_bridges:0 "默兹桥梁荷载检查"
 sof_ne_CHL_bridges_desc:0 "桥梁能否承受重车、道路能否容纳双向通行，都应由实际检查回答。工兵将为默兹渡口地区建立荷载与维修记录。\n\n获得1次100%工兵科技研究加成。"
 sof_ne_CHL_camp_survey:0 "营地、村镇与耕地清点"
 sof_ne_CHL_camp_survey_desc:0 "军队训练需要土地，道路和田野却也养活着村镇。我们应先查清营地边界、通行责任和可用时段，再决定扩大训练的方式。\n\n陆军经验 +15。"
 sof_ne_CHL_camp_transfer:0 "全国营地修理标准"
