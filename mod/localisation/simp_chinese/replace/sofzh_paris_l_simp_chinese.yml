l_simp_chinese:
 SOF_PRS_assembly:0 "市政厅的全国使命"
 SOF_PRS_assembly_desc:0 "市政厅的窗前，信使带回的是一道道新边界。巴黎拥有档案、学校与工场，却不能只凭首都之名命令全国。我们将恢复日常行政、组织一支可靠的军队，再用可执行的共同制度赢得各地承认。"
 SOF_PRS_municipal_ledger:0 "重新打开市政总账"
 SOF_PRS_municipal_ledger_desc:0 "旧账簿中的地址还在，税款与工资却常常找不到对应的机关。市政登记处将核对居民、预备役和公共采购，让首都首先成为一个能按时发薪、运粮和办事的政府。"
 SOF_PRS_capital_guard:0 "整编首都守备旅"
 SOF_PRS_capital_guard_desc:0 "各街区的巡逻队在同一张操场集合。两支六营制步兵旅获得共同编制与基础武器，先保护桥梁、车站和仓库；每支部队只组建一次，接下来的扩军仍需要工业和征募支撑。\n军事成长：步兵武器标准化初建；同阶系列数值比通用提高15%。"
 SOF_PRS_prefectural_letters:0 "给各地的第一封公函"
 SOF_PRS_prefectural_letters_desc:0 "公函不只有统一宣言，还附着预算格式、粮食运输约定和地方代表的席位。邻近小国可自行决定是否接受谈判邀请；拒绝不会触发自动吞并或自动宣战。共同政府应当先给出可以核查的承诺。"
 SOF_PRS_ile_mandate:0 "恢复法兰西岛通行"
 SOF_PRS_ile_mandate_desc:0 "首都周围的关卡把市民、粮车与列车困在零碎辖区中。政府授权恢复法兰西岛通行，取得合法相邻政权的统一战争目标。AI仍须等待实力、兵力和休整条件满足，并只准备一个目标。"
 SOF_PRS_ile_union:0 "首都与郊区共同行政"
 SOF_PRS_ile_union_desc:0 "控制法兰西岛二十五州后，可以成立共同区域政体并取得地区领土宣称。巴黎国家身份与专属国策保留，非核心州仍需通过地方登记逐项整合。"
 SOF_PRS_war_authority:0 "全国统一战争授权"
 SOF_PRS_war_authority_desc:0 "地方共同体已经形成，国家制度也有了公开规则。政府据此建立统一战争授权：兵力、补给和目标服从共同计划，前线胜利必须能转化为持续的行政秩序。"
 SOF_PRS_regional_administration:0 "省际共同政务"
 SOF_PRS_regional_administration_desc:0 "行政国策提供整合授权，不直接授予核心。地方登记需要连续控制180天、顺从至少60%、抵抗低于20%，并完成120天单州整合。"
 SOF_PRS_national_congress:0 "在巴黎召开全国会议"
 SOF_PRS_national_congress_desc:0 "来自至少一百个实际控制州的代表齐聚巴黎，战时占领区同样派出代表。会议讨论各地权利、公共财政与共同军队的归属。首都获得的是建设国家的委任，而不是把地图上尚未掌握的地区提前宣布为自己的领土。"
 SOF_PRS_national_proclamation:0 "从巴黎重建法兰西"
 SOF_PRS_national_proclamation_desc:0 "所有三百三十九个法国州必须归于我方、完全受控，国家独立且处于和平。达到这些条件之后，巴黎才能正式宣告全国统一，结束战时授权，并把共同政府转入重建。"
 SOF_PRS_national_market:0 "从首都账本到全国市场"
 SOF_PRS_national_market_desc:0 "全国统一不能止步于一面旗帜。共同标准、采购合同与清算制度将让地方工场进入同一市场，新增民用设施也将分布到完整掌握的法国州。"
 SOF_PRS_national_reconstruction:0 "让军需转向重建"
 SOF_PRS_national_reconstruction_desc:0 "车间仍有熟练工人，运输表仍有准确的班次。现在这些能力将服务住房、道路与民用生产。战时征募和机动作战精神退出，长期工业与科研能力留给和平时期的法国。"
 SOF_PRS_republican_mandate:0 "波旁宫的公民授权"
 SOF_PRS_republican_mandate_desc:0 "代表走进议事厅，先讨论军费，再讨论政府权力的边界。公民授权路线通过地方席位和公开预算凝聚共同体，以稳定和占领治理支撑长期统一。"
 SOF_PRS_budget_committee:0 "把战时预算交给议会"
 SOF_PRS_budget_committee_desc:0 "预算委员会把口粮、弹药和铁路采购放在同一张表上。公开账目减少重复采购，使民用建设、军需和维修得到连续的安排。"
 SOF_PRS_civic_compact:0 "首都与各省的公民协约"
 SOF_PRS_civic_compact_desc:0 "地方加入共同政府后，应当得到清晰的权利与服役责任。公民协约把驻军负担、地方代表和军人家庭保障写入规则，缓和整合过程中的猜疑。"
 SOF_PRS_directorate:0 "建立统一督政机构"
 SOF_PRS_directorate_desc:0 "统一督政机构把军令、运输与地方行政集中到同一指挥程序。它的力量来自清楚的责任链和可靠的执行能力，适合需要快速组织统一战役的政府。"
 SOF_PRS_unified_executive:0 "一份命令一种程序"
 SOF_PRS_unified_executive_desc:0 "同一道命令不应在每个地方换一种解释。督政机关将统一动员格式、军官联络和生产调度，提高计划速度与前线组织能力。"
 SOF_PRS_prefect_service:0 "建立全国行政预备队"
 SOF_PRS_prefect_service_desc:0 "受训职员随军进入新掌握的城镇，先恢复警务、供粮和薪资支付。行政预备队让占领治理和装备维修跟上战线，而不是等待战争全部结束。"
 SOF_PRS_national_charter:0 "为统一规定权力与责任"
 SOF_PRS_national_charter_desc:0 "无论采用代表议会还是统一督政，政府都须公布地方权利、军队责任和公共预算原则。两条制度路线在共同宪章汇合，现有意识形态由玩家原先的政治选择继续决定。"
 SOF_PRS_seine_industry:0 "塞纳两岸的工场"
 SOF_PRS_seine_industry_desc:0 "河岸两侧的工场已有机器和工人，缺的是稳定的订单与原料。新增民用设施优先建在控制的法兰西岛州，政府迁移后也可在其他控制州建设；巴黎本身不会凭空获得煤矿或铁矿。"
 SOF_PRS_factory_orders:0 "统一工场订单"
 SOF_PRS_factory_orders_desc:0 "不同作坊改用共同的验收和交货标准，民用机械和轻武器维修互相支持。首都新增军工为长期补充服务，原料仍需从实际矿区与贸易获得。"
 SOF_PRS_research_college:0 "让索邦重新服务全国"
 SOF_PRS_research_college_desc:0 "讲堂里重新坐满了学生，实验室则收到来自工场和部队的实际问题。巴黎的研究机构将训练技术人员，并为统一事业提供一个新增研究槽。"
 SOF_PRS_engineering_school:0 "培养全国工程技术人员"
 SOF_PRS_engineering_school_desc:0 "工程训练从量具、无线电和机械维护开始。统一测绘与制造标准使地方工厂能够交换零件，研究奖励侧重工业和电子技术。"
 SOF_PRS_suburb_arsenals:0 "联通郊区兵工厂"
 SOF_PRS_suburb_arsenals_desc:0 "郊区兵工厂与首都维修工场按共同清单分工。军工产出、效率上限与效率增长一同改善，形成能持续补充前线的生产网络。"
 SOF_PRS_rail_dispatch:0 "巴黎车站的共同调度"
 SOF_PRS_rail_dispatch_desc:0 "列车不能在每一道地方边界重排班次。共同调度将整顿车站、道路与转运设施，降低部队补给消耗并提高运输建设能力；它不会在未经确认的地图省份间强画铁路。"
 SOF_PRS_logistics_depots:0 "在交通节点建立军需仓"
 SOF_PRS_logistics_depots_desc:0 "军需仓按前线需要储备弹药、备件和口粮，首批一百五十辆卡车负责短程转运。仓储组织减少损耗和燃料负担，支持持续推进。"
 SOF_PRS_electric_grid:0 "接通共同电力与维修网"
 SOF_PRS_electric_grid_desc:0 "工场停机有时只是缺少一枚零件或一段电缆。共同维修网安排设备检修与供电协调，以工程建设体现基础改善，不增加地图上不存在的矿藏。"
 SOF_PRS_war_bonds:0 "发行有用途的建设公债"
 SOF_PRS_war_bonds_desc:0 "公债列明车间、仓库和学校的实际用途，投资人可以追踪工程进度。新增民用工厂与稳定度代表首都对长期建设的信用。"
 SOF_PRS_industrial_plan:0 "首都与各省的工业计划"
 SOF_PRS_industrial_plan_desc:0 "共同计划把首都的工程师与地方的工业能力联接起来。法兰西岛新增民用和军用生产设施，矿区合作将成为后续更大工业网络的原料支点。"
 SOF_PRS_laboratories:0 "组成国家联合实验室"
 SOF_PRS_laboratories_desc:0 "学校、通信部门与制造工场组成联合实验室。第二个新增研究槽支持全国性技术问题，研究资源不再被每一条地方边界重复切割。"
 SOF_PRS_staff_school:0 "重建巴黎参谋学堂"
 SOF_PRS_staff_school_desc:0 "参谋训练从地图判读、预备队和后勤开始。共同军队需要能把作战意图落实为具体命令的军官，陆军学说使用当前游戏的原生学说折扣。\n军事成长：联合作战参谋部初建；同阶系列数值比通用提高15%。"
 SOF_PRS_reserve:0 "首都与郊区共同征募"
 SOF_PRS_reserve_desc:0 "征募名册让郊区和市区承担同样的服役义务。另两支六营制步兵旅只组建一次，并补充四千名可用人员，兵源优势仍需装备和训练才能转化为战斗力。\n军事成长：预备役与补充体系初建；同阶系列数值比通用提高15%。"
 SOF_PRS_rifle_standard:0 "统一步枪与备件标准"
 SOF_PRS_rifle_standard_desc:0 "一线部队和仓库采用同一套武器编号与备件标准。一千八百件基础步兵装备填补首批补充需求，后续改进依靠生产和技术研究。\n军事成长：步兵武器标准化整备；同阶系列数值比通用提高15%。"
 SOF_PRS_artillery:0 "建立共同炮兵训练场"
 SOF_PRS_artillery_desc:0 "炮兵观察员和步兵军官在共同训练场学习无线电通报、射击校正与火力协同。训练提高专业经验，并推动炮兵技术研究。\n军事成长：炮兵火力体系初建；同阶系列数值比通用提高15%。另交付180门野战炮与60门反坦克炮。"
 SOF_PRS_truck_pool:0 "组织全国军用汽车队"
 SOF_PRS_truck_pool_desc:0 "汽车队为机动作战和补给运输准备两百辆卡车，掌握机动车辆编制技术。机动兵力必须建立在可补充的车辆和燃料基础上。\n军事成长：机动运输勤务初建；同阶系列数值比通用提高15%。"
 SOF_PRS_army_doctrine:0 "把统一战役写进教范"
 SOF_PRS_army_doctrine_desc:0 "作战教范总结有限兵力的集中、轮换与补充。新的军队制度增强组织、恢复与增援能力，让前线能够连续作战。\n军事成长：联合作战参谋部整备；同阶系列数值比通用提高15%。"
 SOF_PRS_combined_operations:0 "步炮与机动部队协同"
 SOF_PRS_combined_operations_desc:0 "步兵、炮兵与机动纵队改用共同联络程序。协同奖励侧重突破、计划和陆军经验，而不是凭一次国策发放庞大的免费装甲集团。\n军事成长：步兵武器标准化成熟、装甲兵技术协作整备、炮兵火力体系整备；同阶系列数值比通用提高15%。"
 SOF_PRS_medical_services:0 "让伤员与老兵回到队伍"
 SOF_PRS_medical_services_desc:0 "卫生队、军需仓和地方医院建立转送制度。减少人员损耗、改善组织恢复，并保留训练有素的军人，是扩大军队之外同样重要的力量来源。\n军事成长：军医与老兵网络整备；同阶系列数值比通用提高15%。"
 SOF_PRS_unified_command:0 "设立统一战争总参谋部"
 SOF_PRS_unified_command_desc:0 "总参谋部统一安排主攻、预备队和补给节奏。首都军队的组织优势用于逐次战役，战争结束后该战时精神将退出。\n军事成长：联合作战参谋部成熟、预备役与补充体系成熟；同阶系列数值比通用提高15%。"
 SOF_PRS_normandy_links:0 "接通巴黎与诺曼底"
 SOF_PRS_normandy_links_desc:0 "通向诺曼底的道路关系粮食、港口和西部工业。此次战役取得一个符合条件的相邻目标，并提供一百八十天的机动准备；前线仍需玩家实际作战。"
 SOF_PRS_northern_coal:0 "北方工业通道"
 SOF_PRS_northern_coal_desc:0 "北方煤盆与工业城市需要稳定的军需通道。政府优先规划一个合法相邻目标，短期工业战役精神支撑补给和维修，煤炭仍沿用既有地图数据。"
 SOF_PRS_lorraine_link:0 "向洛林工业带推进"
 SOF_PRS_lorraine_link_desc:0 "洛林的矿冶带能为全国兵工提供重要原料。战役按一个相邻目标逐次推进，真正掌握矿区之后才开放对应工业协作。"
 SOF_PRS_alsace_cooperation:0 "让阿尔萨斯进入共同计划"
 SOF_PRS_alsace_cooperation_desc:0 "阿尔萨斯的油业和钾盐工业应当进入各有用途的供应链。我们组织通向该地区的战役与公共采购，无法靠宣言提前获得矿区收益。"
 SOF_PRS_rhone_corridor:0 "贯通通向罗讷河的道路"
 SOF_PRS_rhone_corridor_desc:0 "统一力量将从首都交通网向中南部延伸。作战纵队需要连续的补給与维修，战役目标只授予当前合法的相邻政权。"
 SOF_PRS_atlantic_ports:0 "接入大西洋港务网络"
 SOF_PRS_atlantic_ports_desc:0 "控制沿海州之后，共同政府才能扩建船坞并筹集四十艘运输船。内陆巴黎不会生成港口，建设只落在我方拥有且控制的沿海州。\n军事成长：船坞统筹局整备、护航与屏卫战术整备；同阶系列数值比通用提高15%。"
 SOF_PRS_mediterranean_ports:0 "筹建共同护航舰队"
 SOF_PRS_mediterranean_ports_desc:0 "共同政府以实际掌握的港口为基地，整备四艘早期驱逐舰并补充运输能力。护航舰队仅交付一次，支持最后的跨海统一和全国港务。\n军事成长：护航与屏卫战术成熟；同阶系列数值比通用提高15%。"
 SOF_PRS_corsican_mission:0 "最后一道海上边界"
 SOF_PRS_corsican_mission_desc:0 "岛屿也在全国共同体之内。至少四艘军舰与实际港口是取得科西嘉跨海目标的前提；只对一个合法拥有者授予目标，登陆仍需真实制海权与运输。\n军事成长：两栖行动训练营整备；同阶系列数值比通用提高15%。"
 SOF_PRS_national_logistics:0 "共同军需沿交通网运转"
 SOF_PRS_national_logistics_desc:0 "港口、车站和军需仓按共同清单分配物资。全国物流降低海陆运输损耗，为仍在推进的统一战争和随后的民生恢复提供连续保障。\n军事成长：机动运输勤务成熟；同阶系列数值比通用提高15%。"
 SOF_PRS_strategic_materials:0 "为战略原料建立采购标准"
 SOF_PRS_strategic_materials_desc:0 "不同矿区不是可以任意互换的资源箱。采购标准区分铁矿、煤、有限油业、钾盐与铝土矿的用途，研究奖励用于加工和供应组织，矿藏数量保持现有核验口径。"
 SOF_PRS_lorraine_foundry:0 "洛林原料与首都兵工"
 SOF_PRS_lorraine_foundry_desc:0 "布里埃、蒂永维尔东区或福尔巴克至少一州受我方控制之后，才可联接洛林原料与首都兵工。额外军工落在实际矿区，协作精神在失去全部对应州后移除。"
 SOF_PRS_north_coal_grid:0 "北方煤业与国家订单"
 SOF_PRS_north_coal_grid_desc:0 "贝蒂讷、瓦朗谢讷、杜埃与朗斯的煤业经验进入共同采购计划。至少完整掌握其中一州才可建设，失去全部对应矿区后停止专项收益。"
 SOF_PRS_alsace_chemistry:0 "阿尔萨斯精炼与民用化工"
 SOF_PRS_alsace_chemistry_desc:0 "佩谢尔布龙的有限油业与坦恩、米卢斯的钾盐工业各有用途。此协作改善燃料使用、民用负担与效率，绝不把钾盐变成虚构的石油或橡胶储备。"
 SOF_PRS_bauxite_chain:0 "瓦尔铝材进入全国工业"
 SOF_PRS_bauxite_chain_desc:0 "完整掌握布里尼奥勒之后，政府才能组织瓦尔铝业与制造企业的合同。专项奖励支撑加工、航空工业研究与生产效率，原有铝土矿数量继续沿用地图。"
 SOF_PRS_national_arsenal:0 "建立跨矿区的国家兵工体系"
 SOF_PRS_national_arsenal_desc:0 "钢铁、煤业和设备工场进入共同质量体系。军事产出与效率提升来自国家工业组织能力；失去一个矿区会影响其专项合同，已经建立的质量标准仍可服务其他工厂。\n军事成长：装甲兵技术协作成熟、炮兵火力体系成熟；同阶系列数值比通用提高15%。"
 SOF_PRS_civic_amnesty:0 "给统一后的生活留下位置"
 SOF_PRS_civic_amnesty_desc:0 "共同政府公布可执行的地方和解与公共服务程序。城市居民需要能够继续生活的秩序，军队需要减少驻守负担，治理不能永远停留在战时命令。"
 SOF_PRS_constitutional_settlement:0 "把共同宪章变成国家制度"
 SOF_PRS_constitutional_settlement_desc:0 "议会与督政两条路线都必须在全国统一后接受长期制度约束。国家宪章明确地方责任、共同预算和政治程序，延续此前选择的意识形态。"
 SOF_PRS_regional_elections:0 "恢复各地的公共代表机构"
 SOF_PRS_regional_elections_desc:0 "地方代表机构重新讨论学校、医院、道路和预算。共同国家允许地方事务有明确的责任人，公共服务使重建得到稳定支持。"
 SOF_PRS_seine_to_provinces:0 "把首都的工程师派往各省"
 SOF_PRS_seine_to_provinces_desc:0 "工程师带着量具、设计图与维修手册离开巴黎。两座民用工厂落在完整掌握的法国州，让首都积累的技术转化为地方生产。"
 SOF_PRS_public_services:0 "从军需保障走向公共服务"
 SOF_PRS_public_services_desc:0 "战争中建立的卫生转送和运输组织将服务普通居民。道路、医院用品与地方供应重新进入共同预算，和平生活成为政府新的工作目标。"
 SOF_PRS_national_science:0 "让全国成为共同的研究网络"
 SOF_PRS_national_science_desc:0 "研究所互相承认资料、试验标准和技术人员资格。新的国家研究网络在既有研究槽基础上提高科研效率，让重建后的法国继续拥有自己的工程和制造能力。\n军事成长：本土航空防御网整备、地空协同指挥所整备；同阶系列数值比通用提高15%。"
 sofzh_prs_capital:0 "首都共同政府"
 sofzh_prs_capital_desc:0 "首都的公共服务与采购机构成为统一事业的稳定后方。"
 sofzh_prs_registry:0 "共同登记制度"
 sofzh_prs_registry_desc:0 "居民、服役和订单使用共同记录。\n治理效果：驻军需求 -4%。"
 sofzh_prs_prefects:0 "省际政务联络"
 sofzh_prs_prefects_desc:0 "地方机关共享行政与运输标准。\n治理效果：顺从增长速度 +1%；驻军需求 -5%；抵抗目标 -2%。"
 sofzh_prs_war_mandate:0 "全国统一战争授权"
 sofzh_prs_war_mandate_desc:0 "明确的共同授权支持军队组织和战时征募。"
 sofzh_prs_congress:0 "巴黎的全国委任"
 sofzh_prs_congress_desc:0 "地方代表授予共同政府全国性建设任务。\n治理效果：顺从增长速度 +0.8%。"
 sofzh_prs_market:0 "全国共同市场"
 sofzh_prs_market_desc:0 "共同标准与清算制度支持持续生产。"
 sofzh_prs_reconstruction:0 "由首都通向全国的重建"
 sofzh_prs_reconstruction_desc:0 "工程、工业与研究转入和平建设。"
 sofzh_prs_parliament:0 "公民授权的共同政府"
 sofzh_prs_parliament_desc:0 "公开预算与地方席位增强稳定与治理。\n治理效果：顺从增长速度 +1%；驻军需求 -5%。"
 sofzh_prs_budget:0 "公开的共同预算"
 sofzh_prs_budget_desc:0 "民用建设、维修与军需获得连续预算。"
 sofzh_prs_civic_compact:0 "首都与各省的公民协约"
 sofzh_prs_civic_compact_desc:0 "公平的责任安排减轻驻守负担。\n治理效果：驻军需求 -5%；顺从增长速度 +0.8%。"
 sofzh_prs_directorate:0 "统一督政机构"
 sofzh_prs_directorate_desc:0 "清晰的责任链支持战役组织。"
 sofzh_prs_executive:0 "共同命令程序"
 sofzh_prs_executive_desc:0 "军令、生产和前线联络使用同一程序。"
 sofzh_prs_civil_service:0 "全国行政预备队"
 sofzh_prs_civil_service_desc:0 "受训职员随军恢复地方公共机关。\n治理效果：驻军需求 -6%；抵抗目标 -2%。"
 sofzh_prs_charter:0 "统一权力与责任宪章"
 sofzh_prs_charter_desc:0 "政府制度明确地方权利和共同责任。\n治理效果：顺从增长速度 +0.8%。"
 sofzh_prs_workshops:0 "塞纳工场协作"
 sofzh_prs_workshops_desc:0 "订单与维修组织连起河岸工场。"
 sofzh_prs_academy:0 "巴黎技术与研究共同体"
 sofzh_prs_academy_desc:0 "学校与工场共享技术问题。"
 sofzh_prs_industrial_network:0 "郊区共同兵工网络"
 sofzh_prs_industrial_network_desc:0 "标准化生产形成稳定补充体系。"
 sofzh_prs_railways:0 "首都交通共同调度"
 sofzh_prs_railways_desc:0 "车站、道路与转运按共同计划运作。"
 sofzh_prs_depots:0 "军需仓与汽车转运"
 sofzh_prs_depots_desc:0 "前线补充减少设备损耗和燃料负担。"
 sofzh_prs_army_school:0 "统一战役教范"
 sofzh_prs_army_school_desc:0 "结合专属三阶军事成长，组织统一战役所需的参谋、训练和勤务。\n陆军组织度 +12%；陆军组织度恢复修正 +12%；增援率 +2.5个百分点；计划速度 +12%。"
 sofzh_prs_combined_arms:0 "步炮与机动协同"
 sofzh_prs_combined_arms_desc:0 "结合专属三阶军事成长，组织统一战役所需的参谋、训练和勤务。\n陆军攻击 +6%；计划上限 +10%；陆军经验获取 +10%；突破 +8%。"
 sofzh_prs_medical:0 "军人卫生与恢复体系"
 sofzh_prs_medical_desc:0 "医院、运输与地方卫生队保留受训人员。"
 sofzh_prs_command:0 "巴黎统一战争总参谋部"
 sofzh_prs_command_desc:0 "结合专属三阶军事成长，组织统一战役所需的参谋、训练和勤务。\n陆军攻击 +6%；陆军组织度 +12%；计划速度 +18%；计划上限 +12%。"
 sofzh_prs_national_logistics:0 "海陆共同军需网"
 sofzh_prs_national_logistics_desc:0 "港口、车站与仓库共享运输组织。"
 sofzh_prs_lorraine_contract:0 "洛林与首都兵工合同"
 sofzh_prs_lorraine_contract_desc:0 "控制对应矿区时，原料与制造企业协同。"
 sofzh_prs_north_contract:0 "北方煤业国家订单"
 sofzh_prs_north_contract_desc:0 "实际掌握煤盆支撑建设与设备维修。"
 sofzh_prs_alsace_contract:0 "阿尔萨斯油业与化工合同"
 sofzh_prs_alsace_contract_desc:0 "有限油业、精炼与钾盐工业服务不同用途。"
 sofzh_prs_bauxite_contract:0 "瓦尔铝材工业合同"
 sofzh_prs_bauxite_contract_desc:0 "实际铝业配套提高加工效率与工业生产。"
 sofzh_prs_national_arsenal:0 "国家兵工质量体系"
 sofzh_prs_national_arsenal_desc:0 "跨矿区订单提高全国军事制造效率。"
 sofzh_prs_amnesty:0 "全国公共和解"
 sofzh_prs_amnesty_desc:0 "地方生活与军队任务共同纳入长期治理。\n治理效果：驻军需求 -7.5%；抵抗目标 -2.5%；顺从增长速度 +1%。"
 sofzh_prs_constitution:0 "法兰西共同国家制度"
 sofzh_prs_constitution_desc:0 "统一后以长期制度承接战时授权。"
 sofzh_prs_local_services:0 "地方公共代表与服务"
 sofzh_prs_local_services_desc:0 "地方预算与公共责任有明确归属。"
 sofzh_prs_national_science:0 "全国研究与工程网络"
 sofzh_prs_national_science_desc:0 "研究资料和试验标准在全国共享。"
 sofzh_prs_campaign_maneuver:0 "平原机动经验（旧制）"
 sofzh_prs_campaign_maneuver_desc:0 "旧的临时部署已由永久地形经验取代。读档后自动迁移；此旧定义不再提供奖励。"
 sofzh_prs_campaign_industrial:0 "城市作战经验（旧制）"
 sofzh_prs_campaign_industrial_desc:0 "旧的临时部署已由永久地形经验取代。读档后自动迁移；此旧定义不再提供奖励。"
 sofzh_prs_campaign_landing:0 "两栖登陆经验（旧制）"
 sofzh_prs_campaign_landing_desc:0 "旧的临时部署已由永久地形经验取代。读档后自动迁移；此旧定义不再提供奖励。"
 sofzh_paris.1.t:0 "市政厅的全国使命"
 sofzh_paris.1.d:0 "夜里的市政厅只有几个窗口亮着。桌上摊开的法国地图已经被关卡和边界划得支离破碎，窗外却仍有居民等待粮车与工资。政府首先要让这座城市恢复可靠的生活，再去回答全国为何应当接受巴黎的领导。"
 sofzh_paris.1.a:0 "从一座能运转的首都开始。"
 sofzh_paris.2.t:0 "公函从巴黎出发"
 sofzh_paris.2.d:0 "第一批公函随列车和邮袋离开首都。纸页上写着共同预算、地方席位和安全通行的承诺。收信人可以同意，也可以拒绝；信使带回的答复将告诉我们，统一的理由能否真正进入地方的日常生活。"
 sofzh_paris.2.a:0 "让各地看见我们的承诺。"
 sofzh_paris.3.t:0 "公民代表进入议事厅"
 sofzh_paris.3.d:0 "代表们在议事厅中摆出不同地方的账本。军队需要弹药，居民需要面包，工场需要工资。一份能公开讨论的共同预算，将使统一使命获得持续的公民支持。"
 sofzh_paris.3.a:0 "共同授权，共同责任。"
 sofzh_paris.4.t:0 "统一督政机构成立"
 sofzh_paris.4.d:0 "各部门负责人第一次围绕同一份动员与运输计划开会。每一道命令都有签字人，每一列军需车都有去向。政府相信，清晰的指挥与责任能把分散的力量变成可执行的全国事业。"
 sofzh_paris.4.a:0 "把决定变成行动。"
 sofzh_paris.5.t:0 "全国会议在巴黎开幕"
 sofzh_paris.5.d:0 "各地代表走过会场前的长桌，把带来的地图、预算和请愿放在一起。至少一百个完整掌握的法国州已有自己的席位。会场外仍有未结束的边界，但国家制度的轮廓正在从这些具体议题中形成。"
 sofzh_paris.5.a:0 "法国需要一份共同的委任。"
 sofzh_paris.6.t:0 "由巴黎重建法兰西"
 sofzh_paris.6.d:0 "最后一张地方边界的通行表被收进档案。全国领土已经归于共同政府，战争也终于结束。下一页的工作清单写着铁路、住房、学校与工场；巴黎将和各地一起学习如何管理和平。"
 sofzh_paris.6.a:0 "让全国共同生活。"
 sofzh_paris.7.t:0 "一封来自巴黎的归并邀约"
 sofzh_paris.7.d:0 "巴黎提出归入共同政府的正式邀请，承诺地方公共服务与统一行政。接受将使我们的国家与全部法国辖区加入巴黎，军队也将并入共同指挥；拒绝只结束本轮谈判。只有国家独立、和平、没有阵营保护且全部辖区都属于法国并由我方完全控制时，协议才能生效。"
 sofzh_paris.7.a:0 "接受共同政府的邀请。"
 sofzh_paris.8.t:0 "归并邀约遭到拒绝"
 sofzh_paris.8.d:0 "信使带回了不同意见。对方仍希望保留自己的国家机关，本轮谈判已经结束。政府不会因为这一封回信就自动发动战争，新的外交尝试必须等待冷却结束。"
 sofzh_paris.8.a:0 "记下意见，继续建设。"
 sofzh_paris.9.t:0 "地方政府接受共同协议"
 sofzh_paris.9.d:0 "地方代表带来已签署的归并文件。机关、军队与领土进入共同政府，原归并方的非核心地区获得有限的地方合作与调解支持。核心仍需满足控制时间、顺从和抵抗条件，完成地方登记。"
 sofzh_paris.9.a:0 "欢迎加入共同法兰西。"
 sofzh_paris.7.b:0 "保留独立，拒绝本轮邀请。"
 sofzh_paris_campaign_category:0 "巴黎的共同国家建设"
 sofzh_paris_neighbour_offer:0 "向邻近市镇发出归并邀约"
 sofzh_paris_neighbour_offer_desc:0 "向随机一个符合条件的相邻法国小国发出正式邀请。对方须和平、独立、不在阵营内，拥有少于十州，全部辖区都属于法国且完全受其控制。对方玩家可自由决定，AI只有在小国且巴黎实力明显占优时才可能接受；拒绝不会自动宣战。谈判每次一件，发起冷却90天，拒绝后目标冷却180天。"
 sofzh_paris_extend_administration:0 "了解地方整合程序"
 sofzh_paris_extend_administration_desc:0 "巴黎行政授权不会自动产生核心。请在“占领治理与地方整合”分类对符合条件的州逐项登记。"
 sofzh_paris_replan_crossing:0 "重拟最后的跨海计划"
 sofzh_paris_replan_crossing_desc:0 "根据现有合法科西嘉拥有者重新取得一个战争目标。实际港口和至少四艘军舰是前提，AI仍受单目标、实力和休整规则约束。"
