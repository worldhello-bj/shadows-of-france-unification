l_simp_chinese:
 sof_lil36_coal_steel_chain_desc:0 "煤矿、钢铁与铁路连成稳定的生产链，工厂产出提高25%，生产效率增长提高20%。持续掌握朗斯、瓦朗谢讷与杜埃，让北方订单按期交付。"
 SOF_LIL36_engine_of_the_economy_desc:0 "《以北方工业重铸法国》 · 全国交通与战略后方\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。把本区交通与储备纳入全国战线所需的后勤体系。"
 sof_lil36_modern_army_desc:0 "统一训练、指挥与补充流程，陆军组织度和恢复率各提高20%。与参谋训练的组织度+5%协同，建成组织严密的地方军。"
 SOF_LIL36_modernized_army_desc:0 "《以北方工业重铸法国》 · 国民军与统一战争\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。使地区军队具备参与全国统一战争、持续推进与整合战线的能力。"
 sof_mrs_red_plan_heavy_desc:0 "将设备、钢铁与劳动组织集中到重工业，建设速度提高20%、工厂产出提高25%、生产效率上限提高20%。消费品需求提高5%；成熟中央协调再提供3%工厂产出。"
 sof_mrs_red_plan_civil_desc:0 "优先扩建民生设施并稳定生产，建设速度和工厂产出各提高20%，消费品需求降低2%。这是与重工业计划互斥的建设方向。"
 sof_mrs_red_cadres_desc:0 "以专业干部和有经验的指挥员带动部队，陆军攻击提高20%、陆军经验增长提高25%。与群众军路线互斥。"
 sof_mrs_red_mass_desc:0 "扩大群众军的组织基础，陆军组织度提高20%、适役人口增加0.5个百分点；更广泛的训练使训练耗时增加5%。与干部军路线互斥。"
 sof_brt_science_bureau_desc:0 "改革后的技术研究院将科研与生产经验连接起来：科研速度+20%、生产效率增长+20%、换线效率保持+25%。"
 SOF_BRT_E10_desc:0 "《西部共和国的全国使命》 · 现代国家与科技动员\n\n布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。培养能够服务国家工业、军队与战后重建的科研和技术力量。"
 sof_brt_initiative_desc:0 "把长期进攻计划落实到部队，陆军攻击提高14%、计划速度提高8%，补给消耗增加5%。与进攻纲领的6%攻击协同，形成常态20%攻击优势。"
 SOF_BRT_O35_desc:0 "《西部共和国的全国使命》 · 国家使命与建国方案\n\n布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_van_prs_fra_market_dynamism_desc:0 "稳定的市场与工业协作释放持续生产能力：效率上限提高25%、效率增长提高20%，工业研究加成继续保留。"
 SFP_stimulate_the_dynamic_market_desc:0 "《重建法兰西国家中枢》 · 战略工业与战争经济\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。以本区的战略产业支撑统一战争，并为统一后的国家工业体系奠基。"
 sof_van_prs_fra_revolutionary_zeal_desc:0 "革命热情转化为持续作战能力：陆军攻击提高20%，核心领土防御提高15%。在共同革命路线中可与平等、自由、团结协同。"
 SFP_revolutionary_zeal_desc:0 "《重建法兰西国家中枢》 · 国家使命与建国方案\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_van_prs_fra_egalite_liberte_solidarite_desc:0 "共同建设推动工厂和船厂产出各提高25%；核心领土攻击和防御各提高10%。与革命热情同时生效时，核心战场获得更完整的攻防优势。"
 SFP_egalite_liberte_solidarite_desc:0 "《重建法兰西国家中枢》 · 国家使命与建国方案\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SFP_nationalize_key_industry_desc:0 "《重建法兰西国家中枢》 · 战略工业与战争经济\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。以本区的战略产业支撑统一战争，并为统一后的国家工业体系奠基。"
 sof_van_cor_ita_italys_destiny_idea_desc:0 "岛内船厂与主力舰体系形成成熟协作：船厂产出+25%、主力舰攻击+20%。船厂建设、定位与侦察收益继续保留。"
 SFC_italys_destiny_desc:0 "完成外交与海军路线的筹备，以成熟船厂支撑主力舰队，获得船厂产出+25%与主力舰攻击+20%。"
 SFC_divisioni_alpine_desc:0 "《从科西嘉重塑法兰西》 · 国家使命与建国方案\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SFC_institute_the_five_year_plan_desc:0 "集中五年投入，民用和军用工厂建设速度各增加20个百分点，累计上限保持25%；船厂和基础设施建设仍增加10个百分点，稳定度代价为5%。"
 SFC_improve_the_industries_desc:0 "《从科西嘉重塑法兰西》 · 战略工业与战争经济\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。以本区的战略产业支撑统一战争，并为统一后的国家工业体系奠基。"
 SFC_il_sol_dell_avvenire_desc:0 "《从科西嘉重塑法兰西》 · 国家使命与建国方案\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SFC_empower_the_unions_desc:0 "工会参与成熟生产组织，将效率增长补足至20%。工厂与船厂产出、建设空间和实际控制地区的民用工厂奖励继续保留。"
