l_simp_chinese:
# 法兰西之影 简体中文汉化
 SOF_MINING_resource_survey:0 "实地矿业调查"
 SOF_MINING_resource_survey_desc:0 "调查队将矿井档案与地方报告放在同一张地图上。依据现有矿区与勘探记录推进开发，将地质潜力转化为稳定供给。"
 SOF_MINING_industrial_methods:0 "矿业工程调查"
 SOF_MINING_lorraine_iron_1:0 "洛林米内特铁矿"
 SOF_MINING_lorraine_iron_1_desc:0 "矿灯照亮低品位含磷铁矿的掌子面。我们将改善抽水、提升与矿石分选，让洛林的矿产更稳定地进入冶炼环节。"
 SOF_MINING_lorraine_iron_2:0 "改良托马斯炼钢工艺"
 SOF_MINING_lorraine_iron_2_desc:0 "含磷矿石需要合适的冶炼方法。车间将继续改良既有的脱磷工艺，把矿山送来的原料转化为更多可供工业使用的钢材。"
 SOF_MINING_lorraine_iron_3:0 "阿扬日—布里埃钢铁联合体"
 SOF_MINING_lorraine_iron_3_desc:0 "矿山的装车时刻与工厂的生产计划终于放到同一张桌上。建立配套工业，将使洛林的矿冶建设形成更完整的生产链。"
 SOF_MINING_lorraine_coal_1:0 "旺代尔矿井整备"
 SOF_MINING_lorraine_coal_1_desc:0 "提升机、矿车与通风设备都需要可靠的维护。我们将整备福尔巴克煤盆的既有矿井，使煤炭供应能够跟上地方工业的需要。"
 SOF_MINING_lorraine_coal_2:0 "洛林煤化配套工业"
 SOF_MINING_lorraine_coal_2_desc:0 "运出矿井的煤炭还需要分类、装卸与加工。配套厂房将把这些工作组织起来，为煤田周围的工业提供更稳固的支撑。"
 SOF_MINING_alsace_oil_1:0 "佩谢尔布龙钻井整备"
 SOF_MINING_alsace_oil_1_desc:0 "北阿尔萨斯的井架仍在运转，技术人员仔细核对泵机与井况。这里的产量有限，我们将先改善既有钻井的效率。"
 SOF_MINING_alsace_oil_2:0 "北阿尔萨斯矿井采油"
 SOF_MINING_alsace_oil_2_desc:0 "部分石油需要从地下巷道汇集后送回地面。改善排水、集油和输送设备，将扩大这一小型油区的开采能力。"
 SOF_MINING_alsace_oil_3:0 "佩谢尔布龙润滑油工业"
 SOF_MINING_alsace_oil_3_desc:0 "原油的价值不仅在于燃料，润滑产品也关系到每一台机床与发动机。我们将扩建配套民用加工工业，利用本地已有的经验。"
 SOF_MINING_alsace_potash_1:0 "米卢斯钾盐矿业"
 SOF_MINING_alsace_potash_1_desc:0 "矿井送来含钾盐矿石，地方化工企业则在等待稳定的原料。我们将改善矿业与加工的联系，使这一真实矿区得到专门的发展。"
 SOF_MINING_alsace_potash_2:0 "阿尔萨斯化肥配套工业"
 SOF_MINING_alsace_potash_2_desc:0 "矿车离开井口之后，还要经过破碎、分选与加工。扩大配套工业，将让钾盐矿业更好地服务地方生产。"
 SOF_MINING_northern_coal_1:0 "朗斯—杜埃矿井扩产"
 SOF_MINING_northern_coal_1_desc:0 "井口的提升机昼夜轮转，新的订单已经送到矿务办公室。我们将扩充已控制煤田的开采能力，优先处理影响产出的设备与组织问题。"
 SOF_MINING_northern_coal_2:0 "北方煤盆深层开采"
 SOF_MINING_northern_coal_2_desc:0 "更深的工作面要求更可靠的抽水与通风。工程师将改良既有矿井的作业条件，使矿工能够稳定地把煤送上地面。"
 SOF_MINING_northern_coal_3:0 "北方矿业配套工厂"
 SOF_MINING_northern_coal_3_desc:0 "矿区需要机具、备件与加工设施，周围城镇也希望获得更稳定的工作。配套工业将把煤田的发展连接到地方经济之中。"
 SOF_MINING_provence_bauxite_1:0 "布里尼奥勒铝土矿"
 SOF_MINING_provence_bauxite_1_desc:0 "红色矿石从瓦尔省的矿区装上货车，冶炼企业正等待下一批原料。我们将改善铝土矿的开采与分选，扩大原料供应。"
 SOF_MINING_provence_bauxite_2:0 "瓦尔铝土矿机械化"
 SOF_MINING_provence_bauxite_2_desc:0 "新的设备需要适应矿层与运输条件。矿务人员将把机械化和分选工作一并推进，减少原料在矿场上的损耗与积压。"
 SOF_MINING_provence_bauxite_3:0 "普罗旺斯矿业加工配套"
 SOF_MINING_provence_bauxite_3_desc:0 "矿山与加工企业之间仍有许多需要协调的工序。我们将建设配套民用工业，使原料能够更有序地进入后续生产。"
 SOF_MINING_normandy_iron_1:0 "苏蒙铁矿整备"
 SOF_MINING_normandy_iron_1_desc:0 "卡昂以南的矿井与工人住区仍在等待新的投资。我们将改善苏蒙矿区的开采设备，使矿石供给更加稳定。"
 SOF_MINING_normandy_iron_2:0 "诺曼底钢铁配套工业"
 SOF_MINING_normandy_iron_2_desc:0 "矿石需要出路，工厂需要可靠的原料。建设配套工业，将把矿区的发展与诺曼底的制造需求联系起来。"
 SOF_MINING_loire_coal_1:0 "库里奥矿井扩能"
 SOF_MINING_loire_coal_1_desc:0 "圣艾蒂安的矿务人员正在安排新的提升与运输计划。我们将扩充既有煤矿的生产能力，使地方工业得到更可靠的能源供给。"
 SOF_MINING_loire_coal_2:0 "圣艾蒂安矿业机具"
 SOF_MINING_loire_coal_2_desc:0 "矿井的运行依赖许多细小而不可缺少的零件。建设配套工厂，将使矿务设备的制造与维护更有保障。"
 SOF_MINING_echassieres_tungsten_1:0 "马泽钨矿复采"
 SOF_MINING_echassieres_tungsten_1_desc:0 "旧有矿脉记录从档案中重新取出。恢复埃沙西耶尔钨矿开采，按矿区规模组织生产，补充战略材料供给。"
 SOF_MINING_echassieres_tungsten_2:0 "埃沙西耶尔选矿整备"
 SOF_MINING_echassieres_tungsten_2_desc:0 "有限的矿石更需要有效的分选。改良选矿与运输环节，将提高这处小型钨矿能够提供的战略材料数量。"
