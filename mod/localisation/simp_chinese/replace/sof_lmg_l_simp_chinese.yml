 sof_lmg.1.t:0 "来自利穆赞的全国贡献"
 sof_lmg.1.d:0 "地方议事、乡村协作、电工与兵工工场共同支撑了统一。战时的临时安排已经结束，利穆赞的工艺、公共服务与轻装军需成为全国制度的一部分。"
 sof_lmg.1.a:0 "让这些经验服务全国。"
 sof_lmg.2.t:0 "利穆赞的技术交流提案"
 sof_lmg.2.d:0 "利穆赞提出以工场交流改善工业技术。接受提案后，双方各获得一次35%的工业科研加成。该协议只涉及技术合作，不要求转移领土或改变政府。"
 sof_lmg.2.a:0 "批准工场技术交流。"
 sof_lmg.2.b:0 "目前不签署协议。"
 sof_lmg.3.t:0 "中央高原技术协约获批"
 sof_lmg.3.d:0 "克莱蒙费朗批准了工场技术交流。双方可以将这次合作用于一次工业技术研究。"
 sof_lmg.3.a:0 "安排交流人员。"
 sof_lmg.4.t:0 "技术协约暂未达成"
 sof_lmg.4.d:0 "克莱蒙费朗未能签署这份技术提案。未使用的协商费用返还25政治点数。"
 sof_lmg.4.a:0 "保留下一次协商的余地。"
