l_simp_chinese:
# 法兰西之影 简体中文汉化
 form_alsace_desc:0 "把各地的议事代表请到同一张桌前，让印章、税册与行政命令采用统一的章程。阿尔萨斯的名字，应当成为这份共同承诺的署名。"
 form_aquitaine_desc:0 "让各地市场恢复联系，让地方官知道应向何处递交报告。组建阿基坦，将使分散的城镇能够围绕共同的事务展开工作。"
 form_auvergne_desc:0 "代表们带着各自乡镇的问题前来：道路、供给，以及下一次征召。奥弗涅的成立，将为这些地方提供一套共同的行政框架。"
 form_bourgogne_desc:0 "让散落各地的账簿汇入同一份预算，让道路两端的官员不再互相推诿。勃艮第将以共同的名义处理共同的问题。"
 form_brettagne_desc:0 "地方代表的口音各不相同，对安定生活的期盼却相近。我们将以布列塔尼之名整合行政，让沿海与内陆都能参与这份共同事业。"
 form_centre_desc:0 "同一条河流经过不同的辖区，也带来了共同的交通与民生事务。我们将建立中央-卢瓦尔河谷的行政框架，协调各地的责任。"
 form_champagne_desc:0 "不同地方的官员终于坐进同一间会议室，桌上摆着尚未统一的地图。香槟-阿登的成立，将从协调这些行政边界与日常事务开始。"
 form_corsica_desc:0 "远方的消息仍由船只带来，岛上的事务则需要就地作出回应。我们将以科西嘉之名整合治理，让各地在共同的行政框架中保持联系。"
 form_franche-comte_desc:0 "新刻好的印章摆在桌上，各地代表还在逐项核对权责。弗朗什-孔泰的成立，意味着从此以共同的名义承担这些责任。"
 form_ile-de-france_desc:0 "首府的公文必须走出办公室，回应周围每座城镇的需要。法兰西岛的成立，将把分散的行政力量组织成一个能够运转的整体。"
 form_languedoc_desc:0 "地方代表带来了各自的章程与难题，谁也不愿只成为地图上的一个标记。组建朗格多克-鲁西永，需要让这些地方共同参与治理。"
 form_limousin_desc:0 "让远处村镇的请求能够得到答复，让各地官员知道自己的职责。利穆赞的成立，将从这些具体而细小的事务做起。"
 form_lorraine_desc:0 "各地的账册、货单与行政档案将在同一套制度下运转。洛林的成立，将使区域内的联系拥有共同的保障。"
 form_midi_desc:0 "首府与远处乡镇之间，需要持续往来的信使与可以信赖的行政。南部-比利牛斯将以共同的名义协调这些事务。"
 form_nord_desc:0 "各地已经习惯面对各自的公文，如今必须为共同的未来制定章程。北部-加莱海峡的成立，将把这些行政力量汇在一起。"
 form_normandie_desc:0 "过去分列两边的行政档案被搬进同一间办公室，新的章程正在传阅。我们将以诺曼底之名建立共同的治理框架。"
 form_pays-de-la-loire_desc:0 "让不同地方的需求进入同一份计划，让共同的道路与河运得到协调。卢瓦尔河地区的成立，将使区域治理有一处可以落笔的起点。"
 form_picardie_desc:0 "各地官员带着不同格式的表格前来，会议将从统一这些日常制度开始。皮卡第的名字，将代表一套共同承担责任的行政。"
 form_poitou_desc:0 "道路两端的地方官将开始交换账册与报告，共同安排区域事务。组建普瓦图-夏朗德，是让这种合作成为长久制度的第一步。"
 form_paca_desc:0 "港边的事务与山间城镇的需要，将在同一份章程中得到回应。我们将建立普罗旺斯-阿尔卑斯-蓝色海岸的行政框架，协调各地的责任。"
 form_rhone-alpes_desc:0 "从河谷到山间，各地都需要可靠的交通与明确的行政责任。罗讷-阿尔卑斯的成立，将把这些不同的需求纳入共同的治理。"
 fra_generic_military_industrial_complex_desc:0 "production_speed_buildings_factor +10%；消费品工厂系数 -2%；工厂产出 +10%；初始生产效率 +5%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_ressource_extraction_desc:0 "资源开采效率 +15%；生产效率增长 +5%；基础设施建设 +5%；生产线转换效率保留 +5%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_propaganda_campaigns_desc:0 "每周战争支持 +0.1%；动员速度 +15%；稳定度 +3%；指挥点获取 +10%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_military_training_desc:0 "每周人力 +80；训练时间 -10%；陆军恢复速度 +6%；陆军经验获取 +10%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_officers_academy_desc:0 "陆军组织度 +3；最大堑壕 +2；计划速度 +10%；增援率 +1%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_special_forces_desc:0 "特种部队容量 +5%；最低特种营数 +6；山地步兵攻击 +8%；海军陆战队攻击 +8%；海军陆战队防御 +6%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_mass_conscription_desc:0 "非核心人力系数 +3%；适役人口系数 +8%；动员速度 +20%；部队经验增长 +10%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 fra_generic_infiltration_tactics_desc:0 "特种部队攻击 +10%；无补给宽限小时 +24；断补给惩罚 -10%；山地步兵速度 +8%；移动组织度损失 -8%。\n本制度与通用成长精神共同生效；科研、产出和装备减价已按实际叠加重新分配。"
 form_departments_category_desc:0 "省级整合从一份份地方账册开始。我们将把相互联系的城镇纳入共同的行政，明确税收、征召与日常治理的责任。"
 form_regions_category_desc:0 "首府的旗帜已经能从更远的地方看见，政府的职责也随之扩展。建立大区，将为分散的地方事务提供共同的章程。"
 proclam_great_region_category_desc:0 "几份大区地图被并排放在桌上，原来的边界依旧清晰。宣布成立更大的区域，需要把跨越这些界线的共同事务组织起来。"
 form_france_category_desc:0 "越来越多的地名回到同一幅地图上，仍有人记得它们曾经属于共同的家园。重建法兰西，将使整合领土的努力拥有一个更长远的目标。"
 form_france_desc:0 "城镇之间仍有需要修通的道路，统一的旗帜也将带来新的责任。完成全国重建会议，独立、和平并完全拥有及控制339个法国地区后，即可宣布法兰西重归一体。首都迁至巴黎，取得法国核心；撤销战时统一精神，获得重建国家精神、政治点数+200、稳定度+10%。与最终统一国策共用奖励，不会重复领取。"
