l_simp_chinese:
 SOF_COR_consulta:0 "重召开岛民议会"
 SOF_COR_consulta_desc:0 "巴斯蒂亚的码头、阿雅克肖的街巷与山地村镇都需要一个共同的议事场所。我们将邀请地方代表重召开岛民议会，把分裂时期的行政、税收与军事争议纳入共同程序。岛屿的命运将由岛民共同承担，未来的法国也应听见这座岛的声音。"
 SOF_COR_pieve_compacts:0 "缔结皮耶韦协约"
 SOF_COR_pieve_compacts_desc:0 "山地村社与沿海商镇各有自己的习惯和利益。皮耶韦协约通过地方代表会议厘清粮食采购、预备役登记与道路维护责任，让共同政府能够执行决定，又不轻率抹去社区的自治传统。统一必须先成为可以日常运作的制度。"
 SOF_COR_island_mandate:0 "争取全岛统一授权"
 SOF_COR_island_mandate_desc:0 "一个政府无法在五套边境制度之间组织防务。议会授权争取巴斯蒂亚、卡尔维、科尔特、阿雅克肖与萨尔泰讷的共同管理。获得战争目标后，可自主选择开战时机；先集中兵力和补给，再逐一解决阻碍全岛整合的政权。"
 SOF_COR_island_union:0 "五地归于同一议会"
 SOF_COR_island_union_desc:0 "控制全岛五州后，议会可宣布共同政体，并取得全岛领土宣称。通过逐州治理提高顺从、平息抵抗，建立地方核心。"
 SOF_COR_ajaccio_memory:0 "阿雅克肖的遗产"
 SOF_COR_ajaccio_memory_desc:0 "阿雅克肖与波拿巴的名字联系在一起。我们选择从这一传统中提取统一指挥、国家意志与行政效率，以此建立当代政府的施政方向。新政府以岛屿为起点，主张建立足以结束大陆分裂的权威。"
 SOF_COR_bonaparte_council:0 "成立波拿巴派议政会"
 SOF_COR_bonaparte_council_desc:0 "波拿巴派议政会把军事计划与民政预算置于同一张桌前。全国机构协调地方利益与党派主张，持续推进统一。议政会将强化作战筹划与战场决断，使岛屿的有限兵力可以在关键地点形成优势。"
 SOF_COR_imperial_staff:0 "复兴远征参谋传统"
 SOF_COR_imperial_staff_desc:0 "以现代参谋工作承接军队的历史经验。我们要研究部队集结、登陆协同、纵深推进与预备队运用，把波拿巴传统中的组织能力转化为当前军队可以执行的命令。所有计划都必须以现实兵力与可维持的补给线为基础。"
 SOF_COR_corte_republic:0 "科尔特的共和国"
 SOF_COR_corte_republic_desc:0 "科尔特的议会大厅再次亮起灯火。地方代表带来山地村社的请愿，沿海商人要求恢复共同秩序；帕奥利留下的共和传统，让这些不同声音有了坐到同一张桌前的理由。我们将以公民授权建立政府，并把法律、代表与责任的原则带向大陆。"
 SOF_COR_consulta_charter:0 "颁布岛民议会宪章"
 SOF_COR_consulta_charter_desc:0 "议会宪章明确政府的授权程序、地方代表的职责与战时公共支出的监督方式。稳定的程序可以降低岛内猜疑，也能使未来加入我们的大陆城市理解共同国家的原则。公民政府必须拥有持续组织生产和作战的能力。"
 SOF_COR_civil_officers:0 "培育公民军官"
 SOF_COR_civil_officers_desc:0 "军官应当理解岛民为何战斗，也应熟悉纪律、地图和补给。我们将开放训练名额，培养能够与地方民政机构合作的军官团。公民军队将遵守共同法律，建立清晰指挥链，成长为可靠的现代力量。"
 SOF_COR_french_mission:0 "从岛屿走向法兰西"
 SOF_COR_french_mission_desc:0 "全岛统一解决了我们的后方问题，大陆的分裂却仍威胁海上贸易与国家安全。无论选择波拿巴派的权威，还是公民议会的共和传统，政府都将提出新的法兰西统一使命：建立大陆根据地，再通过实质整合赢得全国的承认。"
 SOF_COR_terraces:0 "修复梯田与村道"
 SOF_COR_terraces_desc:0 "依据岛屿山地条件组织粮食与运输。修复梯田、涵洞和村道，将降低农产运抵港口的损耗，也让偏远社区获得政府服务。施工安排集中在实际控制的岛内地区，优先形成能够长期维护的交通骨架。"
 SOF_COR_cooperatives:0 "组织岛内合作社"
 SOF_COR_cooperatives_desc:0 "零散作坊与小规模农业难以独自承担大宗采购。合作社将共同采购工具、组织仓储与销售，为政府提供可靠的物资清单。新增民用生产设施建在我方控制的岛内地区，逐步增强战争时期仍能维持生活的后方。"
 SOF_COR_corte_school:0 "设立科尔特技术学堂"
 SOF_COR_corte_school_desc:0 "山路需要测绘员，船厂需要机械师，远征军需要无线电技师。科尔特将开办共同资助的技术学堂，让岛上的青年能够学习这些本领。教室与实习作坊连在一起，研究从维修一部发动机、绘制一段海岸和接通一条通信线路开始。"
 SOF_COR_island_arsenals:0 "联通岛内兵工作坊"
 SOF_COR_island_arsenals_desc:0 "兵工作坊将使用统一量具、零件规格与验收标准。原有生产设施和新增军工共同承担轻武器与维修任务，减少前线等待。我们的目标是形成精干、稳定的生产网络，让有限工业真正转化为可以持续补充的装备。"
 SOF_COR_hydropower:0 "整修山地水力设施"
 SOF_COR_hydropower_desc:0 "整修山地水力设施与配电线路，为地方工坊提供可靠电力，改善工业基础并推动相关技术研究。工程按岛内地形与实际控制情况推进，原料由现有矿区和贸易供应。"
 SOF_COR_workshop_mobilization:0 "统一军需订单"
 SOF_COR_workshop_mobilization_desc:0 "地方采购分别制定标准，容易造成同类零件无法互换。政府将统一军需订单，安排兵工作坊分工与交付周期，为持续战役准备稳定库存。建设以新增军工设施和行政组织为主，避免依靠一次性的缴获维持全部部队。"
 SOF_COR_capital_works:0 "完善岛内公共工程"
 SOF_COR_capital_works_desc:0 "水电、道路、仓储与城市维修共同构成岛屿的公共工程计划。工程预算同时服务民生与军需，让战时政府不至于忽视日常生活。新增设施仍留在我方控制的岛内地区，成为全国统一之后继续发挥作用的基础。"
 SOF_COR_island_labs:0 "建立海陆联合实验室"
 SOF_COR_island_labs_desc:0 "海上无线电、登陆器材与野战维修需要跨部门合作。技术学堂与军需机构共同建立实验室，推动海陆技术交流。新的研究能力服务现实装备问题，使岛屿能够自主改进远征所需器材。"
 SOF_COR_harbours:0 "整顿岛屿港务"
 SOF_COR_harbours_desc:0 "港务整顿首先解决航道、码头调度与船只维修的组织问题。岛屿已有港口是海军和贸易的共同基础，统一管理比盲目建设更紧迫。海军人员将参与技术学习，为后续造船与运输计划形成稳定的专业队伍。"
 SOF_COR_convoy_office:0 "设立海运统筹署"
 SOF_COR_convoy_office_desc:0 "各港口的船主习惯为自己的码头安排航次，军队却需要一张覆盖全岛的运输表。海运统筹署将筹集四十艘运输船，统一人员、物资与装卸班次。让粮食及时抵达仓库，让士兵知道何时登船，是跨海事业的第一步。"
 SOF_COR_dockyards:0 "扩建岛屿修造船厂"
 SOF_COR_dockyards_desc:0 "岛屿将建设能够维修和建造小型军舰的船厂。两座新增船坞建在我方控制的岛内沿海地区，并补齐所需工业槽位。专业港务与造船组织将提高舰艇维护和生产能力。"
 SOF_COR_patrol_flotilla:0 "组建四舰护航队"
 SOF_COR_patrol_flotilla_desc:0 "船厂的汽笛宣告四艘早期驱逐舰完成整修，岛屿终于有了一支能够共同出航的护航队。舰员将在熟悉的港湾训练联络、警戒与夜间航行。护航队的使命是守住通向大陆的航路，为满载士兵和物资的运输船撑开第一道屏障。"
 SOF_COR_naval_school:0 "培育地中海海军军官"
 SOF_COR_naval_school_desc:0 "护航队需要熟悉地中海航行、无线电联络和驱逐舰协同的军官。海军学校围绕现有舰艇组织训练，强调侦察、护航与登陆配合。专业军官团将逐渐代替临时船长之间的非正式协调，为更远的海上行动建立标准。"
 SOF_COR_transport_training:0 "编练跨海运输队"
 SOF_COR_transport_training_desc:0 "码头边的士兵反复练习登船，军需人员核对每一批弹药和口粮的舱位。运输队将补充三十艘运输船，并掌握组织登陆所需的基本技术。从集合命令到第一批部队上岸，所有环节都必须围绕同一份计划展开。"
 SOF_COR_marine_routes:0 "勘测大陆补给航线"
 SOF_COR_marine_routes_desc:0 "我们要勘测从岛屿驶向法国南岸的航线，评估港口、天气与护航需求。政府将训练航线规划人员，并改进相关海军器材。以可靠航线、舰队侦察和登陆海域情报共同支持行动。"
 SOF_COR_air_sea_coordination:0 "协调海空侦察"
 SOF_COR_air_sea_coordination_desc:0 "海军报告与空中观察必须使用共同坐标和联络程序。协调海空侦察将改进航路识别、敌情通报与运输掩护。我们先建立制度与训练能力，再逐步研究适合海上任务的航空装备，避免把纸面航图当作真实海域控制。"
 SOF_COR_island_airfields:0 "保卫岛屿天空"
 SOF_COR_island_airfields_desc:0 "港口和造船设施需要可靠的空中观察与防护。政府将在实际掌握的岛内地区扩建航空基地，并组织飞行与地面保障训练。航空设施支撑部署，配套推进飞机生产与人员训练；以机场、飞机和地勤共同建立岛屿防空。"
 SOF_COR_mediterranean_screen:0 "维持地中海护航体系"
 SOF_COR_mediterranean_screen_desc:0 "登陆后持续维持海上运输。政府将组织备用运输、港口维修与护航轮换，维持岛屿和大陆之间的持续联系。补充运输船弥补损耗、扩大运力，为远征部队提供持续补给。"
 SOF_COR_mountain_militia:0 "整编山地守备队"
 SOF_COR_mountain_militia_desc:0 "岛屿的山地守备力量熟悉道路、山口与村镇，却需要共同的编制和通信。整编工作保留这种地形经验，并建立统一训练与轻武器标准。军队将从地方守备开始成长，逐步掌握可以用于大陆战役的专业能力。"
 SOF_COR_island_recruitment:0 "建立共同征募名册"
 SOF_COR_island_recruitment_desc:0 "过去分散在五地的预备役登记将汇入共同名册。四千名新征募人员与归队老兵等待训练安排，地方代表也要求服役责任公平分担。征募机关必须同时安排家庭补助、装备发放与补充训练，让每一个名字都对应一名准备充分的士兵。"
 SOF_COR_small_arms:0 "保障远征轻武器"
 SOF_COR_small_arms_desc:0 "远征力量首先需要可以维护、可以补充的轻武器。政府为首批部队准备一千五百件基础步兵装备，并统一训练所需的武器标准。将装备储备投入动员、编制和训练，组建后续兵力。"
 SOF_COR_marine_cadres:0 "编成两支登陆团"
 SOF_COR_marine_cadres_desc:0 "两支四营制海军陆战团将在我方控制的岛内地区编成。该计划一次性建立专属模板、提供基础装备并组织首批人员，作为登陆战的核心骨干。精干的登陆团适合夺取港口，但无法替代维持大面积战线所需的陆军。"
 SOF_COR_artillery_school:0 "组织野战炮兵训练"
 SOF_COR_artillery_school_desc:0 "山地和港口战斗同样需要火力配合。炮兵训练强调观察、无线电通报与步炮协同，并推动相关技术研究。我们将把有限火力集中到明确的战术目标上，避免为维持庞大炮兵编制而耗尽岛屿的运输与生产能力。\n军事成长：炮兵火力体系整备；同阶系列数值比通用提高15%。"
 SOF_COR_landing_drills:0 "反复演练抢滩行动"
 SOF_COR_landing_drills_desc:0 "从登船到岸上展开，每个环节都必须经过反复演练。海军陆战团与护航队共同训练通信、卸载与岸上突击，获得抢滩和登陆准备方面的优势。训练加成服务实际战斗，仍须由指挥者选择登陆地点并维持制海权。"
 SOF_COR_field_logistics:0 "统一野战补给标准"
 SOF_COR_field_logistics_desc:0 "统一岛屿仓储与大陆铁路的军需标准。野战补给标准将统一物资清单、装卸顺序与维修工具，改善前线补给消耗与交通工程。我们必须让作战计划服从后勤能够维持的范围。\n军事成长：军医与老兵网络整备；同阶系列数值比通用提高15%。"
 SOF_COR_expeditionary_corps:0 "成立科西嘉远征军"
 SOF_COR_expeditionary_corps_desc:0 "远征军总指挥部统一岛内各支部队的训练、组织与补给。新的组织体系提高军队组织度和动员能力，减少远征过程中的补给消耗。兵力扩张须配套合格人员、装备和工业支持。\n军事成长：联合作战参谋部成熟、炮兵火力体系成熟、预备役与补充体系成熟、步兵武器标准化成熟、机动运输勤务成熟、军医与老兵网络成熟；同阶系列数值比通用提高15%。"
 SOF_COR_mountain_tactics:0 "推广山地机动经验"
 SOF_COR_mountain_tactics_desc:0 "我们将在演习中总结山口侦察、预备队移动和复杂地形中的指挥经验。岛屿军队将以灵活、清晰和可靠的组织发挥优势。这些经验将在法国南部和内陆山地继续发挥作用。"
 SOF_COR_cross_mediterranean:0 "向大陆发出统一宣言"
 SOF_COR_cross_mediterranean_desc:0 "岛内共同政府、登陆部队和运输队已经形成，政府可以正式提出大陆统一主张。宣布使命之前，全岛必须由我方完整控制，拥有至少四艘军舰。跨海行动将是需要真实战斗和持续补给的远征，以战斗、补给与行政接续共同推进。"
 SOF_COR_provence_landing:0 "选择普罗旺斯航路"
 SOF_COR_provence_landing_desc:0 "西线计划优先考虑土伦，其次马赛与蒙彼利埃。政府只对当前合法拥有者取得一个战争目标，排除盟友、附庸与互不侵犯对象。港口必须通过实际登陆夺取；选定航路后，按军力与战局组织远征。"
 SOF_COR_riviera_landing:0 "选择蔚蓝海岸航路"
 SOF_COR_riviera_landing_desc:0 "东线计划优先考虑尼斯，其次土伦与马赛。政府将根据当前港口归属选择一个合法目标，为靠近意大利边境的大陆根据地创造条件。外交变化或战争目标到期后，可通过专属航路决议重新规划；组织登陆与驻守，落实作战目标。"
 SOF_COR_bridgehead:0 "巩固大陆桥头堡"
 SOF_COR_bridgehead_desc:0 "以实际登陆和驻守建立大陆根据地。只有尼斯、蒙彼利埃、马赛或土伦至少一州受我方控制，政府才可以巩固大陆桥头堡。我们将整顿港务、守备和行政，把跨海远征转变为能够持续扩张的大陆事业。"
 SOF_COR_civil_administration:0 "建立大陆共同政务"
 SOF_COR_civil_administration_desc:0 "大陆行政需要地方合作。该国策提供整合授权；法国非核心州必须满足控制时间、顺从和抵抗门槛，再完成付费地方登记。"
 SOF_COR_supply_spine:0 "打通港口军需干线"
 SOF_COR_supply_spine_desc:0 "桥头堡需要把港口卸载、铁路运输与野战仓储接成同一条干线。政府将协调军需时刻表，研究相关工业技术，并继续改善补给标准。远征的下一步取决于这条干线能够维持多少部队。"
 SOF_COR_rhone_advance:0 "沿罗讷河走向内陆"
 SOF_COR_rhone_advance_desc:0 "法国南岸只是开始。罗讷河走廊连接地中海港口、里昂与内陆工业地区，我们将由大陆根据地逐步争取接壤政权。目标获取继续沿用统一战争的合法性规则，AI仍每次只强化一个目标，交战与战后休整时停止筹划新战。"
 SOF_COR_lorraine_arsenals:0 "联接洛林兵工体系"
 SOF_COR_lorraine_arsenals_desc:0 "将洛林工业纳入生产、运输与公共建设。控制洛林铁矿或煤田所在州后，政府将联接生产、维修与军需采购网络，增强大陆兵工产出。工业建设依托现有矿藏，关键矿区原有控制民族精神继续按实际占领情况生效。"
 SOF_COR_alsace_granaries:0 "组织阿尔萨斯民生协作"
 SOF_COR_alsace_granaries_desc:0 "协调军队需求与民间生产运输。控制阿尔萨斯油田或钾盐盆地所在州后，政府将把农产、仓储与工业采购纳入共同计划，减轻战时民用负担。资源与人口沿用此前的真实数据口径，民生协作体现为国家组织能力的改善。"
 SOF_COR_northern_coal:0 "恢复北方工业运输"
 SOF_COR_northern_coal_desc:0 "北方煤田与工业城市需要可靠的运输和订单。政府必须先控制相关北方州，才能组织恢复生产网络。国策提供民用建设与行政资源，煤炭开发依据既有矿区推进；占领矿区的精神仍依据真实控制关系获取和移除。"
 SOF_COR_paris_mandate:0 "争取巴黎的全国委任"
 SOF_COR_paris_mandate_desc:0 "当巴黎受我方控制、全国控制规模超过二十州时，岛屿政府才有资格提出全国委任。以外交、军事与治理赢得首都。我们将邀请大陆代表参与新的政治安排，承认这场事业已经超出岛屿本身的边界。"
 SOF_COR_national_congress:0 "召开全国重建会议"
 SOF_COR_national_congress_desc:0 "控制巴黎、控制超过一百州即可召开全国重建会议。来自岛屿和大陆的代表将协商公共制度、战后财政与统一法兰西的政治原则。会议确立共同原则后，其余法国地区仍须继续完成整合。"
 SOF_COR_proclaim_france:0 "由科西嘉重建法兰西"
 SOF_COR_proclaim_france_desc:0 "全国的道路、城市与边界终于由共同政府管理，战争也已结束。代表们将在巴黎宣布法兰西重建，把临时动员机关的权力交还和平制度。从科西嘉出发的远征抵达了终点；接下来的国家使命，是让每个加入共同家园的地区分享秩序与繁荣。"
 SOF_COR_reconstruction:0 "岛屿与大陆共同重建"
 SOF_COR_reconstruction_desc:0 "将岛屿建设纳入全国重建。港务、交通、技术学堂和共同市场将把科西嘉与大陆联系起来，战争临时机构退出，公共建设重新占据中心。法兰西的统一将以持续生产、研究与民生改善来证明自己的价值。"
 sofzh_cor_solidarity:0 "岛民共同体"
 sofzh_cor_solidarity_desc:0 "地方协约把岛屿的税收、军需与议事程序组织起来。\n2.6新增：适役人口修正 +15%；陆军单位经验获取 +15%；陆军组织度恢复 +10%。"
 sofzh_cor_bonaparte:0 "波拿巴派的统一使命"
 sofzh_cor_bonaparte_desc:0 "结合专属三阶军事成长，组织统一战役所需的参谋、训练和勤务。\n陆军攻击 +4%；计划速度 +15%；增援率 +4个百分点；指挥点数增长 +25%；陆军组织度 +10%。"
 sofzh_cor_paoli:0 "公民议会的共和国"
 sofzh_cor_paoli_desc:0 "科尔特的共和传统重视公共授权、持续生产与公民责任。\n治理效果：每日顺从增长 +0.016个百分点/日；驻军需求 -7.5%。"
 sofzh_cor_arsenals:0 "岛内兵工协作"
 sofzh_cor_arsenals_desc:0 "统一订单和维修标准让小型工坊形成持续供应的网络。\n2.6新增：初始生产效率 +15%；生产效率增长 +15%；步兵装备生产成本 -15%。"
 sofzh_cor_maritime:0 "岛屿修造船体系"
 sofzh_cor_maritime_desc:0 "专业船坞与港务组织支持小型舰艇的生产和海军组织。\n2.6新增：运输船护航效率 +25%；舰船维修速度 +25%；海军燃料消耗 -20%；运输船生产成本 -15%。"
 sofzh_cor_landing:0 "抢滩行动训练"
 sofzh_cor_landing_desc:0 "反复演练登船、卸载与岸上突击，提高登陆准备速度。\n2.6新增：海军陆战队攻击 +20%；海军陆战队组织度 +15%；每个登陆计划的师数上限 +6。"
 sofzh_cor_expedition:0 "科西嘉远征军总指挥部"
 sofzh_cor_expedition_desc:0 "结合专属三阶军事成长，组织统一战役所需的参谋、训练和勤务。\n适役人口比例 +1个百分点；陆军组织度 +15%；补给消耗 -15%；山地步兵攻击 +20%；山地步兵防御 +15%；增援率 +4个百分点；陆军攻击 +10%；计划速度 +15%；计划上限 +22%；陆军组织度恢复 +15%。"
 sofzh_cor_continental:0 "大陆兵工网络"
 sofzh_cor_continental_desc:0 "掌握洛林后，岛屿与大陆的军需工业建立共同采购和生产网络。\n2.6新增：生产效率上限 +15%；更换生产线的效率保留 +20%；火炮生产成本 -15%。"
 sofzh_cor_granaries:0 "民生与军需统筹"
 sofzh_cor_granaries_desc:0 "阿尔萨斯的生产与采购协作减轻战时民用负担。\n2.6新增：适役人口修正 +15%；动员速度 +20%；稳定度 +8%。"
 sofzh_cor_legitimacy:0 "巴黎的全国委任"
 sofzh_cor_legitimacy_desc:0 "巴黎与大陆代表使岛屿统一使命获得全国政治授权。\n治理效果：每日顺从增长 +0.02个百分点/日；驻军需求 -10%；抵抗目标 -4%。"
 sofzh_cor_reconstruction:0 "岛屿与大陆的共同未来"
 sofzh_cor_reconstruction_desc:0 "全国统一之后，以工业与研究重建共同国家。\n2.6新增：工业修复 +40%；建筑建设速度 +20%；更换生产线的效率保留 +20%。"
 sofzh_corsica.1.t:0 "岛民议会重开"
 sofzh_corsica.1.d:0 "代表们穿过山路与海岸抵达会场，带着各自城镇的担忧：粮食如何采购，港口由谁调度，士兵为何而战。共同议会没有让这些问题立刻消失，却第一次让它们可以被放到同一张桌前。\n\n让共同国家连接科西嘉与大陆。今天的议程，是把共同政府从口号变成制度。"
 sofzh_corsica.1.a:0 "让岛屿发出共同的声音。"
 sofzh_corsica.2.t:0 "五地的一座岛"
 sofzh_corsica.2.d:0 "巴斯蒂亚的商人、卡尔维的守备人员、科尔特的地方代表、阿雅克肖的行政机构与萨尔泰讷的社区组织，终于可以在共同制度下合作。\n\n全岛统一开启了持续建设的新阶段。我们还需要学校、道路、港口与可以维持的军队。大陆上的分裂仍然存在，海峡也仍需要真正的船只才能跨越。"
 sofzh_corsica.2.a:0 "先把共同的后方建设好。"
 sofzh_corsica.3.t:0 "阿雅克肖的长久回声"
 sofzh_corsica.3.d:0 "波拿巴的名字在岛上留下了战争故事，也留下了关于国家意志、指挥与行政的讨论。今天的政治家选择继承这种传统，并承担自己的责任。\n\n这个世界的法国再次分裂，今天的代表将以自己的政治选择承担重建责任。议政会能够提出统一的使命，却必须以现实的兵力、工业和政治授权去完成它。"
 sofzh_corsica.3.a:0 "让传统成为行动的责任。"
 sofzh_corsica.4.t:0 "科尔特的公民约定"
 sofzh_corsica.4.d:0 "科尔特的代表们在宪章上签下姓名，会场外等候消息的人群随之欢呼。关于帕奥利的记忆，曾把地方代表、公共法律与国家建设联系起来；今天的议会选择让这些原则成为政府每天都要履行的责任。\n\n新共和国必须回答分裂时代的新问题。岛屿将以自己的经验走向大陆，以共同法律保障地方权利，以公民授权组织国家力量。代表们相信，这份约定终有一天能够容纳整个法国的声音。"
 sofzh_corsica.4.a:0 "公民决定自己的共同未来。"
 sofzh_corsica.5.t:0 "大陆桥头堡"
 sofzh_corsica.5.d:0 "港口已经由我方控制，仓库、码头与城镇可以真正纳入政府管理。渡海部队的任务也随之变化：从抢滩行动转向守备、补给和大陆作战。\n\n岛屿曾是我们的整个世界，现在它成为远征的后方。每一项进一步扩张的计划，都必须先回答一个问题——这座港口能否维持前线所需的人员与物资。"
 sofzh_corsica.5.a:0 "让胜利成为可以持续的根据地。"
 sofzh_corsica.6.t:0 "巴黎与岛屿的委任"
 sofzh_corsica.6.d:0 "来自科西嘉的政府终于在巴黎取得了可以被看见的全国地位。大陆代表要求新的制度能够处理财政、交通、复员和地方权利，而不仅仅延长军令的效力。\n\n巴黎的委任使统一使命获得新的政治基础，也带来更沉重的责任。继续完成各法国地区的整合，将首都的承认转化为全国制度。"
 sofzh_corsica.6.a:0 "为整个法国承担责任。"
 sofzh_corsica.7.t:0 "海峡两岸的法兰西"
 sofzh_corsica.7.d:0 "从岛民议会到全国会议，从护航队到大陆军需干线，统一的道路终于抵达了国家重建的时刻。政府迁驻巴黎，战争动员机构开始退出，新的共同国家承接其责任。\n\n统一后的科西嘉将成为全国海上交通的重要节点。岛屿与大陆将在共同市场、交通、教育和研究中继续联系，法兰西的未来要在和平的日常工作中建立。"
 sofzh_corsica.7.a:0 "共同国家，从此共同建设。"
 sofzh_corsica_campaign_category:0 "科西嘉跨海远征"
 sofzh_corsica_replan_route:0 "重新规划大陆航路"
 sofzh_corsica_replan_route_desc:0 "和平时，根据当前合法港口拥有者重新取得一个战争目标。仅在尚未建立大陆桥头堡时可用；AI仍受单目标、实力与休整规则约束。"
 sofzh_corsica_research_bonus:0 "科西嘉联合技术研究"
 sofzh_corsica_shortcut_mission:0 "统一使命"
 sofzh_corsica_shortcut_politics:0 "政治路线"
 sofzh_corsica_shortcut_industry:0 "岛屿建设"
 sofzh_corsica_shortcut_navy:0 "海军运输"
 sofzh_corsica_shortcut_army:0 "远征军"
