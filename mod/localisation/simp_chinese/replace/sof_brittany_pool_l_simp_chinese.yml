 sof_brt_committees:0 "议会委员会与候补代表"
 sof_brt_committees_desc:0 "财政、陆军、海军、航空、科研和外交均可取得有期限的专项拨款。维持多数和议员支持才能保留强化效果。六个议席各有一名历史候补，改任不增加总席位。"
 sof_brt_local.100.t:0 "雷恩：地方代表驻地沦陷"
 sof_brt_local.100.d:0 "雷恩的控制权发生变化。地方政治基地的控制情况决定代表的授权资格。驻地在此的现任代表暂失地方授权，其支持和关联专项拨款已撤销。我们可以维持流亡代表团，或在委员会决议中改任候补。"
 sof_brt_local.101.t:0 "雷恩：攻下代表的家乡地区"
 sof_brt_local.101.d:0 "雷恩的控制权发生变化。地方政治基地的控制情况决定代表的授权资格。相关现任代表恢复协商资格；地方支持须重新协商确认。请与代表落实新的支持安排，任何占领整合仍须遵守现有制度。"
