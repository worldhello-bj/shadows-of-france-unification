 sof_brt_rotate_chateau:0 "改任地方代表：弗朗索瓦·沙托 ⇄ 居伊·拉尚布尔"
 sof_brt_rotate_chateau_desc:0 "候补身份：圣塞尔旺市长、圣马洛选区众议员。政治驻地：圣塞尔旺／圣马洛（州域：165州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_rotate_lemaistre:0 "改任地方代表：让·勒梅斯特 ⇄ 亚历山大·勒法"
 sof_brt_rotate_lemaistre_desc:0 "候补身份：伊勒－维莱讷参议员、前地方议会主席。政治驻地：圣欧班迪科尔米耶／富热尔（州域：179州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_rotate_bahon:0 "改任地方代表：卡尔·巴翁 ⇄ 埃米尔·古德"
 sof_brt_rotate_bahon_desc:0 "候补身份：布雷斯特选区众议员，历史上1936年退出议会。政治驻地：布雷斯特（州域：168州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_rotate_legorgeu:0 "改任地方代表：维克托·勒戈尔热 ⇄ 阿尔方斯·里奥"
 sof_brt_rotate_legorgeu_desc:0 "候补身份：莫尔比昂参议员、航海与海运事务政治人物。政治驻地：基伯龙／莫尔比昂（州域：198州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_rotate_tremintin:0 "改任地方代表：皮埃尔·特雷曼坦 ⇄ 约瑟夫·潘维迪克"
 sof_brt_rotate_tremintin_desc:0 "候补身份：1935年朗迪维肖市议员；此时尚非国会议员。政治驻地：朗迪维肖（州域：162州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_rotate_prigent:0 "改任地方代表：弗朗索瓦·唐吉－普里让 ⇄ 让·佩罗"
 sof_brt_rotate_prigent_desc:0 "候补身份：菲尼斯泰尔众议员与农业地方政治人物。政治驻地：埃斯基比安／坎佩尔地区（州域：200州）。花费50政治点并冷却180日，往返切换同一议席代表，保留原席位总额；清除当前支持与拨款承诺，新代表必须重新协商。议席总额维持不变；驻地沦陷时代表转入流亡安排。"
 sof_brt_fund_economy:0 "议会专项：公共建设与工坊拨款"
 sof_brt_fund_economy_desc:0 "须51席及相关委员会代表的有效支持。支付35政治点，拨款持续180日。失去多数、必要支持或独立执政条件后撤销；代表更换也会触发复核。同类效果采用单一等级。"
