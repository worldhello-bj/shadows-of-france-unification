l_simp_chinese:
 totalist:0 "共产主义"
 totalist_noun:0 "共产主义"
 totalist_desc:0 "共产主义"
 totalist_subtype:0 "共产主义"
 totalist_subtype_desc:0 "法国共产党以马克思主义和列宁主义为理论基础，依靠集中组织的政党、工人运动与共产国际联系推动社会主义目标。1936年，多列士执行人民阵线战略，与社会党及激进党共同反对法西斯主义，支持劳动立法，并从议会支持布鲁姆政府而不入阁。"
 syndicalist:0 "革命工团主义"
 syndicalist_noun:0 "革命工团主义"
 syndicalist_desc:0 "革命工团主义"
 syndicalist_subtype:0 "革命工团主义"
 syndicalist_subtype_desc:0 "革命工团主义主张由工会组织阶级斗争，以直接行动和总罢工改造生产关系，维护工人组织相对于政党和国家的自主性。它是法国劳工运动中的思想传统；1936年重新统一的CGT则容纳了多种社会主义和共产主义倾向。"
 radical_socialist:0 "独立社会主义"
 radical_socialist_noun:0 "独立社会主义"
 radical_socialist_desc:0 "独立社会主义"
 radical_socialist_subtype:0 "独立社会主义"
 radical_socialist_subtype_desc:0 "独立社会主义包含处于共产党与SFIO之间的左翼团体。无产阶级统一党由共产主义运动的分裂与异议组织合流而成，维护工人阶级政治、地方组织与独立判断，并参加1936年的人民阵线。其力量来自市政据点、工人选区和议会合作。"
 social_democrat:0 "民主社会主义"
 social_democrat_noun:0 "民主社会主义"
 social_democrat_desc:0 "民主社会主义"
 social_democrat_subtype:0 "民主社会主义"
 social_democrat_subtype_desc:0 "SFIO坚持社会主义改造的目标，同时通过普选、议会和有组织的劳工运动争取改革。1936年的核心议程是集体合同、带薪休假、缩短工时及扩大公共干预。社会主义共和联盟也参与这一改革阵营，但其议会合作、计划经济和国家权力主张具有鲜明的内部差异。"
 social_liberal:0 "激进共和主义"
 social_liberal_noun:0 "激进共和主义"
 social_liberal_desc:0 "激进共和主义"
 social_liberal_subtype:0 "激进共和主义"
 social_liberal_subtype_desc:0 "法国激进派以世俗共和国、议会制度和公民平等为政治基础，维护小业主、农民和中产阶层的利益。激进党在1936年参加人民阵线，同时坚持私人财产、财政责任与渐进改革；“激进—社会主义”这一历史党名体现的是法国共和传统。"
 market_liberal:0 "自由共和主义"
 market_liberal_noun:0 "自由共和主义"
 market_liberal_desc:0 "自由共和主义"
 market_liberal_subtype:0 "自由共和主义"
 market_liberal_subtype_desc:0 "民主联盟及共和左派代表共和中右翼的自由主义传统，支持私人经营、稳健货币、财政平衡和代议政治。1936年，他们反对人民阵线的部分经济措施，依靠地方名流、企业界及议会合作组织力量。“共和左派”延续了早年的政治称谓。"
 social_conservative:0 "保守共和主义"
 social_conservative_noun:0 "保守共和主义"
 social_conservative_desc:0 "保守共和主义"
 social_conservative_subtype:0 "保守共和主义"
 social_conservative_subtype_desc:0 "共和保守派在代议政治中强调财产、家庭、宗教自由和国防。共和联盟具有民族保守主义与反共色彩；人民民主党发展基督教民主和社会天主教纲领；阿尔萨斯人民共和联盟则重视地方宗教制度、区域权利和文化传统。三者分别拥有自己的政治组织与施政重点。"
 authoritarian_democrat:0 "威权民族主义"
 authoritarian_democrat_noun:0 "威权民族主义"
 authoritarian_democrat_desc:0 "威权民族主义"
 authoritarian_democrat_subtype:0 "威权民族主义"
 authoritarian_democrat_subtype_desc:0 "这一倾向主张加强行政权、整合社会组织，并以民族团结压过议会党争。1936年的法国出现多种反议会或强政府主张，彼此背景并不相同。多里奥从共产主义异议者转向反共民族动员，并在6月建立法国人民党，其路线进一步向法西斯主义发展。"
 paternal_autocrat:0 "传统威权主义"
 paternal_autocrat_noun:0 "传统威权主义"
 paternal_autocrat_desc:0 "传统威权主义"
 paternal_autocrat_subtype:0 "传统威权主义"
 paternal_autocrat_subtype_desc:0 "传统威权派把政治秩序寄托于君主、军方或保守精英，倾向等级组织、行政集权与限制政党竞争。法国君主主义中的法兰西行动派主张君主复辟和整体民族主义，并具有明确的反议会与反犹倾向；其目标与维护共和议会的保守党派存在根本分歧。"
 national_populist:0 "法西斯主义"
 national_populist_noun:0 "法西斯主义"
 national_populist_desc:0 "法西斯主义"
 national_populist_subtype:0 "法西斯主义"
 national_populist_subtype_desc:0 "法西斯主义以极端民族主义、领袖权威和群众动员重塑国家，排斥自由议会政治与马克思主义，主张由国家统合社会和劳资关系。法国相关运动的组织与激进程度各异，部分势力推行排外和反犹政治，并以政治暴力打击对手。"
