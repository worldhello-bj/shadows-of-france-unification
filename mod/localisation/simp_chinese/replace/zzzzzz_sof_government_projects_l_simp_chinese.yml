l_simp_chinese:
 sof_gov_np_title:0 "法兰西国家工程"
 sof_gov_np_subtitle:0 "以全国规模的制度工程支撑统一与重建"
 sof_gov_np_rules:0 "同一时间推进一个国家工程。每个工程正常需要 50 天，每日推进 2；额外投入 25 政治点推进 10，最多两次，间隔 10 天。交通、军备与财政工程在战争中暂停。每个工程只验收一次。"
 sof_gov_np_no_project:0 "尚未立项"
 sof_gov_np_status_idle:0 "等待立项"
 sof_gov_np_status_ready:0 "可以立项"
 sof_gov_np_status_active:0 "正在执行"
 sof_gov_np_status_paused:0 "暂缓执行"
 sof_gov_np_status_complete:0 "已经验收"
 sof_gov_np_status_all_complete:0 "全国工程全部验收"
 sof_gov_np_status_locked:0 "立项条件未满足"
 sof_gov_np_eta_active:0 "预计还需 [?sof_gov_np_eta_days|0] 天"
 sof_gov_np_eta_paused:0 "暂停期间不计算完工日期"
 sof_gov_np_eta_complete:0 "已经验收；可以立项下一项工程"
 sof_gov_np_eta_none:0 "等待下一项工程"
 sof_gov_np_progress_label:0 "执行进度"
 sof_gov_np_progress_text:0 "[?sof_gov_np_progress|0] / 100"
 sof_gov_np_ledger:0 "已验收 [?sof_gov_np_completed|0] / 4；追加投入 [?sof_gov_np_boosts|0] / 2"
 sof_gov_np_invest:0 "追加投入"
 sof_gov_np_invest_tt:0 "25 政治点；当前工程进度 +10。最多投入两次，每次间隔 10 天；暂停期间不能投入。追加投入不退还。"
 sof_gov_np_cancel:0 "撤销立项"
 sof_gov_np_cancel_tt:0 "撤销当前工程，返还立项政治点的一半：100 点立项返还 50，150 点立项返还 75。追加投入与陆军经验不退还；执行进度清零。"
 sof_gov_np_start:0 "批准立项"
 sof_gov_np_current_title:0 "当前全国任务"
 sof_gov_np_acceptance:0 "验收目标"
 sof_gov_np_paused_reason:0 "和平工程在战争期间暂停；附庸或投降期间所有工程暂停。取消和重新立项不会保留进度。"
 sof_gov_np_invest_cooldown:0 "追加投入冷却：[?sof_gov_np_invest_days_left|0] 天"
 sof_gov_np_native_note:0 "永久制度收益在原生政治界面查看。此处记录工程执行与验收。"
 sof_gov_np_transport:0 "贯通全国交通命脉"
 sof_gov_np_transport_desc:0 "把相互割裂的交通体系接入全国统筹，让统一军队与重建物资拥有共同的运输骨架。"
 sof_gov_np_transport_title:0 "贯通全国交通命脉"
 sof_gov_np_transport_requirements:0 "已取得全国领导委托；100 政治点。"
 sof_gov_np_transport_reward:0 "永久：基础设施建设速度 +10%，补给消耗 −10%。已选宪章时，重建进度另加 10。"
 sof_gov_np_transport_start_tt:0 "已取得全国领导委托；100 政治点。正常执行 50 天。永久：基础设施建设速度 +10%，补给消耗 −10%。已选宪章时，重建进度另加 10。"
 sof_gov_np_armaments:0 "全国军备统筹局"
 sof_gov_np_armaments_desc:0 "以统一规格、跨区采购和全国军工分工，为统一事业建立能够持续战争的工业体系。"
 sof_gov_np_armaments_title:0 "全国军备统筹局"
 sof_gov_np_armaments_requirements:0 "已取得全国领导委托；工业方向至少完成 3 项国策；150 政治点。"
 sof_gov_np_armaments_reward:0 "永久：生产效率上限 +10%，军用工厂建设速度 +10%。"
 sof_gov_np_armaments_start_tt:0 "已取得全国领导委托；工业方向至少完成 3 项国策；150 政治点。正常执行 50 天。永久：生产效率上限 +10%，军用工厂建设速度 +10%。"
 sof_gov_np_staff:0 "法兰西联合参谋部"
 sof_gov_np_staff_desc:0 "将地区军队纳入共同的参谋、联络与作战规划体系，使统一战线能够组织全国规模的战役。"
 sof_gov_np_staff_title:0 "法兰西联合参谋部"
 sof_gov_np_staff_requirements:0 "已获统一战争准备授权；布列塔尼还须获议会战争授权；100 政治点、25 陆军经验。"
 sof_gov_np_staff_reward:0 "永久：计划速度 +10%，陆军组织度 +5%。本工程在战争期间继续推进。"
 sof_gov_np_staff_start_tt:0 "已获统一战争准备授权；布列塔尼还须获议会战争授权；100 政治点、25 陆军经验。正常执行 50 天。永久：计划速度 +10%，陆军组织度 +5%。本工程在战争期间继续推进。"
 sof_gov_np_treasury:0 "统一财政与关税体系"
 sof_gov_np_treasury_desc:0 "以共同预算、税制与关税边界巩固宪制统一，把地区联合转化为能够承担全国责任的政府。"
 sof_gov_np_treasury_title:0 "统一财政与关税体系"
 sof_gov_np_treasury_requirements:0 "国民大会已召开；已采纳宪章；和平；150 政治点。"
 sof_gov_np_treasury_reward:0 "永久：政治点增长 +10%，生活消费品工厂比例 −5%；重建互信 +10。"
 sof_gov_np_treasury_start_tt:0 "国民大会已召开；已采纳宪章；和平；150 政治点。正常执行 50 天。永久：政治点增长 +10%，生活消费品工厂比例 −5%；重建互信 +10。"
