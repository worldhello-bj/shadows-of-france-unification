 sof_reg_prs_organization_desc:0 "以首都车辆工场的铸造与总装经验为基础，擅长厚实可靠的装甲车体；增加的重量会牺牲少许机动。\n起始工艺：装甲+6%、速度-2%。专项科研：+10%。\n全部成长：装甲+10%、速度-2%、可靠性+3%；生产效率增长+3%、生产资源需求-2%。\n解锁：完全控制比扬古，完成“工业扩张”。"
