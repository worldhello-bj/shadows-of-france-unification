 sof_reg_prs_organization_desc:0 "以首都车辆工场的铸造与总装经验为基础，擅长厚实可靠的装甲车体；增加的重量会牺牲少许机动。\n起始工艺：装甲+10%、速度-2%。专项科研：+15%。\n8层、16项成长：装甲+40%、速度-2%、可靠性+16%；生产效率增长+12%、生产资源需求-8%、生产成本-12%、生产效率上限+12%；组织经费获取+50%、额外专项科研+5%、额外并行任务容量+1。\n解锁：完全控制比扬古，完成“工业扩张”。"
 sof_reg_prs_organization_legacy_desc:0 "以首都车辆工场的铸造与总装经验为基础，擅长厚实可靠的装甲车体；增加的重量会牺牲少许机动。\n起始工艺：装甲+10%、速度-2%。专项科研：+15%。\n解锁：完全控制比扬古，完成“工业扩张”。\n传统设计商版本仅提供起始装备工艺，不含军工组织成长。"
