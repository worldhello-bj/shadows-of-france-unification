 sof_reg_lil_organization_desc:0 "矿冶、铁路与重型机械工场共同提供耐用的车辆结构，面向高强度维护需求；稳固部件较为笨重。\n起始工艺：可靠性+10%、速度-2%。专项科研：+15%。\n8层、16项成长：可靠性+40%、速度-2%、对装甲杀伤+16%；生产效率增长+12%、生产资源需求-8%、生产成本-12%、生产效率上限+12%；组织经费获取+50%、额外专项科研+5%、额外并行任务容量+1。\n解锁：完全控制里尔，完成“扩建区域工厂 / 修复北方工场的生产链”。"
