l_simp_chinese:
 sof_economy_resources_migrate:0 "旧档资源重分配"
 sof_economy_resources_migrate_desc:0 "适用于采用旧版分散供给的存档。将全法国的基础煤炭、钢铁、铝、油、橡胶、钨、铬调整为新的集中产区配置；取消各地低保。只应用一次基础差额，保留已经追加的矿业产出。现有工厂和建筑槽位不变；80%初始工厂配置需新开局。更早、尚未采用完整旧供给的存档建议新开局。"
 sof_economy_resources_migrate_available_tt:0 "当前存档尚未使用新版集中资源分配；由法国玩家执行一次。"
 sof_economy_resources_migrate_tt:0 "全法国资源基础重分配一次：煤炭1500、钢铁1400、铝1100、石油1000、橡胶850、钨1000、铬1000。保留矿业追加；不会修改旧档工厂、槽位、胜利点或归属。"
