 SFC_naval_power_projection_desc:0 "《从科西嘉重塑法兰西》 · 国家海权与海上战线\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。以本区港口与船厂支撑国家海权、海上供给和沿海统一战线。"
 SFC_new_industrialization_program_desc:0 "《从科西嘉重塑法兰西》 · 战略工业与战争经济\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。以本区的战略产业支撑统一战争，并为统一后的国家工业体系奠基。"
 SFC_the_italian_legions_desc:0 "为岛屿军团配发1200件步兵装备、120门火炮和150辆卡车，获得30点陆军经验。本土防御增加5%，陆军速度增加5%，指挥点数上限增加15%。"
