 SFC_air_innovations_bba_desc:0 "《从科西嘉重塑法兰西》 · 国家航空与联合战争\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。把本区航空基础转化为统一战争的制空与联合行动力量。"
 SFC_ethiopian_war_logistics_bba_desc:0 "《从科西嘉重塑法兰西》 · 国家使命与建国方案\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SFC_expand_national_universities_desc:0 "《从科西嘉重塑法兰西》 · 现代国家与科技动员\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。培养能够服务国家工业、军队与战后重建的科研和技术力量。"
