 SFC_air_innovations_bba_desc:0 "在设施上限内为首都机场增加1级。航空建设提供25点空军经验、1次100%战斗机研究加成及2次50%空军学说折扣。"
 SFC_ethiopian_war_logistics_bba_desc:0 "为跨海航线准备20艘运输船和100件支援装备。在完整控制的法国地区增加1级基础设施，并为受控沿海地区增加1级海军基地；各类设施已达上限时，对应获得40点政治点数。"
 SFC_expand_national_universities_desc:0 "大学计划在工业条件下增加1个科研槽，最多达到3个；已有3个槽位时获得1次100%电子科技研究加成。后续工业化计划在联结阿雅克肖与巴斯蒂亚后可增设第4槽。"
 SFC_forza_navale_especiale_desc:0 "为两支四营海军陆战编制准备800件步兵装备和100件支援装备，获得25点陆军经验、1次100%海军陆战队／运输船科技研究加成及1次50%陆军学说折扣，并获得登陆部队组织体系。"
 SFC_naval_power_projection_desc:0 "在受控法国海岸与科西嘉港区合计建成2座船坞，获得20艘运输船、25点海军经验及1次50%海军学说折扣。"
 SFC_new_industrialization_program_desc:0 "大学建设完成后，阿雅克肖与巴斯蒂亚整合工业基础：阿雅克肖建成1民工，巴斯蒂亚建成1军工，并增加2个建筑槽。增加1个科研槽，最多4个；满额时获得100%电子科技研究加成。消费品需求系数增加2%，开放圭多·荣格担任财政内阁。"
 SFC_the_italian_legions_desc:0 "为岛屿军团配发1200件步兵装备、120门火炮和150辆卡车，获得30点陆军经验。本土防御增加5%，陆军速度增加5%，指挥点数上限增加15%。"
 SOF_MRS_RED_D7_desc:0 "与独立、未投降的同阵营伙伴开展技术合作。建成军官学校、马赛拥有3民工和3军工后，增加1个科研槽，最多4个；满额时获得100%电子科技研究加成。合作关系存续期间共同开展工业研究。"
 SOF_MRS_RED_E12_desc:0 "在完整控制的指定产业地区建成1座民用工厂，并增加1个建筑槽。"
 SOF_MRS_RED_E2_desc:0 "在完整控制的指定产业地区建成1座民用工厂，并增加1个建筑槽。"
 SOF_MRS_RED_E3_desc:0 "港仓建设计划合计增加2座民用工厂，并为两座工厂配套建筑槽，建设马赛长期生产与仓储中心。"
 SOF_MRS_RED_E5_desc:0 "扩建瓦尔铝土矿区：布里尼奥勒增加12单位铝和1级基础设施，基础设施最高5级。该铝矿扩建与地区其他采矿计划共用一次领取额度。"
 SOF_MRS_RED_E7_desc:0 "在完整控制的指定产业地区建成1座军用工厂，并增加1个建筑槽。"
 SOF_MRS_RED_E8_desc:0 "计划运行满一年、拥有至少6座民用及军用工厂后，建成1座民用工厂、2座军用工厂并增加3个建筑槽。获得1次100%工业科技研究加成，升级计划经济。"
 SOF_MRS_RED_E9_desc:0 "在完整控制的指定产业地区建成1座军用工厂，并增加1个建筑槽。"
 SOF_MRS_RED_M10_desc:0 "地中海海空演习提供25点空军经验、15点海军经验、1次50%海军轰炸机研究加成及1次50%空军学说折扣。"
 SOF_MRS_RED_M3_desc:0 "马赛拥有2民工、2军工后，红军军官学校增加1个科研槽，最多3个；获得20点陆军经验和1次50%陆军学说折扣，槽位满额时获得100%电子科技研究加成。"
 SOF_MRS_RED_M6_desc:0 "完成陆军整编，建立两支六营步兵编制的装备储备：1200件步兵装备、120门火炮、100件支援装备。获得30点陆军经验及1次50%陆军学说折扣，并移除整编期间的临时惩罚。"
 SOF_MRS_RED_M9_desc:0 "地中海海军计划合计增加2座船坞及配套建筑槽，交付20艘运输船，并提供25点海军经验及1次100%驱逐舰研究加成。"
