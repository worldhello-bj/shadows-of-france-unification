 sof_region_BRD_1936_air_exchange_desc:0 "《大西洋共和国的全国雄心》 · 全国统一战线\n\n阿基坦的商贸、信用与大西洋航路需要一个完整的国内市场。我们必须把这些资源用于统一战争的财政与生产，再以国家制度重开法国的对外通道。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
