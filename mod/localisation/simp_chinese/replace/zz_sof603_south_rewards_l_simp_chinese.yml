 sof_region_BES_1936_assembly_line_desc:0 "蒙贝利亚尔增加2座军用工厂及2个建筑槽，并交付首批150辆卡车。"
 sof_region_BES_1936_border_desc:0 "为边境预备队配发600件步兵装备，并获得20点陆军经验。"
 sof_region_BES_1936_certificates_desc:0 "认证研究机构整合学校应用研究项目。完成前期科研建设后，增加1个科研槽，最多达到4个。第4槽需当地工业中心至少3座民用工厂和3座军用工厂；已有4个槽位时获得1次100%电子科技研究加成。"
 sof_region_BES_1936_field_workshops_desc:0 "野战工场交付100件支援装备，并提供15点陆军经验及1次100%支援科技研究加成。"
 sof_region_BES_1936_inspection_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_BES_1936_measures_desc:0 "瑞士同意合作后，统一技术标准交付100件支援装备，并提供1次100%电子科技研究加成和1次50%工业科技研究加成。"
 sof_region_BES_1936_motor_brigade_desc:0 "为摩托化旅建立装备储备：300辆卡车、600件步兵装备、100件支援装备，并获得25点陆军经验用于编组。"
 sof_region_BES_1936_optics_desc:0 "精密光学计划交付120门火炮，并提供1次100%火炮科技研究加成。"
 sof_region_BES_1936_precision_school_desc:0 "精密学校建立常设研究团队。当地工业中心拥有至少2座民用工厂和2座军用工厂后，增加1个科研槽，最多达到3个；已有3个槽位时获得1次100%电子科技研究加成。"
 sof_region_BES_1936_repair_columns_desc:0 "维修纵队接收100件支援装备和150辆卡车，维修组织继续提供保障。"
 sof_region_BES_1936_small_machines_desc:0 "贝桑松小型机械工场增加2座民用工厂及2个建筑槽，扩大精密制造规模。"
 sof_region_BRD_1936_air_exchange_desc:0 "图卢兹接受合作协议后，以波尔多工业基础组建联合研究计划：增加1个科研槽，最多4个，并获得25点空军经验。第3槽需当地2民工、2军工，第4槽需3民工、3军工；满额时获得100%电子科技研究加成。"
 sof_region_BRD_1936_bomber_orders_desc:0 "下达轰炸机订单：在波尔多建成2座军用工厂并增加2个建筑槽，交付18架早期飞机，获得15点空军经验。"
 sof_region_BRD_1936_civil_orders_desc:0 "在完整控制的指定产业地区建成1座民用工厂，并增加1个建筑槽。"
 sof_region_BRD_1936_coastal_escorts_desc:0 "沿岸护航计划提供1次100%驱逐舰研究加成、25点海军经验及1次50%海军学说折扣。"
 sof_region_BRD_1936_crew_school_desc:0 "船员学校提供25点海军经验及1次50%海军学说折扣。"
 sof_region_BRD_1936_escort_slips_desc:0 "增加2座海军船坞和2个建筑槽，支撑护航舰生产计划，并获得20点海军经验。"
 sof_region_BRD_1936_export_houses_desc:0 "波尔多出口商行投资1座民用工厂及1个建筑槽，商业网络继续为港区组织订单。"
 sof_region_BRD_1936_maritime_staff_desc:0 "海事参谋部组建商船与护航船员技术学校。波尔多拥有2民工、2船坞后，增加1个科研槽，最多3个；满额时获得100%电子科技研究加成，海军事务体系继续运作。"
 sof_region_BRD_1936_merchant_charter_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_BRD_1936_merchant_slips_desc:0 "在波尔多新建1座海军船坞及1个建筑槽，并交付30艘运输船。"
 sof_region_BRD_1936_mobile_reserve_desc:0 "机动预备队接收150辆卡车，并获得15点陆军经验。"
 sof_region_BRD_1936_poitou_contract_desc:0 "普瓦图接受运输合同后，为商定航线交付20艘运输船。"
 sof_region_BRD_1936_port_accounts_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_BRD_1936_port_guard_desc:0 "为港口卫队配发600件步兵装备，并获得15点陆军经验。"
 sof_region_BRD_1936_quay_repair_desc:0 "在完整控制的指定产业地区建成1座民用工厂，并增加1个建筑槽。"
 sof_region_BRD_1936_saso_desc:0 "波尔多航空工场增加1座军用工厂及1个建筑槽，设计团队获得15点空军经验。"
 sof_region_CFR_1936_army_tyre_desc:0 "军用轮胎合同交付150辆卡车，军用工厂产出增加10%，稳定度降低2.5%。"
 sof_region_CFR_1936_autonomy_desc:0 "本地车辆计划交付100辆卡车，并提供1次100%摩托化装备研究加成。"
 sof_region_CFR_1936_calibration_desc:0 "校准实验室整合学校应用研究项目。完成前期科研建设后，增加1个科研槽，最多达到4个。第4槽需当地工业中心至少3座民用工厂和3座军用工厂；已有4个槽位时获得1次100%电子科技研究加成。"
 sof_region_CFR_1936_dispersal_desc:0 "分散工場交付100件支援装备，并提供20点陆军经验。"
 sof_region_CFR_1936_exchange_desc:0 "里昂接受协议后，联合试验交付150辆卡车，并获得20点陆军经验及1次100%摩托化装备研究加成。"
 sof_region_CFR_1936_ledger_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_CFR_1936_mixing_desc:0 "混炼计划在克莱蒙费朗增加2座民用工厂和2个建筑槽，扩展轮胎与工业加工产能。"
 sof_region_CFR_1936_reclaim_desc:0 "回收零件保障150辆卡车交付，轮胎再生体系继续运作。"
 sof_region_CFR_1936_reserve_desc:0 "为地区预备队配发600件步兵装备，确立预备队组织制度，获得20点陆军经验及1次50%陆军学说折扣。"
 sof_region_CFR_1936_schools_desc:0 "技术学校建立常设研究团队。当地工业中心拥有至少2座民用工厂和2座军用工厂后，增加1个科研槽，最多达到3个；已有3个槽位时获得1次100%电子科技研究加成。"
 sof_region_CFR_1936_thiers_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_CFR_1936_toolroom_desc:0 "蒂耶尔工具车间交付100件支援装备，并提供1次100%步兵武器研究加成和1次50%工业科技研究加成。"
 sof_region_CFR_1936_workshops_desc:0 "伊苏瓦尔增加2座军用工厂及2个建筑槽，并向预备队交付600件步兵装备。"
 sof_region_DIJ_1936_archives_desc:0 "工业档案馆整合学校应用研究项目。完成前期科研建设后，增加1个科研槽，最多达到4个。第4槽需当地工业中心至少3座民用工厂和3座军用工厂；已有4个槽位时获得1次100%电子科技研究加成。"
 sof_region_DIJ_1936_artillery_school_desc:0 "炮兵学校提供1次100%火炮科技研究加成、25点陆军经验及1次50%陆军学说折扣。"
 sof_region_DIJ_1936_commissions_desc:0 "地方行政机构完成账目核定并争取公共支持：获得50点政治点数与3%稳定度。"
 sof_region_DIJ_1936_engineers_desc:0 "工兵接收100件支援装备，获得20点陆军经验及1次100%侦察科技研究加成。"
 sof_region_DIJ_1936_foundry_desc:0 "勒克勒佐铸造计划在欧坦增加2座军用工厂及2个建筑槽，并提供1次50%火炮科技研究加成。"
 sof_region_DIJ_1936_heavy_guns_desc:0 "重炮计划交付120门火炮，获得20点陆军经验，并建立地区火炮生产网络。"
 sof_region_DIJ_1936_network_desc:0 "第戎、索恩河畔沙隆、欧坦与北部铁路地区组成综合网络。控制四处中心时，补给消耗减少12%，计划速度增加15%。"
 sof_region_DIJ_1936_perrigny_desc:0 "佩里尼货运基地获得150辆卡车，在设施上限内增加1级基础设施，并获得1次100%火车科技研究加成。"
 sof_region_DIJ_1936_rail_units_desc:0 "铁路部队接收150辆卡车，并获得20点陆军经验及1次100%火车科技研究加成。"
 sof_region_DIJ_1936_reserve_desc:0 "地区预备队接收600件步兵装备，并获得15点陆军经验。"
 sof_region_DIJ_1936_works_school_desc:0 "工厂学校建立常设研究团队。当地工业中心拥有至少2座民用工厂和2座军用工厂后，增加1个科研槽，最多达到3个；已有3个槽位时获得1次100%电子科技研究加成。"
 sof_region_LYO_1936_alpine_desc:0 "为阿尔卑斯预备队配发600件步兵装备和100件支援装备。山地演习提供20点陆军经验与1次50%陆军学说折扣。"
 sof_region_LYO_1936_arsenal_desc:0 "兵工厂首批订单交付600件步兵装备，并提供15点陆军经验。"
 sof_region_LYO_1936_arsenal_line_desc:0 "圣艾蒂安新建两座军用工厂，交付600件步兵装备，并增加两个建筑槽，支撑兵工厂持续扩产。"
