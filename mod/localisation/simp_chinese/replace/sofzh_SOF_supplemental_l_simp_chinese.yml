l_simp_chinese:
# 法兰西之影 简体中文汉化
 SOFA_spawn_divisions.1.t:0 "步兵增援"
 SOFA_spawn_divisions.1.d:0 "征召所把最后几份名单送进营房。新兵的行囊挤在床边，老兵正在操场上教他们把散乱的脚步变成同一个节奏。军需官仍在核对装备，参谋部已经开始讨论这些部队将承担的任务。\n\n我们将从当前拥有并控制的地区中随机选择一处，组建 3 个步兵师。"
 SOFA_spawn_divisions.1.a:0 "组建 3 个步兵师"
 SOFA_spawn_divisions.2.t:0 "轻型装甲部队增援"
 SOFA_spawn_divisions.2.d:0 "试车场上传来轻型坦克的发动机声，维修人员追着车队检查漏油与履带张力。军官们看中它们的机动能力，希望这些车辆能够及时赶到需要增援的方向。新的轻型装甲部队正在等待组建命令。\n\n我们将从当前拥有并控制的地区中随机选择一处，组建 9 个轻型装甲师。"
 SOFA_spawn_divisions.2.a:0 "组建 9 个轻型装甲师"
 SOFA_spawn_divisions.3.t:0 "中型装甲部队增援"
 SOFA_spawn_divisions.3.d:0 "中型坦克的试验报告摊在参谋桌上，火力、防护与机动各自占了一栏。军官们希望把这些车辆与步兵、后勤组织在一起，使装甲力量能够承担更复杂的任务。相应的编制正在等待批准。\n\n我们将从当前拥有并控制的地区中随机选择一处，组建 3 个中型装甲师。"
 SOFA_spawn_divisions.3.a:0 "组建 3 个中型装甲师"
 SOFA_spawn_divisions.4.t:0 "重型装甲部队增援"
 SOFA_spawn_divisions.4.d:0 "重型坦克缓缓驶过试验场，履带在地面留下深深的印痕。厚重的装甲让军官们停下交谈，随行的技术人员却还在讨论检修与运输。如何把这些钢铁巨物组织成部队，已经成为参谋部的下一项工作。\n\n我们将从当前拥有并控制的地区中随机选择一处，组建 2 个重型装甲师。"
 SOFA_spawn_divisions.4.a:0 "组建 2 个重型装甲师"
 SOFA_spawn_divisions.6.t:0 "大规模装甲部队增援"
 SOFA_spawn_divisions.6.d:0 "新的扩军计划占满了会议桌，车辆、人员与维修安排被逐一列出。参谋部提出了几套规模更大的装甲方案，而军官们已经开始为相应的部队编制做准备。现在需要确定这次增援将沿着哪条路线展开。\n\n请选择一种装甲增援：18 个轻型装甲师、6 个中型装甲师，或 4 个重型装甲师。可选类型取决于已掌握的坦克技术。选定部队将在随机一处当前拥有并控制的地区组建。"
 SOFA_spawn_divisions.6.a:0 "选择 18 个轻型装甲师"
 SOFA_spawn_divisions.6.b:0 "选择 6 个中型装甲师"
 SOFA_spawn_divisions.6.c:0 "选择 4 个重型装甲师"
 SOFA_spawn_divisions.7.a:0 "接收初始增援"
 SOFA_spawn_divisions.8.a:0 "接收初始增援"
 generic.17.t:0 "指挥官患病"
 generic.17.d:0 "前线送来一份医疗报告：一位部队指挥官的身体状况已经不适合继续勉强工作。医官要求其休养，指挥部也必须在这段时间内妥善协调各项任务。大家都希望下次送来的消息，是他恢复健康的通知。\n\n一位部队指挥官患病，需要休养。预计疾病将影响其指挥能力 30 天。"
 generic.18.t:0 "指挥官受伤"
 generic.18.d:0 "消息随着一份简短的医疗报告抵达指挥部。一位部队指挥官受了伤，需要离开繁忙的指挥工作接受治疗。参谋们重新整理了尚未完成的事务，等待医官给出更明确的恢复安排。\n\n一位部队指挥官受伤，需要治疗。预计伤势将影响其指挥能力 90 天。"
 stability.3.t:0 "国内局势动荡"
 stability.3.desc:0 "低稳定度或低战争支持度可能引发逃避兵役、罢工或兵变。"
 stability.3.a:0 "处理局势"
 election.1.d:0 "本次大选没有需要政府额外处理的事项。"
 election.1.a:0 "知悉"
