 sofzh_chart_name_liberal:0 "自由共和主义"
 sofzh_chart_value_liberal:0 "[?sofzh_chart_liberal|1]%"
 sofzh_chart_liberal_tt:0 "§Y自由共和主义§!\n所属大类：共和主义\n党派支持率：§Y[?sofzh_chart_liberal|1]%§!\n\n$liberalism_desc$\n通用路线效果：\n科研速度 +5%；民用工厂建设速度 +10%；更换生产线效率保留 +10%；消费品工厂系数 −4%。\n\n红色马赛采用专属政治机制，不叠加通用路线加成。此数值来自采用本路线的党派；没有采用本路线的党派时为0%。"
 sofzh_chart_name_conservative:0 "保守共和主义"
