 sofzh_chart_summary_tt:0 "§Y政治路线与政党支持率§!\n图表使用原版四类政党的真实支持率。右侧显示各党当前代表采用的细分路线，悬停可查看路线效果。\n未采用的细分路线保留为0%，不平均分摊票数。\n◆ 表示执政路线；暂停时可手动刷新。"
