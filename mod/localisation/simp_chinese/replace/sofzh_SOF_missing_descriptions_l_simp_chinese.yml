 SOF_GENERIC_4_naval_dockyards_desc:0 "码头边的工人开始向外铺设轨道，为新的船台运来材料。扩建船坞将使我们的造船计划有更多空间。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
