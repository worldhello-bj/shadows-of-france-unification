 SOF_GENERIC_6_motorised_divisions_desc:0 "编成1支4营制部队，初始经验10%。规模服务于地方防卫与训练，后续扩军依靠人力、装备生产和实际部署。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_6_tanks_divisions_desc:0 "编成1支4营制部队，初始经验10%。规模服务于地方防卫与训练，后续扩军依靠人力、装备生产和实际部署。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_8_naval_dockyards_desc:0 "更多舰船意味着更繁忙的港口，也意味着更多需要协调的工序。我们将继续扩大造船设施，为海军工业安排新的产能。\n建设周期：49日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_air_doctrine_desc:0 "越来越多的飞机升空后，出动顺序与指挥协调变得更加重要。我们将进一步完善空军作战理论。\n建设周期：35日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_fighters_desc:0 "试验机爬升时的声响吸引了跑道边的目光。更先进的机身与发动机，将为我们的飞行员打开新的可能。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_industrial_technology_desc:0 "车间里的每次停机都会拖慢整个计划。工程师准备重新安排设备与工序，让日渐扩大的工业能够稳定运转。\n建设周期：35日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_industry_desc:0 "集中建设重工业和工业配套设施，为制造商的专业化工艺提供基础。\n建设周期：49日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_land_doctrines_desc:0 "更大的军队需要更成熟的指挥。我们将研究如何让不同部队在复杂战场上协同，把已有经验转化为新的作战理论。\n建设周期：35日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_naval_doctrine_desc:0 "舰队规模扩大以后，单舰的经验已不足以应付所有局面。海军将研究更成熟的作战理论，协调不同舰种的任务。\n建设周期：35日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_research_desc:0 "由国家科研委员会统筹高等研究与大型试验设施，成熟的工业体系可以支持第五个科研槽。\n建设周期：49日。工业规模：至少16座工厂。\n符合工厂条件时增加1个科研槽，最多5槽（马赛最多4槽）。达到槽位上限后仍可完成本国策并领取科研精神。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_small_arms_desc:0 "战斗节奏正在加快，步兵装备也必须跟上。设计人员将探索更先进的武器，准备应对下一阶段的作战需求。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_advanced_tanks_models_desc:0 "试验场上的旧车留下了深深的履带印，新的图纸已经铺满设计室。我们需要研究更先进的坦克，以应对不断变化的战场。\n建设周期：49日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_aluminium_production_desc:0 "根据核实的矿区范围改善开采、分选和供给，不再在随机土地上产生矿产。\n建设周期：35日。\n扩产仍要求控制指定矿区；各矿种拥有独立的开发路径。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_amphibious_assault_desc:0 "潮汐表与作战地图一起摊在桌上，岸线上的障碍也逐一标出。两栖装备的研究，将为跨越水面的行动提供新的工具。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_arrondissement_desc:0 "从市镇议会、税务所和公共预算开始建立行政机构。有限的领土也需要稳定的政府来支撑建设。\n建设周期：21日。\n行政精神提升至第1级：稳定度 +4%；每日政治点 +0.05；每日顺从增长 +0.002；驻军需求 -1%；驻军抵抗伤害 -1%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_artillery_development_desc:0 "炮兵军官把射表带进会议室，工厂代表把磨损的零件摆在桌上。新式火炮的研发，将从这些共同的问题开始。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_air_doctrine_desc:0 "飞得起来之后，我们还得回答在哪里巡逻、何时拦截、如何返回。空军需要自己的作战理论与指挥办法。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_fighters_desc:0 "机场边的工棚还很简陋，飞行员却已经开始记录每一次试飞。战斗机研发将为我们的空中力量打下基础。\n建设周期：21日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_industrial_technology_desc:0 "一件零件要在几名师傅手中反复修磨，才能装上机器。新的生产技术将让工人把更多时间用于制造，减少返工与等待。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_industry_desc:0 "在地方工业区配置基础军工与民用生产线，形成第一批可持续运作的工厂。\n建设周期：21日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_infrastructure_desc:0 "先修通干道和工业区周边设施，恢复人员、建材与货物的运输能力。\n建设周期：21日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_land_doctrine_desc:0 "参谋们第一次把不同部队的经验汇总到同一册笔记里。统一的作战理论，将帮助指挥官理解彼此的任务。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_naval_doctrine_desc:0 "海图上画满了航线，值班军官还在统一信号的用法。海军需要一套共同的作战理论来组织舰船行动。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_research_desc:0 "以地方研究院整合技术人员和试验设施，依托已有工业支持第三个科研槽。\n建设周期：21日。工业规模：至少4座工厂。\n符合工厂条件时增加1个科研槽，最多3槽（马赛最多4槽）。达到槽位上限后仍可完成本国策并领取科研精神。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_basic_small_arms_desc:0 "以可靠枪械和定期维护支持士兵作战。军械师将从最常见的问题入手，改善步兵每天都要依赖的武器。\n建设周期：21日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_battle_for_alsace_desc:0 "把阿尔萨斯的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
