 SOF_GENERIC_2_naval_dockyards_desc:0 "港边的空地上立起了新的测量桩，船匠开始讨论船台的位置。建立自己的造船设施，是发展海军必须迈出的第一步。"
 SOF_GENERIC_3_infantry_divisions_desc:0 "编成1支6营制部队，初始经验10%。规模服务于地方防卫与训练，后续扩军依靠人力、装备生产和实际部署。"
 SOF_GENERIC_3_tank_divisions_desc:0 "编成1支4营制部队，初始经验10%。规模服务于地方防卫与训练，后续扩军依靠人力、装备生产和实际部署。"
 SOF_GENERIC_4_naval_dockyards_desc:0 "码头边的工人开始向外铺设轨道，为新的船台运来材料。扩建船坞将使我们的造船计划有更多空间。"
