 SOF_GENERIC_battle_for_midi_pyrenees_desc:0 "把南部-比利牛斯的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battle_for_nord_pas_de_calais_desc:0 "把北部-加莱海峡的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
