# 法兰西之影 简体中文汉化
 SOF_GENERIC_1000_fighters_desc:0 "交付48件标题所示装备，用作试编部队的小规模补充；后续需求依靠本地生产。DLC机体与传统机型分支只执行一套奖励。"
