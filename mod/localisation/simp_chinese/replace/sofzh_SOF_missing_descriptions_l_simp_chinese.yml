 SOF_GENERIC_battle_for_paca_desc:0 "把普罗旺斯-阿尔卑斯-蓝色海岸的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battle_for_pays_de_la_loire_desc:0 "把卢瓦尔河地区的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battle_for_picardie_desc:0 "把皮卡第的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battle_for_poitou_charrentes_desc:0 "把普瓦图-夏朗德的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battle_for_rhone_alpes_desc:0 "把罗讷-阿尔卑斯的战役纳入共同的统一计划。边境政权的处境与外交关系决定具体的作战对象。"
 SOF_GENERIC_battleship_dev_desc:0 "大型舰船的图纸占满整张长桌，每一处修改都牵动装甲、火炮与动力。我们将推进战列舰及战列巡洋舰的研发。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_carrier_dev_desc:0 "把飞机送到岸上机场之外，需要一座能够航行的起降平台。航空母舰的研发将探索舰队与航空兵协同的新办法。\n建设周期：35日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_civilian_industry_desc:0 "完善建材、加工与民用制造，缩短新项目的建设时间并释放可用产能。\n建设周期：49日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_combined_arms_tactics_desc:0 "前沿观察哨报来履带声，步兵连将以近距离反装甲能力守住阵地。完善反装甲装备与协同，才能及时应对这样的威胁。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_contruction_technology_desc:0 "工程师反复修改图纸，只为让桥梁更牢、厂房更快落成。施工队的经验值得整理成统一的方法，传到下一处工地。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_department_desc:0 "把相邻地区的税务、治安和档案接入省级网络，让扩张后的政府能够实际运作。\n建设周期：21日。\n行政精神提升至第2级：稳定度 +6%；每日政治点 +0.08；每日顺从增长 +0.004；驻军需求 -2%；驻军抵抗伤害 -2%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_destroyer_dev_desc:0 "护航任务需要一艘能够及时转向、追赶目标的舰船。驱逐舰设计人员将把这些要求带入新的方案。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_extend_recruitment_laws_desc:0 "征召所仍按旧条例办事，政府面对的局势却已经改变。我们将着手讨论新的征兵政策，为后续的人力动员作准备。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_air_doctrine_desc:0 "飞行日志里记下了错过的会合与迟到的命令。改进空军作战理论，将让下一次出动更加有序。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_fighters_desc:0 "机务人员与飞行员对旧机型的意见已经汇成厚厚一册。新的战斗机设计将回应这些在试飞与使用中发现的问题。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_industry_desc:0 "扩建已有工厂、培训技术工人，使地方制造商具备稳定承接订单的条件。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_infrastructure_desc:0 "建设全天候道路和承重桥梁，提高运输能力。我们将把最初修通的路线建设成可靠的运输网络。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_land_doctrines_desc:0 "演习结束后，军官们仍围着地图争论得失。我们将把讨论中的教训整理出来，继续改进陆军的作战方法。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_naval_doctrine_desc:0 "演习中发现的问题随着舰船一同返港。我们将改进海军的协同与指挥，使下一次行动有更充分的准备。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_research_desc:0 "联合大学与工业实验室，在足够的工业规模上支持第四个科研槽。\n建设周期：35日。工业规模：至少8座工厂。\n符合工厂条件时增加1个科研槽，最多4槽（马赛最多4槽）。达到槽位上限后仍可完成本国策并领取科研精神。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_improved_small_arms_desc:0 "训练场上的记录揭示了旧式武器的不足。新的试制与改良，将让步兵在战斗中拥有更可靠的选择。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_infiltration_tactics_desc:0 "小队在夜色中越过警戒线，能依靠的只有背包里的补给和事先约定的信号。我们必须教会他们在孤立的环境中坚持作战。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_mass_conscription_desc:0 "更多家庭即将收到征召通知，田间与车间也要重新分配人手。扩大兵员来源，是一项牵动整个社会的决定。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_mechanisation_desc:0 "道路尽头的碎石与弹坑提醒我们，普通卡车有自己的极限。机械化装备的研发将为步兵争取更好的机动与防护。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_military_industrial_complex_desc:0 "把军工、民用配套与全国采购接入共同体系，支持制造商最高层工艺的实际应用。\n建设周期：70日。工业规模：至少18座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_military_industry_desc:0 "扩充兵工生产线与军需管理，增加军用产能，同时为部队提供生产与装备经验。\n建设周期：49日。工业规模：至少12座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_military_training_desc:0 "会持枪的人未必懂得在炮火下协同行动。训练体系需要把新兵送进营地，也要让他们带着足够的准备走向前线。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_motorisation_desc:0 "徒步纵队还在路上，前方的局势已经发生变化。让部队乘上卡车，我们才能更快地把人手送往需要他们的地方。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_motorised_support_companies_desc:0 "伤员、补给车与通信线必须跟得上移动中的部队。我们将完善这些支援力量，减少前线与后方之间的脱节。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_nation_desc:0 "将全国税籍、财政与行政职责纳入共同制度，为长期统一提供持续的治理能力。\n建设周期：70日。\n行政精神提升至第6级：稳定度 +15%；每日政治点 +0.2；每日顺从增长 +0.012；驻军需求 -6%；驻军抵抗伤害 -6%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_nuclear_weapons_desc:0 "建立核研究专项，集中研究人员与大型试验设施；核物理研究可以独立于火箭计划推进。\n建设周期：70日。工业规模：至少24座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_officers_academy_desc:0 "一张错误的命令足以让整支部队付出代价。我们将设立军官教育体系，把地图、参谋工作与实地演练放在同一间课堂里。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_oil_production_desc:0 "根据核实的矿区范围改善开采、分选和供给，不再在随机土地上产生矿产。\n建设周期：35日。\n扩产仍要求控制指定矿区；各矿种拥有独立的开发路径。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_propaganda_campaigns_desc:0 "战况传言常常比正式公报走得更快。报纸、广播和街头集会将向民众说明政府的目标，争取他们继续支持战争。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_province_desc:0 "统一跨省财政和户籍标准，让物资与人员调拨不再被地方边界阻断。\n建设周期：35日。\n行政精神提升至第3级：稳定度 +8%；每日政治点 +0.11；每日顺从增长 +0.006；驻军需求 -3%；驻军抵抗伤害 -3%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_region_desc:0 "由大区协调委员会统筹财政与建设，把多个地方政府连接成有效的区域政权。\n建设周期：35日。\n行政精神提升至第4级：稳定度 +10%；每日政治点 +0.14；每日顺从增长 +0.008；驻军需求 -4%；驻军抵抗伤害 -4%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_ressource_extraction_desc:0 "勘探队带回了一袋矿样，矿工们则带来了更实际的建议。改善开采与运输的方法，才能把地下的资源稳妥地送进车间。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_rocketry_desc:0 "试验场上的倒计时刚结束，众人便抬头追踪那道迅速升起的尾迹。火箭与喷气技术的研究，将把我们带向仍有许多未知的领域。\n建设周期：35日。工业规模：至少16座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_special_forces_desc:0 "有些任务发生在道路终止的地方，有些则始于黑暗中的一段攀爬。军队需要专门训练的人手去承担这些任务。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_special_forces_division_desc:0 "海岸、山路与空降场各有不同的考验。专门的装备和训练，需要在部队受命出发之前就准备好。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_state_desc:0 "建立统一的邦国机关和预算制度，使军队、工业与地方事务有稳定的行政支撑。\n建设周期：49日。\n行政精神提升至第5级：稳定度 +12%；每日政治点 +0.17；每日顺从增长 +0.01；驻军需求 -5%；驻军抵抗伤害 -5%。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_steel_production_desc:0 "根据核实的矿区范围改善开采、分选和供给，不再在随机土地上产生矿产。\n建设周期：35日。\n扩产仍要求控制指定矿区；各矿种拥有独立的开发路径。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_submarines_dev_desc:0 "艇员在狭窄舱室里检查阀门，岸上的设计人员则计算潜航性能。潜艇研发将为海军提供另一种行动方式。\n建设周期：35日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_support_companies_desc:0 "工兵检查桥面，侦察兵探明道路，维修人员守着工具箱。支援部队的工作往往不显眼，却决定主力能否顺利行动。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_support_planes_desc:0 "前线的目标标在地图上，飞行员开始研究航线与载荷。轰炸机的研发将拓宽空军能够承担的任务。\n建设周期：35日。工业规模：至少4座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_synthethic_rubber_production_desc:0 "投资合成材料和化工设备，让缺少天然矿区的地区也能发展橡胶工业。\n建设周期：35日。\n合成工业独立于指定天然矿区，不要求先占领油田或钨矿。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_tank_development_desc:0 "履带车的试验声引来了整座营地的围观。装甲部队的未来要从底盘、车辆与支援装备的扎实研究开始。\n建设周期：35日。工业规模：至少8座工厂。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_tungsten_production_desc:0 "根据核实的矿区范围改善开采、分选和供给，不再在随机土地上产生矿产。\n建设周期：35日。\n扩产仍要求控制指定矿区；各矿种拥有独立的开发路径。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
