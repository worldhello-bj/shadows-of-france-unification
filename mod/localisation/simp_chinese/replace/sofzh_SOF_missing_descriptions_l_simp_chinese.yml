 SOF_GENERIC_250_naval_bombers_desc:0 "组建小规模海岸鱼雷航空队，用16架原型机积累反舰巡逻和海军协同经验。\n建设周期：35日。\n接收16架海军鱼雷机；BBA机身与传统飞机分别发放对应装备。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
 SOF_GENERIC_2_naval_dockyards_desc:0 "港边的空地上立起了新的测量桩，船匠开始讨论船台的位置。建立自己的造船设施，是发展海军必须迈出的第一步。\n建设周期：21日。\n同类永久精神只保留最高阶段；完成后的实际奖励以国策效果提示为准。"
