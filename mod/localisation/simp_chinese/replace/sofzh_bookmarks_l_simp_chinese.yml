l_simp_chinese:
# 法兰西之影 简体中文汉化
 BLITZKRIEG_DESC:0 "市政厅的地图换成了更大的比例尺。首府要面对整片大区的征召、生产与边界，而邻近的旗帜同样在向外寻找道路。这一次，你掌握的起点更加宽广，随之而来的责任也更加沉重。\n\n《法兰西之影：街机版》将以 21 个大区展开游戏（原来的 22 个大区，合并上下诺曼底）。你将扮演大区首府，例如鲁昂、雷恩、巴黎等。"
 BLITZKRIEG_NAME:0 "大区开局"
 BM_HISTORY_TITLE:0 "历史简介"
 FRA_BLITZKRIEG_DESC:0 "车站的行李堆得越来越高，边境的来电也越来越急。参谋部再次摊开熟悉的地图，民众则从报纸的字里行间寻找安定的消息。下一次动员的钟声，似乎已经近在耳边。\n\n第一次世界大战的记忆尚未消退，德国却已表明无意维持和平，法国因此面临一场新的冲突。加强边境防御，谨慎选择盟友，或许才能避免灾难性的战争。\n\n法国曾经赢得胜利，这一次也必将如此！"
 FRA_GATHERING_STORM_DESC:0 "战争纪念碑前的花束仍未褪色，新的公报却已经贴上街角。人们一边修补昨日留下的伤痕，一边打听明日的局势。政府必须在不安之中回答一个问题：我们还能准备多少时间？\n\n尽管第一次世界大战带来了严重破坏，法国仍凭借强大的经济逐步走向复苏。然而，大萧条依然波及这个国家，而德国的新政权无意支付《凡尔赛条约》规定的战争赔款。\n\n条约签署时，一位法国元帅曾说过：这不是和平，而是二十年的休战。如今，这二十年即将结束。"
 GATHERING_STORM_DESC:0 "地图铺开时，昔日熟悉的地名已经成了彼此对峙的旗帜。车站在查验通行证，市政厅在清点税册，邻城的消息则由疲惫的信使送来。你将从一处小小的辖区出发，决定它能否在这片分裂的土地上站稳脚跟。\n\n《法兰西之影：街机版》将以法国全部 328 个区展开游戏。"
 GATHERING_STORM_NAME:0 "区级开局"
 HITTING_FAN_DESC:0 "雨还没落下来，市政厅已经开始检查屋顶。报纸上说风暴将至，隔壁的军官则说最好把行李提前收拾好。至于门后的那排雨伞，至少有人终于想起了它们。\n\n没错！你收藏的那些雨伞，很快就能派上用场了。"
 HITTING_FAN_NAME:0 "风暴将至"
