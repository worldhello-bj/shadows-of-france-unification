 sofzh_setup_category:0 "开局版图设置"
 sofzh_random50:0 "随机整合法国地区：50个现存国家"
 sofzh_random50_desc:0 "仅开局1936年1月8日前可执行一次，随机吸收相邻法国地区，直至全地图剩余50个现存国家。保留玩家、巴黎、科西嘉和邻国；接收国保留首都与国策树，原部队解散。取消不消耗次数；零次合并失败可重试。大区剧本已少于50国，无需执行。"
 sofzh_random50_tt:0 "随机整合相邻法国地区，目标为全地图50个现存国家。此操作本局仅执行一次。"
 sofzh_merge_confirm_t:0 "让零散政权组成新的版图"
 sofzh_merge_confirm_d:0 "随机合并相邻法国地区，目标为全地图50个现存国家（包括邻国）。保留玩家、巴黎、科西嘉和邻国；吸收州成为核心，人口、资源和建筑保留，原部队不转移。\n仅开局1936年1月8日前可用。点击“开始随机整合”立即执行；“保留原版图”取消，随后仍可在决议的“开局版图设置”中执行。"
 sofzh_merge_confirm_yes:0 "开始随机整合"
 sofzh_merge_confirm_no:0 "保留原版图"
 sofzh_merge_done_t:0 "地区整合完成"
 sofzh_merge_done_d:0 "已执行[Root.sofzh_merge_count|0]次相邻整合，全地图现存国家为[Root.sofzh_merge_remaining|0]个。各接收国维持原首都和国策树，新接收地区作为核心。"
 sofzh_merge_partial_t:0 "地区整合未达到50国"
 sofzh_merge_partial_d:0 "实际完成[Root.sofzh_merge_count|0]次相邻吞并，全地图剩余[Root.sofzh_merge_remaining|0]个现存国家。若合并次数为0，本次不消耗使用次数，可在开局窗口内重试。若已经发生合并，本局不能再次执行。\n没有合法相邻组合或达到安全循环上限时停止；不会吞并玩家、巴黎、科西嘉及邻国。"
 sofzh_merge_ok:0 "查看新局势"
