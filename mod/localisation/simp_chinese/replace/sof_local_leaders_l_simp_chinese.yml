l_simp_chinese:
 sof_local_PRS_name:0 "让·基亚普"
 sof_local_PRS_desc:0 "让·基亚普（1878—1940）曾任巴黎警察总监，1935年当选巴黎市议会主席。1936年1月，他仍处于首都市政权力的中心。在法国分裂的架空背景下，由这位熟悉首都行政与警务的人物主持巴黎政府。"
 sof_local_BRE_name:0 "维克托·勒戈尔热"
 sof_local_BRE_desc:0 "维克托·皮埃尔·勒戈尔热（1881—1963）是医生和地方政治家，自1929年担任布雷斯特市长。其地方任职经历使他适合在法国分裂的架空背景下，领导这座布列塔尼港口城市。"
 sof_local_LYO_name:0 "爱德华·赫里欧"
 sof_local_LYO_desc:0 "爱德华·赫里欧（1872—1957）是里昂长期市长，也是曾经的法国政府首脑。到1936年，他已积累数十年的市政经验和全国政治声望。在法国分裂的架空背景下，他主持里昂的地区政府。"
 sof_local_STR_name:0 "夏尔·弗雷"
 sof_local_STR_desc:0 "夏尔·弗雷（1888—1955）是一位记者和地方政治家，1935年当选斯特拉斯堡市长。作为当时的在任市长，他在法国分裂的架空背景下主持这座阿尔萨斯城市的地区政府。"
 sof_local_REN_name:0 "弗朗索瓦·沙托"
 sof_local_REN_desc:0 "弗朗索瓦·沙托（1886—1965）从事建筑和公共工程，1935年接任雷恩市长。其地方实业与市政经历是本次选择的依据。模组沿用雷恩原有的阵营玩法；这不将游戏政体作为他现实政治立场的判断。"
 sof_local_ROU_name:0 "乔治·梅泰耶"
 sof_local_ROU_desc:0 "乔治·梅泰耶（1869—1945）是鲁昂的律师、议员和地方政治家，1935年再次成为市长。1936年1月，他适合凭借既有市政经验主持法国分裂背景下的鲁昂政府。"
 sof_local_LIL_name:0 "罗杰·萨朗格罗"
 sof_local_LIL_desc:0 "罗杰·萨朗格罗（1890—1936）自1925年担任里尔市长。1936年1月仍在世并任职，是熟悉当地工业城市与工人社会的政治人物。模组的法国分裂设定让他继续领导里尔，后续命运随架空战争发展。"
 sof_local_CLV_name:0 "阿道夫·朗德里"
 sof_local_CLV_desc:0 "阿道夫·朗德里（1874—1956）是人口学家、经济学家和长期服务科西嘉的政治家，并担任卡尔维市长。虽然出生于阿雅克肖，他与卡尔维的市政联系优先于出生地，适合主持架空的卡尔维政府。"
 sof_local_COR_name:0 "保罗·贾科比"
 sof_local_COR_desc:0 "保罗·贾科比（1896—1951）出生于韦纳科，1922年当选该镇市长，1925年成为韦扎尼地方议员。韦纳科位于本模组的科尔特地区。1936年尚未成为参议员的他，以已有的地方经验主持架空地区政府。"
 sof_local_ANG_name:0 "维克托·贝尔尼耶"
 sof_local_ANG_desc:0 "维克托·贝尔尼耶（1868—1952）是昂热的地方政治家，1935年起担任市长。1936年1月，他已是有经验的地方人物，在模组法国分裂的架空背景下主持昂热政府。"
 sof_local_NAN_name:0 "奥古斯特·帕若"
 sof_local_NAN_desc:0 "奥古斯特·帕若（1884—1962）是南特的社会主义政治家，1935年当选市长。在法国分裂的架空背景下，他凭借已有的市政和地方政治经历主持南特政府。"
 sof_local_MET_name:0 "加布里埃尔·奥卡尔"
 sof_local_MET_desc:0 "加布里埃尔·奥卡尔（1892—1974）在1935年当选梅斯市长。1936年1月，他尚未满44岁。本模组以这位在任市长的地方行政经历为依据，让他主持架空的梅斯政府。"
 sof_local_NTR_name:0 "雷蒙·巴尔贝"
 sof_local_NTR_desc:0 "雷蒙·巴尔贝（1902—1978）是工人出身的共产党地方政治家，1935年成为楠泰尔市长。1936年1月仅33岁的他已担任公职，适合在模组的架空分裂背景下领导当地政府。"
 sof_local_NIC_name:0 "让·梅德桑"
 sof_local_NIC_desc:0 "让·梅德桑（1890—1965）自1928年担任尼斯市长，是当地具有影响的政治人物。本模组以其长期市政联系选任尼斯领袖；游戏沿用的阵营配置不代表将其现实政治立场判为纳粹主义。"
 sof_local_ABU_name:0 "卡米耶·贝纳西"
 sof_local_ABU_desc:0 "卡米耶·贝纳西（1887—1958）是克勒兹地区的社会主义政治家，具有地方议员和奥比松市政经历。1936年以前的地方任职联系是本次选择的依据；在法国分裂的架空背景下，他主持奥比松政府。"
 sof_local_TRS_name:0 "费迪南·莫兰"
 sof_local_TRS_desc:0 "费迪南·莫兰（1876—1957）自1925年担任图尔市长，也曾代表安德尔-卢瓦尔地区参加全国政治。在法国分裂的架空背景下，由这位已有十年市政经验的地方人物主持图尔政府。"
 sof_local_BRD_name:0 "阿德里安·马尔凯"
 sof_local_BRD_desc:0 "阿德里安·马尔凯（1884—1955）自1925年担任波尔多市长。到1936年，他已在当地城市政治中形成影响。本模组以当时的地方任职为依据，安排他主持架空的波尔多政府。"
 sof_local_TOU_name:0 "安托万·埃伦-普雷沃"
 sof_local_TOU_desc:0 "安托万·埃伦-普雷沃（1877—1952）是图卢兹的社会主义政治家，1935年当选市长。1936年1月，他仍在任职，在法国分裂的架空背景下继续主持图卢兹地方政府。"
 sof_local_MRS_name:0 "亨利·塔索"
 sof_local_MRS_desc:0 "亨利·塔索（1882—1944）是马赛的社会主义政治家，1935年成为市长。作为1936年1月在任的地方人物，他在模组法国分裂的架空背景下主持马赛政府。"
 sof_local_SAU_name:0 "罗贝尔·阿米"
 sof_local_SAU_desc:0 "罗贝尔·阿米（1877—1945）自1925年担任索米尔市长。此人为市政人物，并非1904年出生的同名考古学家。在模组法国分裂的架空背景下，他凭借当地行政经验主持索米尔政府。"
 sof_local_ABB_name:0 "保罗·德利克"
 sof_local_ABB_desc:0 "保罗·德利克（1885—1951）是阿布维尔的地方政治人物，1925年起担任市长。本模组保留这位1936年1月仍在任的地方领袖，并以法国分裂的架空设定延续其地方政府。"
 sof_local_DRE_name:0 "莫里斯·维奥莱特"
 sof_local_DRE_desc:0 "莫里斯·维奥莱特（1870—1960）自1908年担任德勒市长，拥有长期地方行政及议会经验。在模组法国分裂的架空背景下，他依托市政网络主持德勒政府。"
 sof_local_REI_name:0 "保罗·马尔尚多"
 sof_local_REI_desc:0 "保罗·马尔尚多（1882—1968）自1925年担任兰斯市长，经历了城市战后重建与市政整顿。在模组法国分裂的架空背景下，他以本地行政经验主持兰斯政府。"
 sof_local_MUL_name:0 "奥古斯特·维基"
 sof_local_MUL_desc:0 "奥古斯特·维基（1873—1947）是米卢斯工人运动出身的市政人物，自1925年担任市长，并推动社会住宅建设。在模组法国分裂的架空背景下，他凭借工会与市政基础主持米卢斯政府。"
 sof_local_LRO_name:0 "莱昂斯·维尔热"
 sof_local_LRO_desc:0 "莱昂斯·维尔热（1865—1944）是拉罗谢尔的航运企业家与退役军人，自1930年担任市长，1935年获得连任。在模组法国分裂的架空背景下，他联合港口商界与地方行政力量主持拉罗谢尔政府。"
 sof_local_TRO_name:0 "勒内·普拉尔"
 sof_local_TRO_desc:0 "勒内·普拉尔（1888—1946）是特鲁瓦的地方政治人物，自1935年担任市长，也曾长期参与地方报刊工作。在模组法国分裂的架空背景下，他以新任市政班底主持特鲁瓦政府。"
 sof_local_DIJ_name:0 "加斯东·热拉尔"
 sof_local_DIJ_desc:0 "加斯东·热拉尔（1878—1969）出生于第戎，曾于1919年至1935年担任市长，推动城市更新及地方经济活动。在模组法国分裂的架空背景下，这位仍活跃的前市长凭借既有市政网络主持第戎政府。"
 sof_local_GRN_name:0 "皮埃尔·科特"
 sof_local_GRN_desc:0 "皮埃尔·科特（1895—1977）出生于格勒诺布尔，自1928年代表萨瓦省担任国民议会议员，曾任航空部长。在法国分裂的架空背景下，他凭借故乡联系和议政经验成为格勒诺布尔的地方领袖。"
 sof_local_NNC_name:0 "路易·马兰"
 sof_local_NNC_desc:0 "路易·马兰（1871—1960）出生于南锡附近的福尔克斯，曾在南锡求学，自1905年长期代表默尔特-摩泽尔省参与议会事务。在模组法国分裂的架空背景下，他以地方名望与中央行政经验主持南锡政府。"
 sof_local_MOP_name:0 "皮埃尔·维亚拉"
 sof_local_MOP_desc:0 "皮埃尔·维亚拉（1859—1936）来自蒙彼利埃附近的拉韦吕讷，曾在当地农业学校任教，是葡萄栽培研究专家，也曾代表埃罗省担任国民议会议员。在法国分裂的架空背景下，他凭借农业与学术声望主持蒙彼利埃政府。"
 sof_local_TLN_name:0 "米歇尔·祖尼诺"
 sof_local_TLN_desc:0 "米歇尔·祖尼诺（1889—1958）出生于土伦，是一战退役炮兵军官，自1931年担任邻近拉加尔德的市长，1934年当选土伦地区省议员。在模组法国分裂的架空背景下，他凭借军旅经历与地方组织主持土伦政府。"
 sof_local_HAV_name:0 "莱昂·梅耶"
 sof_local_HAV_desc:0 "莱昂·梅耶（1868—1948）出生于勒阿弗尔，自1919年担任市长，长期参与港口城市的经济与民生事务。在模组法国分裂的架空背景下，他以本地行政和航运领域经验主持勒阿弗尔政府。"
 sof_local_BES_name:0 "朱尔·让纳内"
 sof_local_BES_desc:0 "朱尔·让纳内（1864—1957）出生于贝桑松，长期从事法律与议会事务，自1932年担任参议院议长。在模组法国分裂的架空背景下，他凭借出生地联系及政治声望主持贝桑松政府。"
 sof_local_BST_name:0 "弗朗索瓦·皮埃特里"
 sof_local_BST_desc:0 "生于巴斯蒂亚的弗朗索瓦·皮埃特里，凭借财政官僚经历与科西嘉议员资历，在岛内政治中占有重要位置。至1936年，他已主持海军部门两年。在法国分裂的架空局势下，这位熟悉财政与海上事务的地方名人承担巴斯蒂亚的领导职责。"
 sof_local_SRT_name:0 "让·莱奥内蒂"
 sof_local_SRT_desc:0 "让·莱奥内蒂出生于萨尔泰讷地区的普罗普里亚诺，曾在摩洛哥从事美术与教育行政工作，并参与组织社会党和公务员工会。至1936年，他已有十余年的政治组织经验。在法国分裂的架空局势中，这位出身岛南的行政与工会活动家回到故乡，承担地方领导职责。"
 sof_local_ITA_name:0 "贝尼托·墨索里尼"
 sof_local_ITA_desc:0 "贝尼托·墨索里尼出身记者和政治活动家，1922年开始领导意大利政府，并建立法西斯独裁统治。到1936年初，他已长期控制国内政治；欧洲局势的变动使外交与军事准备成为意大利政府的主要事务。"
 sof_local_AUS_name:0 "库尔特·舒施尼格"
 sof_local_AUS_desc:0 "舒施尼格是一名律师，1934年7月起担任奥地利总理。他接手的是政治对立尖锐、面临外部压力的奥地利政府。在1936年初的架空局势中，他仍以维系国家独立和行政秩序为职责。"
 sof_local_LUX_name:0 "约瑟夫·贝希"
 sof_local_LUX_desc:0 "贝希是一名律师和卢森堡政治家，1926年起担任政府首脑。在1936年初，他已积累多年政府与外交经验，必须为夹在大国之间的小国维护贸易、财政和外交余地。"
 sof_local_SWI_name:0 "阿尔贝特·迈耶"
 sof_local_SWI_desc:0 "阿尔贝特·迈耶来自苏黎世地区，1929年进入联邦委员会，1934年起主持财政部门，并担任1936年度联邦主席。作为合议政府的一员，他必须在周边局势动荡之际维系财政稳定与国家中立。"
 sof_local_BEL_name:0 "利奥波德三世"
 sof_local_BEL_desc:0 "利奥波德三世在1934年继承父亲阿尔贝一世的王位，此前曾接受军事教育并在军队服役。到1936年初，他是比利时在位国王，与议会和政府共同面对王国的国防与外交难题。"
 sof_local_ENG_name:0 "斯坦利·鲍德温"
 sof_local_ENG_desc:0 "鲍德温是英国保守党政治家，1935年再次出任首相，领导国民政府。他拥有工业经营和多次执政经验，在1936年初面临经济恢复、国防建设与欧洲局势恶化的压力。"
 sof_local_HOL_name:0 "亨德里克·科莱恩"
 sof_local_HOL_desc:0 "科莱恩曾任军人、商人和财政大臣，1933年再次担任荷兰政府首脑。他领导反革命党，主张财政紧缩和维持货币稳定。在1936年初，经济危机与国内政治分歧仍是政府的主要难题。"
 sof_local_SPR_name:0 "尼塞托·阿尔卡拉-萨莫拉"
 sof_local_SPR_desc:0 "尼塞托·阿尔卡拉-萨莫拉是一名律师和政治家，1931年当选西班牙第二共和国总统。1936年1月，他仍担任国家元首，面对日益尖锐的党派对立和议会争执。"
 sof_local_AND_name:0 "胡斯蒂·吉塔尔特"
 sof_local_AND_desc:0 "胡斯蒂·吉塔尔特自1920年起担任乌赫尔主教，是安道尔共治亲王之一。他在1920年代多次参与安道尔宗教与公共事务，与法国方面的另一位共治亲王共同延续这个山间小国的治理传统。"
