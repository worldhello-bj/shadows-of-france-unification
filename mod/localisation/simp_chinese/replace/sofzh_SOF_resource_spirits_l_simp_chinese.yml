 sofzh_legacy_lorraine_iron:0 "洛林钢铁之心"
 sofzh_legacy_lorraine_iron_desc:0 "矿井、炼钢车间和熟练工人的经验构成了洛林的工业底座。掌握这片矿冶带，就掌握了制造业的一处重要支点。\n\n§Y矿区：布里埃与蒂永维尔东区（阿扬日矿址）。§!控制所列矿区中的任意一处。控制全部矿区并完成末阶段工程后升级；失去全部有效矿区后撤销，重新占领时恢复。同一矿区分支只保留一个等级，不会叠加。\n2.6新增：初始生产效率 +10%；坦克生产成本 -10%。"
