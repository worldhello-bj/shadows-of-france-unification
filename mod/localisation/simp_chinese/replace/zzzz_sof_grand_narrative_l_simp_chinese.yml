 SOF_NR_TOU_integration_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_TOU_unitary:0 "统一共和国的中央宪制"
 SOF_NR_TOU_unitary_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_TOU_federal:0 "共同国家的联邦宪制"
 SOF_NR_TOU_federal_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_TOU_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_TOU_proclamation_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_TOU_settlement:0 "开启法国的国家重建"
 SOF_NR_TOU_settlement_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_TOU_strategy:0 "以航空力量重塑法国"
 SOF_GN_TOU_strategy_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TOU_production:0 "国家航空工业总计划"
 SOF_GN_TOU_production_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TOU_operations:0 "西南空地联合军"
 SOF_GN_TOU_operations_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TOU_campaign:0 "从西南走向全国胜利"
 SOF_GN_TOU_campaign_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。"
 SOF_GN_TOU_legacy:0 "新法国的航空工业体系"
 SOF_GN_TOU_legacy_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_TOU_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_TOU_tt:0 "陆军经验+20，空军经验+25，一次75%轻型飞机研究加成。"
