 SOF609_NAN_diplomatic_ratification_desc:0 "《以大西洋海权统一法国》 · 全国统一战线\n\n卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF_NR_NAN_mandate:0 "卢瓦尔河地区的全国统一使命"
 SOF_NR_NAN_mandate_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_NAN_integration:0 "召开法兰西全国会议"
 SOF_NR_NAN_integration_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_NAN_unitary:0 "统一共和国的中央宪制"
 SOF_NR_NAN_unitary_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_NAN_federal:0 "共同国家的联邦宪制"
 SOF_NR_NAN_federal_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_NAN_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_NAN_proclamation_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_NAN_settlement:0 "开启法国的国家重建"
 SOF_NR_NAN_settlement_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_NAN_strategy:0 "以大西洋海权统一法国"
 SOF_GN_NAN_strategy_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_NAN_production:0 "国家造舰与海运工业"
 SOF_GN_NAN_production_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_NAN_operations:0 "大西洋联合海军"
 SOF_GN_NAN_operations_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_NAN_campaign:0 "从海权走向法兰西统一"
 SOF_GN_NAN_campaign_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。"
 SOF_GN_NAN_legacy:0 "新法国的远洋力量"
 SOF_GN_NAN_legacy_desc:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_NAN_tt:0 "在本区自有、核心且完整控制的地区分期建设：1座民用工厂、1座军用工厂、2座海军船坞。船坞仅落在真实沿海地区。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_NAN_tt:0 "陆军经验+20，海军经验+25，运输船+30。"
