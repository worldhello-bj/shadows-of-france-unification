 SOF609_CFR_diplomatic_ratification_desc:0 "《从中央高原重建法国》 · 全国统一战线\n\n中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF_NR_CFR_mandate:0 "奥弗涅的全国统一使命"
 SOF_NR_CFR_mandate_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_CFR_integration:0 "召开法兰西全国会议"
 SOF_NR_CFR_integration_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_CFR_unitary:0 "统一共和国的中央宪制"
 SOF_NR_CFR_unitary_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_CFR_federal:0 "共同国家的联邦宪制"
 SOF_NR_CFR_federal_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_CFR_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_CFR_proclamation_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_CFR_settlement:0 "开启法国的国家重建"
 SOF_NR_CFR_settlement_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_CFR_strategy:0 "从中央高原重建法国"
 SOF_GN_CFR_strategy_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_CFR_production:0 "战略纵深与战时工业"
 SOF_GN_CFR_production_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_CFR_operations:0 "中央高原预备集团军"
 SOF_GN_CFR_operations_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_CFR_campaign:0 "由纵深走向全国胜利"
 SOF_GN_CFR_campaign_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_CFR_legacy:0 "国家战略后方"
 SOF_GN_CFR_legacy_desc:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_CFR_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
