 SOF_GN_REN_operations_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_REN_campaign:0 "共同体缔造法兰西"
 SOF_GN_REN_campaign_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_REN_legacy:0 "统一国家的自治与海权"
 SOF_GN_REN_legacy_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_REN_tt:0 "在本区自有、核心且完整控制的地区分期建设：1座民用工厂、1座军用工厂、2座海军船坞。船坞仅落在真实沿海地区。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_REN_tt:0 "陆军经验+20，海军经验+25，运输船+30。"
 SOF_LIL36_perpetual_neutrality_desc:0 "《以北方工业重铸法国》 · 国家使命与建国方案\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SOF_LIL36_independent_neutral_and_loyal_desc:0 "《以北方工业重铸法国》 · 国家使命与建国方案\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
