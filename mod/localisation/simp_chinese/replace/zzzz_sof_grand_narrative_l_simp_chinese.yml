 sof_ne_STR_register_desc:0 "《以共同国家契约统一法国》 · 国家使命与建国方案\n\n阿尔萨斯的经验能够回答统一国家的核心问题：如何在共同权威之下保有地区制度与语言。莱茵工业与防务将支撑统一事业，公共契约则决定建国后的共同秩序。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
