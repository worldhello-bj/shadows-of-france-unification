 SOF_NR_TRS_mandate:0 "中央大区的全国统一使命"
 SOF_NR_TRS_mandate_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_TRS_integration:0 "召开法兰西全国会议"
 SOF_NR_TRS_integration_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_TRS_unitary:0 "统一共和国的中央宪制"
 SOF_NR_TRS_unitary_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_TRS_federal:0 "共同国家的联邦宪制"
 SOF_NR_TRS_federal_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_TRS_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_TRS_proclamation_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_TRS_settlement:0 "开启法国的国家重建"
 SOF_NR_TRS_settlement_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_TRS_strategy:0 "重掌法兰西的交通命脉"
 SOF_GN_TRS_strategy_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TRS_production:0 "国家铁路与军械计划"
 SOF_GN_TRS_production_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TRS_operations:0 "全国后勤与预备总指挥部"
 SOF_GN_TRS_operations_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TRS_campaign:0 "由国家交通重连法国"
 SOF_GN_TRS_campaign_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_TRS_legacy:0 "统一国家的调度中枢"
 SOF_GN_TRS_legacy_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_TRS_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_TRS_tt:0 "陆军经验+20，卡车+250。"
 SOF_PARTY_PCF_REGIONAL_AGENDA:0 "工人共和国的全国纲领"
 SOF_PARTY_PCF_REGIONAL_AGENDA_desc:0 "[GetSofGnVision]\n\n这是共产党面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
