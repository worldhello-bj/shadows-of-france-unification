 sof_gn_shortcut:0 "全国统一与国家战略"
 sof_gn_national_project:0 "[GetSofGnRole] · 国家崛起"
 sof_gn_national_project_desc:0 "统一前提供政治统筹、战略生产与军队动员收益。战略生产要求本区仍完整统一；建国后战争阶段收益退出，完成国家重建阶段后改用和平工业、科研与行政整合收益。"
 sof_gn_strategy_policy_tt:0 "统一前政治点数获取+5%，稳定度+3%。"
 sof_gn_production_policy_tt:0 "本区完整统一时，统一前民用与军用工厂建造速度各+7%，工厂产出+5%，并获得[GetSofGnSectorBonus]。"
 sof_gn_operations_policy_tt:0 "统一前陆军组织度+3%，补给消耗-3%，计划速度+5%。"
 sof_gn_campaign_policy_tt:0 "统一前再增加政治点数获取+5%、陆军组织度+2%。"
 sof_gn_legacy_policy_tt:0 "建国后的国家重建政策：民用工厂建造速度+10%，研究速度+2%，顺从度增长+0.03，并保留[GetSofGnSectorBonus]。"
 sof_gn_capacity_bonus:0 "国家工业技术储备"
 sof_gn_air_program:0 "国家航空工业计划"
 sof_gn_reconstruction_bonus:0 "统一法国的工业重建"
 sof_gn_role_fallback:0 "国家复兴"
 sof_gn_vision_fallback:0 "以政治纲领、国家工业与统一军队重建法兰西。"
 sof_rpe_regional_program:0 "[GetSofRlRegion] · 全国党派纲领"
 sof_rpe_policy_tt:0 "本党派全国施政纲领提供下列持续收益；失去执政地位、投降或失去建设基地时停用。"
 sof_rpe_review_tt:0 "以全国会议为基础确立本党派建国纲领。政治点数获取再增加2%；各党派共用一次首次工业研究奖励。"
 sof_gn_role_AJC:0 "跨海统一与地中海战略"
 sof_gn_vision_AJC:0 "科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。"
 sof_gn_sector_bonus_AJC:0 "船坞建造速度+6%、海军船坞产出+3%"
 sof_gn_role_PRS:0 "中央法统与国家财政"
 sof_gn_vision_PRS:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。"
 sof_gn_sector_bonus_PRS:0 "政治点数获取+3%、研究速度+1%"
 sof_gn_role_REN:0 "地方自治与大西洋海权"
 sof_gn_vision_REN:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。"
 sof_gn_sector_bonus_REN:0 "船坞建造速度+8%、海军船坞产出+5%"
 sof_gn_role_LIL:0 "煤钢工业与重装统一战争"
 sof_gn_vision_LIL:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。"
 sof_gn_sector_bonus_LIL:0 "工厂产出+3%、军用工厂建造速度+3%"
 sof_gn_role_MRS:0 "地中海港口与南方动员"
 sof_gn_vision_MRS:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。"
 sof_gn_sector_bonus_MRS:0 "船坞建造速度+6%、海军船坞产出+3%"
 sof_gn_role_AMI:0 "北方交通与南北统一"
 sof_gn_vision_AMI:0 "皮卡第处在北方工业与国家中枢之间。控制交通与补给，建立能够持续作战的机动军，就能把地理通道转化为连接整个法国的统一力量。"
 sof_gn_sector_bonus_AMI:0 "补给消耗-3%、计划速度+4%"
 sof_gn_role_BES:0 "精密工业与东部战线"
 sof_gn_vision_BES:0 "弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。"
 sof_gn_sector_bonus_BES:0 "研究速度+2%、工厂产出+2%"
 sof_gn_role_BRD:0 "国家信用与大西洋贸易"
 sof_gn_vision_BRD:0 "阿基坦的商贸、信用与大西洋航路需要一个完整的国内市场。我们必须把这些资源用于统一战争的财政与生产，再以国家制度重开法国的对外通道。"
 sof_gn_sector_bonus_BRD:0 "民用工厂建造速度+4%、政治点数获取+3%"
 sof_gn_role_CFR:0 "中央高原与战略纵深"
 sof_gn_vision_CFR:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。"
 sof_gn_sector_bonus_CFR:0 "补给消耗-3%、计划速度+4%"
 sof_gn_role_CHL:0 "野战军与国家纵深"
 sof_gn_vision_CHL:0 "香槟平原与阿登交通决定着东部战线的进退。把军需、训练与预备队纳入一个国家计划，才能把地区军势转化为统一法国的野战力量。"
 sof_gn_sector_bonus_CHL:0 "陆军组织度+2%、计划速度+4%"
 sof_gn_role_DIJ:0 "冶金工业与国家交通"
 sof_gn_vision_DIJ:0 "勃艮第连接着法国的工业地区与主要交通走廊。我们的统一事业必须以冶金、军需与运输的协同为支点，重新连接分裂的国家。"
 sof_gn_sector_bonus_DIJ:0 "工厂产出+3%、军用工厂建造速度+3%"
 sof_gn_role_LMG:0 "电工军械与纵深动员"
 sof_gn_vision_LMG:0 "利穆赞的电工材料、军械与中央高原位置，可以成为共和国复兴的支点。地方生产要接入统一战争的国家工业体系，纵深军队则承担连接高原与全国战线的使命。"
 sof_gn_sector_bonus_LMG:0 "工厂产出+2%、研究速度+1%"
 sof_gn_role_LYO:0 "机械工业与国家现代化"
 sof_gn_vision_LYO:0 "里昂与罗讷—阿尔卑斯的工业、能源和科研能力，足以支持一个面向全国的现代化国家方案。机械化军队与战略工业应当共同结束割据。"
 sof_gn_sector_bonus_LYO:0 "工厂产出+2%、研究速度+1%"
 sof_gn_role_MET:0 "冶金军工与东部国防"
 sof_gn_vision_MET:0 "洛林不能永远以边境堡垒的身份守望分裂法国。冶金工业与防务体系要支撑统一军队，使东部国防力量成为重建国家秩序的力量。"
 sof_gn_sector_bonus_MET:0 "工厂产出+3%、军用工厂建造速度+3%"
 sof_gn_role_MOP:0 "南方动员与国家供给"
 sof_gn_vision_MOP:0 "朗格多克的生产、农业与地中海交通，需要突破地区边界形成国家规模的供给体系。我们将以此支撑南方军队，参与决定统一法国的政治未来。"
 sof_gn_sector_bonus_MOP:0 "补给消耗-3%、计划速度+4%"
 sof_gn_role_NAN:0 "国家造舰与大西洋海权"
 sof_gn_vision_NAN:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。"
 sof_gn_sector_bonus_NAN:0 "船坞建造速度+8%、海军船坞产出+5%"
 sof_gn_role_POI:0 "军械工业与西部统一"
 sof_gn_vision_POI:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。"
 sof_gn_sector_bonus_POI:0 "工厂产出+2%、研究速度+1%"
 sof_gn_role_ROU:0 "海峡门户与海陆协同"
 sof_gn_vision_ROU:0 "诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。"
 sof_gn_sector_bonus_ROU:0 "船坞建造速度+6%、海军船坞产出+3%"
 sof_gn_role_STR:0 "共同国家契约与莱茵工业"
 sof_gn_vision_STR:0 "阿尔萨斯的经验能够回答统一国家的核心问题：如何在共同权威之下保有地区制度与语言。莱茵工业与防务将支撑统一事业，公共契约则决定建国后的共同秩序。"
 sof_gn_sector_bonus_STR:0 "研究速度+2%、工厂产出+2%"
 sof_gn_role_TOU:0 "航空工业与空地统一战争"
 sof_gn_vision_TOU:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。"
 sof_gn_sector_bonus_TOU:0 "空军任务效率+4%、研究速度+1%"
 sof_gn_role_TRS:0 "铁路军械与国家统筹"
 sof_gn_vision_TRS:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。"
 sof_gn_sector_bonus_TRS:0 "补给消耗-3%、计划速度+4%"
