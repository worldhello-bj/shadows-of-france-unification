 SOF_PARTY_UPR_UPR_MANDATE_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n以地方议会、宗教团体和市镇组织协调[GetSofRlRegion]的公共事务。地方代表将根据本省公共服务与产业需求提出施政计划。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_SCHOOLS_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n统筹维持地方法律制度、保障地方学校安排。\n\n维持地方民商制度的连续性，为跨境企业和地方投资提供稳定预期。\n\n协调地方学校和职业教育，培养能够服务本地产业的青年骨干。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_COUNCILS_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n统筹双语公共服务、县市联席协商。\n\n以地方语言服务、行政资格和技术教育沟通不同社群。\n\n赋予地方议会清晰的建设预算，改善城镇、工厂和运输节点。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。"
 SOF_PARTY_UPR_UPR_SETTLEMENT_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n以地方权利与全国公共责任的协议稳定施政，扩大长期投资。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_BORDER_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n完善边境仓储和铁路联络，使交通网络同时服务贸易和防御。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_RHINE_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n把本省交通、工场和市镇市场连接起来，形成可持续的地方经济。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_UPR_UPR_LOCAL_LAW_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n维持地方民商制度的连续性，为跨境企业和地方投资提供稳定预期。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_UPR_UPR_BILINGUAL_desc:0 "全国政治路线 · 以地方自治缔造法国\n\n以双语行政和技术教育沟通不同社群，吸收莱茵两岸的产业知识。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_REGIONAL_AGENDA:0 "集中动员的国家路线"
 SOF_PARTY_DORIOT_REGIONAL_AGENDA_desc:0 "[GetSofGnVision]\n\n这是多里奥地方组织面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_DORIOT_REGIONAL_PRODUCTION:0 "国家军工与政治动员"
 SOF_PARTY_DORIOT_REGIONAL_PRODUCTION_desc:0 "[GetSofGnVision]\n\n这是多里奥地方组织面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_DORIOT_REGIONAL_SERVICES:0 "全国秩序与社会整编"
 SOF_PARTY_DORIOT_REGIONAL_SERVICES_desc:0 "[GetSofGnVision]\n\n这是多里奥地方组织面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_DORIOT_REGIONAL_REVIEW:0 "集中权威的建国纲领"
 SOF_PARTY_DORIOT_REGIONAL_REVIEW_desc:0 "[GetSofGnVision]\n\n这是多里奥地方组织面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。本党派全国纲领须以已召开的全国会议为政治基础。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_DORIOT_DORIOT_RAYON_desc:0 "全国政治路线 · 集中动员的国家路线\n\n以圣但尼的地方组织为基础，建立能够动员市政资源的政治网络。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_LOCAL_CHOICE_desc:0 "全国政治路线 · 集中动员的国家路线\n\n继续以地方行政和社会建设扩大影响，以市政业绩巩固政治基础。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_PPF_desc:0 "全国政治路线 · 集中动员的国家路线\n\n建立法国人民党，将地方组织转向威权民族主义动员，并以军事化政治组织扩大影响。\n\n陆军经验提高至25。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_TRAINING_desc:0 "全国政治路线 · 集中动员的国家路线\n\n统筹动员工厂联络员、地方生产车间、职业训练网络。\n\n把基层组织、退伍军人与训练机构连接起来，强化地方动员能力。\n\n扩建地方加工车间，以公共装备订单维持熟练工队伍。\n\n设立职业训练与装备维修课程，让工人技术直接支撑生产和动员。\n\n建设重点：[GetSofRlTheme]。"
 SOF_PARTY_DORIOT_DORIOT_SERVICES_desc:0 "全国政治路线 · 集中动员的国家路线\n\n统筹市政服务的支持网、恢复城市信用、统筹公共服务。\n\n以市政工程回应失业和住房问题，扩大道路与公共设施。\n\n以城市信用和公共采购恢复企业订单，把失业救济转化为就业项目。\n\n协调运输、仓储与公共服务，把城市组织能力转化为可使用的物资。\n\n建设重点：[GetSofRlTheme]。"
 SOF_PARTY_DORIOT_DORIOT_MUNICIPAL_desc:0 "全国政治路线 · 集中动员的国家路线\n\n以市政工程回应失业和住房问题，扩大道路与公共设施。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_ORGANIZERS_desc:0 "全国政治路线 · 集中动员的国家路线\n\n把基层组织、退伍军人与训练机构连接起来，强化地方动员能力。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_CREDIT_desc:0 "全国政治路线 · 集中动员的国家路线\n\n以城市信用和公共采购恢复企业订单，把失业救济转化为就业项目。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_DORIOT_DORIOT_WORKSHOPS_desc:0 "全国政治路线 · 集中动员的国家路线\n\n扩建地方加工车间，以公共装备订单维持熟练工队伍。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 sof_rpe_production_AJC:0 "地中海远征工业"
 sof_rpe_service_AJC:0 "跨海远征军总指挥部"
 sof_rpe_project_AJC:0 "科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。"
 sof_rpe_production_PRS:0 "国家财政与战略工业"
 sof_rpe_service_PRS:0 "全国总参谋部"
 sof_rpe_project_PRS:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。"
 sof_rpe_production_REN:0 "大西洋国家军工计划"
 sof_rpe_service_REN:0 "议会授权的西部联军"
 sof_rpe_project_REN:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。"
 sof_rpe_production_LIL:0 "煤钢与重装工业总动员"
 sof_rpe_service_LIL:0 "北方重装集团军"
 sof_rpe_project_LIL:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。"
 sof_rpe_production_MRS:0 "南方港口与国家军工"
 sof_rpe_service_MRS:0 "地中海统一战线"
 sof_rpe_project_MRS:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。"
 sof_rpe_production_AMI:0 "北方交通与战时生产"
 sof_rpe_service_AMI:0 "索姆河机动战线"
 sof_rpe_project_AMI:0 "皮卡第处在北方工业与国家中枢之间。控制交通与补给，建立能够持续作战的机动军，就能把地理通道转化为连接整个法国的统一力量。"
 sof_rpe_production_BES:0 "精密军工与国家标准"
 sof_rpe_service_BES:0 "朱拉山地统一军"
 sof_rpe_project_BES:0 "弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。"
 sof_rpe_production_BRD:0 "国家信用与大西洋工业"
 sof_rpe_service_BRD:0 "西南统一军总指挥部"
 sof_rpe_project_BRD:0 "阿基坦的商贸、信用与大西洋航路需要一个完整的国内市场。我们必须把这些资源用于统一战争的财政与生产，再以国家制度重开法国的对外通道。"
 sof_rpe_production_CFR:0 "战略纵深与战时工业"
 sof_rpe_service_CFR:0 "中央高原预备集团军"
 sof_rpe_project_CFR:0 "中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。"
 sof_rpe_production_CHL:0 "国家军需与纵深动员"
 sof_rpe_service_CHL:0 "香槟野战军总指挥部"
 sof_rpe_project_CHL:0 "香槟平原与阿登交通决定着东部战线的进退。把军需、训练与预备队纳入一个国家计划，才能把地区军势转化为统一法国的野战力量。"
 sof_rpe_production_DIJ:0 "国家冶金与交通体系"
 sof_rpe_service_DIJ:0 "中部交通战役总指挥部"
 sof_rpe_project_DIJ:0 "勃艮第连接着法国的工业地区与主要交通走廊。我们的统一事业必须以冶金、军需与运输的协同为支点，重新连接分裂的国家。"
 sof_rpe_production_LMG:0 "电工与军械战略工业"
 sof_rpe_service_LMG:0 "共和国纵深预备军"
 sof_rpe_project_LMG:0 "利穆赞的电工材料、军械与中央高原位置，可以成为共和国复兴的支点。地方生产要接入统一战争的国家工业体系，纵深军队则承担连接高原与全国战线的使命。"
 sof_rpe_production_LYO:0 "国家机械化工业计划"
 sof_rpe_service_LYO:0 "罗讷机动集团军"
 sof_rpe_project_LYO:0 "里昂与罗讷—阿尔卑斯的工业、能源和科研能力，足以支持一个面向全国的现代化国家方案。机械化军队与战略工业应当共同结束割据。"
 sof_rpe_production_MET:0 "冶金军工总动员"
 sof_rpe_service_MET:0 "洛林国防集团军"
 sof_rpe_project_MET:0 "洛林不能永远以边境堡垒的身份守望分裂法国。冶金工业与防务体系要支撑统一军队，使东部国防力量成为重建国家秩序的力量。"
 sof_rpe_production_MOP:0 "南方加工与运输动员"
 sof_rpe_service_MOP:0 "南方统一军总指挥部"
 sof_rpe_project_MOP:0 "朗格多克的生产、农业与地中海交通，需要突破地区边界形成国家规模的供给体系。我们将以此支撑南方军队，参与决定统一法国的政治未来。"
 sof_rpe_production_NAN:0 "国家造舰与海运工业"
 sof_rpe_service_NAN:0 "大西洋联合海军"
 sof_rpe_project_NAN:0 "卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。"
 sof_rpe_production_POI:0 "国家军械与海运计划"
 sof_rpe_service_POI:0 "西部机动统一军"
 sof_rpe_project_POI:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。"
 sof_rpe_production_ROU:0 "海峡工业与国家舰队"
 sof_rpe_service_ROU:0 "诺曼底海陆联合军"
 sof_rpe_project_ROU:0 "诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。"
 sof_rpe_production_STR:0 "东部精密工业总动员"
 sof_rpe_service_STR:0 "莱茵统一战线"
 sof_rpe_project_STR:0 "阿尔萨斯的经验能够回答统一国家的核心问题：如何在共同权威之下保有地区制度与语言。莱茵工业与防务将支撑统一事业，公共契约则决定建国后的共同秩序。"
 sof_rpe_production_TOU:0 "国家航空工业总计划"
 sof_rpe_service_TOU:0 "西南空地联合军"
 sof_rpe_project_TOU:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。"
 sof_rpe_production_TRS:0 "国家铁路与军械计划"
 sof_rpe_service_TRS:0 "全国后勤与预备总指挥部"
 sof_rpe_project_TRS:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。"
