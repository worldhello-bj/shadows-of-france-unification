 SOF_PARTY_PCF_REGIONAL_SERVICES_desc:0 "[GetSofGnVision]\n\n这是共产党面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_PCF_REGIONAL_REVIEW:0 "人民共和国的建国主张"
 SOF_PARTY_PCF_REGIONAL_REVIEW_desc:0 "[GetSofGnVision]\n\n这是共产党面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。本党派全国纲领须以已召开的全国会议为政治基础。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
 SOF_PARTY_PCF_PCF_MANDATE_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n把工厂支部、地方议员与工会代表组织成能够执行人民阵线纲领的议会力量。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_PCF_PCF_HAND_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n向共和派与信教劳动者伸出手，用共同的社会诉求巩固反法西斯多数。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_PCF_PCF_WORKSHOPS_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n以公共军需订单改造地方车间，建立稳定的熟练工与军工生产体系。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_PCF_PCF_PEASANTS_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n发展农业合作与城乡采购网络，使农村产品和工业品都能稳定进入市场。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_PCF_PCF_LEAGUES_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n解散武装政治团体，将公共秩序和生产秩序交由共和制度保障。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_PCF_PCF_ARMS_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n统筹打破二百家族的支配、公共军工监督。\n\n扩大工人住宅、家庭补助与生活设施，把消费需求转化为新的建设订单。\n\n让军需生产服从统一合同与质量标准，为保卫共和国提供可靠装备。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_PCF_PCF_SECURITY_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n通过集体安全协商与共同防御准备，组织抵抗法西斯侵略的力量。\n\n陆军经验提高至25。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_PCF_PCF_FAMILIES_desc:0 "全国政治路线 · 工人共和国的全国纲领\n\n扩大工人住宅、家庭补助与生活设施，把消费需求转化为新的建设订单。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
