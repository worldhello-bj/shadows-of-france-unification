 SOF_NR_MRS_unitary_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_MRS_federal:0 "共同国家的联邦宪制"
 SOF_NR_MRS_federal_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_MRS_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_MRS_proclamation_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_MRS_settlement:0 "开启法国的国家重建"
 SOF_NR_MRS_settlement_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_MRS_strategy:0 "地中海共和国的全国使命"
 SOF_GN_MRS_strategy_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_MRS_production:0 "南方港口与国家军工"
 SOF_GN_MRS_production_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_MRS_operations:0 "地中海统一战线"
 SOF_GN_MRS_operations_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_MRS_campaign:0 "从南方缔造新法国"
 SOF_GN_MRS_campaign_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。"
 SOF_GN_MRS_legacy:0 "国家的地中海门户"
 SOF_GN_MRS_legacy_desc:0 "马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_MRS_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_MRS_tt:0 "陆军经验+20，海军经验+25，运输船+30。"
