 SOF_NR_BRD_unitary_desc:0 "阿基坦的商贸、信用与大西洋航路需要一个完整的国内市场。我们必须把这些资源用于统一战争的财政与生产，再以国家制度重开法国的对外通道。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
