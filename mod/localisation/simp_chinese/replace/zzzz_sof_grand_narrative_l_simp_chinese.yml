 SOF_PARTY_SFIO_SFIO_OFFICE_desc:0 "全国政治路线 · 法兰西社会共和国\n\n以议会授权建立改革内阁，把工人诉求转化为有预算、有执行机构的政策。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_SFIO_SFIO_AGREEMENTS_desc:0 "全国政治路线 · 法兰西社会共和国\n\n以集体谈判、工会权利与工资协议结束劳资僵局，使企业恢复稳定生产。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_SFIO_SFIO_DEMAND_desc:0 "全国政治路线 · 法兰西社会共和国\n\n通过住房与市政订单扩大就业，让购买力回流本地产业。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_SFIO_SFIO_CREDIT_desc:0 "全国政治路线 · 法兰西社会共和国\n\n把信贷引向设备更新和公共投资，为企业扩大产能提供长期资金。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_SFIO_SFIO_COMPROMISE_desc:0 "全国政治路线 · 法兰西社会共和国\n\n以公开预算与跨党派协商维持改革联盟，推动企业投资和社会保障同步落地。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
 SOF_PARTY_SFIO_SFIO_WORKS_desc:0 "全国政治路线 · 法兰西社会共和国\n\n打通工业城镇与铁路枢纽，以公共工程连接就业、交通和生产。\n\n建设重点：[GetSofRlTheme]。新增厂房、道路和用地仅落在[GetSofRlRegion]本土自有且完整控制的州，吞并外地不会改变本省建设范围。容量不足时沿用原有的财政、研究或装备补偿；本土失守时暂停建设计划。"
 SOF_PARTY_SFIO_SFIO_LEAVE_desc:0 "全国政治路线 · 法兰西社会共和国\n\n统筹四十小时工作周、两周属于劳动者的假期。\n\n实行四十小时工作周，同时重排轮班、扩大职业培训，以组织改进支撑劳动改革。\n\n确立带薪休假与劳动者休养设施，使社会进步成为共和国的日常生活。\n\n这些改革是本党派争取全法国领导权的政治基础。"
 SOF_PARTY_SFIO_SFIO_LEISURE_desc:0 "全国政治路线 · 法兰西社会共和国\n\n推动大众体育、文化与技术教育，为改革建立持久的社会基础。\n\n这些改革是本党派争取全法国领导权的政治基础。后续国家方案将它们与统一战争、全国会议及建国秩序相连；具体奖励和施政条件见下方效果。"
