 SOF_NR_TOU_mandate_desc:0 "图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
