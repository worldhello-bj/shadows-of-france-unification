 SOF_NR_REN_mandate:0 "布列塔尼的全国统一使命"
 SOF_NR_REN_mandate_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_REN_integration:0 "召开法兰西全国会议"
 SOF_NR_REN_integration_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_REN_unitary:0 "统一共和国的中央宪制"
 SOF_NR_REN_unitary_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_REN_federal:0 "共同国家的联邦宪制"
 SOF_NR_REN_federal_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_REN_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_REN_proclamation_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_REN_settlement:0 "开启法国的国家重建"
 SOF_NR_REN_settlement_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_REN_strategy:0 "西部共和国的全国使命"
 SOF_GN_REN_strategy_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_REN_production:0 "大西洋国家军工计划"
 SOF_GN_REN_production_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
