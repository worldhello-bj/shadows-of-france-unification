 SOF_LIL36_maritime_phoenix_desc:0 "《以北方工业重铸法国》 · 国家海权与海上战线\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。以本区港口与船厂支撑国家海权、海上供给和沿海统一战线。"
 SOF609_LIL_diplomatic_ratification_desc:0 "《以北方工业重铸法国》 · 全国统一战线\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF_NR_LIL_mandate:0 "北部－加来的全国统一使命"
 SOF_NR_LIL_mandate_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_LIL_integration:0 "召开法兰西全国会议"
 SOF_NR_LIL_integration_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_LIL_unitary:0 "统一共和国的中央宪制"
 SOF_NR_LIL_unitary_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_LIL_federal:0 "共同国家的联邦宪制"
 SOF_NR_LIL_federal_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_LIL_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_LIL_proclamation_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_LIL_settlement:0 "开启法国的国家重建"
 SOF_NR_LIL_settlement_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_LIL_strategy:0 "以北方工业重铸法国"
 SOF_GN_LIL_strategy_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_LIL_production:0 "煤钢与重装工业总动员"
 SOF_GN_LIL_production_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_LIL_operations:0 "北方重装集团军"
 SOF_GN_LIL_operations_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_LIL_campaign:0 "工业城市的国家契约"
 SOF_GN_LIL_campaign_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_LIL_legacy:0 "法国的国家工业引擎"
 SOF_GN_LIL_legacy_desc:0 "北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_LIL_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_LIL_tt:0 "陆军经验+20，卡车+250。"
 SOF_MRS_RED_A1_desc:0 "《地中海共和国的全国使命》 · 国家海权与海上战线\n\n马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。以本区港口与船厂支撑国家海权、海上供给和沿海统一战线。"
