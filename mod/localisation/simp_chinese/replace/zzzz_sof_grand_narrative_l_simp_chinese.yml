 SOF_NR_POI_proclamation_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_POI_settlement:0 "开启法国的国家重建"
 SOF_NR_POI_settlement_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_GN_POI_strategy:0 "西部军工的全国使命"
 SOF_GN_POI_strategy_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n以获得授权的全国使命为起点，将政治纲领、战略工业与军事力量组织为一项完整的建国事业。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_POI_production:0 "国家军械与海运计划"
 SOF_GN_POI_production_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n完成本区整合后实施成组战略生产建设，使地方工业承担国家规模的战争供给。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_POI_operations:0 "西部机动统一军"
 SOF_GN_POI_operations_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n在全国会议的政治基础上组织全国战线，建立能够跨越地区边界持续作战的指挥与运输能力。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_POI_campaign:0 "西部诸地重归法兰西"
 SOF_GN_POI_campaign_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n以已经选择的中央或联邦宪制统合工业、军队与政治权威。国家秩序的承诺必须经过全法国统一才能兑现。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 SOF_GN_POI_legacy:0 "国家军械与海岸工业"
 SOF_GN_POI_legacy_desc:0 "普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。\n\n全国统一与既有重建会议完成后，把本区贡献纳入整个法国的工业、科研和行政重建。\n\n这一国家方案与全国使命、全国会议、中央或联邦宪制以及正式建国线相连。已统一的国家可跳过战争筹备阶段，重建奖励只领取一次。"
 sof_gn_production_POI_tt:0 "在本区自有、核心且完整控制的地区分期建设：2座民用工厂、2座军用工厂。每项工程增加1个建筑槽位；全区无容量时该项改为60政治点数与一次50%工业研究加成。"
 sof_gn_operations_POI_tt:0 "陆军经验+20，卡车+250。"
