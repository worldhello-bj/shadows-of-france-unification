 SOF_PARTY_USR_REGIONAL_AGENDA:0 "以国家计划重整法国"
 SOF_PARTY_USR_REGIONAL_AGENDA_desc:0 "[GetSofGnVision]\n\n这是社会主义共和联盟面向全法国的国家方案，以[GetSofGnRole]为支点，把现有政治纲领转化为统一事业的工业动员、社会联盟与建国主张。必须先取得现有全国统一使命，才能推进这项国家方案。\n\n生产动员与社会动员两条路线互斥。战略生产执行两期建设；运输路线提供道路或船坞及相应保障。"
