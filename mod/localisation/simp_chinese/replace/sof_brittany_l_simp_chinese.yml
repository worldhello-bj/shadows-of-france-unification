 SOF_BRT_P0:0 "召集布列塔尼地方议会"
 SOF_BRT_P0_desc:0 "法国的分裂使雷恩必须建立自己的责任政治。布列塔尼既有地方自治传统，也有共和派、社会主义者和天主教民主派的分歧。召集地方政治代表，通过公开协商制定共同防务，维护半岛安全。"
 SOF_BRT_P1:0 "组建议事局"
 SOF_BRT_P1_desc:0 "组建议事局须在地方议会和责任内阁的框架下实施。根据地方财力分配有限的人力、科研与军需资源。"
 SOF_BRT_P2:0 "议会责任内阁"
 SOF_BRT_P2_desc:0 "普通多数决定责任内阁。至少51席支持才能组成政府，财政、军需与战争事务均接受议会监督。"
 SOF_BRT_P3:0 "沙托的市政方案"
 SOF_BRT_P3_desc:0 "沙托在1935年成为雷恩市长。市政工程和透明预算是争取其地方支持的重点。国策开启议题，投入协商费用争取议会支持。"
 SOF_BRT_P4:0 "勒梅斯特财政委员会"
 SOF_BRT_P4_desc:0 "前雷恩市长勒梅斯特主持审计与收支讨论。取得议会支持后，按项目预算推进工程。"
 SOF_BRT_P5:0 "巴翁的劳工听证"
 SOF_BRT_P5_desc:0 "前雷恩市长巴翁代表社会主义市政传统。劳工保障与技术教育需要预算，也会暂时影响生产。"
 SOF_BRT_P6:0 "勒戈尔热港务委员会"
 SOF_BRT_P6_desc:0 "布雷斯特市长、参议员勒戈尔热重视共和国与公共服务。港务承诺可以换取支持，船厂工程仍须拥有并完全控制当地。"
 SOF_BRT_P7:0 "特雷曼坦地方教育案"
 SOF_BRT_P7_desc:0 "特雷曼坦是天主教民主派地方议员与市长。将市镇自治、地方教育和共和制度纳入协商。"
 SOF_BRT_P8:0 "唐吉－普里让农业听证"
 SOF_BRT_P8_desc:0 "唐吉－普里让在1935年已任市长，1936年5月进入法国众议院。他的农业合作与农村保障诉求将进入地方议会。"
 SOF_BRT_P9:0 "地方语言与公民教育"
 SOF_BRT_P9_desc:0 "地方语言与公民教育须在地方议会和责任内阁的框架下实施。根据地方财力分配有限的人力、科研与军需资源。"
 SOF_BRT_P10:0 "公布财政账目"
 SOF_BRT_P10_desc:0 "公布财政账目须在地方议会和责任内阁的框架下实施。根据地方财力分配有限的人力、科研与军需资源。"
