 SOF_BRT_P12:0 "市政共和联盟"
 SOF_BRT_P12_desc:0 "市政协商席和财政审计席的现任代表均须有效支持，且形成51席多数。初始代表是沙托与勒梅斯特；改任候补后按同一委员会议席重新协商。"
 SOF_BRT_P13:0 "工农合作内阁"
 SOF_BRT_P13_desc:0 "劳工席和农业席的现任代表均须有效支持，且形成51席多数。初始代表是巴翁与唐吉－普里让；候补接任继承原有议席。"
 SOF_BRT_P14:0 "自治保守联盟"
 SOF_BRT_P14_desc:0 "财政审计席和地方教育席的现任代表均须有效支持，且形成51席多数。初始代表是勒梅斯特与特雷曼坦。"
 SOF_BRT_P15:0 "公共建设法"
 SOF_BRT_P15_desc:0 "先通过45日公共预算审议。开始与结束审议均须51席；法案表决需要仍有效的承诺支持。"
 SOF_BRT_P16:0 "劳动保障法"
 SOF_BRT_P16_desc:0 "工时与工资保障必须先完成劳工法案表决。议员对政策的支持附带真实公共支出。"
 SOF_BRT_P17:0 "农村信用法"
 SOF_BRT_P17_desc:0 "农村合作社与地方信用由农业法案授权。以补助配合交通与工场建设。"
 SOF_BRT_P18:0 "海港投资法"
 SOF_BRT_P18_desc:0 "港务法案授权建设资金，船厂国策另需实际控制布雷斯特或洛里昂。"
