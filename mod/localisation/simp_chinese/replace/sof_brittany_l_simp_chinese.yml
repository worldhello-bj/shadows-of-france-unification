 sof_brt_council_desc:0 "议会支持：§Y[?sof_brt_support|0]/100席§!\n普通法案须51席，修订中立与动员须66席，对外战争须75席。议员承诺通常持续180日，法案审议45日，表决结束重新核验支持。每项法案同时只能审议一次；支出承诺有实际代价。\n六位地方代表通过100席议会协商预算、动员与战争授权。"
