l_simp_chinese:
 SFP_invest_in_the_colonies_desc:0 "地方重建纳入统一财政，为首都以外的生产与交通恢复提供资源。在完整控制的法国地区建设1座民用工厂并增加1个建筑槽；容量已满时，投资转为1次100%工业科技研究加成。现有地方合作改善继续实施。"
 sof_region_DIJ_1936_yards_desc:0 "第戎编组场扩建铁路维修工场，增加1座民用工厂与1个建筑槽。工厂容量已满时，工程人员转入铁路技术研究，获得1次100%火车科技研究加成。"
 sof_region_DIJ_1936_charter_desc:0 "以第戎的财政基础确立地方公约，使行政筹备、预备军组织和铁路协调获得一致授权。"
 sof_ne_ROU_tolls_desc:0 "将鲁昂仓储收入与塞纳河运输收费纳入公共预算，稳定市政收入，为港口城市间的合作建立财政基础。"
 sof_ne_ROU_coastal_reserves_desc:0 "依托城市组织和预备役骨干开展守备训练，交付600支步枪并获得15陆军经验。"
 sof_region_BES_1936_municipal_desc:0 "以贝桑松的地方协约为基础，协调市政预算与工场事务，并为各城镇代表参与地区合作确立规则。"
 sof_region_BES_1936_small_machines_desc:0 "将技术标准、工人培训与地方资本汇集到贝桑松的机床工场。增加2个建筑槽并建设2座民用工厂；每座因容量限制未能落地的工厂，转为1次100%工业科技研究加成。"
 sof_region_LYO_1936_hearing_desc:0 "以地方账目和各地代表的意见组织公开听证，使里昂的财政安排与区域合作形成共同依据。"
 sof_region_NAN_1936_charter_desc:0 "在市政机构与港区协作的基础上制定南特章程，为地方治理、公共预算和地区代表合作建立常设制度。"
 SOF_MRS_RED_E6_desc:0 "交付80辆卡车，并开放港口至内陆的交通投资决议。选择实际控制的线路，以民用工业投入建设罗讷河谷运输通道。"
 sof604_dij_yards_railway:0 "第戎铁路工场"
 sof604_paris_local_development:0 "地方工业重建"
 sof604_bes_machine_tool_innovation:0 "贝桑松机床创新"
