 SFP_invest_in_the_colonies_desc:0 "《重建法兰西国家中枢》 · 国家使命与建国方案\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_region_DIJ_1936_yards_desc:0 "《从勃艮第连结法兰西》 · 国家使命与建国方案\n\n勃艮第连接着法国的工业地区与主要交通走廊。我们的统一事业必须以冶金、军需与运输的协同为支点，重新连接分裂的国家。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_region_DIJ_1936_charter_desc:0 "《从勃艮第连结法兰西》 · 国家使命与建国方案\n\n勃艮第连接着法国的工业地区与主要交通走廊。我们的统一事业必须以冶金、军需与运输的协同为支点，重新连接分裂的国家。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_ne_ROU_tolls_desc:0 "《以海峡门户重建法国》 · 国家海权与海上战线\n\n诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。以本区港口与船厂支撑国家海权、海上供给和沿海统一战线。"
 sof_ne_ROU_coastal_reserves_desc:0 "《以海峡门户重建法国》 · 国民军与统一战争\n\n诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。使地区军队具备参与全国统一战争、持续推进与整合战线的能力。"
 sof_region_BES_1936_municipal_desc:0 "《以东部工业重整法兰西》 · 国家使命与建国方案\n\n弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_region_BES_1936_small_machines_desc:0 "《以东部工业重整法兰西》 · 国家使命与建国方案\n\n弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_region_LYO_1936_hearing_desc:0 "《以工业共和国重塑法国》 · 国家使命与建国方案\n\n里昂与罗讷—阿尔卑斯的工业、能源和科研能力，足以支持一个面向全国的现代化国家方案。机械化军队与战略工业应当共同结束割据。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 sof_region_NAN_1936_charter_desc:0 "《以大西洋海权统一法国》 · 国家使命与建国方案\n\n卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。确立能够代表全法国的政治主张，将地区治理转化为建国能力。"
 SOF_MRS_RED_E6_desc:0 "《地中海共和国的全国使命》 · 国家海权与海上战线\n\n马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。以本区港口与船厂支撑国家海权、海上供给和沿海统一战线。"
