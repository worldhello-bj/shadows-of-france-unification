 sofzh_policy_works_desc:0 "道路、铁路与设施维修提速180天。\n基础设施建设+25%，铁路建设+20%，工业修复+20%。\n费用100政治点；需任命工业部长；冷却180天。\n\n基础设施建设速度：+25%\n铁路建设速度：+20%\n工厂修复速度：+20%"
 sofzh_policy_arsenals_desc:0 "军工产出和效率增长提高180天，承担消费品代价。\n工厂产出+15%，生产效率增长+20%，消费品工厂系数+2%。\n费用125政治点；需任命财政部长；冷却180天。\n\n工厂产出：+15%\n生产效率增长：+20%\n生活消费品工厂系数：+2%"
 sofzh_policy_mediation_desc:0 "提高稳定与顺从，降低抵抗180天。\n\n稳定度：+6%\n顺从度增长速度：+50%\n抵抗目标：-2%"
 sofzh_policy_drill_desc:0 "获得30陆军经验，作战组织改善120天。\n计划速度+20%，陆军经验获取+15%，陆军组织度恢复+10%。\n费用100政治点；需任命国防部长；冷却120天。\n\n计划速度：+0.2\n陆军经验增长：+15%\n陆军师组织度恢复速率：+10%"
 sofzh_policy_research_desc:0 "科研与技术转产改善180天。\n科研速度+8%，更换生产线的效率保留+15%，生产效率增长+10%。\n费用125政治点；需任命教育与科研部长；冷却180天。\n\n科研速度：+8%\n生产效率保持：+15%\n生产效率增长：+10%"
 sofzh_policy_sea_desc:0 "获得20海军、15空军经验，海空协同改善180天。\n海军组织度+10%，空军任务效率+8%，海军经验获取+15%。\n费用120政治点；需任命海军与航空部长；冷却180天。\n\n海军组织度：+10%\n空军任务效率：+8%\n海军经验增长：+15%"
