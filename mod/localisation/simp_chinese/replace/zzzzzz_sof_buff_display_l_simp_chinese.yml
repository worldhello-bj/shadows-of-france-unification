 sofzh_minister_foreign_3_desc:0 "外交与统一部长 · 重建使团。让外交协调服务运输与战后重建。\n\n工厂修复速度：+25%\n铁路建设速度：+20%\n顺从度增长速度：+50%"
 sof_hist_fra_rene_massigli_desc:0 "历史内阁 · 外交\n任命：125政治点数；替换同职务现任，调整冷却90天。\n\n战争支持度：+12%\n政治点获取：+15%\n改善关系持续花费：-30%"
