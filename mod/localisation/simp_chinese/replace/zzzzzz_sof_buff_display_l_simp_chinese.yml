 sof_hist_ita_curzio_malaparte_desc:0 "历史内阁 · 外交\n任命：125政治点数；替换同职务现任，调整冷却90天。\n\n改善关系持续花费：-35%\n政治点获取：+20%\n稳定度：+8%"
 sof_hist_ita_gian_galeazzo_ciano_desc:0 "历史内阁 · 外交\n任命：125政治点数；替换同职务现任，调整冷却90天。\n\n政治点获取：+15%\n改善关系持续花费：-40%\n战争支持度：+8%"
