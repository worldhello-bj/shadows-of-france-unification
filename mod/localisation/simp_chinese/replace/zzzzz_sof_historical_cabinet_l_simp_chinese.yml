l_simp_chinese:
 sof_hist_fra_camille_chautemps:0 "卡米耶·肖当"
 sof_hist_fra_camille_chautemps_desc:0 "曾出任法国总理与内政部长，以共和国议会政治与行政协调见长。\n\n施政方向：议会协调。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_georges_mandel:0 "乔治·芒代尔"
 sof_hist_fra_georges_mandel_desc:0 "吉伦特议员，曾参与法国共和国中央行政工作。\n\n施政方向：行政与通信。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_albert_sarraut:0 "阿尔贝·萨罗"
 sof_hist_fra_albert_sarraut_desc:0 "曾任内政部长，并在一九三六年担任总理兼内政部长。\n\n施政方向：地方行政。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_paul_reynaud:0 "保罗·雷诺"
 sof_hist_fra_paul_reynaud_desc:0 "法国议员与财政改革政治家，在财政和国防政策中具有重要经历。\n\n施政方向：财政与生产。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_charles_spinasse:0 "夏尔·斯皮纳斯"
 sof_hist_fra_charles_spinasse_desc:0 "人民阵线政府的国民经济部长，后曾任预算部长。\n\n施政方向：公共经济。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_raoul_dautry:0 "拉乌尔·多特里"
 sof_hist_fra_raoul_dautry_desc:0 "工程师与公共机构管理者，后来参与领导法国原子能委员会。\n\n施政方向：工程统筹。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_pierre_cot:0 "皮埃尔·科特"
 sof_hist_fra_pierre_cot_desc:0 "人民阵线政府的航空部长；此处以航空生产协调为施政方向。\n\n施政方向：航空生产。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_edouard_daladier:0 "爱德华·达拉第"
 sof_hist_fra_edouard_daladier_desc:0 "一九三六年人民阵线政府的国防与战争部长。\n\n施政方向：国防统筹。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_victor_denain:0 "维克托·德南"
 sof_hist_fra_victor_denain_desc:0 "法国航空军官与航空部长；海军与航空职务也负责空军组织。\n\n施政方向：航空组织。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_emile_muselier:0 "埃米尔·米瑟利耶"
 sof_hist_fra_emile_muselier_desc:0 "法国海军军官，后来领导自由法国海军并兼管航空事务。\n\n施政方向：舰队协同。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_frederic_joliot_curie:0 "弗雷德里克·约里奥－居里"
 sof_hist_fra_frederic_joliot_curie_desc:0 "法国物理学家，后来负责原子能委员会的科学与技术工作。\n\n施政方向：科研合作。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_jean_zay:0 "让·扎伊"
 sof_hist_fra_jean_zay_desc:0 "人民阵线政府的国民教育与美术部长。\n\n施政方向：教育与科研。本任命属于模组的架空法国统一路线。"
 sof_hist_fra_yvon_delbos:0 "伊冯·德尔博斯"
 sof_hist_fra_yvon_delbos_desc:0 "人民阵线政府的外交部长。\n\n施政方向：共和国外交。本任命属于模组的架空法国统一路线。"
