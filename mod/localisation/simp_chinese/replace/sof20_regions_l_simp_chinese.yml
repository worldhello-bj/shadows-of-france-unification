 sof20_AMI_neighbour_offer_desc:0 "支付60政治点，向一个符合条件的相邻小国提议归并。对方可拒绝。要求双方独立、和平、无阵营；对方不足6州且实力低于我们的一半。归并只移交领土，不授予核心；移交州获得10点顺从及180天地方协约。"
