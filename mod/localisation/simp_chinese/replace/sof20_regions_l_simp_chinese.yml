 sof20_diplomacy.2.a:0 "记录答复"
 sof20_diplomacy.2.d:0 "对方没有接受此次协作提议。付出的联络成本已经发生，可以在冷却结束后重新商谈。"
 sof20_diplomacy.2.t:0 "地区伙伴的答复"
 sof20_diplomacy.3.a:0 "接受共同制度"
 sof20_diplomacy.3.b:0 "我们保留独立"
 sof20_diplomacy.3.d:0 "邻近政府提出在共同财政与公共制度下归并。接受将结束本国独立并移交领土与军队。移交地区纳入协约，支付地方登记费用后按条件建立正式核心。"
