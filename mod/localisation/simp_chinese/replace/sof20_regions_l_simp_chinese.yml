 sof20_terrain_category:0 "地方作战经验"
 sof20_terrain_category_desc:0 "地区实践积累为永久经验。同类只取得一次，不同类别可共存；统一后保留。\n\n[GetSof20TerrainMountain]\n[GetSof20TerrainRiver]\n[GetSof20TerrainUrban]\n[GetSof20TerrainCoast]\n[GetSof20TerrainForest]\n[GetSof20TerrainPlain]\n\n五类地形训练作用于步兵及特种步兵；平原项也作用于装甲营，师修正按营编制加权。两栖项作用于参加登陆的部队，仅在登陆条件下生效。"
