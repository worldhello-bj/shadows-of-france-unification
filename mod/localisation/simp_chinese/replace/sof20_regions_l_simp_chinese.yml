 sof20_diplomacy.1.a:0 "接受共同交通协议"
 sof20_diplomacy.1.b:0 "我们暂时无法承诺"
 sof20_diplomacy.1.d:0 "邻近政府提议共同维护交通和供应。双方得到有限的协作收益，并承担彼此独立与和平的约束。"
