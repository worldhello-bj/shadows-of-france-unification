 sof20_AMI.1.a:0 "先恢复公共秩序"
 sof20_AMI.1.b:0 "先补充地方守备"
 sof20_AMI.1.d:0 "处在北方工业与首都之间，亚眠既能从运输获益，也会被大军的通道需求压迫。农业财政和交通安全决定它能否保持主动。\n共同会议必须把宣言变成预算、交通和可兑现的契约。"
 sof20_AMI.1.t:0 "亚眠的共同会议"
 sof20_AMI.2.a:0 "兑现公共保障"
 sof20_AMI.2.b:0 "优先紧急动员"
 sof20_AMI.2.d:0 "处在北方工业与首都之间，亚眠既能从运输获益，也会被大军的通道需求压迫。农业财政和交通安全决定它能否保持主动。\n农业共和必须决定先缓和地方争议，还是承担紧急任务的社会成本。"
 sof20_AMI.2.t:0 "农业共和的承诺"
