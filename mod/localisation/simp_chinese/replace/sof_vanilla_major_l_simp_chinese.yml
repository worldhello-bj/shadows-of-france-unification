 SFC_political_commissars_desc:0 "政治委员关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
 SFC_common_ground:0 "立足共识"
 sof_van_cor_ita_socialist_cooperation:0 "社会主义合作"
 sof_van_cor_ita_socialist_cooperation_desc:0 "社会主义合作。具体修正见下方效果。"
 SFC_common_ground_desc:0 "工人、地方代表与军队拥有共同关切。围绕供应、安全与公共秩序达成共识，为持续改革减少阻力。\n\n实施本项政策并调整对应民族精神。\n解锁历史内阁：阿尔奇德·德·加斯佩里（行政首席）、马里奥·谢尔巴（内政）、路易吉·艾瑙迪（财政）、安东尼奥·佩森蒂（财政）、乔瓦尼·杜卡（工业）、福斯托·古洛（工业）、维托里奥·埃马努埃莱·奥兰多（行政首席）、兰多尔福·帕恰尔迪（陆军）、路易吉·隆哥（陆军）、圭多·德·鲁杰罗（科研）、阿尔贝托·塔尔基亚尼（外交）。"
