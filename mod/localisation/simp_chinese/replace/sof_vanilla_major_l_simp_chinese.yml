 SFC_the_italian_republic:0 "科西嘉共和国"
 sof_van_cor_ita_disgruntled_military:0 "不满的军队"
 sof_van_cor_ita_disgruntled_military_desc:0 "不满的军队。具体修正见下方效果。"
 SFC_the_italian_republic_desc:0 "共和国应当给地方与公民明确的政治位置。结束个人统治的制度遗产，以共同代表和公共责任组织岛内政府。\n\n实施本项政策并调整对应民族精神。改善已经控制地区的地方合作与治理。\n解锁历史内阁：伊瓦诺埃·博诺米（行政首席）。\n由伊瓦诺埃·博诺米出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFC_the_popular_front:0 "人民阵线"
 SFC_the_popular_front_desc:0 "共和派与工人组织需要共同承担执政。建立人民阵线，将社会改革与岛内安全纳入一套可以执行的纲领。\n\n调整政府的执政方向，具体政体与支持度变化见效果。改善已经控制地区的地方合作与治理。\n解锁历史内阁：阿马德奥·博尔迪加（行政首席）、安东尼奥·佩森蒂（财政）、福斯托·古洛（工业）、路易吉·隆哥（陆军）。\n由阿马德奥·博尔迪加出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFC_the_garibaldi_legion:0 "科西嘉志愿军团"
 sof_van_cor_ita_the_garibaldi_legion_ns:0 "ITA_the_garibaldi_legion_ns"
