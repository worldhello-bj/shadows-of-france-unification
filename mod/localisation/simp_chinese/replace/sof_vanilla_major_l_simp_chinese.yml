 SFC_il_sol_dell_avvenire:0 "未来的太阳"
 SFC_il_sol_dell_avvenire_desc:0 "未来的太阳关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。实施本项政策并调整对应民族精神。扩大科研组织，研究槽总数上限为五槽。"
 SFC_italian_socialism:0 "科西嘉社会共和道路"
 SFC_italian_socialism_desc:0 "科西嘉社会共和道路关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n调整政府的执政方向，具体政体与支持度变化见效果。改善已经控制地区的地方合作与治理。\n解锁历史内阁：伊瓦诺埃·博诺米（行政首席）、兰多尔福·帕恰尔迪（陆军）、阿尔贝托·塔尔基亚尼（外交）。\n由伊瓦诺埃·博诺米出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
