 SFC_italo_balbo_focus:0 "军官内阁"
 SFC_italo_balbo_focus_desc:0 "军官集团主张用统一的指挥和责任制度稳定政府。让军官内阁接管行政，集中处理防务与动员。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：伊塔洛·巴尔博（行政首席）。\n由伊塔洛·巴尔博出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
