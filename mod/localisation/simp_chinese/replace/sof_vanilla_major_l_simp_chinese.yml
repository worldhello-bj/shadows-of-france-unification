 SFC_befriend_portugal_desc:0 "争取波尔多合作关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n向地区伙伴提议合作；对方可以拒绝。"
 SFC_unite_the_opposition:0 "团结反对派"
 SFC_unite_the_opposition_desc:0 "工人、共和派与地方自治派都反对个人统治。先明确共同纲领，让不同组织能够形成稳定的政治联盟。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：伊瓦诺埃·博诺米（行政首席）、阿马德奥·博尔迪加（行政首席）。"
 SFC_liberate_gramsci:0 "释放工人代表"
 SFC_liberate_gramsci_desc:0 "结束对工人代表的政治拘禁，让不同派别进入公开讨论。反对派的联合需要共同的政治承诺。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：安东尼奥·葛兰西（行政首席）。\n由安东尼奥·葛兰西出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFC_organize_strikes_in_the_north:0 "组织北方罢工"
 SFC_organize_strikes_in_the_north_desc:0 "北部工人拥有重要的生产与运输组织力量。通过公开协商和集体行动，把他们的要求带入政府改革。\n\n解锁“工人和解”决议。"
 SFC_the_southern_farmlands:0 "争取南方农业区"
 SFC_the_southern_farmlands_desc:0 "争取南方农业区将决定岛内工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n为实际控制区增加建设空间。"
 SFC_defy_the_duce:0 "拒绝独裁"
 SFC_defy_the_duce_desc:0 "地方代表决定公开拒绝领袖的命令。以代表制度重建政府，需要承担权力交接造成的短期紧张。\n\n调整政府的执政方向，具体政体与支持度变化见效果。\n解锁历史内阁：伊瓦诺埃·博诺米（行政首席）、阿马德奥·博尔迪加（行政首席）。"
 SFC_appeal_to_the_bourgeoisie:0 "拉拢资产阶级"
 sof_van_cor_ita_cooperation_of_the_bourgeoisie:0 "与资产阶级合作"
 sof_van_cor_ita_cooperation_of_the_bourgeoisie_desc:0 "统一战争的阶段性动员。领取后等待下一场战争；参战后的和平或完成全国统一时撤销，国策规定的期限仍然生效。"
 SFC_appeal_to_the_bourgeoisie_desc:0 "拉拢资产阶级关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_seize_old_equipment:0 "夺取旧式军备"
