 SFC_revoke_the_acerbo_law:0 "废除特权选举法"
 sof_van_cor_ita_political_reforms:0 "政治改革"
 sof_van_cor_ita_political_reforms_desc:0 "政治改革。具体修正见下方效果。"
 SFC_revoke_the_acerbo_law_desc:0 "倾斜的选举规则使政治竞争失去公信力。废除特权条款，为地方代表和温和派进入公共议事提供条件。\n\n实施本项政策并调整对应民族精神。改善已经控制地区的地方合作与治理。\n解锁历史内阁：阿尔奇德·德·加斯佩里（行政首席）、路易吉·艾瑙迪（财政）。"
 SFC_christian_democracy:0 "基督教民主"
 SFC_christian_democracy_desc:0 "基督教民主关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n调整政府的执政方向，具体政体与支持度变化见效果。改善已经控制地区的地方合作与治理。\n解锁历史内阁：阿尔奇德·德·加斯佩里（行政首席）、马里奥·谢尔巴（内政）。\n由阿尔奇德·德·加斯佩里出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFC_democratic_king:0 "立宪的波拿巴"
 SFC_democratic_king_desc:0 "岛内王朝派愿意接受宪法对权力的约束。以波拿巴传统为政治象征，探索王室支持与代表制度的共同基础。\n\n调整政府的执政方向，具体政体与支持度变化见效果。改善已经控制地区的地方合作与治理。\n解锁历史内阁：维托里奥·埃马努埃莱三世（行政首席）。\n由维托里奥·埃马努埃莱三世出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFC_cooperate_with_moderates:0 "与温和派合作"
 SFC_cooperate_with_moderates_desc:0 "与温和派合作关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：阿尔贝托·德·斯特凡尼（财政）、圭多·德·鲁杰罗（科研）、库尔齐奥·马拉帕尔特（外交）。"
