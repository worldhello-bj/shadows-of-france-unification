 SFP_league_of_french_bolshevist_volunteers_desc:0 "法国布尔什维克志愿者联盟关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
