 sof_van_local_police:0 "推行地方警务改革"
 sof_van_local_police_desc:0 "支付50政治点数，使完整控制且存在抵抗的法国地区顺从度增加5。"
 sof_van_workers_settlement:0 "与工人代表和解"
 sof_van_workers_settlement_desc:0 "支付50政治点数，稳定度增加3个百分点。"
 sof_van_invite_neighbour:0 "向同政体邻国提议合作"
 sof_van_invite_neighbour_desc:0 "支付35政治点数，向一名符合条件的邻国发出合作提案，对方可以拒绝。"
 sof_van_national_assembly:0 "召开全国代表会议"
 sof_van_national_assembly_desc:0 "和平时控制超过20个地区后，支付100政治点数召开全国代表会议。完成后取得统一宣告的政治授权；最终宣告仍须拥有并完整控制全法国。"
