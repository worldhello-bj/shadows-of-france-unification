 sof_van_native_policies_desc:0 "国策授权的采购、援助、治安与合作方案。费用和实际收益列于各项决议。"
 sof_van_diplomacy.1.t:0 "地区合作提案"
 sof_van_diplomacy.1.d:0 "[From.GetName]提议签署互不侵犯协定。若双方政体相同且提案国领导阵营，接受提案也将加入其阵营。"
