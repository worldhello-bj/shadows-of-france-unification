 SFC_power_to_the_king:0 "波拿巴委任"
 sof_van_cor_ita_political_reforms_monarchist:0 "ITA_political_reforms_monarchist"
 sof_van_cor_ita_political_reforms_monarchist_desc:0 "ITA_political_reforms_monarchist。具体修正见下方效果。"
 SFC_power_to_the_king_desc:0 "王朝派要求在政府中承担更大责任。以明确的委任制度集中行政权力，让王室支持者参与国家组织。\n\n实施本项政策并调整对应民族精神。\n解锁历史内阁：维托里奥·埃马努埃莱三世（行政首席）、阿尔贝托·德·斯特凡尼（财政）。"
 SFC_disband_the_blackshirts:0 "解散岛内卫队"
 SFC_disband_the_blackshirts_desc:0 "党派武装不能永远独立于公共秩序。解除岛内卫队的组织权力，让安全事务重新受到政府机构约束。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：阿尔奇德·德·加斯佩里（行政首席）。"
 SFC_utilize_the_blackshirts:0 "利用岛内卫队"
 SFC_utilize_the_blackshirts_desc:0 "岛内卫队拥有训练、地方联系与动员经验。将其纳入政府的军事准备，同时确定统一的指挥责任。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_expand_the_royal_guard:0 "扩编王室卫队"
 SFC_expand_the_royal_guard_desc:0 "扩编王室卫队关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。建立新的部队编制，征募与训练由本地军队执行。"
 SFC_gloria_al_regno_d_italia:0 "帝国复兴"
