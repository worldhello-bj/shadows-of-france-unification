 SFP_revolution_to_the_utmost:0 "向着极限革命"
 SFP_revolution_to_the_utmost_desc:0 "温和改革未能消除首都的结构性矛盾。革命派主张继续推进社会改造，把工人运动的要求贯彻到底。\n\n通过具体的财政、训练与社会措施完成本项改革。"
