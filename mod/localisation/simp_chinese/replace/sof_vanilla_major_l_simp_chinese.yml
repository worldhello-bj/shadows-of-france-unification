 sof_van_cor_ita_socialist_cooperation_improved:0 "ITA_socialist_cooperation_improved"
 sof_van_cor_ita_socialist_cooperation_improved_desc:0 "ITA_socialist_cooperation_improved。具体修正见下方效果。"
 SFC_appease_the_military_desc:0 "安抚军方关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
