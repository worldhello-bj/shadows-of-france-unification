 SFC_empower_the_unions_desc:0 "赋权工会关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_production_lines:0 "生产线"
 SFC_production_lines_desc:0 "生产线将决定岛内工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_the_republics_leadership:0 "共和国领导层"
 SFC_the_republics_leadership_desc:0 "共和国的执政机构需要得到公众认可。确定代表、政府与地方之间的责任，以稳定的制度支撑岛内改革。\n\n调整政府的执政方向，具体政体与支持度变化见效果。"
 SFC_bring_back_exiled_intellectuals:0 "迎回流亡知识分子"
 SFC_bring_back_exiled_intellectuals_desc:0 "流亡的学者和专业人员仍然与家乡保持联系。为他们返回岛内提供条件，使共和国的重建得到更多经验与知识。\n\n集中工程与科研力量，获得对应技术研究加成。"
 SFC_social_stability:0 "社会稳定"
 SFC_social_stability_desc:0 "社会稳定关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_aid_for_the_spanish_republic:0 "支援西南法国共和国"
 sof_van_cor_ita_aiding_the_spanish_republic:0 "援助西南法国共和国"
 sof_van_cor_ita_aiding_the_spanish_republic_desc:0 "统一战争的阶段性动员。领取后等待下一场战争；参战后的和平或完成全国统一时撤销，国策规定的期限仍然生效。"
 SFC_aid_for_the_spanish_republic_desc:0 "支援西南法国共和国关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n解锁“志愿军训练”决议。实施本项政策并调整对应民族精神。"
 SFC_italia_libera:0 "自由科西嘉"
 SFC_italia_libera_desc:0 "自由科西嘉关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_european_democracies:0 "与法国民主城市协作"
 SFC_european_democracies_desc:0 "与法国民主城市协作关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n向地区伙伴提议合作；对方可以拒绝。"
 SFC_peace_preservation:0 "维护和平"
 SFC_peace_preservation_desc:0 "长期战争已经耗尽居民的耐心。政府将转向维护和平与地区协作，为重建争取稳定的环境。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_scientific_cooperation:0 "科研合作"
 sof_van_cor_ita_scientific_cooperation_ns:0 "ITA_scientific_cooperation_ns"
 sof_van_cor_ita_scientific_cooperation_ns_desc:0 "ITA_scientific_cooperation_ns。具体修正见下方效果。"
 SFC_scientific_cooperation_desc:0 "科研合作关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。扩大科研组织，研究槽总数上限为五槽。\n建立地区科研合作组：本国及同阵营成员共享已研究技术的追赶加成，每名已掌握技术的伙伴提供基础15%加成；合作精神使该比例增加25%。离开阵营时退出合作组。"
 SFC_secure_the_borders:0 "保卫边境"
 SFC_secure_the_borders_desc:0 "保卫边境关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
