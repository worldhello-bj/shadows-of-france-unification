 SFP_ban_the_leagues:0 "查禁联盟"
 sof_van_prs_fra_political_violence:0 "政治暴力"
 sof_van_prs_fra_political_violence_desc:0 "政治暴力。具体修正见下方效果。"
 SFP_ban_the_leagues_desc:0 "街头武装与政治联盟削弱了政府的权威。查禁这些组织，将公开政治竞争重新纳入政府能够维持的秩序。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_the_blum_viollette_proposal:0 "地方公民权提案"
 SFP_the_blum_viollette_proposal_desc:0 "统一的政府必须承认地方居民的公民权。以平等的法律地位缓解占领地区的不信任，为长期整合创造条件。\n\n改善已经控制地区的地方合作与治理。"
 SFP_expand_the_citizenship:0 "扩大公民权"
 sof_van_prs_fra_expanded_citizenship:0 "拓展公民权"
 sof_van_prs_fra_expanded_citizenship_desc:0 "拓展公民权。具体修正见下方效果。"
 SFP_expand_the_citizenship_desc:0 "扩大公民权将为法国海军重建准备基础。有限的船厂和人员应当围绕明确的任务安排。\n\n实施本项政策并调整对应民族精神。"
 SFP_france_undividable:0 "牢不可破的法兰西"
