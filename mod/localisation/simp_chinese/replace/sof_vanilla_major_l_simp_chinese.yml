 SFC_military_agreements:0 "军事协议"
 SFC_military_agreements_desc:0 "军事协议关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n集中工程与科研力量，获得对应技术研究加成。向地区伙伴提议合作；对方可以拒绝。"
 SFC_the_enemies_of_capitalism:0 "联合工人阵线"
 SFC_the_enemies_of_capitalism_desc:0 "联合工人阵线关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_the_ethiopian_question:0 "科西嘉统一问题"
 SFC_the_ethiopian_question_desc:0 "岛内统一应当采用怎样的政治形式，已经无法回避。政府需要在各地区之间提出可执行的安排。\n\n取得指定地区的战役授权；正式领土整合仍需另行登记。"
 SFC_abolish_the_colonies:0 "废除地区特权"
 SFC_abolish_the_colonies_desc:0 "大陆居民不应因出身地区而被置于不同法律地位。废除地区特权，为共同治理建立更平等的基础。\n\n改善已经控制地区的地方合作与治理。"
 SFC_cooperatives_for_intensive_exploitation:0 "深度开发合作组织"
 SFC_cooperatives_for_intensive_exploitation_desc:0 "深度开发合作组织关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_condemn_colonialism:0 "反对大陆强权"
 SFC_condemn_colonialism_desc:0 "反对大陆强权关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n取得指定地区的战役授权；正式领土整合仍需另行登记。"
 SFC_new_colonial_policies:0 "平等的地方政策"
 SFC_new_colonial_policies_desc:0 "控制大陆地区之后，政府仍须回答居民的权利与地方代表问题。以平等的政策取代旧有特权，减少整合中的对抗。\n\n改善已经控制地区的地方合作与治理。"
 SFC_negotiations_with_albania:0 "与马赛谈判"
 SFC_negotiations_with_albania_desc:0 "与马赛谈判关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n向地区伙伴提议合作；对方可以拒绝。"
 SFC_enlist_the_bashkimi_kombetar:0 "招募大陆志愿军"
 SFC_enlist_the_bashkimi_kombetar_desc:0 "招募大陆志愿军关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n建立新的部队编制，征募与训练由本地军队执行。"
 SFC_the_italian_confederation:0 "科西嘉联邦"
 sof_van_cor_ita_italian_confederation_leader:0 "科西嘉邦联领袖"
 sof_van_cor_ita_italian_confederation_leader_desc:0 "联邦领导者的组织优势。仅在拥有至少一个附属国期间生效；失去全部附属国时撤销。"
 SFC_the_italian_confederation_desc:0 "科西嘉各地保有各自的政治传统。以共同规则连接地方自治，使联邦能够兼顾统一行动与地区代表。\n\n实施本项政策并调整对应民族精神。"
 SFC_planned_economy:0 "计划经济"
