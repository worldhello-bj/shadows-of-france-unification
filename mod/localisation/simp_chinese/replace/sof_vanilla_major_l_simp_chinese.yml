 SFC_combined_land_and_air_warfare:0 "空地一体化作战"
 SFC_combined_land_and_air_warfare_desc:0 "空地一体化作战需要明确的训练和装备标准。科西嘉军队将据此调整编制与作战方式。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_the_fourth_shore:0 "大陆桥头堡"
 SFC_the_fourth_shore_desc:0 "科西嘉需要大陆海岸作为跨海行动的落脚点。先取得普罗旺斯地区的战役授权，再组织后续登陆与整合。\n\n取得指定地区的战役授权；正式领土整合仍需另行登记。"
 SFC_oil_in_tripoli:0 "桥头堡燃料供应"
 SFC_oil_in_tripoli_desc:0 "桥头堡燃料供应关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。改善实际控制区的资源供应。集中工程与科研力量，获得对应技术研究加成。"
 SFC_steel_in_tripoli:0 "桥头堡钢铁供应"
