 SFC_irregulars:0 "非正规军"
 SFC_irregulars_desc:0 "非正规军关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。建立新的部队编制，征募与训练由本地军队执行。"
 SFC_liberate_the_workers_of_africa:0 "解放南方工人"
 SFC_liberate_the_workers_of_africa_desc:0 "解放南方工人关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n取得指定地区的战役授权；正式领土整合仍需另行登记。改善已经控制地区的地方合作与治理。"
 SFC_ascari:0 "地区卫兵"
 SFC_ascari_desc:0 "地区卫兵关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。建立新的部队编制，征募与训练由本地军队执行。"
