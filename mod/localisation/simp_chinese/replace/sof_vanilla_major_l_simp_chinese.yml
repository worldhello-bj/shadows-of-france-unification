 SFC_planned_economy_desc:0 "计划经济关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
 SFC_the_fight_overseas:0 "跨海作战"
