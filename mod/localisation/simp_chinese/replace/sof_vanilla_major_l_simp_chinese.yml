 SFC_special_brigades:0 "特种部队"
 SFC_special_brigades_desc:0 "特种部队需要明确的训练和装备标准。科西嘉军队将据此调整编制与作战方式。\n\n集中工程与科研力量，获得对应技术研究加成。"
 SFC_defend_the_land:0 "保卫国土"
 SFC_defend_the_land_desc:0 "岛内各地必须共同承担防务。建立岛内阵线，为地区合作与抵御外部威胁提供共同组织。\n\n建立地区合作阵线，伙伴加入仍需另行协商。"
 SFC_united_anarchist_confederations:0 "地方自治联盟"
 SFC_united_anarchist_confederations_desc:0 "地方自治派希望以自愿合作取代个人统治。连接各地组织，让共同防务与公共事务建立在地方代表之上。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_the_fight_against_stalinism:0 "反对集权主义"
 sof_van_cor_ita_the_fight_against_stalinism:0 "反对集权主义"
 sof_van_cor_ita_the_fight_against_stalinism_desc:0 "以军事政策支持本地统一战争，在国策规定的期限内改善本国部队的作战能力。"
 SFC_the_fight_against_stalinism_desc:0 "集中过多权力可能重新造成个人统治。自治派将反对新的集权倾向，维护地方组织在政治中的地位。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_raise_the_peoples:0 "发动群众"
