 SFP_devalue_the_franc:0 "统一首都货币"
 sof_van_prs_fra_devalue_the_franc:0 "统一首都货币"
 sof_van_prs_fra_devalue_the_franc_desc:0 "统一首都货币。具体修正见下方效果。"
 SFP_devalue_the_franc_desc:0 "各城区使用不同的征税与结算办法，首都的经济因此被割裂。统一货币与财政口径，是巴黎重新组织工业的第一步。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：樊尚·奥里奥尔（财政）。"
 SFP_autoroutes:0 "高速公路"
 SFP_autoroutes_desc:0 "高速公路关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。"
 SFP_invest_in_the_metropole:0 "开发本土"
 SFP_invest_in_the_metropole_desc:0 "首都的工场与居民区必须共同承担动员。先改善已经掌握的工业基础，再为更大规模的生产准备条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_metropolitan_france:0 "首都工业腹地"
 SFP_metropolitan_france_desc:0 "先把首都周边的土地与工场组织起来。稳定的工业腹地将为后续建设提供落脚点。\n\n为实际控制区增加建设空间。"
 SFP_industrial_expansion:0 "工业扩张"
 SFP_industrial_expansion_desc:0 "工业扩张将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。\n解锁历史内阁：路易·雷诺（工业）。"
 SFP_military_factories:0 "军用工厂"
 SFP_military_factories_desc:0 "军用工厂将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。"
 SFP_algerie_france:0 "卢瓦尔发展计划"
 SFP_algerie_france_desc:0 "巴黎不能独自承担全国重建。与卢瓦尔地区建立经济联系，为未来的工业协作准备空间和制度。\n\n为实际控制区增加建设空间。"
 SFP_invest_in_the_colonies:0 "地方发展投资"
 SFP_invest_in_the_colonies_desc:0 "地方重建需要可靠的预算和规划。把新的投资安排纳入统一财政，为首都以外的生产与交通恢复积累资源。\n\n改善已经控制地区的地方合作与治理。"
 SFP_invest_in_west_africa:0 "投资布列塔尼"
 SFP_invest_in_west_africa_desc:0 "西部地区拥有港口和熟练工人。将布列塔尼纳入发展规划，逐步扩大巴黎能够依靠的工业腹地。\n\n为实际控制区增加建设空间。"
 SFP_invest_in_indochina:0 "投资诺曼底"
 SFP_invest_in_indochina_desc:0 "诺曼底的交通与沿海工业对全国重建十分重要。以现有控制区的建设为起点，准备连接首都与西北海岸。\n\n为实际控制区增加建设空间。"
 SFP_invest_in_syria:0 "投资香槟"
 SFP_invest_in_syria_desc:0 "香槟是首都通向东部的门户。改善现有生产设施，使地区建设能够支撑后续的军备与交通需求。\n\n为实际控制区增加建设空间。"
 SFP_colonial_industry:0 "地方工业建设"
 SFP_colonial_industry_desc:0 "地方工业建设将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。"
