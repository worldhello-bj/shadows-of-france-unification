 SFP_french_union:0 "法兰西联邦"
 SFP_french_union_desc:0 "法兰西联邦的承诺，应当体现在地方居民每天的生活中。我们将把治理与公民权改革推向已经控制的地区。\n\n改善已经控制地区的地方合作与治理。"
 SFP_encourage_immigration:0 "鼓励移民"
 sof_van_prs_fra_full_employment:0 "充分就业"
 sof_van_prs_fra_full_employment_desc:0 "充分就业。具体修正见下方效果。"
 SFP_encourage_immigration_desc:0 "割据与失业迫使许多居民离开家乡。向愿意参与重建的人开放安置与工作机会，缓解首都的劳动力不足。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_review_foreign_policy:0 "重审外交政策"
 SFP_review_foreign_policy_desc:0 "巴黎必须重新认识周围的城市势力。以安全、交通与贸易为依据，决定哪些伙伴值得长期合作。\n\n通过具体的财政、训练与社会措施完成本项改革。"
