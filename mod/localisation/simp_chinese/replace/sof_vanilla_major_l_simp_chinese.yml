 sof_van_acknowledge:0 "继续谈判"
 sof_van_buy_arms:0 "向地区市场采购武器"
 sof_van_buy_arms_desc:0 "支付75政治点数，购入200件基础步兵装备和25件支援装备。每180天可执行一次。"
 sof_van_invest_ally:0 "援建盟友工厂"
 sof_van_invest_ally_desc:0 "支付75政治点数，为一名阵营盟友在有空位且完整控制的法国地区建设一座民用工厂。"
 sof_van_train_volunteers:0 "组织志愿军训练"
