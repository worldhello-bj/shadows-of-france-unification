 SFC_the_garibaldi_legion_desc:0 "科西嘉志愿军团关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
