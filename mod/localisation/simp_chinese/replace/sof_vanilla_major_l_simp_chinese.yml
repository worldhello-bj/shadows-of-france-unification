 SFC_a_new_era_for_the_red_shirts_desc:0 "工人卫队的新任务关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_pugno_alzato:0 "举起拳头"
 SFC_pugno_alzato_desc:0 "举起拳头关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_a_leader_steps_forward:0 "推举领袖"
 SFC_a_leader_steps_forward_desc:0 "工人运动需要能够承担公共责任的代表。推举共同领导，使分散的组织能够形成明确的政府方向。\n\n调整政府的执政方向，具体政体与支持度变化见效果。"
 SFC_the_path_to_progress:0 "进步之路"
 SFC_the_path_to_progress_desc:0 "进步之路关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFC_industrial_socialization:0 "工业社会化"
 SFC_industrial_socialization_desc:0 "岛内工场的生产安排关系到全体居民的供应。扩大公共管理和劳动者参与，使工业建设服从共同规划。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。"
 SFC_institute_the_five_year_plan:0 "制定五年计划"
 SFC_institute_the_five_year_plan_desc:0 "有限的设备、熟练工人与资金需要集中安排。以五年计划明确投入次序，逐步建立稳定的岛内工业基础。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
 SFC_new_ricostruzione_industriale:0 "工业重建所焕新"
 SFC_new_ricostruzione_industriale_desc:0 "工业重建所焕新将决定岛内工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n改善对应军队或工业体系，修正累积计入组织能力。"
