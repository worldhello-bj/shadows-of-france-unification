 SFC_convene_the_grand_council:0 "召集岛内委员会"
 SFC_convene_the_grand_council_desc:0 "岛内各派必须在同一张议事桌上承担责任。召集委员会，让财政、军备与地方事务获得共同决定。\n\n通过具体的财政、训练与社会措施完成本项改革。\n解锁历史内阁：彼得罗·达夸罗内（内政）。"
