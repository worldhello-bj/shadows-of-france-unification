 SFP_form_the_popular_front_desc:0 "工人组织与共和派需要共同面对首都的政治危机。人民阵线将以议会合作为基础，争取一套能够共同执行的改革纲领。\n\n调整政府的执政方向，具体政体与支持度变化见效果。\n解锁历史内阁：莱昂·布鲁姆（行政首席）。\n由莱昂·布鲁姆出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFP_invite_communist_ministers:0 "任命共产主义部长"
 SFP_invite_communist_ministers_desc:0 "工人运动要求参与政府，直接承担公共事务。任命其代表承担行政职责，将使联合政府的政治重心发生改变。\n\n调整政府的执政方向，具体政体与支持度变化见效果。"
 SFP_strengthen_the_unions:0 "强化工会"
 SFP_strengthen_the_unions_desc:0 "工会连接着生产线与街区。承认它们的组织力量，让劳动者能够参与动员、生产安排与社会协商。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_celebrate_the_commune:0 "纪念公社"
 SFP_celebrate_the_commune_desc:0 "公社的记忆仍然影响着巴黎的工人运动。公开纪念这一传统，使政府的改革承诺获得更鲜明的政治方向。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_womens_suffrage:0 "妇女普选权"
 sof_van_prs_fra_womens_suffrage:0 "妇女普选权"
 sof_van_prs_fra_womens_suffrage_desc:0 "妇女普选权。具体修正见下方效果。"
 SFP_womens_suffrage_desc:0 "妇女普选权关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
 SFP_legal_equality:0 "法律平等"
 SFP_legal_equality_desc:0 "法律平等关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_industrial_collectivization:0 "工业集体化"
 SFP_industrial_collectivization_desc:0 "工业集体化将决定首都工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。"
 SFP_agricultural_collectivization:0 "农业集体化"
 sof_van_prs_fra_agricultural_collectivization:0 "农业集体化"
 sof_van_prs_fra_agricultural_collectivization_desc:0 "农业集体化。具体修正见下方效果。"
 SFP_agricultural_collectivization_desc:0 "农业集体化关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n实施本项政策并调整对应民族精神。"
 SFP_force_the_issue:0 "强迫抉择"
 sof_van_prs_fra_disjointed_government:0 "混乱的政府"
 sof_van_prs_fra_disjointed_government_desc:0 "混乱的政府。具体修正见下方效果。"
 SFP_force_the_issue_desc:0 "联合政府的分歧已经阻碍决策。工人派要求明确掌握政权，并承担由此带来的社会冲突与改革责任。\n\n调整政府的执政方向，具体政体与支持度变化见效果。"
 SFP_reconciliation:0 "和解"
 SFP_reconciliation_desc:0 "长期的街头对抗让每一项改革都付出额外代价。以政治和解结束僵局，为政府争取持续执政的基础。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_constitutional_convention:0 "制宪大会"
 SFP_constitutional_convention_desc:0 "旧有制度无法回答割据时代的权力归属。召集制宪会议，明确政府、地方与公民之间的责任和权利。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_anti_fascist_coalition:0 "反法西斯联盟"
 SFP_anti_fascist_coalition_desc:0 "各地的共和派与工人组织面对同样的威胁。以共同的政治目标建立合作，使首都不再孤立。\n\n建立地区合作阵线，伙伴加入仍需另行协商。\n解锁历史内阁：勒内·尼科德（行政首席）。\n由勒内·尼科德出任政府领袖。同时免费任命其为行政首席；替换本栏现任成员。"
 SFP_invite_anti_fascist_emigrants:0 "邀请反法西斯移民"
 sof_van_prs_fra_anti_fascist_immigrants:0 "反法西斯移民"
 sof_van_prs_fra_anti_fascist_immigrants_desc:0 "反法西斯移民。具体修正见下方效果。"
 SFP_invite_anti_fascist_emigrants_desc:0 "逃离强权统治的人们带来了技术、经验和政治联系。为他们提供立足之地，也为巴黎的改革补充人才。\n\n实施本项政策并调整对应民族精神。"
 SFP_reconnect_to_the_balkans:0 "联系东部城市"
 SFP_reconnect_to_the_balkans_desc:0 "东部城市同样面对边境冲突与市场破碎。先提出能够被接受的合作方案，再讨论更紧密的政治联系。\n\n向地区伙伴提议合作；对方可以拒绝。"
 SFP_pre_empt_the_fascist_attack:0 "对法西斯先发制人"
 SFP_pre_empt_the_fascist_attack_desc:0 "东部边境的冲突随时可能扩大。政府决定提前准备统一行动，但对地区势力的战争仍须遵守既有授权条件。\n\n取得指定地区的战役授权；正式领土整合仍需另行登记。"
 SFP_loyalty_to_moscow:0 "与东方盟友协作"
 SFP_loyalty_to_moscow_desc:0 "巴黎的工人政府需要可靠的地区伙伴。向梅斯提出合作，以共同的安全安排支撑今后的政治协作。\n\n向地区伙伴提议合作；对方可以拒绝。"
 SFP_league_of_french_bolshevist_volunteers:0 "法国布尔什维克志愿者联盟"
 sof_van_prs_fra_league_of_french_bolshevist_volunteers:0 "法国布尔什维克志愿者联盟"
