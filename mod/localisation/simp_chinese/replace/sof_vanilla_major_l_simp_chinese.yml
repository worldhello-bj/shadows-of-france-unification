 SFC_monarchia_d_italia:0 "科西嘉君主政体"
 SFC_monarchia_d_italia_desc:0 "科西嘉君主政体关系到科西嘉政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n调整政府的执政方向，具体政体与支持度变化见效果。改善已经控制地区的地方合作与治理。\n解锁历史内阁：维托里奥·埃马努埃莱·奥兰多（行政首席）。"
 SFC_extraction_industry:0 "采掘工业"
 SFC_extraction_industry_desc:0 "采掘工业将决定岛内工场能否承担统一战争的需求。把分散的产能组织起来，让投入形成稳定的供应。\n\n在实际拥有并完整控制的法国地区进行建设，空间不足时提供财政补助。为实际控制区增加建设空间。改善实际控制区的资源供应。改善对应军队或工业体系，修正累积计入组织能力。"
