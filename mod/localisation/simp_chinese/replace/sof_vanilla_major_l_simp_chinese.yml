 SFP_support_the_finns:0 "援助北方伙伴"
 SFP_support_the_finns_desc:0 "援助北方伙伴关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n通过具体的财政、训练与社会措施完成本项改革。"
 SFP_confirm_eastern_commitments:0 "重申东方承诺"
 SFP_confirm_eastern_commitments_desc:0 "重申东方承诺关系到巴黎政府下一步的方向。把这一主张落实为政策，为后续建设、治理与地区合作创造条件。\n\n向地区伙伴提议合作；对方可以拒绝。\n解锁历史内阁：勒内·马西利（外交）。"
 SFP_strengthen_the_little_entente:0 "巩固东部协约"
