 sof_chr_anniversary_news_observer_a_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“重新确认共同公民责任”。\n\n正式统一之后，国家已连续度过至少三百六十五天的和平。政府借纪念重新确认国家记忆的组织方向，公众也开始用日常生活检验战时承诺。统一的故事正在离开紧急宣言，进入能够被长期评价的制度。"
 sof_chr_anniversary_news_observer_b_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“以公开研究保存统一经历”。\n\n正式统一之后，国家已连续度过至少三百六十五天的和平。政府借纪念重新确认国家记忆的组织方向，公众也开始用日常生活检验战时承诺。统一的故事正在离开紧急宣言，进入能够被长期评价的制度。"
 sof_chr_settlement_t:0 "战争目标之后的政治目标"
 sof_chr_settlement_d:0 "战后安排的国策已经完成，政府必须把全国使命转化为和平制度。集中行政可以明确责任，但新国家也需要让各地看到承诺如何落实。我们可以完善共同标准，或通过地方授权保留公共参与。此次选择替换既有整合精神，并尊重原有集中或联邦框架；宏大的统一叙事将在日常治理中接受检验。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_settlement_option_a:0 "完善全国共同标准（30 政治点）"
 sof_chr_settlement_option_b:0 "落实地方授权责任（30 政治点）"
 sof_chr_keep:0 "维持现状，结束本次议题"
 sof_chr_ack:0 "记录这项国家进程。"
 sof_chr_cost_tt:0 "需要相应政治点，且议题条件在选择时仍然成立。"
 sof_chr_policy_replace_tt:0 "替换同一方向既有政策，不重复叠加精神。"
 sof_chr_keep_tt:0 "不扣政治点，也不新增精神；本次议题结束。"
 sof_chr_war_news_actor_t:0 "我方进程：统一之战公开爆发"
 sof_chr_war_news_actor_d:0 "我方已经与[sof_chr_other.GetName]处于公开战争。\n\n两个法国政权已经公开进入战争，[sof_chr_actor.GetName]与[sof_chr_other.GetName]成为交战双方。地方对峙由此越过外交与动员，进入真实的战场。双方都以各自的国家方案解释行动，谁能代表全国仍有待战争与政治程序决定。\n\n宣战不等于占领，战果也不自动等于统一；重要城市的控制变化将由独立战报继续报道。"
 sof_chr_war_news_rival_t:0 "对方通报：统一之战公开爆发"
 sof_chr_war_news_rival_d:0 "我方已经与[sof_chr_actor.GetName]处于公开战争。\n\n两个法国政权已经公开进入战争，[sof_chr_actor.GetName]与[sof_chr_other.GetName]成为交战双方。地方对峙由此越过外交与动员，进入真实的战场。双方都以各自的国家方案解释行动，谁能代表全国仍有待战争与政治程序决定。\n\n宣战不等于占领，战果也不自动等于统一；重要城市的控制变化将由独立战报继续报道。"
 sof_chr_war_news_observer_t:0 "统一之战公开爆发"
 sof_chr_war_news_observer_d:0 "法国的政治分裂再次化为公开交战。\n\n两个法国政权已经公开进入战争，[sof_chr_actor.GetName]与[sof_chr_other.GetName]成为交战双方。地方对峙由此越过外交与动员，进入真实的战场。双方都以各自的国家方案解释行动，谁能代表全国仍有待战争与政治程序决定。\n\n宣战不等于占领，战果也不自动等于统一；重要城市的控制变化将由独立战报继续报道。"
 sof_chr_capitulation_news_actor_t:0 "我方进程：一个大区政权退出战场"
 sof_chr_capitulation_news_actor_d:0 "[sof_chr_other.GetName]已在与我方的战争中投降。\n\n[sof_chr_other.GetName]已经在与[sof_chr_actor.GetName]的战争中投降。其独立作战能力受到决定性打击，原有全国方案也面临政治与行政上的重组。胜方现在需要证明，它能承担超出战场的责任。\n\n投降并不表示全部领土已被合法吞并，也不证明全国统一已经完成。领土归属仍依现有战争与和平规则处理。"
 sof_chr_capitulation_news_rival_t:0 "对方通报：一个大区政权退出战场"
 sof_chr_capitulation_news_rival_d:0 "我方已经向[sof_chr_actor.GetName]投降。战后命运仍取决于实际的领土与和平安排。\n\n[sof_chr_other.GetName]已经在与[sof_chr_actor.GetName]的战争中投降。其独立作战能力受到决定性打击，原有全国方案也面临政治与行政上的重组。胜方现在需要证明，它能承担超出战场的责任。\n\n投降并不表示全部领土已被合法吞并，也不证明全国统一已经完成。领土归属仍依现有战争与和平规则处理。"
 sof_chr_capitulation_news_observer_t:0 "一个大区政权退出战场"
 sof_chr_capitulation_news_observer_d:0 "一个拥有全国方案的大区政权已经投降。\n\n[sof_chr_other.GetName]已经在与[sof_chr_actor.GetName]的战争中投降。其独立作战能力受到决定性打击，原有全国方案也面临政治与行政上的重组。胜方现在需要证明，它能承担超出战场的责任。\n\n投降并不表示全部领土已被合法吞并，也不证明全国统一已经完成。领土归属仍依现有战争与和平规则处理。"
 sof_chr_annexation_news_actor_t:0 "我方进程：一个大区完成行政并入"
 sof_chr_annexation_news_actor_d:0 "[sof_chr_other.GetName]的独立国家机构已并入我方统辖。\n\n[sof_chr_other.GetName]的独立国家机构已经随实际吞并转入[sof_chr_actor.GetName]。新的统辖者将面对不同账册、人员与公共责任；行政并入需要比军事命令更长久的制度。\n\n这条报道依据已经完成的国家并入，只记录国家层面的并入，不把它写成新的胜利点占领，也不推定战斗、谈判或和平会议中的具体过程。"
 sof_chr_annexation_news_rival_t:0 "对方通报：一个大区完成行政并入"
 sof_chr_annexation_news_rival_d:0 "我方原有的独立国家机构已被并入[sof_chr_actor.GetName]。\n\n[sof_chr_other.GetName]的独立国家机构已经随实际吞并转入[sof_chr_actor.GetName]。新的统辖者将面对不同账册、人员与公共责任；行政并入需要比军事命令更长久的制度。\n\n这条报道依据已经完成的国家并入，只记录国家层面的并入，不把它写成新的胜利点占领，也不推定战斗、谈判或和平会议中的具体过程。"
 sof_chr_annexation_news_observer_t:0 "一个大区完成行政并入"
 sof_chr_annexation_news_observer_d:0 "法国一个大区的独立国家机构完成并入。\n\n[sof_chr_other.GetName]的独立国家机构已经随实际吞并转入[sof_chr_actor.GetName]。新的统辖者将面对不同账册、人员与公共责任；行政并入需要比军事命令更长久的制度。\n\n这条报道依据已经完成的国家并入，只记录国家层面的并入，不把它写成新的胜利点占领，也不推定战斗、谈判或和平会议中的具体过程。"
 sof_chr_fifty_news_actor_t:0 "我方进程：统一事业跨过五十州"
 sof_chr_fifty_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]的直接统辖已达到至少五十个完全控制的法国州。这个规模使地方行政面对跨区资源、民政和军事协调的新责任，国家方案开始受到更大的现实检验。\n\n统计只包含它实际拥有且完全控制的法国州，不把盟友地盘、单个城市的占领或部分争夺中的州计入。疆界扩大仍不等于全国统一。"
 sof_chr_fifty_news_rival_t:0 "交战对手动态：统一事业跨过五十州"
 sof_chr_fifty_news_rival_d:0 "这一变化正在影响与我方交战的政治力量；前线和外交机构都在评估它的后果。\n\n[sof_chr_actor.GetName]的直接统辖已达到至少五十个完全控制的法国州。这个规模使地方行政面对跨区资源、民政和军事协调的新责任，国家方案开始受到更大的现实检验。\n\n统计只包含它实际拥有且完全控制的法国州，不把盟友地盘、单个城市的占领或部分争夺中的州计入。疆界扩大仍不等于全国统一。"
 sof_chr_fifty_news_observer_t:0 "统一事业跨过五十州"
 sof_chr_fifty_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n[sof_chr_actor.GetName]的直接统辖已达到至少五十个完全控制的法国州。这个规模使地方行政面对跨区资源、民政和军事协调的新责任，国家方案开始受到更大的现实检验。\n\n统计只包含它实际拥有且完全控制的法国州，不把盟友地盘、单个城市的占领或部分争夺中的州计入。疆界扩大仍不等于全国统一。"
 sof_chr_hundred_news_actor_t:0 "我方进程：一百州之后的国家问题"
 sof_chr_hundred_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n至少一百个法国州已经由[sof_chr_actor.GetName]同时拥有并完全控制。日益广阔的辖区让各地开始追问，统一行政、代表权和共同财政应怎样共存。地方根据地正在被一个更大的国家框架取代。\n\n这一门槛衡量直接统辖，不代表所有法国州已收复，也不替代宪制、统一宣告或战后安排。"
 sof_chr_hundred_news_rival_t:0 "交战对手动态：一百州之后的国家问题"
 sof_chr_hundred_news_rival_d:0 "这一变化正在影响与我方交战的政治力量；前线和外交机构都在评估它的后果。\n\n至少一百个法国州已经由[sof_chr_actor.GetName]同时拥有并完全控制。日益广阔的辖区让各地开始追问，统一行政、代表权和共同财政应怎样共存。地方根据地正在被一个更大的国家框架取代。\n\n这一门槛衡量直接统辖，不代表所有法国州已收复，也不替代宪制、统一宣告或战后安排。"
