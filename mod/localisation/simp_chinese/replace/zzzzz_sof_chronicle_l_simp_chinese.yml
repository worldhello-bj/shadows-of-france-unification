 sof_chr_congress_t:0 "代表们抵达全国会议"
 sof_chr_congress_d:0 "全国会议的组织资格已经具备，代表们要求知道会场能否影响真正的政府决定。单纯宣布共识无法消除各地对权力的担忧。我们可以明确政府的共同执行责任，也可以把公开协商作为取得认可的常设程序。会议仍属于既有统一路线的一部分；这次决定不会强行改变其他国家的阵营或替它们签署并入协议。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_congress_option_a:0 "明确议决后的共同执行（30 政治点）"
 sof_chr_congress_option_b:0 "建立持续的代表协商（30 政治点）"
 sof_chr_congress_news_actor_t:0 "我方：代表们抵达全国会议"
 sof_chr_congress_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“明确议决后的共同执行”。\n\n全国会议不再只是一张邀请名单。政府就代表意见如何进入实际执行作出制度选择，各地将据此观察会场能否影响共同决策。参与和并入仍须通过既有政治与外交程序，尚未达成的协议不能由会场口号代签。"
 sof_chr_congress_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立持续的代表协商”。\n\n全国会议不再只是一张邀请名单。政府就代表意见如何进入实际执行作出制度选择，各地将据此观察会场能否影响共同决策。参与和并入仍须通过既有政治与外交程序，尚未达成的协议不能由会场口号代签。"
 sof_chr_congress_news_rival_t:0 "代表们抵达全国会议：国家政策新决定"
 sof_chr_congress_news_rival_a_d:0 "[sof_chr_actor.GetName]宣布调整国家政策。其支持者认为这是统一事业的推进，对手则质疑它能否兑现承诺。\n\n本次选择为“明确议决后的共同执行”。\n\n全国会议不再只是一张邀请名单。政府就代表意见如何进入实际执行作出制度选择，各地将据此观察会场能否影响共同决策。参与和并入仍须通过既有政治与外交程序，尚未达成的协议不能由会场口号代签。"
