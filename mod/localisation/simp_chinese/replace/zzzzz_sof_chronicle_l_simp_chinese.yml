 sof_chr_recovery_t:0 "退却之后的国家承诺"
 sof_chr_recovery_d:0 "投降压力已经回落，统一事业从退却中获得了重新组织的机会。军方希望把教训变成共同参谋制度，地方代表要求动员者对此前的牺牲作出解释。我们可以将重点放在专业指挥，也可以重新确立公民动员的责任。此次调整替换既有指挥精神，不会叠加同一套政策；前线好转更不意味着全国统一已经完成。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_recovery_option_a:0 "把教训写入参谋制度（25 政治点）"
 sof_chr_recovery_option_b:0 "重新确认公民动员责任（25 政治点）"
 sof_chr_recovery_news_actor_t:0 "我方：退却之后的国家承诺"
 sof_chr_recovery_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“把教训写入参谋制度”。\n\n此前上升的投降压力已经回落，政府趁机调整共同指挥制度。战役教训与公民动员责任进入长期组织，而非只停留在庆祝消息里。恢复主动为全国事业争取了空间，仍不意味着统一已经完成。"
 sof_chr_recovery_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“重新确认公民动员责任”。\n\n此前上升的投降压力已经回落，政府趁机调整共同指挥制度。战役教训与公民动员责任进入长期组织，而非只停留在庆祝消息里。恢复主动为全国事业争取了空间，仍不意味着统一已经完成。"
