 sof_chr_region_brd_t:0 "信用必须越过地方边界"
 sof_chr_region_brd_d:0 "波尔多商界愿意为新的国家承担风险，却要求知道债务将由谁偿还、港口收益将由谁监督。阿基坦的代表认为，大西洋贸易可以为统一战争和战后重建提供持续支撑，但旧式地方关卡会把这个目标撕碎。会议可以建立跨区国家信用与贸易规则，也可以用公开的利益分担契约争取地方信任。这份方案追求的是一个能够长期融资的法国，而不是一次性的商人捐款。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
