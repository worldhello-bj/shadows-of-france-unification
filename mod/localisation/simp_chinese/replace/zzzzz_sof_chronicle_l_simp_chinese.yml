 sof_chr_mandate_t:0 "谁能代表法兰西？"
 sof_chr_mandate_d:0 "全国使命的授权已经取得，授权本身却不能回答谁能监督政府。支持者把新机构视作结束割据的希望，各地的怀疑者则担心统一只是权力换了主人。内阁要求把宣言转成日常制度：集中行政责任可以加快决策，公开协商可以争取更广泛的服从。选择将改变政府依靠什么维持长期权威；它不会替代现有政党、选举或统一战争的资格条件。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_mandate_option_a:0 "明确行政责任（35 政治点）"
 sof_chr_mandate_option_b:0 "公开协商与监督（35 政治点）"
 sof_chr_mandate_news_actor_t:0 "我方：谁能代表法兰西？"
 sof_chr_mandate_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“明确行政责任”。\n\n围绕谁能代表法兰西的争论，已经进入具体制度层面。中央机关将按照所选政策组织责任，各地则会用命令是否可解释、承诺是否被兑现来检验新的权威。宣言之后的日常治理，正在决定全国使命能否持续。"
