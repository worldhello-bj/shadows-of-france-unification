 sof_chr_region_met_b_desc:0 "洛林提出的全国制度方向，服务于冶金军工与东部国防。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_met_t:0 "钢铁与国家边界"
 sof_chr_region_met_d:0 "梅斯的议事厅把东部国防视作整个法国的责任。洛林的冶金与军工既能支撑统一战争，也可能在没有共同国家的情况下成为各地争夺的目标。工业代表希望建立跨区军工标准和统一采购，地方代表则要求在国防共同体中明确各地的权利与义务。会议讨论的是未来国家如何保护和使用东部工业，而不是孤立地修补一段防线。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
