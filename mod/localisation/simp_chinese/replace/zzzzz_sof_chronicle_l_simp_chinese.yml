 sof_chr_archives_t:0 "把分裂的档案放在一起"
 sof_chr_archives_d:0 "纪念制度已经建立，来自各地的行政和战争材料仍保留彼此冲突的说法。研究者希望公开资料，让新国家承认真实的分歧；政府也可以继续把重点放在共同公民责任上。选择将调整同一国家记忆精神，不会重复叠加奖励，也不会声称任何具体历史争议已经由事件自动解决。法国的共同经历值得被记录，而不只是被宣布。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_archives_option_a:0 "以共同责任组织国家记忆（20 政治点）"
 sof_chr_archives_option_b:0 "让档案与研究保留分歧（20 政治点）"
 sof_chr_foreign_t:0 "统一法国重新面对世界"
 sof_chr_foreign_d:0 "国家重新统一，并不意味着外部世界会立即接受其全部主张。外交机构需要解释新政府如何承担海陆安全、贸易和国际责任。我们可以以共同国防和可靠威慑争取地位，也可以优先组织外交承认与持续合作。此次选择提供外交方向的长期精神，不会自动索取领土、强迫他国加入阵营或制造一场世界大战。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_foreign_option_a:0 "以共同国防争取地位（40 政治点）"
 sof_chr_foreign_option_b:0 "建立持续外交与合作（40 政治点）"
 sof_chr_foreign_news_actor_t:0 "我方：统一法国重新面对世界"
 sof_chr_foreign_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“以共同国防争取地位”。\n\n重新统一的法国开始说明自己在国际政治中的责任。共同国防、国家地位、外交承认和持续合作将沿所选取向组织。外部关系仍需通过实际交涉推进，这份政策本身不构成领土转移或他国的外交承诺。"
 sof_chr_foreign_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立持续外交与合作”。\n\n重新统一的法国开始说明自己在国际政治中的责任。共同国防、国家地位、外交承认和持续合作将沿所选取向组织。外部关系仍需通过实际交涉推进，这份政策本身不构成领土转移或他国的外交承诺。"
