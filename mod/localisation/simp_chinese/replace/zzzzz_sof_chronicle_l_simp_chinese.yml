 sof_chr_industry_t:0 "一份服务全国的生产计划"
 sof_chr_industry_d:0 "工业统筹已经越过初建阶段，各地企业开始询问订单、标准与劳动力将如何分配。参谋部要求长期稳定的军需采购，民政机构提醒战争结束后仍需恢复民用经济。计划不能靠一次赠送库存解决问题。我们必须选择一种能持续运转的生产制度，并承担它对另一部分经济的压力。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_industry_option_a:0 "建立共同军需采购（40 政治点）"
 sof_chr_industry_option_b:0 "维持军民协调生产（40 政治点）"
 sof_chr_industry_news_actor_t:0 "我方：一份服务全国的生产计划"
 sof_chr_industry_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立共同军需采购”。\n\n共同订单、质量标准和长期生产安排开始纳入国家计划。军方希望减少各地自行采购的混乱，民政机构关注战后仍能延续的经济。新的制度将持续影响生产取向，单独一批物资无法代替这种组织能力。"
 sof_chr_industry_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“维持军民协调生产”。\n\n共同订单、质量标准和长期生产安排开始纳入国家计划。军方希望减少各地自行采购的混乱，民政机构关注战后仍能延续的经济。新的制度将持续影响生产取向，单独一批物资无法代替这种组织能力。"
