 sof_chr_region_bes_t:0 "精密工业与共同国防"
 sof_chr_region_bes_d:0 "贝桑松的工场能制造精密部件，却无法独自承担漫长的东部防线。工程师把技术标准视作统一的起点，地方代表则希望在共同国防中取得平等席位。议事厅据此提出两种国家方案：以统一质量标准和技术教育支撑军队，或通过各地共同管理的国防契约凝聚资源。弗朗什孔泰的价值将体现在新国家的制度中，而不应停留在某一批零件的交付数量上。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
