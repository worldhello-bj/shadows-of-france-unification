 sof_chr_integration_t:0 "占领之后还需要一个国家"
 sof_chr_integration_d:0 "我们的直接统辖范围已经扩大到至少五十个完全控制的法国州。不同的账册、命令和地方法规开始使行政陷入重复与冲突。官员提出统一行政标准，地方代表则希望通过授权保留熟悉的办事机构。军事占领和合法所有权并不相同，事件也不会自动给予核心或吞并其他国家；它决定的是我们如何组织已经实际统辖的地区。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_integration_option_a:0 "建立共同行政标准（40 政治点）"
 sof_chr_integration_option_b:0 "通过地方授权完成整合（40 政治点）"
 sof_chr_integration_news_actor_t:0 "我方：占领之后还需要一个国家"
 sof_chr_integration_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立共同行政标准”。\n\n直接拥有并完全控制至少五十个法国州后，政府开始处理账册、行政标准与地方机构之间的冲突。所选政策试图把扩大的统辖范围变成可持续治理的国家。军事成果正在面对办事规则和公共责任的检验。"
 sof_chr_integration_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“通过地方授权完成整合”。\n\n直接拥有并完全控制至少五十个法国州后，政府开始处理账册、行政标准与地方机构之间的冲突。所选政策试图把扩大的统辖范围变成可持续治理的国家。军事成果正在面对办事规则和公共责任的检验。"
