 sof_chr_region_mrs_t:0 "港口之外的共和国"
 sof_chr_region_mrs_d:0 "马赛的码头连接海外贸易，内陆公路连接南方社会；两种网络都不能代替一个全国政府。港口工人、军官与政治代表在同一张桌上讨论统一方案：以地中海运输和共同供给支撑全国行动，或用可供外省接受的政治契约扩大南方动员。会议的目标已经越过码头的一次罢工或一批货物，而是让港口成为新国家的门户。所选制度会长期塑造动员能力，具体外交与政党路线仍由既有机构决定。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
