 sof_chr_region_poi_t:0 "军械与统一的承诺"
 sof_chr_region_poi_d:0 "普瓦捷的代表将西部军械工业与全国政治联系起来。统一规格可以减少军需混乱，但命令的发出者也必须对各地承担责任。技术人员希望建立共同军械体系，政治代表则主张以公开的资源和公民契约支持西部统一。这份计划会把普瓦图－夏朗德的制造能力转成长期国家制度，而不是用一次库存交付宣布统一已经完成。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
