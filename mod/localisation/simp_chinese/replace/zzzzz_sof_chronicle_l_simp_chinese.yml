 sof_chr_region_lyo_a_desc:0 "罗讷－阿尔卑斯提出的全国制度方向，服务于机械工业与国家现代化。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_lyo_b:0 "产业与公民建国公约"
 sof_chr_region_lyo_b_desc:0 "罗讷－阿尔卑斯提出的全国制度方向，服务于机械工业与国家现代化。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_lyo_t:0 "机械工业必须组织一个国家"
 sof_chr_region_lyo_d:0 "里昂的机械工业能够支撑现代军队，但现代化不能只发生在机器上。罗讷－阿尔卑斯的代表提出，技术教育、工业标准和中央协调必须一起推进，才能把生产优势变成国家能力。我们可以建立工程师主导的全国工业协作体系，也可以先用公开的产业与公民契约汇集各地支持。两条路线都要把地方工业带入统一事业，而不是把国家目标缩成一家工厂的扩张。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
