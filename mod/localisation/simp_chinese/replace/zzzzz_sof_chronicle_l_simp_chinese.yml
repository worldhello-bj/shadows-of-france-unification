 sof_chr_region_lmg_t:0 "利摩日的全国使命"
 sof_chr_region_lmg_d:0 "利摩日的工程师把电工、军械和纵深供给视作利穆赞参与建国的力量。政治代表提醒他们，技术网络只有在共同制度下才能越过地方边界：电力调度、军需标准与人员培养都需要全国承诺。会议可以先把工程体系转为国家组织，也可以用承担共同责任的公约争取各地加入。目标不再是让某一座工场得到补助，而是让利穆赞成为统一法国可长期依赖的支点。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
