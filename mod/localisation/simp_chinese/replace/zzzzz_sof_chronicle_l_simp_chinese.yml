 sof_chr_region_dij_a:0 "国家冶金与采购委员会"
 sof_chr_region_dij_a_desc:0 "勃艮第提出的全国制度方向，服务于冶金工业与国家交通。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_dij_b:0 "各地资源统筹公约"
 sof_chr_region_dij_b_desc:0 "勃艮第提出的全国制度方向，服务于冶金工业与国家交通。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_dij_t:0 "从冶金走向全国统筹"
 sof_chr_region_dij_d:0 "第戎的代表把工业产能与交通网络放在同一份国家计划中。冶金可以供给武器，交通可以连接前线；如果各地各自征用，二者都可能被割据拖垮。我们需要在统一工业标准和采购指挥之间建立联系，也可以先通过各地认可的资源分担契约凝聚支持。勃艮第将争取的是参与全国统筹的资格，而不是几家工场短期产量的表彰。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
