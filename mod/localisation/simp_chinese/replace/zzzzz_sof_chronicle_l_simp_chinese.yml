 sof_chr_region_trs_t:0 "铁路尽头应是一个国家"
 sof_chr_region_trs_d:0 "图尔的代表把铁路与军械网络看作连接割据地区的骨架。调度员能够让列车到达车站，却不能独自决定这些地区为何接受同一个政府。中央大区可以提供统一运输和军需指挥，也可以先把各地的通行权、供给义务和监督方式写入共同公约。会议的目的是让交通网络通向一个持续运转的国家，不能把全国统一误当成几条线路的竣工典礼。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
