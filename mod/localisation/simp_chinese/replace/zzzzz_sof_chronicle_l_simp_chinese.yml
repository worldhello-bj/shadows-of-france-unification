 sof_chr_region_rou_t:0 "海峡门户的国家方案"
 sof_chr_region_rou_d:0 "鲁昂的港口与河流网络把海峡和内陆连接起来。军方希望借此组织海陆协同，地方代表则指出港口不能成为只顾贸易收益的孤岛。诺曼底需要一套能支撑全国行动的门户制度：统一港务、舰队与陆上供给，或与内陆地区达成共同管理通道的契约。会议从海峡出发，但所讨论的目的地是一个重新连通的法国。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
