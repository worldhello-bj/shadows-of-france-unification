 sof_chr_region_nan_b_desc:0 "卢瓦尔河地区提出的全国制度方向，服务于国家造舰与大西洋海权。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_nan_t:0 "船坞通向全国"
 sof_chr_region_nan_d:0 "南特的船坞不能只为某一个地方政权延长海岸防线。造船工人、港务人员与议员讨论如何把卢瓦尔河地区的生产能力变成法国的共同海权：统一船型、训练与舰队组织，或建立由各地共同承担责任的海事契约。会议追求的是一支可以在统一与重建中持续发挥作用的国家海军；没有舰船、补给和港口，任何纸面方案都不会自行成为海上优势。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
