 sof_chr_assembly_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n[sof_chr_actor.GetName]已经通过既有路线取得全国会议的组织资格或开启议事机构。代表、地方机构与中央机关将面对同一项任务：把结束割据的承诺写成可以执行的共同规则。\n\n会议尚不等于全国已经统一。出席、并入与宪制选择仍需各自满足既有外交和国策条件，其他政权不会因这条新闻被强迫接受决定。"
 sof_chr_central_news_actor_t:0 "我方进程：集中制国家路线获得确认"
 sof_chr_central_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]通过既有国策或议事程序确认集中制宪制路线。支持者期望统一法律和行政责任减少割据遗产，怀疑者则要求新的中央权力受到持续监督。\n\n这条报道记录已经选定的国家路线，不替政府创造领土，也不再次修改互斥选择。下一步仍是落实真实的统一与建国条件。"
 sof_chr_central_news_rival_t:0 "交战对手动态：集中制国家路线获得确认"
