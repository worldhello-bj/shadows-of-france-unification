 sof_chr_staff_t:0 "地方军队之后"
 sof_chr_staff_d:0 "越来越多的部队使用相近的武器，却仍按不同的训练规则和命令链行动。军官们要求统一参谋制度，政治代表担心它把地方社会排除在动员之外。我们可以优先建立专业指挥与共同学说，也可以让公民动员体系承担更大作用。两种方案都要服务全国战争；前者需要更多专业人员，后者必须付出协调和训练的代价。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_staff_option_a:0 "统一参谋与专业训练（35 政治点）"
 sof_chr_staff_option_b:0 "组织全国公民动员（35 政治点）"
 sof_chr_staff_news_actor_t:0 "我方：地方军队之后"
 sof_chr_staff_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“统一参谋与专业训练”。\n\n训练规则和命令链不再被视作每个地方部队的私人传统。政府已选定共同指挥的组织方向，军官与地方社会将围绕它承担不同责任。法国的统一军队仍需要真实部队、装备和训练来完成这项承诺。"
 sof_chr_staff_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“组织全国公民动员”。\n\n训练规则和命令链不再被视作每个地方部队的私人传统。政府已选定共同指挥的组织方向，军官与地方社会将围绕它承担不同责任。法国的统一军队仍需要真实部队、装备和训练来完成这项承诺。"
