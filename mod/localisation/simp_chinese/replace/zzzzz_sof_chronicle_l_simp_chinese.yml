 sof_chr_memorial_t:0 "国家如何记住战争"
 sof_chr_memorial_d:0 "和平后的纪念不再是某一个地区单独讲述胜利。阵亡者、普通家庭与不同政治传统都希望在国家记忆中有位置。政府可以围绕共同公民责任建立纪念制度，也可以优先以公开档案和研究保存分裂战争的复杂经历。两种选择提供长期精神，并替换同一记忆政策；没有必要用虚构的死伤数字为新国家增加光荣。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_memorial_option_a:0 "建立共同公民纪念制度（25 政治点）"
 sof_chr_memorial_option_b:0 "开放档案与公共研究（25 政治点）"
 sof_chr_memorial_news_actor_t:0 "我方：国家如何记住战争"
 sof_chr_memorial_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立共同公民纪念制度”。\n\n战争记忆正在从某个大区的胜利叙述转为全国公共责任。纪念与研究制度将按所选方向组织，各种地方经历开始进入共同记录。国家的故事不需要虚构伤亡数字，它需要解释不同社会如何共同走出分裂。"
