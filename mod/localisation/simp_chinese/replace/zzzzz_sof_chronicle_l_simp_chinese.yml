 sof_chr_rebuilt_news_actor_t:0 "我方进程：既有重建计划达到完成条件"
 sof_chr_rebuilt_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]的既有重建机构已经确认完成标记。交通、生产与公共信任的恢复仍需持续治理，但战后国家现在能够把临时计划转成更长久的责任。\n\n新闻依据实际重建完成标记，不重复给予原有奖励，也不声称地图上每个受损建筑都已全部修复。和平国家的质量将由后续行动检验。"
