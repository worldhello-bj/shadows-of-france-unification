 sof_chr_congress_news_observer_t:0 "代表们抵达全国会议：国家政策新决定"
 sof_chr_congress_news_observer_a_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“明确议决后的共同执行”。\n\n全国会议不再只是一张邀请名单。政府就代表意见如何进入实际执行作出制度选择，各地将据此观察会场能否影响共同决策。参与和并入仍须通过既有政治与外交程序，尚未达成的协议不能由会场口号代签。"
 sof_chr_congress_news_observer_b_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“建立持续的代表协商”。\n\n全国会议不再只是一张邀请名单。政府就代表意见如何进入实际执行作出制度选择，各地将据此观察会场能否影响共同决策。参与和并入仍须通过既有政治与外交程序，尚未达成的协议不能由会场口号代签。"
 sof_chr_unitary_t:0 "共同法律下的责任"
 sof_chr_unitary_d:0 "集中制路线已经由现有宪制程序选定，现在争论转向如何约束全国权力。行政机构要求清楚的执行链，代表们要求公开审查权。我们可以建立统一行政责任，也可以优先完善中央议事与监督。两种做法都在集中制框架内，不会通过一次事件改选联邦路线；同一宪制精神只保留一种，新的选择将替换旧政策。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_unitary_option_a:0 "统一行政责任链（40 政治点）"
 sof_chr_unitary_option_b:0 "建立中央审查与监督（40 政治点）"
 sof_chr_federal_t:0 "共同国家，各地席位"
 sof_chr_federal_d:0 "联邦路线已经由现有宪制程序选定。各地代表现在讨论，共同财政与国防应如何同地方权利并存。议事机构可以用明确分工建立稳定协作，也可以优先把平等参与和公开协商固定下来。两种政策均在已选联邦框架内，不会让一个事件自动吞并成员国或改成集中制；它们替换同一宪制方向的既有精神。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_federal_option_a:0 "约定共同财政与职责（40 政治点）"
 sof_chr_federal_option_b:0 "保障各地平等议事（40 政治点）"
 sof_chr_compact_t:0 "疆界扩张之后的契约"
 sof_chr_compact_d:0 "直接统辖超过一百个完全控制的法国州后，原来的地方行政模式已难以解释整个国家的责任。不同地区要求清楚的办事规则，也要求熟悉的代表仍能提出意见。我们可以加强统一行政标准，或以地方授权衔接共同政府。决定将替换原有整合政策，不会让两种制度重复叠加；接下来的全国统一仍必须由真实控制与合法程序完成。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_compact_option_a:0 "完善共同国家标准（35 政治点）"
 sof_chr_compact_option_b:0 "确立地方授权责任（35 政治点）"
 sof_chr_victory_t:0 "大区战役之后"
 sof_chr_victory_d:0 "一个拥有专属国家方案的大区政权已经在与我们的战争中投降。胜利给共同指挥带来了经验，也使政府必须面对新的社会与政治责任。军方要求把战役教训纳入专业参谋制度，地方代表强调未来军队需要更广泛的公民基础。对手投降不等于其全部领土已经归我们所有；事件不会自动吞并或赠送核心，它只调整我们的指挥制度。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_victory_option_a:0 "总结战役，完善共同参谋（25 政治点）"
 sof_chr_victory_option_b:0 "以胜利扩大公民责任（25 政治点）"
 sof_chr_government_t:0 "政府更替与全国承诺"
 sof_chr_government_d:0 "执政意识形态的变化已经传到中央机关。支持者期待新方向，外省则想知道共同承诺是否会被重新解释。政府可以以清楚的执行责任说明政策连续性，也可以通过公开协商重建认可。此次事件只处理既有政局变化的制度后果，不会再改变意识形态、凭空更换历史人物或使政党国策绕过自身资格。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_government_option_a:0 "公布共同执行责任（25 政治点）"
 sof_chr_government_option_b:0 "重新组织公开协商（25 政治点）"
 sof_chr_education_t:0 "培养属于全国的下一代"
 sof_chr_education_d:0 "学校、研究机构与工业培训网络开始面对同一个问题：新的法国需要怎样的人才和公共责任？工程师希望把技术教育纳入统一标准，代表们则要求社会重建先保障退伍者与战争家庭的参与。政府可以把资源组织为国家技术生产体系，也可以优先建立面向社会的公共支持制度。两种选择都提供长期精神，不能用一次研究折扣代替国家教育。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_education_option_a:0 "统筹技术教育与生产（35 政治点）"
 sof_chr_education_option_b:0 "保护社会恢复与民用能力（35 政治点）"
 sof_chr_demobilisation_t:0 "军队之后的国家生活"
 sof_chr_demobilisation_d:0 "正式统一已经完成，国家也处于和平，但战时组织不会自行消失。退伍安排、公共预算与军事责任必须一起调整。内阁可以优先建立退伍服务和有序回归制度，也可以把战争家庭与劳动者的支持纳入更广泛的社会重建。精神会长期影响政府能力，却不凭空增加人口、装备或工厂；真正的和平生活仍需逐步建设。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_demobilisation_option_a:0 "组织退伍与回归服务（35 政治点）"
 sof_chr_demobilisation_option_b:0 "建立共同社会重建制度（35 政治点）"
 sof_chr_demobilisation_news_actor_t:0 "我方：军队之后的国家生活"
 sof_chr_demobilisation_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“组织退伍与回归服务”。\n\n正式统一后的和平使战时组织面临新的公共责任。退伍、回归与战争家庭的支持进入长期社会政策，国家开始把动员者重新放回公民生活。和平的质量将由持续服务和真实恢复衡量，而不只是胜利庆典。"
 sof_chr_demobilisation_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“建立共同社会重建制度”。\n\n正式统一后的和平使战时组织面临新的公共责任。退伍、回归与战争家庭的支持进入长期社会政策，国家开始把动员者重新放回公民生活。和平的质量将由持续服务和真实恢复衡量，而不只是胜利庆典。"
