 sof_chr_region_lil_t:0 "煤钢为谁铸成国家"
 sof_chr_region_lil_d:0 "里尔的工业代表相信，煤矿、冶金与机械制造足以支持一场结束割据的战争。工会与地方议员却指出：生产能力不会自行转化为全国合法性，工人不能只在征用命令上看见新国家。我们可以把重工业纳入统一采购与重装军体系，也可以先建立生产者参与的全国动员契约。这是一项关于国家组织方式的选择，后续统一战争仍须依靠真实军队与供给，而不能靠工厂会议上的口号获胜。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
