 sof_chr_reconstruction_t:0 "和平的第一份国家计划"
 sof_chr_reconstruction_d:0 "制宪与战后议事已经进入能够执行重建的阶段。各地同时要求修复交通、恢复生产并说明公共资金的责任。我们可以把国家运输作为统一经济的骨架，也可以优先以公共投资和地方协调恢复民用能力。两种制度都服务重建，新的选择替换既有重建精神；事件不会绕过已有重建进度、支出或竣工条件。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_reconstruction_option_a:0 "以国家运输连接重建（40 政治点）"
 sof_chr_reconstruction_option_b:0 "组织公共投资与地方协作（40 政治点）"
 sof_chr_reconstruction_news_actor_t:0 "我方：和平的第一份国家计划"
 sof_chr_reconstruction_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“以国家运输连接重建”。\n\n战后议事机构将交通、民用生产和公共资金责任放入一份共同计划。所选制度强调持续的重建组织，后续投入和完成条件仍由既有机构核定。各地期待国家能像组织战争一样承担和平。"
 sof_chr_reconstruction_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“组织公共投资与地方协作”。\n\n战后议事机构将交通、民用生产和公共资金责任放入一份共同计划。所选制度强调持续的重建组织，后续投入和完成条件仍由既有机构核定。各地期待国家能像组织战争一样承担和平。"
