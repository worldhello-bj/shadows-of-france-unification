 sof_chr_government_change_news_actor_t:0 "我方进程：执政方向发生变化"
 sof_chr_government_change_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]的执政意识形态已经发生真实变化。行政机关将按现有政局继续运转，支持者期待新的方向，各地则观察此前的全国承诺是否仍获尊重。\n\n报道只确认执政类型的变化，不推定一次不存在的选举、政变或人物任命；具体政治经过仍由已经触发的政党与政府事件解释。"
