 sof_chr_region_str_t:0 "共同国家中的阿尔萨斯"
 sof_chr_region_str_d:0 "斯特拉斯堡的会议既讨论莱茵工业，也讨论共同国家的语言、法律与公民资格。阿尔萨斯不能只被当作一片可供征用的工业边区；它必须在统一法国的契约中取得清楚的位置。我们可以以精密工业和技术教育承担国家责任，也可以优先以可被各地接受的公民与地方权利公约组织合作。会议不会自动改变疆界或身份，真正的国家制度仍须通过既有统一程序建立。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
