 sof_chr_reconstruction_finish_t:0 "重建不是一句宣布"
 sof_chr_reconstruction_finish_d:0 "既有重建机构已经确认其完成条件，但国家还需要决定怎样保护这一成果。退伍者与战争家庭希望支持制度继续运转，财政机构则要求把公共责任纳入长期日常行政。政府可以延续回归服务，也可以加强共同社会重建。此次事件尊重已有重建完成标记，只调整社会政策精神，不会再次赠送工厂或重复结算原有奖励。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_reconstruction_finish_option_a:0 "延续退伍与回归服务（25 政治点）"
 sof_chr_reconstruction_finish_option_b:0 "把社会恢复纳入日常行政（25 政治点）"
 sof_chr_reconstruction_finish_news_actor_t:0 "我方：重建不是一句宣布"
 sof_chr_reconstruction_finish_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“延续退伍与回归服务”。\n\n既有重建计划达到完成条件之后，政府将注意力转向如何长期维护社会恢复。服务不再只是战后临时安排，而开始成为日常行政责任。完成标记确认一个阶段结束，不能证明每个家庭和地区的困难都已消失。"
 sof_chr_reconstruction_finish_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“把社会恢复纳入日常行政”。\n\n既有重建计划达到完成条件之后，政府将注意力转向如何长期维护社会恢复。服务不再只是战后临时安排，而开始成为日常行政责任。完成标记确认一个阶段结束，不能证明每个家庭和地区的困难都已消失。"
