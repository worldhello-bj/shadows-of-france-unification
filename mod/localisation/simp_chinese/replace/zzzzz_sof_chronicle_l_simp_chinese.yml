 sof_chr_region_ami_t:0 "把南北重新接成一个国家"
 sof_chr_region_ami_d:0 "亚眠处在北方战线与通向巴黎的交通网络之间。铁路代表强调，只控制车站并不足以把法国重新连接起来：统一运价、军需调度与跨区通行权必须有稳定的国家规则。军方希望先把交通走廊纳入共同后勤指挥，议员则要求让沿线地区共同监督这一权力。皮卡第提出的将是一套服务全法国的交通制度，而不是几段铁路的地方维修清单。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
