 sof_chr_region_chl_t:0 "前线不能成为国家的全部"
 sof_chr_region_chl_d:0 "沙隆的军官从分裂战争中看到了统一野战军的必要，民政代表则担心一切公共事务都将服从永无止境的前线命令。香槟－阿登必须给出一个超出边境守备的全国方案：统一军事学说与作战指挥，或以明确的公民义务和民政责任支撑动员。会议承认战争不可回避，但也坚持军队最终应服务于一个能在和平时期延续的国家。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
