 sof_chr_region_tou_t:0 "天空中的全国事业"
 sof_chr_region_tou_d:0 "图卢兹的航空人员相信，飞机可以跨越割据造成的陆上障碍。议员提醒他们，机场之间的航线并不能代替政治统一：教育、工业与指挥需要一套共同国家制度。会议可以以航空组织支撑全国军队，也可以把科研和人员培养纳入更广泛的公民建国契约。南部－比利牛斯将把天空视作统一事业的一部分，具体机场、飞机与作战准备仍需由后续计划完成。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
