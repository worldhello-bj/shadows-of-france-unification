 sof_chr_region_ajc_b:0 "岛屿与大陆的国家契约"
 sof_chr_region_ajc_b_desc:0 "科西嘉提出的全国制度方向，服务于跨海统一与地中海战略。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_ajc_t:0 "海峡彼岸的法兰西"
 sof_chr_region_ajc_d:0 "阿雅克肖的代表把海图铺在会议桌上：岛屿可以躲过大陆的纷争，也可能永远被隔绝在新国家之外。港口、船队与山地部队不能只为守住几条海岸线而存在；它们应成为重返大陆、参与全国建国的工具。争论的焦点，是先建立统一指挥的远征体系，还是把岛屿自治与大陆合作写成公开契约。任何路线都还需要真正的港口、运输船与登陆准备，宣言不能让海峡自行消失。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_region_ajc_option_a:0 "地中海远征委员会（25 政治点）"
 sof_chr_region_ajc_option_b:0 "岛屿与大陆的国家契约（25 政治点）"
 sof_chr_region_ajc_news_actor_t:0 "我方公布科西嘉全国方案"
 sof_chr_region_ajc_news_actor_a_d:0 "我们的代表已经选定一项持续的国家制度方案。\n\n方案以“地中海远征委员会”为制度载体，围绕跨海统一与地中海战略参与法国统一与建国。支持者希望它为跨区合作建立可延续的能力，怀疑者则要求通过行动检验承诺。\n\n公布方案不改变省份控制、法定所有权或宣战资格；统一仍取决于真实的军事与政治进程。"
 sof_chr_region_ajc_news_actor_b_d:0 "我们的代表已经选定一项持续的国家制度方案。\n\n方案以“岛屿与大陆的国家契约”为制度载体，围绕跨海统一与地中海战略参与法国统一与建国。支持者希望它为跨区合作建立可延续的能力，怀疑者则要求通过行动检验承诺。\n\n公布方案不改变省份控制、法定所有权或宣战资格；统一仍取决于真实的军事与政治进程。"
