 sof_chr_anniversary_t:0 "统一之后的第一个和平年"
 sof_chr_anniversary_d:0 "正式统一后，国家已经连续经历至少三百六十五天的和平。最初的紧急承诺正在变成普通人的日常经验：命令是否可以解释，权力是否可以监督，分裂的记忆是否能被共同保存。政府可以再次确认共同公民责任，也可以将开放研究作为长期国家记忆的基础。纪念不宣称法国已不存在矛盾，而是检验新制度能否比战时宣言活得更久。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_anniversary_option_a:0 "重新确认共同公民责任（20 政治点）"
 sof_chr_anniversary_option_b:0 "以公开研究保存统一经历（20 政治点）"
 sof_chr_anniversary_news_actor_t:0 "我方：统一之后的第一个和平年"
 sof_chr_anniversary_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“重新确认共同公民责任”。\n\n正式统一之后，国家已连续度过至少三百六十五天的和平。政府借纪念重新确认国家记忆的组织方向，公众也开始用日常生活检验战时承诺。统一的故事正在离开紧急宣言，进入能够被长期评价的制度。"
