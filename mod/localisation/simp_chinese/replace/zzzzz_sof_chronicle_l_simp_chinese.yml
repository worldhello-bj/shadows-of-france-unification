 sof_chr_central_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n[sof_chr_actor.GetName]通过既有国策或议事程序确认集中制宪制路线。支持者期望统一法律和行政责任减少割据遗产，怀疑者则要求新的中央权力受到持续监督。\n\n这条报道记录已经选定的国家路线，不替政府创造领土，也不再次修改互斥选择。下一步仍是落实真实的统一与建国条件。"
 sof_chr_federal_news_actor_t:0 "我方进程：联邦国家契约获得确认"
 sof_chr_federal_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]通过既有国策或议事程序确认联邦宪制路线。共同财政、国防和地方权利将被放入同一个国家框架，代表们期待这一承诺获得长期保障。\n\n路线确认不等于成员国已经全部并入，也不自动改变其他政权的阵营。外交契约、实际控制与正式统一仍依既有条件推进。"
 sof_chr_federal_news_rival_t:0 "交战对手动态：联邦国家契约获得确认"
 sof_chr_federal_news_rival_d:0 "这一变化正在影响与我方交战的政治力量；前线和外交机构都在评估它的后果。\n\n[sof_chr_actor.GetName]通过既有国策或议事程序确认联邦宪制路线。共同财政、国防和地方权利将被放入同一个国家框架，代表们期待这一承诺获得长期保障。\n\n路线确认不等于成员国已经全部并入，也不自动改变其他政权的阵营。外交契约、实际控制与正式统一仍依既有条件推进。"
 sof_chr_federal_news_observer_t:0 "联邦国家契约获得确认"
 sof_chr_federal_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n[sof_chr_actor.GetName]通过既有国策或议事程序确认联邦宪制路线。共同财政、国防和地方权利将被放入同一个国家框架，代表们期待这一承诺获得长期保障。\n\n路线确认不等于成员国已经全部并入，也不自动改变其他政权的阵营。外交契约、实际控制与正式统一仍依既有条件推进。"
 sof_chr_bloc_news_actor_t:0 "我方进程：法国政权组成共同阵营"
 sof_chr_bloc_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]已与另一个拥有专属国家方案的法国大区政权实际处于同一阵营。共同组织为统一外交与军事合作提供了新的渠道，也让成员必须解释各自承担的责任。\n\n阵营成员仍是不同国家，结盟不等于吞并、宪制统一或全国所有权。新闻只记录真实的同阵营关系，不替任何成员追加承诺。"
