 sof_chr_region_prs_b:0 "各地共同建国公约"
 sof_chr_region_prs_b_desc:0 "法兰西岛提出的全国制度方向，服务于中央法统与国家财政。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_prs_t:0 "巴黎必须重新赢得法国"
 sof_chr_region_prs_d:0 "巴黎仍有档案、大学与中央机关的旧址，却没有天然代表全国的权利。来自外省的来信要求解释：新的政府究竟会建立一套共同财政和法律，还是仅仅重新把地方资源集中到首都？议员提出以公开预算和任职责任恢复中央信用，另一派主张先让各地参与筹建国家。两者都把统一作为目标，但必须用可延续的制度证明这一目标并非巴黎自己的特权。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
