 sof_chr_region_cfr_t:0 "让中央高原成为国家纵深"
 sof_chr_region_cfr_d:0 "克莱蒙费朗的会议不再把中央高原当作战火之外的角落。交通、仓储和后备力量可以构成全国战略纵深，但只有在统一指挥与跨区合作下才能发挥作用。军需官提出建立纵深调度体系，地方代表则要求先约定不同地区承担的供给责任。奥弗涅将以一套可供整个国家使用的组织方式进入统一事业，而非以山地避难所的身份等待战争结束。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
