 sof_chr_cabinet_t:0 "内阁必须共同承担国家责任"
 sof_chr_cabinet_d:0 "历史人物进入内阁，带来了经验，也带来了不同的政治关系与部门习惯。部长会议需要决定，他们是各自经营独立权力的名人，还是承担共同政策的政府成员。集中责任能够让命令更明确，公开的跨部门协调则更容易取得地方和议会支持。此次决定约束政府工作方式；它不会凭空任命人物，也不会绕过任职费用、立场资格或同一人物的独占规则。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_cabinet_option_a:0 "建立内阁共同执行责任（25 政治点）"
 sof_chr_cabinet_option_b:0 "以公开协调约束部门（25 政治点）"
 sof_chr_supply_t:0 "统一战争的后方"
 sof_chr_supply_d:0 "前线第一次持续向后方提出全国规模的补给要求。地方仓库各自保留余量的办法已经跟不上作战节奏，但把全部运输交给军方也会挤压公共生活。军需会议要求政府选择：优先统一军队补给，或保护民用运输并通过协商分担压力。所获战时精神持续一百八十天，和平后提前解除；它改善组织方式，不能创造地图上并不存在的铁路或物资。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_supply_option_a:0 "军需运输优先（25 政治点）"
 sof_chr_supply_option_b:0 "保障民用运输与协调（25 政治点）"
 sof_chr_war_budget_t:0 "国家预算进入战争"
 sof_chr_war_budget_d:0 "战争延续，临时筹款开始侵蚀正常行政。财政机构提出共同采购和长期生产安排，地方代表则要求保留支撑社会生活的民用经济。我们不能用一笔突然出现的政治资源代替预算制度。现在决定的将是持续的经济取向：更强的军需产出，或更稳的军民协调；政府需承受由此产生的另一侧压力。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_war_budget_option_a:0 "纳入共同战时采购（35 政治点）"
 sof_chr_war_budget_option_b:0 "保护军民生产平衡（35 政治点）"
 sof_chr_war_budget_news_actor_t:0 "我方：国家预算进入战争"
 sof_chr_war_budget_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“纳入共同战时采购”。\n\n长期战争使临时筹款难以支撑行政。政府以一项持续经济政策回应军需与民用生产的争论，承认提高某一侧能力会给另一侧带来压力。预算开始成为全国战争的制度问题，而不再只是下一次紧急征集。"
 sof_chr_war_budget_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“保护军民生产平衡”。\n\n长期战争使临时筹款难以支撑行政。政府以一项持续经济政策回应军需与民用生产的争论，承认提高某一侧能力会给另一侧带来压力。预算开始成为全国战争的制度问题，而不再只是下一次紧急征集。"
 sof_chr_war_budget_news_rival_t:0 "国家预算进入战争：国家政策新决定"
 sof_chr_war_budget_news_rival_a_d:0 "[sof_chr_actor.GetName]宣布调整国家政策。其支持者认为这是统一事业的推进，对手则质疑它能否兑现承诺。\n\n本次选择为“纳入共同战时采购”。\n\n长期战争使临时筹款难以支撑行政。政府以一项持续经济政策回应军需与民用生产的争论，承认提高某一侧能力会给另一侧带来压力。预算开始成为全国战争的制度问题，而不再只是下一次紧急征集。"
