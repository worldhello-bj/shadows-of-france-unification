 sof_chr_region_ren_a_desc:0 "布列塔尼提出的全国制度方向，服务于地方自治与大西洋海权。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_ren_b:0 "雷恩自治与统一公约"
 sof_chr_region_ren_b_desc:0 "布列塔尼提出的全国制度方向，服务于地方自治与大西洋海权。这是国家方案的持续组织能力，不能代替国策、建设、统一资格或具体作战准备。"
 sof_chr_region_ren_t:0 "从自治议会到全国契约"
 sof_chr_region_ren_d:0 "雷恩议会面对一个无法回避的问题：地方自治如何成为统一法国的基础，而不只是分裂时代的自保措施？沿海代表要求舰队和大西洋港口获得共同指挥，内陆代表则坚持新国家必须明确地方权利。会议不再围绕孤立城镇的拨款展开，而是讨论一份能让外省加入的国家方案。选择海权组织或自治契约，将决定布列塔尼向全国提供什么，也决定我们如何要求其他地区信任雷恩。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
