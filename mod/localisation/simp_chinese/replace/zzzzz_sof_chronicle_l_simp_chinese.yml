 sof_chr_war_budget_news_observer_a_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“纳入共同战时采购”。\n\n长期战争使临时筹款难以支撑行政。政府以一项持续经济政策回应军需与民用生产的争论，承认提高某一侧能力会给另一侧带来压力。预算开始成为全国战争的制度问题，而不再只是下一次紧急征集。"
 sof_chr_war_budget_news_observer_b_d:0 "[sof_chr_actor.GetName]在全国议事中通过一项持续政策。\n\n本次选择为“保护军民生产平衡”。\n\n长期战争使临时筹款难以支撑行政。政府以一项持续经济政策回应军需与民用生产的争论，承认提高某一侧能力会给另一侧带来压力。预算开始成为全国战争的制度问题，而不再只是下一次紧急征集。"
 sof_chr_unrest_t:0 "战争与政府信用"
 sof_chr_unrest_d:0 "稳定度的下降已经成为部长会议无法忽视的问题。不同地区对战争负担的理解并不一致，继续要求牺牲而不解释责任，可能使统一事业失去后方。政府可以加强紧急协调与秩序，也可以让地方代表参与监督征用和公共负担。措施持续一百八十天，并有相应代价；这不是凭空消除不满，而是选择用哪种制度渡过危机。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_unrest_option_a:0 "加强紧急协调（20 政治点）"
 sof_chr_unrest_option_b:0 "组织地方监督与协商（20 政治点）"
 sof_chr_fatigue_t:0 "没有结束日期的动员"
 sof_chr_fatigue_d:0 "战争支持正在下降，部队和家庭都希望知道动员会在何时结束。军方强调必须维持士气，民政机构则主张承认负担、保护公共生活。政府可选择限期的全国动员宣传，或更重视社会承受能力的后方契约。精神持续一百八十天，和平后提前解除；两种措施都不会自动结束战争，也不应把疲惫解释成对统一目标的背叛。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_fatigue_option_a:0 "维持共同动员意志（20 政治点）"
 sof_chr_fatigue_option_b:0 "重订后方负担契约（20 政治点）"
 sof_chr_retreat_t:0 "统一事业面临退却"
 sof_chr_retreat_d:0 "领土损失已经显著增加投降压力。内阁无法再把前线挫折当成某一支部队的局部问题：全国方案能否延续，取决于后方组织和政治信用能否承受退却。参谋部希望集中防御与补给，地方代表则要求以公开责任和社会保障维持信任。限期措施各有代价，不能夺回任何省份；真正的反攻仍需由军队完成。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_retreat_option_a:0 "集中防御与纵深调度（25 政治点）"
 sof_chr_retreat_option_b:0 "以公开责任维持信任（25 政治点）"
 sof_chr_retreat_news_actor_t:0 "我方：统一事业面临退却"
 sof_chr_retreat_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“集中防御与纵深调度”。\n\n前线损失已显著增加投降压力，政府因此采取限期危机措施。共同补给、政治责任和社会信任被放到同一项国家议题中。支持者希望制度帮助统一事业渡过退却，但任何措施都不能替军队夺回失地。"
 sof_chr_retreat_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“以公开责任维持信任”。\n\n前线损失已显著增加投降压力，政府因此采取限期危机措施。共同补给、政治责任和社会信任被放到同一项国家议题中。支持者希望制度帮助统一事业渡过退却，但任何措施都不能替军队夺回失地。"
