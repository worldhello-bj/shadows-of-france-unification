 sof_chr_region_chl_news_rival_b_d:0 "[sof_chr_actor.GetName]正试图把地方组织转化为全国领导权；这份宣言尚不能证明它代表全法国。\n\n方案以“公民动员与民政公约”为制度载体，围绕野战军与国家纵深参与法国统一与建国。支持者希望它为跨区合作建立可延续的能力，怀疑者则要求通过行动检验承诺。\n\n公布方案不改变省份控制、法定所有权或宣战资格；统一仍取决于真实的军事与政治进程。"
