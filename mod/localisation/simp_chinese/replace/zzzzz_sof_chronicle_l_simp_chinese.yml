 sof_chr_hundred_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n至少一百个法国州已经由[sof_chr_actor.GetName]同时拥有并完全控制。日益广阔的辖区让各地开始追问，统一行政、代表权和共同财政应怎样共存。地方根据地正在被一个更大的国家框架取代。\n\n这一门槛衡量直接统辖，不代表所有法国州已收复，也不替代宪制、统一宣告或战后安排。"
 sof_chr_two_hundred_news_actor_t:0 "我方进程：全国规模的国家正在形成"
 sof_chr_two_hundred_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]已经直接拥有并完全控制至少二百个法国州。各地资源与社会生活开始依赖同一套国家责任，统一事业的重心随之从根据地转向全国治理。\n\n仍有地区、战争和宪制问题需要由现有程序解决。报道不使用盟友总和，也不把二百州写成法国全境；正式统一的新闻仍等待真正的完成条件。"
 sof_chr_two_hundred_news_rival_t:0 "交战对手动态：全国规模的国家正在形成"
 sof_chr_two_hundred_news_rival_d:0 "这一变化正在影响与我方交战的政治力量；前线和外交机构都在评估它的后果。\n\n[sof_chr_actor.GetName]已经直接拥有并完全控制至少二百个法国州。各地资源与社会生活开始依赖同一套国家责任，统一事业的重心随之从根据地转向全国治理。\n\n仍有地区、战争和宪制问题需要由现有程序解决。报道不使用盟友总和，也不把二百州写成法国全境；正式统一的新闻仍等待真正的完成条件。"
 sof_chr_two_hundred_news_observer_t:0 "全国规模的国家正在形成"
 sof_chr_two_hundred_news_observer_d:0 "外界正在观察这项变化如何重塑法国的统一进程。\n\n[sof_chr_actor.GetName]已经直接拥有并完全控制至少二百个法国州。各地资源与社会生活开始依赖同一套国家责任，统一事业的重心随之从根据地转向全国治理。\n\n仍有地区、战争和宪制问题需要由现有程序解决。报道不使用盟友总和，也不把二百州写成法国全境；正式统一的新闻仍等待真正的完成条件。"
 sof_chr_assembly_news_actor_t:0 "我方进程：全国会议正式进入政治进程"
 sof_chr_assembly_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]已经通过既有路线取得全国会议的组织资格或开启议事机构。代表、地方机构与中央机关将面对同一项任务：把结束割据的承诺写成可以执行的共同规则。\n\n会议尚不等于全国已经统一。出席、并入与宪制选择仍需各自满足既有外交和国策条件，其他政权不会因这条新闻被强迫接受决定。"
 sof_chr_assembly_news_rival_t:0 "交战对手动态：全国会议正式进入政治进程"
 sof_chr_assembly_news_rival_d:0 "这一变化正在影响与我方交战的政治力量；前线和外交机构都在评估它的后果。\n\n[sof_chr_actor.GetName]已经通过既有路线取得全国会议的组织资格或开启议事机构。代表、地方机构与中央机关将面对同一项任务：把结束割据的承诺写成可以执行的共同规则。\n\n会议尚不等于全国已经统一。出席、并入与宪制选择仍需各自满足既有外交和国策条件，其他政权不会因这条新闻被强迫接受决定。"
