 sof_chr_region_mop_t:0 "南方供给与全国政治"
 sof_chr_region_mop_d:0 "蒙彼利埃的代表认为，南方的动员必须越过地方政治的边界。粮食、道路和内陆运输可以支撑统一战争，但征用若没有共同规则，就会破坏本来希望争取的社会支持。会议可以建立面向全国的供给调度机构，也可以先以明确的地方责任和公民权利达成动员契约。朗格多克－鲁西永的国家方案将以持久组织凝聚南方，而不依靠一次征粮制造短暂的胜利。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
