 sof_chr_railways_t:0 "把统一写进全国交通"
 sof_chr_railways_d:0 "重建计划经过一段执行，政府发现不同地区的运价、行政手续与线路责任仍妨碍共同市场。运输部门建议进一步建立全国调度，地方代表则希望以共同投资保持参与。国家已经统一，交通组织仍需获得持续治理。此次调整只替换运输与投资方向的政策精神，不会自动修建铁路、港口或补给枢纽，也不会假称具体工程已经竣工。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_railways_option_a:0 "完善全国运输调度（30 政治点）"
 sof_chr_railways_option_b:0 "扩大公共投资责任（30 政治点）"
 sof_chr_amnesty_t:0 "内战对手如何成为公民"
 sof_chr_amnesty_d:0 "统一与和平使政府必须面对曾支持其他政权的人。军队可以控制土地，却不能替法律回答谁有权回到公共生活。代表们提出有条件的政治和解，司法人员要求通过公开程序确定责任。两条路线各有支持者与代价，既不会凭空释放不存在的角色，也不会自动改变任何政党；它们为新国家建立面对分裂遗产的制度。\n\n政策选项需要相应政治点。相同方向的新精神替换旧政策；“维持现状”不扣费，也不给予新精神。本次议题随后结束。"
 sof_chr_amnesty_option_a:0 "推动有条件的政治和解（35 政治点）"
 sof_chr_amnesty_option_b:0 "通过公开司法确认责任（35 政治点）"
 sof_chr_amnesty_news_actor_t:0 "我方：内战对手如何成为公民"
 sof_chr_amnesty_news_actor_a_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“推动有条件的政治和解”。\n\n曾经站在其他政权一侧的人如何回到共同公共生活，已经成为和平国家的法律议题。政府选择了面对分裂遗产的制度方向，政治和解与责任确认将按这一取向推进。领土统一之后，公民关系仍需重新建立。"
 sof_chr_amnesty_news_actor_b_d:0 "政府已就这一全国议题作出选择。\n\n本次选择为“通过公开司法确认责任”。\n\n曾经站在其他政权一侧的人如何回到共同公共生活，已经成为和平国家的法律议题。政府选择了面对分裂遗产的制度方向，政治和解与责任确认将按这一取向推进。领土统一之后，公民关系仍需重新建立。"
 sof_chr_amnesty_news_rival_t:0 "内战对手如何成为公民：国家政策新决定"
