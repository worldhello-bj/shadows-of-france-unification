 sof_chr_peace_news_actor_t:0 "我方进程：国内交战暂告结束"
 sof_chr_peace_news_actor_d:0 "我方政府将面对这项变化带来的国家责任。\n\n[sof_chr_actor.GetName]已不再与任何法国原属政权处于战争关系。这个变化让后方得以重新讨论行政、生产与和平责任，但不能单凭没有国内敌人就宣布全国统一。\n\n事件不推定一份不存在的停战条约，也不要求仍在外国战争中的国家立即解除全部战时措施。正式建国仍须满足原有领土与宪制条件。"
