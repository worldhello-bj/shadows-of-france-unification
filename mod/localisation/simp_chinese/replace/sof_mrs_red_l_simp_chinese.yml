l_simp_chinese:
 SOF_MRS_FRANCE_communism:0 "法兰西社会主义共和国"
 SOF_MRS_FRANCE_communism_ADJ:0 "法兰西社会主义共和国"
 SOF_MRS_FRANCE_communism_DEF:0 "法兰西社会主义共和国"
 SOF_MRS_PROVENCE_communism:0 "普罗旺斯社会主义共和国"
 SOF_MRS_PROVENCE_communism_ADJ:0 "普罗旺斯社会主义共和国"
 SOF_MRS_PROVENCE_communism_DEF:0 "普罗旺斯社会主义共和国"
 SOF_MRS_RED_A1:0 "组织港口工人"
 SOF_MRS_RED_A1_desc:0 "马赛独立且未投降，拥有并控制首都；共产党支持率增加8，政治点增加25。选择此入口锁定共产主义故事线。"
 SOF_MRS_RED_A2:0 "人民阵线中的共产党"
 SOF_MRS_RED_A2_desc:0 "共产党支持率增加7，稳定度增加3。以现有35%支持率为基线，正常达到50%。"
 SOF_MRS_RED_A3:0 "码头工人自卫队"
 SOF_MRS_RED_A3_desc:0 "陆军经验增加15，解锁民兵训练决议；以本国装备和人力组织训练。"
 SOF_MRS_RED_A4:0 "一切权力归工人代表会"
 SOF_MRS_RED_A4_desc:0 "需要共产党支持率至少50%、稳定度至少35%、政治点至少50，并且马赛独立、未投降且控制首都；消耗50政治点，招募并任命克里斯托福尔，执政党转为共产主义，停止定期选举，称号改为马赛工人共和国。"
 SOF_MRS_RED_A5:0 "马赛共产党第一次代表大会"
 SOF_MRS_RED_A5_desc:0 "政治点增加25；启动党内矛盾机制，初始值20，开放中央与工会两种政治组织方式。"
 SOF_MRS_RED_D1:0 "苏维埃经验译介"
 SOF_MRS_RED_D1_desc:0 "工业研究一次50%加成；事件内容为本地翻译和技术课程，不产生境外苏联援助。"
 SOF_MRS_RED_D2:0 "南方工人组织联络"
 SOF_MRS_RED_D2_desc:0 "开放联络决议，政治点增加25；可向合格的独立国家发出合作提案。"
 SOF_MRS_RED_D3:0 "地中海社会主义协约"
 SOF_MRS_RED_D3_desc:0 "拟定地中海社会主义协约的共同防卫与成员权利条款。外交总纲经正式批准后，我们便可成立阵营，邀请愿意承担互助义务的伙伴。"
 SOF_MRS_RED_D4:0 "先巩固本土社会主义"
 SOF_MRS_RED_D4_desc:0 "与D5互斥；稳定度增加5，党内矛盾减少10。"
 SOF_MRS_RED_D5:0 "国际工人互助网络"
 SOF_MRS_RED_D5_desc:0 "与D4互斥；解锁对一个合格非交战邻国的政治互助提案，180天冷却；目标接受后共产党支持率增加5、获得15政治点。"
 SOF_MRS_RED_D6:0 "地中海护航协定"
 SOF_MRS_RED_D6_desc:0 "解锁海运协作决议；随后使用现有舰队部署护航任务，持续保障贸易航线。"
 SOF_MRS_RED_D7:0 "社会主义技术合作"
 SOF_MRS_RED_D7_desc:0 "至少一名独立、未投降的同阵营伙伴；合作成员工业研究速度增加5%，退出或阵营解散即失效。"
 SOF_MRS_RED_E1:0 "马赛国家计划委员会"
 SOF_MRS_RED_E10:0 "重工业优先"
 SOF_MRS_RED_E10_desc:0 "与E11互斥；计划精神替换为建设速度增加8%、军用工厂产出增加8%、生产效率上限增加5%、消费品需求系数增加5%。"
 SOF_MRS_RED_E11:0 "工人住房与消费工业"
 SOF_MRS_RED_E11_desc:0 "与E10互斥；计划精神替换为建设速度增加8%、军用工厂产出增加3%、消费品需求系数减少2%；稳定度增加5。"
 SOF_MRS_RED_E12:0 "南方公共电力工程"
 SOF_MRS_RED_E12_desc:0 "在合格州增加1座民用工厂，工业研究一次50%加成。"
 SOF_MRS_RED_E1_desc:0 "设立计划管理机构，获得工业研究一次50%加成。"
 SOF_MRS_RED_E2:0 "第一五年计划"
 SOF_MRS_RED_E2_desc:0 "在合格州增加1座民用工厂，记录计划开始日期；获得建设速度增加5%、消费品需求系数增加5%的计划精神。"
 SOF_MRS_RED_E3:0 "港务和仓储国有化"
 SOF_MRS_RED_E3_desc:0 "在合格州增加1座民用工厂，以港务工业建设完善国有化后的生产能力。"
 SOF_MRS_RED_E4:0 "煤炭采购网络"
 SOF_MRS_RED_E4_desc:0 "获得一次开采技术50%研究加成，并开放国内资源供应联络。煤炭供应依托地图现有产量与贸易采购。"
 SOF_MRS_RED_E5:0 "瓦尔铝土矿扩产"
 SOF_MRS_RED_E5_desc:0 "需要拥有并完全控制已核实的446州矿区；一次增加4铝。与同矿区既有扩产节点共享奖励记录，先领旧奖励则此项只保留剧情，不重复扩产。"
 SOF_MRS_RED_E6:0 "港口通往罗讷河谷"
 SOF_MRS_RED_E6_desc:0 "开放交通投资决议，选择本国实际控制的港口至内陆线路；建设须投入民用工业。"
 SOF_MRS_RED_E7:0 "港区机具与工程师学校"
 SOF_MRS_RED_E7_desc:0 "在合格州增加1座军用工厂；工业研究一次50%加成。拥有至少12座民用及军用工厂后，可一次解锁额外科研槽，科研槽总数上限4。"
 SOF_MRS_RED_E8:0 "第一计划验收"
 SOF_MRS_RED_E8_desc:0 "E2完成至少365天，拥有至少6座民用及军用工厂；增加1座民用工厂，计划精神升级为建设速度增加8%、消费品需求系数增加3%。"
 SOF_MRS_RED_E9:0 "第二五年计划"
 SOF_MRS_RED_E9_desc:0 "至少拥有并完全控制15个法国州；增加1座军用工厂，开放工业方向选择。"
 SOF_MRS_RED_M1:0 "马赛赤卫队"
 SOF_MRS_RED_M10:0 "港口海军航空队"
 SOF_MRS_RED_M10_desc:0 "集中力量改进海军航空技术：获得一次海军轰炸机技术50%研究加成，海军经验增加15。"
 SOF_MRS_RED_M11:0 "保卫红色马赛"
 SOF_MRS_RED_M11_desc:0 "仅被其他国家进攻的防御战争期间开放；战争支持度增加10、稳定度增加5，一次性生效。"
 SOF_MRS_RED_M12:0 "人民的卫国战争"
 SOF_MRS_RED_M12_desc:0 "防御战争持续至少90天，马赛仍独立且未投降；本场战争可领取一次120天的核心领土防御+10%。"
 SOF_MRS_RED_M1_desc:0 "陆军经验增加15，开放有装备成本的地方民兵训练。"
 SOF_MRS_RED_M2:0 "统一革命参谋部"
 SOF_MRS_RED_M2_desc:0 "开始140天整编期，期间师组织度减少5%、组织度恢复减少5%；记录起始日期。"
 SOF_MRS_RED_M3:0 "红军军官学校"
 SOF_MRS_RED_M3_desc:0 "陆军经验增加20，陆军学说一次50%经验花费减免。"
 SOF_MRS_RED_M4:0 "政治委员制度"
 SOF_MRS_RED_M4_desc:0 "建立政委精神：师组织度增加3%、组织度恢复增加2%；与通用同类精神替换衔接。"
 SOF_MRS_RED_M5:0 "港口和铁路军需总署"
 SOF_MRS_RED_M5_desc:0 "补给消耗减少5%，解锁铁路与港口军需调度；不免费生成车辆。"
 SOF_MRS_RED_M6:0 "南方红军整编"
 SOF_MRS_RED_M6_desc:0 "距M2完成至少140天；解除整编惩罚，陆军经验增加15。整编惩罚持续140天，完成国策可按效果推进改革。"
 SOF_MRS_RED_M7:0 "工农群众动员"
 SOF_MRS_RED_M7_desc:0 "与M8互斥；适役人口比例增加0.5个百分点，师组织度增加3%，训练时间增加5%。"
 SOF_MRS_RED_M8:0 "职业骨干与统一指挥"
 SOF_MRS_RED_M8_desc:0 "与M7互斥；陆军经验获取增加10%，师攻击增加3%。"
 SOF_MRS_RED_M9:0 "地中海红海军"
 SOF_MRS_RED_M9_desc:0 "拥有并完全控制合格沿海州，增加1座船坞；驱逐舰或潜艇技术一次50%加成。"
 SOF_MRS_RED_P1:0 "民主集中制"
 SOF_MRS_RED_P1_desc:0 "与P4互斥；建立中央组织路线，党内矛盾减少10，获得政治点获取增加5%的中央组织精神初级。"
 SOF_MRS_RED_P2:0 "党领导一切"
 SOF_MRS_RED_P2_desc:0 "中央组织精神升级：政治点获取增加10%，工厂产出增加3%；党内矛盾增加5。"
 SOF_MRS_RED_P3:0 "组织审查委员会"
 SOF_MRS_RED_P3_desc:0 "召开一次组织审查会议，在政治妥协与免职港务反对派之间作出选择；各方案的政治与生产代价见事件选项。"
 SOF_MRS_RED_P4:0 "工会代表大会"
 SOF_MRS_RED_P4_desc:0 "与P1互斥；建立工会组织路线，稳定度增加5，党内矛盾减少10。"
 SOF_MRS_RED_P5:0 "各市镇的工人代表"
 SOF_MRS_RED_P5_desc:0 "政治点获取增加5%，稳定度增加5，工厂产出减少3%；不产生领土转移。"
 SOF_MRS_RED_P6:0 "地方苏维埃自治章程"
 SOF_MRS_RED_P6_desc:0 "党内矛盾减少15，解锁地方协商决议；新占领州仍需正常治理。"
 SOF_MRS_RED_P7:0 "社会主义宪章"
 SOF_MRS_RED_P7_desc:0 "稳定度增加5，战争支持度增加5；明确军事、工会和市政机构的权限。"
 SOF_MRS_RED_P8:0 "结束革命紧急状态"
 SOF_MRS_RED_P8_desc:0 "距A5完成至少180天，党内矛盾低于40、稳定度至少45%；关闭被动矛盾增长，解除对应危机精神，稳定度增加5。"
 SOF_MRS_RED_U1:0 "普罗旺斯革命委员会"
 SOF_MRS_RED_U1_desc:0 "至少3个陆军师、库存步兵装备至少500；解锁普罗旺斯方向的战役准备与地方合作决议。一次只准备一个实际可达的目标，消耗50政治点，准备90天。"
 SOF_MRS_RED_U2:0 "罗讷河谷革命走廊"
 SOF_MRS_RED_U2_desc:0 "至少拥有并完全控制6个法国州，具备通往目标方向的本国交通联系；开放罗讷方向战役准备。"
 SOF_MRS_RED_U3:0 "南方工农代表会议"
 SOF_MRS_RED_U3_desc:0 "至少拥有并完全控制8个法国州；开放向独立、未交战的南方政权提出合作与联邦谈判。普罗旺斯地区全部拥有并控制后才改地区称号。"
 SOF_MRS_RED_U4:0 "北方工人联合委员会"
 SOF_MRS_RED_U4_desc:0 "至少拥有并完全控制20个法国州；开放与现存北方工业政权的政治联络和供应提案。沿可达的陆路或海路实施军事行动。"
 SOF_MRS_RED_U5:0 "红旗飘扬在巴黎"
 SOF_MRS_RED_U5_desc:0 "需要拥有并完全控制巴黎州143；稳定度增加5、政治点增加50，不通过事件夺取巴黎。"
 SOF_MRS_RED_U6:0 "全法工农代表大会"
 SOF_MRS_RED_U6_desc:0 "至少拥有并完全控制272个法国州，即既有339州名单的80%向上取整；开放全国政治宣言，战争支持度增加5。"
 SOF_MRS_RED_U7:0 "法兰西社会主义共和国"
 SOF_MRS_RED_U7_desc:0 "使用既有全国建国条件：独立、和平，339个指定法国州全部拥有并完全控制；执行共用建国效果，然后使用社会主义外观称号。全国一次性奖励与其他建国入口共用领取标记。"
 SOF_MRS_RED_U8:0 "战后重建计划"
 SOF_MRS_RED_U8_desc:0 "和平持续180天；180天内修复速度增加20%、消费品需求系数增加5%，之后恢复玩家所选第二计划精神。重建期间按计划更新工业精神，同一计划系列采用单一阶段。"
 SOF_MRS_WORKERS_communism:0 "马赛工人共和国"
 SOF_MRS_WORKERS_communism_ADJ:0 "马赛工人共和国"
 SOF_MRS_WORKERS_communism_DEF:0 "马赛工人共和国"
 sof_mrs_red.1.a:0 "组织工人代表会"
 sof_mrs_red.1.d:0 "港口工人开始建立跨码头的组织网络。共产党需要争取多数支持，准备地方自卫，并把市政权力交接与生产秩序一起安排。"
 sof_mrs_red.1.t:0 "旧港的政治集会"
 sof_mrs_red.10.a:0 "同意加入联邦"
 sof_mrs_red.10.b:0 "拒绝提案"
 sof_mrs_red.10.d:0 "经历180天的关系培养后，马赛提出正式合并。接受将把我国领土并入马赛。合并后按本国编制组织军队，通过整合程序取得新增核心。"
 sof_mrs_red.10.t:0 "社会主义联邦谈判的结果"
 sof_mrs_red.11.a:0 "同意开展合作"
 sof_mrs_red.11.b:0 "拒绝提案"
 sof_mrs_red.11.d:0 "马赛提出建立采购渠道。接受将改善双方关系，资源随后通过现有贸易系统采购与运输。"
 sof_mrs_red.11.t:0 "煤炭供应联络"
 sof_mrs_red.12.a:0 "同意开展合作"
 sof_mrs_red.12.b:0 "拒绝提案"
 sof_mrs_red.12.d:0 "双方将协调现有舰队任务。接受改善外交关系，之后仍须在海军界面部署护航，持续保障运输航线。"
 sof_mrs_red.12.t:0 "地中海护航协定"
 sof_mrs_red.13.a:0 "尊重对方的决定"
 sof_mrs_red.13.d:0 "对方政府拒绝了当前提案。双方领土与政体没有变化；可在冷却结束且条件符合时重新接触。"
 sof_mrs_red.13.t:0 "合作提案遭到拒绝"
 sof_mrs_red.14.a:0 "组织地方登记"
 sof_mrs_red.14.d:0 "地方政权同意并入我国。新地区进入正常治理流程，登记整合仍需政治点、装备、顺从度、抵抗度与连续控制时间。"
 sof_mrs_red.14.t:0 "地方政权加入联邦"
 sof_mrs_red.2.a:0 "建立工人共和国"
 sof_mrs_red.2.d:0 "工人代表会取得执政权，让·克里斯托福尔成为新政府领袖。马赛工人共和国需要处理工会、市镇与军事机构之间的权力关系。"
 sof_mrs_red.2.t:0 "市政权力的交接"
 sof_mrs_red.3.a:0 "制定党的组织路线"
 sof_mrs_red.3.d:0 "党内矛盾从20开始，每月增加3。中央组织和工会代表大会是互斥的治理方向；政治协调、粮食供给和结束紧急状态可以恢复稳定。"
 sof_mrs_red.3.t:0 "马赛共产党第一次代表大会"
 sof_mrs_red.4.a:0 "政治妥协"
 sof_mrs_red.4.b:0 "免职港务反对派"
 sof_mrs_red.4.c:0 "暂缓处理"
 sof_mrs_red.4.d:0 "港务反对派要求放慢集中管理。政治妥协消耗50政治点，减少15矛盾；免职行动消耗25政治点，减少25矛盾，但180天内政治点获取减少10%、工厂产出减少5%。"
 sof_mrs_red.4.t:0 "港务反对派的审查"
 sof_mrs_red.5.a:0 "准备第二五年计划"
 sof_mrs_red.5.d:0 "第一计划已经运行至少一年，并完成港务、机具、交通和工厂条件验收。下一阶段要在实际拥有的地区上组织新的产业规模。"
 sof_mrs_red.5.t:0 "第一计划的年度报告"
 sof_mrs_red.6.a:0 "加入协约"
 sof_mrs_red.6.b:0 "拒绝提案"
 sof_mrs_red.6.d:0 "马赛邀请我国加入社会主义协约。接受后将加入其阵营；政府与领土保持独立。"
 sof_mrs_red.6.t:0 "地中海社会主义协约邀请"
 sof_mrs_red.7.a:0 "立即开始政治协调"
 sof_mrs_red.7.d:0 "党内矛盾达到90。政府有90天处理分歧，降到90以下会取消倒计时。若危机持续，将损失75政治点、15稳定度，并承受180天工厂产出减少10%的政府瘫痪。"
 sof_mrs_red.7.t:0 "革命政府的九十日警告"
 sof_mrs_red.8.a:0 "开始战后建设"
 sof_mrs_red.8.d:0 "全国建国条件已经完成。统一并不消除地方治理问题；非核心地区仍须达到控制时间、顺从度、抵抗度和登记费用要求。"
 sof_mrs_red.8.t:0 "法兰西社会主义共和国成立"
 sof_mrs_red.9.a:0 "接受互助"
 sof_mrs_red.9.b:0 "拒绝提案"
 sof_mrs_red.9.d:0 "马赛提出政治组织和教育互助。接受后共产党支持率增加5个百分点，我国获得15政治点；拒绝后我国政体与支持率保持现状。"
 sof_mrs_red.9.t:0 "国际工人互助提案"
 sof_mrs_red_audit:0 "组织审查恢复期"
 sof_mrs_red_audit_desc:0 "本精神由红色马赛线路获得。制度变更、项目期限和合作条件决定其是否保留；同一家族的阶段精神通过替换升级。"
 sof_mrs_red_cadres:0 "职业骨干"
