l_simp_chinese:
# 法兰西之影 简体中文汉化
 SOF_UNIFY_national_mandate:0 "一张法兰西地图"
 SOF_UNIFY_national_mandate_desc:0 "边界上的关卡把旧日省份分割成互不信任的政权。先提出一份超越地方的纲领，让士兵和市镇知道这场战争要把法国带向何处。"
 SOF_UNIFY_mobilization_ledger:0 "共同的动员名册"
 SOF_UNIFY_mobilization_ledger_desc:0 "征兵不再是地方长官手中零散的账本。统一名册、预备役和军需登记，为即将扩大规模的军队提供可靠的人手。"
 SOF_UNIFY_army_staff:0 "地方参谋联席会议"
 SOF_UNIFY_army_staff_desc:0 "熟悉每一条公路的地方军官开始共用一幅作战地图。通信、参谋程序和友军识别的统一，能让临时联盟真正像一支军队行动。"
 SOF_UNIFY_war_preparations:0 "启动统一战争"
 SOF_UNIFY_war_preparations_desc:0 "统一纲领终于化作军队的命令。先向相邻的独立法国政权提出边界要求，再以动员与作战准备把口号变成可执行的战役。"
 SOF_UNIFY_arsenal_compact:0 "地方军械库协定"
 SOF_UNIFY_arsenal_compact_desc:0 "仓库里的不同枪械和弹药必须先有共同的交接制度。让军需官共享账册，比重新建立每一座工厂更快地支持前线。"
 SOF_UNIFY_officer_exchange:0 "交换教官与军官"
 SOF_UNIFY_officer_exchange_desc:0 "教官跨越旧行政边界，地方部队也开始接受共同训练。军官之间建立的联系，将比一纸联盟更能经受撤退与反攻。"
 SOF_UNIFY_railway_logistics:0 "铁路为统一服务"
 SOF_UNIFY_railway_logistics_desc:0 "车站的时刻表与仓库的装卸顺序同样决定战役成败。铁路统筹把地方运力编入共同计划，使前线少等一次补给。"
 SOF_UNIFY_war_propaganda:0 "向所有法国人广播"
 SOF_UNIFY_war_propaganda_desc:0 "广播不再只对本地听众讲话。共同的战争目标需要解释，也需要让前线士兵相信家乡仍在关注他们的付出。"
 SOF_UNIFY_industrial_coordination:0 "矿区与军需同一张表"
 SOF_UNIFY_industrial_coordination_desc:0 "洛林的钢铁、北方的煤炭和各地工场进入同一份军需账册。现有矿区的生产任务因此协调起来，资源开发仍由专属矿业工程承担。"
 SOF_UNIFY_medical_corps:0 "跨地区军医勤务"
 SOF_UNIFY_medical_corps_desc:0 "伤兵不该因籍贯不同而得不到照料。跨地区的军医勤务让后方分担救治，也使地方政府更愿意承担战争的成本。"
 SOF_UNIFY_veterans_integration:0 "老兵进入共同军队"
 SOF_UNIFY_veterans_integration_desc:0 "地方战争留下的经验不该各自沉没。把老兵纳入共同训练体系，能够让新兵少走一段危险的路。"
 SOF_UNIFY_regional_administration:0 "前线后方的共同政务"
 SOF_UNIFY_regional_administration_desc:0 "道路可以由军队打通，税务、治安和市镇日常却必须有人接管。共同政务把新控制的地区纳入稳定的行政联系。"
 SOF_UNIFY_regional_integration:0 "把省份变成共同国土"
 SOF_UNIFY_regional_integration_desc:0 "统一行政需要争取地方合作。此国策提供政治授权；新占领州需连续控制180天、顺从至少60%、抵抗低于20%，再投入装备和政治点数完成120天地方登记。"
 SOF_UNIFY_unified_command:0 "统一战争总指挥部"
 SOF_UNIFY_unified_command_desc:0 "军队已不再依靠临时协调维系。常设总指挥部接管作战、补给和动员，让各地军团在同一套计划中发挥作用。"
 SOF_UNIFY_paris_mandate:0 "巴黎的国家委任"
 SOF_UNIFY_paris_mandate_desc:0 "巴黎不只是首都的地址。让这里的行政机关承认共同政府，是把地方胜利转为国家政治的一步。"
 SOF_UNIFY_national_congress:0 "召集全国重建会议"
 SOF_UNIFY_national_congress_desc:0 "来自各地的代表带着预算、伤亡名单和重建要求走进会场。战争将走向终点，政府必须开始回答和平之后的问题。"
 SOF_UNIFY_proclaim_france:0 "法兰西重归一体"
 SOF_UNIFY_proclaim_france_desc:0 "最后一道内部关卡消失时，统一不再只是地图上的颜色。巴黎政府宣布建立共同的法兰西国家，也承诺把战争的动员还给和平生活。"
 SOF_UNIFY_peace_conversion:0 "让军需转向重建"
 SOF_UNIFY_peace_conversion_desc:0 "战时的优先采购转向桥梁、住房与工场维修。政府需要把统一军需的经验留下，把战争对日常生活的支配逐步放下。"
 SOF_UNIFY_national_reconstruction:0 "从废墟到共同家园"
 SOF_UNIFY_national_reconstruction_desc:0 "战争留下的断桥和破损屋顶需要逐一修复。全国重建把各地的工作汇在一起，也让离开军队的人重新找到生活的位置。"
 SOF_UNIFY_constitutional_settlement:0 "为统一制定长久规则"
 SOF_UNIFY_constitutional_settlement_desc:0 "以常设制度巩固统一。共同规则将地方自治、国家责任和公民权利放进可以长期运行的制度中。"
 SOF_UNIFY_continental_corridors:0 "贯通大陆战役走廊"
 SOF_UNIFY_continental_corridors_desc:0 "战线扩大后，昔日远方的地区变成新的邻居。重新检查边界目标与作战走廊，可以把后续战役纳入明确的推进顺序。"
 SOF_UNIFY_corsican_operation:0 "科西嘉海上通道"
 SOF_UNIFY_corsican_operation_desc:0 "跨越海峡，完成共同国家。沿海基地与海上运输计划，为通向科西嘉的战役提供政治和军事准备。"
 SOF_UNIFY_amnesty_charter:0 "共同政府的和解章程"
 SOF_UNIFY_amnesty_charter_desc:0 "战争中的地方矛盾需要一套公开、可预期的处理办法。和解章程让服从共同法律的人获得重新参与重建的机会。"
 SOF_UNIFY_national_market:0 "从地方壁垒到全国市场"
 SOF_UNIFY_national_market_desc:0 "统一后的账册不该仍按旧关卡分割。共同采购、运输和施工标准使全国市场能够真正支撑重建。"
 sofzh_unify_mobilization:0 "统一战争动员"
 sofzh_unify_mobilization_desc:0 "统一战争的动员机构把征兵名册、预备役和地方参谋联络起来。征兵人口+1%、战争支持度+10%、动员速度+25%、计划速度+15%；允许向同意识形态国家宣战，统一后撤销。\n2.6新增：陆军单位经验获取 +15%；陆军组织度恢复 +15%。"
 sofzh_unify_unified_command:0 "统一战线总指挥部"
 sofzh_unify_unified_command_desc:0 "地方军队使用共同的作战命令、动员计划和补给标准。替代初期动员精神：征兵人口+2%、战争支持度+15%、计划速度+25%、陆军攻击+10%、补给消耗-10%；统一后撤销。\n2.6新增：计划上限 +20%；增援率 +4个百分点；陆军组织度恢复 +20%。"
 sofzh_unify_logistics:0 "统一战争铁路统筹"
 sofzh_unify_logistics_desc:0 "民用铁路时刻表为前线补给预留运力，各地维修队执行共同标准。补给消耗-10%、基础设施建造速度+15%；统一后撤销。\n2.6新增：铁路建设 +25%；损耗 -15%；行军组织度损失 -10%。"
 sofzh_unify_french_state:0 "重建的法兰西国家"
 sofzh_unify_french_state_desc:0 "战时的共同指挥逐步转为常设行政与工业协作。稳定度+10%、工厂产出+15%、生产效率增长+10%。\n治理效果：每日顺从增长 +0.016个百分点/日。"
 sofzh_unify_national_market:0 "法兰西统一市场"
 sofzh_unify_national_market_desc:0 "地方采购壁垒和彼此分割的施工标准被统一市场替代。民用工厂建造速度+20%、消费品工厂系数-10%。\n2.6新增：基础设施建设 +20%；生产效率上限 +10%；初始生产效率 +10%。"
 sofzh_unification_region_goal_tt:0 "对符合条件、尚无战争目标的法国政权获得有效期730天的吞并战争目标。"
 sofzh_unification_border_goal_tt:0 "向相邻的合法法国政权补发730天吞并目标；跳过已有目标、盟友、附庸和正在交战的对象。"
 sofzh_unification_campaign_category:0 "法兰西内战态势"
 sofzh_unification_campaign_category_desc:0 ""
 sofzh_unification_border_campaign:0 "制定下一轮边境战役"
 sofzh_unification_border_campaign_desc:0 "花费25政治点数，向尚无目标的合法法国邻国补发730天吞并目标。和平时可用，90天后可再次使用；开战时机由本国决定。"
