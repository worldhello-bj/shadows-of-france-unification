l_simp_chinese:
 sofzh_occupation_category:0 "占领治理与地方整合"
 sofzh_occupation_category_desc:0 "军事占领只取得土地，核心需要地方治理。抵抗达到35%时地下组织转入游击战，达到60%时形成广泛叛乱，可能袭击驻军并破坏基础设施与兵工厂。驻军不足和粗暴清剿会延缓顺从；重建与调解需要政治点数、装备和时间。所有国家适用同一规则。"
 sofzh_guerrilla_support_category:0 "敌后游击支援"
 sofzh_guerrilla_support_category_desc:0 "与占领者交战时，可以把武器送入其非核心法国占领区，支援当地地下组织。装备离开库存后不会变成我方正规师，抵抗通过伏击、破坏和占领负担拖慢敌军。"
 sofzh_local_underground:0 "潜伏的地方地下组织"
 sofzh_local_underground_desc:0 "非核心法国占领区尚未接受新政府，行政与驻军需要持续投入。"
 sofzh_local_guerrillas:0 "活跃游击网络"
 sofzh_local_guerrillas_desc:0 "抵抗至少35%。每月每州20%概率发动破坏与伏击；增加驻军负担并妨碍资源与补给。"
 sofzh_local_insurgency:0 "广泛地方叛乱"
 sofzh_local_insurgency_desc:0 "抵抗至少60%。每月每州40%概率发动破坏与伏击，损失与占领负担更高。"
 sofzh_local_reconstruction:0 "地方重建投入"
 sofzh_local_reconstruction_desc:0 "180天的重建支持，有限加快顺从并小幅降低抵抗目标。"
 sofzh_local_accord:0 "地方代表调解协议"
 sofzh_local_accord_desc:0 "180天的地方协议，降低抵抗目标与驻军伤亡，不授予核心。"
 sofzh_register_state:0 "正式整合：[FROM.GetName]"
 sofzh_register_state_desc:0 "控制满180天、顺从至少60%、抵抗低于20%后，投入35政治点、150步兵装备与25支援装备，进行120天行政登记。完成时重新检查全部条件；失去控制、开战或资格不符不能取得核心。"
 sofzh_rebuild_state:0 "民生重建：[FROM.GetName]"
 sofzh_rebuild_state_desc:0 "投入35政治点、100步兵装备与25支援装备，45天后顺从+5个百分点、抵抗-4个百分点，并获得180天地方重建支持。每州180天冷却，同州治理项目不能同时进行。"
 sofzh_accord_state:0 "地方调解：[FROM.GetName]"
 sofzh_accord_state_desc:0 "投入25政治点，30天后顺从+3个百分点、抵抗-8个百分点，获得180天调解协议。每州180天冷却，同州治理项目不能同时进行。"
 sofzh_sweep_state:0 "清剿游击网络：[FROM.GetName]"
 sofzh_sweep_state_desc:0 "投入25政治点、300步兵装备和500人力，45天后抵抗-12个百分点，但顺从-3个百分点。行动开始后该州90天免于额外脚本伏击；原生抵抗伤亡仍会发生。每州120天冷却。"
 sofzh_support_guerrillas:0 "输送敌后武器：[FROM.GetName]"
 sofzh_support_guerrillas_desc:0 "投入30政治点、250步兵装备和25支援装备，30天后在仍被敌军占领的非核心法国州增加8个百分点抵抗、降低3个百分点顺从。每州180天冷却；不影响我方和盟友控制的土地。"
 sofzh_occupation_equipment_tt:0 "拥有至少150步兵装备和25支援装备"
 sofzh_rebuild_equipment_tt:0 "拥有至少100步兵装备和25支援装备"
 sofzh_sweep_equipment_tt:0 "拥有至少300步兵装备和500可用人力"
 sofzh_guerrilla_equipment_tt:0 "拥有至少250步兵装备和25支援装备"
 sofzh_occupation_integration_tt:0 "地方核心需要单州决议：连续控制180天、顺从至少60%、抵抗低于20%，支付35政治点、150步兵装备及25支援装备，并完成120天登记。地区成立与国策只提供政治授权或领土宣称。"
 sofzh_occupation.1.t:0 "占领区的地下战争"
 sofzh_occupation.1.d:0 "[sofzh_guerrilla_report_state.GetName]的地下组织发动了破坏和伏击。维持战线之外，我们还必须供给驻军、恢复地方服务并争取居民合作。活跃游击州一次袭击损失75人力和60步兵装备，广泛叛乱州损失150人力和120步兵装备；同时损伤基础设施、可能损伤兵工厂，顺从-1、抵抗+2个百分点。报告最多每90天出现一次，实际袭击按每州每月独立检查。"
 sofzh_occupation.1.a:0 "把后方治理提上议程"
