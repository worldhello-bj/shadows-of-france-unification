 sof_region_DIJ_1936_cooperative:0 "酒农合作验收"
 sof_region_DIJ_1936_cooperative_desc:0 "支持合作验收和共同议价，改善地方信任但需要持续管理开支。"
 sof_region_DIJ_1936_cooperative_bonus:0 "酒农合作验收：专项研究"
