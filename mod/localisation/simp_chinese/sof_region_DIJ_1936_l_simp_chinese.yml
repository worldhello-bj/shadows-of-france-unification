 sof_region_DIJ_1936_growers_desc:0 "酒农与酒商既有利益并不完全一致，质量保护和市场周转都必须进入谈判。"
 sof_region_DIJ_1936_growers_bonus:0 "博讷酒农公开听证：专项研究"
