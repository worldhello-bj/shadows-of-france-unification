 sof_region_DIJ_1936_charter:0 "省际共同预算章程"
 sof_region_DIJ_1936_charter_desc:0 "确立铁路优先项目与公共支出的批准程序，不限定某一党派拥有预算权。通过章程同时授予共同防卫和地方整合战争的政治授权。"
