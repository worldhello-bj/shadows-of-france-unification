l_simp_chinese:
 sof_region_TOU_1936_mandate:0 "加龙河畔的临时授权"
 sof_region_TOU_1936_mandate_desc:0 "试验场的发动机声传到市议会门前，乡村代表带来的却是破损县道和停电清单。航空工业许诺一个新的未来，而这个未来必须找到愿意为它承担代价的人。"
 sof_region_TOU_1936_fiscal:0 "市镇财政听证"
 sof_region_TOU_1936_fiscal_desc:0 "先公开机场与工场需要的经费，技术声望不能取代财政问责。"
 sof_region_TOU_1936_technical_board:0 "设立技术审查会"
 sof_region_TOU_1936_technical_board_desc:0 "把适航、机具和材料审查交给专业委员，但不授予其无限行政权。"
 sof_region_TOU_1936_parliamentary:0 "民选预算优先"
 sof_region_TOU_1936_parliamentary_desc:0 "每一座工场都要雇工，每一份订单都要由纳税人偿还。代表会议将掌握预算最后一笔签名，让技术人员说明他们的计划，也让乡村说出自己的需要。"
 sof_region_TOU_1936_parliamentary_network:0 "民选预算优先：地方体系"
 sof_region_TOU_1936_commissioners:0 "限期工程专员制"
 sof_region_TOU_1936_commissioners_desc:0 "工厂等待图纸，工程师等待材料，铁路等待指令。限期工程专员将打破这些互相等待，把采购集中起来。权力可以集中，合同与责任必须留下。"
 sof_region_TOU_1936_commissioners_network:0 "限期工程专员制：地方体系"
 sof_region_TOU_1936_worker_delegates:0 "工场代表旁听"
 sof_region_TOU_1936_worker_delegates_desc:0 "让生产一线报告工时和安全，不能用验收进度掩盖过度加班。"
 sof_region_TOU_1936_purchase_code:0 "技术采购守则"
 sof_region_TOU_1936_purchase_code_desc:0 "财政授权、技术验收与工时报告共同构成可追责的地方制度。"
 sof_region_TOU_1936_county_roads:0 "县道与邮运协商"
 sof_region_TOU_1936_county_roads_desc:0 "乡村支持建立在道路和邮运改善上，不能只把预算送给航空工厂。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TOU_1936_contract_register:0 "专员合同到期表"
 sof_region_TOU_1936_contract_register_desc:0 "给每份特殊采购授权设置退场期限，避免常态化紧急统制。"
 sof_region_TOU_1936_lecture_halls:0 "大学技术讲习"
 sof_region_TOU_1936_lecture_halls_desc:0 "将现有教育能力用于材料与测量训练，不因大学存在而赠送万能科研槽。"
 sof_region_TOU_1936_tools_bonus:0 "大学技术讲习：技术积累"
 sof_region_TOU_1936_dewoitine:0 "德瓦蒂纳试制室"
 sof_region_TOU_1936_dewoitine_desc:0 "公司可追溯至1920年；先处理图纸、试件和检验，不预装后来的成熟战斗机。"
 sof_region_TOU_1936_strength:0 "机翼静力检验"
 sof_region_TOU_1936_strength_desc:0 "投入材料与静力试验，以可靠检验推动设计走向正式交付。"
 sof_region_TOU_1936_strength_bonus:0 "机翼静力检验：技术积累"
 sof_region_TOU_1936_francazal:0 "弗朗卡扎尔试飞程序"
 sof_region_TOU_1936_francazal_desc:0 "以图卢兹为中心协调试飞与地勤服务。"
 sof_region_TOU_1936_rapid_type:0 "尽快冻结机型"
 sof_region_TOU_1936_rapid_type_desc:0 "再好的图纸也无法保护天空，除非它成为一架完成验收的飞机。冻结已经通过试验的设计，尽快让第一批机体走下装配线。下一项改进留给下一批订单。"
 sof_region_TOU_1936_prototype_cycle:0 "再做一轮试制"
 sof_region_TOU_1936_prototype_cycle_desc:0 "试飞员带回的问题值得再花一些时间。新的静力试验、修改后的操纵面与重新检查的材料，将推迟交付，却可能给我们一架更值得信赖的飞机。"
 sof_region_TOU_1936_prototype_bonus:0 "再做一轮试制：技术积累"
 sof_region_TOU_1936_serial_jigs:0 "标准化装配夹具"
 sof_region_TOU_1936_serial_jigs_desc:0 "定型后才能订购夹具，无法同时享受无限研发和最快交货。"
 sof_region_TOU_1936_serial_jigs_local:0 "标准化装配夹具"
 sof_region_TOU_1936_revised_drawings:0 "修订图纸归档"
 sof_region_TOU_1936_revised_drawings_desc:0 "整理第二轮试验形成的变更记录，随后才允许转入稳定生产。"
 sof_region_TOU_1936_acceptance:0 "独立适航验收"
 sof_region_TOU_1936_acceptance_desc:0 "技术审查与生产部门分离，以合格批次的验收结果决定交付。"
 sof_region_TOU_1936_acceptance_bonus:0 "独立适航验收：技术积累"
 sof_region_TOU_1936_mechanics:0 "地勤学徒名额"
 sof_region_TOU_1936_mechanics_desc:0 "飞机增多之前先培养发动机检修和地面保障人员。"
 sof_region_TOU_1936_repair_school:0 "野外修理实习"
 sof_region_TOU_1936_repair_school_desc:0 "培训拆装、检修与备件记录，地勤能力必须独立于飞行员人数。"
 sof_region_TOU_1936_maintenance_bonus:0 "野外修理实习：技术积累"
 sof_region_TOU_1936_flying_clubs:0 "航空俱乐部转训"
 sof_region_TOU_1936_flying_clubs_desc:0 "将民间航空经验用于基础训练，培养飞行与地勤后备人员。"
 sof_region_TOU_1936_fuel_ledger:0 "航空燃料盘点"
 sof_region_TOU_1936_fuel_ledger_desc:0 "核查库存、运输桶与进口需求；西南地区未来油气发现不能倒写成1936供给。"
 sof_region_TOU_1936_geology:0 "比利牛斯地质调查"
 sof_region_TOU_1936_geology_desc:0 "地质调查仅带来知识与风险判断，不承诺发现拉克天然气或无条件新增石油。"
 sof_region_TOU_1936_geology_bonus:0 "比利牛斯地质调查：技术积累"
 sof_region_TOU_1936_fuel_safety:0 "燃油仓储防火"
 sof_region_TOU_1936_fuel_safety_desc:0 "先改进油桶管理与防火，燃料进口受阻时仍须减少飞行。"
 sof_region_TOU_1936_fuel_safety_local:0 "燃油仓储防火"
 sof_region_TOU_1936_port_offer:0 "向波尔多询问油运"
 sof_region_TOU_1936_port_offer_desc:0 "向波尔多提出燃料转运协商，拒绝意味着供应链尚未打通。"
 sof_region_TOU_1936_port_offer_accord_TOU:0 "向波尔多询问油运：双边履约"
 sof_region_TOU_1936_port_offer_accord_BRD:0 "向波尔多询问油运：双边履约"
 sof_region_TOU_1936_port_offer_accepted_notice:0 "向波尔多询问油运：已获同意"
 sof_region_TOU_1936_port_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TOU_1936_port_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_port_offer_declined_notice:0 "向波尔多询问油运：遭到拒绝"
 sof_region_TOU_1936_port_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_TOU_1936_port_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_port_offer_event:0 "向波尔多询问油运"
 sof_region_TOU_1936_port_offer_event_desc:0 "向波尔多提出燃料转运协商，拒绝意味着供应链尚未打通。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_TOU_1936_port_offer_yes:0 "接受对等磋商"
 sof_region_TOU_1936_port_offer_no:0 "拒绝本次提案"
 sof_region_TOU_1936_barrel_train:0 "已获同意的油桶列车"
 sof_region_TOU_1936_barrel_train_desc:0 "只有双方接受后才组织本地燃料接卸和检修训练，协议不创造地质资源。"
 sof_region_TOU_1936_substitution:0 "节油飞行课目"
 sof_region_TOU_1936_substitution_desc:0 "调整训练课目与出动安排，节约航空汽油。"
 sof_region_TOU_1936_tarbes:0 "塔布军械机具清点"
 sof_region_TOU_1936_tarbes_desc:0 "塔布的火炮加工与维修能力有历史基础，1936年不预置1940年的飞机厂迁入。"
 sof_region_TOU_1936_arsenal_repair:0 "修复兵工机床"
 sof_region_TOU_1936_arsenal_repair_desc:0 "优先恢复量具、刀具和机床维护，产量扩张须等到检验程序完成。"
 sof_region_TOU_1936_arsenal_repair_local:0 "修复兵工机床"
 sof_region_TOU_1936_gun_gauges:0 "火炮零件量规"
 sof_region_TOU_1936_gun_gauges_desc:0 "以公差量规减少返工，强化塔布的炮械加工与验收能力。"
 sof_region_TOU_1936_artillery_bonus:0 "火炮零件量规：技术积累"
 sof_region_TOU_1936_aviation_subcontract:0 "兵工场承接航空零件"
 sof_region_TOU_1936_aviation_subcontract_desc:0 "签订新的航空分包合同，并从原有火炮加工中调配所需机时。"
 sof_region_TOU_1936_artillery_priority:0 "保留炮械主业"
 sof_region_TOU_1936_artillery_priority_desc:0 "继续优先火炮修理与备件，航空工业不能占用全部熟练工。"
 sof_region_TOU_1936_precision_shops:0 "塔布检验与配套"
 sof_region_TOU_1936_precision_shops_desc:0 "各订单方向共用兵工量检体系，同一工程仅结算一次建设收益。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TOU_1936_figeac:0 "菲雅克螺旋桨投资案"
 sof_region_TOU_1936_figeac_desc:0 "菲雅克的拉蒂耶工场积累了螺旋桨制造经验。扩建机加工车间、统一金属桨叶工艺，让洛特河谷成为西南航空工业的专业生产基地。"
 sof_region_TOU_1936_propellers:0 "螺旋桨检验协作"
 sof_region_TOU_1936_propellers_desc:0 "当地投资获批后，订立零件检验合同，以城市联络机构协调工场。"
 sof_region_TOU_1936_propellers_local:0 "螺旋桨检验协作"
 sof_region_TOU_1936_production:0 "三道门槛后的批次"
 sof_region_TOU_1936_production_desc:0 "夹具已经齐备，地勤完成训练，验收员等待第一份交付单。把试制室的经验变成有节奏的批次生产，图卢兹终于可以为自己的空中力量承担责任。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TOU_1936_airfields:0 "分散停机与修理"
 sof_region_TOU_1936_airfields_desc:0 "安排分散修理和停机容量，不用单一航空中心承受全部风险。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TOU_1936_air_staff:0 "作战与训练分账"
 sof_region_TOU_1936_air_staff_desc:0 "把作战消耗和训练费用分开统计，停止通过挪用地勤预算假装扩军。"
 sof_region_TOU_1936_air_staff_network:0 "作战与训练分账：地方体系"
 sof_region_TOU_1936_passes:0 "比利牛斯通道清册"
 sof_region_TOU_1936_passes_desc:0 "调查山地通道与民用交通，按道路条件安排边境运输。"
 sof_region_TOU_1936_mountain_guides:0 "地方山地向导"
 sof_region_TOU_1936_mountain_guides_desc:0 "在比利牛斯，熟悉一条冬季山路有时比拥有一张宽大的作战地图更有价值。地方向导将加入训练，把山地经验交给后备部队。完成后开放边境统一战争目标决议。"
 sof_region_TOU_1936_mountain_bonus:0 "地方山地向导：技术积累"
 sof_region_TOU_1936_pack_transport:0 "驮运与冬季储备"
 sof_region_TOU_1936_pack_transport_desc:0 "为山地运输准备驮具、保暖和补给交接，不将高山路线等同平原铁路。"
 sof_region_TOU_1936_pack_transport_local:0 "驮运与冬季储备"
 sof_region_TOU_1936_frontier_rules:0 "边境通行和救护"
 sof_region_TOU_1936_frontier_rules_desc:0 "随着西班牙局势恶化，制定1936年所需的边境登记与救护规程。"
 sof_region_TOU_1936_mountain_reserve:0 "山地后备轮训"
 sof_region_TOU_1936_mountain_reserve_desc:0 "以轮训维持山地守备，避免永久抽走乡村全部劳动力。"
 sof_region_TOU_1936_field_artillery:0 "山地炮械维修班"
 sof_region_TOU_1936_field_artillery_desc:0 "让兵工检修和山地部队形成补给闭环，胜过单纯增加全国攻击加成。"
 sof_region_TOU_1936_field_bonus:0 "山地炮械维修班：技术积累"
 sof_region_TOU_1936_water_power:0 "区域动力负荷调查"
 sof_region_TOU_1936_water_power_desc:0 "调查工场与乡村用电峰值，以地方投资协调电力分配。"
 sof_region_TOU_1936_rural_current:0 "保留乡村供电份额"
 sof_region_TOU_1936_rural_current_desc:0 "航空扩张不得挤占全部民用电力，乡村承诺需要真实预算。"
 sof_region_TOU_1936_workshop_current:0 "工场错峰配电"
 sof_region_TOU_1936_workshop_current_desc:0 "采用错峰生产和机具保养降低供电压力，提高现有电力的使用效率。"
 sof_region_TOU_1936_workshop_current_local:0 "工场错峰配电"
 sof_region_TOU_1936_public_works:0 "道路与工场合并采购"
 sof_region_TOU_1936_public_works_desc:0 "合并标准件与维修采购，由各县保留预算责任并共同执行。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TOU_1936_mediterranean_offer:0 "与蒙彼利埃共议南线"
 sof_region_TOU_1936_mediterranean_offer_desc:0 "向蒙彼利埃询问南线交通和救护协作，对方保留拒绝权。"
 sof_region_TOU_1936_mediterranean_offer_accord_TOU:0 "与蒙彼利埃共议南线：双边履约"
 sof_region_TOU_1936_mediterranean_offer_accord_MOP:0 "与蒙彼利埃共议南线：双边履约"
 sof_region_TOU_1936_mediterranean_offer_accepted_notice:0 "与蒙彼利埃共议南线：已获同意"
 sof_region_TOU_1936_mediterranean_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TOU_1936_mediterranean_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_mediterranean_offer_declined_notice:0 "与蒙彼利埃共议南线：遭到拒绝"
 sof_region_TOU_1936_mediterranean_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_TOU_1936_mediterranean_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_mediterranean_offer_event:0 "与蒙彼利埃共议南线"
 sof_region_TOU_1936_mediterranean_offer_event_desc:0 "向蒙彼利埃询问南线交通和救护协作，对方保留拒绝权。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_TOU_1936_mediterranean_offer_yes:0 "接受对等磋商"
 sof_region_TOU_1936_mediterranean_offer_no:0 "拒绝本次提案"
 sof_region_TOU_1936_relay:0 "获准的南线中继"
 sof_region_TOU_1936_relay_desc:0 "对方接受后在本地建立换装与救护中继，不奖励对方境内的厂房。"
 sof_region_TOU_1936_central_offer:0 "与图尔交换验收规程"
 sof_region_TOU_1936_central_offer_desc:0 "向图尔提出炮械检验规程互认，只有对方同意才开展人员交流。"
 sof_region_TOU_1936_central_offer_accord_TOU:0 "与图尔交换验收规程：双边履约"
 sof_region_TOU_1936_central_offer_accord_TRS:0 "与图尔交换验收规程：双边履约"
 sof_region_TOU_1936_central_offer_accepted_notice:0 "与图尔交换验收规程：已获同意"
 sof_region_TOU_1936_central_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TOU_1936_central_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_central_offer_declined_notice:0 "与图尔交换验收规程：遭到拒绝"
 sof_region_TOU_1936_central_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_TOU_1936_central_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_TOU_1936_central_offer_event:0 "与图尔交换验收规程"
 sof_region_TOU_1936_central_offer_event_desc:0 "向图尔提出炮械检验规程互认，只有对方同意才开展人员交流。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_TOU_1936_central_offer_yes:0 "接受对等磋商"
 sof_region_TOU_1936_central_offer_no:0 "拒绝本次提案"
 sof_region_TOU_1936_proof_exchange:0 "中央试验规程对照"
 sof_region_TOU_1936_proof_exchange_desc:0 "与图尔开展标准比对，布尔日兵工场仍由原管理机构负责。"
 sof_region_TOU_1936_national_brief:0 "西南技术共同章程"
