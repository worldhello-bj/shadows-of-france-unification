l_simp_chinese:
 SOF_PARTY_PCF_PCF_MANDATE:0 "面包、和平与自由"
 SOF_PARTY_PCF_PCF_MANDATE_desc:0 "反危机与反法西斯的人民阵线方向。\n实施：政治点+25；解锁一次群众联合大会决议，花费25政治点换取稳定度+1个百分点。"
 sof_party_policy_pcf_pcf_hand:0 "向天主教劳动者伸手"
 sof_party_policy_pcf_pcf_hand_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.03，代表跨宗教协商的组织收益。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_HAND:0 "向天主教劳动者伸手"
 SOF_PARTY_PCF_PCF_HAND_desc:0 "1936年4月伸手政策跨越宗教分歧。\n实施：稳定度+1个百分点；执政期间每日政治点+0.03，代表跨宗教协商的组织收益。"
 sof_party_policy_pcf_pcf_workshops:0 "工厂与街区支部"
 sof_party_policy_pcf_pcf_workshops_desc:0 "有自有且控制的核心工业州时政治点+10；执政期间生产效率增长+2%；解锁一次25政治点工会调解，降低一档既有通用罢工，无罢工则稳定度+0.5个百分点。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_WORKSHOPS:0 "工厂与街区支部"
 SOF_PARTY_PCF_PCF_WORKSHOPS_desc:0 "依托工厂支部与街区组织，协调工人动员。\n有自有且控制的核心工业州时政治点+10；执政期间生产效率增长+2%；解锁一次25政治点工会调解，降低一档既有通用罢工，无罢工则稳定度+0.5个百分点。"
 sof_party_policy_pcf_pcf_families:0 "打破二百家族的支配"
 sof_party_policy_pcf_pcf_families_desc:0 "政治点-30；90天稳定度-1个百分点；执政期间民用工厂建造速度+3%，仅代表辖内信贷与采购改革。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_FAMILIES:0 "打破二百家族的支配"
 SOF_PARTY_PCF_PCF_FAMILIES_desc:0 "整顿本地区金融财团对地方信贷与采购的控制。\n政治点-30；90天稳定度-1个百分点；执政期间民用工厂建造速度+3%，仅代表辖内信贷与采购改革。"
 SOF_PARTY_PCF_PCF_PEASANTS:0 "团结劳动农民"
 SOF_PARTY_PCF_PCF_PEASANTS_desc:0 "应对农业危机，团结劳动农民与城市工人。\n稳定度+1个百分点；解锁一次城乡食品救济决议，花费20政治点再获得1个百分点稳定度。"
 SOF_PARTY_PCF_PCF_LEAGUES:0 "解除准军事联盟武装"
 SOF_PARTY_PCF_PCF_LEAGUES_desc:0 "解散反共和准军事组织是明确诉求。\n实施：通过辖内共和治安执法获得稳定度+1.5个百分点。"
 sof_party_policy_pcf_pcf_arms:0 "公共军工监督"
 sof_party_policy_pcf_pcf_arms_desc:0 "执政期间军工产出+3%；已有自有核心军工时180天交接修正-5%，合计初期-2%；无合格军工时改为陆军经验+3的采购审计，设施保持现状。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_ARMS:0 "公共军工监督"
 SOF_PARTY_PCF_PCF_ARMS_desc:0 "共同纲领要求军工国有化；地方仅能处置自有军工。\n实施：执政期间军工产出+3%；已有自有核心军工时180天交接修正-5%，合计初期-2%；无合格军工时改为陆军经验+3的采购审计，设施保持现状。"
 SOF_PARTY_PCF_PCF_SECURITY:0 "共同抵抗法西斯侵略"
 SOF_PARTY_PCF_PCF_SECURITY_desc:0 "以集体安全与对苏友好为方向，争取邻邦合作。\n战争支持度+2个百分点；解锁一次35政治点邻邦安全协商，接受方可拒绝。接受后签署互不侵犯协定并各获陆军经验+3，双方保留现有阵营与战争状态。"
 SOF_PARTY_SFIO_SFIO_OFFICE:0 "承担执政责任"
 SOF_PARTY_SFIO_SFIO_OFFICE_desc:0 "布鲁姆要求执政；无单独多数时愿按共同纲领联合执政。\n实施：政治点+25，稳定度+0.5个百分点。"
 SOF_PARTY_SFIO_SFIO_AGREEMENTS:0 "劳资集体协约"
 SOF_PARTY_SFIO_SFIO_AGREEMENTS_desc:0 "落实1936年6月的劳资集体协约。\n1936年6月后实施；降低一档既有通用罢工；若无通用罢工则稳定度+0.5个百分点。120天军工产出-1%，表示集体协约磨合。"
 SOF_PARTY_SFIO_SFIO_HOURS:0 "四十小时工作周"
 SOF_PARTY_SFIO_SFIO_HOURS_desc:0 "竞选主张缩短工时，40小时是1936立法具体化。\n实施：1936年6月后制定地方工时法：永久稳定度+1.5个百分点；180天军工产出-2%；法律换届保留且不重复叠加。"
 sof_party_policy_sfio_sfio_demand:0 "以购买力走出危机"
 sof_party_policy_sfio_sfio_demand_desc:0 "执政期间民用工厂建造速度+3%；90天每日政治点-0.10代表救济拨款协调成本。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_DEMAND:0 "以购买力走出危机"
 SOF_PARTY_SFIO_SFIO_DEMAND_desc:0 "竞选讲话反对通缩，主张扩大消费。\n实施：执政期间民用工厂建造速度+3%；90天每日政治点-0.10代表救济拨款协调成本。"
 sof_party_policy_sfio_sfio_credit:0 "地方信用与关键企业公营化"
 sof_party_policy_sfio_sfio_credit_desc:0 "政治点-45；180天稳定度-1个百分点；执政期间生产效率上限+3个百分点，改革仅限辖内信用和企业。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_CREDIT:0 "地方信用与关键企业公营化"
 SOF_PARTY_SFIO_SFIO_CREDIT_desc:0 "设立地方公共信贷，推进辖内关键企业公营化。\n政治点-45；180天稳定度-1个百分点；执政期间生产效率上限+3个百分点，改革仅限辖内信用和企业。"
 sof_party_policy_sfio_sfio_compromise:0 "履行共同纲领"
 sof_party_policy_sfio_sfio_compromise_desc:0 "政治点+15，稳定度+1个百分点；执政期间每日政治点+0.03，体现最低共同纲领的议会合作。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_COMPROMISE:0 "履行共同纲领"
 SOF_PARTY_SFIO_SFIO_COMPROMISE_desc:0 "布鲁姆明确承诺联合政府执行共同纲领。\n实施：政治点+15，稳定度+1个百分点；执政期间每日政治点+0.03，体现最低共同纲领的议会合作。"
 SOF_PARTY_SFIO_SFIO_WORKS:0 "地方储蓄建设计划"
 SOF_PARTY_SFIO_SFIO_WORKS_desc:0 "地方储蓄融资公共工程属于竞选方案。\n实施：支付25政治点，在一个自有且完全控制的核心州建设1级基础设施；无合格州或设施已满时返还10政治点。设施换届保留，一生仅领取一次。"
 SOF_PARTY_SFIO_SFIO_LEAVE:0 "两周属于劳动者的假期"
 SOF_PARTY_SFIO_SFIO_LEAVE_desc:0 "落实1936年6月20日的两周带薪休假法。\n1936年6月20日后制定两周带薪休假：永久稳定度+1个百分点；若完成时无防御战争，180天战争支持度-1个百分点。法律换届保留。"
 sof_party_policy_sfio_sfio_leisure:0 "文化、体育与公共休闲"
 sof_party_policy_sfio_sfio_leisure_desc:0 "政治点+5；执政期间基础设施建造速度+3%；解锁一次免费公共休闲活动，稳定度+0.5个百分点、政治点+15，不增加科研槽。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_LEISURE:0 "文化、体育与公共休闲"
 SOF_PARTY_SFIO_SFIO_LEISURE_desc:0 "让劳动者获得更多文化、体育与休闲机会。\n政治点+5；执政期间基础设施建造速度+3%；解锁一次免费公共休闲活动，稳定度+0.5个百分点、政治点+15，不增加科研槽。"
 SOF_PARTY_PRRRS_PRRRS_REPUBLIC:0 "唤醒共和意识"
 SOF_PARTY_PRRRS_PRRRS_REPUBLIC_desc:0 "以共和意识凝聚改革力量。\n稳定度+1个百分点，政治点+20。"
 sof_party_policy_prrrs_prrrs_banks:0 "监督银行，保护储蓄"
 sof_party_policy_prrrs_prrrs_banks_desc:0 "政治点+5；执政期间民用工厂建造速度+2%，体现地方银行审计与储蓄保护。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PRRRS_PRRRS_BANKS:0 "监督银行，保护储蓄"
 SOF_PARTY_PRRRS_PRRRS_BANKS_desc:0 "监督本地银行账目与公共存款，保护储蓄者。\n政治点+5；执政期间民用工厂建造速度+2%，体现地方银行审计与储蓄保护。"
 SOF_PARTY_PRRRS_PRRRS_RURAL:0 "农民的共和国"
 SOF_PARTY_PRRRS_PRRRS_RURAL_desc:0 "维护农民生计，联结城乡供应。\n稳定度+1个百分点；解锁一次20政治点城乡食品救济，稳定度再+1个百分点。与共产党救济共用一次性拨款额度。"
 SOF_PARTY_PRRRS_PRRRS_COOPS:0 "合作社与农业信用"
 SOF_PARTY_PRRRS_PRRRS_COOPS_desc:0 "扶持农业合作社，改善信用与债务安排。\n支付20政治点，在一个无军工且民用工厂少于2座的自有控制核心州建设1级基础设施。无合格州或已满级则返还10政治点，作为城市供应协调替代。"
 SOF_PARTY_PRRRS_PRRRS_SCHOOL:0 "十四岁之前的公共学校"
 SOF_PARTY_PRRRS_PRRRS_SCHOOL_desc:0 "共同纲领提出延长义务教育；Jean Zay为激进党部长。\n实施：1936年8月后延长辖内义务教育：政治点-25；永久研究速度+0.5%。不立即赠予研究槽。"
 SOF_PARTY_PRRRS_PRRRS_CONSCIENCE:0 "学校中立与良心自由"
 SOF_PARTY_PRRRS_PRRRS_CONSCIENCE_desc:0 "Jean Zay1936年末学校中立通告。\n实施：1936年12月后制定辖内学校中立条例：永久稳定度+0.5个百分点。"
 sof_party_policy_prrrs_prrrs_accounts:0 "整顿公共账目"
 sof_party_policy_prrrs_prrrs_accounts_desc:0 "政治点-15；执政期间每日政治点+0.06。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PRRRS_PRRRS_ACCOUNTS:0 "整顿公共账目"
 SOF_PARTY_PRRRS_PRRRS_ACCOUNTS_desc:0 "共同纲领反浪费并整顿公共生活。\n实施：政治点-15；执政期间每日政治点+0.06。"
 SOF_PARTY_PRRRS_PRRRS_BALANCE:0 "守住共和改革联盟"
 SOF_PARTY_PRRRS_PRRRS_BALANCE_desc:0 "履行共同纲领，同时保留各党的独立身份。\n稳定度+1个百分点；解锁一次免费联盟调解，再获稳定度+1个百分点。党派继续独立参选。"
 sof_party_policy_usr_usr_coalition:0 "共和社会主义者入阁"
 sof_party_policy_usr_usr_coalition_desc:0 "政治点+30；执政期间每日政治点+0.02，代表共和派组阁协调。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_COALITION:0 "共和社会主义者入阁"
 SOF_PARTY_USR_USR_COALITION_desc:0 "支持参与政府；USR是共同纲领签署组织。\n实施：政治点+30；执政期间每日政治点+0.02，代表共和派组阁协调。"
 sof_party_policy_usr_usr_expertise:0 "经济协调委员会"
 sof_party_policy_usr_usr_expertise_desc:0 "政治点-20；执政期间生产效率增长+4%，实行部门间经济协调。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_EXPERTISE:0 "经济协调委员会"
 SOF_PARTY_USR_USR_EXPERTISE_desc:0 "由经济协调委员会统筹部门治理与生产安排。\n政治点-20；执政期间生产效率增长+4%，实行部门间经济协调。"
 SOF_PARTY_USR_USR_ARBITRATION:0 "产业争议调停"
 SOF_PARTY_USR_USR_ARBITRATION_desc:0 "建立地方调停渠道，协调劳资争议。\n降低一档既有通用罢工，另获稳定度+0.5个百分点；无通用罢工时总计+1个百分点。不移除其他地区路线专属危机。"
 sof_party_policy_usr_usr_power:0 "电力与公共工程"
 sof_party_policy_usr_usr_power_desc:0 "在一个自有且完全控制核心州建设1级基础设施；无合格州或已满级时政治点+10。执政期间基础设施建设速度+3%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_POWER:0 "电力与公共工程"
 SOF_PARTY_USR_USR_POWER_desc:0 "1936–1937公共工程、电力建设工作。\n实施：在一个自有且完全控制核心州建设1级基础设施；无合格州或已满级时政治点+10。执政期间基础设施建设速度+3%。"
 SOF_PARTY_USR_USR_SURVEYS:0 "燃料调查与技术人员"
 SOF_PARTY_USR_USR_SURVEYS_desc:0 "组织燃料调查，培养勘探与工业技术人员。\n获得一次工业科技25%研究加成。"
 SOF_PARTY_USR_USR_GENEVA:0 "争取集体安全的承认"
 SOF_PARTY_USR_USR_GENEVA_desc:0 "沿着保罗－邦库尔的集体安全方向，向邻邦提出调停与互不侵犯倡议。\n政治点+10；解锁一次25政治点邻邦和平协商。对方同意后互不侵犯并互增关系+15并随时间衰减；拒绝时返还10政治点。仅限区域外交，不授予国联席位。"
 sof_party_policy_usr_usr_government:0 "让改革能够执行"
 sof_party_policy_usr_usr_government_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.04，整合财政、工程与外交执行。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_GOVERNMENT:0 "让改革能够执行"
 SOF_PARTY_USR_USR_GOVERNMENT_desc:0 "整合财政、工程与外交部门，提高联盟政府的执行能力。\n稳定度+1个百分点；执政期间每日政治点+0.04，整合财政、工程与外交执行。"
 SOF_PARTY_PUP_PUP_BRIDGE:0 "重搭图尔之后的桥梁"
 SOF_PARTY_PUP_PUP_BRIDGE_desc:0 "Paul Louis强调弥合1920年分裂后的工人组织。\n实施：政治点+25；解锁一次本国内工人组织预备会，花费15政治点获得稳定度+0.5个百分点。"
 SOF_PARTY_PUP_PUP_DEMOCRACY:0 "党内民主保障"
 SOF_PARTY_PUP_PUP_DEMOCRACY_desc:0 "明确以党内民主区别于共产党。\n实施：稳定度+1.5个百分点；180天每日政治点-0.05为党内表决成本。"
 sof_party_policy_pup_pup_unions:0 "工会不做党的附属"
 sof_party_policy_pup_pup_unions_desc:0 "降低一档既有通用罢工，无罢工则稳定度+0.5个百分点；执政期间军工产出+1.5%，体现自主工会与政府协商。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PUP_PUP_UNIONS:0 "工会不做党的附属"
 SOF_PARTY_PUP_PUP_UNIONS_desc:0 "明确维护工会自主。\n实施：降低一档既有通用罢工，无罢工则稳定度+0.5个百分点；执政期间军工产出+1.5%，体现自主工会与政府协商。"
 SOF_PARTY_PUP_PUP_UNITY:0 "共同的工人会议"
 SOF_PARTY_PUP_PUP_UNITY_desc:0 "1936年工人政党统一谈判未达最终合并。\n实施：政治点-20、稳定度+1个百分点；开启后续独立或本地联合协议选择。"
 sof_party_policy_pup_pup_independent:0 "保留独立的统一派"
 sof_party_policy_pup_pup_independent_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.05；维持PUP的独立组织。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PUP_PUP_INDEPENDENT:0 "保留独立的统一派"
 SOF_PARTY_PUP_PUP_INDEPENDENT_desc:0 "面对统一方案的争议，我们选择维持独立组织，继续提出自己的社会主义纲领。\n实施：稳定度+1个百分点；执政期间每日政治点+0.05；维持PUP的独立组织。"
 SOF_PARTY_PUP_PUP_SOCIALIST_UNION:0 "与社会主义者商议联合"
 SOF_PARTY_PUP_PUP_SOCIALIST_UNION_desc:0 "邀请本地SFIO组织商议国内政策合作，由双方自主决定。\n实施：支付20政治点邀请本地SFIO代表。65%概率获得须由议会批准的有限合作文本，批准后稳定度+1.5个百分点；35%概率谈判拒绝，返还20政治点。玩家也可拒绝文本并退款。合作仅限国内政策，现有党组织与选举名单保持独立。"
 SOF_PARTY_PUP_PUP_AGAINST_WAR:0 "工人国际联系与反战"
 SOF_PARTY_PUP_PUP_AGAINST_WAR_desc:0 "自述明确反战并与国外类似政党联系。\n实施：稳定度+1个百分点；无防御战争时战争支持度-1.5个百分点。解锁一次25政治点辖内战争受害者人道救济，稳定度+1个百分点；不产生远征军或对外干预。"
 SOF_PARTY_RG_AD_RG_AD_COMMITTEES:0 "整合地方共和派"
 SOF_PARTY_RG_AD_RG_AD_COMMITTEES_desc:0 "以组织松散的地方名流为基础推进党组织整合。\n实施：一次性获得35政治点，建立地方共和派协作。"
 sof_party_policy_rg_ad_rg_ad_accounts:0 "公开地方账目"
 sof_party_policy_rg_ad_rg_ad_accounts_desc:0 "公开地方账目，以财政纪律恢复投资信心。\n一次性消耗20政治点、稳定度下降1个百分点；执政期间消费品工厂系数降低2%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_ACCOUNTS:0 "公开地方账目"
 SOF_PARTY_RG_AD_RG_AD_ACCOUNTS_desc:0 "公开地方账目，以财政纪律恢复投资信心。\n一次性消耗20政治点、稳定度下降1个百分点；执政期间消费品工厂系数降低2%。"
 sof_party_policy_rg_ad_rg_ad_reconcile:0 "共和国的调和者"
 sof_party_policy_rg_ad_rg_ad_reconcile_desc:0 "1936-04-10反两大敌对阵营的选举呼吁。\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_RECONCILE:0 "共和国的调和者"
 SOF_PARTY_RG_AD_RG_AD_RECONCILE_desc:0 "1936-04-10反两大敌对阵营的选举呼吁。\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%。"
 sof_party_policy_rg_ad_rg_ad_credit:0 "恢复工商信用"
 sof_party_policy_rg_ad_rg_ad_credit_desc:0 "维护自由企业，恢复工商信用。\n执政期间民用工厂建造速度提高6%、军工建造速度降低3%；后续复苏政策替代本政策。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_CREDIT:0 "恢复工商信用"
 SOF_PARTY_RG_AD_RG_AD_CREDIT_desc:0 "维护自由企业，恢复工商信用。\n执政期间民用工厂建造速度提高6%、军工建造速度降低3%；后续复苏政策替代本政策。"
 sof_party_policy_rg_ad_rg_ad_discipline:0 "约束名流政治"
 sof_party_policy_rg_ad_rg_ad_discipline_desc:0 "以组织改革换取可执行政策，体现名流自治的政治成本。\n实施：一次性消耗35政治点、稳定度提高2个百分点；执政期间政治顾问成本降低10%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_DISCIPLINE:0 "约束名流政治"
 SOF_PARTY_RG_AD_RG_AD_DISCIPLINE_desc:0 "以组织改革换取可执行政策，体现名流自治的政治成本。\n实施：一次性消耗35政治点、稳定度提高2个百分点；执政期间政治顾问成本降低10%。"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE:0 "民营承包的公共工程"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE_desc:0 "由民营企业承包公共设施建设。\n消耗30政治点，在一个自有、完全控制的核心州增加1级基础设施；全部满级时改为一次25%工业科研加成。建设留存。"
 SOF_PARTY_RG_AD_RG_AD_CENTRE:0 "中间派执政协定"
 SOF_PARTY_RG_AD_RG_AD_CENTRE_desc:0 "中间派共和集中路线；不合并原始选票、不更改他党身份。\n实施：一次性稳定度提高2个百分点、政治点增加15。"
 sof_party_policy_rg_ad_rg_ad_recovery:0 "信用与秩序的复苏"
 sof_party_policy_rg_ad_rg_ad_recovery_desc:0 "结合政治整合与工商投资，推动信用和生产复苏。\n执政期间以复苏政策替代工商信用：民工建造速度提高5%、生产效率增长提高3%，取消先前军工惩罚。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY:0 "信用与秩序的复苏"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY_desc:0 "结合政治整合与工商投资，推动信用和生产复苏。\n执政期间以复苏政策替代工商信用：民工建造速度提高5%、生产效率增长提高3%，取消先前军工惩罚。"
 SOF_PARTY_FR_URD_FR_URD_NOTABLES:0 "联合共和派名流"
 SOF_PARTY_FR_URD_FR_URD_NOTABLES_desc:0 "FR依赖省级组织与地方名流。\n实施：一次性获得40政治点。"
 sof_party_policy_fr_urd_fr_urd_property:0 "保障私人经营"
 sof_party_policy_fr_urd_fr_urd_property_desc:0 "保障私人经营，维持自由保守的经济秩序。\n一次性稳定度降低1个百分点；执政期间生产效率上限提高3%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_PROPERTY:0 "保障私人经营"
 SOF_PARTY_FR_URD_FR_URD_PROPERTY_desc:0 "保障私人经营，维持自由保守的经济秩序。\n一次性稳定度降低1个百分点；执政期间生产效率上限提高3%。"
 SOF_PARTY_FR_URD_FR_URD_SCHOOLS:0 "保护自由办学"
 SOF_PARTY_FR_URD_FR_URD_SCHOOLS_desc:0 "支持自由办学，延续地方宗教教育传统。\n一次性消耗40政治点、稳定度提高2个百分点，获得一项25%工业科研加成。"
 sof_party_policy_fr_urd_fr_urd_service:0 "维护文官与军队连续性"
 sof_party_policy_fr_urd_fr_urd_service_desc:0 "Marin 1936-05-20反对按政党清洗行政与军官的文章。\n实施：一次性获得10陆军经验；执政期间陆军顾问成本降低10%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_SERVICE:0 "维护文官与军队连续性"
 SOF_PARTY_FR_URD_FR_URD_SERVICE_desc:0 "Marin 1936-05-20反对按政党清洗行政与军官的文章。\n实施：一次性获得10陆军经验；执政期间陆军顾问成本降低10%。"
 sof_party_policy_fr_urd_fr_urd_defence:0 "地方国防承包"
 sof_party_policy_fr_urd_fr_urd_defence_desc:0 "将国防采购与地方私人承包相结合。\n一次性消耗35政治点，获得一项25%建筑科技加成；执政期间军工建造速度提高6%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE:0 "地方国防承包"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE_desc:0 "将国防采购与地方私人承包相结合。\n一次性消耗35政治点，获得一项25%建筑科技加成；执政期间军工建造速度提高6%。"
 sof_party_policy_fr_urd_fr_urd_legal:0 "议会内的强硬右派"
 sof_party_policy_fr_urd_fr_urd_legal_desc:0 "在议会制度内巩固共和保守派的力量。\n一次性稳定度提高3个百分点；执政期间政治点获取提高4%，保留现有选举制度。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_LEGAL:0 "议会内的强硬右派"
 SOF_PARTY_FR_URD_FR_URD_LEGAL_desc:0 "在议会制度内巩固共和保守派的力量。\n一次性稳定度提高3个百分点；执政期间政治点获取提高4%，保留现有选举制度。"
 SOF_PARTY_FR_URD_FR_URD_NATIONAL:0 "与民族派组织协调"
 SOF_PARTY_FR_URD_FR_URD_NATIONAL_desc:0 "协调1934—1936年间靠近民族派团体的地方组织。\n一次性政治点增加50、稳定度降低4个百分点、战争支持度提高3个百分点；保留现任执政党。"
 SOF_PARTY_FR_URD_FR_URD_RESERVE:0 "退伍军人的技术传授"
 SOF_PARTY_FR_URD_FR_URD_RESERVE_desc:0 "由退伍军人传授技术与组织经验，充实国防训练。\n一次性获得10陆军经验和一项50%支援科技加成。"
 SOF_PARTY_PDP_PDP_MANDATE:0 "民主与社会责任"
 SOF_PARTY_PDP_PDP_MANDATE_desc:0 "PDP的社会天主教与共和民主结合。\n实施：一次性政治点增加30、稳定度提高1个百分点。"
 SOF_PARTY_PDP_PDP_BODIES:0 "承认中间团体"
 SOF_PARTY_PDP_PDP_BODIES_desc:0 "中间团体与职业代表传统。\n实施：消耗20政治点，一次性稳定度提高2个百分点，直接落实职业调解。"
 SOF_PARTY_PDP_PDP_FAMILIES:0 "扩大家庭互助"
 SOF_PARTY_PDP_PDP_FAMILIES_desc:0 "扩大家庭补助与互助网络。\n一次性稳定度提高3个百分点；家庭互助启动费用使消费品工厂系数提高2%，持续180天；完成共和契约可提前结束成本。"
 sof_party_policy_pdp_pdp_bargain:0 "劳资调解会议"
 sof_party_policy_pdp_pdp_bargain_desc:0 "通过劳资组织协商落实社会改革。\n消耗25政治点；执政期间生产效率增长提高3%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_BARGAIN:0 "劳资调解会议"
 SOF_PARTY_PDP_PDP_BARGAIN_desc:0 "通过劳资组织协商落实社会改革。\n消耗25政治点；执政期间生产效率增长提高3%。"
 sof_party_policy_pdp_pdp_insurance:0 "社会保险互济"
 sof_party_policy_pdp_pdp_insurance_desc:0 "社会保险政策以短期成本换稳定。\n实施：执政期间社会保险提供2个百分点稳定度；建立制度的一次性磨合费用使工厂产出降低2%，持续180天。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_INSURANCE:0 "社会保险互济"
 SOF_PARTY_PDP_PDP_INSURANCE_desc:0 "社会保险政策以短期成本换稳定。\n实施：执政期间社会保险提供2个百分点稳定度；建立制度的一次性磨合费用使工厂产出降低2%，持续180天。"
 sof_party_policy_pdp_pdp_council:0 "地方经济社会理事会"
 sof_party_policy_pdp_pdp_council_desc:0 "建立地方经济社会理事会，联结区域自治与职业代表。\n消耗30政治点并获得一项25%建筑科技加成，代表县际协作的落实；执政期间基础设施建造速度提高6%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_COUNCIL:0 "地方经济社会理事会"
 SOF_PARTY_PDP_PDP_COUNCIL_desc:0 "建立地方经济社会理事会，联结区域自治与职业代表。\n消耗30政治点并获得一项25%建筑科技加成，代表县际协作的落实；执政期间基础设施建造速度提高6%。"
 SOF_PARTY_PDP_PDP_RIGHTS:0 "扩大公民代表权"
 SOF_PARTY_PDP_PDP_RIGHTS_desc:0 "推进妇女选举权与比例代表改革。\n消耗35政治点，一次性稳定度提高2个百分点，永久记载代表权改革；不重写1936年的原始票数。完成记录与稳定度不因换届撤回。"
 sof_party_policy_pdp_pdp_compact:0 "社会伙伴的共和契约"
 sof_party_policy_pdp_pdp_compact_desc:0 "以共和契约巩固社会改革与团体自治。\n一次性政治点增加25，结束家庭互助启动费用；执政期间额外提供2%生产效率增长，保留选举。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_COMPACT:0 "社会伙伴的共和契约"
 SOF_PARTY_PDP_PDP_COMPACT_desc:0 "以共和契约巩固社会改革与团体自治。\n一次性政治点增加25，结束家庭互助启动费用；执政期间额外提供2%生产效率增长，保留选举。"
 SOF_PARTY_UPR_UPR_MANDATE:0 "阿尔萨斯的地方委托"
 SOF_PARTY_UPR_UPR_MANDATE_desc:0 "争取阿尔萨斯地方委托，维护独立的区域党派身份。\n仅阿尔萨斯原生STR：一次性政治点增加30、稳定度提高1个百分点。"
 SOF_PARTY_UPR_UPR_LOCAL_LAW:0 "维持地方法律制度"
 SOF_PARTY_UPR_UPR_LOCAL_LAW_desc:0 "维护阿尔萨斯的特殊法律安排。\n仅在仍有完全控制的阿尔萨斯核心州时执行：消耗25政治点，一次性稳定度提高3个百分点。地方安排仅在阿尔萨斯适用。"
 sof_party_policy_upr_upr_bilingual:0 "双语公共服务"
 sof_party_policy_upr_upr_bilingual_desc:0 "学校和行政的双语诉求。\n实施：消耗25政治点，一项25%电子科技加成代表行政培训；执政且仍控制阿尔萨斯核心州时，政治点获取提高3%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_UPR_UPR_BILINGUAL:0 "双语公共服务"
 SOF_PARTY_UPR_UPR_BILINGUAL_desc:0 "学校和行政的双语诉求。\n实施：消耗25政治点，一项25%电子科技加成代表行政培训；执政且仍控制阿尔萨斯核心州时，政治点获取提高3%。"
 SOF_PARTY_UPR_UPR_SCHOOLS:0 "保障地方学校安排"
 SOF_PARTY_UPR_UPR_SCHOOLS_desc:0 "保障阿尔萨斯既有学校与宗教协定制度。\n保障既有阿尔萨斯学校安排，一次性稳定度提高2个百分点；180天消费品工厂系数提高2%为地区预算支出。没有向其他地区复制宗教学校制度。"
 SOF_PARTY_UPR_UPR_COUNCILS:0 "县市联席协商"
 SOF_PARTY_UPR_UPR_COUNCILS_desc:0 "通过县市联席协商推进区域分权。\n消耗20政治点，在一个自有、完全控制的阿尔萨斯核心州增加1级基础设施；全部满级时改为一项25%工业科研加成。"
 SOF_PARTY_UPR_UPR_SETTLEMENT:0 "地方权利的共和协定"
 SOF_PARTY_UPR_UPR_SETTLEMENT_desc:0 "与共和国协商，维护阿尔萨斯的地域权利。\n一次性稳定度提高2个百分点，结束学校调整费用并获得一项25%建筑科技加成；地方宗教和学校安排不成为全国制度。"
 SOF_PARTY_UPR_UPR_BORDER:0 "边境民防准备"
 SOF_PARTY_UPR_UPR_BORDER_desc:0 "整备阿尔萨斯边境民防设施。\n消耗25政治点，在一个自有、完全控制的阿尔萨斯核心州增加1级防空；满级时改为一项25%工业科研加成。"
 SOF_PARTY_DORIOT_DORIOT_RAYON:0 "保持圣但尼组织"
 SOF_PARTY_DORIOT_DORIOT_RAYON_desc:0 "巩固1935年形成的圣但尼独立地方组织。\n一次性获得25政治点；保持圣但尼独立地方组织的身份。"
 sof_party_policy_doriot_doriot_municipal:0 "市政服务的支持网"
 sof_party_policy_doriot_doriot_municipal_desc:0 "以市政服务巩固街区支持网络。\n消耗20政治点、稳定度一次性提高2个百分点；执政期间基础设施建造速度提高4%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_DORIOT_DORIOT_MUNICIPAL:0 "市政服务的支持网"
 SOF_PARTY_DORIOT_DORIOT_MUNICIPAL_desc:0 "以市政服务巩固街区支持网络。\n消耗20政治点、稳定度一次性提高2个百分点；执政期间基础设施建造速度提高4%。"
 sof_party_policy_doriot_doriot_organizers:0 "动员工厂联络员"
 sof_party_policy_doriot_doriot_organizers_desc:0 "联络工厂中的支持者，组织地方动员。\n一次性政治点增加20、稳定度降低1个百分点；路线定案前且本党执政时政治点获取提高3%。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_DORIOT_DORIOT_ORGANIZERS:0 "动员工厂联络员"
 SOF_PARTY_DORIOT_DORIOT_ORGANIZERS_desc:0 "联络工厂中的支持者，组织地方动员。\n一次性政治点增加20、稳定度降低1个百分点；路线定案前且本党执政时政治点获取提高3%。"
 SOF_PARTY_DORIOT_DORIOT_LOCAL_CHOICE:0 "保留独立工人路线"
 SOF_PARTY_DORIOT_DORIOT_LOCAL_CHOICE_desc:0 "另择独立工人路线，保留圣但尼地方组织。\n明确的反事实选择：一次性稳定度提高2个百分点，结束联络员临时动员政策，保留独立地方党名与选举。"
 SOF_PARTY_DORIOT_DORIOT_PPF:0 "六月的政治转向"
 SOF_PARTY_DORIOT_DORIOT_PPF_desc:0 "1936年6月28日后召开政治会议：选择建立新的全国性政党，或保留圣但尼独立路线。"
