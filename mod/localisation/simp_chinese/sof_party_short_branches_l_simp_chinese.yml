l_simp_chinese:
 SOF_PARTY_PCF_PCF_MANDATE:0 "面包、和平与自由"
 SOF_PARTY_PCF_PCF_MANDATE_desc:0 "反危机与反法西斯的人民阵线方向。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+25；解锁一次群众联合大会决议，花费25政治点换取稳定度+1个百分点。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_pcf_pcf_hand:0 "向天主教劳动者伸手"
 sof_party_policy_pcf_pcf_hand_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.03，代表跨宗教协商的组织收益。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_HAND:0 "向天主教劳动者伸手"
 SOF_PARTY_PCF_PCF_HAND_desc:0 "1936年4月伸手政策跨越宗教分歧。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；执政期间每日政治点+0.03，代表跨宗教协商的组织收益。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_pcf_pcf_workshops:0 "工厂与街区支部"
 sof_party_policy_pcf_pcf_workshops_desc:0 "有自有且控制的核心工业州时政治点+10；执政期间生产效率增长+2%；解锁一次25政治点工会调解，降低一档既有通用罢工，无罢工则稳定度+0.5个百分点。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_WORKSHOPS:0 "工厂与街区支部"
 SOF_PARTY_PCF_PCF_WORKSHOPS_desc:0 "共产党以劳动者组织及群众动员为政治基础；具体组织工程为设计推演。 地方权限内执行；具体工具及数值为玩法推演。\n实施：有自有且控制的核心工业州时政治点+10；执政期间生产效率增长+2%；解锁一次25政治点工会调解，降低一档既有通用罢工，无罢工则稳定度+0.5个百分点。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_pcf_pcf_families:0 "打破二百家族的支配"
 sof_party_policy_pcf_pcf_families_desc:0 "政治点-30；90天稳定度-1个百分点；执政期间民用工厂建造速度+3%，仅代表辖内信贷与采购改革。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_FAMILIES:0 "打破二百家族的支配"
 SOF_PARTY_PCF_PCF_FAMILIES_desc:0 "整顿本地区金融财团对地方信贷与采购的控制。使用1936反寡头语言，不声称省份政府改革全国法兰西银行或没收全国私产。\n实施：政治点-30；90天稳定度-1个百分点；执政期间民用工厂建造速度+3%，仅代表辖内信贷与采购改革。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PCF_PCF_PEASANTS:0 "团结劳动农民"
 SOF_PARTY_PCF_PCF_PEASANTS_desc:0 "讲话同时关注农业危机，跨阶层联合不是强制集体农庄。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；解锁一次城乡食品救济决议，花费20政治点再获得1个百分点稳定度。城市地区采用供应协商，不虚构农村资源。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PCF_PCF_LEAGUES:0 "解除准军事联盟武装"
 SOF_PARTY_PCF_PCF_LEAGUES_desc:0 "解散反共和准军事组织是明确诉求。 地方权限内执行；具体工具及数值为玩法推演。\n实施：通过辖内共和治安执法获得稳定度+1.5个百分点；不虚构暴力组织或移除其他路线的特殊精神。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_pcf_pcf_arms:0 "公共军工监督"
 sof_party_policy_pcf_pcf_arms_desc:0 "执政期间军工产出+3%；已有自有核心军工时180天交接修正-5%，合计初期-2%；无合格军工时改为陆军经验+3的采购审计，不赠工厂。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PCF_PCF_ARMS:0 "公共军工监督"
 SOF_PARTY_PCF_PCF_ARMS_desc:0 "共同纲领要求军工国有化；地方仅能处置自有军工。 地方权限内执行；具体工具及数值为玩法推演。\n实施：执政期间军工产出+3%；已有自有核心军工时180天交接修正-5%，合计初期-2%；无合格军工时改为陆军经验+3的采购审计，不赠工厂。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PCF_PCF_SECURITY:0 "共同抵抗法西斯侵略"
 SOF_PARTY_PCF_PCF_SECURITY_desc:0 "1936强调集体安全及对苏友好，不等于自动成为苏联傀儡。 地方权限内执行；具体工具及数值为玩法推演。\n实施：战争支持度+2个百分点；解锁一次35政治点邻邦安全协商，接受方可拒绝。接受后签署互不侵犯协定并各获陆军经验+3，不自动入阵营或参战。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_SFIO_SFIO_OFFICE:0 "承担执政责任"
 SOF_PARTY_SFIO_SFIO_OFFICE_desc:0 "布鲁姆要求执政；无单独多数时愿按共同纲领联合执政。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+25，稳定度+0.5个百分点。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_SFIO_SFIO_AGREEMENTS:0 "劳资集体协约"
 SOF_PARTY_SFIO_SFIO_AGREEMENTS_desc:0 "1936年6月协约与立法成果，不伪称1月纲领全部已定。 地方权限内执行；具体工具及数值为玩法推演。\n实施：1936年6月后实施；降低一档既有通用罢工；若无通用罢工则稳定度+0.5个百分点。120天军工产出-1%，表示集体协约磨合。\n史料说明：1936年执政措施的地方转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_SFIO_SFIO_HOURS:0 "四十小时工作周"
 SOF_PARTY_SFIO_SFIO_HOURS_desc:0 "竞选主张缩短工时，40小时是1936立法具体化。 地方权限内执行；具体工具及数值为玩法推演。\n实施：1936年6月后制定地方工时法：永久稳定度+1.5个百分点；180天军工产出-2%；法律换届保留且不重复叠加。\n史料说明：竞选方向＋1936年立法；上述效果与数值均为玩法设计。"
 sof_party_policy_sfio_sfio_demand:0 "以购买力走出危机"
 sof_party_policy_sfio_sfio_demand_desc:0 "执政期间民用工厂建造速度+3%；90天每日政治点-0.10代表救济拨款协调成本。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_DEMAND:0 "以购买力走出危机"
 SOF_PARTY_SFIO_SFIO_DEMAND_desc:0 "竞选讲话反对通缩，主张扩大消费。 地方权限内执行；具体工具及数值为玩法推演。\n实施：执政期间民用工厂建造速度+3%；90天每日政治点-0.10代表救济拨款协调成本。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_sfio_sfio_credit:0 "地方信用与关键企业公营化"
 sof_party_policy_sfio_sfio_credit_desc:0 "政治点-45；180天稳定度-1个百分点；执政期间生产效率上限+3个百分点，改革仅限辖内信用和企业。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_CREDIT:0 "地方信用与关键企业公营化"
 SOF_PARTY_SFIO_SFIO_CREDIT_desc:0 "以1936年SFIO国有化主张为依据，在省份国家自身权限内设立公共信贷、处理辖内关键企业；不处置全国银行。\n实施：政治点-45；180天稳定度-1个百分点；执政期间生产效率上限+3个百分点，改革仅限辖内信用和企业。\n史料说明：1936党纲方向；地方实行属于架空强化路线；上述效果与数值均为玩法设计。"
 sof_party_policy_sfio_sfio_compromise:0 "履行共同纲领"
 sof_party_policy_sfio_sfio_compromise_desc:0 "政治点+15，稳定度+1个百分点；执政期间每日政治点+0.03，体现最低共同纲领的议会合作。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_COMPROMISE:0 "履行共同纲领"
 SOF_PARTY_SFIO_SFIO_COMPROMISE_desc:0 "布鲁姆明确承诺联合政府执行共同纲领。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+15，稳定度+1个百分点；执政期间每日政治点+0.03，体现最低共同纲领的议会合作。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_SFIO_SFIO_WORKS:0 "地方储蓄建设计划"
 SOF_PARTY_SFIO_SFIO_WORKS_desc:0 "地方储蓄融资公共工程属于竞选方案。 地方权限内执行；具体工具及数值为玩法推演。\n实施：支付25政治点，在一个自有且完全控制的核心州建设1级基础设施；无合格州或设施已满时返还10政治点。设施换届保留，一生仅领取一次。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_SFIO_SFIO_LEAVE:0 "两周属于劳动者的假期"
 SOF_PARTY_SFIO_SFIO_LEAVE_desc:0 "6月20日带薪休假法；该诉求不在1月共同纲领。 地方权限内执行；具体工具及数值为玩法推演。\n实施：1936年6月20日后制定两周带薪休假：永久稳定度+1个百分点；若完成时无防御战争，180天战争支持度-1个百分点。法律换届保留。\n史料说明：1936年6月立法成果；上述效果与数值均为玩法设计。"
 sof_party_policy_sfio_sfio_leisure:0 "文化、体育与公共休闲"
 sof_party_policy_sfio_sfio_leisure_desc:0 "政治点+5；执政期间基础设施建造速度+3%；解锁一次免费公共休闲活动，稳定度+0.5个百分点、政治点+15，不增加科研槽。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_SFIO_SFIO_LEISURE:0 "文化、体育与公共休闲"
 SOF_PARTY_SFIO_SFIO_LEISURE_desc:0 "带薪休假政策推动休闲文化消费，具体地区设施为设计。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+5；执政期间基础设施建造速度+3%；解锁一次免费公共休闲活动，稳定度+0.5个百分点、政治点+15，不增加科研槽。\n史料说明：1936执政方向的地方设计；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_REPUBLIC:0 "唤醒共和意识"
 SOF_PARTY_PRRRS_PRRRS_REPUBLIC_desc:0 "Sarraut 1936年DR30宣传册以共和意识为题。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点，政治点+20。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_prrrs_prrrs_banks:0 "监督银行，保护储蓄"
 sof_party_policy_prrrs_prrrs_banks_desc:0 "政治点+5；执政期间民用工厂建造速度+2%，体现地方银行审计与储蓄保护。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PRRRS_PRRRS_BANKS:0 "监督银行，保护储蓄"
 SOF_PARTY_PRRRS_PRRRS_BANKS_desc:0 "监督本地银行账目与公共存款、保护本地储蓄者；不改变全国中央银行章程。1936激进党银行监督宣传册已确认存在，具体地方工具为设计推演。\n实施：政治点+5；执政期间民用工厂建造速度+2%，体现地方银行审计与储蓄保护。\n史料说明：主题有1936目录证据；工具与数值为设计；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_RURAL:0 "农民的共和国"
 SOF_PARTY_PRRRS_PRRRS_RURAL_desc:0 "Liautey 1936年DR29标题确证保卫农民主题。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；解锁一次20政治点城乡食品救济，稳定度再+1个百分点。与共产党救济共用一次性账本，不能换党重复领取。\n史料说明：主题有1936目录证据；工具与数值为设计；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_COOPS:0 "合作社与农业信用"
 SOF_PARTY_PRRRS_PRRRS_COOPS_desc:0 "共同纲领支持农业合作社、信用与债务安排；非激进党独占。 地方权限内执行；具体工具及数值为玩法推演。\n实施：支付20政治点，在一个无军工且民用工厂少于2座的自有控制核心州建设1级基础设施；这是低工业化地区的玩法判据。无合格州或已满级则返还10政治点，作为城市供应协调替代。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_SCHOOL:0 "十四岁之前的公共学校"
 SOF_PARTY_PRRRS_PRRRS_SCHOOL_desc:0 "共同纲领提出延长义务教育；Jean Zay为激进党部长。 地方权限内执行；具体工具及数值为玩法推演。\n实施：1936年8月后延长辖内义务教育：政治点-25；永久研究速度+0.5%。不立即赠予研究槽。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_CONSCIENCE:0 "学校中立与良心自由"
 SOF_PARTY_PRRRS_PRRRS_CONSCIENCE_desc:0 "Jean Zay1936年末学校中立通告。 地方权限内执行；具体工具及数值为玩法推演。\n实施：1936年12月后制定辖内学校中立条例：永久稳定度+0.5个百分点；不干涉私人信仰，不伪称降低尚未实现的宗教事件烈度。\n史料说明：1936年12月措施的地方转化；上述效果与数值均为玩法设计。"
 sof_party_policy_prrrs_prrrs_accounts:0 "整顿公共账目"
 sof_party_policy_prrrs_prrrs_accounts_desc:0 "政治点-15；执政期间每日政治点+0.06。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PRRRS_PRRRS_ACCOUNTS:0 "整顿公共账目"
 SOF_PARTY_PRRRS_PRRRS_ACCOUNTS_desc:0 "共同纲领反浪费并整顿公共生活。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点-15；执政期间每日政治点+0.06。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PRRRS_PRRRS_BALANCE:0 "守住共和改革联盟"
 SOF_PARTY_PRRRS_PRRRS_BALANCE_desc:0 "1936党派保留独立身份并承诺共同方案；并非取消阶级分歧。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；解锁一次免费联盟调解，再获稳定度+1个百分点。党派继续独立参选。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_usr_usr_coalition:0 "共和社会主义者入阁"
 sof_party_policy_usr_usr_coalition_desc:0 "政治点+30；执政期间每日政治点+0.02，代表共和派组阁协调。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_COALITION:0 "共和社会主义者入阁"
 SOF_PARTY_USR_USR_COALITION_desc:0 "支持参与政府；USR是共同纲领签署组织。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+30；执政期间每日政治点+0.02，代表共和派组阁协调。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_usr_usr_expertise:0 "经济协调委员会"
 sof_party_policy_usr_usr_expertise_desc:0 "政治点-20；执政期间生产效率增长+4%，采用经济协调而非SFIO社会化路线。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_EXPERTISE:0 "经济协调委员会"
 SOF_PARTY_USR_USR_EXPERTISE_desc:0 "Ramadier关注经济理事会与部门治理；这里选择共和改革派实现。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点-20；执政期间生产效率增长+4%，采用经济协调而非SFIO社会化路线。\n史料说明：人物履历支持的地方政策推演，不宣称完整党纲原句；上述效果与数值均为玩法设计。"
 SOF_PARTY_USR_USR_ARBITRATION:0 "产业争议调停"
 SOF_PARTY_USR_USR_ARBITRATION_desc:0 "1936–1937任内解决劳资冲突；不提前套用1938年具体法律。 地方权限内执行；具体工具及数值为玩法推演。\n实施：降低一档既有通用罢工，另获稳定度+0.5个百分点；无通用罢工时总计+1个百分点。不移除其他地区路线专属危机。\n史料说明：1936–1937实践方向，机制为设计；上述效果与数值均为玩法设计。"
 sof_party_policy_usr_usr_power:0 "电力与公共工程"
 sof_party_policy_usr_usr_power_desc:0 "在一个自有且完全控制核心州建设1级基础设施；无合格州或已满级时政治点+10。执政期间基础设施建设速度+3%；不瞬间建成具名大型水坝。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_POWER:0 "电力与公共工程"
 SOF_PARTY_USR_USR_POWER_desc:0 "1936–1937公共工程、电力建设工作。 地方权限内执行；具体工具及数值为玩法推演。\n实施：在一个自有且完全控制核心州建设1级基础设施；无合格州或已满级时政治点+10。执政期间基础设施建设速度+3%；不瞬间建成具名大型水坝。\n史料说明：1936–1937实践的地方适配；上述效果与数值均为玩法设计。"
 SOF_PARTY_USR_USR_SURVEYS:0 "燃料调查与技术人员"
 SOF_PARTY_USR_USR_SURVEYS_desc:0 "任期内圣戈当勘探；不是1936立即发现并投产大油田。 地方权限内执行；具体工具及数值为玩法推演。\n实施：获得一次工业科技25%研究加成。采用普遍技术调查，不把未核实圣戈当州映射写成油田产出或空勘探决议。\n史料说明：1936–1937实践启发；只给调查；上述效果与数值均为玩法设计。"
 SOF_PARTY_USR_USR_GENEVA:0 "争取集体安全的承认"
 SOF_PARTY_USR_USR_GENEVA_desc:0 "以Paul-Boncour国联取向为依据，省份国家向邻邦提出调停与互不侵犯倡议；未被承认时只作区域外交，不凭空授予国联席位。\n实施：政治点+10；解锁一次25政治点邻邦和平协商。对方同意后互不侵犯并互增关系+15并随时间衰减；拒绝时返还10政治点。仅限区域外交，不授予国联席位。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_usr_usr_government:0 "让改革能够执行"
 sof_party_policy_usr_usr_government_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.04，整合财政、工程与外交执行。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_USR_USR_GOVERNMENT:0 "让改革能够执行"
 SOF_PARTY_USR_USR_GOVERNMENT_desc:0 "联盟中共和参与派的政府执行取向；综合结算是设计。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；执政期间每日政治点+0.04，整合财政、工程与外交执行。\n史料说明：史实取向的架空综合终点；上述效果与数值均为玩法设计。"
 SOF_PARTY_PUP_PUP_BRIDGE:0 "重搭图尔之后的桥梁"
 SOF_PARTY_PUP_PUP_BRIDGE_desc:0 "Paul Louis强调弥合1920年分裂后的工人组织。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点+25；解锁一次本国内工人组织预备会，花费15政治点获得稳定度+0.5个百分点。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PUP_PUP_DEMOCRACY:0 "党内民主保障"
 SOF_PARTY_PUP_PUP_DEMOCRACY_desc:0 "明确以党内民主区别于共产党。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1.5个百分点；180天每日政治点-0.05为党内表决成本。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 sof_party_policy_pup_pup_unions:0 "工会不做党的附属"
 sof_party_policy_pup_pup_unions_desc:0 "降低一档既有通用罢工，无罢工则稳定度+0.5个百分点；执政期间军工产出+1.5%，体现自主工会与政府协商。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PUP_PUP_UNIONS:0 "工会不做党的附属"
 SOF_PARTY_PUP_PUP_UNIONS_desc:0 "明确维护工会自主。 地方权限内执行；具体工具及数值为玩法推演。\n实施：降低一档既有通用罢工，无罢工则稳定度+0.5个百分点；执政期间军工产出+1.5%，体现自主工会与政府协商。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_PUP_PUP_UNITY:0 "共同的工人会议"
 SOF_PARTY_PUP_PUP_UNITY_desc:0 "1936年工人政党统一谈判未达最终合并。 地方权限内执行；具体工具及数值为玩法推演。\n实施：政治点-20、稳定度+1个百分点；开启后续独立或本地联合协议选择。不调用外国国家充当本地党组织。\n史料说明：1936实际谈判的地方架空；上述效果与数值均为玩法设计。"
 sof_party_policy_pup_pup_independent:0 "保留独立的统一派"
 sof_party_policy_pup_pup_independent_desc:0 "稳定度+1个百分点；执政期间每日政治点+0.05；保留PUP身份，明确属于架空延续。（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PUP_PUP_INDEPENDENT:0 "保留独立的统一派"
 SOF_PARTY_PUP_PUP_INDEPENDENT_desc:0 "历史上统一方案存在争议；维持独立作为明确架空选择。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；执政期间每日政治点+0.05；保留PUP身份，明确属于架空延续。\n史料说明：架空延续路线；上述效果与数值均为玩法设计。"
 SOF_PARTY_PUP_PUP_SOCIALIST_UNION:0 "与社会主义者商议联合"
 SOF_PARTY_PUP_PUP_SOCIALIST_UNION_desc:0 "邀请本地SFIO组织商议共同名单，由双方同意；不代表全国SFIO或强制1937历史合并。\n实施：支付20政治点邀请本地SFIO代表。65%概率获得须由议会批准的有限合作文本，批准稳定度+1.5个百分点；35%概率谈判拒绝，返还20政治点。玩家也可拒绝文本并退款。只建立国内政策合作，不自动合并或更改选举名单。\n史料说明：1936谈判基础上的可选架空结果；上述效果与数值均为玩法设计。"
 SOF_PARTY_PUP_PUP_AGAINST_WAR:0 "工人国际联系与反战"
 SOF_PARTY_PUP_PUP_AGAINST_WAR_desc:0 "自述明确反战并与国外类似政党联系。 地方权限内执行；具体工具及数值为玩法推演。\n实施：稳定度+1个百分点；无防御战争时战争支持度-1.5个百分点。解锁一次25政治点辖内战争受害者人道救济，稳定度+1个百分点；不产生远征军或对外干预。\n史料说明：1936竞选立场的地方架空转化；上述效果与数值均为玩法设计。"
 SOF_PARTY_RG_AD_RG_AD_COMMITTEES:0 "整合地方共和派"
 SOF_PARTY_RG_AD_RG_AD_COMMITTEES_desc:0 "以组织松散的地方名流为基础推进党组织整合。\n\n实施：一次性获得35政治点，建立地方共和派协作；不设置无后续用途的委员会旗标。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_rg_ad_rg_ad_accounts:0 "公开地方账目"
 sof_party_policy_rg_ad_rg_ad_accounts_desc:0 "财政审慎的制度化设计；不是已经核实的1936逐字竞选承诺。\n\n实施：一次性消耗20政治点、稳定度下降1个百分点；执政期间消费品工厂系数降低2%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_ACCOUNTS:0 "公开地方账目"
 SOF_PARTY_RG_AD_RG_AD_ACCOUNTS_desc:0 "财政审慎的制度化设计；不是已经核实的1936逐字竞选承诺。\n\n实施：一次性消耗20政治点、稳定度下降1个百分点；执政期间消费品工厂系数降低2%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_rg_ad_rg_ad_reconcile:0 "共和国的调和者"
 sof_party_policy_rg_ad_rg_ad_reconcile_desc:0 "1936-04-10反两大敌对阵营的选举呼吁。\n\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_RECONCILE:0 "共和国的调和者"
 SOF_PARTY_RG_AD_RG_AD_RECONCILE_desc:0 "1936-04-10反两大敌对阵营的选举呼吁。\n\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_rg_ad_rg_ad_credit:0 "恢复工商信用"
 sof_party_policy_rg_ad_rg_ad_credit_desc:0 "自由企业与反全面国有化立场的地方改写；后者直接证据为1936选后。\n\n实施：执政期间民用工厂建造速度提高6%、军工建造速度降低3%；后续复苏政策替代本政策。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_CREDIT:0 "恢复工商信用"
 SOF_PARTY_RG_AD_RG_AD_CREDIT_desc:0 "自由企业与反全面国有化立场的地方改写；后者直接证据为1936选后。\n\n实施：执政期间民用工厂建造速度提高6%、军工建造速度降低3%；后续复苏政策替代本政策。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_rg_ad_rg_ad_discipline:0 "约束名流政治"
 sof_party_policy_rg_ad_rg_ad_discipline_desc:0 "以组织改革换取可执行政策，体现名流自治的政治成本。\n\n实施：一次性消耗35政治点、稳定度提高2个百分点；执政期间政治顾问成本降低10%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_DISCIPLINE:0 "约束名流政治"
 SOF_PARTY_RG_AD_RG_AD_DISCIPLINE_desc:0 "以组织改革换取可执行政策，体现名流自治的政治成本。\n\n实施：一次性消耗35政治点、稳定度提高2个百分点；执政期间政治顾问成本降低10%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE:0 "民营承包的公共工程"
 SOF_PARTY_RG_AD_RG_AD_ENTERPRISE_desc:0 "保留私营企业的公共设施建设，属玩法推演。\n\n实施：消耗30政治点，在一个自有、完全控制的核心州增加1级基础设施；全部满级时改为一次25%工业科研加成。建设留存，不承诺选择民工最多的州。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_RG_AD_RG_AD_CENTRE:0 "中间派执政协定"
 SOF_PARTY_RG_AD_RG_AD_CENTRE_desc:0 "中间派共和集中路线；不合并原始选票、不更改他党身份。\n\n实施：一次性稳定度提高2个百分点、政治点增加15；以谈判收益体现中间派协定，不虚构尚未存在的具名顾问邀请。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_rg_ad_rg_ad_recovery:0 "信用与秩序的复苏"
 sof_party_policy_rg_ad_rg_ad_recovery_desc:0 "两线汇合需同时支付政治整合与投资成本，非立即免费工厂。\n\n实施：执政期间以复苏政策替代工商信用：民工建造速度提高5%、生产效率增长提高3%，取消先前军工惩罚。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY:0 "信用与秩序的复苏"
 SOF_PARTY_RG_AD_RG_AD_RECOVERY_desc:0 "两线汇合需同时支付政治整合与投资成本，非立即免费工厂。\n\n实施：执政期间以复苏政策替代工商信用：民工建造速度提高5%、生产效率增长提高3%，取消先前军工惩罚。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_FR_URD_FR_URD_NOTABLES:0 "联合共和派名流"
 SOF_PARTY_FR_URD_FR_URD_NOTABLES_desc:0 "FR依赖省级组织与地方名流。\n\n实施：一次性获得40政治点。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_fr_urd_fr_urd_property:0 "保障私人经营"
 sof_party_policy_fr_urd_fr_urd_property_desc:0 "自由保守经济立场；未取得1936正式纲领全文，按长期传统设计。\n\n实施：一次性稳定度降低1个百分点；执政期间生产效率上限提高3%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_PROPERTY:0 "保障私人经营"
 SOF_PARTY_FR_URD_FR_URD_PROPERTY_desc:0 "自由保守经济立场；未取得1936正式纲领全文，按长期传统设计。\n\n实施：一次性稳定度降低1个百分点；执政期间生产效率上限提高3%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_FR_URD_FR_URD_SCHOOLS:0 "保护自由办学"
 SOF_PARTY_FR_URD_FR_URD_SCHOOLS_desc:0 "保守宗教教育传统；不把教会学校凭空变成额外科研槽。\n\n实施：一次性消耗40政治点、稳定度提高2个百分点，获得一项25%工业科研加成；教育资助直接落实，无空决议或额外科研槽。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_fr_urd_fr_urd_service:0 "维护文官与军队连续性"
 sof_party_policy_fr_urd_fr_urd_service_desc:0 "Marin 1936-05-20反对按政党清洗行政与军官的文章。\n\n实施：一次性获得10陆军经验；执政期间陆军顾问成本降低10%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_SERVICE:0 "维护文官与军队连续性"
 SOF_PARTY_FR_URD_FR_URD_SERVICE_desc:0 "Marin 1936-05-20反对按政党清洗行政与军官的文章。\n\n实施：一次性获得10陆军经验；执政期间陆军顾问成本降低10%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_fr_urd_fr_urd_defence:0 "地方国防承包"
 sof_party_policy_fr_urd_fr_urd_defence_desc:0 "国防与私人承包相结合的游戏推演。\n\n实施：一次性消耗35政治点，获得一项25%建筑科技加成；执政期间军工建造速度提高6%。不虚构专属军工槽位，也不免费建立军工。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE:0 "地方国防承包"
 SOF_PARTY_FR_URD_FR_URD_DEFENCE_desc:0 "国防与私人承包相结合的游戏推演。\n\n实施：一次性消耗35政治点，获得一项25%建筑科技加成；执政期间军工建造速度提高6%。不虚构专属军工槽位，也不免费建立军工。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_fr_urd_fr_urd_legal:0 "议会内的强硬右派"
 sof_party_policy_fr_urd_fr_urd_legal_desc:0 "共和保守的合法主义结局；没有把全党写成必然法西斯化。\n\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%，保留现有选举制度。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_FR_URD_FR_URD_LEGAL:0 "议会内的强硬右派"
 SOF_PARTY_FR_URD_FR_URD_LEGAL_desc:0 "共和保守的合法主义结局；没有把全党写成必然法西斯化。\n\n实施：一次性稳定度提高3个百分点；执政期间政治点获取提高4%，保留现有选举制度。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_FR_URD_FR_URD_NATIONAL:0 "与民族派组织协调"
 SOF_PARTY_FR_URD_FR_URD_NATIONAL_desc:0 "FR部分地方组织在1934–36年靠近联盟团体；此处不命名1937自由阵线。\n\n实施：一次性政治点增加50、稳定度降低4个百分点、战争支持度提高3个百分点；承担激进动员成本，但不改换执政党、不虚构1937年联盟。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_FR_URD_FR_URD_RESERVE:0 "退伍军人的技术传授"
 SOF_PARTY_FR_URD_FR_URD_RESERVE_desc:0 "战争记忆与保守国防社会基础的机制化推演。\n\n实施：一次性获得10陆军经验和一项50%支援科技加成；不凭空生成兵员。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_PDP_PDP_MANDATE:0 "民主与社会责任"
 SOF_PARTY_PDP_PDP_MANDATE_desc:0 "PDP的社会天主教与共和民主结合。\n\n实施：一次性政治点增加30、稳定度提高1个百分点。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_PDP_PDP_BODIES:0 "承认中间团体"
 SOF_PARTY_PDP_PDP_BODIES_desc:0 "中间团体与职业代表传统。\n\n实施：消耗20政治点，一次性稳定度提高2个百分点，直接落实职业调解；不解锁无内容决议。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_PDP_PDP_FAMILIES:0 "扩大家庭互助"
 SOF_PARTY_PDP_PDP_FAMILIES_desc:0 "家庭补助与社会保障传统；不前置1939家庭法典。\n\n实施：一次性稳定度提高3个百分点；家庭互助启动费用使消费品工厂系数提高2%，持续180天；完成共和契约可提前结束成本。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_pdp_pdp_bargain:0 "劳资调解会议"
 sof_party_policy_pdp_pdp_bargain_desc:0 "社会改革通过组织协商落实；具体会议和数值属架空地方方案。\n\n实施：消耗25政治点；执政期间生产效率增长提高3%。未绑定其他系统的罢工期限，因此不声称缩短罢工。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_BARGAIN:0 "劳资调解会议"
 SOF_PARTY_PDP_PDP_BARGAIN_desc:0 "社会改革通过组织协商落实；具体会议和数值属架空地方方案。\n\n实施：消耗25政治点；执政期间生产效率增长提高3%。未绑定其他系统的罢工期限，因此不声称缩短罢工。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_pdp_pdp_insurance:0 "社会保险互济"
 sof_party_policy_pdp_pdp_insurance_desc:0 "社会保险政策以短期成本换稳定。\n\n实施：执政期间社会保险提供2个百分点稳定度；建立制度的一次性磨合费用使工厂产出降低2%，持续180天。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_INSURANCE:0 "社会保险互济"
 SOF_PARTY_PDP_PDP_INSURANCE_desc:0 "社会保险政策以短期成本换稳定。\n\n实施：执政期间社会保险提供2个百分点稳定度；建立制度的一次性磨合费用使工厂产出降低2%，持续180天。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_pdp_pdp_council:0 "地方经济社会理事会"
 sof_party_policy_pdp_pdp_council_desc:0 "地方分权及职业代表合流；本作把国家制度改写为区域机构。\n\n实施：消耗30政治点并获得一项25%建筑科技加成，代表县际协作的落实；执政期间基础设施建造速度提高6%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_COUNCIL:0 "地方经济社会理事会"
 SOF_PARTY_PDP_PDP_COUNCIL_desc:0 "地方分权及职业代表合流；本作把国家制度改写为区域机构。\n\n实施：消耗30政治点并获得一项25%建筑科技加成，代表县际协作的落实；执政期间基础设施建造速度提高6%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_PDP_PDP_RIGHTS:0 "扩大公民代表权"
 SOF_PARTY_PDP_PDP_RIGHTS_desc:0 "妇女选举权、比例代表的长期纲领；不从此倒推1936真实选民。\n\n实施：消耗35政治点，一次性稳定度提高2个百分点，永久记载代表权改革；不重写1936年的原始票数。完成记录与稳定度不因换届撤回。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_pdp_pdp_compact:0 "社会伙伴的共和契约"
 sof_party_policy_pdp_pdp_compact_desc:0 "综合社会改革与自治中间团体的架空执政成果。\n\n实施：一次性政治点增加25，结束家庭互助启动费用；执政期间额外提供2%生产效率增长，保留选举。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_PDP_PDP_COMPACT:0 "社会伙伴的共和契约"
 SOF_PARTY_PDP_PDP_COMPACT_desc:0 "综合社会改革与自治中间团体的架空执政成果。\n\n实施：一次性政治点增加25，结束家庭互助启动费用；执政期间额外提供2%生产效率增长，保留选举。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_MANDATE:0 "阿尔萨斯的地方委托"
 SOF_PARTY_UPR_UPR_MANDATE_desc:0 "地方主义党派身份；不是全国PDP的别名。\n\n实施：仅阿尔萨斯原生STR：一次性政治点增加30、稳定度提高1个百分点。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_LOCAL_LAW:0 "维持地方法律制度"
 SOF_PARTY_UPR_UPR_LOCAL_LAW_desc:0 "维护阿尔萨斯特殊制度的长期诉求；不是把德国制度或领土归属强行恢复。\n\n实施：仅在仍有完全控制的阿尔萨斯核心州时执行：消耗25政治点，一次性稳定度提高3个百分点。地方安排限定阿尔萨斯，不把地方宗教制度推广至新占领区。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_upr_upr_bilingual:0 "双语公共服务"
 sof_party_policy_upr_upr_bilingual_desc:0 "学校和行政的双语诉求。\n\n实施：消耗25政治点，一项25%电子科技加成代表行政培训；执政且仍控制阿尔萨斯核心州时，政治点获取提高3%。不宣称存在另一个未实现决议。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_UPR_UPR_BILINGUAL:0 "双语公共服务"
 SOF_PARTY_UPR_UPR_BILINGUAL_desc:0 "学校和行政的双语诉求。\n\n实施：消耗25政治点，一项25%电子科技加成代表行政培训；执政且仍控制阿尔萨斯核心州时，政治点获取提高3%。不宣称存在另一个未实现决议。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_SCHOOLS:0 "保障地方学校安排"
 SOF_PARTY_UPR_UPR_SCHOOLS_desc:0 "地方学校、宗教协定制度；不能写成1936选前反对尚未颁布的10月教育措施。\n\n实施：保障既有阿尔萨斯学校安排，一次性稳定度提高2个百分点；180天消费品工厂系数提高2%为地区预算支出。没有向其他地区复制宗教学校制度。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_COUNCILS:0 "县市联席协商"
 SOF_PARTY_UPR_UPR_COUNCILS_desc:0 "区域分权诉求的可玩地方改写；不凭空创设全国联邦。\n\n实施：消耗20政治点，在一个自有、完全控制的阿尔萨斯核心州增加1级基础设施；全部满级时改为一项25%工业科研加成。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_SETTLEMENT:0 "地方权利的共和协定"
 SOF_PARTY_UPR_UPR_SETTLEMENT_desc:0 "与共和国协商维护地域权利；不能把自治主义等同亲纳粹或独立。\n\n实施：一次性稳定度提高2个百分点，结束学校调整费用并获得一项25%建筑科技加成；地方宗教和学校安排不成为全国制度。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_UPR_UPR_BORDER:0 "边境民防准备"
 SOF_PARTY_UPR_UPR_BORDER_desc:0 "边境地理适配的架空行政措施，不声称是UPR正式1936政纲。\n\n实施：消耗25政治点，在一个自有、完全控制的阿尔萨斯核心州增加1级防空；满级时改为一项25%工业科研加成。以明确的阿尔萨斯州域替代含糊的潜在敌国判定。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_DORIOT_DORIOT_RAYON:0 "保持圣但尼组织"
 SOF_PARTY_DORIOT_DORIOT_RAYON_desc:0 "1935年已有独立于PCF的地方竞选组织；4月不能称PPF。\n\n实施：一次性获得25政治点；保持圣但尼独立地方组织的身份。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_doriot_doriot_municipal:0 "市政服务的支持网"
 sof_party_policy_doriot_doriot_municipal_desc:0 "以市政组织基础推演；非声称找到独立1936详细纲领。\n\n实施：消耗20政治点、稳定度一次性提高2个百分点；执政期间基础设施建造速度提高4%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_DORIOT_DORIOT_MUNICIPAL:0 "市政服务的支持网"
 SOF_PARTY_DORIOT_DORIOT_MUNICIPAL_desc:0 "以市政组织基础推演；非声称找到独立1936详细纲领。\n\n实施：消耗20政治点、稳定度一次性提高2个百分点；执政期间基础设施建造速度提高4%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 sof_party_policy_doriot_doriot_organizers:0 "动员工厂联络员"
 sof_party_policy_doriot_doriot_organizers_desc:0 "工人组织来源的抽象；不将1938法西斯社团纲领前置。\n\n实施：一次性政治点增加20、稳定度降低1个百分点；路线定案前且本党执政时政治点获取提高3%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文（本党执政期间生效；已建成设施不受换届影响。）"
 SOF_PARTY_DORIOT_DORIOT_ORGANIZERS:0 "动员工厂联络员"
 SOF_PARTY_DORIOT_DORIOT_ORGANIZERS_desc:0 "工人组织来源的抽象；不将1938法西斯社团纲领前置。\n\n实施：一次性政治点增加20、稳定度降低1个百分点；路线定案前且本党执政时政治点获取提高3%。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_DORIOT_DORIOT_LOCAL_CHOICE:0 "保留独立工人路线"
 SOF_PARTY_DORIOT_DORIOT_LOCAL_CHOICE_desc:0 "明确反事实分支：允许不走历史上的PPF转向，不宣称现实Doriot实施过。\n\n实施：明确的反事实选择：一次性稳定度提高2个百分点，结束联络员临时动员政策，保留独立地方党名与选举。\n\n史料性质：游戏数值及地方落地均为设计推演，非史料原文"
 SOF_PARTY_DORIOT_DORIOT_PPF:0 "六月的政治转向"
 SOF_PARTY_DORIOT_DORIOT_PPF_desc:0 "1936年6月28日后才可进行；完成后弹出可见事件，选择建立新的全国性政党或保持圣但尼独立路线。没有未经研究的后续国策，也没有后期成熟纲领。\n\n依据：1936年中组织转向的研究；不倒灌后期纲领。"
