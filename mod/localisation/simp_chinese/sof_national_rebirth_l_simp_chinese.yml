 SOF_NR_BRD_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_BRD_settlement:0 "法国重新签下自己的名字"
 SOF_NR_BRD_settlement_desc:0 "共同政府将向海外说明新法国的关税、债务与贸易规则，争取平等交往和正常承认。波尔多的港务经验将服务全国，预算由各地代表共同决定。我们将区分民用周转与军需信用，公开重建债务，并让酒农和码头工人看到回款。能够兑现的国家承诺，比一场盛大的签字仪式更有分量。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_TOU_mandate:0 "让法国重新拥有上升的方向"
 SOF_NR_TOU_mandate_desc:0 "图卢兹的试飞员知道，图纸上的承诺必须由真正的飞行检验。工程师、工场代表与比利牛斯乡村代表将用同样的标准审视国家：能够供给、能够负责，才有资格要求全国服从。我们将以技术组织与公共监督争取领导权，把法国从争吵不休的地面重新带向未来，并以公共监督确保技术判断服务全体居民。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_TOU_integration:0 "机翼之下必须有完整的国家"
 SOF_NR_TOU_integration_desc:0 "飞机飞得再远，也需要机床、燃料与地面人员。图卢兹的统一事业将把航空、塔布军械与道路运输联成体系，向各地提出共同采购和技术训练的计划。军队能够争夺城镇，真正的整合却要让工场与乡村重新协作。国家将在每次准时交付中证明自己，让航空成就扎根于可靠生产。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_TOU_unitary:0 "一个主权，一部共同法律"
 SOF_NR_TOU_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_TOU_federal:0 "共同主权，各省宪章"
 SOF_NR_TOU_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_TOU_proclamation:0 "法国重新站立"
 SOF_NR_TOU_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_TOU_settlement:0 "把试验的勇气交还公民"
 SOF_NR_TOU_settlement_desc:0 "统一后的法国将扩展技术教育、民用航空与公开采购，把战时积累的技能用于更远的通信和更可靠的生活。图卢兹承诺为失败的试验保留改进空间，也要求专员在授权结束时交还权力。研发会消耗时间，安全检验会推迟交付；一个愿意承认问题的国家，才能真正掌握进步的方向。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_NAN_mandate:0 "洪水退去，国界也应退去"
 SOF_NR_NAN_mandate_desc:0 "南特洪水让各地认识到，道路、堤岸与粮食供应需要跨越行政边界共同治理。船台工人、受灾家庭和卢瓦尔河畔的农民曾必须互相依靠，现在要把这种责任带向全国。我们将争取领导法国，因为灾难中的救援经验已经说明：只有共同调动资源的国家，才能让脆弱的地方不再独自等待。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_NAN_integration:0 "从卢瓦尔船台驶向全国"
 SOF_NR_NAN_integration_desc:0 "圣纳泽尔的船台与南特的码头将共同支撑统一行动，内陆粮食则维系着海岸的动员。合理分配商船与军舰船台，使舰队建设、补给和民用航运协调发展。谈判将优先打开河海通路，战斗则服务于结束阻断；一个让货物仍无法抵达居民的胜利，只是另一场被延长的灾难。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_NAN_unitary:0 "一个主权，一部共同法律"
 SOF_NR_NAN_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
