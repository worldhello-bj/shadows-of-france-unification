 sof_nr.100.t:0 "巴黎再次成为法国的首都"
 sof_nr.100.d:0 "巴黎车站迎来各省代表，市政厅前的欢呼声伴随着第一批复员军人的脚步。由首都发起的统一事业已经完成，新政府宣布把共同宪章与战后预算交付全国审议。掌握法国的印章终于再次意味着承担法国的责任；能否让乡村与边境分享和平，将决定这份新生的合法性能够延续多久。"
 sof_nr.100.a:0 "让国家大于首都。"
 sof_nr.101.t:0 "来自海上的统一宣言"
 sof_nr.101.d:0 "最初从阿雅克肖驶出的远征船队，如今开始运送返乡军人与建设器材。法国各地承认了由岛屿发起的共同政府，科西嘉不再只是地图边缘的一块土地。新政府许诺让海运、山路与学校抵达曾被忽略的地方，而为远征承担损失的家庭正等待这些承诺变成和平生活。"
 sof_nr.101.a:0 "从此没有遥远的法国。"
 sof_nr.102.t:0 "西部的承诺成为全国宪章"
 sof_nr.102.d:0 "从雷恩传出的统一宣言在各地市政厅宣读。布列塔尼军人即将复员，港口重新迎来民用货物，地方教育与共同国防的安排则成为新宪章最受关注的部分。统一者将以共同权利和相互信任凝聚国家；它还必须使不同地方的人愿意为同一个未来负责。"
 sof_nr.102.a:0 "让每一种乡音都说出法国。"
 sof_nr.103.t:0 "马赛的汽笛响彻法国"
 sof_nr.103.d:0 "马赛港在统一宣言公布后鸣笛，向北开出的列车满载粮食和修复器材。曾沿罗讷河展开的统一事业，终于成为一个覆盖全国的政府。港口的劳动代表与内陆各地代表将共同审议重建预算；曾经团结他们的饥饿、失业与战争，也将成为检验新制度是否兑现承诺的第一道难题。"
 sof_nr.103.a:0 "让共同劳动托起共同国家。"
 sof_nr.104.t:0 "北方重新铸成法国"
 sof_nr.104.d:0 "煤车和粮车在重新开放的线路上交错驶过，里尔宣布全国统一。工业城市的工人走出厂门庆祝，矿区家庭则等待失踪者消息与复员通知。新政府把生产者的全国契约作为重建的起点；它必须证明，增长的钢铁和布匹不仅属于报表，也能成为各地居民更安稳的生活。"
 sof_nr.104.a:0 "熔炉的光照亮所有人。"
 sof_nr.105.t:0 "边境终于有了整个法国"
 sof_nr.105.d:0 "梅斯的哨所收到全国统一的通告，运粮列车与民用订单随后抵达。新政府宣布共同分担国防费用，并将部分钢铁产能转向住房与铁路。高炉与堡垒曾支撑统一事业，如今也必须让出和平生活的位置。边境居民第一次可以期待，保卫法国不再意味着独自承受一切。"
 sof_nr.105.a:0 "让全国站在守望者身后。"
 sof_nr.106.t:0 "从莱茵边境诞生的共同法国"
 sof_nr.106.d:0 "斯特拉斯堡宣布统一，各地代表随后审议共同国防与公民保障条款。边境工场重新获得全国订单，矿区家庭期待安定的生活。新政府承诺不再以语言和地方出身划分值得信任的公民；这份承诺既赢得欢呼，也带来艰难的行政责任。法国的边界仍在，居民之间的隔阂却必须开始退去。"
 sof_nr.106.a:0 "同一国家，不必同一种乡音。"
 sof_nr.107.t:0 "法国的海门重新敞开"
 sof_nr.107.d:0 "鲁昂港向内陆发出统一后的第一批共同货运单，诺曼底的钢铁与海外物资重新进入全国网络。新政府宣布将港口收入与转运责任纳入共同预算。码头上的欢呼传不到每一个内陆村庄，但接下来抵达的粮食、机器与就业机会，将替这场来自河口的胜利作出解释。"
 sof_nr.107.a:0 "海门向每一个法国人敞开。"
 sof_nr.108.t:0 "罗讷方案成为法国的政府"
 sof_nr.108.d:0 "里昂宣布统一时，车队已经开始从军用运输转向各地重建。市政厅公布了全国公共工程听证安排，圣艾蒂安的工场接到新的生产转换清单。由工业能力支撑的国家终于形成，但它的领导者同时承诺，让最普通的居民也有一扇可以敲响的门。和平将检验这个承诺。"
 sof_nr.108.a:0 "一个能够行动，也能够回答的国家。"
 sof_nr.109.t:0 "法国重返世界的账簿"
 sof_nr.109.d:0 "波尔多港的报关处开始使用共同国家的印章，海外商船收到统一后的航运与关税通告。法国的重建政府向各国提出恢复正常关系，也向本国居民公布战争债务。港口庆祝来之不易的和平，酒农和工人则等待信用再次变成收入。这一次，吉伦特的担保对象是整个法国。"
 sof_nr.109.a:0 "让我们的签名经得起明天。"
 sof_nr.110.t:0 "图卢兹的法国准备再次起飞"
 sof_nr.110.d:0 "图卢兹公布全国统一的消息后，试飞场短暂停止工作，工程师与工人共同参加纪念仪式。新政府宣布技术教育和民用联系将成为重建重点，同时公布战时专员的退场程序。统一者曾用可交付的能力赢得信任，如今必须证明，和平也能像一次严肃的试飞那样经得住检验。"
 sof_nr.110.a:0 "让未来经得住现实的检验。"
 sof_nr.111.t:0 "卢瓦尔的重建成为法国的事业"
 sof_nr.111.d:0 "南特的堤岸上升起共同国家的旗帜，圣纳泽尔开始调整战后船台计划。由救援与修复凝聚的统一事业终于完成，新政府宣布共同承担洪灾防护与运输恢复。堤岸维修与家庭救助将继续得到公共投入；但这一次，整个法国都被写进了责任名单。"
 sof_nr.111.a:0 "没有人被留在堤岸之外。"
 sof_nr.112.t:0 "来自法国腹地的重生"
 sof_nr.112.d:0 "克莱蒙费朗宣布统一后，全国第一份建设计划标出了维修学校、道路与备用仓库。山地工场曾支撑漫长的战役，如今将帮助各地恢复民用生活。新政府承认法国仍需要海运与世界市场，但誓言不再让任何一个环节的中断夺走全国的未来。车轮终于开始为和平转动。"
 sof_nr.112.a:0 "让法国走得更远，也站得更稳。"
 sof_nr.113.t:0 "法国的南北重新接通"
 sof_nr.113.d:0 "第戎车站公布了统一后的共同运输安排，曾分属不同政权的机务人员开始交接车辆。新政府由铁路与重工业的协作中赢得战争，现在承诺把同样的组织力用于民用重建。各地代表期待自己的城镇列入共同运输时刻表，让恢复通车真正惠及全国。"
 sof_nr.113.a:0 "每一站都属于法国。"
 sof_nr.114.t:0 "法国重新开始走时"
 sof_nr.114.d:0 "贝桑松的钟楼报时声中，统一政府公布了全国重建与权力审查安排。索肖的车队驶向各地，汝拉工坊收到民用维修订单。新国家以精密工艺解释自己的使命：各地彼此连接，每个地方都是国家运转的重要组成。胜利之后，最困难的工作将是让这个承诺一直有效。"
 sof_nr.114.a:0 "让每一个环节都有位置。"
 sof_nr.115.t:0 "卢瓦尔腹地完成国家重建"
 sof_nr.115.d:0 "图尔的车站迎来参加全国制度会议的代表，战时专员同时收到权限终止通知。这个从交通与行政腹地成长起来的政府宣布法国统一，并承诺保存共同服务而结束无限紧急状态。没有一座城市能够独占国家的全部能力，也没有一道临时命令应当比和平活得更久。"
 sof_nr.115.a:0 "留下国家，让紧急状态结束。"
 sof_nr.116.t:0 "从受创田野诞生的新法国"
 sof_nr.116.d:0 "亚眠的统一宣言没有以阅兵结束，而以全国重建名册开始。铁路工人、农民和航空技师的代表共同见证了战时授权退场。政府承诺不再让曾遭破坏的地方独自负担修复费用；当第一批民用列车驶向旧战区时，这个从伤口中成长的国家开始接受和平的考验。"
 sof_nr.116.a:0 "我们的孩子应当继承家园。"
 sof_nr.117.t:0 "香槟的平原迎来和平"
 sof_nr.117.d:0 "沙隆的营地宣读复员命令，埃佩尔奈的酒农开始核对恢复生产所需的贷款。由香槟发起的统一战争已经结束，新政府把军队置于共同制度之下，并公布征地与驻军补偿安排。全国注视着这片熟悉战争的土地，等待它证明：保卫法国的人同样能够带领法国走出战争。"
 sof_nr.117.a:0 "愿下一次号角只为庆典而响。"
 sof_nr.118.t:0 "朗格多克向全国举杯"
 sof_nr.118.d:0 "蒙彼利埃的统一宣言传到合作酒窖与矿区，庆祝的人群中既有工人，也有仍背负债务的种植户。新政府把农村公共服务和生产转型列入全国预算，承诺不让重建只发生在大城市。酒杯举起之后，最艰难的选择仍在等待：如何在有限财政中，为不同生产者安排共同的明天。"
 sof_nr.118.a:0 "让劳动的人有能力选择未来。"
 sof_nr.119.t:0 "法国的面包有了共同国家"
 sof_nr.119.d:0 "普瓦捷宣布全国统一，粮运机构随即发布战后采购与补偿安排。沙泰勒罗的工人与乡村代表共同出席仪式，拉罗谢尔的商船则开始接收恢复贸易的通告。新政府以供养全国赢得支持，也将因能否公平分担粮价、税负与土地恢复费用而受到全国判断。"
 sof_nr.119.a:0 "让每一份收成都通向生活。"
 sof_nr_legacy_PRS:0 "公民共和国"
 sof_nr_legacy_PRS_desc:0 "统一法院和公共教育成为法国制度的一部分，同时永久承担中央行政支出。"
 sof_nr_legacy_AJC:0 "海岸平等宪章"
 sof_nr_legacy_AJC_desc:0 "海岛补给与沿海护航成为法国制度的一部分，同时永久承担全国海运补贴。"
 sof_nr_legacy_REN:0 "多种乡音的法国"
 sof_nr_legacy_REN_desc:0 "地方语言与文官制度成为法国制度的一部分，同时永久承担持续的省际协商。"
 sof_nr_legacy_MRS:0 "劳动公民契约"
 sof_nr_legacy_MRS_desc:0 "劳动保障与国家生产成为法国制度的一部分，同时永久承担社会工资与劳动监督。"
 sof_nr_legacy_LIL:0 "生产者的全国契约"
 sof_nr_legacy_LIL_desc:0 "煤钢生产与工会监督成为法国制度的一部分，同时永久承担煤区福利支出。"
 sof_nr_legacy_MET:0 "共同国防的洛林契约"
 sof_nr_legacy_MET_desc:0 "兵工标准与国防韧性成为法国制度的一部分，同时永久承担矿工和军属保障。"
 sof_nr_legacy_STR:0 "边境公民宪章"
 sof_nr_legacy_STR_desc:0 "双语行政和边境权利成为法国制度的一部分，同时永久承担协商行政成本。"
 sof_nr_legacy_ROU:0 "河海共和国"
 sof_nr_legacy_ROU_desc:0 "港口与河流补给成为法国制度的一部分，同时永久承担公共航运维护。"
 sof_nr_legacy_LYO:0 "生产与技艺共和国"
 sof_nr_legacy_LYO_desc:0 "技术学校和精密工业成为法国制度的一部分，同时永久承担全国教育投入。"
 sof_nr_legacy_BRD:0 "共和国的共同门户"
 sof_nr_legacy_BRD_desc:0 "港口公共贸易成为法国制度的一部分，同时永久承担贸易港保险责任。"
 sof_nr_legacy_TOU:0 "天空属于共同国家"
 sof_nr_legacy_TOU_desc:0 "航空试验与公共研发成为法国制度的一部分，同时永久承担国家航空教育。"
 sof_nr_legacy_NAN:0 "共同海岸与造船共和国"
 sof_nr_legacy_NAN_desc:0 "公共造船与海岸工程成为法国制度的一部分，同时永久承担港工和防灾责任。"
 sof_nr_legacy_CFR:0 "从高原到全国的公共道路"
 sof_nr_legacy_CFR_desc:0 "山区公路和民生网络成为法国制度的一部分，同时永久承担偏远地区维护费用。"
 sof_nr_legacy_DIJ:0 "全国干线公共章程"
 sof_nr_legacy_DIJ_desc:0 "铁路与计量标准成为法国制度的一部分，同时永久承担公共干线维护。"
 sof_nr_legacy_BES:0 "精密技艺的国家承诺"
 sof_nr_legacy_BES_desc:0 "技术工人和精密制造成为法国制度的一部分，同时永久承担技师培养与轮休。"
 sof_nr_legacy_TRS:0 "共同国家的公共章程"
 sof_nr_legacy_TRS_desc:0 "公共服务与卢瓦尔干线成为法国制度的一部分，同时永久承担代表协商与民政成本。"
 sof_nr_legacy_AMI:0 "把破碎土地还给生活"
 sof_nr_legacy_AMI_desc:0 "战区修复与农村恢复成为法国制度的一部分，同时永久承担伤残与乡村补助。"
 sof_nr_legacy_CHL:0 "公民与军队的共同国家"
 sof_nr_legacy_CHL_desc:0 "国防训练与文官监督成为法国制度的一部分，同时永久承担退伍军人公共保障。"
 sof_nr_legacy_MOP:0 "土地与海岸的公共共和国"
 sof_nr_legacy_MOP_desc:0 "农村合作与沿海供应成为法国制度的一部分，同时永久承担小农保障支出。"
 sof_nr_legacy_POI:0 "共和国必须抵达乡村"
 sof_nr_legacy_POI_desc:0 "乡村公共服务与后备组织成为法国制度的一部分，同时永久承担农村道路与邮政补助。"
 sof_nr_national_mission:0 "全国使命"
 sof_nr_national_mission_desc:0 "以地方已经赢得的信任争取全国领导权。组织宣传、代表联络和公共承诺需要财政支持。"
 sof_nr_convention:0 "全国代表大会"
 sof_nr_convention_desc:0 "跨地区制宪机构需要时间与预算，使统一从军事事实走向公共授权。"
 sof_nr_war_mobilization:0 "共和国战时总动员"
 sof_nr_war_mobilization_desc:0 "提高兵员和军工生产，同时增加消费负担与社会紧张。成立法国后自动撤销。"
 sof_nr_unitary_state:0 "统一法律与中央行政"
 sof_nr_unitary_state_desc:0 "中央主权提高生产协调，但地方抵抗与行政支出也会增加。"
 sof_nr_federal_state:0 "共同主权与省际宪章"
 sof_nr_federal_state_desc:0 "统一法国的联邦宪法保障地方权利，降低抵抗；共同指挥与协商需要代价。"
 sof_nr_rebuilding:0 "全国重建的代价"
 sof_nr_rebuilding_desc:0 "180天内把资源转向交通、住房和公共服务，压低军事生产并增加民用支出。"
 sof_nr_rebuilt:0 "重建后的法国"
 sof_nr_rebuilt_desc:0 "全国重建完成。生产、建设和补给终于由同一套公共系统支撑。"
 sof_nr_mobilization:0 "全国战时总动员"
 sof_nr_mobilization_desc:0 "消耗100政治点，提升军工生产与兵员；稳定度和消费品负担恶化。仅战争期间启动，成立法国时自动结束。"
 sof_nr_negotiate_union:0 "向[From.GetName]提出国家合并契约"
 sof_nr_negotiate_union_desc:0 "50块完整拥有且控制的法国领土、全国代表大会与相对军事实力优势，才足以提出合并契约。目标须控制少于50州，可以接受或拒绝；接受将移交其领土与部队。拒绝不妨碍通常的合法战争路线。"
 sof_nr_overseas_campaign:0 "筹备对[From.GetName]的跨海统一战役"
 sof_nr_overseas_campaign_desc:0 "至少4艘军舰、20运输船和可用港口。75政治点，90天筹备后获得730天战争目标。布列塔尼须保持议会战争授权；赤色马赛须完成本区海军建设。期间条件失效则取消。"
 sof_nr_end_local_war:0 "接受[From.GetName]的全面缴械"
 sof_nr_end_local_war_desc:0 "只有当对方全部领土均为法国领土且已被我方完整控制，才能将已实现的军事胜利转化为国家整合。该安排适用于已满足胜利条件的国内战争，其他战争继续按现有局势处理。"
 sof_nr_ratify_existing_france:0 "追认共同国家宪法"
 sof_nr_ratify_existing_france_desc:0 "通过旧有成立法国决议建国后，可以在此补完全国宪法与国家宣告。"
 sof_nr_reconstruction:0 "让法国重新运转"
 sof_nr_reconstruction_desc:0 "成立法国并完成地区国家承诺后，投入150政治点与180天资源转移。期间必须保持全国完整控制与和平；若失败，工程取消，可重新筹措。完成后永久改善建设、工业与供应。"
 sof_nr.1.t:0 "一个共同国家的邀请"
 sof_nr.1.d:0 "[From.GetName]的全国代表大会向我们送来合并契约：共同国防、统一外交和国家法律将结束割据，地方的未来则必须在共同宪法中安排。签署意味着移交全部领土和部队。我们可以接受，也可以承担继续独立的责任。"
 sof_nr.1.a:0 "签署契约，参加共同国家。"
 sof_nr.1.b:0 "我们拒绝这份合并契约。"
 sof_nr.2.t:0 "新的省份加入共同事业"
 sof_nr.2.d:0 "合并契约已经签署。军队、档案与公共设施转入共同国家。接纳新公民将暂时增加行政压力；政府须持续建立信任、完善共同服务。"
 sof_nr.2.a:0 "现在开始履行承诺。"
 sof_nr.3.t:0 "合并契约遭到拒绝"
 sof_nr.3.d:0 "对方决定继续独立。这次谈判没有产生吞并、臣属或额外义务。代表团将撤回，既有的战争授权和军事路线仍然有效。"
 sof_nr.3.a:0 "法国的未来仍未决定。"
 sof_nr.10.t:0 "法国重新站立"
 sof_nr.10.d:0 "曾经由关卡、地方军和相互猜忌切开的土地，今天重新归于一个国家。全国代表大会通过的宪制开始生效，巴黎重新成为共同首都。战争可以决定谁占领城市，但只有接下来的岁月，才能证明这个国家是否值得其人民信任。"
 sof_nr.10.a:0 "一个国家，一段尚待书写的未来。"
 sof_nr.11.t:0 "重建的第一代法国"
 sof_nr.11.d:0 "干线重新运转，工厂恢复协作，地方账簿终于能在同一套公共制度下核对。重建没有抹去内战留下的伤痕，却使共同生活再次成为可信的日常。法国的重生不再只是宣言。"
 sof_nr.11.a:0 "把国家交给生活在其中的人。"
 sof_nr_shortcut:0 "法国重生"
 sof_nr_national_project:0 "从地方使命到法国重生"
 sof_nr_national_project_desc:0 "全国计划持续存在，不随执政党改变。完整拥有并控制的法国领土：[?sof_nr_states|0] / 339。\n50块：全国代表大会与谈判整合。100块：制宪。339块且和平：成立法国。"
