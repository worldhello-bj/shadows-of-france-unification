 SOF_NR_ROU_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_ROU_proclamation_desc:0 "诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_ROU_settlement:0 "开启法国的国家重建"
 SOF_NR_ROU_settlement_desc:0 "诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_NR_LYO_mandate:0 "罗讷－阿尔卑斯的全国统一使命"
 SOF_NR_LYO_mandate_desc:0 "里昂与罗讷—阿尔卑斯的工业、能源和科研能力，足以支持一个面向全国的现代化国家方案。机械化军队与战略工业应当共同结束割据。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
