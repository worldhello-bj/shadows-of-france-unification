l_simp_chinese:
 SOF_NR_PRS_mandate:0 "向各省归还国家"
 SOF_NR_PRS_mandate_desc:0 "巴黎保存着部会的印章，却失去了让全国相信这些印章的理由。索邦的教师、塞纳河岸的工人和市政职员将共同向各省发出召集书：首都愿承担重建责任，也愿接受全国审问。粮食、税款与兵役将换来公共服务与共同保障；我们要求领导法国，首先必须证明自己能够服务法国。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_PRS_integration:0 "让全国代表进入巴黎"
 SOF_NR_PRS_integration_desc:0 "通向巴黎的列车曾载来贡税与征召名单，现在还必须载来能够反对政府的人。每收复一片地区，行政预备队就恢复供粮、登记损失并安排代表。以军事胜利结束武装割据，以地方代表制度保障居民的发言权。全国会议将把胜利的地图转化为国家的授权。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_PRS_unitary:0 "一个主权，一部共同法律"
 SOF_NR_PRS_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_PRS_federal:0 "共同主权，各省宪章"
 SOF_NR_PRS_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_PRS_proclamation:0 "法国重新站立"
 SOF_NR_PRS_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_PRS_settlement:0 "首都服从共同宪章"
 SOF_NR_PRS_settlement_desc:0 "最后一道省际关卡撤除时，巴黎也必须撤除自己的特权。全国宪章将规定共同预算、地方代表和紧急权力的终止程序，工程学校与国家实验室向各省开放。首都仍将发出命令，但命令必须有全国认可的依据。我们将以全国共同认可的制度重建国家，让胜利者同样承担法律与公共责任。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_AJC_mandate:0 "岛屿不再等待大陆"
 SOF_NR_AJC_mandate_desc:0 "阿雅克肖将主动开辟航路，让岛屿掌握自己的未来。巴斯蒂亚的船员、山村的退伍军人与岛内议事代表将共同承担远征的责任。我们没有足以吞下法国的人口，却拥有必须重新连接法国的理由：只要大陆继续分裂，每一条岛民赖以生存的航路都可能被他人的战争切断。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_AJC_integration:0 "把海峡变成归途"
 SOF_NR_AJC_integration_desc:0 "护航队离港时，运输船装载的不只有士兵，还有维修人员、粮袋与共同政府的提议。大陆港口可以通过协商加入，也可能在战斗后重新开放；无论哪条道路，登陆都只是开始。岛屿必须承担持续补给与当地恢复的费用，直到海峡两岸不再互相视为远方，远征军才真正抵达故乡。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_AJC_unitary:0 "一个主权，一部共同法律"
 SOF_NR_AJC_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_AJC_federal:0 "共同主权，各省宪章"
 SOF_NR_AJC_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_AJC_proclamation:0 "法国重新站立"
 SOF_NR_AJC_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_AJC_settlement:0 "让每一处海岸融入法国"
 SOF_NR_AJC_settlement_desc:0 "统一后的阿雅克肖将承担全国责任，让岛屿与大陆共同分享复兴。我们将把定期海运、山区道路和地方教育写进全国重建承诺，让最远的村庄也获得共同国家的服务。科西嘉可以争取宪章内的自治保障，却仍承担共同国防与财政责任；征服海岸的事业，必须以照顾海岸的人结束。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_REN_mandate:0 "布列塔尼向全国发言"
 SOF_NR_REN_mandate_desc:0 "雷恩议事厅里的争论已经越过半岛。农民要求市场，港口要求航路，讲不同乡音的人要求不必放弃家乡才能成为国家公民。我们将把地方议会承担预算和战争责任的经验带向全国。布列塔尼将走向全国，使法国重新成为各地愿意共同承担责任的国家。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_REN_integration:0 "从西部打开法国"
 SOF_NR_REN_integration_desc:0 "布雷斯特的海员与雷恩的后备队准备离开熟悉的海岸，乡村代表则要求每一场战役都说明目的。军队服从公共授权，谈判确立共同防务，让统一拥有稳定的制度基础。我们将先打开通向内陆的道路，再让加入者进入共同议事程序，使西部的团结变成全国的力量。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_REN_unitary:0 "一个主权，一部共同法律"
 SOF_NR_REN_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_REN_federal:0 "共同主权，各省宪章"
 SOF_NR_REN_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_REN_proclamation:0 "法国重新站立"
 SOF_NR_REN_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_REN_settlement:0 "同一国家，多种乡音"
 SOF_NR_REN_settlement_desc:0 "新的法国将在同一面旗帜下发出不同的乡音。雷恩提出地方文化教育保障，同时把对外事务、共同军队与国家财政交给统一制度。自治派将在宪章中争取明确权限，并承担全国共同义务。我们必须放弃独占胜利的诱惑，才能让半岛的经验经受整个法国的考验。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_MRS_mandate:0 "港口向内陆进军"
 SOF_NR_MRS_mandate_desc:0 "让马赛的粮食与机器越过地方边界，驶向全国。码头工人、海员与普罗旺斯乡村代表提出共同的要求：让法国重新拥有一条从海上抵达内陆的生命线。我们将以港口组织能力争取全国领导权，但船东的利润、工人的工资与城市的军需都必须接受同一份公开的国家计划。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_MRS_integration:0 "让罗讷河抵达全国"
 SOF_NR_MRS_integration_desc:0 "沿罗讷河向北推进的军队将以恢复人民生活为职责。每一处车站必须留下维修队，每一座加入的城市都必须恢复粮运，里昂的车间与北方的矿工也要有自己的代表。我们将争取沿途政权共同重建；若战斗无法避免，胜利必须打开运输线，并让各地共享畅通的粮运与市场。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_MRS_unitary:0 "一个主权，一部共同法律"
 SOF_NR_MRS_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_MRS_federal:0 "共同主权，各省宪章"
 SOF_NR_MRS_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_MRS_proclamation:0 "法国重新站立"
 SOF_NR_MRS_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_MRS_settlement:0 "从码头代表到国家公民"
 SOF_NR_MRS_settlement_desc:0 "马赛赢得统一后，将邀请全国代表共同决定国家方向。全国代表将重新分配港税、工业订单与重建费用，内陆小农与港口工人承担同样明确的公民责任。宪章保障劳动组织的权利，并确立各方共同参与的国家制度。我们要把一次来自南方的动员变成容纳全国的共同制度。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_LIL_mandate:0 "北方熔炉的全国号召"
 SOF_NR_LIL_mandate_desc:0 "里尔将工业力量用于全国供给，让饥寒中的城市重新开工。鲁贝与图尔宽的纺织工人、矿区的家庭和铁路职员需要稳定市场，也需要能够兑现工资与安全承诺的国家。北方将以恢复生产的力量争取全国领导权，把煤炭、布匹与机械送出地方边界，同时要求新的法国承认支撑它的人。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_LIL_integration:0 "煤车越过最后一道关卡"
 SOF_NR_LIL_integration_desc:0 "一列运煤车因关卡停住，南方的锅炉便可能熄火；一列粮车延误，矿区的家庭就必须少吃一餐。我们的统一军与铁路人员将共同打开南北走廊，邀请沿线工场加入共同供应。打通昔日敌对城市的运输与贸易，让军事胜利转化为共同复兴。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_LIL_unitary:0 "一个主权，一部共同法律"
 SOF_NR_LIL_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_LIL_federal:0 "共同主权，各省宪章"
 SOF_NR_LIL_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_LIL_proclamation:0 "法国重新站立"
 SOF_NR_LIL_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_LIL_settlement:0 "生产者的全国契约"
 SOF_NR_LIL_settlement_desc:0 "停战的钟声将与复工的汽笛一同响起。统一政府将把工资谈判、工业安全与失业救济列入全国重建安排，并要求企业和工会承担恢复民用生产的责任。里尔必须接受订单向落后地区转移，也必须允许各地选择自己的代表。一个靠工人赢得的法国，应当让工人的孩子拥有战争之外的前途。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_MET_mandate:0 "让全国共同守护边境"
 SOF_NR_MET_mandate_desc:0 "梅斯的守军与奥恩河谷的工人需要可靠的粮食、资金与人员补充，让堡垒和高炉共同支撑国家。边境长期承担全国安全的重量，如今有权要求全国重新站在一起。我们将以钢铁与防务组织争取领导权，把边地的焦虑变成共同的政治要求：法国必须恢复，防守它的人也必须得到法国的支持。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_MET_integration:0 "把后方重新接到边境"
 SOF_NR_MET_integration_desc:0 "统一军将协调边防与机动作战，为全国整合提供安全保障。梅斯将把军需与谈判沿铁路向腹地延伸，争取共同动员，必要时击败阻断补给的割据力量。阿贡当日与热夫的炉火需要全国原料，前线需要全国粮食；重新形成的后方，才是边境最坚固的一道防线。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_MET_unitary:0 "一个主权，一部共同法律"
 SOF_NR_MET_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_MET_federal:0 "共同主权，各省宪章"
 SOF_NR_MET_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_MET_proclamation:0 "法国重新站立"
 SOF_NR_MET_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_MET_settlement:0 "以钢铁护住共同生活"
 SOF_NR_MET_settlement_desc:0 "法国统一之后，边境防务将纳入全国共同治理。政府将把国防负担按共同规则分担，同时让钢铁转向铁路、住房与民用机械。矿工安全、驻军家庭和边境城镇都应获得明确保障。梅斯必须接受军费审查，才能使全国相信，重建的堡垒将守护生活，并使动员服从共同规则。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_STR_mandate:0 "边境向法国提出答案"
 SOF_NR_STR_mandate_desc:0 "斯特拉斯堡的街道听得见不同语言，也承受着边境不断要求居民证明忠诚的压力。工人、市镇代表和乡村家庭将共同发出号召：法国的重建必须结束这种永远可疑的处境。我们争取全国领导权，以共同国家保卫疆界，同时尊重疆界之内的每一个人。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_STR_integration:0 "让莱茵的守望拥有后方"
 SOF_NR_STR_integration_desc:0 "米卢斯的工场与钾盐矿区需要原料、粮食和安全的交通，边境守军需要能够共同承担责任的腹地。统一事业将向西打开联系，邀请各地加入共同国防，必要时击败阻断通路的武装。整合将尊重居民使用的语言；我们必须争取他们的参与，否则新边界只会被搬进每一条街道。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_STR_unitary:0 "一个主权，一部共同法律"
 SOF_NR_STR_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_STR_federal:0 "共同主权，各省宪章"
 SOF_NR_STR_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_STR_proclamation:0 "法国重新站立"
 SOF_NR_STR_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_STR_settlement:0 "疆界可以坚固，公民不必分裂"
 SOF_NR_STR_settlement_desc:0 "新法国将维护共同国防与统一对外代表，同时把语言文化保障、地方制度审查与平等公民责任写入重建安排。斯特拉斯堡将以制度协商连接各地，建立包容多种语言与地方传统的国家。国家将扩充翻译、教师和申诉机构，并为这些公共服务安排经费；这是让边境真正成为家园必须支付的代价。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_ROU_mandate:0 "让塞纳河口服务全国"
 SOF_NR_ROU_mandate_desc:0 "鲁昂的驳船驶向内陆时，装载的从来不只是诺曼底的希望。港口工人、领港员和卡昂一带的冶金工人要求结束分裂，让全国重新拥有可靠的海上入口。我们将以畅通全国供给赢得领导权，让从港口进入的每批物资抵达需要它的内陆城市。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_ROU_integration:0 "沿塞纳河追回法国"
 SOF_NR_ROU_integration_desc:0 "从鲁昂向内陆展开的统一行动，将把港务、铁路与仓储接成一条连续通路。巴黎可以成为伙伴，也可能仍由对立政府掌握；共同供给将成为首都领导全国的基础。我们准备以协商打开城市，也准备承担必要战斗，但每一座桥梁修复之后，都必须让民用货物与军队一道通过。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_ROU_unitary:0 "一个主权，一部共同法律"
 SOF_NR_ROU_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_ROU_federal:0 "共同主权，各省宪章"
 SOF_NR_ROU_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_ROU_proclamation:0 "法国重新站立"
 SOF_NR_ROU_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_ROU_settlement:0 "向全国打开海门"
 SOF_NR_ROU_settlement_desc:0 "统一后的海关收入将由全国共同安排，服务各地重建。鲁昂提出公开港费、保障内陆转运和建设共同储备，让远离海岸的城市也能分享海洋带来的机会。卡昂地区的钢铁将帮助恢复铁路与设备，码头工人则得到安全与就业安排。以公开规则守护国家的门户，让港口繁荣与内陆发展相互支持。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_LYO_mandate:0 "罗讷河畔的全国方案"
 SOF_NR_LYO_mandate_desc:0 "里昂有能力制造卡车，圣艾蒂安有能力制造武器，但这些力量若只保护各自的街道，法国便仍是一堆互不相通的工场。市政代表、技术人员和工人将共同提出全国方案：由能够组织生产与公共生活的人承担重建责任。我们争取领导权，也接受各地追问，这种组织力量究竟为谁服务。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_LYO_integration:0 "让车队驶向共同的法国"
 SOF_NR_LYO_integration_desc:0 "贝利埃车队将把罗讷河谷的工业力量送向更远的地方，兵工与维修人员随同进入新接入的地区。统一事业既需要战线，也需要市镇间能够兑现的供给安排。我们欢迎共同加入，也将打通武装封锁的道路，以后方生产和运输能力支撑全国计划。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_LYO_unitary:0 "一个主权，一部共同法律"
 SOF_NR_LYO_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_LYO_federal:0 "共同主权，各省宪章"
 SOF_NR_LYO_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_LYO_proclamation:0 "法国重新站立"
 SOF_NR_LYO_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_LYO_settlement:0 "让国家拥有市政厅的门"
 SOF_NR_LYO_settlement_desc:0 "全国政府将建立地方申诉渠道，让居民能够就近寻求公正。里昂提出将公共工程听证、采购审查和地方代表制度带入国家建设，让公民能够追问道路、学校与工场的去向。统一的执行机关仍有必要，但它必须向居民说明选择。我们愿意承担效率的损失，以免胜利把国家变成无法接近的机器。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_BRD_mandate:0 "吉伦特为法国作保"
 SOF_NR_BRD_mandate_desc:0 "波尔多的酒商可以签下一张远洋汇票，却无法保证货物穿过法国自己的关卡。酒农、码头工人与市镇代表已经厌倦为分裂支付代价。吉伦特将以港口信用争取全国领导权，承诺让账簿背后重新站起一个国家。国家将保护民生与贸易，以稳定的出口支持长期建设。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_BRD_integration:0 "让加龙河通向共同市场"
 SOF_NR_BRD_integration_desc:0 "从布莱到波尔多，河口的安全依靠连续的航路；从西南到全国，繁荣同样依靠连续的制度。我们的军队与谈判代表将向内陆打开市场，统一仓单、税则与运输责任。新加入的城镇不必接受酒商统治，却必须结束各自截留货运的习惯。波尔多也要为这条全国通路承担真实的防卫费用。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_BRD_unitary:0 "一个主权，一部共同法律"
 SOF_NR_BRD_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
