l_simp_chinese:
 SOF_NR_PRS_mandate:0 "法兰西岛的全国统一使命"
 SOF_NR_PRS_mandate_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_PRS_integration:0 "召开法兰西全国会议"
 SOF_NR_PRS_integration_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
 SOF_NR_PRS_unitary:0 "统一共和国的中央宪制"
 SOF_NR_PRS_unitary_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n以共同的中央机构统筹国防、财政与国家重建。与联邦宪制互斥。"
 SOF_NR_PRS_federal:0 "共同国家的联邦宪制"
 SOF_NR_PRS_federal_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_PRS_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_PRS_proclamation_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_PRS_settlement:0 "开启法国的国家重建"
 SOF_NR_PRS_settlement_desc:0 "巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_NR_AJC_mandate:0 "科西嘉的全国统一使命"
 SOF_NR_AJC_mandate_desc:0 "科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
 SOF_NR_AJC_integration:0 "召开法兰西全国会议"
 SOF_NR_AJC_integration_desc:0 "科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。\n\n在既有领土规模或共同防务集团基础上召开全国会议，争取全国政治领导权。"
