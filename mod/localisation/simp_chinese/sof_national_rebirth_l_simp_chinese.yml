 SOF_NR_REN_mandate:0 "布列塔尼的全国统一使命"
 SOF_NR_REN_mandate_desc:0 "布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
