 SOF_NR_NAN_proclamation:0 "法国重新站立"
 SOF_NR_NAN_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_NAN_settlement:0 "让国家成为共同的堤岸"
 SOF_NR_NAN_settlement_desc:0 "法国统一之后，南特提出将防洪、港口修复与民用运输列为全国共同责任。军舰订单必须为商船和受损城市让出空间，河口获得的贸易收入也应帮助内陆重建。国家将建立防灾与救济网络，使每个受灾家庭得到共同体的支持。我们的船台将为这种承诺付出产能，我们的预算将为它付出金钱。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_CFR_mandate:0 "山地深处，国家仍在前进"
 SOF_NR_CFR_mandate_desc:0 "克莱蒙费朗的工人熟悉轮胎的磨损，山村的运输者熟悉道路的代价。他们将以持续补给支撑军队，并让更多城镇参与国家建设。我们将以分散生产和持续补给争取法国的领导权，让内陆成为全国的支撑。外来橡胶与沿海道路仍不可缺少，我们将以开放的供应网络巩固内陆韧性。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_CFR_integration:0 "车轮把分裂的法国接起来"
 SOF_NR_CFR_integration_desc:0 "卡车将从山地驶向平原，带去维修器材、共同采购和统一政府的邀请。蒂耶尔工坊与克莱蒙费朗工厂将向新加入的地区提供设备、工艺与就业。必要的战役要围绕能够维持的道路展开；每延伸一段战线，就必须接上一段补给，让全国事业经得住距离与时间。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_CFR_unitary:0 "一个主权，一部共同法律"
 SOF_NR_CFR_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_CFR_federal:0 "共同主权，各省宪章"
 SOF_NR_CFR_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_CFR_proclamation:0 "法国重新站立"
 SOF_NR_CFR_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_CFR_settlement:0 "坚韧而有纵深的法国"
 SOF_NR_CFR_settlement_desc:0 "统一后的法国将把维修学校、备用仓储与民用工场分布到内陆，避免把所有希望堆在少数易受威胁的节点。克莱蒙费朗愿意把自己的工业经验交给各地，却也必须接受劳工监督和橡胶进口的财政约束。重建的目标不只是产量更大，而是灾难来临时，国家仍能保障普通人的生活。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_DIJ_mandate:0 "南北之间必须有一个国家"
 SOF_NR_DIJ_mandate_desc:0 "第戎的调度员每天看见法国如何被分裂：同一辆货车在不同边界重复等待，同一批钢材在相互冲突的命令中耗尽时间。佩里尼的铁路人员与勒克勒佐的冶金工人将共同争取全国领导权。我们的使命是让北方与南方再次依靠彼此，以共同运输和生产组织推动法国复兴。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_DIJ_integration:0 "沿钢轨展开全国战线"
 SOF_NR_DIJ_integration_desc:0 "通路必须既能输送军队，也能让粮食与民用材料抵达终点。统一军将围绕铁路枢纽与修理能力推进，谈判代表则要求沿线政权结束重复征税与相互扣车。勒克勒佐将以重工业支持全国防务，由公共机构决定战争与和平。每一段新接入的钢轨，都要对应居民能够看到的秩序与供应。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_DIJ_unitary:0 "一个主权，一部共同法律"
 SOF_NR_DIJ_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_DIJ_federal:0 "共同主权，各省宪章"
 SOF_NR_DIJ_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_DIJ_proclamation:0 "法国重新站立"
 SOF_NR_DIJ_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_DIJ_settlement:0 "一张时刻表，一份共同责任"
 SOF_NR_DIJ_settlement_desc:0 "和平时期的全国时刻表将同时列出粮车、通勤列车与重建材料。第戎提出统一运输规则与跨区投资审查，让偏远地区不再永远排在军需之后。铁路人员和地方代表共同监督调度，重工业企业接受公开采购。我们必须牺牲部分枢纽优先权，才能让全国真正共享这张重新接通的网络。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_BES_mandate:0 "让每枚齿轮共同报时"
 SOF_NR_BES_mandate_desc:0 "贝桑松的制表工匠知道，再精巧的一枚齿轮也无法独自报时。索肖的车辆工人同样明白，装配线需要来自远方的材料和订单。我们将把这种相互依赖讲给全国听：地方自守只能让法国逐渐停摆。汝拉边境的小城愿意争取领导权，因为共同国家必须尊重每一个看似微小的环节。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_BES_integration:0 "把各地接入同一部机器"
 SOF_NR_BES_integration_desc:0 "统一军的维修车间将伴随谈判代表前进，向各地展示共同标准带来的力量。地方保留工艺与日常行政能力，全国统一军需规格、交通调度和国防责任。我们将拆除阻断全国协作的制度，同时防止大工厂以统一之名吞掉小作坊的生路。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_BES_unitary:0 "一个主权，一部共同法律"
 SOF_NR_BES_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_BES_federal:0 "共同主权，各省宪章"
 SOF_NR_BES_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_BES_proclamation:0 "法国重新站立"
 SOF_NR_BES_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_BES_settlement:0 "为国家装上责任的擒纵器"
 SOF_NR_BES_settlement_desc:0 "一部没有节制装置的机器只会越转越快，直到把自己毁掉。贝桑松提出定期审查紧急权力、保障地方司法申诉与工艺教育，使全国政府既能执行，也能停止错误命令。索肖的规模生产与汝拉的精密工坊将共同承担重建订单；效率必须付出监督的时间，国家才能长久运转。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_TRS_mandate:0 "法国必须有第二次组织自己的机会"
 SOF_NR_TRS_mandate_desc:0 "图尔保存的档案与交汇的铁路提醒我们，国家不仅存在于首都，也存在于每一次按时发薪、每一列抵达的粮车之中。市镇职员、铁路人员与布尔日工人将共同争取全国领导权。我们将从腹地重新组织法国，让失去旧中心的人看到，公共秩序可以恢复，国家也可以重新获得人民的授权。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_TRS_integration:0 "把临时后方变成共同中心"
 SOF_NR_TRS_integration_desc:0 "图尔的调度机关将连接奥尔良、布尔日与逐步加入的地区，安排统一军的补给和地方行政的恢复。协商确立共同责任，后方建设支撑前线行动。每恢复一座车站，都要恢复一份可靠的税册与工资表。我们将把公共服务与行政能力分布到各地，使全国运转拥有可靠支撑。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_TRS_unitary:0 "一个主权，一部共同法律"
 SOF_NR_TRS_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_TRS_federal:0 "共同主权，各省宪章"
 SOF_NR_TRS_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_TRS_proclamation:0 "法国重新站立"
 SOF_NR_TRS_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_TRS_settlement:0 "归还临时权力，留下长久国家"
 SOF_NR_TRS_settlement_desc:0 "战争结束后，临时调度与行政专员必须交还特别权限。图尔提出跨区公共服务、档案保存与地方财政审查的共同制度，使国家在和平时期仍能协调行动。文化教育和民用运输将重新获得预算，布尔日的技术人员转向长期建设。放下战时便利会拖慢部分决定，却能让统一不再依赖下一次危机。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_AMI_mandate:0 "受创土地的全国誓言"
 SOF_NR_AMI_mandate_desc:0 "亚眠周围的田野记得战争留下的代价，重建者不愿再把自己的家园交给一道道新边界。佃农、铁路工人和阿尔贝一带的航空工场将共同发出号召：能够修复土地的人，也应当参与修复国家。我们争取全国领导权，愿以重建经验承担保护家园、修复国家的责任。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_AMI_integration:0 "铁路向前，家园随后"
 SOF_NR_AMI_integration_desc:0 "我们的列车将把士兵送往前线，也把测绘员、农具和建筑材料送入重新开放的城镇。航空工场提供侦察与运输所需的技术，农村代表则监督征用是否掏空下一季播种。协商能够打开的道路不必用炮火打开；无法避免的战斗结束后，统一军必须立即安排重建人员，恢复当地生产与生活。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_AMI_unitary:0 "一个主权，一部共同法律"
 SOF_NR_AMI_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
