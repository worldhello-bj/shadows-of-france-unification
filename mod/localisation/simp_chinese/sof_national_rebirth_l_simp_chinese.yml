 SOF_NR_BES_federal_desc:0 "弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。\n\n以共同国家权威和地区契约组织统一法国。与中央宪制互斥。"
 SOF_NR_BES_proclamation:0 "宣布法兰西重归统一"
 SOF_NR_BES_proclamation_desc:0 "弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。\n\n只有完成原有法国全境拥有与完整控制、国家宪制、独立与和平条件，才正式宣布国家统一。"
 SOF_NR_BES_settlement:0 "开启法国的国家重建"
 SOF_NR_BES_settlement_desc:0 "弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。\n\n把统一战争留下的军队、工业和地区制度纳入新法国的重建秩序。"
 SOF_NR_TRS_mandate:0 "中央大区的全国统一使命"
 SOF_NR_TRS_mandate_desc:0 "中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。\n\n把地区政治、工业与军队置于统一法国的国家使命之下。全国授权仍须满足既有战争或外交许可。"
