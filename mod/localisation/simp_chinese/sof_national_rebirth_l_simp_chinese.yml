 SOF_NR_AMI_federal_desc:0 "控制至少100块法国领土后，把地方自治纳入单一法国的共同宪法。国防、外交与关税属于全国；各省保有民政权。地方认同降低抵抗，但统一指挥需要更多协调。\n\n与「一个主权，一部共同法律」永久互斥。"
 SOF_NR_AMI_proclamation:0 "法国重新站立"
 SOF_NR_AMI_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_AMI_settlement:0 "让重建成为国家的第一事业"
 SOF_NR_AMI_settlement_desc:0 "新的全国预算将首先回答一个朴素的问题：受损的家园何时能够重新住人？亚眠提出土地修复、铁路恢复和退伍安置的共同次序，航空技术则从战争需要走向民用联系。胜利者必须承认重建无法一夜完成，限制军队的额外索取，把最熟练的双手交还田野与工场。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_CHL_mandate:0 "不再把香槟当作战场"
 SOF_NR_CHL_mandate_desc:0 "埃佩尔奈的酒窖与沙隆的营地属于同一片土地，却代表着两种截然不同的未来。葡萄种植者、营地工人和退伍军人要求建立一个保障收成、合理安排征购的国家。我们将争取全国领导权，把熟悉动员与纵深防御的经验用来结束分裂，让这片平原不再只是别人的必经战场。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_CHL_integration:0 "越过营地，走向全国"
 SOF_NR_CHL_integration_desc:0 "营地培养士兵，公共制度将他们凝聚成一个国家。我们的统一军将沿交通走廊推进，地方代表同时与新掌握的城镇安排粮运、补偿和驻军责任。加强色当渡口与道路的侦察和守备，将地形调查落实到作战计划。真正的战略纵深来自愿意共同防卫的居民，而不仅是地图上更多的后撤线。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_CHL_unitary:0 "一个主权，一部共同法律"
 SOF_NR_CHL_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
 SOF_NR_CHL_federal:0 "共同主权，各省宪章"
