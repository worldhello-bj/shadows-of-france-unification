 SOF_NR_CHL_proclamation:0 "法国重新站立"
 SOF_NR_CHL_proclamation_desc:0 "完整拥有并控制全部339块法国领土，结束战争后，依照已通过的宪法重建法国。首都返回巴黎；全国使命贯穿历届政府。\n\n需要全部339块法国领土与和平。可先在全国决议中结束已经彻底占领的地方战争。"
 SOF_NR_CHL_settlement:0 "让军营退回国家之内"
 SOF_NR_CHL_settlement_desc:0 "全国重新统一后，沙隆的军队必须学会接受和平的限制。政府将规定征地补偿、训练区边界与预备役义务，把战时营地的一部分能力转向维修和职业训练。酒乡继续承担税收与国防，但不再成为无限索取的后方。能够停止动员的国家，才真正掌握了动员的力量。\n\n完成后开放180天全国重建工程；本区制度承诺附带永久收益与代价。"
 SOF_NR_MOP_mandate:0 "丰收的人为何仍然饥饿"
 SOF_NR_MOP_mandate_desc:0 "朗格多克的酒窖装满了收成，账簿却记录着债务。蒙彼利埃的合作社代表、独立酒农与矿工将把共同主张带向全国：让劳动换来体面的生活，让国家力量服务生产者。我们将争取法国的领导权，把生产者的生计作为统一理由，让乡村与工业城市共同决定国家方向。\n\n需要本区既有扩张授权。战争动员与全国计划不受执政党更替影响。"
 SOF_NR_MOP_integration:0 "把南方的要求带过山岭"
 SOF_NR_MOP_integration_desc:0 "从阿格德的酒窖到拉格朗德孔布的矿井，统一动员必须建立在能够承受的征用之上。运输队将共同市场与债务审查方案带过山岭，军队以规范采购保护沿途生计。各地将通过协商改进收购制度，开放关卡，共同应对生产危机。\n\n需要完整拥有并控制至少50块法国领土；获得全国制宪授权。"
 SOF_NR_MOP_unitary:0 "一个主权，一部共同法律"
 SOF_NR_MOP_unitary_desc:0 "控制至少100块法国领土后，以统一法庭、税制和国家军队结束割据。中央行政提高动员与生产协调，但新增行政负担和地方不满。\n\n与「共同主权，各省宪章」永久互斥。"
