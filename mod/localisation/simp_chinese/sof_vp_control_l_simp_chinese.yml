 sof_vp_roubaix_textiles_recovery:0 "鲁贝：地方网络恢复期"
 sof_vp_roubaix_textiles_recovery_desc:0 "纺织民用设施的施工协调下降，制服与帆布订单受到拖累。影响城市所在州的地方生产与运输网络。"
 sof_vp.11.t:0 "鲁贝：首次失守"
 sof_vp.11.d:0 "敌军控制了这座城市。地方机构正转移账册、疏散人员。织机维护、布匹仓储与熟练工班被迫分散。本次地方停顿持续10天。"
 sof_vp.12.t:0 "鲁贝：重新收复"
 sof_vp.12.d:0 "原属政府的部队重新控制城市。当地网络需要14天恢复，随后恢复原有服务。复核织机和仓储账册，安排工班回到工作岗位。"
 sof_vp.13.t:0 "鲁贝：敌占延续"
 sof_vp.13.d:0 "城市已连续28天处于同一外来控制者手中。临时战斗停顿转为较轻但持续的占领阻滞，直到收复或友方、中立交接。原料合同与工班联系仍不能完整恢复。"
 sof_vp.14.t:0 "鲁贝：反复易手"
 sof_vp.14.d:0 "城市再次落入敌手，或由另一敌方接管。旧的恢复进程被中断，新的10天停顿开始；控制者连续持有28天后将重新评估。织机维护、布匹仓储与熟练工班被迫分散。"
 sof_vp.15.t:0 "鲁贝：占领后的接管"
 sof_vp.15.d:0 "我们的部队已控制城市，下一步是恢复地方服务；全州控制仍须逐省完成。接管纺织城市需要保住织机、账册及供货网络。 现有损失继续影响当地，恢复工作仅作用于该州。"
 sof_vp.16.t:0 "鲁贝：第三方接管"
 sof_vp.16.d:0 "城市转入目前不与原属政府交战的第三方手中。现由友方或中立管理者负责当地秩序，原属政府尚未恢复直接控制。旧敌占修正取消，地方恢复期为14天。复核织机和仓储账册，安排工班回到工作岗位。"
