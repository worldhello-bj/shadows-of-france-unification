 sof_vp_brest_arsenal_recovery_desc:0 "本州船坞建设速度下降，代表彭费尔德海军船厂配套工程受阻。影响城市所在州的地方生产与运输网络。"
 sof_vp.201.t:0 "布雷斯特：首次失守"
 sof_vp.201.d:0 "敌军控制了这座城市。地方机构正转移账册、疏散人员。海军船厂工程队、盆地设备维护与配套建设中断。本次地方停顿持续21天。"
 sof_vp.202.t:0 "布雷斯特：重新收复"
 sof_vp.202.d:0 "原属政府的部队重新控制城市。当地网络需要21天恢复，随后恢复原有服务。按1936年的现有设施恢复海军船厂配套工程。"
 sof_vp.203.t:0 "布雷斯特：敌占延续"
 sof_vp.203.d:0 "城市已连续35天处于同一外来控制者手中。临时战斗停顿转为较轻但持续的占领阻滞，直到收复或友方、中立交接。海军船厂工程持续受协调缺口影响。"
 sof_vp.204.t:0 "布雷斯特：反复易手"
 sof_vp.204.d:0 "城市再次落入敌手，或由另一敌方接管。旧的恢复进程被中断，新的21天停顿开始；控制者连续持有35天后将重新评估。海军船厂工程队、盆地设备维护与配套建设中断。"
 sof_vp.205.t:0 "布雷斯特：占领后的接管"
 sof_vp.205.d:0 "我们的部队已控制城市，下一步是恢复地方服务；全州控制仍须逐省完成。布雷斯特是海军军械船厂节点，与圣纳泽尔的大型商船造船网络有别。 现有损失继续影响当地，恢复工作仅作用于该州。"
 sof_vp.206.t:0 "布雷斯特：第三方接管"
 sof_vp.206.d:0 "城市转入目前不与原属政府交战的第三方手中。现由友方或中立管理者负责当地秩序，原属政府尚未恢复直接控制。旧敌占修正取消，地方恢复期为21天。按1936年的现有设施恢复海军船厂配套工程。"
 sof_vp_paris_prefecture_disrupted:0 "巴黎：战斗造成的地方停顿"
 sof_vp_paris_prefecture_disrupted_desc:0 "本州可征募人口比例暂时下降，代表行政登记受阻；不删人口、不扣现有人力池。影响城市所在州的地方生产与运输网络。"
 sof_vp_paris_prefecture_entrenched:0 "巴黎：占领下的地方网络阻滞"
 sof_vp_paris_prefecture_entrenched_desc:0 "本州可征募人口比例暂时下降，代表行政登记受阻；不删人口、不扣现有人力池。影响城市所在州的地方生产与运输网络。"
 sof_vp_paris_prefecture_recovery:0 "巴黎：地方网络恢复期"
 sof_vp_paris_prefecture_recovery_desc:0 "本州可征募人口比例暂时下降，代表行政登记受阻；不删人口、不扣现有人力池。影响城市所在州的地方生产与运输网络。"
 sof_vp.211.t:0 "巴黎：首次失守"
 sof_vp.211.d:0 "敌军控制了这座城市。地方机构正转移账册、疏散人员。塞纳省府与警察省府分掌的行政登记网络中断。本次地方停顿持续7天。"
 sof_vp.212.t:0 "巴黎：重新收复"
 sof_vp.212.d:0 "原属政府的部队重新控制城市。当地网络需要7天恢复，随后恢复原有服务。复核市辖区登记与征募手续，按现有部队和人力名册恢复服务。"
 sof_vp.213.t:0 "巴黎：敌占延续"
 sof_vp.213.d:0 "城市已连续21天处于同一外来控制者手中。临时战斗停顿转为较轻但持续的占领阻滞，直到收复或友方、中立交接。地方登记和动员组织仍未完整恢复。"
 sof_vp.214.t:0 "巴黎：反复易手"
 sof_vp.214.d:0 "城市再次落入敌手，或由另一敌方接管。旧的恢复进程被中断，新的7天停顿开始；控制者连续持有21天后将重新评估。塞纳省府与警察省府分掌的行政登记网络中断。"
 sof_vp.215.t:0 "巴黎：占领后的接管"
 sof_vp.215.d:0 "我们的部队已控制城市，下一步是恢复地方服务；全州控制仍须逐省完成。1936年的巴黎由国家通过两位省长管理，接管人员将依照现有行政体系恢复登记与公共服务。 现有损失继续影响当地，恢复工作仅作用于该州。"
 sof_vp.216.t:0 "巴黎：第三方接管"
 sof_vp.216.d:0 "城市转入目前不与原属政府交战的第三方手中。现由友方或中立管理者负责当地秩序，原属政府尚未恢复直接控制。旧敌占修正取消，地方恢复期为7天。复核市辖区登记与征募手续，按现有部队和人力名册恢复服务。"
 sof_vp_corte_mountain_rail_disrupted:0 "科尔特：战斗造成的地方停顿"
 sof_vp_corte_mountain_rail_disrupted_desc:0 "地方补给小幅减少，代表科西嘉内陆山地铁路与城市接驳受阻。影响城市所在州的地方生产与运输网络。"
 sof_vp_corte_mountain_rail_entrenched:0 "科尔特：占领下的地方网络阻滞"
 sof_vp_corte_mountain_rail_entrenched_desc:0 "地方补给小幅减少，代表科西嘉内陆山地铁路与城市接驳受阻。影响城市所在州的地方生产与运输网络。"
 sof_vp_corte_mountain_rail_recovery:0 "科尔特：地方网络恢复期"
 sof_vp_corte_mountain_rail_recovery_desc:0 "地方补给小幅减少，代表科西嘉内陆山地铁路与城市接驳受阻。影响城市所在州的地方生产与运输网络。"
 sof_vp.221.t:0 "科尔特：首次失守"
 sof_vp.221.d:0 "敌军控制了这座城市。地方机构正转移账册、疏散人员。巴斯蒂亚—阿雅克肖山地铁路的内陆接驳与维修联络中断。本次地方停顿持续7天。"
 sof_vp.222.t:0 "科尔特：重新收复"
 sof_vp.222.d:0 "原属政府的部队重新控制城市。当地网络需要7天恢复，随后恢复原有服务。恢复科尔特城镇接驳及山地铁路服务。"
 sof_vp.223.t:0 "科尔特：敌占延续"
 sof_vp.223.d:0 "城市已连续21天处于同一外来控制者手中。临时战斗停顿转为较轻但持续的占领阻滞，直到收复或友方、中立交接。内陆山区的接驳组织仍受到阻力。"
 sof_vp.224.t:0 "科尔特：反复易手"
 sof_vp.224.d:0 "城市再次落入敌手，或由另一敌方接管。旧的恢复进程被中断，新的7天停顿开始；控制者连续持有21天后将重新评估。巴斯蒂亚—阿雅克肖山地铁路的内陆接驳与维修联络中断。"
 sof_vp.225.t:0 "科尔特：占领后的接管"
 sof_vp.225.d:0 "我们的部队已控制城市，下一步是恢复地方服务；全州控制仍须逐省完成。铁路于1888年通至科尔特、1894年贯通全线。恢复城镇接驳后，还须逐段确认山口与桥梁的通行条件。 现有损失继续影响当地，恢复工作仅作用于该州。"
 sof_vp.226.t:0 "科尔特：第三方接管"
 sof_vp.226.d:0 "城市转入目前不与原属政府交战的第三方手中。现由友方或中立管理者负责当地秩序，原属政府尚未恢复直接控制。旧敌占修正取消，地方恢复期为7天。恢复科尔特城镇接驳及山地铁路服务。"
