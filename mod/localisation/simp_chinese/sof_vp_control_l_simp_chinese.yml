 sof_vp_roubaix_textiles_disrupted:0 "鲁贝：战斗造成的地方停顿"
 sof_vp_roubaix_textiles_disrupted_desc:0 "纺织民用设施的施工协调下降，制服与帆布订单受到拖累。影响城市所在州的地方生产与运输网络。"
 sof_vp_roubaix_textiles_entrenched:0 "鲁贝：占领下的地方网络阻滞"
