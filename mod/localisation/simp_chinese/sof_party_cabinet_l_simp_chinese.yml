 sof_party_cabinet.1.d:0 "本届政治程序确定了执政方向，但同一方向下仍有不同的历史政党。请选择由哪一党团组织内阁，并落实其专属施政纲领。候选资格参考本地区1936年的可确认参选基础；这不是重新发布1936票数，也不改变当前饼图支持率。地方主树及既有建设成果继续保留。"
 sof_party_cabinet.defer:0 "暂维持看守内阁，稍后协商"
