 sof_left_technical_survey:0 "燃料与工业技术调查"
 sof_left_mass_assembly:0 "召开群众联合大会"
 sof_left_mass_assembly_desc:0 "一次性组织跨行业大会，稳定度+1个百分点。"
 sof_left_union_mediation:0 "工厂与工会调解"
 sof_left_union_mediation_desc:0 "降低一档既有通用罢工；无通用罢工时稳定度+0.5个百分点。不移除其他地区专属危机。"
 sof_left_food_relief:0 "城乡食品救济协商"
 sof_left_food_relief_desc:0 "稳定度+1个百分点。农村办理救济，城市协调食品供应。共产党与激进党共用一次性账本。"
 sof_left_public_leisure:0 "举办公共休闲活动"
 sof_left_public_leisure_desc:0 "一次性社区文化体育活动，稳定度+0.5个百分点、政治点+15。"
 sof_left_coalition_mediation:0 "调解共和改革联盟"
 sof_left_coalition_mediation_desc:0 "一次性免费党际调解，稳定度+1个百分点。不排除其他党派参选。"
 sof_left_workers_preparation:0 "召集工人组织预备会"
 sof_left_workers_preparation_desc:0 "本地党组织与自主工会对话，稳定度+0.5个百分点，不与外国政府模拟本地党派谈判。"
 sof_left_humanitarian_relief:0 "救济辖内战争受害者"
 sof_left_humanitarian_relief_desc:0 "一次性组织平民救济，稳定度+1个百分点；不产生远征军。"
 sof_left_defensive_offer:0 "向[From.GetName]提出安全协商"
 sof_left_defensive_offer_desc:0 "仅一次。对方可接受或拒绝；接受后互不侵犯、双方陆军经验+3。拒绝或局势失效返还15政治点。没有强制结盟或保证。"
 sof_left_peace_offer:0 "向[From.GetName]提出和平协商"
 sof_left_peace_offer_desc:0 "仅一次。对方同意后互不侵犯并获得双向+15关系并随时间衰减。拒绝或局势失效返还10政治点。"
 sof_left_policy_actions:0 "人民阵线与工人组织政策"
 sof_left_policy_actions_desc:0 "本党执政期间执行已完成国策解锁的活动。每项活动只能完成一次；跨党共同救济不重复支付。"
 sof_left_accept:0 "接受有限合作倡议"
 sof_left_decline:0 "拒绝或撤回这份倡议"
 sof_left_domestic_ratify:0 "批准双方协商后的有限合作文本"
 sof_left_domestic_return:0 "退回文本，保留各自立场"
 sof_left_acknowledge:0 "知悉"
 sof_party_left.1.t:0 "邻邦提出安全协商"
 sof_party_left.1.d:0 "[From.GetName]提议以互不侵犯协定和防御经验交流建立有限互信。接受意味着双方陆军经验各增加3；不加入共同阵营，也不承担自动参战义务。我们可以拒绝。"
 sof_party_left.2.t:0 "区域和平协商倡议"
 sof_party_left.2.d:0 "[From.GetName]提议以互不侵犯协定维护区域和平。接受后双方关系提高15，之后随时间衰减。提议未要求加入阵营或承担独立保障，我们可以拒绝。"
 sof_party_left.3.t:0 "本地社会主义代表同意有限文本"
 sof_party_left.3.d:0 "本地SFIO代表与PUP协商后同意一份劳工政策合作文本，现在交由本地议会决定。批准带来稳定度+1.5个百分点。各党组织保持独立，不提前完成全国合并，也不改写下次选举名单。拒绝则返还20政治点。"
 sof_party_left.4.t:0 "本地统一谈判未达成协议"
 sof_party_left.4.d:0 "本地社会主义组织认为合作条件尚不成熟。PUP继续独立运作，谈判预留的20政治点返还。后续政治进程不被锁死。"
 sof_party_left.5.t:0 "邻邦接受有限合作"
 sof_party_left.5.d:0 "对方接受了我们提出的有限协商。互不侵犯协定及提案列出的合作收益已生效；没有强制结盟或自动参战义务。"
 sof_party_left.6.t:0 "邻邦没有接受倡议"
 sof_party_left.6.d:0 "对方拒绝了提议，或局势变化使原方案不再适用。提案说明中的部分政治点已返还；没有产生协定或强制战争。"
