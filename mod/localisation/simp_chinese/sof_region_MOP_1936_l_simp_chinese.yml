l_simp_chinese:
 sof_region_MOP_1936_crisis:0 "葡萄丰收与空的账簿"
 sof_region_MOP_1936_crisis_desc:0 "葡萄已经收进酒窖，债单仍在桌上。有人要求继续收储，有人要求把剩余蒸馏掉，更多人只想知道下一笔贷款何时到期。朗格多克的共同事务，将从这场争论开始。"
 sof_region_MOP_1936_inventory:0 "核实各地酒窖库存"
 sof_region_MOP_1936_inventory_desc:0 "实际库存和抵押单逐项对照，不能以行政命令消灭葡萄过剩。"
 sof_region_MOP_1936_representatives:0 "谁能代表种植户"
 sof_region_MOP_1936_representatives_desc:0 "让合作社、独立小农和大酒商分别提出诉求，以协商形成地方建设方案。"
 sof_region_MOP_1936_cooperative_voice:0 "合作社联席代表"
 sof_region_MOP_1936_cooperative_voice_desc:0 "共同压榨、共同储存，也应当共同决定如何使用信用。合作社代表将坐到预算桌前，把小生产者的声音变成有份量的集体授权。"
 sof_region_MOP_1936_cooperative_voice_network:0 "合作社联席代表：地方体系"
 sof_region_MOP_1936_municipal_voice:0 "市镇仲裁委员会"
 sof_region_MOP_1936_municipal_voice_desc:0 "葡萄酒支撑许多家庭，却不能代表每一个矿工、港工和市民。由市镇主持仲裁，我们将把不同生计放在同一张预算表上，防止一种危机吞没整片地区。"
 sof_region_MOP_1936_municipal_voice_network:0 "市镇仲裁委员会：地方体系"
 sof_region_MOP_1936_debt_audit:0 "区分旧债与新工程"
 sof_region_MOP_1936_debt_audit_desc:0 "旧酒债不能无限展期，新工程要有单独偿还来源。"
 sof_region_MOP_1936_charter:0 "酒乡公共财政章程"
 sof_region_MOP_1936_charter_desc:0 "将不同代表制度汇入共同预算原则，地方主树不代替独立政党模块。"
 sof_region_MOP_1936_credit:0 "合作酒窖的限定信贷"
 sof_region_MOP_1936_credit_desc:0 "为储存和共同压榨提供有期限的信贷，不以无限补贴维持所有滞销酒。"
 sof_region_MOP_1936_agde_site:0 "阿格德酒窖工地"
 sof_region_MOP_1936_agde_site_desc:0 "推进源于1923年计划的阿格德项目，在1936年组织开工与建设。"
 sof_region_MOP_1936_agde_site_local:0 "阿格德酒窖工地"
 sof_region_MOP_1936_presses:0 "共同压榨与计量"
 sof_region_MOP_1936_presses_desc:0 "在新工程内统一称重与压榨记录，避免社员交货结算争议。"
 sof_region_MOP_1936_storage:0 "以储酒平抑冲击"
 sof_region_MOP_1936_storage_desc:0 "好酒需要时间，濒临破产的种植户也需要时间。扩充公共储存与质量管理，让出售的节奏慢下来。我们必须为更长的账期承担真正的财政代价。"
 sof_region_MOP_1936_storage_local:0 "以储酒平抑冲击"
 sof_region_MOP_1936_distillation:0 "蒸馏处理剩余"
 sof_region_MOP_1936_distillation_desc:0 "仓库再大，也容不下没有尽头的剩余。接受一次明确的减量，把部分库存送往蒸馏和处理，让下一季的价格不再压在同一批旧酒之下。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_MOP_1936_quality_labs:0 "酒质与卫生化验"
 sof_region_MOP_1936_quality_labs_desc:0 "让实验室服务储酒稳定性与卫生，不将大学直接变成无限军事科技加成。"
 sof_region_MOP_1936_chem_bonus:0 "酒质与卫生化验：技术积累"
 sof_region_MOP_1936_byproducts:0 "蒸馏副产物账目"
 sof_region_MOP_1936_byproducts_desc:0 "分别核算酒精副产物的收入与处理成本，明确其工业用途和销售安排。"
 sof_region_MOP_1936_cellar_network:0 "酒窖共同维修网"
 sof_region_MOP_1936_cellar_network_desc:0 "工程后期统一维修和备件订单，有限民用能力落在阿格德所在州。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_MOP_1936_rural_delegates:0 "乡村用水听证"
 sof_region_MOP_1936_rural_delegates_desc:0 "灌溉、生活用水与工业供水要分别说明，不能以工业名义抹掉农村需求。"
 sof_region_MOP_1936_agronomy:0 "大学农艺技术服务"
 sof_region_MOP_1936_agronomy_desc:0 "让现有大学能力服务土壤、卫生和计量培训，以应用技术为边界。"
 sof_region_MOP_1936_agronomy_bonus:0 "大学农艺技术服务：技术积累"
 sof_region_MOP_1936_canal_survey:0 "小型水利分段勘查"
 sof_region_MOP_1936_canal_survey_desc:0 "先勘查已有灌排工程及维护需要，不在1936年提前赠送战后大型区域水利体系。"
 sof_region_MOP_1936_drinking_water:0 "先保市镇饮水"
 sof_region_MOP_1936_drinking_water_desc:0 "优先卫生与生活用水，接受农业扩张速度较慢的结果。"
 sof_region_MOP_1936_drinking_water_local:0 "先保市镇饮水"
 sof_region_MOP_1936_irrigation:0 "优先整修灌溉渠"
 sof_region_MOP_1936_irrigation_desc:0 "给农业生产分配更多维修预算，其他公共工程需要后移。"
 sof_region_MOP_1936_irrigation_local:0 "优先整修灌溉渠"
 sof_region_MOP_1936_water_register:0 "公开取水权登记"
 sof_region_MOP_1936_water_register_desc:0 "选择不同投资顺序后仍必须登记取水责任，防止上游独占水源。"
 sof_region_MOP_1936_rural_roads:0 "酒乡支线修整"
 sof_region_MOP_1936_rural_roads_desc:0 "把支路维修和运输组织对接，葡萄运得出去才有市场意义。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_MOP_1936_market_halls:0 "地区集散与小修理"
 sof_region_MOP_1936_market_halls_desc:0 "连接酒乡集散与维修采购，为地方市场和农业设备提供配套。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_MOP_1936_sete:0 "地中海商港登记"
 sof_region_MOP_1936_sete_desc:0 "以蒙彼利埃辖区为港务联络中心，审查沿海贸易与货物周转。"
 sof_region_MOP_1936_coastal_rail:0 "沿海铁路货运分配"
 sof_region_MOP_1936_coastal_rail_desc:0 "依托1936年的铁路公司和既有线路，协调沿海货运与内陆集散。"
 sof_region_MOP_1936_narbonne:0 "纳博讷中转班表"
 sof_region_MOP_1936_narbonne_desc:0 "纳博讷是独立地图门槛，不能只控制蒙彼利埃就领取整条南线的收益。"
 sof_region_MOP_1936_narbonne_local:0 "纳博讷中转班表"
 sof_region_MOP_1936_port_labor:0 "装卸工轮班契约"
 sof_region_MOP_1936_port_labor_desc:0 "把粮食、酒和军需装卸分出时段，劳资谈判以实际轮班为内容。"
 sof_region_MOP_1936_med_offer:0 "邀请马赛商港互认"
 sof_region_MOP_1936_med_offer_desc:0 "向马赛提出港口单证互认，由对方决定接受或拒绝。"
 sof_region_MOP_1936_med_offer_accord_MOP:0 "邀请马赛商港互认：双边履约"
 sof_region_MOP_1936_med_offer_accord_MRS:0 "邀请马赛商港互认：双边履约"
 sof_region_MOP_1936_med_offer_accepted_notice:0 "邀请马赛商港互认：已获同意"
 sof_region_MOP_1936_med_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_MOP_1936_med_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_med_offer_declined_notice:0 "邀请马赛商港互认：遭到拒绝"
 sof_region_MOP_1936_med_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_MOP_1936_med_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_med_offer_event:0 "邀请马赛商港互认"
 sof_region_MOP_1936_med_offer_event_desc:0 "向马赛提出港口单证互认，由对方决定接受或拒绝。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_MOP_1936_med_offer_yes:0 "接受对等磋商"
 sof_region_MOP_1936_med_offer_no:0 "拒绝本次提案"
 sof_region_MOP_1936_sea_manifest:0 "获准的沿海货单"
 sof_region_MOP_1936_sea_manifest_desc:0 "对方接受后组织本地海运接续，不因此获得马赛港、舰队或领土。"
 sof_region_MOP_1936_small_repairs:0 "沿海小船修理合同"
 sof_region_MOP_1936_small_repairs_desc:0 "完善现有船舶修理与救援服务，为沿海航运建立可靠保障。"
 sof_region_MOP_1936_coast_bonus:0 "沿海小船修理合同：技术积累"
 sof_region_MOP_1936_mines:0 "塞文矿区安全听证"
 sof_region_MOP_1936_mines_desc:0 "矿工、工程师和地方代表核对事故隐患，煤矿不只是全国面板上的一个数字。"
 sof_region_MOP_1936_ricard:0 "里卡尔井完工验收"
 sof_region_MOP_1936_ricard_desc:0 "工程在1932至1936年建造；把1936年设备作为验收项目，不混入1948年设备。"
 sof_region_MOP_1936_ventilation:0 "压缩机与通风维护"
 sof_region_MOP_1936_ventilation_desc:0 "先恢复通风和机械维护，安全投入不能被提高采掘配额取代。"
 sof_region_MOP_1936_ventilation_local:0 "压缩机与通风维护"
 sof_region_MOP_1936_mine_housing:0 "矿井救护与工人住宅"
 sof_region_MOP_1936_mine_housing_desc:0 "将救护和居住问题列入矿务预算，以具体建设回应矿工诉求。"
 sof_region_MOP_1936_coal_dispatch:0 "煤车与地方电力调度"
 sof_region_MOP_1936_coal_dispatch_desc:0 "通风机在转，修理班已经排好，煤车却不能继续无序等待。把井口、维修和地方电力连接起来，塞文的机械能力将支持整片地区的重建。"
 sof_region_MOP_1936_coal_dispatch_local:0 "煤车与地方电力调度"
 sof_region_MOP_1936_ales_workshops:0 "阿莱机工协作"
 sof_region_MOP_1936_ales_workshops_desc:0 "组织矿山机工承担维护合同与公共工程，发挥既有修理技能。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_MOP_1936_mountain_units:0 "塞文地方防卫名册"
 sof_region_MOP_1936_mountain_units_desc:0 "针对山地道路和分散居民点安排守备，不构想不存在的重装甲平原会战。完成后开放既有边境统一战争目标决议，由玩家决定是否发动战争。"
 sof_region_MOP_1936_mule_columns:0 "山地驮运纵队训练"
 sof_region_MOP_1936_mule_columns_desc:0 "先练习驮运、分段补给和小单位协同，不靠免费增编师解决交通。"
 sof_region_MOP_1936_mountain_bonus:0 "山地驮运纵队训练：技术积累"
 sof_region_MOP_1936_sappers:0 "溪谷道路工兵"
 sof_region_MOP_1936_sappers_desc:0 "将矿山机械维护与道路工兵训练联系，保持人员和预算有界。"
 sof_region_MOP_1936_engineer_bonus:0 "溪谷道路工兵：技术积累"
 sof_region_MOP_1936_mobile_columns:0 "轻装机动守备"
 sof_region_MOP_1936_mobile_columns_desc:0 "山路需要会走山路的人。轻装守备队携带能够修理的武器、明确的补给计划和熟悉溪谷的向导，以机动守住塞文的出入口。"
 sof_region_MOP_1936_coastal_guard:0 "海岸巡查与救援"
 sof_region_MOP_1936_coastal_guard_desc:0 "把海岸救援、港口通报和地方守备接起来，不宣布永久封闭商港。"
 sof_region_MOP_1936_public_health:0 "大学卫生服务队"
 sof_region_MOP_1936_public_health_desc:0 "用地方教育资源培训卫生员，为农村和港区提供可持续服务。"
 sof_region_MOP_1936_hospital_bonus:0 "大学卫生服务队：技术积累"
 sof_region_MOP_1936_spanish_border:0 "西班牙危机的救护规程"
 sof_region_MOP_1936_spanish_border_desc:0 "1936年西班牙内战爆发后，准备边境接待与医疗服务，按当前需求安排人员和物资。"
 sof_region_MOP_1936_toulouse_offer:0 "与图卢兹议南部中继"
 sof_region_MOP_1936_toulouse_offer_desc:0 "向图卢兹提议运输和救护中继，各自保留控制与拒绝权。"
 sof_region_MOP_1936_toulouse_offer_accord_MOP:0 "与图卢兹议南部中继：双边履约"
 sof_region_MOP_1936_toulouse_offer_accord_TOU:0 "与图卢兹议南部中继：双边履约"
 sof_region_MOP_1936_toulouse_offer_accepted_notice:0 "与图卢兹议南部中继：已获同意"
 sof_region_MOP_1936_toulouse_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_MOP_1936_toulouse_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_toulouse_offer_declined_notice:0 "与图卢兹议南部中继：遭到拒绝"
 sof_region_MOP_1936_toulouse_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_MOP_1936_toulouse_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_toulouse_offer_event:0 "与图卢兹议南部中继"
 sof_region_MOP_1936_toulouse_offer_event_desc:0 "向图卢兹提议运输和救护中继，各自保留控制与拒绝权。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_MOP_1936_toulouse_offer_yes:0 "接受对等磋商"
 sof_region_MOP_1936_toulouse_offer_no:0 "拒绝本次提案"
 sof_region_MOP_1936_relief_corridor:0 "接受后的救护中继"
 sof_region_MOP_1936_relief_corridor_desc:0 "图卢兹接受后改善本地中继训练，不擅自决定其边境政策。"
 sof_region_MOP_1936_rhone_offer:0 "向里昂询问机具合同"
 sof_region_MOP_1936_rhone_offer_desc:0 "向里昂提出矿务机具采购框架，以合同落实维修设备的供应。"
 sof_region_MOP_1936_rhone_offer_accord_MOP:0 "向里昂询问机具合同：双边履约"
 sof_region_MOP_1936_rhone_offer_accord_LYO:0 "向里昂询问机具合同：双边履约"
 sof_region_MOP_1936_rhone_offer_accepted_notice:0 "向里昂询问机具合同：已获同意"
 sof_region_MOP_1936_rhone_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_MOP_1936_rhone_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_rhone_offer_declined_notice:0 "向里昂询问机具合同：遭到拒绝"
 sof_region_MOP_1936_rhone_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_MOP_1936_rhone_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_MOP_1936_rhone_offer_event:0 "向里昂询问机具合同"
 sof_region_MOP_1936_rhone_offer_event_desc:0 "向里昂提出矿务机具采购框架，以合同落实维修设备的供应。双方可独立决定接受或拒绝。接受后，双方各自在实际控制的中心获得两年履约支持；领土与阵营归属维持现状。"
 sof_region_MOP_1936_rhone_offer_yes:0 "接受对等磋商"
 sof_region_MOP_1936_rhone_offer_no:0 "拒绝本次提案"
 sof_region_MOP_1936_accepted_tools:0 "履行矿务机具框架"
 sof_region_MOP_1936_accepted_tools_desc:0 "接受框架后组织本地维修标准，不能凭协议直接复制里昂工厂。"
 sof_region_MOP_1936_machine_bonus:0 "履行矿务机具框架：技术积累"
 sof_region_MOP_1936_union_debate:0 "从地方契约到共同宪章"
 sof_region_MOP_1936_union_debate_desc:0 "把代表权、水权和财政责任带入全国讨论；协议本身不兼并邻国。"
 sof_region_MOP_1936_cellar_debt:0 "统一后保留酒窖账本"
 sof_region_MOP_1936_cellar_debt_desc:0 "统一扩大市场但不免除全部旧债，合作社与私人库存仍需分账。"
 sof_region_MOP_1936_water_compact:0 "统一后的地方水权"
 sof_region_MOP_1936_water_compact_desc:0 "以已登记的地方取水责任安排全国工程，明确各地灌溉份额与履行程序。"
 sof_region_MOP_1936_water_compact_local:0 "统一后的地方水权"
 sof_region_MOP_1936_mine_compact:0 "矿务安全进入全国规范"
 sof_region_MOP_1936_mine_compact_desc:0 "将本地矿井验收和救护记录带入全国标准，先保安全再扩产。"
 sof_region_MOP_1936_port_balance:0 "统一后的南部货运比例"
 sof_region_MOP_1936_port_balance_desc:0 "酒、煤与公共物资各有货运份额，统一不能令一个行业占用全部车辆。"
