 sof_tp_cancel_outgoing_contract_desc:0 "结束由本国向这一政府承担的合作协议。撤回保留已投入资源和交付成果的记录，由退出方承担相应政治代价。"
 sof_tp_cancel_outgoing_contract_tt:0 "只能撤回本国作为发起方向指定接收方签订的在办协议。我方信任−10、正统性−5，对方信任−5；接收方协议槽释放并冷却60日。已付政治点和陆军经验不退，交付成果保留。不触发宣战或吞并。"
