 sof_tp_institution_provisional:0 "仅临时章程"
 sof_tp_focus_office_tt:0 "建立外交协调机构，解锁议事厅的定向提案。此后，实际签订同盟也可与外交机构一起替代全国授权国策的战争准备条件。"
 sof_tp_focus_congress_tt:0 "建立全国会议机构，允许在第一阶段提前开会。此国策的规模条件可由本国至少50州满足，或由真实签订同盟且阵营实控至少50个法国州满足；原有前置国策仍须完成。"
 sof_tp_focus_constitution_tt:0 "建立常设宪制机构，并确认此国策对应的联邦或中央章程。与议事厅现行章程保持一致。规模条件可由本国至少100州满足，也可由真实和平统一条约满足。议事厅可先以50政治点通过临时章程，无须等待此国策。"
 sof_tp_focus_settlement_tt:0 "完成本国全国终局国策时一次检查：结束重建、完成运输修复或退伍安置中的任一成果，+75政治点；实际兑现工业援助或完成本国工业项目，获得一次工业科技25%加成；没有工业成果但已执行军事宣战或交付联合整训，则改得15陆军经验。科技与军经验不叠加；成果以国策完成时的状态结算。"
 sof_tp_focus_PRS_unlock_tt:0 "建立工会代表席位。此后议事厅每次“兑现地方承诺”除原奖励外，再获正统性+3。"
 sof_tp_focus_PRS_result_tt:0 "完成“法兰西联邦”时，若已通过议事厅签成真实和平统一条约，追加一次稳定度+5个百分点、政治点+50。协议收益以国策完成时的签约状态结算。"
 sof_tp_focus_LIL_unlock_tt:0 "建立劳资协调局。此后每次实际兑现对外双边援助，我方额外获得信任+5。"
 sof_tp_focus_LIL_result_tt:0 "真实兑现双边援助可替代“工资、工时与轮班协约”的1936年6月6日日期门槛；其他前置仍适用。完成该国策时已有援助成果，追加一次稳定度+5个百分点；之后才援助不补发。"
 sof_tp_focus_BRD_unlock_tt:0 "建立港务信用署。此后每次实际兑现对外双边援助，我方额外获得重建进度+10。"
 sof_tp_focus_BRD_result_tt:0 "真实兑现双边援助可替代“统一后港口合同审计”的100州门槛；其他前置仍适用。完成该国策时已有援助成果，追加一次稳定度+5个百分点；之后才援助不补发。"
 sof_tp_focus_REN_unlock_tt:0 "建立地方权利保证机构。此后对方首次接受我方会议邀请时，除原奖励外再获信任+5；每对国家只触发一次。"
 sof_tp_focus_REN_result_tt:0 "完成“共同安全协定”时，若我方已经实际兑现双边援助，追加一次稳定度+5个百分点。仅收到援助不满足此条件；之后才兑现不补发。"
 sof_tp_contract.1.t:0 "先履约，再谈统一"
 sof_tp_contract.1.d:0 "[FROM.GetName]提出以“[FROM.GetSofTpSentTerms]”作为合作条件。代表们要求先把谁付钱、何时交付、地方能得到什么写清，再谈统一。\n\n[FROM.GetSofTpSentTermsDetails]\n\n签署只接受合作条款。交付后，我们仍须再次决定是否并入；拒绝保持独立。战争暂停计时，未交付便到期有失信代价。可以将其他报价改提为行政过渡方案。"
 sof_tp_contract.1.a:0 "接受条款，保留最终批准。"
 sof_tp_contract.1.b:0 "先保留地方行政，改谈过渡方案。"
 sof_tp_contract.1.c:0 "我们继续争取更合适的条件。"
 sof_tp_contract.2.t:0 "印章暂留地方"
 sof_tp_contract.2.d:0 "谈判对象送回了反要约。他们愿意继续合作，但希望以行政过渡开始：先解决运转经费，让现有机关继续办理事务，再讨论国家归属。\n\n接受这项修改，需要真正投入政治资源；它既不授予我们指挥对方政府的权力，也不让时间替对方签署统一。拒绝修改则结束本轮交涉，双方可以保留各自的选择。\n\n修改条款：我方执行时一次支付40政治点，接收方立即获得40政治点；90个和平日后双方信任+8。合同总期限180个和平日。签字不立即支付执行费，完成后仍由对方决定是否并入。"
 sof_tp_contract.2.a:0 "按过渡条款继续。"
 sof_tp_contract.2.b:0 "我们不接受这份修改。"
 sof_tp_contract.3.t:0 "条款已经履行，决定仍未代签"
 sof_tp_contract.3.d:0 "已交付条款：[Root.GetSofTpContractType]。\n\n约定的合作已经完成。代表们重新来到桌边，这一次，他们有交付的结果可以检查，而不只是对未来的保证。\n\n面前的文件是最终统一批准。签字将把国家和军队交入共同体制；不签，政府将继续保持独立。先前接受援助、过渡或联合训练，并没有取消今天说不的权利。"
 sof_tp_contract.3.a:0 "批准并入共同国家。"
 sof_tp_contract.3.b:0 "履约值得承认，但我们保持独立。"
 sof_tp_contract.4.t:0 "交付记录可以签收了"
 sof_tp_contract.4.d:0 "本次交付：[Root.GetSofTpLastContractType]。\n\n交接人员送来了完工记录。双方约定的工作已经落实，新的合作成果为统一奠定了可靠基础。\n\n接收方将单独决定是否批准最终整合。"
 sof_tp_contract.4.a:0 "记录交付，等待最终决定。"
 sof_tp_contract.5.t:0 "一份协议走到尽头"
 sof_tp_contract.5.d:0 "这份协议已不再继续。档案员把它从待办清单移出，保留签订、执行与终止的记录。协议记录保留履约进度与实际损失，作为后续交涉的依据。\n\n双方仍可以重新谈判，或者转向其他政策。协议结束后，各国保留现有领土与战争状态。"
 sof_tp_contract.5.a:0 "结束本轮协议。"
 sof_tp_contract.6.t:0 "从预算栏走进日常"
 sof_tp_contract.6.d:0 "负责项目的机关送来了验收报告。筹备时讨论过的经费、人员和工期，现在对应着已经交付的建设或安置成果。\n\n重建没有解决法国的全部争论，但让下一场争论发生在更能运转的国家里。我们可以安排下一项工程，也可以把资源留给其他需要。"
 sof_tp_contract.6.a:0 "登记成果，结清项目。"
 sof_tp_contract.7.t:0 "工程暂告一段落"
 sof_tp_contract.7.d:0 "项目办公室已停止这项安排，将分别登记已经投入的资源与已经交付的成果。\n\n未完成部分停止推进。政府须根据现有的人力和经费，重新安排后续工作。"
 sof_tp_contract.7.a:0 "按实际进度办理结算。"
