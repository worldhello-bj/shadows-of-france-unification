l_simp_chinese:
 sof_tp_campaign:0 "法国的下一页"
 sof_tp_campaign_desc:0 "法国的各地力量正在争取共同的未来。第一阶段确立全国政治优势，第二阶段通过会议、合作条约和重建走向统一。各政府自主参会、签约与履约，接收方在交付完成后单独批准最终整合；拒绝条款时仍保留和平与独立。"
 sof_tp_bloc_0:0 "未结盟"
 sof_tp_bloc_1:0 "革命协约"
 sof_tp_bloc_2:0 "民主社会主义联盟"
 sof_tp_bloc_3:0 "共和秩序协约"
 sof_tp_bloc_4:0 "威权复兴联盟"
 sof_tp_bloc_5:0 "民族主义联盟"
 sof_tp_request_membership:0 "向[FROM.GetName]申请加入"
 sof_tp_request_membership_desc:0 "代表团将带着共同防务的建议出发。对方仍需表态；将政治共识写成双方正式批准的条约。"
 sof_tp_invite_congress:0 "邀请[FROM.GetName]参加全国会议"
 sof_tp_invite_congress_desc:0 "让各地代表在地图铺开之前先坐到桌边。我们邀请对方讨论国家重建，不要求他们凭一张入场券交出政府。"
 sof_tp_offer_union:0 "向[FROM.GetName]提交统一条约"
 sof_tp_offer_union_desc:0 "向[FROM.GetName]提出具体合作条件：建设工场、资助行政过渡，或开展联合训练。双方签约后执行交付，再由接收方单独批准最终整合。"
 sof_tp_press_claim:0 "向[FROM.GetName]施加强硬压力"
 sof_tp_press_claim_desc:0 "谈判的失败使强硬派要求把统一问题交给军队。此举为冲突铺路，但不代替最终的宣战决定；战后的账单仍由法国支付。"
 sof_tp_leave_bloc:0 "重新考虑阵营归属"
 sof_tp_leave_bloc_desc:0 "退出旧协约，重新选择适合本国方向的伙伴，或以独立身份开展下一阶段外交。"
 sof_tp_claim_victory:0 "宣布全国政治优势"
 sof_tp_claim_victory_desc:0 "当竞争者已不足以维持另一套全国秩序时，胜利不再只是地图上的颜色。我们必须向仍然自治的盟友和陌生的城市解释，新法国将如何治理。"
 sof_tp_open_congress:0 "召开全国重建会议"
 sof_tp_open_congress_desc:0 "将胜利转化为共同建设。各地代表协商预算、行政权限与军队归属，为签约、履约和最终整合铺平道路。"
 sof_tp_adopt_federal:0 "确立联邦式协约"
 sof_tp_adopt_federal_desc:0 "地方代表要求把共同国家的边界写进制度：哪些事情共同办理，哪些事情仍由当地决定。联邦方案以分权换取合作。"
 sof_tp_adopt_central:0 "确立中央集权体制"
 sof_tp_adopt_central_desc:0 "财政官与参谋要求统一的命令和统一的账本。中央方案缩短协调链条，却需要为地方的不安付出政治代价。"
 sof_tp_fund_reconstruction:0 "拨付重建经费"
 sof_tp_fund_reconstruction_desc:0 "站台上的货物等着运输，工场里的工人等着开工。把可以支配的政治资源投入重建，胜利才会走出报纸的头版。"
 sof_tp_keep_promises:0 "兑现地方承诺"
 sof_tp_keep_promises_desc:0 "兑现与各地签署的承诺，以当前投入巩固信用，为下一轮合作建立信任。"
 sof_tp_break_promises:0 "收回地方让步"
 sof_tp_break_promises_desc:0 "中央可以收回谈判时作出的让步，尽快推进自己的部署。代表们将以约定的保障衡量新国家的承诺。"
 sof_tp_complete_reconstruction:0 "结束临时重建体制"
 sof_tp_complete_reconstruction_desc:0 "结束临时过渡，让国家在新的制度下稳定运转。将重建成果交给常设机构，继续修复战争留下的创伤。"
 sof_tp.1.t:0 "一份共同防务的来函"
 sof_tp.1.d:0 "[FROM.GetName]的代表带来了加入协约的申请。来函没有抹去双方报纸上的争论：有人希望共同抵御敌手，也有人担心从此必须为另一座城市的决定埋单。\n\n秘书把两国的印章摆在桌上。我们可以接受这个伙伴，也可以保留自己的距离。"
 sof_tp.1.a:0 "让共同的事业先行。"
 sof_tp.1.b:0 "继续磋商签署条件。"
 sof_tp.2.t:0 "一张尚未签名的席位卡"
 sof_tp.2.d:0 "[FROM.GetName]邀请我们参加全国重建会议。信中列出需要商议的事项：政府之间的权限、地区的预算，以及各支部队将来服从谁。它没有要求我们立即交出印章。\n\n代表们提醒内阁，缺席可以表达立场，却也会把谈判桌留给别人。参加会议，至少让我们的条件有人亲口说出。"
 sof_tp.2.a:0 "带上我们的条件，赴会。"
 sof_tp.2.b:0 "让他们先回答我们的疑虑。"
 sof_tp.3.t:0 "条约的最后一页"
 sof_tp.3.d:0 "[FROM.GetName]提交了统一条约。最后一页留着签名的位置，前面的条款却牵动着整座城市：税款将送往何处，部队由谁调遣，地方的声音又能传到多远。\n\n签字意味着接受整合。提出地方保障和过渡要求，意味着留在会议中继续谈判；拒绝则让这份提案到此为止。三条路都仍然摆在桌上。"
 sof_tp.3.a:0 "签署条约，接受整合。"
 sof_tp.3.b:0 "提出反要约：先保障地方，再谈整合。"
 sof_tp.3.c:0 "我们选择另一条建设法国的道路。"
 sof_tp.4.t:0 "胜利以后，谁来开门"
 sof_tp.4.d:0 "竞争对手已无法维持另一套全国秩序，我们的旗帜成为法国最有分量的政治承诺。然而，车站不因演说恢复班次，市政厅也不因捷报找到薪水。\n\n盟友带着旧承诺到来，新归属的地区带着旧疑虑到来。第一阶段争的是由谁提出法国的未来；现在，轮到我们证明那些话能成为人们的日常。"
 sof_tp.4.a:0 "把胜利带进议事厅。"
 sof_tp.5.t:0 "印章落下以后"
 sof_tp.5.d:0 "统一条约已经得到对方认可。代表团没有留下胜利者的欢呼，留下的是需要交接的名册、账簿和公文箱。\n\n这一次，接管机关无需先修复被炮火击穿的墙。保存下来的生产与行政秩序是谈判最实际的收获；但新的中央仍须让签字的人相信，他们没有把地方的未来换成一纸空文。"
 sof_tp.5.a:0 "从共同的账本开始。"
 sof_tp.6.t:0 "退回来的草案"
 sof_tp.6.d:0 "对方拒绝了本次提案，信使带回代表们提出的异议。双方维持和平与各自政府。\n\n内阁可以调整条款、继续对话，也可以另行决定是否施压。下一步外交方向仍由我们选择。"
 sof_tp.6.a:0 "记下分歧，保留选择。"
 sof_tp.7.t:0 "选票与旧条约"
 sof_tp.7.d:0 "新的政治多数开始执政，内阁将审视现有协约与新的施政目标。支持者期待改变，伙伴也在等待政府明确立场。\n\n现有协约继续有效。我们可以维持关系，也可以通过阵营决议正式选择新的伙伴。"
 sof_tp.7.a:0 "先接过公文，再决定方向。"
 sof_tp.8.t:0 "临时二字被划去"
 sof_tp.8.d:0 "最后一份过渡报告送到桌前。它没有写满胜利的形容词，只有已经恢复的机构、仍待解决的矛盾，以及交给常设政府的责任。\n\n有人曾在会议上签字，有人是在战后接受新的秩序。共同国旗下，各地记忆仍有自己的位置。重建期结束了；这个国家将以往后的每一天，回答统一究竟意味着什么。"
 sof_tp.8.a:0 "让共同的生活继续。"
 sof_tp.2.d_PRS:0 "巴黎的代表把工会的意见夹在议会文件中。工人的发言权将写入停战后的秩序，地方代表共同参与统一。行政官员主张建立常设协调机构，让物资调拨与治安工作及时落实。\n\n[FROM.GetName]邀请我们参加全国重建会议。出席将开启正式协商，我们保留独立政府与最终批准权；拒绝邀请时双方维持和平。"
 sof_tp.3.d_PRS:0 "巴黎的代表把工会的意见夹在议会文件中。工人的发言权将写入停战后的秩序，地方代表共同参与统一。行政官员主张建立常设协调机构，让物资调拨与治安工作及时落实。\n\n如今[FROM.GetName]把统一条约交到我们手上。接受将进行国家整合；我们也可以要求保留政府作为行政过渡、留在会议中，或拒绝这份草案。"
 sof_tp.2.d_LIL:0 "里尔代表团先问煤炭和工资，再问旗帜。工人希望劳动保障随统一得到承认，厂主担心订单与运输再次中断，市政厅则希望不用在每次争执后重开一轮危机会议。合作需要让工场真正恢复运转。\n\n[FROM.GetName]邀请我们参加全国重建会议。出席将开启正式协商，我们保留独立政府与最终批准权；拒绝邀请时双方维持和平。"
 sof_tp.3.d_LIL:0 "里尔代表团先问煤炭和工资，再问旗帜。工人希望劳动保障随统一得到承认，厂主担心订单与运输再次中断，市政厅则希望不用在每次争执后重开一轮危机会议。合作需要让工场真正恢复运转。\n\n如今[FROM.GetName]把统一条约交到我们手上。接受将进行国家整合；我们也可以要求保留政府作为行政过渡、留在会议中，或拒绝这份草案。"
 sof_tp.2.d_BRD:0 "波尔多的来件附着港口账目和地方预算。代表们愿意恢复全国市场，却不愿把每一笔信贷和市政开支都送往远方审批。共同国库与地方余地能否并存，将决定他们如何签字。\n\n[FROM.GetName]邀请我们参加全国重建会议。出席将开启正式协商，我们保留独立政府与最终批准权；拒绝邀请时双方维持和平。"
 sof_tp.3.d_BRD:0 "波尔多的来件附着港口账目和地方预算。代表们愿意恢复全国市场，却不愿把每一笔信贷和市政开支都送往远方审批。共同国库与地方余地能否并存，将决定他们如何签字。\n\n如今[FROM.GetName]把统一条约交到我们手上。接受将进行国家整合；我们也可以要求保留政府作为行政过渡、留在会议中，或拒绝这份草案。"
 sof_tp.2.d_REN:0 "雷恩的代表带来市镇、乡村和信仰团体的共同期待：新的法国应当尊重地方生活，让各地在共同制度中保有自己的声音。他们愿意讨论统一，并把这些保障写入正式条约。\n\n[FROM.GetName]邀请我们参加全国重建会议。出席将开启正式协商，我们保留独立政府与最终批准权；拒绝邀请时双方维持和平。"
 sof_tp.3.d_REN:0 "雷恩的代表带来市镇、乡村和信仰团体的共同期待：新的法国应当尊重地方生活，让各地在共同制度中保有自己的声音。他们愿意讨论统一，并把这些保障写入正式条约。\n\n如今[FROM.GetName]把统一条约交到我们手上。接受将进行国家整合；我们也可以保留自治、留在会议中，或拒绝这份草案。"
 sof_tp_leave_bloc_tt:0 "条件：独立且未投降的法国政权；和平、已在阵营、没有转阵营冷却。效果：退出现有阵营，信任−5；90日后可再次申请加入。"
 sof_tp_claim_victory_tt:0 "条件：20大区政权之一，第一阶段，为阵营领袖或未结盟；己方阵营拥有并完全控制至少200个法国州；与法国竞争者停战，法国盟友也不在对法战争中；不存在未承认我方、且整个联盟实控至少35州的外部法国政权。外国战争不阻止宣布。效果：进入第二阶段，正统性+20；各国最终整合仍须另行批准。"
 sof_tp_open_congress_tt:0 "须已建立外交机构（本国国策：[Root.GetSofTpOfficeFocus]；小国有基础外交），并已进入第二阶段，或完成会议国策“[Root.GetSofTpCongressFocus]”。独立未投降，与法国竞争者停战，尚未开会。开启本国会议，正统性+10；随后邀请代表，协商并批准整合。"
 sof_tp_adopt_federal_tt:0 "条件：已开会、独立未投降且和平，尚未选定章程，至少50政治点。花费50政治点，信任+15。与中央章程互斥。这是临时章程；之后完成“[Root.GetSofTpConstitutionFocus]”中对应方向的国策，将宪制常设化。"
 sof_tp_adopt_central_tt:0 "条件：已开会、独立未投降且和平，尚未选定章程，至少50政治点。花费50政治点，重建+15。与联邦章程互斥。这是临时章程；之后完成“[Root.GetSofTpConstitutionFocus]”中对应方向的国策，将宪制常设化。"
 sof_tp_fund_reconstruction_tt:0 "条件：已开会并选定章程，独立未投降且和平，重建尚未完成，不在拨款冷却中，至少75政治点。花费75政治点，重建+20；冷却45日。"
 sof_tp_keep_promises_tt:0 "条件：已开会并选定章程，独立未投降且和平，不在履约冷却中，至少50政治点。花费50政治点，信任+10、正统性+5、重建+5；冷却60日。巴黎完成“强化工会”后，每次另获正统性+3。"
 sof_tp_break_promises_tt:0 "条件：已开会并选定章程，独立未投降且和平，重建未完成，尚未收回让步。一次性获得重建+25，但信任−30、正统性−15、稳定度−10个百分点。"
 sof_tp_complete_reconstruction_tt:0 "条件：已开会并选定章程，独立未投降且和平；重建达到100，本国拥有并完全控制至少200个法国州，尚未结束重建。一次性获得100政治点、稳定度+5个百分点；信任至少70时再获得100政治点、稳定度+5个百分点。"
 sof_tp_request_membership_tt:0 "双方均已批准共同防御总纲后，向选定阵营提交加入申请。接纳由对方决定，外交关系、邻接与履约信誉影响其态度。"
 sof_tp_invite_congress_tt:0 "花费25政治点。主持国已开会且和平，无待回复交涉；对象是和平、独立、未投降的法国政权，尚未接受邀请且不在拒绝冷却中。参会后仍由接收方单独批准整合。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp_offer_union_tt:0 "首次提案花费50政治点，使用“条款”页已选报价。须已开会并有章程，目标参会、双方独立未投降且和平、与我方同阵营或未结盟，目标仅有完全控制的法国州，无在办协议、冷却或待回复交涉。对方可接受、行政反要约或拒绝；拒绝/反要约失败后90日再谈。接受只签执行协议，之后另付资源履约。交付后免费请求最终批准，只有最终同意才整合国家与军队、添加核心、我方正统性+10和信任+5；最终拒绝后180日再谈。大区政府先完成“[Root.GetSofTpOfficeFocus]”建立外交机构。"
 sof_tp_press_claim_tt:0 "对方须曾拒绝会议或统一提案，双方和平且对方不在施压冷却中；我方已开会并有75政治点。花费75政治点，信任−15、正统性−10；解除双方同盟关系并取得有效期180日的吞并战争目标。开战时机由本国决定。双方阵营须限于法国领土政权，且无外国保证独立，目标仅持有法国州；我方须具备地区扩张及统一战争授权（红色马赛另需军事授权国策）。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
