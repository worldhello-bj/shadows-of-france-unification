 sof_tp_selected_membership:0 "申请入盟"
 sof_tp_selected_membership_tt:0 "花费25政治点。双方须为和平、独立、未投降的法国政权；我方未结盟且无转阵营冷却或待回复交涉，对方为阵营领袖。加入须经对方同意。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp_selected_congress:0 "邀请参会"
 sof_tp_selected_congress_tt:0 "花费25政治点。主持国已开会且和平，无待回复交涉；对象是和平、独立、未投降的法国政权，尚未接受邀请且不在拒绝冷却中。参会后仍由接收方单独批准整合。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp_selected_union:0 "[Root.GetSofTpA3UnionLabel]"
 sof_tp_selected_union_tt:0 "首次提案花费50政治点，使用“条款”页已选报价。须已开会并有章程，目标参会、双方独立未投降且和平、与我方同阵营或未结盟，目标仅有完全控制的法国州，无在办协议、冷却或待回复交涉。对方可接受、行政反要约或拒绝；拒绝/反要约失败后90日再谈。接受只签执行协议，之后另付资源履约。交付后免费请求最终批准，只有最终同意才整合国家与军队、添加核心、我方正统性+10和信任+5；最终拒绝后180日再谈。大区政府先完成“[Root.GetSofTpOfficeFocus]”建立外交机构。"
 sof_tp_selected_claim:0 "强硬施压"
 sof_tp_selected_claim_tt:0 "对方须曾拒绝会议或统一提案，双方和平且对方不在施压冷却中；我方已开会并有75政治点。花费75政治点，信任−15、正统性−10；解除双方同盟关系并取得有效期180日的吞并战争目标。开战时机由本国决定。双方阵营须限于法国领土政权，且无外国保证独立，目标仅持有法国州；我方须具备地区扩张及统一战争授权（红色马赛另需军事授权国策）。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp_selected_settlement:0 "协商承认"
 sof_tp_selected_settlement_tt:0 "第一阶段，和平的20大区政权之一，阵营实控至少150个法国州，无待回复交涉，至少50政治点。目标须为和平、独立、未投降的其他法国政权，不同阵营、尚未承认我方且无承认冷却。花费50政治点；同意使其承认我方，并给予我方正统性+10、信任+5，不吞并或加入阵营；拒绝后180日才能再谈。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp_selected_aid:0 "执行协议"
 sof_tp_selected_aid_tt:0 "仅限选中政府与本国签订、尚未投入的有效协议，双方须独立未投降且和平。工业：75政治点/60日；过渡：40政治点/90日（对方立即获40政治点）；整训：50政治点+20陆军经验/45日。费用一次扣除，和平日推进，战争暂停。具体收益见“条款”页。签约后执行交付，再由接收方单独批准最终整合。"
 sof_tp_selected_challenge:0 "准备战争"
 sof_tp_selected_challenge_tt:0 "第一阶段；我方须独立未投降且和平，已获地区扩张及统一战争授权，马赛红色路线另须完成其军事授权国策；双方阵营须限于法国领土政权，且无外国保证独立。目标为和平的合法法国敌手，仅持有法国州，须相邻，或目标有实控海军基地且我方已完成海上准备。花费75政治点、信任−5，取得180日吞并战争目标；开战时机由本国决定。"
 sof_tp_selected_enforce:0 "执行宣战"
 sof_tp_selected_enforce_tt:0 "执行已有的吞并战争目标并立即宣战。双方阵营须限于法国领土政权，且无外国保证独立；我方须独立未投降且和平，已获地区扩张及统一战争授权，马赛红色路线须有军事国策授权；目标为和平的合法法国敌手、仅持有法国州，且满足相邻或海上准备条件。"
 sof_tp_popup_focus_state:0 "外交：[Root.GetSofTpOfficeStatus]\n会议：[Root.GetSofTpCongressStatus]\n常设宪制：[Root.GetSofTpConstitutionStatus]\n\n[Root.GetSofTpNextInstitutionFocus]"
 sof_tp_popup_focus_state_tt:0 "外交机构：[Root.GetSofTpOfficeFocus]\n会议机构：[Root.GetSofTpCongressFocus]\n宪制机构：[Root.GetSofTpConstitutionFocus]\n\n先完成本国对应国策建立机构，再在议事厅交涉。真实的结盟、统一条约、援助及重建成果又会改变后续国策的条件与回报。"
 sof_tp_map_LMG_tt:0 "[LMG.GetName]\n利摩日现有政权与地区态势；查看地区信息。"
 sof_tp_popup_map_legend_war:0 "颜色：政治阵营（悬停查看图例）"
 sof_tp_popup_map_legend_peace:0 "颜色：参会、援助与整合（悬停查看）"
 sof_tp_popup_map_legend_peace_tt:0 "灰：其他或未接洽；红：盟友；玫瑰：已兑现援助；蓝：参加本国会议；赭：待兑现援助；绿：本国或已整合地区。颜色按实际外交状态的优先级显示；支持率另行计算。"
 sof_tp_institution_office:0 "外交协调机构"
 sof_tp_institution_office_desc:0 "国策“[Root.GetSofTpOfficeFocus]”建立处理跨地区交涉的机构。完成后，议事厅中的定向外交才能由承诺变成正式提案。小国保留基础外交。"
 sof_tp_institution_congress:0 "全国会议机构"
 sof_tp_institution_congress_desc:0 "国策“[Root.GetSofTpCongressFocus]”为提前召开全国会议提供机构基础。筹备者可以凭本国规模，也可以凭已签订同盟的共同规模获得开会条件。"
 sof_tp_institution_constitution:0 "宪制协调机构"
 sof_tp_institution_constitution_desc:0 "国策“[Root.GetSofTpConstitutionFocus]”将联邦或中央宪制常设化。此前可以先在议事厅花费50政治点选择临时章程；后续国策沿已选方向推进。实际统一条约也可替代常设宪制国策的100州条件。"
