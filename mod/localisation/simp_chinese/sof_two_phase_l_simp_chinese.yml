 sof_tp_seek_settlement:0 "与[FROM.GetName]协商全国承认"
 sof_tp_seek_settlement_desc:0 "要求竞争者承认我们的全国协调地位，不必要求他们在同一天交出政府。承认可以为政治角逐画上句号，日后的统一条件仍可继续谈判。"
 sof_tp_seek_settlement_tt:0 "第一阶段，和平的20大区政权之一，阵营实控至少150个法国州，无待回复交涉，至少50政治点。目标须为和平、独立、未投降的其他法国政权，不同阵营、尚未承认我方且无承认冷却。花费50政治点；同意使其承认我方，并给予我方正统性+10、信任+5，不吞并或加入阵营；拒绝后180日才能再谈。\n大区政府须先完成“[Root.GetSofTpOfficeFocus]”建立外交机构；小国保留基础外交。"
 sof_tp.9.t:0 "共同承认，开启协商"
 sof_tp.9.d:0 "[FROM.GetName]提出了一条结束全国政治角逐的道路：承认它的全国协调地位，保留我们现有的政府，再到会议桌上讨论统一。\n\n强硬派担心，这会让对方把尚未解决的分歧写成自己的胜利。让谈判取代围城，以协商解决接下来的分歧。决定仍在我们手中。"
 sof_tp.9.a:0 "承认协调地位，保留我们的声音。"
 sof_tp.9.b:0 "他们还不足以代表法国。"
 sof_tp_form_bloc:0 "另立共同协约"
 sof_tp_form_bloc_desc:0 "我们将提出自己的国家方案，争取法国的支持。以新的协约邀请邻国，交由各国决定是否加入。"
 sof_tp_form_bloc_tt:0 "完成外交路线末端的共同防御总纲后，花费50政治点建立阵营。须独立、未投降、处于和平且尚未结盟，并已取得地区扩张权限；换盟冷却为90日。同意识形态伙伴将通过各自的外交程序协商加入。"
 sof_tp_fulfil_aid:0 "投入协议资源"
 sof_tp_fulfil_aid_desc:0 "按已经签订的条款投入一次性资源，开始实际工作。合作有明确期限，战争时暂停，完成后仍需接收方单独批准统一。"
 sof_tp_fulfil_aid_tt:0 "仅限选中政府与本国签订、尚未投入的有效协议，双方须独立未投降且和平。工业：75政治点/60日；过渡：40政治点/90日（对方立即获40政治点）；整训：50政治点+20陆军经验/45日。费用一次扣除，和平日推进，战争暂停。具体收益见“条款”页。签约后执行交付，再由接收方单独批准最终整合。"
 sof_tp.10.t:0 "到了日期，却没有工场"
 sof_tp.10.d:0 "地方代表带着当初留下的文件再次到来。纸上约定的日期已经过去，答应的建设援助却没有兑现。对他们而言，这不仅是一座工厂的缺席，也关乎为什么还应相信下一张盖着中央印章的纸。\n\n工作人员提出了各种困难。下一轮谈判需要以履约重建信用。"
 sof_tp.10.a:0 "失信的代价已经记下。"
 sof_tp_challenge_rival:0 "挑战[FROM.GetName]的全国主张"
 sof_tp_challenge_rival_desc:0 "为结束全国政治对立，投入资源准备军事方案，同时保留承认与合作的外交选择。取得战争目标后，由政府另行决定是否宣战。"
 sof_tp_enforce_claim:0 "以武力执行对[FROM.GetName]的要求"
 sof_tp_enforce_claim_desc:0 "参谋部等待最后的命令。作出这一决定，部队将执行已经准备好的战争目标。谈判桌上的分歧将变成真正的战场代价。"
 sof_tp_industrial_aid_bonus:0 "协约工业技术援助"
 sof_tp_challenge_rival_tt:0 "第一阶段；我方须独立未投降且和平，已获地区扩张及统一战争授权，马赛红色路线另须完成其军事授权国策；双方阵营须限于法国领土政权，且无外国保证独立。目标为和平的合法法国敌手，仅持有法国州，须相邻，或目标有实控海军基地且我方已完成海上准备。花费75政治点、信任−5，取得180日吞并战争目标；开战时机由本国决定。"
 sof_tp_enforce_claim_tt:0 "执行已有的吞并战争目标并立即宣战。双方阵营须限于法国领土政权，且无外国保证独立；我方须独立未投降且和平，已获地区扩张及统一战争授权，马赛红色路线须有军事国策授权；目标为和平的合法法国敌手、仅持有法国州，且满足相邻或海上准备条件。"
