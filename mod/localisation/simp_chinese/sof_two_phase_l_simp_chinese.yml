 sof_tp_choose_industry_terms_tt:0 "选择此报价不收费、不发案，也不更改已签协议。接收方签署后保留最终批准权，交付完成后再决定是否整合。执行方一次投入75政治点，60个和平日后在接收方实控、有空位的法国州建1民厂；无空位则一次工业科技25%加成，每个接收国工业交付奖励限一次。交付双方信任+10、执行方正统性+5；里尔劳资协调局另+5信任，波尔多港务信用署另+10重建。合同总期限180个和平日。"
 sof_tp_choose_transition_terms_tt:0 "选择此报价不收费、不发案，也不更改已签协议。接收方签署后保留最终批准权，交付完成后再决定是否整合。执行方一次付40政治点，立即转交接收方40政治点；经过90个和平日行政过渡后，双方信任+8。接收方保留独立政府与现有组织。合同总期限180个和平日；投入与交付分别发生，最终整合须在批准窗口内另行批准。"
 sof_tp_choose_army_terms_tt:0 "选择此报价不收费、不发案，也不更改已签协议。接收方签署后保留最终批准权，交付完成后再决定是否整合。执行方一次付50政治点和20陆军经验，45个和平日后接收方获10陆军经验，以及180日联合参谋精神：陆军组织度+10%、陆军训练时间−15%、计划速度+20%；执行方正统性+5。条款提供军务协调支持，双方现有部队、装备和将领保持原有归属与编制。合同总期限120个和平日。"
 sof_tp_end_contract_tt:0 "接收方可终止自己签署的在办协议。双方信任各−5，协议槽释放并进入60日冷却；已经投入的政治点或陆军经验不退，已经交付的成果不撤回。终止仅结算本项协议，维持双方既有外交关系与独立地位，其他政府的协议继续有效。"
 sof_tp_a3_final_approval_tt:0 "合同已交付且仍有效，双方和平、独立、未投降；接收方仍参加本国会议，拥有的全部州均为完全控制的法国州，且未结盟或与我方同盟；我方已开会并有章程，无待回复交涉。免费提出最终批准，不重新收取50政治点。只有对方最终同意才整合国家、转交军队并添加核心；拒绝保持独立。"
 sof_tp_a3_cost_final:0 "免费 · 须再批准"
 sof_tp_a3_cost_aid:0 "[Root.GetSofTpA3AidCost]"
 sof_tp_start_transport_project_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付60政治点、临时占用1000人力，45个和平日后该州基建+1、交付10列火车与100辆卡车、返还1000人力，本国重建+15、正统性+5。目标基建须低于5级，此类项目每州一次。战争暂停，失去项目州则中断。"
 sof_tp_a3_project_transport_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付60政治点、临时占用1000人力，45个和平日后该州基建+1、交付10列火车与100辆卡车、返还1000人力，本国重建+15、正统性+5。目标基建须低于5级，此类项目每州一次。战争暂停，失去项目州则中断。"
 sof_tp_start_industry_project_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付100政治点、临时占用1500人力，60个和平日后该州建1民厂、交付150件支援装备、返还1500人力，本国重建+20、正统性+5。目标须有民厂空位，此类项目每州一次。战争暂停；失去项目州或完工时无合格空位则中断结算。"
 sof_tp_a3_project_industry_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付100政治点、临时占用1500人力，60个和平日后该州建1民厂、交付150件支援装备、返还1500人力，本国重建+20、正统性+5。目标须有民厂空位，此类项目每州一次。战争暂停；失去项目州或完工时无合格空位则中断结算。"
 sof_tp_start_demobilisation_project_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付50政治点、投入1500人力，30个和平日后稳定度+5个百分点、战争支持度−2个百分点、重建+12，并获180日基建施工速度+25%、民厂施工速度+15%、生活消费品工厂系数−5%精神。完工后1500人力不返还，代表转入民用劳务；现有部队编制保留。此类项目每州一次，战争暂停。"
 sof_tp_a3_project_demobilisation_tt:0 "本国须已开会并选定章程，独立未投降且和平，同时只能执行一个项目。地点从符合条件的本国实控法国州中自动选定。一次付50政治点、投入1500人力，30个和平日后稳定度+5个百分点、战争支持度−2个百分点、重建+12，并获180日基建施工速度+25%、民厂施工速度+15%、生活消费品工厂系数−5%精神。完工后1500人力不返还，代表转入民用劳务；现有部队编制保留。此类项目每州一次，战争暂停。"
 sof_tp_cancel_project_tt:0 "取消本国当前项目：返还全部占用人力及一半政治点（运输30、工业50、退伍25）。完工奖励在项目完成时结算。失去项目地点导致自动中断时使用同样结算。投降中断同样结算；国家已经灭亡时只清空项目，不向征服者返还资源。"
 sof_tp_joint_staff:0 "联合参谋与训练班"
 sof_tp_joint_staff_desc:0 "以共同操典和参谋联络改善训练与指挥协作。限期合作期间，双方各自管理现有师、装备和将领。"
 sof_tp_demobilised_workforce:0 "退伍建设劳务队"
 sof_tp_demobilised_workforce_desc:0 "原有征募人力转入民用建设，提高基础设施施工效率。"
 sof_tp_contract_details_industry:0 "执行方投入75政治点；60个和平日后，我方得到1座民厂，无空位则一次工业科技25%加成（工业交付每个接收国限一次）。双方信任+10，执行方正统性+5。总期限180个和平日。"
 sof_tp_contract_details_transition:0 "执行方付40政治点，我方立即收到40政治点；90个和平日后双方信任+8。我方保留独立政府，最终整合须另行批准。总期限180个和平日。"
 sof_tp_contract_details_army:0 "执行方投入50政治点与20陆军经验；45个和平日后，我方获得10陆军经验及180日陆军组织度+10%、训练时间−15%、计划速度+20%精神，执行方正统性+5。不转交师、装备或将领。总期限120个和平日。"
 sof_tp_contract_accept_tt:0 "签约不立即收取执行费、不吞并；发起方稍后投入资源。未交付到期：发起方信任−15、正统性−10，接收方信任−10。接收方主动退出：双方信任各−5；发起方主动退出：自身信任−10、正统性−5，接收方信任−5。已付不退。交付后保留援助成果；最终拒绝后180日可再谈。"
 sof_tp_end_selected_contract:0 "终止所选协议"
 sof_tp_end_selected_contract_tt:0 "只能终止涉及本国的在办协议。若本国是发起方、选中接收地区：我方信任−10、正统性−5，对方信任−5；若选中本国作为接收方：双方信任各−5。释放接收方协议槽并冷却60日。已付政治点与陆军经验不退，已交付成果保留，双方既有外交关系与独立地位维持不变。"
