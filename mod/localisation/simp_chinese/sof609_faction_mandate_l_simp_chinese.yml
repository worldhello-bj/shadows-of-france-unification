l_simp_chinese:
 sof609_faction_mandate_required_tt:0 "完成外交路线末端的“批准共同防御总纲”国策。"
 sof609_faction_unlocked_tt:0 "解锁组建和加入阵营。各国分别批准外交总纲，再通过外交邀请或阵营会议协商加入。"
 SOF609_GENERIC_embassies:0 "建立常驻外交联络"
 SOF609_GENERIC_treaties:0 "议定互助与防卫条款"
 SOF609_GENERIC_ratify:0 "批准共同防御总纲"
 SOF609_GENERIC_embassies_desc:0 "设立常驻联络处，整理边界、交通和贸易议题，为稳定的对外关系建立日常工作渠道。"
 SOF609_GENERIC_treaties_desc:0 "明确成员权利、共同防卫义务和争端解决程序，让互助条约拥有可以执行的条款。"
 SOF609_GENERIC_ratify_desc:0 "由地方代表正式批准外交总纲。政府由此取得缔结军事同盟的授权，并可通过外交谈判组建或加入阵营。"
 SOF609_PRS_diplomatic_ratification:0 "批准巴黎共同防御总纲"
 SOF609_PRS_diplomatic_ratification_desc:0 "《重建法兰西国家中枢》 · 全国统一战线\n\n巴黎仍承载着国家法统、行政机构和科研网络。分裂使这些资源沦为一座孤立城市的遗产；我们的使命是以它们重建能够统筹全法国的中央政府。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_AJC_diplomatic_ratification:0 "批准科西嘉共同防御总纲"
 SOF609_AJC_diplomatic_ratification_desc:0 "《从科西嘉重塑法兰西》 · 全国统一战线\n\n科西嘉的未来取决于海峡彼岸的法国。岛屿工业、港口和远征军必须共同支撑一场跨海统一事业，使地中海成为新国家的战略入口。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_REN_diplomatic_ratification:0 "批准布列塔尼共同防御总纲"
 SOF609_REN_diplomatic_ratification_desc:0 "《西部共和国的全国使命》 · 全国统一战线\n\n布列塔尼的议会传统与大西洋船厂可以共同支撑一种新的国家方案：以获得授权的军队结束割据，以公共契约把各地纳入统一法国。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_MRS_diplomatic_ratification:0 "批准地中海共同防御总纲"
 SOF609_MRS_diplomatic_ratification_desc:0 "《地中海共和国的全国使命》 · 全国统一战线\n\n马赛的港口、普罗旺斯的原料与南方社会力量，应当服务于一个面向全国的国家方案。我们的目标是从地中海门户出发结束割据，并把南方纳入国家重建。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_LIL_diplomatic_ratification:0 "批准北方共同防御总纲"
 SOF609_LIL_diplomatic_ratification_desc:0 "《以北方工业重铸法国》 · 全国统一战线\n\n北方煤钢与制造业不能长期困守分裂的市场。把工业、劳工与重装部队组织起来，才能使北方成为统一法国的工业力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_MET_diplomatic_ratification:0 "批准洛林共同防御总纲"
 SOF609_MET_diplomatic_ratification_desc:0 "《以东部国防重铸法国》 · 全国统一战线\n\n洛林不能永远以边境堡垒的身份守望分裂法国。冶金工业与防务体系要支撑统一军队，使东部国防力量成为重建国家秩序的力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_STR_diplomatic_ratification:0 "批准阿尔萨斯共同防御总纲"
 SOF609_STR_diplomatic_ratification_desc:0 "《以共同国家契约统一法国》 · 全国统一战线\n\n阿尔萨斯的经验能够回答统一国家的核心问题：如何在共同权威之下保有地区制度与语言。莱茵工业与防务将支撑统一事业，公共契约则决定建国后的共同秩序。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_ROU_diplomatic_ratification:0 "批准诺曼底共同防御总纲"
 SOF609_ROU_diplomatic_ratification_desc:0 "《以海峡门户重建法国》 · 全国统一战线\n\n诺曼底的海峡港口和工业腹地，应当成为法国统一与复兴的海陆门户。将港航、军工和联合作战纳入国家规划，才能重新掌握战略主动。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_LYO_diplomatic_ratification:0 "批准罗讷共同防御总纲"
 SOF609_LYO_diplomatic_ratification_desc:0 "《以工业共和国重塑法国》 · 全国统一战线\n\n里昂与罗讷—阿尔卑斯的工业、能源和科研能力，足以支持一个面向全国的现代化国家方案。机械化军队与战略工业应当共同结束割据。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_BRD_diplomatic_ratification:0 "批准吉伦特共同防御总纲"
 SOF609_BRD_diplomatic_ratification_desc:0 "《大西洋共和国的全国雄心》 · 全国统一战线\n\n阿基坦的商贸、信用与大西洋航路需要一个完整的国内市场。我们必须把这些资源用于统一战争的财政与生产，再以国家制度重开法国的对外通道。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_TOU_diplomatic_ratification:0 "批准西南共同防御总纲"
 SOF609_TOU_diplomatic_ratification_desc:0 "《以航空力量重塑法国》 · 全国统一战线\n\n图卢兹与西南的航空、军械和工程能力，应当成为法国的国家战略产业。空地联合力量将支撑统一战争，工业体系则决定新国家在战后能否恢复现代化。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_NAN_diplomatic_ratification:0 "批准卢瓦尔河口共同防御总纲"
 SOF609_NAN_diplomatic_ratification_desc:0 "《以大西洋海权统一法国》 · 全国统一战线\n\n卢瓦尔河地区的船厂、港口与工业腹地，是未来法国海权的基础。国家造舰与海运计划将支撑沿海统一战线，并在建国后重新打开法国的海洋道路。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_CFR_diplomatic_ratification:0 "批准奥弗涅共同防御总纲"
 SOF609_CFR_diplomatic_ratification_desc:0 "《从中央高原重建法国》 · 全国统一战线\n\n中央高原应当成为统一事业的战略后方。工业、储备与山地交通为长期战争提供纵深，让我们的军队有能力从高原走向全法国。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_DIJ_diplomatic_ratification:0 "批准勃艮第共同防御总纲"
 SOF609_DIJ_diplomatic_ratification_desc:0 "《从勃艮第连结法兰西》 · 全国统一战线\n\n勃艮第连接着法国的工业地区与主要交通走廊。我们的统一事业必须以冶金、军需与运输的协同为支点，重新连接分裂的国家。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_BES_diplomatic_ratification:0 "批准弗朗什孔泰共同防御总纲"
 SOF609_BES_diplomatic_ratification_desc:0 "《以东部工业重整法兰西》 · 全国统一战线\n\n弗朗什孔泰的精密制造与山地纵深可以支撑长期统一战争。通过军工标准、训练与补给，把东部工业能力转化为新法国的国家力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_TRS_diplomatic_ratification:0 "批准卢瓦尔中部共同防御总纲"
 SOF609_TRS_diplomatic_ratification_desc:0 "《重掌法兰西的交通命脉》 · 全国统一战线\n\n中央大区掌握着连接法国各地的铁路与军械节点。恢复交通命脉、组织国家后勤与预备力量，才能为统一事业提供持续推进的基础。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_AMI_diplomatic_ratification:0 "批准皮卡第共同防御总纲"
 SOF609_AMI_diplomatic_ratification_desc:0 "《重开通向法国的北方门户》 · 全国统一战线\n\n皮卡第处在北方工业与国家中枢之间。控制交通与补给，建立能够持续作战的机动军，就能把地理通道转化为连接整个法国的统一力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_CHL_diplomatic_ratification:0 "批准香槟共同防御总纲"
 SOF609_CHL_diplomatic_ratification_desc:0 "《以东部军势整编法国》 · 全国统一战线\n\n香槟平原与阿登交通决定着东部战线的进退。把军需、训练与预备队纳入一个国家计划，才能把地区军势转化为统一法国的野战力量。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_MOP_diplomatic_ratification:0 "批准朗格多克共同防御总纲"
 SOF609_MOP_diplomatic_ratification_desc:0 "《南方共和国的国家使命》 · 全国统一战线\n\n朗格多克的生产、农业与地中海交通，需要突破地区边界形成国家规模的供给体系。我们将以此支撑南方军队，参与决定统一法国的政治未来。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"
 SOF609_POI_diplomatic_ratification:0 "批准普瓦图共同防御总纲"
 SOF609_POI_diplomatic_ratification_desc:0 "《西部军工的全国使命》 · 全国统一战线\n\n普瓦图—夏朗德的军械制造与沿海交通能够连接西部诸地。以军工和运输支撑机动统一军，使西部在新国家中拥有战略工业的地位。争取其他地区加入共同的国家方案，以协作和共同防务积累统一事业的政治基础。"