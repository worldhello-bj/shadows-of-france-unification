l_simp_chinese:
 sof_region_TRS_1936_assembly:0 "卢瓦尔共同事务会议"
 sof_region_TRS_1936_assembly_desc:0 "卢瓦尔两岸的市镇保存着各自的档案、习惯与承诺，穿过它们的列车却需要一张共同的时刻表。图尔的会议必须让地方自主与共同事务同时找到位置。"
 sof_region_TRS_1936_civic_rolls:0 "校核行政与税收名册"
 sof_region_TRS_1936_civic_rolls_desc:0 "不同市镇的档案、债务和人员名册先行校核，不以统一口号掩盖事实差异。"
 sof_region_TRS_1936_rail_authority:0 "谁来签发调度命令"
 sof_region_TRS_1936_rail_authority_desc:0 "铁路跨越市镇边界，必须明确地方财政与紧急运输的指挥权限。"
 sof_region_TRS_1936_local_charters:0 "保障市镇行政章程"
 sof_region_TRS_1936_local_charters_desc:0 "市镇的授权来自居民，不能因为一列军需车的迟到就永久收回。保留地方章程，让跨区合作建立在公开的协商和可兑现的承诺之上。"
 sof_region_TRS_1936_local_charters_network:0 "保障市镇行政章程：地方体系"
 sof_region_TRS_1936_central_dispatch:0 "集中紧急运输授权"
 sof_region_TRS_1936_central_dispatch_desc:0 "当每座车站都等待另一封批复，整条线路就会一起停下。集中紧急调度授权，让命令能够及时抵达；我们也必须明确何时归还这份权力。"
 sof_region_TRS_1936_central_dispatch_network:0 "集中紧急运输授权：地方体系"
 sof_region_TRS_1936_council_records:0 "公开联席会议记录"
 sof_region_TRS_1936_council_records_desc:0 "把市镇间的预算协商公开，代表可以不同意却不能隐藏承诺。"
 sof_region_TRS_1936_emergency_review:0 "紧急命令复核"
 sof_region_TRS_1936_emergency_review_desc:0 "核查特殊运输命令的资金来源，避免把每项采购都列成无限紧急任务。"
 sof_region_TRS_1936_statute:0 "中部公共事务章程"
 sof_region_TRS_1936_statute_desc:0 "各项授权均接受公共审计，由地方程序确定党派与施政方向。"
 sof_region_TRS_1936_archives:0 "图尔档案与行政学校"
 sof_region_TRS_1936_archives_desc:0 "发挥地方行政传统，培养文书与档案人员，为跨市镇治理储备人才。"
 sof_region_TRS_1936_heritage:0 "地方文化的公共预算"
 sof_region_TRS_1936_heritage_desc:0 "让公共教育与文物维护获得可审计份额，国防需求不能吞掉全部公共生活。"
 sof_region_TRS_1936_tours_station:0 "图尔的两网交接"
 sof_region_TRS_1936_tours_station_desc:0 "协调巴黎奥尔良铁路与国有铁路在图尔的车站业务，按1936年的公司体系安排运输。"
 sof_region_TRS_1936_rail_survey:0 "编组与机务调查"
 sof_region_TRS_1936_rail_survey_desc:0 "以图尔为铁路联络中心，核对车辆、维修时间与货单，协调圣皮埃尔德科尔方向的周转。"
 sof_region_TRS_1936_maintenance:0 "机务维修时段"
 sof_region_TRS_1936_maintenance_desc:0 "将维修时段写进班表，不能靠永不停机掩盖车辆损耗。"
 sof_region_TRS_1936_maintenance_local:0 "机务维修时段"
 sof_region_TRS_1936_waybills:0 "统一地区货运凭证"
 sof_region_TRS_1936_waybills_desc:0 "统一运输凭证，减少交接冲突，各铁路公司的产权安排维持现状。"
 sof_region_TRS_1936_passenger_slots:0 "保留民用客运时段"
 sof_region_TRS_1936_passenger_slots_desc:0 "学校、市场、亲人和工作同样需要列车。保留民用时段，让国防成为社会生活能够继续的保障，让日常生活与国防准备一同向前。"
 sof_region_TRS_1936_passenger_slots_local:0 "保留民用客运时段"
 sof_region_TRS_1936_military_slots:0 "军需列车优先表"
 sof_region_TRS_1936_military_slots_desc:0 "军需列车不能在最需要它们的时候还排在货场外。我们将给部队一张优先时刻表，用有限的车辆建立可靠的调动能力，并承担民用交通被压缩的代价。"
 sof_region_TRS_1936_rolling_stock:0 "周转车辆共用簿"
 sof_region_TRS_1936_rolling_stock_desc:0 "选择优先顺序后仍需记录所有车辆，不能把同一节车皮同时分配两处。"
 sof_region_TRS_1936_rolling_stock_local:0 "周转车辆共用簿"
 sof_region_TRS_1936_orleans:0 "奥尔良桥梁与粮运"
 sof_region_TRS_1936_orleans_desc:0 "奥尔良是201州，图尔是225州；必须控制奥尔良才有这条支线。"
 sof_region_TRS_1936_bridge_reports:0 "桥梁载荷与维修表"
 sof_region_TRS_1936_bridge_reports_desc:0 "检查和维修现有桥梁，按实际桥位安排工程与交通保障。"
 sof_region_TRS_1936_bridge_reports_local:0 "桥梁载荷与维修表"
 sof_region_TRS_1936_grain_sidings:0 "粮车接卸与仓储"
 sof_region_TRS_1936_grain_sidings_desc:0 "把粮运从军械调度中分出时段，扩大吞吐要有明确地方受益点。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TRS_1936_loire_timetable:0 "卢瓦尔联合时刻表"
 sof_region_TRS_1936_loire_timetable_desc:0 "图尔与奥尔良同时受控后连接两地调度，不能只靠首都控制领取全线收益。"
 sof_region_TRS_1936_workshop_orders:0 "机务检修长期订单"
 sof_region_TRS_1936_workshop_orders_desc:0 "在图尔州扩充民用修理与备件能力。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TRS_1936_bourges:0 "布尔日炮械档案"
 sof_region_TRS_1936_bourges_desc:0 "1860年以来的炮械、火工与后续试验传统支持本地专业能力；不用后来的EFAB或Nexter名称。"
 sof_region_TRS_1936_proof_ranges:0 "炮械试验与安全规程"
 sof_region_TRS_1936_proof_ranges_desc:0 "建立试验安全程序和验收记录，让技术委员会提供可靠的质量依据。"
 sof_region_TRS_1936_proof_bonus:0 "炮械试验与安全规程：技术积累"
 sof_region_TRS_1936_pyrotechnics:0 "火工品分库管理"
 sof_region_TRS_1936_pyrotechnics_desc:0 "分离危险品、生活设施与普通仓储，军事后方必须先考虑事故风险。"
 sof_region_TRS_1936_pyrotechnics_local:0 "火工品分库管理"
 sof_region_TRS_1936_proof_priority:0 "优先试验与返修"
 sof_region_TRS_1936_proof_priority_desc:0 "布尔日的价值不仅在于制造了多少门炮，也在于知道哪一门炮值得送上前线。把熟练人员留给试验和返修，中央地区将成为整个军械体系可以信赖的检验者。"
 sof_region_TRS_1936_deep_proof_bonus:0 "优先试验与返修：技术积累"
 sof_region_TRS_1936_serial_priority:0 "优先序列生产准备"
 sof_region_TRS_1936_serial_priority_desc:0 "以较少试验余裕换取早期批次准备，必须承认质量监督成本。"
 sof_region_TRS_1936_serial_priority_local:0 "优先序列生产准备"
 sof_region_TRS_1936_inspection_mission:0 "炮械验收代表团"
 sof_region_TRS_1936_inspection_mission_desc:0 "向伙伴分享验收规程与技术知识，按双方同意的范围开展协作。"
 sof_region_TRS_1936_inspection_bonus:0 "炮械验收代表团：技术积累"
 sof_region_TRS_1936_arsenal_capacity:0 "有条件的兵工扩容"
 sof_region_TRS_1936_arsenal_capacity_desc:0 "在布尔日扩充炮械设施，按当地建筑槽位安排施工。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TRS_1936_quality_register:0 "试验与批次合并登记"
 sof_region_TRS_1936_quality_register_desc:0 "不论产业取向，都必须记录每批次的返修和事故信息。"
 sof_region_TRS_1936_rear_depots:0 "中部后方仓储规划"
 sof_region_TRS_1936_rear_depots_desc:0 "利用纵深分散仓储，并为后方设施安排空袭防护与应急维修。"
 sof_region_TRS_1936_rear_depots_local:0 "中部后方仓储规划"
 sof_region_TRS_1936_arsenal_rail:0 "布尔日炮械铁路交接"
 sof_region_TRS_1936_arsenal_rail_desc:0 "炮械试验、后方仓储与铁路调度全部具备后才形成可用链条。"
 sof_region_TRS_1936_territorials:0 "中央各县后备名册"
 sof_region_TRS_1936_territorials_desc:0 "以地方后备人员为训练基础，按装备与补给能力逐步完善部队。"
 sof_region_TRS_1936_river_engineers:0 "卢瓦尔桥头工兵"
 sof_region_TRS_1936_river_engineers_desc:0 "训练桥梁守护、维修与交通疏导，将河流通道纳入协同防御。"
 sof_region_TRS_1936_engineers_bonus:0 "卢瓦尔桥头工兵：技术积累"
 sof_region_TRS_1936_reserve_columns:0 "纵深机动预备队"
 sof_region_TRS_1936_reserve_columns_desc:0 "把部分兵力留在纵深，避免每个城镇都要求固定驻军。完成后开放既有边境统一战争目标决议，由玩家决定是否发动战争。"
 sof_region_TRS_1936_bridge_guard:0 "市镇桥梁警备"
 sof_region_TRS_1936_bridge_guard_desc:0 "地方熟悉地形的人负责桥梁警备，现代加固仍需实物投资。"
 sof_region_TRS_1936_bridge_guard_local:0 "市镇桥梁警备"
 sof_region_TRS_1936_field_signals:0 "铁路与野战通信"
 sof_region_TRS_1936_field_signals_desc:0 "通信人员既懂列车调度又懂野战程序，避免两套命令相互冲突。"
 sof_region_TRS_1936_signal_bonus:0 "铁路与野战通信：技术积累"
 sof_region_TRS_1936_rear_hospitals:0 "疏散与后方医院清单"
 sof_region_TRS_1936_rear_hospitals_desc:0 "规划疏散和救护，不以未来战败为已经发生的历史。"
 sof_region_TRS_1936_hospital_bonus:0 "疏散与后方医院清单：技术积累"
 sof_region_TRS_1936_redoubt:0 "中央纵深防御演习"
 sof_region_TRS_1936_redoubt_desc:0 "河流、车站与后方仓库共同构成纵深防线。让预备队、工兵和通信人员共同演练，中部的纵深就能成为有组织的回旋空间。"
 sof_region_TRS_1936_redoubt_network:0 "中央纵深防御演习：地方体系"
 sof_region_TRS_1936_supply_evacuation:0 "仓库搬迁与民用疏散"
 sof_region_TRS_1936_supply_evacuation_desc:0 "把军需撤运和居民疏散纳入同一计划，不能重复计算同一辆运输车。"
 sof_region_TRS_1936_popular_air:0 "图兰大众航空班"
 sof_region_TRS_1936_popular_air_desc:0 "Air Touraine的大众航空部分始于1936年10月，必须到秋季以后才能启动。"
 sof_region_TRS_1936_air_mechanics:0 "教练机地勤学徒"
 sof_region_TRS_1936_air_mechanics_desc:0 "培训民间和基础航空的地勤，地方俱乐部不会立即成为精锐作战联队。"
 sof_region_TRS_1936_trainer_airfields:0 "训练场与维修分配"
 sof_region_TRS_1936_trainer_airfields_desc:0 "增加有限航空训练基础设施，与民用财政保持独立账目。\n新增设施须有可用建筑槽位或低于设施上限。"
 sof_region_TRS_1936_observation:0 "中央交通空中观察"
 sof_region_TRS_1936_observation_desc:0 "将基础飞行训练用于交通观察与联络，不送后期战斗机型号。"
 sof_region_TRS_1936_deols:0 "沙托鲁的新航空投资案"
 sof_region_TRS_1936_deols_desc:0 "1937年后，投资德奥尔航空建设，按当地工场与运输条件推进工程。"
 sof_region_TRS_1936_deols_local:0 "沙托鲁的新航空投资案"
 sof_region_TRS_1936_scholars:0 "铁路统计与公共教育"
 sof_region_TRS_1936_scholars_desc:0 "文化行政资源服务于公开统计与教育，不只给首都添加面板科研奖励。"
 sof_region_TRS_1936_archives_compact:0 "地方档案互认规则"
 sof_region_TRS_1936_archives_compact_desc:0 "制定地方档案互认规则，在各市镇同意后推进共同治理。"
 sof_region_TRS_1936_poitou_offer:0 "普瓦图铁路交接提案"
 sof_region_TRS_1936_poitou_offer_desc:0 "向普瓦捷提议粮运与军械交接，拒绝会阻断对应合同。"
 sof_region_TRS_1936_poitou_offer_accord_TRS:0 "普瓦图铁路交接提案：双边履约"
 sof_region_TRS_1936_poitou_offer_accord_POI:0 "普瓦图铁路交接提案：双边履约"
 sof_region_TRS_1936_poitou_offer_accepted_notice:0 "普瓦图铁路交接提案：已获同意"
 sof_region_TRS_1936_poitou_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TRS_1936_poitou_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TRS_1936_poitou_offer_declined_notice:0 "普瓦图铁路交接提案：遭到拒绝"
 sof_region_TRS_1936_poitou_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_TRS_1936_poitou_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_TRS_1936_poitou_offer_event:0 "普瓦图铁路交接提案"
 sof_region_TRS_1936_poitou_offer_event_desc:0 "向普瓦捷提议粮运与军械交接，拒绝会阻断对应合同。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_TRS_1936_poitou_offer_yes:0 "接受对等磋商"
 sof_region_TRS_1936_poitou_offer_no:0 "拒绝本次提案"
 sof_region_TRS_1936_accepted_rail:0 "履行普瓦图交接约定"
 sof_region_TRS_1936_accepted_rail_desc:0 "双方同意后培训本地交接人员，不免费获得拉罗谢尔港或沙泰勒罗工厂。"
 sof_region_TRS_1936_paris_offer:0 "向巴黎询问行政互认"
 sof_region_TRS_1936_paris_offer_desc:0 "向巴黎提议档案与行政资格互认，对方仍保留独立政治选择。"
 sof_region_TRS_1936_paris_offer_accord_TRS:0 "向巴黎询问行政互认：双边履约"
 sof_region_TRS_1936_paris_offer_accord_PRS:0 "向巴黎询问行政互认：双边履约"
 sof_region_TRS_1936_paris_offer_accepted_notice:0 "向巴黎询问行政互认：已获同意"
 sof_region_TRS_1936_paris_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TRS_1936_paris_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TRS_1936_paris_offer_declined_notice:0 "向巴黎询问行政互认：遭到拒绝"
 sof_region_TRS_1936_paris_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
 sof_region_TRS_1936_paris_offer_declined_notice_ok:0 "记录这一答复"
 sof_region_TRS_1936_paris_offer_event:0 "向巴黎询问行政互认"
 sof_region_TRS_1936_paris_offer_event_desc:0 "向巴黎提议档案与行政资格互认，对方仍保留独立政治选择。双方可以独立决定接受或拒绝。接受后双方各自在实际控制的中心获得两年履约支持；不移交领土或加入阵营。"
 sof_region_TRS_1936_paris_offer_yes:0 "接受对等磋商"
 sof_region_TRS_1936_paris_offer_no:0 "拒绝本次提案"
 sof_region_TRS_1936_accepted_admin:0 "履行行政档案互认"
 sof_region_TRS_1936_accepted_admin_desc:0 "巴黎接受后交换行政规则，双方各自保留现有机构与研究能力。"
 sof_region_TRS_1936_toulouse_offer:0 "邀请塔布验收对照"
 sof_region_TRS_1936_toulouse_offer_desc:0 "向图卢兹邀请炮械验收对照，技术协商不能强制对方接受军需。"
 sof_region_TRS_1936_toulouse_offer_accord_TRS:0 "邀请塔布验收对照：双边履约"
 sof_region_TRS_1936_toulouse_offer_accord_TOU:0 "邀请塔布验收对照：双边履约"
 sof_region_TRS_1936_toulouse_offer_accepted_notice:0 "邀请塔布验收对照：已获同意"
 sof_region_TRS_1936_toulouse_offer_accepted_notice_desc:0 "双方已签署合作安排，将在各自实际控制的中心获得两年履约支持。两国继续独立管理领土与外交，以具体成果巩固合作。"
 sof_region_TRS_1936_toulouse_offer_accepted_notice_ok:0 "记录这一答复"
 sof_region_TRS_1936_toulouse_offer_declined_notice:0 "邀请塔布验收对照：遭到拒绝"
 sof_region_TRS_1936_toulouse_offer_declined_notice_desc:0 "对方决定保留现有安排，本次合作提案结束。拒绝方不受惩罚，双方继续独立，可以另择时机商议新的条件。"
