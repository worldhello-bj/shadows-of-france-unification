l_simp_chinese:
 sof_ne_AMI_reconstruction:0 "重开皮卡第重建清册"
 sof_ne_AMI_reconstruction_desc:0 "许多村镇已经从战争中恢复，另一些地块和债务仍悬而未决。我们将重新打开重建清册，辨明哪些工程仍需完成、哪些旧账应当结清。"
 sof_ne_AMI_land_survey:0 "复核索姆土地与旧债"
 sof_ne_AMI_land_survey_desc:0 "索姆的田地、道路和借贷合同承载着不同的战后经历。以可靠的地籍和债务登记制定农业政策，让每类农户的实际处境进入预算。"
 sof_ne_AMI_rail_survey_bonus:0 "北方铁路站场清点"
 sof_ne_AMI_rail_survey:0 "北方铁路站场清点"
 sof_ne_AMI_rail_survey_desc:0 "北方铁路把皮卡第的田野、城镇与远方港口连在一起。我们将清点站场、仓库和运具，找出最值得先修复的转运环节。"
 sof_ne_AMI_civil_rights:0 "市镇重建责任听证"
 sof_ne_AMI_civil_rights_desc:0 "居民、债权人和市镇公开列明义务，制度主干不锁定某党。"
 sof_ne_AMI_peronne:0 "佩罗讷复耕与集散"
 sof_ne_AMI_peronne_desc:0 "复核当地土地状况，改善乡村补给。"
 sof_ne_AMI_tenants:0 "佃农与小业主仲裁"
 sof_ne_AMI_tenants_desc:0 "公开仲裁耕作合同，不指定执政党。"
 sof_ne_AMI_amiens_junction:0 "亚眠转运与仓储"
 sof_ne_AMI_amiens_junction_desc:0 "枢纽改善需要城市与整个州都在己方控制。"
 sof_ne_AMI_airframes_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_AMI_potez_access:0 "核定阿尔贝航空接入"
 sof_ne_AMI_potez_access_desc:0 "梅奥尔特的Potez工场需要阿尔贝一带可靠的工人、材料与交通接入。联络工程将把工场和周边城镇连接成一个能按时交货的航空生产区。"
 sof_ne_AMI_claims:0 "建立重建申诉窗口"
 sof_ne_AMI_claims_desc:0 "公开申诉期限与举证程序，不凭政治路线取消私人权利。"
 sof_ne_AMI_beet_bonus:0 "甜菜与谷物轮作"
 sof_ne_AMI_beet:0 "甜菜与谷物轮作"
 sof_ne_AMI_beet_desc:0 "依据地方农产结构推进加工与轮作，稳定农业供应和乡村收入。"
 sof_ne_AMI_coop:0 "农具合作采购"
 sof_ne_AMI_coop_desc:0 "集中农具采购换取规模与互助，军工投入承担机会成本。"
 sof_ne_AMI_rural_credit:0 "分散农业授信"
 sof_ne_AMI_rural_credit_desc:0 "分散信贷保留经营自主，需要额外监督。"
 sof_ne_AMI_loom_unlock_tt:0 "解锁一次性地方投资决议；须支付政治点数并保持指定州完全控制。"
 sof_ne_AMI_cosserat:0 "亚眠织机修复计划"
 sof_ne_AMI_cosserat_desc:0 "亚眠的织机仍是城市的重要财富。先把机器、动力和工人的技艺恢复起来，才能同时满足民用市场与制服、帆布等军需订单。"
 sof_ne_AMI_metal_shop_bonus:0 "航空夹具与量具"
 sof_ne_AMI_metal_shop:0 "航空夹具与量具"
 sof_ne_AMI_metal_shop_desc:0 "先训练工序和量具，再讨论机体产能。"
 sof_ne_AMI_minutes:0 "公布债务与修复账册"
 sof_ne_AMI_minutes_desc:0 "不同市镇可比较工程费用，不用同额补助掩盖差异。"
 sof_ne_AMI_agronomy_bonus:0 "农业合作技术课堂"
 sof_ne_AMI_agronomy:0 "农业合作技术课堂"
 sof_ne_AMI_agronomy_desc:0 "两种融资路线都需农业知识与设备维护。"
 sof_ne_AMI_cloth:0 "制服、帆布与民用布匹"
 sof_ne_AMI_cloth_desc:0 "军需布料与民用订单分账，纺织工序不冒充飞机工序。"
 sof_ne_AMI_air_workers:0 "航空熟练工训练"
 sof_ne_AMI_air_workers_desc:0 "培养熟练的航空工人，为机体制造、检验和维修建立技术队伍。"
 sof_ne_AMI_debt_rules:0 "共同重建债务规则"
 sof_ne_AMI_debt_rules_desc:0 "以公开程序核销地方债务，尊重全国选举确定的政治授权。"
 sof_ne_AMI_lille_offer:0 "向北方提请工料交换"
 sof_ne_AMI_lille_offer_desc:0 "里尔可拒绝；本国没有强迫煤炭或钢材交付的权力。"
 sof_ne_AMI_granaries:0 "乡村粮仓与收购时刻"
 sof_ne_AMI_granaries_desc:0 "蒙迪迪耶州乡村道路与收购运输改善，不创造现代化巨型粮仓。"
 sof_ne_AMI_beauvais:0 "博韦民用修理合作"
 sof_ne_AMI_beauvais_desc:0 "民用机具、交通和布料三项需求汇合后扩大有限维修产能。"
 sof_ne_AMI_civil_air_bonus:0 "优先民用机体维修"
 sof_ne_AMI_civil_air:0 "优先民用机体维修"
 sof_ne_AMI_civil_air_desc:0 "民用机体维修可以稳定工场收入，并给学徒提供循序渐进的训练。我们将把第一批工期留给维修与周转，再扩展更复杂的制造能力。"
 sof_ne_AMI_military_air_bonus:0 "优先军用试制订单"
 sof_ne_AMI_military_air:0 "优先军用试制订单"
 sof_ne_AMI_military_air_desc:0 "地区将建立自己的航空生产能力。军用试制订单将推动量具、夹具与熟练工训练，代价是部分民用维修需要延后。"
 sof_ne_AMI_regional_charter:0 "皮卡第重建章程"
 sof_ne_AMI_regional_charter_desc:0 "将土地、债务和市镇参与写入共同程序。"
 sof_ne_AMI_rouen_offer:0 "向鲁昂提请海陆联运"
 sof_ne_AMI_rouen_offer_desc:0 "采用独立邀请；不要求里尔一定接受。"
 sof_ne_AMI_abbeville:0 "阿布维尔集散道路"
 sof_ne_AMI_abbeville_desc:0 "西部农产接入铁路与沿海市场。"
 sof_ne_AMI_repair_credit_bonus:0 "区内设备修复清算"
 sof_ne_AMI_repair_credit:0 "区内设备修复清算"
 sof_ne_AMI_repair_credit_desc:0 "工程完成后，一次性核销地方修复账户，结算本轮建设成果。"
 sof_ne_AMI_air_quality:0 "阿尔贝机体质量验收"
 sof_ne_AMI_air_quality_desc:0 "民用与军用优先路线汇合到同一质量验收。"
 sof_ne_AMI_civic_recruiting:0 "市镇预备队登记"
 sof_ne_AMI_civic_recruiting_desc:0 "登记现有预备人员与民事责任，协调地方动员和日常生活。"
 sof_ne_AMI_own_freight_bonus:0 "采用区内货运备份"
 sof_ne_AMI_own_freight:0 "采用区内货运备份"
 sof_ne_AMI_own_freight_desc:0 "无论两方是否接受协商，境内交通整理均可继续。"
 sof_ne_AMI_farm_balance:0 "粮食与城镇消费契约"
 sof_ne_AMI_farm_balance_desc:0 "农业恢复与城镇就业形成真实的交叉汇合。"
 sof_ne_AMI_air_hall:0 "航空部件专门车间"
 sof_ne_AMI_air_hall_desc:0 "机体检验和材料工序已经成熟，新的专门车间可以承接航空部件订单。阿尔贝与梅奥尔特之间的联络将为这项扩建提供稳定支撑。"
 sof_ne_AMI_test_ground:0 "机体地面检验班"
 sof_ne_AMI_test_ground_desc:0 "试验和维修程序有别于直接交付作战飞机。"
 sof_ne_AMI_somme_bridges_bonus:0 "索姆河桥梁检查"
 sof_ne_AMI_somme_bridges:0 "索姆河桥梁检查"
 sof_ne_AMI_somme_bridges_desc:0 "索姆河交通将依靠常设调度与桥梁维护保持畅通。桥梁检查和替代通路调查将给民用车队与预备部队提供同一份可靠地图。"
 sof_ne_AMI_soissons:0 "苏瓦松后方分散仓库"
 sof_ne_AMI_soissons_desc:0 "为前方中断预留第二层运输与储备。"
 sof_ne_AMI_received_orders_bonus:0 "落实获准运输订单"
 sof_ne_AMI_received_orders:0 "落实获准运输订单"
 sof_ne_AMI_received_orders_desc:0 "只实施至少一方明确接受的订单。"
 sof_ne_AMI_artisan_training_bonus:0 "农业与工艺学校合作"
 sof_ne_AMI_artisan_training:0 "农业与工艺学校合作"
 sof_ne_AMI_artisan_training_desc:0 "保养农具、织机和乡村设施，限制为一次科研折扣。"
 sof_ne_AMI_airfield:0 "佩罗讷州飞行训练设施"
 sof_ne_AMI_airfield_desc:0 "扩建阿尔贝所在州的航空训练设施。"
 sof_ne_AMI_air_supply_bonus:0 "航空备件运输标准"
 sof_ne_AMI_air_supply:0 "航空备件运输标准"
 sof_ne_AMI_air_supply_desc:0 "将试验工序接入铁路与仓库，形成从材料运输到检验交付的完整联络。"
 sof_ne_AMI_reserve:0 "铁路后送轮值"
 sof_ne_AMI_reserve_desc:0 "地方军需时刻与后送程序配合。"
 sof_ne_AMI_clearing:0 "皮卡第货运共同清算"
 sof_ne_AMI_clearing_desc:0 "接受方案与自给方案在账册处汇合。"
 sof_ne_AMI_civil_air_defense:0 "亚眠设施防空"
 sof_ne_AMI_civil_air_defense_desc:0 "地面防空保护城市和铁路设施。"
 sof_ne_AMI_scout_training:0 "低空侦察协同课堂"
 sof_ne_AMI_scout_training_desc:0 "飞行员、前沿观察和铁路后送共同训练。"
 sof_ne_AMI_mobile_reserve:0 "机动后方救援队"
 sof_ne_AMI_mobile_reserve_desc:0 "有限兵力选择机动救援与增援。"
 sof_ne_AMI_entrenched:0 "固定交通节点防护"
 sof_ne_AMI_entrenched_desc:0 "加强圣康坦交通节点的陆堡防护，以现有道路与地形组织守备。"
 sof_ne_AMI_manual:0 "皮卡第陆空协同手册"
 sof_ne_AMI_manual_desc:0 "地面取向与航空观察在同一指挥接口汇合。"
 sof_ne_AMI_recovery_accounts:0 "汇总重建、工料与运输"
 sof_ne_AMI_recovery_accounts_desc:0 "编制全国整合所需的地方资产与债务。"
 sof_ne_AMI_unified_recovery:0 "统一后的皮卡第重建局"
 sof_ne_AMI_unified_recovery_desc:0 "完成全国统一程序后，落实地方恢复与共同治理。"
 sof_ne_AMI_land_records:0 "全国土地与旧债对账"
 sof_ne_AMI_land_records_desc:0 "地块修复责任保留可追溯记录。"
 sof_ne_AMI_rail_accounts_bonus:0 "全国铁路单证接口"
 sof_ne_AMI_rail_accounts:0 "全国铁路单证接口"
 sof_ne_AMI_rail_accounts_desc:0 "在共同国家建立后协调全国运输账户。"
 sof_ne_AMI_aircraft_standards_bonus:0 "统一机体部件采购"
 sof_ne_AMI_aircraft_standards:0 "统一机体部件采购"
 sof_ne_AMI_aircraft_standards_desc:0 "将地方成熟工序纳入全国采购，推动航空制造标准化。"
 sof_ne_AMI_army_handover:0 "统一陆空值勤名册"
 sof_ne_AMI_army_handover_desc:0 "移交已形成的指挥和训练程序。"
 sof_ne_AMI_reconstruction_settlement:0 "市镇重建结算完成"
 sof_ne_AMI_reconstruction_settlement_desc:0 "核销账册，不重复发放同一笔工程奖励。"
 sof_ne_AMI_technical_network_bonus:0 "皮卡第技术工序入网"
 sof_ne_AMI_technical_network:0 "皮卡第技术工序入网"
 sof_ne_AMI_technical_network_desc:0 "纺织、航空和维修课程纳入全国技术分工。"
 sof_ne_AMI_unification_mandate:0 "打开皮卡第统一走廊"
 sof_ne_AMI_unification_mandate_desc:0 "地方整军将为全国统一提供骨干。授权以本区为支点重建法国共同国家，解锁边境统一战役，并通过既有战役系统取得合法相邻目标的吞并战争目标。"
 sof_ne_AMI_picardy_in_france:0 "重建皮卡第，共建国家"
 sof_ne_AMI_picardy_in_france_desc:0 "重建土地、恢复城镇与发展航空终于汇入同一个国家计划。皮卡第的技术人员将获得更广阔的研究网络，把地方经验转化为全国能力。"
 sof_ne_AMI_land_board:0 "皮卡第重建清册"
 sof_ne_AMI_land_board_desc:0 "登记地块、旧债与道路修复责任。"
 sof_ne_AMI_cooperative:0 "农具合作采购"
 sof_ne_AMI_cooperative_desc:0 "民用恢复优先，占用部分军工投资能力。"
 sof_ne_AMI_credit:0 "分散农业信贷"
 sof_ne_AMI_credit_desc:0 "分散授信提高民用恢复速度，增加监督成本。"
 sof_ne_AMI_textile:0 "军需布料验收"
 sof_ne_AMI_textile_desc:0 "织机修理与布料规格形成有限工序收益。"
 sof_ne_AMI_commerce:0 "皮卡第腹地运输协定"
 sof_ne_AMI_commerce_desc:0 "双方同意后180天的货运协作。"
 sof_ne_AMI_integration:0 "统一后的皮卡第重建局"
 sof_ne_AMI_integration_desc:0 "全国核销地方重建责任与交通投入。"
 sof_ne_AMI_lille_accord:0 "北方煤料与皮卡第工序协作"
 sof_ne_AMI_lille_accord_desc:0 "双方按工料需求安排运输并减少待料损失。 双方接受后持续270天。"
 sof_ne_AMI_rouen_accord:0 "皮卡第港口出口信用"
 sof_ne_AMI_rouen_accord_desc:0 "民用工场与港口共同核验出口货单和信用。 双方接受后持续270天。"
 sof_ne_AMI_loom_local:0 "亚眠织机与布料网络"
 sof_ne_AMI_loom_local_desc:0 "以亚眠为行政联络中心，协调Cosserat纺织工场的设备与生产组织。"
 sof_ne_AMI_airframes_local:0 "阿尔贝—梅奥尔特航空联络"
 sof_ne_AMI_airframes_local_desc:0 "以阿尔贝（7395）为州内工序联络节点，连接周边航空制造与交通网络。"
 sof_ne_AMI_fields_local:0 "佩罗讷复耕与集散"
 sof_ne_AMI_fields_local_desc:0 "已清查土地和乡村补给网络，不假称全部战后损坏仍未修复。"
 sof_ne_AMI_junction_local:0 "亚眠铁路转运台"
 sof_ne_AMI_junction_local_desc:0 "协调站场调度与仓储转运。"
 sof_ne_AMI_soissons_local:0 "苏瓦松后方仓储"
 sof_ne_AMI_soissons_local_desc:0 "后方预备仓储与军民运输分流。"
 sof_ne_AMI_loom_decision:0 "支付亚眠织机检修合同"
 sof_ne_AMI_loom_decision_desc:0 "在军需转换前检修既有织机，执行一次。"
 sof_ne_AMI_airframes_decision:0 "支付阿尔贝—梅奥尔特联络工程"
 sof_ne_AMI_airframes_decision_desc:0 "完善阿尔贝地区交通与技术工人的联络，让地方航空工序稳定衔接。"
 sof_ne_AMI_local_investments:0 "亚眠：重建土地、铁路与机翼：地方工程"
