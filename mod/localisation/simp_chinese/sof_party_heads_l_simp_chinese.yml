l_simp_chinese:
 sof603_party_pcf_desc:0 "莫里斯·多列士领导法国共产党，以工人组织和议会活动推动党的政治纲领。"
 sof603_party_sfio_desc:0 "莱昂·布鲁姆领导SFIO的议会斗争，将劳动保障、社会改革与共和制度联系起来。"
 sof603_party_prrrs_desc:0 "爱德华·达拉第领导激进党，在世俗共和、公共改革与国家防务之间推进施政。"
 sof603_party_usr_desc:0 "约瑟夫·保罗-邦库尔代表社会主义共和联盟，以议会合作和集体安全推动国家建设。"
 sof603_party_pup_desc:0 "路易·塞利耶代表无产阶级统一党的工人政治传统，把地方组织与议会活动联系起来。"
 sof603_party_rg_ad_desc:0 "皮埃尔-艾蒂安·弗朗丹领导民主联盟，以共和秩序、经济政策和政府协调组织政治力量。"
 sof603_party_fr_urd_desc:0 "路易·马兰领导共和联盟，以议会保守派的组织基础推动国家防务与公共秩序议程。"
 sof603_party_pdp_desc:0 "奥古斯特·尚佩蒂耶·德里布领导人民民主党，以社会天主教传统参与共和政治与公共改革。"
 sof603_party_upr_desc:0 "欧仁·米勒领导阿尔萨斯人民共和联盟，将地方自治、宗教生活与区域代表权带入议会。"
 sof603_party_doriot_desc:0 "雅克·多里奥以圣但尼的地方政治基础组织自己的政治力量，在1936年的政局变化中寻求新的道路。"
